<!-- esc() y toast(), que estaban copiados en cada herramienta. Va ANTES del
     script de la pagina: son `const` de primer nivel y dos declaraciones del
     mismo nombre revientan la pagina entera. -->
<script src="/contracts/assets/dialogo.js?v=8197f360"></script>
<script src="/contracts/assets/suite-comun.js?v=7d904f26"></script>
<script>
/* ============================================================================
   Unidades — inventario y precios por parcela
   ----------------------------------------------------------------------------
   Reescrita el 31-jul-2026 sobre la capa compartida `suite.css` + `suite.js`,
   y es la implementación de REFERENCIA de ese patrón: tabla ancha centrada con
   cabecera pegada y orden por columna, y el detalle en un CAJÓN LATERAL que
   NO cambia de página — la lista sigue detrás, que es lo que se pidió.

   El desglose (modelo de villa, precio de suelo y de construcción) sale ahora
   en la tabla: es lo que hace que esta pantalla valga como tabla de precios
   consultable y no haga falta abrir el PDF del cliente.
   ========================================================================== */
const $ = s => document.querySelector(s);

const ESTADOS = [
  ['disponible','Disponible'], ['reservada','Reservada'], ['bloqueada','Bloqueada'],
  ['vendida','Vendida'], ['cobrada','Cobrada'], ['no_disponible','No disponible'],
];
/* TIPOS y PROYECTOS: catálogos reales (tablas `tipos_vivienda`/`proyectos`,
   6-ago-2026). Antes `TIPOS` era un array a mano y `proyecto` se derivaba de
   los valores ya guardados en `unidades` — sin ningún sitio donde darlos de
   alta. El fallback de abajo es solo para el primer pintado antes de que
   `cargar()` responda; en cuanto llega, se sustituye. */
let TIPOS = [['parcela','Parcela'],['villa','Villa'],['apartamento','Apartamento'],['local','Local']];
let PROYECTOS = [];
const nombreEstado = e => (ESTADOS.find(x => x[0] === e) || [e, e])[1];
const nombreTipo   = t => (TIPOS.find(x => x[0] === t) || [t, t])[1];
const fmtNum = n => n == null ? '' : n.toLocaleString('es-ES',{ minimumFractionDigits:n%1?2:0, maximumFractionDigits:2 });

/* Mitigación estándar de CSV/formula injection (OWASP): un valor que empieza
   por = + - @ o tab/CR se interpreta como fórmula al reabrir la celda en
   Excel/Sheets — el estudio ya reexporta estos datos a Excel (ver
   reference_excel_generator_lawang), así que una celda sembrada hoy dispara
   mañana en la máquina de quien exporte. Se antepone una comilla: el valor se
   sigue leyendo igual, deja de ejecutarse como fórmula. */
const antiFormula = s => {
  const v = String(s ?? '').replace(/[\t\r]/g, ' ').trim();
  return /^[=+\-@]/.test(v) ? "'" + v : v;
};

let SB=null, UNIDADES=[], CONTRATOS=[], MODELOS=[], SEL=null, FILTRO='', PROY='', CARGANDO=true, FALLO=null;
/* `?proyecto=` entra directo a ese proyecto. Lo usa el enlace de vuelta desde
   Documentacion (17-ago-2026): se salta de la documentacion al inventario del
   mismo proyecto sin volver a elegirlo. Entrar asi abre en TABLA y no en
   carpetas, porque quien llega con un proyecto en la URL ya eligio: enseñarle
   las carpetas seria pedirle que vuelva a hacer el clic que acaba de hacer. */
let PROY_URL = '';
try{ PROY_URL = new URLSearchParams(location.search).get('proyecto') || ''; }catch(_){}
// Borrar proyecto (12-ago-2026, petición del owner): "solo super_admin", más
// estricto que el es_admin() (admin+super_admin) que ya usa el resto de la
// suite — se guarda aparte, no se reutiliza CAN_EDIT_TEXT ni nada existente.
let ES_SUPER_ADMIN = false;

/* Qué se puede construir en cada parcela — decisión del cliente (31-jul): en
   Palm Field cabe CUALQUIERA de los dos modelos en CUALQUIER parcela. Así que el
   modelo NO es una propiedad del terreno, es la casa que elige el comprador.
   De la parcela son la superficie y el precio de suelo; del modelo, lo que
   cuesta construirlo. El total es la suma, y cambia si cambia la casa. */
const modelosDe   = proyecto => MODELOS.filter(m => m.proyecto === proyecto);
const precioModelo = (proyecto, modelo) => {
  const m = MODELOS.find(x => x.proyecto === proyecto && x.modelo === modelo);
  return m && m.precio_construccion != null ? Number(m.precio_construccion) : null;
};
const ORDEN = { campo:'codigo', dir:'asc' };

/* Qué valor ordena cada columna. Los importes salen como NÚMERO, no como el
   texto ya formateado: ordenar "130.875" como cadena lo pone debajo de "95.250",
   y una tabla que ordena mal deja de merecer confianza. */
const valorDe = (u, campo) => {
  if(['precio','precio_suelo','precio_construccion','superficie_m2'].includes(campo))
    return u[campo] == null ? null : Number(u[campo]);
  if(campo === 'estado') return nombreEstado(u.estado);
  return u[campo];
};

/* ---------- carga ---------- */
async function cargar(){
  CARGANDO = true; FALLO = null; pintar();
  const [u, c, m, p, t, dp] = await Promise.all([
    // `unidades_estado` es la vista que añade el contrato vinculado y lo
    // facturado (calculado, no guardado: guardarlo sería una tercera copia
    // que se queda vieja en cuanto se anule una factura).
    SB.from('unidades_estado').select('*').order('proyecto').order('codigo'),
    SB.from('contratos').select('id, numero, comprador_nombre').order('created_at', { ascending:false }),
    SB.from('modelos_villa').select('proyecto, modelo, precio_construccion, moneda').order('modelo'),
    SB.from('proyectos').select('nombre').eq('activo', true).order('nombre'),
    SB.from('tipos_vivienda').select('clave, etiqueta').eq('activo', true).order('etiqueta'),
    // La documentacion de cada proyecto va en la misma tanda: es una consulta
    // mas y evita que la carpeta se pinte dos veces (una sin la linea y otra
    // con ella), que es como se ven los saltos.
    SB.from('documentos_proyecto').select('proyecto').limit(2000),
  ]);
  CARGANDO = false;
  if(u.error){ FALLO = u.error.message; pintar(); return; }
  /* Se aplica DESPUES de cargar, cuando ya se sabe que proyectos existen: un
     nombre que no este se ignora y se ven todos, en vez de dejar la pantalla
     vacia sin explicar por que. Una sola vez — si luego se cambia de proyecto a
     mano, la URL no vuelve a imponerse. */
  if(PROY_URL){
    const hay = (p.data || []).some(x => x.nombre === PROY_URL)
             || (u.data || []).some(x => x.proyecto === PROY_URL);
    if(hay){ PROY = PROY_URL; vista('tabla'); }
    PROY_URL = '';
  }
  UNIDADES = u.data || [];
  CONTRATOS = c.error ? [] : (c.data || []);
  MODELOS   = m.error ? [] : (m.data || []);
  /* Sin permiso sobre documentacion se queda en null y la carpeta no pinta la
     linea, en vez de decir «sin documentacion» a quien simplemente no la ve. */
  if(dp.error){ DOCS_POR_PROYECTO = null; }
  else { DOCS_POR_PROYECTO = {};
         for(const d of dp.data || []){ const k = d.proyecto || '';
           DOCS_POR_PROYECTO[k] = (DOCS_POR_PROYECTO[k] || 0) + 1; } }
  // Sin permiso o con la tabla vacía se cae al fallback de arriba en vez de
  // dejar los desplegables en blanco.
  if(!p.error && p.data && p.data.length) PROYECTOS = p.data.map(x => x.nombre);
  if(!t.error && t.data && t.data.length) TIPOS = t.data.map(x => [x.clave, x.etiqueta]);
  // Unión defensiva: si una unidad quedó con un proyecto que ya no está en el
  // catálogo (borrado por error, o dato antiguo), sigue apareciendo en el
  // filtro — no desaparece de la vista, solo no se puede elegir para una
  // unidad nueva salvo que se dé de alta.
  const proyectosFiltro = [...new Set([...PROYECTOS, ...UNIDADES.map(x => x.proyecto)].filter(Boolean))].sort();
  $('#fProyecto').innerHTML = '<option value="">Todos los proyectos</option>' +
    proyectosFiltro.map(p => `<option value="${esc(p)}" ${p===PROY?'selected':''}>${esc(p)}</option>`).join('');
  pintar();
}

/* ---------- alta de proyecto/tipo desde el propio formulario ----------
   RLS: INSERT exige es_agente()+puede('unidades'); no hay UPDATE/DELETE para
   agentes (solo admin puede desactivar) — un catálogo existe para que no
   convivan "Palm Field" y "Palm Field " con espacio, y dejar editar/borrar lo
   que dio de alta otro agente reabre ese mismo problema. */
async function altaProyecto(nombreCrudo){
  const nombre = antiFormula(nombreCrudo);
  if(!nombre) return { ok:false, error:'El nombre no puede quedar vacío' };
  const { error } = await SB.from('proyectos').insert({ nombre });
  if(error){
    const msg = /duplicate key|proyectos_nombre_key/.test(error.message||'')
      ? 'Ya existe un proyecto con ese nombre.' : error.message;
    return { ok:false, error: msg };
  }
  PROYECTOS = [...new Set([...PROYECTOS, nombre])].sort();
  return { ok:true, nombre };
}
async function altaTipo(etiquetaCrudo){
  const etiqueta = antiFormula(etiquetaCrudo);
  if(!etiqueta) return { ok:false, error:'El nombre no puede quedar vacío' };
  // la clave es la etiqueta en minúsculas/sin acentos/espacios→guión: es lo
  // que guarda `unidades.tipo` (FK a tipos_vivienda.clave), la etiqueta es
  // solo lo que se lee en pantalla.
  const clave = etiqueta.normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  if(!clave) return { ok:false, error:'Ese nombre no da una clave válida' };
  const { error } = await SB.from('tipos_vivienda').insert({ clave, etiqueta });
  if(error){
    const msg = /duplicate key|tipos_vivienda_pkey/.test(error.message||'')
      ? 'Ya existe un tipo con esa clave.' : error.message;
    return { ok:false, error: msg };
  }
  TIPOS = [...TIPOS, [clave, etiqueta]];
  return { ok:true, clave, etiqueta };
}

function visibles(){
  const q = $('#q').value.trim().toLowerCase();
  const f = UNIDADES.filter(u =>
    (!FILTRO || u.estado === FILTRO) &&
    (!PROY || u.proyecto === PROY) &&
    (!q || [u.codigo, u.proyecto, u.modelo].some(v => String(v||'').toLowerCase().includes(q))));
  return suiOrdenar(f, ORDEN, valorDe);
}

/* ── vista: carpetas, tabla o rejilla ────────────────────────────────────
   Se recuerda por persona con el mismo mecanismo que la densidad (`localStorage`
   envuelto en try, porque en modo privado lanza). El `try` no es ceremonia: sin
   él, un navegador con el almacenamiento bloqueado dejaba la pantalla en blanco.
   Por defecto CARPETAS (11-ago, petición del owner — antes era tabla): esta
   herramienta pasa a llamarse Proyectos y entrar viendo las carpetas es lo que
   corresponde a ese nombre. Tabla/rejilla siguen siendo una elección, un clic
   más allá, para cuando lo que se busca es comparar precios dentro de un proyecto.
   Clave de localStorage renombrada (lawang_unidades_vista → lawang_proyectos_vista,
   mismo 11-ago): quien ya hubiera usado la herramienta tenía "tabla" guardado de
   antes de este cambio, y esa preferencia vieja ganaba siempre al nuevo default —
   la app parecía seguir entrando en Tabla aunque el código ya dijera Carpetas.

   17-ago-2026 · LA MEMORIA PASA A SER DE SESIÓN, no permanente. Renombrar la
   clave resolvió aquello una vez, pero no el fondo: en cuanto alguien elige
   Tabla, ENTRAR en Proyectos vuelve a ser entrar en una tabla para siempre, y el
   owner lo reporto otra vez hoy. Como dijo él: «si entras a proyectos lo que
   debes ver son las carpetas».

   Asi que abrir la herramienta es SIEMPRE carpetas —es lo que corresponde a su
   nombre y lo primero que se quiere ver: que proyectos hay— y la vista elegida
   se recuerda solo mientras dure la visita, que es cuando de verdad sirve: se
   entra en Tabla a comparar precios, se salta a un contrato y se vuelve, y sigue
   en Tabla. Al dia siguiente se vuelve a empezar por las carpetas.
   `sessionStorage` y no `localStorage`: es exactamente esa diferencia. */
let VISTA = 'carpetas';
function vista(v){
  if(v){ try{ sessionStorage.setItem('lawang_proyectos_vista', v); }catch(_){} }
  let x = v;
  if(!x){ try{ x = sessionStorage.getItem('lawang_proyectos_vista'); }catch(_){} }
  VISTA = ['rejilla','tabla'].includes(x) ? x : 'carpetas';
  document.querySelectorAll('[data-vista]').forEach(b =>
    b.classList.toggle('on', b.dataset.vista === VISTA));
  $('#caja-tabla').hidden = VISTA !== 'tabla';
  $('#rejilla').hidden    = VISTA !== 'rejilla';
  $('#carpetas').hidden   = VISTA !== 'carpetas';
  return VISTA;
}
$('#vista').addEventListener('click', e => {
  const b = e.target.closest('[data-vista]');
  if(b){
    if(b.dataset.vista !== 'carpetas') VISTA_ANTES_CARPETAS = b.dataset.vista;
    vista(b.dataset.vista); pintar();
  }
});

/* La rejilla NO repite ni el filtrado ni el orden: llama a `visibles()`, la misma
   función que la tabla. Es lo único que garantiza que las dos vistas enseñan
   exactamente el mismo conjunto — dos filtros paralelos habrían divergido en
   cuanto alguien añadiera un chip. */
function pintarRejilla(){
  const caja = $('#rejilla');
  /* Los TRES estados también aquí, y no delegados a la tabla: en modo rejilla la
     tabla está oculta, así que un «cargando», un error de RLS o un «no hay nada»
     se habrían quedado invisibles y la pantalla parecería vacía sin más. Es el
     mismo criterio que ya tiene esta herramienta escrito: cargando, vacío y error
     son tres cosas distintas y un vacío con cara de error manda a buscar un fallo
     que no existe. `grid-column:1/-1` para que ocupen la rejilla entera. */
  const ancho = h => `<div style="grid-column:1/-1">${h}</div>`;
  if(CARGANDO){
    caja.innerHTML = Array.from({length:6}, () =>
      '<div class="sui-ficha" style="cursor:default"><i class="sui-esq-i"></i></div>').join('');
    return;
  }
  if(FALLO){
    caja.innerHTML = ancho(`<div class="sui-error">No se pudo leer el inventario: ${esc(FALLO)}</div>`);
    return;
  }
  const vis = visibles();
  if(!vis.length){
    const filtrando = FILTRO || PROY || $('#q').value.trim();
    caja.innerHTML = ancho(`<div class="sui-nada">
      <b>${filtrando ? 'Ninguna unidad coincide' : 'Todavía no hay unidades'}</b>
      ${filtrando ? 'Prueba a quitar algún filtro.' : 'Créala con «+ Nueva unidad», o cárgalas de la tabla de precios del proyecto.'}
    </div>`);
    return;
  }
  const eur = (v, m) => v == null ? '—' : esc(fmtMoneda(Number(v), m || 'EUR'));
  caja.innerHTML = vis.map(u => `
    <button type="button" class="sui-ficha ${SEL===u.id?'sel':''}" data-id="${esc(u.id)}">
      <span class="sui-ficha-cab">
        <span class="clave">${esc(u.codigo)}</span>
        <span class="sui-tag e-${esc(u.estado)}">${esc(nombreEstado(u.estado))}</span>
      </span>
      <span class="sub">${esc(u.proyecto || 'sin proyecto')}${
        u.modelo ? ' · ' + esc(u.modelo) : (modelosDe(u.proyecto).length ? ' · sin modelo' : '')}</span>
      <span class="cifra">${eur(u.precio, u.moneda)}</span>
      <span class="pie">
        ${u.superficie_m2 != null ? '<span>' + esc(fmtNum(Number(u.superficie_m2))) + ' m²</span>' : ''}
        ${u.fase_masterplan ? '<span>Fase ' + esc(u.fase_masterplan) +
            (u.zona_masterplan ? ' · Zona ' + esc(u.zona_masterplan) : '') + '</span>' : ''}
        ${u.contrato_numero ? '<span>' + esc(u.contrato_numero) +
            (u.pct_cobrado != null ? ' · ' + u.pct_cobrado + '%' : '') + '</span>' : ''}
      </span>
    </button>`).join('');
}
/* Mismo destino que un clic en la fila de la tabla: el cajón. Delegación, para
   que valga con la rejilla repintada. */
$('#rejilla').addEventListener('click', e => {
  const f = e.target.closest('[data-id]');
  if(f) abrirUnidad(f.dataset.id);
});

/* Carpetas por proyecto — mismo patrón que Documentación (ramas()/dentroDe()
   sobre una columna de texto), adaptado: aquí no hace falta derivar rutas con
   `split('/')` porque `proyecto` YA es una columna plana, así que "la carpeta"
   es directamente agrupar por su valor. No es una tabla de carpetas nueva —
   tampoco lo es en Documentación. Abrir una carpeta = fijar el filtro de
   proyecto que YA existe y volver a la última vista de contenido (tabla o
   rejilla, nunca carpetas — si no, un clic no llevaría a ningún sitio). */
let VISTA_ANTES_CARPETAS = 'tabla';
/* Cuantos documentos tiene cada proyecto. 17-ago-2026, peticion del owner:
   «al final es lo mismo pero en dos sitios». No se fusionan las herramientas
   —son dos trabajos distintos: una responde que queda libre y a que precio, la
   otra donde esta el plano— pero desde la carpeta del proyecto se ve si tiene
   documentacion y se salta a ella de un clic.

   Solo se cuenta, no se listan: la carpeta es un resumen. Y se cuenta por
   `proyecto_id`, no por el nombre — desde hoy es el vinculo de verdad. */
let DOCS_POR_PROYECTO = null;   // lo rellena cargar(), en la misma tanda

function pintarCarpetas(){
  const caja = $('#carpetas');
  if(CARGANDO){
    caja.innerHTML = Array.from({length:4}, () =>
      '<div class="sui-ficha" style="cursor:default"><i class="sui-esq-i"></i></div>').join('');
    return;
  }
  if(FALLO){
    caja.innerHTML = `<div style="grid-column:1/-1"><div class="sui-error">No se pudo leer el inventario: ${esc(FALLO)}</div></div>`;
    return;
  }
  const nombres = [...new Set([...PROYECTOS, ...UNIDADES.map(u => u.proyecto)].filter(Boolean))].sort();
  if(!nombres.length){
    caja.innerHTML = `<div style="grid-column:1/-1"><div class="sui-nada"><b>Todavía no hay proyectos</b>Da de alta uno con «+ Nuevo proyecto», arriba.</div></div>`;
    return;
  }
  const eur = (v, m) => v == null ? '—' : esc(fmtMoneda(Number(v), m || 'EUR'));
  // div, no button: lleva botones dentro, y un button no puede anidar otro.
  // Borrar solo para super_admin (12-ago) — botón aparte del de editar, que
  // sigue abierto a admin+super_admin vía es_admin() dentro del RPC de rename.
  caja.innerHTML = nombres.map(nom => {
    const us = UNIDADES.filter(u => u.proyecto === nom);
    const libres = us.filter(u => u.estado === 'disponible').length;
    const cartera = us.reduce((a,u) => a + (Number(u.precio) || 0), 0);
    const m = (us[0] && us[0].moneda) || 'EUR';
    const btnBorrar = ES_SUPER_ADMIN
      ? `<button type="button" data-delproy="${esc(nom)}" title="Borrar proyecto" style="font-size:13px;border:none;background:none;cursor:pointer;padding:0 2px;vertical-align:middle">🗑️</button>`
      : '';
    /* La documentacion del proyecto: enlace directo a su herramienta ya
       filtrada. Si no tiene ninguno se dice tambien —que un proyecto no tenga
       documentacion es justo lo que no se veia desde ningun sitio: hoy son 20
       de 22—. El <a> lleva stopPropagation por delegacion (ver el listener de
       #carpetas): sin eso, pulsar el enlace abriria ademas la carpeta. */
    const nDocs = (DOCS_POR_PROYECTO || {})[nom];
    const docs = DOCS_POR_PROYECTO == null ? '' :
      `<a class="docs-proy" href="/documentacion/?proyecto=${encodeURIComponent(nom)}"
          title="Ver la documentación de ${esc(nom)}">${
        nDocs ? '📄 ' + nDocs + (nDocs === 1 ? ' documento' : ' documentos') : '📄 sin documentación'}</a>`;
    return `<div class="sui-ficha carpeta" data-proy="${esc(nom)}" style="cursor:pointer">
      <span class="n">📁 ${esc(nom)} <button type="button" data-editproy="${esc(nom)}" title="Editar nombre" style="font-size:13px;border:none;background:none;cursor:pointer;padding:0 2px;vertical-align:middle">✏️</button>${btnBorrar}</span>
      <span class="sub">${us.length} ${us.length===1?'unidad':'unidades'} · ${libres} disponibles${us.length?' · ' + eur(cartera, m):''}</span>
      ${docs}
    </div>`;
  }).join('');
}
$('#carpetas').addEventListener('click', e => {
  // El enlace a Documentacion navega y ya: si se dejara seguir, ademas abriria
  // la carpeta y el usuario acabaria en Documentacion con la tabla detras.
  if(e.target.closest('.docs-proy')) return;
  const ed = e.target.closest('[data-editproy]');
  if(ed){ editarProyecto(ed.dataset.editproy); return; }
  const del = e.target.closest('[data-delproy]');
  if(del){ borrarProyecto(del.dataset.delproy); return; }
  const f = e.target.closest('[data-proy]'); if(!f) return;
  PROY = f.dataset.proy;
  $('#fProyecto').value = PROY;
  vista(VISTA_ANTES_CARPETAS === 'carpetas' ? 'tabla' : VISTA_ANTES_CARPETAS);
  pintar();
});
/* Editar/renombrar carpeta (11-ago): `proyecto`/`proyecto_nombre` es texto
   libre en 5 tablas más (ver renombrar_proyecto.sql) — el rename es un RPC
   SECURITY DEFINER que hace el cascade atómico y solo lo puede ejecutar un
   admin (gate es_admin() dentro de la función). Antes de pedir confirmación
   se cuenta el radio de impacto real, para no pedirle a nadie que confirme a
   ciegas cuántas filas va a tocar. */
async function editarProyecto(nombreActual){
  const nuevo = antiFormula((prompt(`Nuevo nombre para "${nombreActual}":`, nombreActual) || '').trim());
  if(!nuevo || nuevo === nombreActual) return;
  const cuenta = (tabla, columna) => SB.from(tabla).select('id', { count:'exact', head:true }).eq(columna, nombreActual);
  const [uds, con, fac, doc, mod] = await Promise.all([
    cuenta('unidades', 'proyecto'), cuenta('contratos', 'proyecto_nombre'),
    cuenta('facturas', 'proyecto_nombre'), cuenta('documentos_proyecto', 'proyecto'),
    cuenta('modelos_villa', 'proyecto'),
  ]);
  const radio = [
    uds.count ? `${uds.count} unidad(es)` : '', con.count ? `${con.count} contrato(s)` : '',
    fac.count ? `${fac.count} factura(s)` : '', doc.count ? `${doc.count} documento(s)` : '',
    mod.count ? `${mod.count} modelo(s) de villa` : '',
  ].filter(Boolean).join(', ');
  const aviso = radio ? `Se actualizará en: ${radio}.\n\n` : 'No hay nada vinculado a este nombre todavía.\n\n';
  const ok = await lwConfirmar({
    titulo: `Renombrar «${nombreActual}» a «${nuevo}»`,
    cuerpo: (aviso ? `<p>${aviso}</p>` : '')
      + '<p>Si este proyecto aparece en <b>contracts/tokens.json</b> (proyecto_nombre, parcelaPorProyecto, resortPorProyecto), ese archivo <b>no se actualiza solo</b> y hay que tocarlo a mano.</p>',
    confirmar: 'Renombrar',
  });
  if(!ok) return;
  const { error } = await SB.rpc('renombrar_proyecto', { p_antiguo: nombreActual, p_nuevo: nuevo });
  if(error){ toast('No se pudo renombrar: ' + error.message); return; }
  toast('Proyecto renombrado');
  if(PROY === nombreActual) PROY = nuevo;
  cargar();
}

/* Borrar carpeta (12-ago-2026, petición del owner: "solo super_admin").
   El botón ya solo lo ve un super_admin (pintarCarpetas), pero el gate real
   es el RPC — es_super_admin() dentro de borrar_proyecto(), no esta UI.
   El propio RPC rechaza el borrado si quedan unidades, modelos de villa o
   documentos colgando de este nombre (se orfanarían de verdad, nadie podría
   volver a filtrarlos ni asociarlos); contratos/facturas NO bloquean —
   proyecto_nombre ahí es una foto impresa en su momento, no una consulta en
   vivo, así que borrar el catálogo no les rompe nada. Se muestran igual en
   el aviso, para que quien borra sepa que ese nombre sigue impreso en ellos. */
async function borrarProyecto(nombre){
  const cuenta = (tabla, columna) => SB.from(tabla).select('id', { count:'exact', head:true }).eq(columna, nombre);
  const [con, fac] = await Promise.all([
    cuenta('contratos', 'proyecto_nombre'), cuenta('facturas', 'proyecto_nombre'),
  ]);
  const impreso = [con.count ? `${con.count} contrato(s)` : '', fac.count ? `${fac.count} factura(s)` : '']
    .filter(Boolean).join(', ');
  const aviso = impreso ? `Sigue impreso en: ${impreso} (no se toca, son documentos ya emitidos).\n\n` : '';
  const ok = await lwConfirmar({
    titulo: `Borrar el proyecto «${nombre}» del catálogo`,
    cuerpo: (aviso ? `<p>${aviso}</p>` : '')
      + '<p>Solo se puede si no tiene unidades, modelos de villa ni documentos subidos. Si tiene algo, el sistema lo rechaza y dice qué queda por vaciar.</p>',
    confirmar: 'Borrar el proyecto',
    tono: 'peligro',
  });
  if(!ok) return;
  const { error } = await SB.rpc('borrar_proyecto', { p_nombre: nombre });
  if(error){ toast('No se pudo borrar: ' + error.message); return; }
  toast('Proyecto borrado');
  if(PROY === nombre) PROY = '';
  cargar();
}

function pintar(){ pintarFiltros(); pintarTabla(); pintarRejilla(); pintarCarpetas(); }

function pintarFiltros(){
  const base = UNIDADES.filter(u => !PROY || u.proyecto === PROY);
  const n = e => base.filter(u => !e || u.estado === e).length;
  $('#filtros').innerHTML =
    `<button class="sui-chip ${FILTRO===''?'on':''}" data-f="">Todas<span class="n">${n('')}</span></button>` +
    ESTADOS.map(([v,l]) => `<button class="sui-chip ${FILTRO===v?'on':''} ${n(v)?'':'vacio'}" data-f="${v}">${l}<span class="n">${n(v)}</span></button>`).join('');
}

function pintarTabla(){
  const cuerpo = $('#filas');
  if(CARGANDO){
    // Esqueleto, no un "Cargando…": mantiene el alto de la tabla y evita el
    // salto de página cuando llegan las filas.
    cuerpo.innerHTML = Array.from({length:6}, () =>
      '<tr class="sui-esqueleto">' + '<td><i></i></td>'.repeat(9) + '</tr>').join('');
    $('#resumen').innerHTML = ''; return;
  }
  if(FALLO){
    cuerpo.innerHTML = `<tr><td colspan="9" class="sui-error">No se pudo leer el inventario: ${esc(FALLO)}</td></tr>`;
    $('#resumen').innerHTML = ''; return;
  }
  const vis = visibles();
  if(!vis.length){
    const filtrando = FILTRO || PROY || $('#q').value.trim();
    cuerpo.innerHTML = `<tr><td colspan="9"><div class="sui-nada">
      <b>${filtrando ? 'Ninguna unidad coincide' : 'Todavía no hay unidades'}</b>
      ${filtrando ? 'Prueba a quitar algún filtro.' : 'Créala con «+ Nueva unidad», o cárgalas de la tabla de precios del proyecto.'}
    </div></td></tr>`;
    $('#resumen').innerHTML = ''; return;
  }
  const eur = (v, m) => v == null ? '<span class="flojo">—</span>' : esc(fmtMoneda(Number(v), m || 'EUR'));
  cuerpo.innerHTML = vis.map(u => `
    <tr data-id="${esc(u.id)}" class="${SEL===u.id?'sel':''}">
      <td class="clave">${esc(u.codigo)}</td>
      <td>${esc(u.proyecto || '—')}</td>
      <td>${u.fase_masterplan ? esc(u.fase_masterplan) : '<span class="flojo">—</span>'}</td>
      <td>${u.zona_masterplan ? esc(u.zona_masterplan) : '<span class="flojo">—</span>'}</td>
      <td>${u.modelo ? esc(u.modelo)
            : '<span class="flojo">' + (modelosDe(u.proyecto).length ? 'sin decidir' : esc(nombreTipo(u.tipo))) + '</span>'}</td>
      <td class="num">${u.superficie_m2 == null ? '<span class="flojo">—</span>' : esc(fmtNum(Number(u.superficie_m2)))}</td>
      <td class="num">${eur(u.precio_suelo, u.moneda)}</td>
      <td class="num">${eur(u.precio_construccion, u.moneda)}</td>
      <td class="num"><b>${eur(u.precio, u.moneda)}</b></td>
      <td>${u.contrato_numero
            ? '<span class="clave">' + esc(u.contrato_numero) + '</span>'
              + (u.pct_cobrado != null ? ' <span class="flojo">' + u.pct_cobrado + '%</span>' : '')
            : '<span class="flojo">—</span>'}</td>
      <td><span class="sui-tag e-${esc(u.estado)}">${esc(nombreEstado(u.estado))}</span></td>
    </tr>`).join('');

  // Totales de LO QUE SE ESTÁ VIENDO. Con un filtro puesto, la suma de todo el
  // inventario no dice nada de lo que hay delante.
  const suma = k => vis.reduce((a,u) => a + (Number(u[k]) || 0), 0);
  const m = vis[0].moneda || 'EUR';
  const libres = vis.filter(u => u.estado === 'disponible').length;
  // Las parcelas sin modelo decidido NO tienen total, así que suman 0 a la
  // cartera. Se dice cuántas son: si no, la cifra parece que ha bajado sola y
  // nadie sabe por qué.
  const sinModelo = vis.filter(u => !u.modelo).length;
  $('#resumen').innerHTML =
    `<span>${vis.length} ${vis.length===1?'unidad':'unidades'} · <b>${libres}</b> disponibles</span>
     <span>Suelo <b>${esc(fmtMoneda(suma('precio_suelo'), m))}</b></span>
     <span>Construcción <b>${esc(fmtMoneda(suma('precio_construccion'), m))}</b></span>
     <span>Cartera <b>${esc(fmtMoneda(suma('precio'), m))}</b>${
       sinModelo ? ` <span class="flojo">(${sinModelo} sin modelo, sin total)</span>` : ''}</span>`;
}

/* ---------- cajón: ficha de la unidad ---------- */
function abrirUnidad(id){
  const nueva = id === 'nueva';
  const u = nueva ? { estado:'disponible', tipo:'parcela', moneda:'EUR' } : UNIDADES.find(x => x.id === id);
  if(!u) return;
  SEL = id; pintar();   // las DOS vistas: en rejilla la selección también se marca

  const desglose = (u.precio_suelo != null || u.precio_construccion != null) ? `
    <div class="sui-bloque">
      <h3>Desglose de precio</h3>
      <dl class="sui-dl" style="margin:0">
        <dt>Suelo</dt><dd>${u.precio_suelo != null ? esc(fmtMoneda(Number(u.precio_suelo), u.moneda||'EUR')) : '—'}</dd>
        <dt>Construcción</dt><dd>${u.precio_construccion != null ? esc(fmtMoneda(Number(u.precio_construccion), u.moneda||'EUR')) : '—'}</dd>
      </dl>
      <div class="sui-total"><span>Total</span><span>${u.precio != null ? esc(fmtMoneda(Number(u.precio), u.moneda||'EUR')) : '—'}</span></div>
      ${(u.precio != null && u.precio_suelo != null && u.precio_construccion != null
         && Math.abs(Number(u.precio) - Number(u.precio_suelo) - Number(u.precio_construccion)) > 0.5)
        ? '<p class="aviso">El total no cuadra con suelo + construcción. Revisa cuál de los tres es el bueno.</p>' : ''}
    </div>` : '';

  /* Lo que el contrato ha traído a esta unidad. Es de solo lectura a propósito:
     el vínculo lo pone el contrato al guardarse (trigger en la base), no una
     persona desde aquí. Si se pudiera cambiar en los dos sitios, en cuanto no
     coincidieran no habría forma de saber cuál manda. */
  const operacion = (!nueva && u.contrato_numero) ? `
    <div class="sui-bloque">
      <h3>Operación</h3>
      <dl class="sui-dl" style="margin:0">
        <dt>Contrato</dt><dd><a class="enl" href="/operaciones/?contrato=${encodeURIComponent(u.contrato_id)}">${esc(u.contrato_numero)}</a>${u.contrato_firmado ? ' · firmado' : ' · sin firmar'}</dd>
        ${u.comprador_nombre ? `<dt>Comprador</dt><dd>${esc(u.comprador_nombre)}</dd>` : ''}
        <!-- «de esta unidad» no es un adorno (19-ago-2026): con un contrato de
             varias parcelas, esta cifra es LA PARTE de esta unidad, no el
             total cobrado del contrato. Sin decirlo, quien lo lee suma dos
             veces el mismo dinero — que es justo el fallo que se acaba de
             corregir en la vista unidades_estado (sin comillas invertidas a
             propósito: este comentario vive DENTRO de una plantilla de texto y
             un backtick la cierra antes de tiempo). El total de la operación
             está en Operaciones, a un clic de aquí. -->
        <dt>Cobrado de esta unidad</dt><dd>${esc(fmtMoneda(Number(u.facturado||0), u.moneda||'EUR'))}${
          u.pct_cobrado != null ? ' · ' + u.pct_cobrado + '%' : ''}${
          ' <span class="flojo">(su parte del contrato)</span>'}</dd>
      </dl>
      ${u.pct_cobrado != null ? `<div class="barra"><i style="width:${Math.min(100, u.pct_cobrado)}%"></i></div>` : ''}
      <p class="sui-nota">El estado lo lleva el contrato y el dinero, no una persona: una Carta de Reserva
        deja la parcela <b>reservada</b> (firmarla no la mueve); un Bloqueo de Parcela firmado la deja
        <b>bloqueada</b>; el primer recibí real la pasa a <b>vendida</b>, y el 100% cobrado a <b>cobrada</b>.
        Si se le quita la parcela al contrato o se borra, vuelve a disponible sola.</p>
    </div>` : '';

  suiAbrirCajon({
    titulo: nueva ? 'Nueva unidad' : esc(u.codigo),
    sub: nueva ? 'El código es el mismo texto que imprime el contrato.'
               : esc(u.proyecto || 'sin proyecto') + ' · ' + esc(nombreEstado(u.estado)),
    cuerpo: operacion + desglose + `
      <div class="campo"><label for="f-codigo">Código</label>
        <input id="f-codigo" value="${esc(u.codigo||'')}" placeholder="Ej. A12"></div>
      <p class="sui-nota" style="margin-top:-6px">Debe coincidir con el que se escribe en el contrato: es lo que permite cruzarlos.</p>
      <div class="dos">
        <div class="campo"><label for="f-proyecto">Proyecto</label>
          <select id="f-proyecto">
            <option value="">— elegir —</option>
            ${[...new Set([...PROYECTOS, u.proyecto].filter(Boolean))].sort().map(p =>
              `<option value="${esc(p)}" ${u.proyecto===p?'selected':''}>${esc(p)}</option>`).join('')}
            <option value="__nuevo__">+ Nuevo proyecto…</option>
          </select>
          <div class="nuevo-cat" id="nuevoProyectoBox" hidden>
            <input id="f-proyecto-nuevo" placeholder="Nombre del proyecto">
            <button type="button" class="sui-btn" id="btnAltaProyecto">Añadir</button>
          </div>
        </div>
        <div class="campo"><label for="f-tipo">Tipo</label>
          <select id="f-tipo">
            ${TIPOS.map(([v,l])=>`<option value="${v}" ${u.tipo===v?'selected':''}>${l}</option>`).join('')}
            <option value="__nuevo__">+ Nuevo tipo…</option>
          </select>
          <div class="nuevo-cat" id="nuevoTipoBox" hidden>
            <input id="f-tipo-nuevo" placeholder="Nombre del tipo">
            <button type="button" class="sui-btn" id="btnAltaTipo">Añadir</button>
          </div>
        </div>
      </div>
      <div class="dos">
        <div class="campo"><label for="f-modelo">Modelo de villa</label>
          ${modelosDe(u.proyecto).length
            ? `<select id="f-modelo">
                 <option value="">— sin decidir —</option>
                 ${modelosDe(u.proyecto).map(m => `<option value="${esc(m.modelo)}" ${u.modelo===m.modelo?'selected':''}>${
                     esc(m.modelo)}${m.precio_construccion != null ? ' · ' + fmtNum(Number(m.precio_construccion)) + ' ' + (m.moneda||'EUR') : ''}</option>`).join('')}
                 ${u.modelo && !modelosDe(u.proyecto).some(m => m.modelo === u.modelo)
                   ? `<option value="${esc(u.modelo)}" selected>${esc(u.modelo)} · fuera del catálogo</option>` : ''}
               </select>`
            : `<input id="f-modelo" value="${esc(u.modelo||'')}" placeholder="Dune, Dream…">`}
        </div>
        <div class="campo"><label for="f-sup">Superficie (m²)</label><input id="f-sup" inputmode="decimal" value="${esc(u.superficie_m2||'')}"></div>
      </div>
      ${u.proyecto === 'Sumba Hills' ? `
      <div class="dos">
        <div class="campo"><label for="f-fase">Fase (masterplan)</label><input id="f-fase" value="${esc(u.fase_masterplan||'')}" placeholder="I, II…"></div>
        <div class="campo"><label for="f-zona">Zona</label><input id="f-zona" value="${esc(u.zona_masterplan||'')}" placeholder="1, 2, 3…"></div>
      </div>` : ''}
      <div id="escenarios"></div>
      <div class="dos">
        <div class="campo"><label for="f-suelo">Precio de suelo</label><input id="f-suelo" inputmode="decimal" value="${u.precio_suelo!=null?esc(fmtNum(Number(u.precio_suelo))):''}"></div>
        <div class="campo"><label for="f-obra">Precio de construcción</label><input id="f-obra" inputmode="decimal" value="${u.precio_construccion!=null?esc(fmtNum(Number(u.precio_construccion))):''}"></div>
      </div>
      <div class="dos">
        <div class="campo"><label for="f-precio">Precio total</label><input id="f-precio" inputmode="decimal" value="${u.precio!=null?esc(fmtNum(Number(u.precio))):''}"></div>
        <div class="campo"><label for="f-moneda">Moneda</label><select id="f-moneda">${['EUR','USD','AUD','IDR'].map(x=>`<option ${u.moneda===x?'selected':''}>${x}</option>`).join('')}</select></div>
      </div>
      ${u.contrato_id ? `
        <div class="campo"><label>Estado</label>
          <input value="${esc(nombreEstado(u.estado))} · lo lleva el contrato" readonly
                 style="background:var(--sup-2);color:var(--texto-2);cursor:not-allowed"></div>
        <div class="campo"><label>Contrato asociado</label>
          <input value="${esc(u.contrato_numero || 'vinculado')}" readonly
                 style="background:var(--sup-2);color:var(--texto-2);cursor:not-allowed"></div>
        <p class="aviso">Esta parcela está vinculada a un contrato, así que su estado y su contrato
          <b>no se tocan desde aquí</b>: los lleva el contrato. Para soltarla, quítale la parcela al
          contrato o bórralo, y volverá a estar disponible sola.</p>`
      : `
        <div class="campo"><label for="f-estado">Estado</label>
          <select id="f-estado">${ESTADOS.map(([v,l])=>`<option value="${v}" ${u.estado===v?'selected':''}>${l}</option>`).join('')}</select></div>
        <div class="campo"><label for="f-contrato">Contrato asociado</label>
          <select id="f-contrato"><option value="">— sin contrato —</option>
            ${CONTRATOS.map(c=>`<option value="${esc(c.id)}" ${u.contrato_id===c.id?'selected':''}>${esc(c.numero||'sin nº')} — ${esc(c.comprador_nombre||'sin nombre')}</option>`).join('')}
          </select></div>
        <div id="avisoEstado"></div>`}
      <div class="campo"><label for="f-notas">Notas</label><textarea id="f-notas">${esc(u.notas||'')}</textarea></div>`,
    pie: `<button class="sui-btn primario" id="btnGuardar">${nueva ? 'Crear unidad' : 'Guardar cambios'}</button>
          <button class="sui-btn" id="btnCerrar">Cerrar</button>`,
    onCerrar: () => { SEL = null; pintar(); },
  });

  // "+ Nuevo proyecto…"/"+ Nuevo tipo…": el mismo patrón para los dos —
  // seleccionarlo revela un campo de texto; al confirmar, se da de alta en el
  // catálogo y el select queda con la entrada nueva ya elegida.
  const wireNuevoCat = (selId, boxId, inputId, btnId, altaFn, refrescarSelect) => {
    const sel = $(selId), box = $(boxId), input = $(inputId), btn = $(btnId);
    sel.addEventListener('change', () => { box.hidden = sel.value !== '__nuevo__'; if(!box.hidden) input.focus(); });
    const confirmar = async () => {
      const nombre = input.value.trim();
      if(!nombre){ toast('Escribe un nombre'); return; }
      btn.disabled = true;
      const r = await altaFn(nombre);
      btn.disabled = false;
      if(!r.ok){ toast(r.error); return; }
      refrescarSelect(sel, r);
      box.hidden = true; input.value = '';
      toast('Añadido');
    };
    btn.addEventListener('click', confirmar);
    input.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); confirmar(); } });
  };
  wireNuevoCat('#f-proyecto', '#nuevoProyectoBox', '#f-proyecto-nuevo', '#btnAltaProyecto', altaProyecto, (sel, r) => {
    const o = document.createElement('option'); o.value = r.nombre; o.textContent = r.nombre;
    sel.insertBefore(o, sel.lastElementChild); sel.value = r.nombre;
  });
  wireNuevoCat('#f-tipo', '#nuevoTipoBox', '#f-tipo-nuevo', '#btnAltaTipo', altaTipo, (sel, r) => {
    const o = document.createElement('option'); o.value = r.clave; o.textContent = r.etiqueta;
    sel.insertBefore(o, sel.lastElementChild); sel.value = r.clave;
  });

  // Estos dos campos solo existen si la parcela NO está vinculada (ver arriba):
  // con contrato son de solo lectura y no hay nada de lo que avisar.
  if($('#f-estado')){
    avisoEstado();
    $('#f-estado').addEventListener('change', avisoEstado);
    $('#f-contrato').addEventListener('change', avisoEstado);
  }
  // Suelo + construcción rellenan el total mientras esté vacío o cuadre: es la
  // suma que hace el propio cliente en su tabla, y tecleada dos veces se
  // desincroniza. Si alguien pone un total distinto a mano, se respeta.
  const suma = () => {
    const s = parseImporte($('#f-suelo').value), o = parseImporte($('#f-obra').value);
    const t = $('#f-precio'), actual = parseImporte(t.value);
    // Sin construcción NO se rellena el total. Con el modelo sin decidir, el
    // total sería solo el suelo (36.875 € en una parcela que de verdad cuesta
    // entre 95.000 y 131.000), y esa cifra puesta en la columna «Total» es la
    // que alguien acaba diciendo en voz alta delante de un comprador.
    if(!o) return;
    if(!s && !o) return;
    if(!actual || Math.abs(actual - (t._auto||0)) < 0.5){ t.value = fmtNum(s + o); t._auto = s + o; }
  };
  // El suelo y la superficie también mueven las cifras del bloque de escenarios,
  // así que lo repintan: si no, cambiar el suelo dejaba arriba los totales viejos.
  $('#f-suelo').addEventListener('input', () => { suma(); pintarEscenarios(u); });
  $('#f-obra').addEventListener('input', suma);
  $('#f-sup').addEventListener('input', () => pintarEscenarios(u));
  pintarEscenarios(u);   // estado inicial

  /* Cambiar de modelo trae su precio de construcción del catálogo y rehace el
     total. Se hace aquí y no al guardar para que el comercial VEA el número
     antes de decidir: es el caso de uso entero («¿y si le pongo la Dune?»).
     El precio se puede pisar a mano después — el catálogo es el punto de
     partida, no una jaula. */
  const selModelo = $('#f-modelo');
  if(selModelo && selModelo.tagName === 'SELECT'){
    selModelo.addEventListener('change', () => {
      /* Volver a «sin decidir» TIENE que vaciar la construcción y el total.
         Antes se salía sin hacer nada y quedaba el precio del modelo anterior:
         una parcela marcada como sin decidir seguía diciendo 130.875 €, que es
         el precio de una Dream. Un total que da por supuesto un modelo que ya
         no está elegido es peor que no tener total. Los dos escenarios siguen
         a la vista arriba, así que no se pierde la información. */
      if(!selModelo.value){
        $('#f-obra').value = '';
        $('#f-precio').value = '';
        $('#f-precio')._auto = 0;
        pintarEscenarios(u);
        toast('Sin modelo: la construcción y el total quedan sin fijar');
        return;
      }
      const p = precioModelo(u.proyecto, selModelo.value);
      if(p == null) return;   // modelo fuera del catálogo: se respeta lo que haya
      $('#f-obra').value = fmtNum(p);
      const s = parseImporte($('#f-suelo').value) || 0;
      $('#f-precio').value = fmtNum(s + p);
      $('#f-precio')._auto = s + p;
      pintarEscenarios(u);
      toast('Precio recalculado para ' + selModelo.value);
    });
  }
  $('#btnGuardar').addEventListener('click', () => guardar(nueva ? null : u.id));
  $('#btnCerrar').addEventListener('click', suiCerrarCajon);
}

/* Qué costaría esta parcela con CADA modelo. Es la consecuencia directa de que
   se pueda construir cualquiera de los dos en cualquier sitio: el comercial que
   la enseña necesita las dos cifras a la vez, no la del modelo que alguien
   apuntó al cargar la tabla. El suelo no cambia; solo la construcción. */
/* 🔴 Este bloque se pintaba UNA vez al abrir el cajón y se quedaba congelado.
   Al poner el modelo en «sin decidir» los campos se vaciaban bien, pero aquí
   arriba seguía diciendo «Dream · elegido · 130.875,00 EUR»: los campos decían
   una cosa y el resumen otra, y el que manda a la vista es el resumen. Ahora se
   repinta con cada cambio, y lee el modelo y el suelo DEL FORMULARIO, no de la
   fila guardada — si no, tampoco seguiría a quien cambia el precio de suelo. */
function pintarEscenarios(u){
  const caja = $('#escenarios'); if(!caja) return;
  const ms = modelosDe(u.proyecto);
  const campoSuelo = $('#f-suelo'), campoModelo = $('#f-modelo');
  const suelo = campoSuelo ? (parseImporte(campoSuelo.value) || 0) : Number(u.precio_suelo || 0);
  const elegido = campoModelo ? campoModelo.value : u.modelo;
  if(ms.length < 2 || !suelo){ caja.innerHTML = ''; return; }
  const m = (($('#f-moneda') || {}).value) || u.moneda || 'EUR';
  const m2 = $('#f-sup') ? parseImporte($('#f-sup').value) : Number(u.superficie_m2 || 0);
  caja.innerHTML = `<div class="sui-bloque">
    <h3>Precio según el modelo</h3>
    ${ms.map(x => {
      const c = x.precio_construccion != null ? Number(x.precio_construccion) : null;
      return `<div class="sui-total" style="border:none;margin:0;padding:3px 0;font-weight:400">
        <span>${esc(x.modelo)}${elegido === x.modelo ? ' <b>· elegido</b>' : ''}</span>
        <span>${c == null ? '<span class="flojo">sin precio</span>' : '<b>' + esc(fmtMoneda(suelo + c, m)) + '</b>'}</span>
      </div>`;
    }).join('')}
    <p class="sui-nota">${elegido
      ? 'Suelo ' + esc(fmtMoneda(suelo, m)) + (m2 ? ' · ' + fmtNum(m2) + ' m²' : '') +
        '. Lo que cambia entre modelos es la construcción; el suelo es de la parcela.'
      : '<b>Sin modelo decidido</b>: esta parcela no tiene total. Arriba están las dos posibilidades; ' +
        'el suelo (' + esc(fmtMoneda(suelo, m)) + ') es lo único fijo.'}</p>
  </div>`;
}

/* El aviso es el guardia: dice en voz alta lo que la base de datos no puede
   saber (que ESTA unidad ya está comprometida con OTRO contrato). */
function avisoEstado(){
  if(!$('#f-estado') || !$('#f-contrato')) return;
  const est = $('#f-estado').value, cid = $('#f-contrato').value;
  const otras = UNIDADES.filter(u => u.contrato_id && u.contrato_id === cid && u.id !== SEL);
  const msgs = [];
  if((est === 'vendida' || est === 'reservada') && !cid)
    msgs.push('Marcada como ' + nombreEstado(est).toLowerCase() + ' pero sin contrato asociado: no se podrá saber de quién es.');
  if(otras.length)
    msgs.push('Ese contrato ya está asociado a ' + otras.map(o=>o.codigo).join(', ') + '. Si no es una operación de varias unidades, revísalo.');
  $('#avisoEstado').innerHTML = msgs.length ? `<p class="aviso">${msgs.map(esc).join('<br>')}</p>` : '';
}

async function guardar(id){
  const codigo = $('#f-codigo').value.trim();
  if(!codigo){ toast('El código no puede quedar vacío'); return; }
  const proyecto = $('#f-proyecto').value.trim();
  if(!proyecto || proyecto === '__nuevo__'){ toast('Elige un proyecto (o da uno de alta con «+ Nuevo proyecto…»)'); return; }
  if($('#f-tipo').value === '__nuevo__'){ toast('Da de alta el tipo nuevo antes de guardar'); return; }
  const num = el => { const v = parseImporte($(el).value); return v || null; };
  const fila = {
    codigo, proyecto,
    tipo: $('#f-tipo').value, modelo: $('#f-modelo').value.trim() || null,
    superficie_m2: num('#f-sup'), precio_suelo: num('#f-suelo'),
    precio_construccion: num('#f-obra'), precio: num('#f-precio'),
    moneda: $('#f-moneda').value, notas: $('#f-notas').value.trim() || null,
  };
  // Fase/zona de masterplan: solo existen en el cajón para Sumba Hills (ver
  // abrirUnidad), así que solo se mandan si el campo está en el DOM.
  if($('#f-fase')) fila.fase_masterplan = $('#f-fase').value.trim() || null;
  if($('#f-zona')) fila.zona_masterplan = $('#f-zona').value.trim() || null;
  /* 🔴 `estado` y `contrato_id` solo se mandan si la parcela NO está vinculada.
     Se mandaban SIEMPRE, y eso hacía que cambiarle el precio a una parcela
     reservada la desvinculara del contrato y la devolviera a disponible —el
     desplegable de contrato salía vacío y ese vacío se guardaba encima—. Una
     parcela vendida volvía a aparecer libre por haberle corregido un importe.
     Desde que el vínculo lo pone el contrato (trigger `sincroniza_unidad_
     contrato`), estos dos campos tienen UN dueño, y no es esta pantalla. */
  const est = $('#f-estado'), ctr = $('#f-contrato');
  if(est) fila.estado = est.value;
  if(ctr) fila.contrato_id = ctr.value || null;
  const b = $('#btnGuardar'); b.disabled = true;
  try{
    const q = id ? SB.from('unidades').update(fila).eq('id', id).select('id')
                 : SB.from('unidades').insert(fila).select('id');
    const { data, error } = await q;
    if(error) throw error;
    // La RLS no da error al denegar: devuelve cero filas.
    if(!data || !data.length) throw new Error('no tienes permiso para guardar unidades');
    toast(id ? 'Guardado' : 'Unidad creada');
    suiCerrarCajon();
    await cargar();
  }catch(e){
    // El código es único POR PROYECTO: decirlo con esas palabras evita el
    // "duplicate key value violates unique constraint" que no significa nada.
    const m = /unidades_proyecto_codigo_key|duplicate key/.test(e.message || '')
      ? 'Ya hay una unidad con ese código en ese proyecto.'
      : (e.message || e);
    toast('No se pudo guardar: ' + m);
  }
  b.disabled = false;
}

/* ---------- importar CSV ----------
   Vista previa siempre antes de escribir (precios reales). Nunca se manda
   estado/contrato_id: la fila que se sube a Supabase se construye campo a
   campo desde un ALLOWLIST fijo, nunca esparciendo el objeto que salió del
   CSV — así una columna "estado" en el fichero (por accidente o a propósito)
   no tiene ninguna vía de llegar a la base, ni aunque el parser tuviera un
   bug. `estado`/`contrato_id` SÍ tienen un camino manual legítimo en el
   formulario de una unidad (#f-estado/#f-contrato, para parcelas sin
   contrato) — por eso la protección va aquí, en el propio código del import,
   y no como un REVOKE de columna que rompería ese camino. */
const CSV_MAX_BYTES = 5 * 1024 * 1024;
const CSV_MAX_FILAS = 5000;
// cabecera del CSV (minúsculas, sin acentos) → columna real de `unidades`.
// Ninguna clave de este mapa es estado/contrato_id a propósito.
// 🔴 7-ago-2026: los exports de Notion del cliente (p.ej. "Available Plots ·
// Bonian") vienen en inglés — "Type" (el modelo de villa), "Land"/"Villa" (los
// dos precios que hoy llamamos precio_suelo/precio_construccion). Sin estos
// alias esas tres columnas se ignoraban enteras: el modelo y los dos precios
// desaparecían al importar, silenciosamente (solo avisaba "columnas
// ignoradas", que nadie lee fila a fila).
// fase/zone (10-ago-2026, CSV "SUMBA PLOTS" del cliente): van a fase_masterplan/
// zona_masterplan, NO a obra_fase — esa ya existe y es la fase de OBRA de una
// unidad concreta (ver obra/index.html), un concepto distinto que por
// casualidad se llama igual en el lenguaje del negocio. Columnas genéricas en
// la tabla (no hay una tabla por proyecto), pero solo las rellena un CSV que
// las traiga — hoy solo el de Sumba Hills. El resto de proyectos las deja NULL.
// 10-ago-2026: mismo fallo que el de "Type"/"Land"/"Villa" del 7-ago, otra
// vez con una cabecera distinta — el CSV "SUMBA PLOTS" del cliente trae
// "Modelo de villa"/"Precio de suelo"/"Precio de construcción" (con preposición,
// normCab las deja en "modelo_de_villa"/"precio_de_suelo"/"precio_de_construccion"),
// que no casaban con ningún alias de abajo: modelo y los dos precios se habrían
// perdido en silencio otra vez. Añadidos sus alias explícitos.
const CSV_COLUMNAS = {
  codigo:'codigo', proyecto:'proyecto', tipo:'tipo', modelo:'modelo', type:'modelo', modelo_de_villa:'modelo',
  superficie:'superficie_m2', superficie_m2:'superficie_m2', m2:'superficie_m2',
  precio_suelo:'precio_suelo', suelo:'precio_suelo', land:'precio_suelo', precio_de_suelo:'precio_suelo',
  precio_construccion:'precio_construccion', construccion:'precio_construccion', villa:'precio_construccion',
  precio_de_construccion:'precio_construccion',
  precio:'precio', precio_total:'precio', total:'precio',
  moneda:'moneda', notas:'notas',
  fase:'fase_masterplan', zone:'zona_masterplan', zona:'zona_masterplan',
};
// quita acentos y cualquier cosa que no sea letra/número ("Superficie (m2)"
// y "superficie_m2" casan igual) — de puntuación exacta no debería depender
// que una columna se reconozca o se ignore.
// 🔴 "m²" (con el carácter Unicode ², U+00B2) se colaba: NFD solo descompone
// letras acentuadas, no el superíndice, así que sobrevivía al normalize y la
// regex de abajo lo convertía en "_" — "m²" acababa en "m", no "m2", y como
// "m" no es ninguna clave de CSV_COLUMNAS la columna se perdía entera. Se
// sustituye el superíndice por su dígito ANTES de la limpieza general.
const normCab = s => String(s||'').replace(/²/g,'2').replace(/³/g,'3')
  .normalize('NFD').replace(/[̀-ͯ]/g,'')
  .toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');

/* Parser CSV propio (RFC4180: comillas, comas y saltos de línea dentro de un
   campo entrecomillado, "" como comilla escapada) — ninguna herramienta de la
   suite carga una librería de esto hoy, y el caso cabe en unas pocas líneas.
   Devuelve array de arrays; la primera fila es la cabecera. */
function parseCSV(texto){
  const filas = []; let fila = []; let campo = ''; let enComillas = false;
  const t = texto.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(enComillas){
      if(c === '"'){ if(t[i+1] === '"'){ campo += '"'; i++; } else enComillas = false; }
      else campo += c;
    }else if(c === '"'){ enComillas = true; }
    else if(c === ','){ fila.push(campo); campo = ''; }
    else if(c === '\n'){ fila.push(campo); filas.push(fila); fila = []; campo = ''; }
    else campo += c;
  }
  if(campo !== '' || fila.length){ fila.push(campo); filas.push(fila); }
  return filas.filter(f => f.some(c => c.trim() !== ''));
}

let CSV_FILAS_VALIDAS = [];      // lo que de verdad se sube al confirmar
let CSV_CAMPOS_PRESENTES = new Set();   // qué columnas trajo ESTE CSV (ver abajo)

function cerrarImportCsv(){ $('#ovCsv').classList.remove('open'); $('#fileCsv').value = ''; }
$('#btnCsv').addEventListener('click', () => $('#fileCsv').click());
$('#btnCsvCancelar').addEventListener('click', cerrarImportCsv);
$('#ovCsv').addEventListener('click', e => { if(e.target === $('#ovCsv')) cerrarImportCsv(); });
$('#fileCsv').addEventListener('change', () => {
  const f = $('#fileCsv').files[0]; if(f) abrirImportCsv(f);
});

async function abrirImportCsv(file){
  $('#ovCsv').classList.add('open');
  $('#btnCsvConfirmar').disabled = true;
  const cuerpo = $('#csvCuerpo');
  if(file.size > CSV_MAX_BYTES){
    cuerpo.innerHTML = `<p class="aviso">El fichero pesa ${(file.size/1024/1024).toFixed(1)} MB — el máximo son 5 MB. Pártelo en varios.</p>`;
    return;
  }
  cuerpo.innerHTML = '<p class="sub">Leyendo…</p>';
  const texto = await file.text();
  const filas = parseCSV(texto);
  if(!filas.length){ cuerpo.innerHTML = '<p class="aviso">El fichero está vacío.</p>'; return; }
  // ponytail: el tope real es el de bytes (arriba); contar filas exige haber
  // parseado ya (un salto de línea dentro de un campo entrecomillado no cuenta
  // como fila), así que este límite llega después del parse, no antes. Con 5MB
  // ya acotado, el coste de parsear de más es milisegundos, no una vía de DoS.
  if(filas.length - 1 > CSV_MAX_FILAS){
    cuerpo.innerHTML = `<p class="aviso">El fichero trae ${filas.length-1} filas — el máximo son ${CSV_MAX_FILAS}. Pártelo en varios.</p>`;
    return;
  }
  const cabecera = filas[0].map(normCab);
  const mapa = cabecera.map(c => CSV_COLUMNAS[c] || null);
  const ignoradas = cabecera.filter((c,i) => !mapa[i]);
  if(!mapa.includes('codigo') || !mapa.includes('proyecto')){
    cuerpo.innerHTML = '<p class="aviso">El CSV necesita al menos las columnas <code>codigo</code> y <code>proyecto</code>.</p>';
    return;
  }
  // Qué columnas trae DE VERDAD este CSV (target real de unidades, no el alias
  // de cabecera). Se usa al confirmar para NO mandar una clave que el fichero
  // nunca trajo: `unidades.tipo` es un valor por fila, "sin dato" en el CSV no
  // es lo mismo que "vacío a propósito", y una actualización no debe borrar lo
  // que ya había en una columna que el CSV ni siquiera menciona.
  CSV_CAMPOS_PRESENTES = new Set(mapa.filter(Boolean));

  const tiposOk = new Set(TIPOS.map(x => x[0]));
  const existentes = new Set(UNIDADES.map(u => u.proyecto + ' ' + u.codigo));

  const analizadas = filas.slice(1).map((cols, idx) => {
    const d = {}; mapa.forEach((campo, i) => { if(campo) d[campo] = (cols[i] ?? '').trim(); });
    const errores = [];
    const codigo = antiFormula(d.codigo || '');
    const proyectoCsv = d.proyecto || '';
    // Mismo criterio de coincidencia que public.mismo_proyecto() en Supabase
    // (contracts/sql/portal_comprador.sql): el nombre no siempre casa exacto
    // entre sitios. Aquí, típicamente entre lo que exporta Notion ("Bonian
    // Village by Balian Hills") y el catálogo de Unidades ("Bonian Village",
    // desde que el 7-ago se separó el Resort del nombre del proyecto). Si hay
    // coincidencia por contención, se usa el nombre TAL CUAL vive en el
    // catálogo — nunca el del CSV — para no crear una segunda variante del
    // mismo proyecto en `unidades.proyecto`.
    const proyectoCat = proyectoCsv
      ? PROYECTOS.find(p => { const a = p.toLowerCase(), b = proyectoCsv.toLowerCase(); return a === b || a.includes(b) || b.includes(a); })
      : null;
    const proyecto = proyectoCat || proyectoCsv;
    const tipo = (d.tipo || 'parcela').toLowerCase().trim();
    if(!codigo) errores.push('sin código');
    if(!proyectoCsv) errores.push('sin proyecto');
    else if(!proyectoCat) errores.push(`proyecto "${proyectoCsv}" no está en el catálogo — créalo primero con «+ Nuevo proyecto»`);
    if(!tiposOk.has(tipo)) errores.push(`tipo "${tipo}" no está en el catálogo`);
    const num = v => { const n = parseImporte(v); return v && n ? n : null; };
    return {
      fila: idx + 2, // +2: encabezado + base-1
      codigo, proyecto, tipo,
      modelo: d.modelo ? antiFormula(d.modelo) : null,
      superficie_m2: num(d.superficie_m2), precio_suelo: num(d.precio_suelo),
      precio_construccion: num(d.precio_construccion), precio: num(d.precio),
      moneda: (d.moneda || 'EUR').toUpperCase(),
      notas: d.notas ? antiFormula(d.notas) : null,
      fase_masterplan: d.fase_masterplan ? antiFormula(d.fase_masterplan) : null,
      zona_masterplan: d.zona_masterplan ? antiFormula(d.zona_masterplan) : null,
      esAlta: codigo && proyecto ? !existentes.has(proyecto + ' ' + codigo) : null,
      errores,
    };
  });

  CSV_FILAS_VALIDAS = analizadas.filter(f => !f.errores.length);
  const altas = CSV_FILAS_VALIDAS.filter(f => f.esAlta).length;
  const actualiza = CSV_FILAS_VALIDAS.length - altas;
  const conError = analizadas.length - CSV_FILAS_VALIDAS.length;

  cuerpo.innerHTML = `
    <div class="csv-resumen">
      <span><b>${analizadas.length}</b> filas leídas</span>
      <span><b>${altas}</b> altas nuevas</span>
      <span><b>${actualiza}</b> actualizan una unidad existente</span>
      ${conError ? `<span class="csv-tabla th err" style="color:#9E2F26"><b>${conError}</b> con error, no se importan</span>` : ''}
    </div>
    ${ignoradas.length ? `<p class="csv-ignoradas">Columnas del CSV ignoradas (no se trackean hoy): ${ignoradas.map(esc).join(', ')}</p>` : ''}
    <div style="max-height:340px;overflow:auto">
      <table class="csv-tabla">
        <thead><tr><th>Fila</th><th>Código</th><th>Proyecto</th><th>Tipo</th><th>Precio</th><th>Estado</th></tr></thead>
        <tbody>${analizadas.map(f => `
          <tr class="${f.errores.length ? 'fila-err' : ''}">
            <td>${f.fila}</td><td>${esc(f.codigo||'—')}</td><td>${esc(f.proyecto||'—')}</td>
            <td>${esc(f.tipo||'—')}</td>
            <td>${f.precio!=null ? esc(fmtNum(f.precio)) + ' ' + esc(f.moneda) : '—'}</td>
            <td>${f.errores.length ? '<span class="err">' + esc(f.errores.join('; ')) + '</span>'
                 : (f.esAlta ? 'Alta nueva' : 'Actualiza')}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  $('#btnCsvConfirmar').disabled = !CSV_FILAS_VALIDAS.length;
  $('#btnCsvConfirmar').textContent = CSV_FILAS_VALIDAS.length
    ? `Confirmar importación (${CSV_FILAS_VALIDAS.length})` : 'Nada que importar';
}

$('#btnCsvConfirmar').addEventListener('click', async () => {
  if(!CSV_FILAS_VALIDAS.length) return;
  const btn = $('#btnCsvConfirmar'); btn.disabled = true; btn.textContent = 'Importando…';
  /* Allowlist explícito: exactamente estas claves, nunca más — la misma idea
     que ya usa guardar() para no mandar estado/contrato_id, aplicada aquí como
     estructura del objeto, no como un `if` que se pueda olvidar.
     🔴 Y dentro del allowlist, solo se manda una clave si el CSV traía esa
     columna. `upsert` hace `UPDATE ... SET` de TODAS las claves del objeto: si
     esta fila es una actualización y se manda `precio_suelo:null` porque el
     CSV no traía esa columna (no porque viniera vacía), se borra un precio
     real que ya estaba guardado. Ausente en el CSV ≠ vacío a propósito.
     `tipo` es la única excepción con valor por defecto, porque es NOT NULL en
     la base: una alta sin esa columna necesita algo que insertar; una
     actualización sin esa columna no toca el tipo que la unidad ya tenía. */
  const filas = CSV_FILAS_VALIDAS.map(f => {
    const fila = { codigo: f.codigo, proyecto: f.proyecto };
    if(CSV_CAMPOS_PRESENTES.has('tipo') || f.esAlta) fila.tipo = f.tipo;
    ['modelo','superficie_m2','precio_suelo','precio_construccion','precio','notas','fase_masterplan','zona_masterplan']
      .forEach(k => { if(CSV_CAMPOS_PRESENTES.has(k)) fila[k] = f[k]; });
    if(CSV_CAMPOS_PRESENTES.has('moneda')) fila.moneda = f.moneda;
    else if(f.esAlta) fila.moneda = 'EUR';
    return fila;
  });
  const { error } = await SB.from('unidades').upsert(filas, { onConflict: 'proyecto,codigo' });
  if(error){ toast('No se pudo importar: ' + error.message); btn.disabled = false; btn.textContent = 'Confirmar importación'; return; }
  toast(`Importadas ${filas.length} unidades`);
  cerrarImportCsv();
  await cargar();
});

/* ---------- eventos ---------- */
$('#q').addEventListener('input', pintarTabla);
$('#fProyecto').addEventListener('change', e => { PROY = e.target.value; pintar(); });
$('#filtros').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if(!b) return;
  FILTRO = b.dataset.f; pintar();
});
$('#filas').addEventListener('click', e => {
  const tr = e.target.closest('[data-id]'); if(!tr) return;
  abrirUnidad(tr.dataset.id);
});
$('#btnNueva').addEventListener('click', () => abrirUnidad('nueva'));
/* "+ Nuevo proyecto" (11-ago): antes solo se podía dar de alta un proyecto
   DESDE el desplegable de "Nueva unidad" — un rodeo para lo que ahora, con
   Carpetas como vista de entrada, es la operación más directa de la
   herramienta. altaProyecto() ya existía (la usa ese desplegable); esto solo
   le pone una puerta de entrada propia, sin crear ninguna unidad de por medio. */
$('#btnNuevoProyecto').addEventListener('click', async () => {
  const nombre = (prompt('Nombre del proyecto nuevo:') || '').trim();
  if(!nombre) return;
  const r = await altaProyecto(nombre);
  if(!r.ok){ toast(r.error); return; }
  toast('Proyecto creado: ' + r.nombre);
  pintar();
});

suiMontarCajon();
vista();   // recupera la vista guardada (carpetas por defecto) y enseña el contenedor que toca
suiOrdenable($('#tabla'), ORDEN, valorDe, pintar);   // el orden lo comparten las dos vistas

window.LW_AUTH.then(async ({ sb, session, ficha }) => {
  SB = sb;
  ES_SUPER_ADMIN = !!(ficha && ficha.rol === 'super_admin');
  const who = $('#who'); if(who && session) who.textContent = session.user.email;
  $('#btnLogout').onclick = async () => { await SB.auth.signOut(); location.replace('/entrar/'); };
  await cargar();   // ES_SUPER_ADMIN ya está fijado antes de esta llamada — su pintar() final ya sale con el botón de borrar si toca
});
