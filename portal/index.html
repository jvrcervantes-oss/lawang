<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Lawang Estate — Área de clientes</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Instrument Serif para los titulares (alto contraste, editorial) e Inter para
     el resto. Inter entra por sus CIFRAS: esta pantalla es toda importes y
     fechas, y sus números tabulares alinean las columnas de dinero. -->
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --tg:#485B37; --dl:#104C4F; --be:#42210B; --sc:#8F9B7A;
    --va:#2E3437; --ss:#BEB3A5; --rl:#F5F0E6;
    --papel:#FFFDF8; --linea:#E4DCCB; --linea2:#EFE9DC;
    --ok:#3E6B4A; --warn:#8A6D3B; --mal:#8B3A2E;
    --serif:'Instrument Serif',Georgia,serif;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --cab:60px;
  }
  *{box-sizing:border-box; margin:0}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
  body{background:var(--rl); color:var(--va); font-family:var(--sans);
       font-weight:400; font-size:15px; line-height:1.6; min-height:100vh;
       -webkit-font-smoothing:antialiased}
  a{color:var(--tg)}
  button{font-family:inherit; cursor:pointer}
  [hidden]{display:none!important}
  /* Todo lo que sea cifra va tabular: en una columna de importes, las comas
     bailando de línea a línea es lo que hace que una tabla parezca poco seria. */
  .num{font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1}

  .wrap{max-width:820px; margin:0 auto; padding:0 20px 80px}

  /* ── cabecera ─────────────────────────────────────────────────── */
  header{position:sticky; top:0; z-index:20; background:rgba(245,240,230,.92);
         backdrop-filter:blur(10px); border-bottom:1px solid var(--linea)}
  .hrow{max-width:820px; margin:0 auto; padding:0 20px; height:var(--cab);
        display:flex; align-items:center; justify-content:space-between; gap:12px}
  .marca{display:flex; align-items:baseline; gap:10px; min-width:0}
  .marca .nom{font-family:var(--serif); font-size:24px; letter-spacing:.16em; color:var(--tg); line-height:1}
  .marca .sub{font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--sc); white-space:nowrap}
  @media (max-width:520px){ .marca .sub{display:none} }
  .hbtns{display:flex; gap:6px; align-items:center; flex:none}
  .hbtn{background:none; border:1px solid var(--ss); color:var(--va); border-radius:999px;
        padding:6px 13px; font-size:12px; letter-spacing:.04em}
  .hbtn:hover{border-color:var(--tg); color:var(--tg)}

  /* ── pestañas (la URL las sigue) ──────────────────────────────── */
  nav.tabs{position:sticky; top:var(--cab); z-index:19; background:var(--rl);
           border-bottom:1px solid var(--linea)}
  .tabsrow{max-width:820px; margin:0 auto; padding:0 20px; display:flex; gap:2px; overflow-x:auto;
           scrollbar-width:none}
  .tabsrow::-webkit-scrollbar{display:none}
  .tab{background:none; border:0; border-bottom:2px solid transparent; color:var(--sc);
       padding:13px 14px; font-size:13px; letter-spacing:.03em; white-space:nowrap; font-weight:500}
  .tab:hover{color:var(--va)}
  .tab[aria-current="page"]{color:var(--tg); border-bottom-color:var(--tg)}
  .tab .cnt{font-size:11px; color:var(--ss); margin-left:5px; font-variant-numeric:tabular-nums}
  .tab[aria-current="page"] .cnt{color:var(--sc)}

  /* ── saludo + resumen ─────────────────────────────────────────── */
  .hola{padding:36px 0 8px}
  .hola h1{font-family:var(--serif); font-weight:400; font-size:38px; line-height:1.1; color:var(--tg)}
  .hola h1 em{font-style:italic}
  .hola p{color:var(--sc); font-size:14px; margin-top:6px}

  .resumen{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--linea);
           border:1px solid var(--linea); margin:26px 0 34px}
  .resumen .celda{background:var(--papel); padding:18px 16px}
  .resumen .et{font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--sc)}
  .resumen .v{font-family:var(--serif); font-size:27px; line-height:1.2; margin-top:6px; color:var(--va)}
  .resumen .v.verde{color:var(--tg)}
  @media (max-width:600px){
    .resumen{grid-template-columns:1fr 1fr}
    .resumen .celda:first-child{grid-column:1 / -1}
    .hola h1{font-size:31px}
  }

  section{scroll-margin-top:calc(var(--cab) + 52px)}
  .stit{font-family:var(--serif); font-size:23px; color:var(--tg); margin-bottom:4px}
  .sdesc{font-size:13px; color:var(--sc); margin-bottom:18px}

  /* ── tarjetas ─────────────────────────────────────────────────── */
  .card{background:var(--papel); border:1px solid var(--linea); padding:22px; margin-bottom:16px}
  .chead{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap}
  .card h3{font-family:var(--serif); font-weight:400; font-size:24px; color:var(--dl); line-height:1.2}
  .card .meta{font-size:13px; color:var(--sc); margin-top:3px}
  .pill{display:inline-block; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
        padding:4px 11px; border-radius:999px; border:1px solid; font-weight:500; flex:none}
  .pill.ok{color:var(--ok); border-color:var(--ok)}
  .pill.wip{color:var(--warn); border-color:var(--warn)}

  .kv{display:flex; justify-content:space-between; gap:14px; padding:9px 0;
      border-top:1px solid var(--linea2); font-size:14px}
  .kv:first-of-type{margin-top:16px}
  .kv b{font-weight:500}

  .prog{margin:18px 0 2px}
  .prog .bar{height:5px; background:var(--linea); overflow:hidden}
  .prog .fill{height:100%; background:var(--tg); width:0; transition:width .7s cubic-bezier(.2,.7,.3,1)}
  .prog .leg{display:flex; justify-content:space-between; font-size:12.5px; color:var(--sc); margin-top:7px}

  .hitos{margin-top:18px; border-top:1px solid var(--linea2); padding-top:6px}
  .het{font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--sc); padding:8px 0 2px}
  .hito{display:flex; gap:12px; align-items:center; padding:9px 0; font-size:14px}
  .hito + .hito{border-top:1px dashed var(--linea2)}
  .hito .dot{width:9px; height:9px; border-radius:50%; border:1.5px solid var(--ss); flex:none}
  .hito.pagado .dot{background:var(--ok); border-color:var(--ok)}
  .hito.parcial .dot{background:linear-gradient(90deg,var(--ok) 50%,transparent 50%); border-color:var(--ok)}
  .hito .desc{flex:1; min-width:0}
  .hito .cuando{color:var(--sc); font-size:12.5px}
  .hito .imp{font-weight:500; white-space:nowrap}
  .hito .est{font-size:10px; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; min-width:62px; text-align:right}
  .hito.pagado .est{color:var(--ok)}
  .hito.parcial .est{color:var(--warn)}
  .hito.pendiente .est{color:var(--ss)}

  .btn{background:var(--tg); color:var(--rl); border:0; padding:11px 20px; font-size:12px;
       letter-spacing:.12em; text-transform:uppercase; margin-top:18px; font-weight:500}
  .btn:hover{background:var(--dl)}
  .btn.sec{background:none; color:var(--tg); border:1px solid var(--tg)}
  .btn.sec:hover{background:var(--tg); color:var(--rl)}
  .btn[disabled]{opacity:.45; cursor:default}

  /* ── facturas ─────────────────────────────────────────────────── */
  .frow{display:flex; align-items:center; gap:14px; padding:15px 0; border-top:1px solid var(--linea2); font-size:14px}
  .frow:first-child{border-top:0}
  .frow .fnum{font-weight:500; min-width:92px}
  .frow .ftip{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--sc); min-width:60px}
  .frow .ffec{color:var(--sc); font-size:13px}
  .frow .fimp{margin-left:auto; font-weight:500; white-space:nowrap}
  .frow .ver{background:none; border:1px solid var(--ss); padding:5px 13px; font-size:12px; border-radius:999px; color:var(--va)}
  .frow .ver:hover{border-color:var(--tg); color:var(--tg)}
  @media (max-width:560px){
    .frow{flex-wrap:wrap; gap:8px}
    .frow .fimp{margin-left:auto}
    .frow .ffec{width:100%; order:5}
  }

  /* ── obra ─────────────────────────────────────────────────────── */
  .fases{display:flex; flex-wrap:wrap; gap:5px; margin:16px 0 4px}
  .fase{font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; padding:6px 11px;
        border:1px solid var(--linea); color:var(--ss)}
  .fase.hecha{border-color:var(--sc); color:var(--sc)}
  .fase.actual{background:var(--tg); border-color:var(--tg); color:var(--rl); font-weight:500}
  .fotos{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:9px; margin-top:16px}
  .fotos figure{margin:0; cursor:zoom-in}
  .fotos img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--linea)}
  .fotos figcaption{font-size:11.5px; color:var(--sc); padding-top:5px}

  .vacio{background:var(--papel); border:1px dashed var(--ss); padding:26px 22px; text-align:center;
         color:var(--sc); font-size:14px}
  .vacio b{display:block; font-family:var(--serif); font-size:19px; color:var(--va); font-weight:400; margin-bottom:5px}

  footer{margin-top:48px; padding-top:22px; border-top:1px solid var(--linea);
         font-size:12.5px; color:var(--sc); text-align:center}

  /* ── login ────────────────────────────────────────────────────── */
  .login{max-width:410px; margin:0 auto; padding:14vh 20px 0; text-align:center}
  .login .nom{font-family:var(--serif); font-size:42px; letter-spacing:.16em; color:var(--tg); line-height:1}
  .login .sub{font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--sc); margin:8px 0 42px}
  .login p{font-size:14px; margin-bottom:20px; color:var(--va)}
  .login input{width:100%; padding:14px; border:1px solid var(--ss); background:var(--papel);
               font-family:inherit; font-size:15px; text-align:center}
  .login input:focus{outline:none; border-color:var(--tg)}
  .login .btn{width:100%; margin-top:10px}
  .avisologin{margin-top:18px; font-size:13.5px; min-height:22px; line-height:1.5}
  .avisologin.err{color:var(--mal)}
  .avisologin.ok{color:var(--ok)}

  .cargando{text-align:center; padding:20vh 0; color:var(--sc); letter-spacing:.24em;
            font-size:11px; text-transform:uppercase}

  /* ── visores (factura y foto) ─────────────────────────────────── */
  .modal{position:fixed; inset:0; background:rgba(46,52,55,.62); display:flex;
         align-items:flex-start; justify-content:center; padding:20px; overflow:auto; z-index:50}
  .mcaja{background:#fff; max-width:660px; width:100%}
  .mbarra{display:flex; justify-content:flex-end; gap:8px; padding:10px; border-bottom:1px solid var(--linea)}
  .mbarra button{background:none; border:1px solid var(--ss); padding:6px 14px; font-size:12px;
                 border-radius:999px; color:var(--va)}
  .mbarra button:hover{border-color:var(--tg); color:var(--tg)}
  .modal img.grande{max-width:min(1100px,96vw); max-height:88vh; width:auto; object-fit:contain; margin:auto}

  .fdoc{padding:36px 40px; color:#20262a; font-size:14px}
  .fdoc .cab{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:28px}
  .fdoc .soc{font-family:var(--serif); font-size:21px; color:var(--tg); letter-spacing:.04em}
  .fdoc .tipo{font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:var(--sc); margin-top:3px}
  .fdoc .num{font-size:21px; font-weight:500; text-align:right}
  .fdoc .fec{font-size:13px; color:var(--sc); text-align:right}
  .fdoc .bloque{margin:15px 0}
  .fdoc .btit{font-size:9.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--sc); margin-bottom:4px}
  .fdoc table{width:100%; border-collapse:collapse; margin:20px 0 8px; font-size:13.5px}
  .fdoc th{text-align:left; font-weight:500; font-size:9.5px; letter-spacing:.18em; text-transform:uppercase;
           color:var(--rl); background:var(--tg); padding:9px 11px}
  .fdoc th:last-child, .fdoc td:last-child{text-align:right}
  .fdoc td{padding:10px 11px; border-bottom:1px solid var(--linea)}
  .fdoc .tot{display:flex; justify-content:flex-end; gap:28px; padding:7px 11px}
  .fdoc .tot.grande{font-size:17px; font-weight:500; color:var(--tg); border-top:1px solid var(--linea)}
  @media (max-width:560px){ .fdoc{padding:24px 20px} }

  @media print{
    body.imprimiendo > :not(.modal){display:none!important}
    body.imprimiendo .modal{position:static; background:none; padding:0; display:block}
    body.imprimiendo .mbarra{display:none}
    body.imprimiendo .mcaja{max-width:none}
  }
  @page{size:A4; margin:16mm}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important; transition:none!important}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<div id="vCarga" class="cargando">Lawang Estate</div>

<!-- ── login ─────────────────────────────────────────────────────────── -->
<div id="vLogin" class="login" hidden>
  <div class="nom">LAWANG</div>
  <div class="sub" data-t="area">Área de clientes</div>
  <p data-t="login_intro">Introduce el correo con el que compraste. Te enviaremos un enlace de acceso — sin contraseñas.</p>
  <form id="fLogin">
    <input type="email" id="inEmail" autocomplete="email" required placeholder="tu@correo.com">
    <button class="btn" type="submit" data-t="login_btn">Enviarme el enlace</button>
  </form>
  <div id="avisoLogin" class="avisologin"></div>
</div>

<!-- ── app ───────────────────────────────────────────────────────────── -->
<div id="vApp" hidden>
  <header>
    <div class="hrow">
      <div class="marca">
        <span class="nom">LAWANG</span>
        <span class="sub" data-t="area">Área de clientes</span>
      </div>
      <div class="hbtns">
        <button class="hbtn" id="btnLang">EN</button>
        <button class="hbtn" id="btnSalir" data-t="salir">Salir</button>
      </div>
    </div>
  </header>

  <nav class="tabs"><div class="tabsrow" id="tabs"></div></nav>

  <div class="wrap">
    <div class="hola">
      <h1 id="saludo"></h1>
      <p data-t="saludo_sub">Estado de tu operación con Lawang Estate</p>
    </div>
    <div class="resumen" id="resumen"></div>

    <section id="secContratos"><div id="listaContratos"></div></section>
    <section id="secFacturas" hidden><div id="listaFacturas"></div></section>
    <section id="secObra" hidden><div id="listaObra"></div></section>

    <footer>
      <span data-t="pie">¿Dudas? Escríbenos a</span>
      <a href="mailto:sales@lawangproperties.com">sales@lawangproperties.com</a>
    </footer>
  </div>
</div>

<script>
(function(){
  'use strict';
  var URL_SB = 'https://vtulllundrfennhjddhc.supabase.co';
  var KEY_SB = 'sb_publishable_B_ot_6lNVRLiWiEMtApYOQ_3Ho3xNUg';   // publicable: el candado es la RLS y la RPC
  var sb = supabase.createClient(URL_SB, KEY_SB);

  /* ── i18n ─────────────────────────────────────────────────────────── */
  var T = {
    es:{ login_intro:'Introduce el correo con el que compraste. Te enviaremos un enlace de acceso — sin contraseñas.',
         login_btn:'Enviarme el enlace', enviado:'Enlace enviado. Revisa tu correo (mira también en spam).',
         sin_acceso:'Este correo no tiene acceso al portal. Escríbenos a sales@lawangproperties.com y te lo abrimos.',
         area:'Área de clientes', salir:'Salir', saludo_sub:'Estado de tu operación con Lawang Estate',
         t_contratos:'Contratos', t_facturas:'Facturas', t_obra:'Obra',
         hola:'Hola', firmado:'Firmado', pendiente_firma:'Pendiente de firma',
         precio:'Precio', unidad:'Unidad', fecha_firma:'Fecha de firma',
         pagado:'pagado', pendiente:'pendiente', parcial:'parcial', de:'de',
         plan_pagos:'Plan de pagos', descargar:'Descargar contrato firmado',
         ver:'Ver', imprimir:'Imprimir o guardar en PDF', cerrar:'Cerrar',
         factura:'Factura', recibi:'Recibo', proforma:'Proforma',
         f_cliente:'Cliente', f_proyecto:'Proyecto', f_concepto:'Concepto', f_importe:'Importe',
         f_subtotal:'Subtotal', f_total:'Total', f_banco:'Forma de pago',
         r_inversion:'Tu inversión', r_pagado:'Pagado', r_pendiente:'Pendiente',
         sin_facturas_t:'Aún no hay documentos', sin_facturas:'Cuando emitamos una factura o un recibo, aparecerá aquí y podrás descargarlo.',
         sin_obra_t:'Aún no hay novedades de obra', sin_obra:'En cuanto empiece la construcción de tu unidad publicaremos aquí su avance y sus fotos.',
         sin_contratos_t:'No vemos contratos a tu nombre', sin_contratos:'Puede que tu acceso esté sobre una ficha que aún no tiene contratos ligados. Escríbenos y lo revisamos.',
         entrega_est:'Entrega estimada', actualizado:'Última actualización', pie:'¿Dudas? Escríbenos a',
         err_carga:'No hemos podido cargar tu información. Recarga la página o inténtalo más tarde.' },
    en:{ login_intro:'Enter the email you purchased with. We will send you a sign-in link — no passwords.',
         login_btn:'Send me the link', enviado:'Link sent. Check your inbox (and your spam folder).',
         sin_acceso:'This email has no portal access. Write to sales@lawangproperties.com and we will open it.',
         area:'Client area', salir:'Sign out', saludo_sub:'Status of your operation with Lawang Estate',
         t_contratos:'Contracts', t_facturas:'Invoices', t_obra:'Construction',
         hola:'Hello', firmado:'Signed', pendiente_firma:'Awaiting signature',
         precio:'Price', unidad:'Unit', fecha_firma:'Signing date',
         pagado:'paid', pendiente:'pending', parcial:'partial', de:'of',
         plan_pagos:'Payment plan', descargar:'Download signed contract',
         ver:'View', imprimir:'Print or save as PDF', cerrar:'Close',
         factura:'Invoice', recibi:'Receipt', proforma:'Proforma',
         f_cliente:'Client', f_proyecto:'Project', f_concepto:'Description', f_importe:'Amount',
         f_subtotal:'Subtotal', f_total:'Total', f_banco:'Payment details',
         r_inversion:'Your investment', r_pagado:'Paid', r_pendiente:'Outstanding',
         sin_facturas_t:'No documents yet', sin_facturas:'Once we issue an invoice or a receipt it will show up here, ready to download.',
         sin_obra_t:'No construction updates yet', sin_obra:'As soon as your unit breaks ground we will publish its progress and photos here.',
         sin_contratos_t:'We see no contracts under your name', sin_contratos:'Your access may sit on a record with no contracts linked yet. Write to us and we will check it.',
         entrega_est:'Estimated handover', actualizado:'Last update', pie:'Questions? Write to',
         err_carga:'We could not load your information. Reload the page or try again later.' }
  };
  var LANG = localStorage.getItem('lw_portal_lang') ||
             ((navigator.language || 'es').slice(0,2) === 'es' ? 'es' : 'en');
  function t(k){ return (T[LANG] && T[LANG][k]) || T.es[k] || k; }
  function aplicaLang(){
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = t(el.getAttribute('data-t')); });
    document.getElementById('btnLang').textContent = LANG === 'es' ? 'EN' : 'ES';
  }

  /* ── utilidades ───────────────────────────────────────────────────── */
  function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  // Importes tal y como los teclea el equipo: "69.000", "5000", "20.000,50".
  function num(v){
    if (v == null || v === '') return NaN;
    if (typeof v === 'number') return v;
    var s = String(v).replace(/\s/g,'').replace(/\./g,'').replace(',','.');
    var n = parseFloat(s); return isNaN(n) ? NaN : n;
  }
  function dinero(n, moneda){
    if (n == null || isNaN(n)) return '—';
    try { return new Intl.NumberFormat(LANG === 'es' ? 'es-ES' : 'en-GB',
            { style:'currency', currency:(moneda || 'EUR'), maximumFractionDigits:0 }).format(n); }
    catch(e){ return n.toLocaleString() + ' ' + (moneda || ''); }
  }
  function fecha(f){
    if (!f) return '';
    var d = new Date(f); if (isNaN(d)) return esc(f);
    return d.toLocaleDateString(LANG === 'es' ? 'es-ES' : 'en-GB', { day:'numeric', month:'short', year:'numeric' });
  }

  var DATOS = null;

  function muestra(vista){
    ['vCarga','vLogin','vApp'].forEach(function(id){ document.getElementById(id).hidden = (id !== vista); });
  }
  aplicaLang();

  /* ── RUTAS: la URL dice siempre dónde estás ───────────────────────────
     Estándar del estudio (routing con URL real): la sección viva en el hash,
     de forma que se pueda compartir, recargar y volver con el botón atrás.
     Rutas: #/contratos · #/facturas · #/obra · #/factura/INV00001
     El enlace del correo llega con `#access_token=…`; en cuanto supabase-js
     lo consume, se sustituye por la ruta limpia — antes quedaba un `/portal/#`
     colgando, que no dice nada y ensucia el historial. */
  var SECCIONES = ['contratos','facturas','obra'];
  var RUTA = { sec:'contratos', doc:null };

  function leeHash(){
    var h = (location.hash || '').replace(/^#\/?/, '');
    var partes = h.split('/').filter(Boolean);
    if (partes[0] === 'factura' && partes[1]) return { sec:'facturas', doc:decodeURIComponent(partes[1]) };
    if (SECCIONES.indexOf(partes[0]) !== -1) return { sec:partes[0], doc:null };
    return { sec:'contratos', doc:null };
  }
  function vasA(sec, doc, reemplaza){
    var url = '#/' + sec + (doc ? '/' + encodeURIComponent(doc) : '');
    if (reemplaza) history.replaceState(null, '', url); else location.hash = url;
    if (reemplaza) aplicaRuta();
  }
  function aplicaRuta(){
    RUTA = leeHash();
    document.getElementById('secContratos').hidden = RUTA.sec !== 'contratos';
    document.getElementById('secFacturas').hidden  = RUTA.sec !== 'facturas';
    document.getElementById('secObra').hidden      = RUTA.sec !== 'obra';
    document.querySelectorAll('.tab').forEach(function(b){
      if (b.dataset.sec === RUTA.sec) b.setAttribute('aria-current','page');
      else b.removeAttribute('aria-current');
    });
    // documento pedido por URL (o cierre del visor al volver atrás)
    var abierto = document.querySelector('.modal[data-doc]');
    if (RUTA.doc){
      if (!abierto || abierto.dataset.doc !== RUTA.doc){
        if (abierto) abierto.remove();
        var f = (DATOS && DATOS.facturas || []).filter(function(x){ return x.numero === RUTA.doc; })[0];
        if (f) abreFactura(f); else vasA(RUTA.sec, null, true);
      }
    } else if (abierto) abierto.remove();
  }
  window.addEventListener('hashchange', aplicaRuta);

  /* ── arranque ─────────────────────────────────────────────────────── */
  sb.auth.getSession().then(function(r){
    var ses = r && r.data && r.data.session;
    if (!ses) { muestra('vLogin'); return; }
    if (!((ses.user && ses.user.app_metadata) || {}).portal) { location.replace('/intranet/'); return; }
    cargar();
  }).catch(function(){ muestra('vLogin'); });

  sb.auth.onAuthStateChange(function(ev, ses){
    if (ev === 'SIGNED_IN' && ses && (ses.user.app_metadata || {}).portal &&
        document.getElementById('vApp').hidden) cargar();
  });

  /* ── login ────────────────────────────────────────────────────────── */
  document.getElementById('fLogin').addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('inEmail').value.trim().toLowerCase();
    var aviso = document.getElementById('avisoLogin');
    aviso.className = 'avisologin'; aviso.textContent = '…';
    sb.auth.signInWithOtp({
      email: email,
      options: { shouldCreateUser:false, emailRedirectTo: location.origin + '/portal/' }
    }).then(function(r){
      if (r.error){ aviso.className = 'avisologin err'; aviso.textContent = t('sin_acceso'); }
      else { aviso.className = 'avisologin ok'; aviso.textContent = t('enviado'); }
    });
  });

  document.getElementById('btnSalir').addEventListener('click', function(){
    sb.auth.signOut().then(function(){ location.replace('/portal/'); });
  });
  document.getElementById('btnLang').addEventListener('click', function(){
    LANG = LANG === 'es' ? 'en' : 'es';
    localStorage.setItem('lw_portal_lang', LANG);
    aplicaLang(); if (DATOS) pinta();
  });

  /* ── datos ────────────────────────────────────────────────────────── */
  function cargar(){
    muestra('vCarga');
    sb.rpc('portal_situacion').then(function(r){
      if (r.error){
        muestra('vLogin');
        var aviso = document.getElementById('avisoLogin');
        aviso.className = 'avisologin err'; aviso.textContent = t('err_carga');
        return;
      }
      DATOS = r.data || {};
      muestra('vApp');
      pinta();
      // el hash del enlace mágico ya está consumido: ruta limpia y legible
      var r0 = leeHash();
      vasA(r0.sec, r0.doc, true);
    });
  }

  /* ── reparto de cobro entre hitos ─────────────────────────────────────
     "Pagado" = las facturas y recibos no anulados cubren el acumulado del
     hito, el MISMO criterio que usan las herramientas internas. El reparto
     es secuencial: lo cobrado va tapando hitos por orden. */
  function estadosHitos(hitos, cobrado, precio){
    var resto = cobrado || 0;
    return (hitos || []).map(function(h){
      var m = num(h.monto);
      if (isNaN(m)){ var p = num(h.pct); m = (!isNaN(p) && precio) ? precio * p / 100 : NaN; }
      var est, cubierto = 0;
      if (isNaN(m)) est = 'pendiente';
      else if (resto >= m - 0.005){ est = 'pagado'; cubierto = m; resto -= m; }
      else if (resto > 0.005){ est = 'parcial'; cubierto = resto; resto = 0; }
      else est = 'pendiente';
      return { hito:h, monto:m, estado:est, cubierto:cubierto };
    });
  }

  /* ── pintado ──────────────────────────────────────────────────────── */
  function pinta(){
    var d = DATOS;
    var nombre = d.nombre ? String(d.nombre).trim().split(/\s+/)[0] : '';
    document.getElementById('saludo').innerHTML =
      esc(t('hola')) + (nombre ? ', <em>' + esc(nombre) + '</em>' : '');

    /* pestañas con su recuento */
    var cuentas = { contratos:(d.contratos||[]).length, facturas:(d.facturas||[]).length, obra:(d.obra||[]).length };
    document.getElementById('tabs').innerHTML = SECCIONES.map(function(s){
      return '<button class="tab" data-sec="' + s + '">' + esc(t('t_' + s)) +
             (cuentas[s] ? '<span class="cnt num">' + cuentas[s] + '</span>' : '') + '</button>';
    }).join('');

    /* resumen: lo que de verdad quiere saber quien entra */
    var tot = 0, cob = 0;
    (d.contratos||[]).forEach(function(c){
      var p = (c.precio != null) ? Number(c.precio) : num(c.precio_txt);
      if (!isNaN(p)) tot += p;
      cob += Number(c.cobrado) || 0;
    });
    var mon = ((d.contratos||[])[0] || {}).moneda || 'EUR';
    var res = document.getElementById('resumen');
    if (tot > 0){
      res.hidden = false;
      res.innerHTML =
        '<div class="celda"><div class="et">' + esc(t('r_inversion')) + '</div><div class="v num">' + esc(dinero(tot, mon)) + '</div></div>' +
        '<div class="celda"><div class="et">' + esc(t('r_pagado')) + '</div><div class="v verde num">' + esc(dinero(cob, mon)) + '</div></div>' +
        '<div class="celda"><div class="et">' + esc(t('r_pendiente')) + '</div><div class="v num">' + esc(dinero(Math.max(0, tot - cob), mon)) + '</div></div>';
    } else res.hidden = true;

    /* contratos */
    var cont = document.getElementById('listaContratos');
    if (!(d.contratos||[]).length){
      cont.innerHTML = '<div class="vacio"><b>' + esc(t('sin_contratos_t')) + '</b>' + esc(t('sin_contratos')) + '</div>';
    } else {
      cont.innerHTML = d.contratos.map(function(c){
        var precio = (c.precio != null) ? Number(c.precio) : num(c.precio_txt);
        var cobrado = Number(c.cobrado) || 0;
        var pct = (precio > 0) ? Math.min(100, Math.round(cobrado / precio * 100)) : null;
        var hs = estadosHitos(c.hitos, cobrado, precio);
        var htmlHitos = hs.length ? '<div class="hitos"><div class="het">' + esc(t('plan_pagos')) + '</div>' +
          hs.map(function(x){
            var descr = x.hito[LANG] || x.hito.es || x.hito.en || '';
            return '<div class="hito ' + x.estado + '"><span class="dot"></span>' +
              '<span class="desc">' + esc(descr) +
                (x.hito.timing ? (descr ? ' ' : '') + '<span class="cuando num">' + esc(x.hito.timing) + '</span>' : '') + '</span>' +
              '<span class="imp num">' + (isNaN(x.monto) ? '—' : esc(dinero(x.monto, c.moneda))) + '</span>' +
              '<span class="est">' + esc(t(x.estado)) + '</span></div>';
          }).join('') + '</div>' : '';
        return '<div class="card">' +
          '<div class="chead"><div><h3>' + esc(c.numero) + '</h3>' +
            '<div class="meta">' + esc(c.proyecto || '') +
              (c.parcela ? ' · ' + esc(t('unidad')) + ' ' + esc(c.parcela) : '') + '</div></div>' +
            '<span class="pill ' + (c.firmado ? 'ok' : 'wip') + '">' + esc(c.firmado ? t('firmado') : t('pendiente_firma')) + '</span></div>' +
          '<div class="kv"><span>' + esc(t('precio')) + '</span><b class="num">' +
            (precio ? esc(dinero(precio, c.moneda)) : esc(c.precio_txt || '—')) + '</b></div>' +
          (c.fecha_firma ? '<div class="kv"><span>' + esc(t('fecha_firma')) + '</span><b class="num">' + esc(fecha(c.fecha_firma)) + '</b></div>' : '') +
          (precio > 0 ? '<div class="prog"><div class="bar"><div class="fill" style="width:' + pct + '%"></div></div>' +
            '<div class="leg"><span class="num">' + esc(dinero(cobrado, c.moneda)) + ' ' + esc(t('pagado')) + '</span>' +
            '<span class="num">' + pct + '% ' + esc(t('de')) + ' ' + esc(dinero(precio, c.moneda)) + '</span></div></div>' : '') +
          htmlHitos +
          (c.pdf ? '<button class="btn sec" data-pdf="' + esc(c.pdf) + '">' + esc(t('descargar')) + '</button>' : '') +
        '</div>';
      }).join('');
    }

    /* facturas */
    var lf = document.getElementById('listaFacturas');
    if (!(d.facturas||[]).length){
      lf.innerHTML = '<div class="vacio"><b>' + esc(t('sin_facturas_t')) + '</b>' + esc(t('sin_facturas')) + '</div>';
    } else {
      lf.innerHTML = '<div class="card">' + d.facturas.map(function(f){
        return '<div class="frow">' +
          '<span class="fnum num">' + esc(f.numero) + '</span>' +
          '<span class="ftip">' + esc(T[LANG][f.tipo] || f.tipo) + '</span>' +
          '<span class="ffec num">' + esc(fecha(f.fecha)) + '</span>' +
          '<span class="fimp num">' + esc(dinero(Number(f.total), f.moneda)) + '</span>' +
          '<button class="ver" data-fac="' + esc(f.numero) + '">' + esc(t('ver')) + '</button></div>';
      }).join('') + '</div>';
    }

    /* obra */
    var lo = document.getElementById('listaObra');
    var fases = d.fases || [];
    if (!(d.obra||[]).length){
      lo.innerHTML = '<div class="vacio"><b>' + esc(t('sin_obra_t')) + '</b>' + esc(t('sin_obra')) + '</div>';
    } else {
      lo.innerHTML = d.obra.map(function(u){
        var idx = fases.map(function(f){ return f.clave; }).indexOf(u.fase);
        var htmlFases = fases.length ? '<div class="fases">' + fases.map(function(f, i){
          return '<span class="fase ' + (i < idx ? 'hecha' : (i === idx ? 'actual' : '')) + '">' + esc(f[LANG] || f.es) + '</span>';
        }).join('') + '</div>' : '';
        var htmlFotos = (u.fotos||[]).length ? '<div class="fotos">' + u.fotos.map(function(ft){
          return '<figure><img loading="lazy" data-foto="' + esc(ft.path) + '" alt="' + esc(ft.titulo || '') + '">' +
                 '<figcaption>' + esc(ft.titulo || '') + (ft.fecha ? ' <span class="num">' + esc(fecha(ft.fecha)) + '</span>' : '') + '</figcaption></figure>';
        }).join('') + '</div>' : '';
        return '<div class="card">' +
          '<div class="chead"><div><h3>' + esc(u.unidad) + '</h3>' +
            '<div class="meta">' + esc(u.proyecto || '') + (u.contrato_numero ? ' · ' + esc(u.contrato_numero) : '') + '</div></div></div>' +
          htmlFases +
          (u.fecha_entrega ? '<div class="kv"><span>' + esc(t('entrega_est')) + '</span><b class="num">' + esc(fecha(u.fecha_entrega)) + '</b></div>' : '') +
          (u.actualizado ? '<div class="kv"><span>' + esc(t('actualizado')) + '</span><b class="num">' + esc(fecha(u.actualizado)) + '</b></div>' : '') +
          htmlFotos + '</div>';
      }).join('');
      cargaFotos();
    }

    aplicaRuta();
  }

  /* ── navegación por pestañas ──────────────────────────────────────── */
  document.getElementById('tabs').addEventListener('click', function(e){
    var b = e.target.closest('.tab'); if (!b) return;
    vasA(b.dataset.sec, null);
  });

  /* ── ficheros privados: siempre URL firmada de corta vida ─────────── */
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-pdf]');
    if (b){
      b.disabled = true;
      sb.storage.from('contratos-firmados').createSignedUrl(b.getAttribute('data-pdf'), 600)
        .then(function(r){ b.disabled = false; if (r.data && r.data.signedUrl) window.open(r.data.signedUrl, '_blank'); });
      return;
    }
    var v = e.target.closest('[data-fac]');
    if (v){ vasA('facturas', v.getAttribute('data-fac')); return; }   // la URL abre el documento
    var img = e.target.closest('.fotos img');
    if (img && img.src) ampliaFoto(img.src, img.alt);
  });

  function cargaFotos(){
    document.querySelectorAll('img[data-foto]').forEach(function(img){
      var p = img.getAttribute('data-foto'); img.removeAttribute('data-foto');
      sb.storage.from('obra').createSignedUrl(p, 3600).then(function(r){
        if (r.data && r.data.signedUrl) img.src = r.data.signedUrl;
      });
    });
  }

  function cierraConEsc(modal){
    function h(e){ if (e.key === 'Escape'){ modal.remove(); document.removeEventListener('keydown', h); } }
    document.addEventListener('keydown', h);
  }

  function ampliaFoto(src, titulo){
    var m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = '<img class="grande" src="' + esc(src) + '" alt="' + esc(titulo || '') + '">';
    m.addEventListener('click', function(){ m.remove(); });
    document.body.appendChild(m); cierraConEsc(m);
  }

  /* ── visor de factura (documento imprimible) ──────────────────────── */
  function abreFactura(f){
    if (!f) return;
    var fl = f.fields || {};
    var lineas = f.lineas || fl.lineas || [];
    var tot = f.totales || {};
    var banco = [fl.banco_titular, fl.banco_nombre, fl.banco_cuenta, fl.banco_codigo, fl.banco_extra]
                .filter(Boolean).join(' · ');
    var m = document.createElement('div');
    m.className = 'modal';
    m.dataset.doc = f.numero;
    m.innerHTML = '<div class="mcaja">' +
      '<div class="mbarra">' +
        '<button data-imprime>' + esc(t('imprimir')) + '</button>' +
        '<button data-cierra>' + esc(t('cerrar')) + '</button></div>' +
      '<div class="fdoc">' +
        '<div class="cab"><div><div class="soc">' + esc((f.sociedad || '').replace(/_/g,' ').toUpperCase()) + '</div>' +
          '<div class="tipo">' + esc(T[LANG][f.tipo] || f.tipo) + '</div></div>' +
          '<div><div class="num">' + esc(f.numero) + '</div><div class="fec num">' + esc(fecha(f.fecha)) + '</div></div></div>' +
        '<div class="bloque"><div class="btit">' + esc(t('f_cliente')) + '</div>' +
          esc(fl.cliente_nombre || f.cliente || '') +
          (fl.cliente_documento ? ' · ' + esc(fl.cliente_documento) : '') +
          (fl.cliente_domicilio ? '<br>' + esc(fl.cliente_domicilio) : '') + '</div>' +
        ((f.proyecto || fl.proyecto_nombre) ? '<div class="bloque"><div class="btit">' + esc(t('f_proyecto')) + '</div>' +
          esc(f.proyecto || fl.proyecto_nombre) + (f.contrato_numero ? ' · ' + esc(f.contrato_numero) : '') + '</div>' : '') +
        '<table><tr><th>' + esc(t('f_concepto')) + '</th><th>' + esc(t('f_importe')) + '</th></tr>' +
        lineas.map(function(l){
          return '<tr><td>' + esc(l.descripcion || '') + '</td><td class="num">' + esc(dinero(num(l.importe), f.moneda)) + '</td></tr>';
        }).join('') + '</table>' +
        (tot.subtotal != null && tot.subtotal !== tot.total ?
          '<div class="tot"><span>' + esc(t('f_subtotal')) + '</span><span class="num">' + esc(dinero(Number(tot.subtotal), f.moneda)) + '</span></div>' : '') +
        '<div class="tot grande"><span>' + esc(t('f_total')) + '</span><span class="num">' +
          esc(dinero(tot.total != null ? Number(tot.total) : Number(f.total), f.moneda)) + '</span></div>' +
        (banco ? '<div class="bloque" style="margin-top:24px"><div class="btit">' + esc(t('f_banco')) + '</div>' + esc(banco) + '</div>' : '') +
      '</div></div>';
    m.addEventListener('click', function(e){
      if (e.target === m || e.target.closest('[data-cierra]')){ vasA('facturas', null); return; }
      if (e.target.closest('[data-imprime]')){
        document.body.classList.add('imprimiendo');
        window.print();
        document.body.classList.remove('imprimiendo');
      }
    });
    document.body.appendChild(m); cierraConEsc(m);
  }
})();
</script>
</body>
</html>
