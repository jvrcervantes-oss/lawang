<style>
  :root{ --tbh:56px; }
  *{ box-sizing:border-box; } html,body{ margin:0; height:100%; }
  body{ font-family:var(--font-body,'Jost',sans-serif); background:var(--sup-0); color:var(--texto);
        -webkit-font-smoothing:antialiased; }
  [hidden]{ display:none !important; }
  .topbar{ position:fixed; top:0; left:0; right:0; z-index:40; }
  /* La cadena de alturas llega hasta `.sui-stage` o el scroll se lo queda el
     body: `height:100%` contra un padre de alto automático es alto automático.
     Con el body scrolleando, la cabecera pegada de la tabla deja de pegarse y
     el «volver arriba» al cambiar de sección no hace nada. Las herramientas no
     lo necesitan porque su `.sui-stage` cuelga del body; aquí hay un envoltorio
     en medio para poder alternar entrada / cargando / aplicación. */
  #vApp{ height:100%; }
  /* `.sui-chip.vacio` atenúa los filtros sin resultados, pero el que está
     SELECCIONADO no puede verse apagado aunque su sección esté vacía: es donde
     estás. Pasa en cuanto un comprador entra sin contratos todavía. */
  .sui-chip.on{ opacity:1; }

  /* ── encabezado de página: mismo registro que la intranet ──────────────
     Rótulo en Jost, no en serif. La display se reserva a la marca; en una
     herramienta, un titular serif de 40px es ruido (manual del estudio). */
  .lede{ margin:0 0 var(--e4); }
  .lede h1{ margin:0; font-size:23px; font-weight:500; letter-spacing:.005em; color:var(--texto); }
  .lede p{ margin:4px 0 0; font-size:14px; color:var(--texto-2); max-width:62ch; }

  /* ── bloque de operación (contrato / unidad) ──────────────────────────
     Mismo papel, borde, radio y sombra que `.sui-tabla-caja`: es la misma
     familia de objeto, solo que su contenido no es una tabla. */
  .op{ background:var(--sup-1); border:1px solid var(--linea); border-radius:var(--r-l);
       box-shadow:var(--sombra-1); padding:var(--e4) var(--e5) var(--e5); margin:0 0 var(--e4); }
  .op-cab{ display:flex; align-items:baseline; gap:var(--e3); flex-wrap:wrap; }
  .op-cab h2{ margin:0; font-size:16px; font-weight:600; letter-spacing:.05em; color:var(--dl); }
  .op-cab .sub{ font-size:12.5px; color:var(--texto-2); }
  .op-cab .sui-tag{ margin-left:auto; }
  .op > .sui-dl{ margin-top:var(--e3); }
  .op .sui-tabla{ min-width:0; }            /* dentro del bloque no hay scroll horizontal */
  .op-pie{ margin-top:var(--e4); }

  /* barra de avance — los mismos valores que Unidades */
  .barra{ height:7px; border-radius:var(--r-p); background:#E7E1D2; overflow:hidden; margin:var(--e3) 0 6px; }
  .barra i{ display:block; height:100%; background:#3F5230; transition:width .6s var(--curva); }
  .barra-leg{ display:flex; justify-content:space-between; gap:var(--e3); font-size:12px;
              color:var(--texto-2); font-variant-numeric:tabular-nums; }

  /* fases de obra */
  .fases{ display:flex; flex-wrap:wrap; gap:6px; margin:var(--e3) 0 0; }
  .fase{ font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; padding:5px 11px;
         border:1px solid var(--linea); border-radius:var(--r-p); color:var(--texto-3); }
  .fase.hecha{ color:var(--texto-2); border-color:var(--ss); }
  .fase.actual{ background:#3F5230; border-color:#3F5230; color:#fff; font-weight:600; }

  /* fotos */
  .fotos{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:var(--e2); margin-top:var(--e4); }
  .fotos figure{ margin:0; cursor:zoom-in; }
  .fotos img{ width:100%; aspect-ratio:4/3; object-fit:cover; display:block;
              border-radius:var(--r-s); background:#E7E1D2; }
  .fotos figcaption{ font-size:11.5px; color:var(--texto-2); padding-top:4px; }
  .lupa{ position:fixed; inset:0; z-index:70; background:rgba(34,40,42,.72);
         display:flex; align-items:center; justify-content:center; padding:20px; cursor:zoom-out; }
  .lupa img{ max-width:96vw; max-height:92vh; border-radius:var(--r-s); }

  /* ── la factura de verdad dentro del cajón ─────────────────────────────
     `documento.css` maqueta una hoja A4 real. En pantalla se reduce con `zoom`
     igual que hace la vista previa de la herramienta de Facturas; al imprimir
     vuelve a tamaño real (el zoom no se aplica dentro de @media print). */
  .hoja-scroll{ display:flex; justify-content:center; }
  .sheet{ width:210mm; min-height:297mm; background:var(--folio,#fff); padding:15mm 16mm;
          zoom:.62; box-shadow:var(--sombra-1); }
  @media (max-width:900px){
    .sheet{ zoom:.46; }
    .hoja-scroll{ overflow-x:auto; justify-content:flex-start; }
  }

  /* ── documentos (documentación de la promoción y lo entregado) ─────── */
  .docrow-cat{ font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--texto-3); }
  .caduca-mal{ color:#9E2F26; font-weight:600; }
  .doc .fec{ font-size:12.5px; color:var(--texto-2); text-align:right; font-variant-numeric:tabular-nums; }

  /* ── login ─────────────────────────────────────────────────────────── */
  .entrada{ min-height:100%; display:grid; place-items:center; padding:var(--e5); }
  .entrada .caja{ width:100%; max-width:400px; background:var(--sup-1); border:1px solid var(--linea);
                  border-radius:var(--r-l); box-shadow:var(--sombra-1); padding:var(--e6) var(--e5); text-align:center; }
  .entrada .marca{ font-family:'Cormorant Garamond',Georgia,serif; font-size:30px; font-weight:600;
                   letter-spacing:.12em; color:var(--tg); line-height:1; }
  .entrada .rot{ font-size:10.5px; letter-spacing:.22em; text-transform:uppercase;
                 color:var(--texto-3); margin:7px 0 var(--e5); }
  .entrada p{ font-size:13.5px; color:var(--texto-2); margin:0 0 var(--e4); line-height:1.55; }
  .entrada input{ width:100%; font:inherit; font-size:14px; padding:11px 13px; text-align:center;
                  border:1px solid var(--linea); border-radius:var(--r-s); background:var(--sup-1); color:inherit; }
  .entrada input:focus{ outline:none; border-color:var(--tg); box-shadow:0 0 0 3px rgba(72,91,55,.13); }
  .entrada .sui-btn{ width:100%; justify-content:center; margin-top:var(--e2); }
  .aviso{ font-size:12.5px; line-height:1.5; min-height:18px; margin-top:var(--e3); color:var(--texto-2); }
  .aviso.mal{ color:#9E2F26; } .aviso.bien{ color:#3F5230; }
  .cargando{ display:grid; place-items:center; min-height:100%; color:var(--texto-3);
             font-size:11px; letter-spacing:.22em; text-transform:uppercase; }

  /* ── impresión: solo el documento del cajón ────────────────────────── */
  @media print{
    body.imprimiendo > *:not(#suiCajon){ display:none !important; }
    #suiCajon{ position:static; width:auto; height:auto; transform:none;
               box-shadow:none; border:none; }
    #suiCajon .sui-cajon-cab, #suiCajon .sui-cajon-pie{ display:none; }
    #suiCajon .sui-cajon-cuerpo{ overflow:visible; padding:0; }
    /* la hoja recupera su tamaño real: es un A4 y sale como un A4 */
    .sheet{ zoom:1; box-shadow:none; width:210mm; min-height:297mm; }
    .hoja-scroll{ display:block; overflow:visible; }
  }
  /* Sin margen: el margen ya lo lleva la propia hoja (15/16mm), y sumar los dos
     empujaba la factura a una segunda página. Mismo criterio que la herramienta. */
  @page{ size:A4; margin:0; }
</style>

(function(){

         descargar:'Download signed contract', imprimir:'Print or save as PDF', cerrar:'Close',
         factura:'Invoice', recibi:'Receipt', proforma:'Proforma',
         f_numero:'No.', f_tipo:'Type', f_fecha:'Date', f_total:'Amount', total:'Total',
         f_cliente:'Client', f_proyecto:'Project', f_concepto:'Description', f_importe:'Amount',
         f_subtotal:'Subtotal', f_banco:'Payment details',
         r_inversion:'Your investment', r_pagado:'Paid', r_pendiente:'Outstanding',

         err_carga:'We could not load your information. Reload the page or try again later.' }
  };
  var LANG = localStorage.getItem('lw_portal_lang') ||
             ((navigator.language || 'es').slice(0,2) === 'es' ? 'es' : 'en');
  function t(k){ return (T[LANG] && T[LANG][k]) || T.es[k] || k; }
  function aplicaLang(){
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = t(el.getAttribute('data-t')); });
    document.getElementById('btnLang').textContent = LANG === 'es' ? 'EN' : 'ES';
  }

  /* ── utilidades ───────────────────────────────────────────────────── */
  // Importes tal y como los teclea el equipo: "69.000", "5000", "20.000,50".
  function num(v){
    if (v == null || v === '') return NaN;
    if (typeof v === 'number') return v;
    var s = String(v).replace(/\s/g,'').replace(/\./g,'').replace(',','.');
    var n = parseFloat(s); return isNaN(n) ? NaN : n;
  }
  function dinero(n, moneda){
    if (n == null || isNaN(n)) return '—';
    // `useGrouping:'always'` porque el español no agrupa los números de cuatro
    // cifras: en el plan de pagos salía «5000 €» encima de «20.000 €».
    try { return new Intl.NumberFormat(LANG === 'es' ? 'es-ES' : 'en-GB',
            { style:'currency', currency:(moneda || 'EUR'), maximumFractionDigits:0,
              useGrouping:'always' }).format(n); }
    catch(e){ return n.toLocaleString() + ' ' + (moneda || ''); }
  }
  function fecha(f){
    if (!f) return '';
    var d = new Date(f); if (isNaN(d)) return esc(f);
    return d.toLocaleDateString(LANG === 'es' ? 'es-ES' : 'en-GB', { day:'numeric', month:'short', year:'numeric' });
  }

  var DATOS = null;
  function muestra(vista){
    ['vCarga','vLogin','vApp'].forEach(function(id){ document.getElementById(id).hidden = (id !== vista); });
  }
  aplicaLang();

  /* ── RUTAS: la URL dice siempre dónde estás ─────────────────────────
     Rutas: #/contratos · #/facturas · #/obra · #/facturas/INV00001
     Una sola palabra por sección: la primera versión leía `#/factura/NUM` en
     singular y escribía `#/facturas/NUM` en plural, así que el enlace a un
     documento cambiaba la URL y no abría nada. El `#` pelado del enlace del
     correo se sustituye por la ruta limpia en cuanto supabase-js lo consume. */
  var SECCIONES = ['contratos','facturas','obra','documentos'];
  var RUTA = { sec:'contratos', doc:null };

  function leeHash(){
    var partes = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
    if (SECCIONES.indexOf(partes[0]) !== -1)
      return { sec:partes[0], doc:partes[1] ? decodeURIComponent(partes[1]) : null };
    return { sec:'contratos', doc:null };
  }
  function vasA(sec, doc, reemplaza){
    var url = '#/' + sec + (doc ? '/' + encodeURIComponent(doc) : '');
    if (reemplaza){ history.replaceState(null, '', url); aplicaRuta(); }
    else location.hash = url;
  }
  function aplicaRuta(){
    RUTA = leeHash();
    document.getElementById('secContratos').hidden  = RUTA.sec !== 'contratos';
    document.getElementById('secFacturas').hidden   = RUTA.sec !== 'facturas';
    document.getElementById('secObra').hidden       = RUTA.sec !== 'obra';
    document.getElementById('secDocumentos').hidden = RUTA.sec !== 'documentos';
    document.querySelectorAll('#chips .sui-chip').forEach(function(b){
      b.classList.toggle('on', b.dataset.sec === RUTA.sec);
    });
    var docAbierto = suiCajonAbierto() ? document.getElementById('suiCajon').dataset.doc : null;
    if (RUTA.doc){
      if (docAbierto !== RUTA.doc){
        var f = (DATOS && DATOS.facturas || []).filter(function(x){ return x.numero === RUTA.doc; })[0];
        if (f) abreFactura(f); else vasA(RUTA.sec, null, true);
      }
    } else if (docAbierto) suiCerrarCajon();
  }
  window.addEventListener('hashchange', aplicaRuta);

  /* ── arranque ─────────────────────────────────────────────────────── */
  sb.auth.getSession().then(function(r){
    var ses = r && r.data && r.data.session;
    if (!ses){ muestra('vLogin'); return; }
    if (!((ses.user && ses.user.app_metadata) || {}).portal){ location.replace('/intranet/'); return; }
    document.getElementById('who').textContent = ses.user.email || '';
    cargar();
  }).catch(function(){ muestra('vLogin'); });

  sb.auth.onAuthStateChange(function(ev, ses){
    if (ev === 'SIGNED_IN' && ses && (ses.user.app_metadata || {}).portal &&
        document.getElementById('vApp').hidden){
      document.getElementById('who').textContent = ses.user.email || '';
      cargar();
    }
  });

  /* ── entrada ──────────────────────────────────────────────────────── */
  document.getElementById('fLogin').addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('inEmail').value.trim().toLowerCase();
    var aviso = document.getElementById('avisoLogin');
    aviso.className = 'aviso'; aviso.textContent = '…';
    sb.auth.signInWithOtp({
      email: email,
      options: { shouldCreateUser:false, emailRedirectTo: location.origin + '/portal/' }
    }).then(function(r){
      aviso.className = 'aviso ' + (r.error ? 'mal' : 'bien');
      aviso.textContent = r.error ? t('sin_acceso') : t('enviado');
    });
  });

  document.getElementById('btnSalir').addEventListener('click', function(){
    sb.auth.signOut().then(function(){ location.replace('/portal/'); });
  });
  document.getElementById('btnLang').addEventListener('click', function(){
    LANG = LANG === 'es' ? 'en' : 'es';
    localStorage.setItem('lw_portal_lang', LANG);
    aplicaLang(); if (DATOS){ suiCerrarCajon(); pinta(); }
  });

  /* ── datos ────────────────────────────────────────────────────────── */
  function cargar(){
    muestra('vCarga');
    /* Las cuentas de cobro ya no viven en entities.js (6-ago-2026: ese fichero
       se sirve sin login y está en el repo público). Se cargan de la base, donde
       la RLS las abre a `authenticated` — el comprador lo es, y las necesita:
       son los datos con los que paga, y documentoHTML() los imprime en SU
       factura. Si fallan, la factura se enseña igual pero sin el bloque
       bancario, así que se dice en voz alta en vez de dejar un hueco mudo. */
    cargarCuentasBancarias(sb).catch(function(e){
      console.warn('cuentas de cobro no disponibles:', e && e.message);
    }).then(function(){
    sb.rpc('portal_situacion').then(function(r){
      if (r.error){
        muestra('vLogin');
        var aviso = document.getElementById('avisoLogin');
        aviso.className = 'aviso mal'; aviso.textContent = t('err_carga');
        return;
      }
      DATOS = r.data || {};
      muestra('vApp');
      pinta();
      var r0 = leeHash();
      vasA(r0.sec, r0.doc, true);   // ruta limpia y legible desde el primer momento
    });
    });   // cierra el then() de cargarCuentasBancarias
  }

  /* ── reparto de cobro entre hitos ───────────────────────────────────
     "Pagado" = las facturas y recibos no anulados cubren el acumulado del
     hito, el MISMO criterio que usan las herramientas internas. El reparto
     es secuencial: lo cobrado va tapando hitos por orden. */
  function estadosHitos(hitos, cobrado, precio){
    var resto = cobrado || 0;
    return (hitos || []).map(function(h){
      var m = num(h.monto);
      if (isNaN(m)){ var p = num(h.pct); m = (!isNaN(p) && precio) ? precio * p / 100 : NaN; }
      var est;
      if (isNaN(m)) est = 'pendiente';
      else if (resto >= m - 0.005){ est = 'pagado'; resto -= m; }
      else if (resto > 0.005){ est = 'parcial'; resto = 0; }
      else est = 'pendiente';
      return { hito:h, monto:m, estado:est };
    });
  }
  var TAG = { pagado:'ok', parcial:'espera', pendiente:'gris' };

  /* ── pintado ──────────────────────────────────────────────────────── */
  function pinta(){
    var d = DATOS;
    var nombre = d.nombre ? String(d.nombre).trim().split(/\s+/)[0] : '';
    document.getElementById('saludo').textContent = (LANG === 'es' ? 'Hola' : 'Hello') + (nombre ? ', ' + nombre : '');

    /* resumen y filtros: los componentes de la suite, no unos propios */
    var tot = 0, cob = 0;
    (d.contratos||[]).forEach(function(c){
      var p = (c.precio != null) ? Number(c.precio) : num(c.precio_txt);
      if (!isNaN(p)) tot += p;
      cob += Number(c.cobrado) || 0;
    });
    var mon = ((d.contratos||[])[0] || {}).moneda || 'EUR';
    var res = document.getElementById('resumen');
    res.hidden = !(tot > 0);
    if (tot > 0) res.innerHTML =
      t('r_inversion') + ' <b>' + esc(dinero(tot, mon)) + '</b>' +
      '<span>' + t('r_pagado') + ' <b>' + esc(dinero(cob, mon)) + '</b></span>' +
      '<span>' + t('r_pendiente') + ' <b>' + esc(dinero(Math.max(0, tot - cob), mon)) + '</b></span>';

    var cuentas = { contratos:(d.contratos||[]).length, facturas:(d.facturas||[]).length,
                    obra:(d.obra||[]).length,
                    documentos:(d.documentos||[]).length + (d.kyc||[]).length };
    document.getElementById('chips').innerHTML = SECCIONES.map(function(s){
      return '<button type="button" class="sui-chip' + (cuentas[s] ? '' : ' vacio') + '" data-sec="' + s + '">' +
             esc(t('c_' + s)) + '<span class="n">' + cuentas[s] + '</span></button>';
    }).join('');

    /* contratos */
    var cont = document.getElementById('secContratos');
    if (!(d.contratos||[]).length){
      cont.innerHTML = nada(t('sin_contratos_t'), t('sin_contratos'));
    } else {
      cont.innerHTML = d.contratos.map(function(c){
        var precio = (c.precio != null) ? Number(c.precio) : num(c.precio_txt);
        var cobrado = Number(c.cobrado) || 0;
        var pct = (precio > 0) ? Math.min(100, Math.round(cobrado / precio * 100)) : null;
        var hs = estadosHitos(c.hitos, cobrado, precio);
        return '<div class="op">' +
          '<div class="op-cab"><h2>' + esc(c.numero) + '</h2>' +
            '<span class="sub">' + esc(c.proyecto || '') +
              (c.parcela ? ' · ' + esc(t('unidad')) + ' ' + esc(c.parcela) : '') + '</span>' +
            '<span class="sui-tag ' + (c.firmado ? 'ok' : 'espera') + '">' +
              esc(c.firmado ? t('firmado') : t('pendiente_firma')) + '</span></div>' +
          '<dl class="sui-dl">' +
            '<dt>' + esc(t('precio')) + '</dt><dd>' + (precio ? esc(dinero(precio, c.moneda)) : esc(c.precio_txt || '—')) + '</dd>' +
            (c.fecha_firma ? '<dt>' + esc(t('fecha_firma')) + '</dt><dd>' + esc(fecha(c.fecha_firma)) + '</dd>' : '') +
            '<dt>' + esc(t('cobrado')) + '</dt><dd>' + esc(dinero(cobrado, c.moneda)) + '</dd>' +
          '</dl>' +
          (precio > 0 ? '<div class="barra"><i style="width:' + pct + '%"></i></div>' +
            '<div class="barra-leg"><span>' + pct + '% ' + esc(t('de')) + ' ' + esc(dinero(precio, c.moneda)) + '</span>' +
            '<span>' + esc(dinero(Math.max(0, precio - cobrado), c.moneda)) + ' ' + esc(t('pendiente')).toLowerCase() + '</span></div>' : '') +
          (hs.length ? '<div class="sui-bloque" style="margin-top:var(--e4)"><h3>' + esc(t('plan_pagos')) + '</h3>' +
            '<table class="sui-tabla"><thead><tr><th>' + esc(t('concepto')) + '</th><th>' + esc(t('cuando')) + '</th>' +
            '<th class="num">' + esc(t('importe')) + '</th><th>' + esc(t('estado')) + '</th></tr></thead><tbody>' +
            hs.map(function(x){
              var descr = x.hito[LANG] || x.hito.es || x.hito.en || '';
              return '<tr style="cursor:default"><td>' + esc(descr || '—') + '</td>' +
                '<td class="flojo">' + esc(x.hito.timing || '') + '</td>' +
                '<td class="num">' + (isNaN(x.monto) ? '—' : esc(dinero(x.monto, c.moneda))) + '</td>' +
                '<td><span class="sui-tag ' + TAG[x.estado] + '">' + esc(t(x.estado)) + '</span></td></tr>';
            }).join('') + '</tbody></table></div>' : '') +
          (c.pdf ? '<div class="op-pie"><button type="button" class="sui-btn" data-pdf="' + esc(c.pdf) + '">' +
                   esc(t('descargar')) + '</button></div>' : '') +
        '</div>';
      }).join('');
    }

    /* facturas — tabla de la suite, y el documento en el cajón */
    var lf = document.getElementById('secFacturas');
    if (!(d.facturas||[]).length){
      lf.innerHTML = nada(t('sin_facturas_t'), t('sin_facturas'));
    } else {
      lf.innerHTML = '<div class="sui-tabla-caja"><table class="sui-tabla"><thead><tr>' +
        '<th>' + esc(t('f_numero')) + '</th><th>' + esc(t('f_tipo')) + '</th>' +
        '<th>' + esc(t('f_fecha')) + '</th><th class="num">' + esc(t('f_total')) + '</th>' +
        '</tr></thead><tbody>' +
        d.facturas.map(function(f){
          return '<tr data-fac="' + esc(f.numero) + '">' +
            '<td class="clave">' + esc(f.numero) + '</td>' +
            '<td>' + esc(t(f.tipo) === f.tipo ? f.tipo : t(f.tipo)) + '</td>' +
            '<td class="flojo">' + esc(fecha(f.fecha)) + '</td>' +
            '<td class="num">' + esc(dinero(Number(f.total), f.moneda)) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }

    /* obra */
    var lo = document.getElementById('secObra');
    var fases = d.fases || [];
    if (!(d.obra||[]).length){
      lo.innerHTML = nada(t('sin_obra_t'), t('sin_obra'));
    } else {
      lo.innerHTML = d.obra.map(function(u){
        var idx = fases.map(function(f){ return f.clave; }).indexOf(u.fase);
        return '<div class="op">' +
          '<div class="op-cab"><h2>' + esc(u.unidad) + '</h2>' +
            '<span class="sub">' + esc(u.proyecto || '') + (u.contrato_numero ? ' · ' + esc(u.contrato_numero) : '') + '</span></div>' +
          (fases.length ? '<div class="fases">' + fases.map(function(f, i){
            return '<span class="fase ' + (i < idx ? 'hecha' : (i === idx ? 'actual' : '')) + '">' +
                   esc(f[LANG] || f.es) + '</span>'; }).join('') + '</div>' : '') +
          '<dl class="sui-dl" style="margin-top:var(--e4)">' +
            (u.fecha_entrega ? '<dt>' + esc(t('entrega_est')) + '</dt><dd>' + esc(fecha(u.fecha_entrega)) + '</dd>' : '') +
            (u.actualizado ? '<dt>' + esc(t('actualizado')) + '</dt><dd>' + esc(fecha(u.actualizado)) + '</dd>' : '') +
          '</dl>' +
          ((u.fotos||[]).length ? '<div class="fotos">' + u.fotos.map(function(ft){
            return '<figure><img loading="lazy" data-foto="' + esc(ft.path) + '" alt="' + esc(ft.titulo || '') + '">' +
                   '<figcaption>' + esc(ft.titulo || '') + (ft.fecha ? ' · ' + esc(fecha(ft.fecha)) : '') + '</figcaption></figure>';
          }).join('') + '</div>' : '') +
        '</div>';
      }).join('');
      cargaFotos();
    }

    /* documentos: lo compartido por el equipo y lo que él mismo entregó */
    var ld = document.getElementById('secDocumentos');
    var docs = d.documentos || [], kyc = d.kyc || [];
    if (!docs.length && !kyc.length){
      ld.innerHTML = nada(t('sin_docs_t'), t('sin_docs'));
    } else {
      var html = '';
      if (docs.length) html +=
        '<div class="sui-bloque" style="margin-bottom:var(--e4)"><h3>' + esc(t('d_promocion')) + '</h3>' +
        '<table class="sui-tabla" style="min-width:0"><tbody>' + docs.map(function(x){
          return '<tr data-doc="' + esc(x.id) + '">' +
            '<td><span class="clave">' + esc(x.titulo) + '</span>' +
              (x.descripcion ? '<div class="flojo">' + esc(x.descripcion) + '</div>' : '') + '</td>' +
            '<td class="docrow-cat">' + esc(x.categoria || '') + '</td>' +
            '<td class="flojo">' + esc(x.proyecto || '') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      if (kyc.length) html +=
        '<div class="sui-bloque"><h3>' + esc(t('d_entregado')) + '</h3>' +
        '<table class="sui-tabla" style="min-width:0"><tbody>' + kyc.map(function(x){
          var cad = x.caduca ? new Date(x.caduca) : null;
          var vencido = cad && cad < new Date();
          return '<tr data-kyc="' + esc(x.path) + '">' +
            '<td><span class="clave">' + esc(t('doc_' + x.tipo) === 'doc_' + x.tipo ? x.tipo : t('doc_' + x.tipo)) + '</span></td>' +
            '<td class="flojo">' + esc(fecha(x.subido)) + '</td>' +
            '<td' + (vencido ? ' class="caduca-mal"' : ' class="flojo"') + '>' +
              (x.caduca ? esc(t('caduca') + ' ' + fecha(x.caduca)) : '') + '</td></tr>';
        }).join('') + '</tbody></table>' +
        '<p class="sui-nota">' + esc(t('d_entregado_nota')) + '</p></div>';
      ld.innerHTML = html;
    }

    aplicaRuta();
  }

  function nada(titulo, texto){
    return '<div class="sui-tabla-caja"><div class="sui-nada"><b>' + esc(titulo) + '</b>' + esc(texto) + '</div></div>';
  }

  /* ── interacción ──────────────────────────────────────────────────── */
  document.getElementById('chips').addEventListener('click', function(e){
    var b = e.target.closest('.sui-chip'); if (!b) return;
    vasA(b.dataset.sec, null);
    document.querySelector('.sui-stage').scrollTop = 0;
  });

  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-pdf]');
    if (b){
      b.disabled = true;
      sb.storage.from('contratos-firmados').createSignedUrl(b.getAttribute('data-pdf'), 600)
        .then(function(r){
          b.disabled = false;
          if (r.data && r.data.signedUrl) window.open(r.data.signedUrl, '_blank');
          else toast(t('err_carga'));
        });
      return;
    }
    var tr = e.target.closest('tr[data-fac]');
    if (tr){ vasA('facturas', tr.getAttribute('data-fac')); return; }

    /* documentación compartida: enlace externo o fichero del almacén */
    var fd = e.target.closest('tr[data-doc]');
    if (fd){
      var doc = (DATOS.documentos || []).filter(function(x){ return String(x.id) === fd.getAttribute('data-doc'); })[0];
      if (!doc) return;
      if (doc.url){ window.open(doc.url, '_blank', 'noopener'); return; }
      abreFichero('documentacion', doc.path);
      return;
    }
    var fk = e.target.closest('tr[data-kyc]');
    if (fk){ abreFichero('kyc', fk.getAttribute('data-kyc')); return; }

    var img = e.target.closest('.fotos img');
    if (img && img.src) ampliaFoto(img.src);
  });

  /* Nunca una URL fija a un fichero privado: se pide una firmada de 10 minutos
     en el momento de abrirlo (mismo criterio que el KYC de la intranet). */
  function abreFichero(bucket, path){
    if (!path) return;
    sb.storage.from(bucket).createSignedUrl(path, 600).then(function(r){
      if (r.data && r.data.signedUrl) window.open(r.data.signedUrl, '_blank', 'noopener');
      else toast(t('err_fichero'));
    });
  }

  function cargaFotos(){
    document.querySelectorAll('img[data-foto]').forEach(function(img){
      var p = img.getAttribute('data-foto'); img.removeAttribute('data-foto');
      sb.storage.from('obra').createSignedUrl(p, 3600).then(function(r){
        if (r.data && r.data.signedUrl) img.src = r.data.signedUrl;
      });
    });
  }

  function ampliaFoto(src){
    var l = document.createElement('div');
    l.className = 'lupa';
    l.innerHTML = '<img src="' + esc(src) + '" alt="">';
    l.addEventListener('click', function(){ l.remove(); });
    document.addEventListener('keydown', function h(ev){
      if (ev.key === 'Escape'){ l.remove(); document.removeEventListener('keydown', h); }
    });
    document.body.appendChild(l);
  }

  /* ── el documento REAL, en el CAJÓN lateral (norma de la suite) ─────
     Se arma con `documentoHTML()`, la misma función que usa la herramienta de
     Facturas y la Edge que emite la factura del primer hito. Lo que ve el
     comprador es el documento tal y como se emitió, con su sociedad, su logo y
     sus datos bancarios — no una versión parecida mantenida aparte. */
  function abreFactura(f){
    if (!f) return;
    /* `documentoHTML` da por hecho que `lineas` es un array (las 19 facturas de
       hoy lo traen). Se normaliza igualmente: un campo que falte en un documento
       viejo dejaría la pantalla en blanco, y el comprador no tiene a quién
       preguntar ni forma de saber que el fallo no es suyo. */
    var campos = Object.assign({}, f.fields || {});
    if (!Array.isArray(campos.lineas)) campos.lineas = Array.isArray(f.lineas) ? f.lineas : [];
    var soc = (typeof SOCIEDADES !== 'undefined' && SOCIEDADES[campos.sociedad]) || {};
    var v = documentoVars(soc);
    var estilo = function(k){
      return Object.keys(v[k]).filter(function(p){ return v[k][p]; })
             .map(function(p){ return p + ':' + v[k][p]; }).join(';');
    };
    suiAbrirCajon({
      titulo: esc(f.numero),
      sub: esc((t(f.tipo) === f.tipo ? f.tipo : t(f.tipo)) + ' · ' + fecha(f.fecha)),
      cuerpo: '<div class="hoja-scroll"><div class="sheet" style="' + estilo('hoja') + '">' +
                '<div class="doc" style="' + estilo('doc') + '">' +
                  documentoHTML(campos, { numero: f.numero }) +
                '</div></div></div>',
      pie: '<button type="button" class="sui-btn primario" id="btnImprimir">' + esc(t('imprimir')) + '</button>' +
           '<button type="button" class="sui-btn" id="btnCerrarDoc">' + esc(t('cerrar')) + '</button>',
      // Cerrar el cajón devuelve la URL a la sección. Si el cierre vino de un
      // cambio de ruta, `RUTA.doc` ya es nulo y esto no hace nada: sin ese
      // detalle, cerrar y navegar se llamarían el uno al otro.
      onCerrar: function(){ if (RUTA.doc) vasA(RUTA.sec, null); }
    });
    document.getElementById('suiCajon').dataset.doc = f.numero;
    document.getElementById('btnCerrarDoc').onclick = suiCerrarCajon;
    document.getElementById('btnImprimir').onclick = function(){
      document.body.classList.add('imprimiendo');
      window.print();
      document.body.classList.remove('imprimiendo');
    };
  }

  suiMontarCajon();
})();
</script>
</body>
</html>
