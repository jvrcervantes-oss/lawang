<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.png">
<title>Lawang · Área de clientes</title>
<!-- Diseño nuevo instalado tal cual (31-ago-2026, encargo del owner) desde
     Claude Design ("Área de Clientes.dc.html") — decisión consciente de
     volver a un sistema visual PROPIO del portal, distinto de `lawang.css`
     que usa el resto de la suite desde el 27-ago. No es un olvido de aquella
     unificación: es un cambio de idea, y va dicho aquí para que quien lo lea
     en seis meses no lo confunda con uno. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;600&family=Instrument+Sans:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9/dist/umd/supabase.min.js" integrity="sha384-XtYxyIfxexJVTROWK0+c5T8tJ2ItsVLcdgR5nJIoo6WzQqaBZoTPGgbS7XvkRNBZ" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<!-- EL DOCUMENTO DE VERDAD, sin tocar (ver la nota que ya llevaba este
     fichero): `documento.js` es la fuente única de la maquetación de una
     factura, la misma que usan la herramienta de Facturas y la Edge que
     emite la del primer hito. El comprador ve EXACTAMENTE el documento que
     emitió el equipo, no una reconstrucción parecida. `entities.js` trae los
     datos bancarios dentro de la propia factura. -->
<link rel="stylesheet" href="/intranet/facturas/documento.css?v=20260731">
<script src="/contracts/assets/entities.js?v=5f9da647"></script>
<script src="/contracts/assets/dinero.js?v=ced29282"></script>
<script src="/intranet/facturas/totales.js"></script>
<script src="/intranet/facturas/documento.js?v=20260731"></script>
<style>
  :root{
    --tg:#485B37; --dl:#104C4F; --be:#42210B; --sc:#8F9B7A; --va:#2E3437;
    --ss:#BEB3A5; --rl:#F5F0E6; --bc:#8A8474; --ok:#3F5230; --bad:#9E2F26;
  }
  *{ box-sizing:border-box; } html,body{ margin:0; height:100%; }
  body{ font-family:'Jost',sans-serif; color:var(--va); background:var(--rl); min-height:100vh;
        -webkit-font-smoothing:antialiased; }
  [hidden]{ display:none !important; }
  input::placeholder, textarea::placeholder{ color:#a8a394; }
  button{ font-family:inherit; }

  /* ── carga ─────────────────────────────────────────────────────────── */
  .cargando{ min-height:100vh; display:grid; place-items:center; color:var(--bc);
             font-size:11px; letter-spacing:.22em; text-transform:uppercase; }

  /* ── login ─────────────────────────────────────────────────────────── */
  .entrada{ min-height:100vh; display:grid; place-items:center; background:var(--rl); padding:24px; }
  .entrada .caja{ width:100%; max-width:400px; background:#fff; border:1px solid #E4DCCB; border-radius:16px;
                  padding:44px 34px 38px; box-shadow:0 18px 48px -22px rgba(34,40,42,.35); text-align:center; }
  .entrada .marca{ font-family:'Cormorant Garamond',Georgia,serif; font-size:30px; font-weight:600;
                    letter-spacing:.12em; color:var(--dl); line-height:1; }
  .entrada .rot{ font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--sc); margin:8px 0 28px; }
  .entrada p{ font-size:13.5px; color:#6b6c66; margin:0 0 20px; line-height:1.55; }
  .entrada input{ width:100%; font:inherit; font-size:15px; padding:12px 13px; text-align:center;
                   border:1px solid #E4DCCB; border-radius:9px; background:#fdfcf9; color:inherit; margin-bottom:14px; }
  .entrada input:focus{ outline:none; border-color:var(--dl); box-shadow:0 0 0 3px rgba(16,76,79,.13); }
  .btn-primario{ width:100%; font:inherit; font-size:13.5px; font-weight:600; color:#fff; background:var(--dl);
                  border:1px solid var(--dl); border-radius:999px; padding:12px; cursor:pointer; white-space:nowrap; }
  .btn-primario:disabled{ opacity:.55; cursor:default; }
  .aviso{ font-size:12.5px; line-height:1.5; min-height:18px; margin-top:14px; color:#8a8570; }
  .aviso.mal{ color:var(--bad); } .aviso.bien{ color:var(--ok); font-weight:600; }
  .link-sutil{ color:var(--dl); text-decoration:none; }
  .link-sutil:hover{ text-decoration:underline; }

  /* ── app: sidebar + topbar + contenido ────────────────────────────── */
  .app{ display:flex; min-height:100vh; }
  .sidebar{ background:var(--dl); display:flex; flex-direction:column; flex-shrink:0; }
  .sidebar .cab{ display:flex; align-items:center; justify-content:space-between; margin-bottom:32px; }
  .sidebar .cab img{ height:26px; }
  .sidebar .cab button{ background:none; border:none; color:rgba(255,255,255,.7); font-size:20px; cursor:pointer; line-height:1; }
  .sidebar .rot{ font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.45);
                 margin:0 0 18px; padding:0 4px; }
  .navrow{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 16px;
           border-radius:10px; cursor:pointer; font-size:14px; margin-bottom:2px; color:rgba(255,255,255,.72); background:none; border:none; width:100%; text-align:left; font-family:inherit; }
  .navrow:hover{ background:rgba(255,255,255,.08); }
  .navrow.on{ font-weight:600; background:rgba(255,255,255,.14); color:#fff; }
  .navrow .badge{ background:var(--bad); color:#fff; font-size:11px; font-weight:600; min-width:18px; height:18px;
                  border-radius:9px; display:inline-flex; align-items:center; justify-content:center; padding:0 5px; }
  .sidebar .pie{ margin-top:auto; padding-top:20px; border-top:1px solid rgba(255,255,255,.12);
                 display:flex; align-items:center; gap:10px; }
  .avatar{ width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.14); color:#fff;
           font-size:12.5px; font-weight:600; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .pie .quien{ min-width:0; }
  .pie .nombre{ color:#fff; font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pie a{ color:rgba(255,255,255,.55); font-size:11.5px; }

  .overlay-sidebar{ position:fixed; inset:0; background:rgba(34,40,42,.45); z-index:60; }

  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar2{ display:flex; align-items:center; gap:14px; background:#fff; border-bottom:1px solid rgba(138,132,116,.25);
            position:sticky; top:0; z-index:30; }
  .topbar2 .hamb{ background:none; border:none; font-size:20px; cursor:pointer; color:var(--va); padding:4px 6px 4px 0; }
  .topbar2 h1{ margin:0; font-size:19px; font-weight:500; color:var(--va); flex:1; }
  .campana{ position:relative; }
  .campana button{ background:none; border:1px solid rgba(138,132,116,.4); border-radius:999px; width:36px; height:36px;
                    cursor:pointer; font-size:15px; position:relative; }
  .campana .n{ position:absolute; top:-3px; right:-3px; background:var(--bad); color:#fff; font-size:10px; font-weight:700;
               min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .notif-drop{ position:absolute; top:44px; right:0; width:300px; max-width:80vw; background:#fff;
               border:1px solid rgba(138,132,116,.35); border-radius:14px; box-shadow:0 14px 32px -16px rgba(34,40,42,.3);
               z-index:45; padding:14px; }
  .notif-drop .cab{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .notif-drop .cab span{ font-size:12.5px; font-weight:600; }
  .notif-fila{ display:flex; gap:8px; padding:8px 0; border-top:1px solid rgba(138,132,116,.18); }
  .notif-fila .punto{ width:7px; height:7px; border-radius:50%; flex-shrink:0; margin-top:5px; }
  .notif-fila .txt{ font-size:12.5px; line-height:1.4; color:var(--va); }
  .notif-fila .fec{ font-size:11px; color:#a8a394; margin-top:2px; }

  .content{ padding:30px 40px 60px; max-width:960px; margin:0 auto; width:100%; }

  .titulo-sec{ margin:0 0 24px; }
  .titulo-sec h2{ margin:0; font-size:23px; font-weight:500; }
  .titulo-sec p{ margin:4px 0 0; font-size:14px; color:#6b6c66; }

  .tarjeta{ background:#fff; border:1px solid rgba(138,132,116,.35); border-radius:16px; padding:20px 22px; }
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:28px; }
  .kpi .lbl{ font-size:11.5px; color:#8a8570; text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; }
  .kpi .val{ font-family:'Instrument Sans',sans-serif; font-size:26px; font-weight:700; color:var(--va); }
  .kpi .val.ok{ color:var(--ok); }

  .grid2col{ display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:16px; margin-bottom:28px; }
  @media (max-width:760px){ .grid2col{ grid-template-columns:1fr; } }
  .rot-bloque{ font-size:12px; font-weight:600; color:#8a8570; text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }
  .btn-borde{ font:inherit; font-size:13px; font-weight:600; color:var(--dl); background:#fff;
              border:1px solid rgba(138,132,116,.5); border-radius:999px; padding:9px 18px; cursor:pointer; white-space:nowrap; }
  .btn-borde:disabled{ opacity:.5; cursor:default; }
  .btn-oscuro{ font:inherit; font-size:13px; font-weight:600; color:#fff; background:var(--dl); border:1px solid var(--dl);
               border-radius:999px; padding:10px 18px; cursor:pointer; white-space:nowrap; }

  .accesos{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
  .acceso{ background:#fff; border:1px solid rgba(138,132,116,.35); border-radius:14px; padding:16px 18px; cursor:pointer;
           font:inherit; text-align:left; }
  .acceso .t{ font-size:13.5px; font-weight:500; }
  .acceso .s{ font-size:12px; color:#8a8570; margin-top:3px; }

  .op{ background:#fff; border:1px solid rgba(138,132,116,.35); border-radius:16px; padding:22px 24px 24px; margin-bottom:18px;
       box-shadow:0 1px 2px rgba(46,52,55,.04),0 10px 28px -18px rgba(46,52,55,.18); }
  .op-cab{ display:flex; gap:16px; }
  .op-cab img{ width:88px; height:88px; border-radius:12px; flex-shrink:0; object-fit:cover; background:#E7E1D2; }
  .op-cab .info{ flex:1; min-width:0; }
  .op-cab h3{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:0; }
  .op-cab h3 b{ font-size:16px; font-weight:600; letter-spacing:.03em; color:var(--dl); }
  .op-cab h3 span.sub{ font-size:12.5px; color:#6b6c66; }
  .tag{ margin-left:auto; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:4px 10px;
        border-radius:999px; white-space:nowrap; }
  .tag.chico{ font-size:10.5px; padding:3px 9px; }
  .op-datos{ display:flex; gap:28px; margin-top:14px; flex-wrap:wrap; }
  .op-datos .d .lbl{ font-size:11px; color:#8a8570; text-transform:uppercase; }
  .op-datos .d .val{ font-size:14px; margin-top:2px; }
  .barra{ height:7px; border-radius:4px; background:#E7E1D2; overflow:hidden; margin:16px 0 6px; }
  .barra i{ display:block; height:100%; background:var(--ok); }
  .barra-leg{ display:flex; justify-content:space-between; font-size:12px; color:#6b6c66; margin-bottom:16px; }

  table.docs{ width:100%; border-collapse:collapse; margin-top:6px; }
  table.docs th{ text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#8a8570;
                 font-weight:600; padding:8px 6px; border-bottom:1px solid rgba(138,132,116,.3); }
  table.docs th.num{ text-align:right; }
  table.docs td{ padding:11px 6px; font-size:13.5px; border-bottom:1px solid rgba(138,132,116,.18); }
  table.docs td.num{ text-align:right; }
  table.docs td.flojo{ font-size:13px; color:#6b6c66; }
  .op-pie{ margin-top:16px; }

  .tabla-caja{ background:#fff; border:1px solid rgba(138,132,116,.35); border-radius:16px; overflow:hidden; }
  .tabla-caja table{ width:100%; border-collapse:collapse; }
  .tabla-caja th{ text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#8a8570;
                  font-weight:600; padding:12px 16px; border-bottom:1px solid rgba(138,132,116,.3); }
  .tabla-caja th.num{ text-align:right; }
  .tabla-caja td{ padding:13px 16px; font-size:13.5px; border-bottom:1px solid rgba(138,132,116,.18); }
  .tabla-caja td.num{ text-align:right; }
  .tabla-caja tr[data-fila]{ cursor:pointer; }
  .tabla-caja tr:last-child td{ border-bottom:0; }
  .clave{ font-weight:500; color:var(--dl); }
  .ir{ font-size:12.5px; color:var(--dl); text-align:right; }

  .fases{ display:flex; flex-wrap:wrap; gap:6px; margin:14px 0 4px; }
  .fase{ font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:5px 11px;
         border:1px solid rgba(138,132,116,.4); border-radius:999px; white-space:nowrap; color:#8a8570; }
  .fase.hecha{ color:#6b6c66; border-color:var(--sc); }
  .fase.actual{ background:var(--ok); border-color:var(--ok); color:#fff; font-weight:600; }
  .fotos{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .fotos figure{ margin:0; cursor:zoom-in; }
  .fotos img{ width:100%; aspect-ratio:4/3; object-fit:cover; display:block; border-radius:10px; background:#E7E1D2; }
  .fotos figcaption{ font-size:11.5px; color:#8a8570; padding-top:4px; }
  .lupa{ position:fixed; inset:0; z-index:120; background:rgba(34,40,42,.72); display:flex; align-items:center;
         justify-content:center; padding:20px; cursor:zoom-out; }
  .lupa img{ max-width:96vw; max-height:92vh; border-radius:10px; }

  .doclista{ background:#fff; border:1px solid rgba(138,132,116,.35); border-radius:16px; overflow:hidden; }
  .docfila{ display:flex; align-items:center; gap:14px; padding:14px 18px; border-bottom:1px solid rgba(138,132,116,.18);
            cursor:pointer; }
  .docfila:last-child{ border-bottom:0; }
  .docfila .cuerpo{ flex:1; min-width:0; }
  .docfila .t{ font-size:13.5px; font-weight:500; }
  .docfila .s{ font-size:11.5px; color:#8a8570; margin-top:2px; }
  .docfila .der{ font-size:12.5px; text-align:right; color:#6b6c66; }
  .docfila .der.mal{ color:var(--bad); font-weight:700; }

  .ticket{ background:#fff; border:1px solid rgba(138,132,116,.35); border-radius:14px; padding:16px 20px;
           margin-bottom:12px; cursor:pointer; }
  .ticket .cab{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .ticket .cab span.asunto{ font-size:14px; font-weight:500; }
  .ticket .ultimo{ font-size:12.5px; color:#6b6c66; margin-top:6px; }
  .ticket .meta{ font-size:11.5px; color:#a8a394; margin-top:6px; }

  .campo{ margin-bottom:12px; }
  .campo label{ display:block; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
                color:#8a8570; margin-bottom:5px; }
  .campo input, .campo select, .campo textarea{ width:100%; font:inherit; font-size:14px; padding:10px 12px;
    border:1px solid rgba(138,132,116,.5); border-radius:9px; background:#fdfcf9; color:inherit; }
  .campo textarea{ resize:vertical; }

  .chat{ background:#fff; border:1px solid rgba(138,132,116,.35); border-radius:16px; display:flex; flex-direction:column;
         height:min(560px,calc(100vh - 220px)); }
  .chat .cab{ padding:14px 20px; border-bottom:1px solid rgba(138,132,116,.25); }
  .chat .cab b{ font-size:14px; }
  .chat .cab .rol{ font-size:12px; color:#8a8570; }
  .chat .hilo{ flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
  .burbuja{ display:inline-block; max-width:280px; padding:10px 14px; font-size:13.5px; line-height:1.5; }
  .burbuja.mia{ background:var(--dl); color:#fff; border-radius:14px 14px 4px 14px; }
  .burbuja.suya{ background:#f4f0e6; color:var(--va); border-radius:14px 14px 14px 4px; }
  .fila-msg{ display:flex; }
  .fila-msg.der{ justify-content:flex-end; }
  .fila-msg .fecha-msg{ font-size:10.5px; color:#a8a394; margin-top:4px; }
  .chat form{ display:flex; gap:10px; padding:14px 18px; border-top:1px solid rgba(138,132,116,.25); }
  .chat form input{ flex:1; font:inherit; font-size:14px; padding:10px 13px; border:1px solid rgba(138,132,116,.5);
                     border-radius:999px; background:#fdfcf9; color:inherit; }

  .toggle{ width:42px; height:24px; border-radius:12px; border:none; cursor:pointer; padding:2px; display:flex;
           align-items:center; background:#d8d2c2; }
  .toggle.on{ background:var(--ok); justify-content:flex-end; }
  .toggle:not(.on){ justify-content:flex-start; }
  .toggle i{ width:18px; height:18px; border-radius:50%; background:#fff; display:block; }
  .pref-fila{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid rgba(138,132,116,.18); }
  .pref-fila:last-child{ border-bottom:0; }

  .vacio{ padding:30px 20px; text-align:center; color:#8a8570; }
  .vacio b{ display:block; color:var(--va); font-size:14px; margin-bottom:6px; }

  /* ── cajón lateral genérico (drawer) ─────────────────────────────────── */
  .drawer-velo{ position:fixed; inset:0; background:rgba(34,40,42,.45); z-index:70; }
  .drawer{ position:fixed; top:0; right:0; height:100vh; width:min(480px,100vw); background:var(--rl); z-index:71;
           box-shadow:-24px 0 48px -24px rgba(34,40,42,.35); overflow-y:auto; padding:26px 26px 40px; }
  .drawer.ancho{ width:min(720px,100vw); }
  .drawer-cerrar{ display:flex; justify-content:flex-end; margin-bottom:10px; }
  .drawer-cerrar button{ background:none; border:none; font-size:20px; cursor:pointer; color:var(--va); }
  .drawer .hoja{ background:#fff; border-radius:12px; padding:32px 30px; }
  .hoja-scroll{ display:flex; justify-content:center; }
  .sheet{ width:210mm; min-height:297mm; background:var(--folio,#fff); padding:15mm 16mm; zoom:.62; }
  @media screen and (max-width:900px){ .sheet{ zoom:.42; } .hoja-scroll{ overflow-x:auto; justify-content:flex-start; } }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--va); color:#fff;
          padding:11px 20px; border-radius:999px; font-size:13px; z-index:200; opacity:0; transition:opacity .2s; pointer-events:none; }

  /* ── responsive: sidebar/topbar/contenido ────────────────────────────── */
  .sidebar{ position:sticky; top:0; height:100vh; width:236px; padding:26px 18px; }
  .topbar2{ padding:16px 40px; }
  .content{ padding:30px 40px 60px; }
  @media (max-width:880px){
    .sidebar{ position:fixed; top:0; left:0; height:100vh; width:264px; z-index:65; padding:22px 16px;
              transform:translateX(-100%); transition:transform .28s cubic-bezier(.22,.61,.36,1); }
    .sidebar.open{ transform:translateX(0); }
    .topbar2{ padding:14px 16px; }
    .content{ padding:20px 16px 60px; }
  }

  /* ── impresión: solo el documento del cajón ─────────────────────────── */
  @media print{
    body.imprimiendo > *:not(.drawer){ display:none !important; }
    .drawer{ position:static; width:auto; height:auto; box-shadow:none; padding:0; }
    .drawer-cerrar{ display:none; }
    .sheet{ zoom:1; width:210mm; min-height:297mm; }
    .hoja-scroll{ display:block; overflow:visible; }
  }
  @page{ size:A4; margin:0; }
</style>
</head>
<body>

<div id="vCarga" class="cargando">Lawang</div>

<!-- ── entrada ───────────────────────────────────────────────────────── -->
<div id="vLogin" class="entrada" hidden>
  <div class="caja">
    <div class="marca">LAWANG</div>
    <div class="rot" data-t="area">Área de clientes</div>
    <p data-t="login_intro" id="loginIntroEnlace">Introduce el correo con el que compraste. Te enviaremos un enlace de acceso.</p>
    <form id="fLogin">
      <input type="email" id="inEmail" autocomplete="email" required placeholder="tu@correo.com">
      <button class="btn-primario" type="submit" data-t="login_btn">Enviarme el enlace</button>
    </form>
    <p data-t="login_intro_pass" id="loginIntroPass" hidden>Introduce tu correo y tu contraseña.</p>
    <form id="fLoginPass" hidden>
      <input type="email" id="inEmailPass" autocomplete="email" required placeholder="tu@correo.com">
      <input type="password" id="inPass" autocomplete="current-password" required placeholder="••••••••">
      <button class="btn-primario" type="submit" data-t="pass_btn">Entrar</button>
    </form>
    <div id="avisoLogin" class="aviso"></div>
    <p style="margin-top:18px;font-size:12px">
      <a href="#" id="togglePass" class="link-sutil" data-t="pass_toggle">¿Tienes contraseña? Entra con ella</a>
    </p>

  /* ── utilidades ───────────────────────────────────────────────────── */
  function num(v){
    if (v == null || v === '') return NaN;
    if (typeof v === 'number') return v;
    var s = String(v).replace(/\s/g,'').replace(/\./g,'').replace(',','.');
    var n = parseFloat(s); return isNaN(n) ? NaN : n;
  }
  // Deliberadamente NO usa `lwFormatoImporte` — la misma divergencia de
  // diseño que ya llevaba esta página (con símbolo, sin decimales, locale
  // según el idioma de la página): es el plan de pagos que lee el
  // COMPRADOR, no una columna de contabilidad.
  function dinero(n, moneda){
    if (n == null || isNaN(n)) return '—';
    try { return new Intl.NumberFormat(LANG === 'es' ? 'es-ES' : 'en-GB',
            { style:'currency', currency:(moneda || 'EUR'), maximumFractionDigits:0, useGrouping:'always' }).format(n); }
    catch(e){ return n.toLocaleString() + ' ' + (moneda || ''); }
  }
  function fecha(f){
    if (!f) return '';
    var d = new Date(f); if (isNaN(d)) return esc(f);
    return d.toLocaleDateString(LANG === 'es' ? 'es-ES' : 'en-GB', { day:'numeric', month:'short', year:'numeric' });
  }
  function fechaHora(f){
    if (!f) return '';
    var d = new Date(f); if (isNaN(d)) return esc(f);
    return d.toLocaleDateString(LANG === 'es' ? 'es-ES' : 'en-GB', { day:'2-digit', month:'short' }) + ' · ' +
           d.toLocaleTimeString(LANG === 'es' ? 'es-ES' : 'en-GB', { hour:'2-digit', minute:'2-digit' });
  }

  /* ── reparto de cobro entre hitos — igual que antes de este rediseño ── */
  function estadosHitos(hitos, cobrado, precio){
    var resto = cobrado || 0;
    return (hitos || []).map(function(h){
      var m = num(h.monto);
      if (isNaN(m)){ var p = num(h.pct); m = (!isNaN(p) && precio) ? precio * p / 100 : NaN; }
      var est;
      if (isNaN(m)) est = 'pendiente';
      else if (resto >= m - 0.005){ est = 'pagado'; resto -= m; }
      else if (resto > 0.005){ est = 'parcial'; resto = 0; }
      else est = 'pendiente';
      return { hito:h, monto:m, estado:est };
    });
  }

  function vasA(sec, doc, reemplaza){

        ESTADO.section = r0.sec;
        render();
        if (r0.doc) aplicaRuta(false);
      });
    });
  }

  /* ══ NAV ══════════════════════════════════════════════════════════════ */
  var NAV_DEFS = ['inicio','contratos','facturas','obra','documentos','soporte','mensajes','perfil'];
  function pintaNav(){
    var abiertos = ((DATOS && DATOS.tickets) || []).filter(function(x){ return x.estado === 'abierto'; }).length;
    document.getElementById('nav').innerHTML = NAV_DEFS.map(function(k){
      var badge = k === 'soporte' && abiertos ? '<span class="badge">' + abiertos + '</span>' : '';
      return '<button type="button" class="navrow' + (k === ESTADO.section ? ' on' : '') + '" data-nav="' + k + '">' +
             '<span>' + esc(t('nav_' + k)) + '</span>' + badge + '</button>';
    }).join('');
  }
  document.getElementById('nav').addEventListener('click', function(e){
    var b = e.target.closest('[data-nav]'); if (!b) return;
    vasA(b.getAttribute('data-nav'), null);
    cierraSidebar();
  });

  /* ══ CAMPANA — derivada de datos reales (factura reciente, próximo pago,
     obra actualizada, KYC por caducar), no una tabla de eventos aparte:
     el "visto hasta" real vive en preferencias_comprador y lo devuelve
     portal_situacion() en DATOS.prefs.notif_visto_hasta. ══ */
  function novedadesDerivadas(){
    var d = DATOS; if (!d) return [];
    var lista = [];
    (d.facturas || []).slice(0, 3).forEach(function(f){
      lista.push({ texto: (f.tipo === 'factura' ? (LANG==='es'?'Nueva factura disponible: ':'New invoice available: ') : '') + f.numero,
                   fecha: f.fecha, cuando: new Date(f.fecha || 0) });
    });
    (d.obra || []).forEach(function(o){
      if (o.actualizado) lista.push({ texto: (LANG==='es'?'Novedades de obra en ':'Construction update on ') + o.unidad,
                                       fecha: o.actualizado, cuando: new Date(o.actualizado) });
    });
    (d.kyc || []).forEach(function(k){
      if (!k.caduca) return;
      var dias = Math.round((new Date(k.caduca) - new Date()) / 86400000);
      if (dias >= 0 && dias <= 30) lista.push({
        texto: (LANG==='es' ? ('Tu ' + (t('doc_' + k.tipo) === 'doc_' + k.tipo ? k.tipo : t('doc_' + k.tipo)) + ' caduca en ' + dias + ' días')
                             : ('Your ' + (t('doc_' + k.tipo) === 'doc_' + k.tipo ? k.tipo : t('doc_' + k.tipo)) + ' expires in ' + dias + ' days')),
        fecha: k.caduca, cuando: new Date()
      });
    });
    lista.sort(function(a,b){ return b.cuando - a.cuando; });
    return lista.slice(0, 8);
  }
  function pintaCampana(){
    var drop = document.getElementById('notifDrop');
    var n = document.getElementById('notifN');
    var visto = DATOS && DATOS.prefs && DATOS.prefs.notif_visto_hasta ? new Date(DATOS.prefs.notif_visto_hasta) : null;
    var novedades = novedadesDerivadas();
    var sinLeer = visto ? novedades.filter(function(x){ return x.cuando > visto; }).length : novedades.length;
    n.hidden = !sinLeer; n.textContent = sinLeer;
    drop.hidden = !ESTADO.notifOpen;
    if (ESTADO.notifOpen){
      drop.innerHTML = '<div class="cab"><span>' + esc(t('novedades')) + '</span></div>' +
        (novedades.length ? novedades.map(function(x){
          var noLeida = visto ? x.cuando > visto : true;
          return '<div class="notif-fila"><span class="punto" style="background:' + (noLeida?'var(--bad)':'transparent') +
                 ';border:1px solid ' + (noLeida?'var(--bad)':'rgba(138,132,116,.4)') + '"></span>' +
                 '<div><div class="txt">' + esc(x.texto) + '</div><div class="fec">' + esc(fecha(x.fecha)) + '</div></div></div>';
        }).join('') : '<p style="font-size:12.5px;color:#8a8570;margin:6px 0 0">—</p>');
    }
  }

  /* ══ RENDER PRINCIPAL — una función por sección, todas alimentadas por
     DATOS real (portal_situacion) ══ */
  function render(){
    pintaNav();
    pintaCampana();
    document.getElementById('tituloSeccion').textContent = t('tit_' + ESTADO.section);
    var c = document.getElementById('content');
    var fns = { inicio:pintaInicio, contratos:pintaContratos, facturas:pintaFacturas, obra:pintaObra,
                documentos:pintaDocumentos, soporte:pintaSoporte, mensajes:pintaMensajes, perfil:pintaPerfil };
    c.innerHTML = '';
    (fns[ESTADO.section] || pintaInicio)(c);
  }

  function vacio(titulo, texto){
    return '<div class="tabla-caja"><div class="vacio"><b>' + esc(titulo) + '</b>' + esc(texto) + '</div></div>';
  }

  /* ── Inicio ───────────────────────────────────────────────────────── */
  function pintaInicio(c){
    var d = DATOS;
    var nombrePila = (d.nombre || '').trim().split(/\s+/)[0] || '';
    var tot = 0, cob = 0;
    (d.contratos||[]).forEach(function(x){
      var p = (x.precio != null) ? Number(x.precio) : num(x.precio_txt);
      if (!isNaN(p)) tot += p; cob += Number(x.cobrado) || 0;
    });
    var mon = ((d.contratos||[])[0] || {}).moneda || 'EUR';

    var proximo = null;
    (d.contratos||[]).forEach(function(x){
      if (proximo) return;
      var precio = (x.precio != null) ? Number(x.precio) : num(x.precio_txt);
      var hs = estadosHitos(x.hitos, Number(x.cobrado)||0, precio);
      var h = hs.filter(function(y){ return y.estado !== 'pagado'; })[0];
      if (h){
        // restante del hito, no su importe integro: si esta 'parcial' ya se
        // cobro una parte (Administracion, 31-ago-2026 — antes ensenaba el
        // monto completo del hito aunque ya llevara pago, y no cuadraba con
        // la tarjeta "Pendiente" de al lado, que si resta lo cobrado)
        var pagadoAcum = hs.reduce(function(s,y){ return s + (y.estado === 'pagado' && !isNaN(y.monto) ? y.monto : 0); }, 0);
        var restante = isNaN(h.monto) ? NaN : Math.max(0, h.monto - Math.max(0, (Number(x.cobrado)||0) - pagadoAcum));
        proximo = { hito:h.hito, monto:restante, moneda:x.moneda, contrato:x.numero };
      }
    });

    var novedades = novedadesDerivadas().slice(0,3);

    c.innerHTML =
      '<div class="titulo-sec"><h2>' + esc(t('hola')) + (nombrePila ? ', ' + esc(nombrePila) : '') + '</h2>' +
        '<p>' + esc(t('saludo_sub')) + '</p></div>' +
      (tot > 0 ? '<div class="kpis">' +
        '<div class="tarjeta kpi"><div class="lbl">' + esc(t('r_inversion')) + '</div><div class="val">' + esc(dinero(tot,mon)) + '</div></div>' +
        '<div class="tarjeta kpi"><div class="lbl">' + esc(t('r_pagado')) + '</div><div class="val ok">' + esc(dinero(cob,mon)) + '</div></div>' +
        '<div class="tarjeta kpi"><div class="lbl">' + esc(t('r_pendiente')) + '</div><div class="val">' + esc(dinero(Math.max(0,tot-cob),mon)) + '</div></div>' +
      '</div>' : '') +
      '<div class="grid2col">' +
        '<div class="tarjeta"><div class="rot-bloque">' + esc(t('proximo_pago')) + '</div>' +
          (proximo ?
            '<div style="font-size:16px;font-weight:500;margin-bottom:4px">' + esc((proximo.hito[LANG] || proximo.hito.es || proximo.hito.en || '')) + '</div>' +
            '<div style="font-size:13px;color:#6b6c66;margin-bottom:14px">' + esc(t('cuando')) + ': ' + esc(proximo.hito.timing || '—') + ' · ' + esc(proximo.contrato) + '</div>' +
            '<div style="font-family:\'Instrument Sans\',sans-serif;font-size:22px;font-weight:700;margin-bottom:14px">' + (isNaN(proximo.monto)?'—':esc(dinero(proximo.monto, proximo.moneda))) + '</div>' +
            '<button type="button" class="btn-borde" data-ir="contratos">' + esc(t('ver_plan')) + '</button>'
            : '<p style="font-size:13.5px;color:#6b6c66">' + esc(t('sin_proximo')) + '</p>') +
        '</div>' +
        '<div class="tarjeta"><div class="rot-bloque">' + esc(t('novedades')) + '</div>' +
          (novedades.length ? novedades.map(function(x){
            return '<div style="display:flex;gap:8px;padding:8px 0;border-bottom:1px solid rgba(138,132,116,.15)">' +
                   '<span style="width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px;background:var(--tg)"></span>' +
                   '<div style="font-size:12.5px;line-height:1.4">' + esc(x.texto) + '</div></div>';
          }).join('') : '<p style="font-size:13px;color:#8a8570">—</p>') +
        '</div>' +
      '</div>' +
      '<div class="accesos">' +
        '<button type="button" class="acceso" data-ir="documentos"><div class="t">' + esc(t('acc_documentos')) + '</div><div class="s">' + esc(t('acc_documentos_sub')) + '</div></button>' +
        '<button type="button" class="acceso" data-ir="soporte"><div class="t">' + esc(t('acc_soporte')) + '</div><div class="s">' + esc(t('acc_soporte_sub')) + '</div></button>' +
        '<button type="button" class="acceso" data-ir="mensajes"><div class="t">' + esc(t('acc_mensajes')) + '</div><div class="s">' + esc(t('acc_mensajes_sub')) + '</div></button>' +
      '</div>';
    c.querySelectorAll('[data-ir]').forEach(function(b){ b.addEventListener('click', function(){ vasA(b.getAttribute('data-ir'), null); }); });
  }

  /* ── Contratos ────────────────────────────────────────────────────── */
  function pintaContratos(c){
    var d = DATOS;
    if (!(d.contratos||[]).length){ c.innerHTML = vacio(t('sin_contratos_t'), t('sin_contratos')); return; }
    c.innerHTML = d.contratos.map(function(x){
      var precio = (x.precio != null) ? Number(x.precio) : num(x.precio_txt);
      var cobrado = Number(x.cobrado) || 0;
      var pct = (precio > 0) ? Math.min(100, Math.round(cobrado/precio*100)) : null;
      var hs = estadosHitos(x.hitos, cobrado, precio);
      var tagBg = x.firmado ? 'rgba(63,82,48,.12)' : 'rgba(190,179,165,.4)';
      var tagColor = x.firmado ? 'var(--ok)' : 'var(--va)';
      return '<div class="op"><div class="op-cab">' +
        '<div class="info"><h3><b>' + esc(x.numero) + '</b><span class="sub">' + esc(x.proyecto||'') +
          (x.parcela ? ' · ' + esc(t('unidad')) + ' ' + esc(x.parcela) : '') + '</span>' +
          '<span class="tag" style="background:' + tagBg + ';color:' + tagColor + '">' + esc(x.firmado?t('firmado'):t('pendiente_firma')) + '</span></h3>' +
          '<div class="op-datos">' +
            '<div class="d"><div class="lbl">' + esc(t('precio')) + '</div><div class="val">' + (precio ? esc(dinero(precio,x.moneda)) : esc(x.precio_txt||'—')) + '</div></div>' +
            '<div class="d"><div class="lbl">' + esc(t('cobrado')) + '</div><div class="val">' + esc(dinero(cobrado,x.moneda)) + '</div></div>' +
          '</div></div></div>' +
        (precio > 0 ? '<div class="barra"><i style="width:' + pct + '%"></i></div>' +
          '<div class="barra-leg"><span>' + pct + '% ' + esc(t('de')) + ' ' + esc(dinero(precio,x.moneda)) + '</span>' +
          '<span>' + esc(dinero(Math.max(0,precio-cobrado),x.moneda)) + ' ' + esc(t('pendiente')).toLowerCase() + '</span></div>' : '') +
        (hs.length ? '<table class="docs"><thead><tr><th>' + esc(t('concepto')) + '</th><th>' + esc(t('cuando')) + '</th>' +
          '<th class="num">' + esc(t('importe')) + '</th><th>' + esc(t('estado')) + '</th></tr></thead><tbody>' +
          hs.map(function(y){
            var descr = y.hito[LANG] || y.hito.es || y.hito.en || '';
            var col = TAGCOLOR[y.estado];
            return '<tr><td>' + esc(descr||'—') + '</td><td class="flojo">' + esc(y.hito.timing||'') + '</td>' +
              '<td class="num">' + (isNaN(y.monto)?'—':esc(dinero(y.monto,x.moneda))) + '</td>' +
              '<td><span class="tag chico" style="background:' + col[0] + ';color:' + col[1] + '">' + esc(t(y.estado)) + '</span></td></tr>';
          }).join('') + '</tbody></table>' : '') +
        (x.pdf ? '<div class="op-pie"><button type="button" class="btn-borde" data-contrato="' + esc(x.numero) + '">' + esc(t('ver_contrato')) + '</button></div>' : '') +
      '</div>';
    }).join('');
    c.querySelectorAll('[data-contrato]').forEach(function(b){ b.addEventListener('click', function(){ vasA('contratos', b.getAttribute('data-contrato')); }); });
  }

  /* ── Facturas ─────────────────────────────────────────────────────── */
  var TIPO_DOC = { factura:'factura', proforma:'proforma', recibi:'recibi' };
  function pintaFacturas(c){
    var d = DATOS;

    c.innerHTML = '<div class="tabla-caja"><table><thead><tr>' +
      '<th>' + esc(t('f_numero')) + '</th><th>' + esc(t('f_tipo')) + '</th><th>' + esc(t('f_fecha')) + '</th>' +
      '<th class="num">' + esc(t('f_total')) + '</th><th></th></tr></thead><tbody>' +
      d.facturas.map(function(f){
        return '<tr data-fila data-fac="' + esc(f.numero) + '">' +
          '<td class="clave">' + esc(f.numero) + '</td><td>' + esc(t(TIPO_DOC[f.tipo]||f.tipo)) + '</td>' +
          '<td class="flojo">' + esc(fecha(f.fecha)) + '</td>' +
          '<td class="num">' + esc(dinero(Number(f.total),f.moneda)) + '</td>' +

  /* ── Obra ─────────────────────────────────────────────────────────── */
  function pintaObra(c){
    var d = DATOS, fases = d.fases || [];
    if (!(d.obra||[]).length){ c.innerHTML = vacio(t('sin_obra_t'), t('sin_obra')); return; }
    c.innerHTML = d.obra.map(function(u){
      var idx = fases.map(function(f){ return f.clave; }).indexOf(u.fase);
      return '<div class="op"><div class="op-cab"><div class="info"><h3><b>' + esc(u.unidad) + '</b>' +
          '<span class="sub">' + esc(u.proyecto||'') + (u.contrato_numero ? ' · ' + esc(u.contrato_numero) : '') + '</span></h3></div></div>' +
        (fases.length ? '<div class="fases">' + fases.map(function(f,i){
          return '<span class="fase ' + (i<idx?'hecha':(i===idx?'actual':'')) + '">' + esc(f[LANG]||f.es) + '</span>';
        }).join('') + '</div>' : '') +
        '<div class="op-datos" style="margin-top:14px">' +
          (u.fecha_entrega ? '<div class="d"><div class="lbl">' + esc(t('entrega_est')) + '</div><div class="val">' + esc(fecha(u.fecha_entrega)) + '</div></div>' : '') +
          (u.actualizado ? '<div class="d"><div class="lbl">' + esc(t('actualizado')) + '</div><div class="val">' + esc(fecha(u.actualizado)) + '</div></div>' : '') +
        '</div>' +
        ((u.fotos||[]).length ? '<div class="fotos" style="margin-top:16px">' + u.fotos.map(function(ft){
          return '<figure><img loading="lazy" data-foto="' + esc(ft.path) + '" alt="' + esc(ft.titulo||'') + '">' +
                 '<figcaption>' + esc(ft.titulo||'') + (ft.fecha?' · '+esc(fecha(ft.fecha)):'') + '</figcaption></figure>';
        }).join('') + '</div>' : '') +
      '</div>';
    }).join('');
    cargaFotos();
    c.querySelectorAll('.fotos img').forEach(function(img){ img.addEventListener('click', function(){ if (img.src) ampliaFoto(img.src); }); });
  }
  function cargaFotos(){
    document.querySelectorAll('img[data-foto]').forEach(function(img){
      var p = img.getAttribute('data-foto'); img.removeAttribute('data-foto');
      sb.storage.from('obra').createSignedUrl(p, 3600).then(function(r){ if (r.data && r.data.signedUrl) img.src = r.data.signedUrl; });
    });
  }
  function ampliaFoto(src){
    var l = document.createElement('div'); l.className = 'lupa';
    l.innerHTML = '<img src="' + esc(src) + '" alt="">';
    l.addEventListener('click', function(){ l.remove(); });
    document.addEventListener('keydown', function h(ev){ if (ev.key==='Escape'){ l.remove(); document.removeEventListener('keydown',h); } });
    document.body.appendChild(l);
  }

  /* ── Documentos ───────────────────────────────────────────────────── */
  function pintaDocumentos(c){
    var d = DATOS, docs = d.documentos||[], kyc = d.kyc||[];
    if (!docs.length && !kyc.length){ c.innerHTML = vacio(t('sin_docs_t'), t('sin_docs')); return; }
    var html = '';
    if (docs.length) html += '<h3 style="margin:0 0 14px;font-size:15px;font-weight:600">' + esc(t('d_promocion')) + '</h3>' +
      '<div class="doclista" style="margin-bottom:28px">' + docs.map(function(x){
        return '<div class="docfila" data-doc="' + esc(x.id) + '"><div class="cuerpo"><div class="t">' + esc(x.titulo) + '</div>' +
          '<div class="s">' + esc([x.categoria, x.proyecto].filter(Boolean).join(' · ')) + '</div></div></div>';
      }).join('') + '</div>';
    if (kyc.length) html += '<h3 style="margin:0 0 6px;font-size:15px;font-weight:600">' + esc(t('d_entregado')) + '</h3>' +
      '<p style="margin:0 0 14px;font-size:12.5px;color:#6b6c66;max-width:60ch">' + esc(t('d_entregado_nota')) + '</p>' +
      '<div class="doclista">' + kyc.map(function(x){
        var cad = x.caduca ? new Date(x.caduca) : null;
        var vencido = cad && cad < new Date();
        return '<div class="docfila" data-kyc="' + esc(x.path) + '"><div class="cuerpo"><div class="t">' +
          esc(t('doc_'+x.tipo) === 'doc_'+x.tipo ? x.tipo : t('doc_'+x.tipo)) + '</div></div>' +
          '<div class="der' + (vencido?' mal':'') + '">' + (x.caduca ? esc(t('caduca')+' '+fecha(x.caduca)) : '') + '</div></div>';
      }).join('') + '</div>';
    c.innerHTML = html;
    c.querySelectorAll('[data-doc]').forEach(function(el){
      el.addEventListener('click', function(){
        var doc = (DATOS.documentos||[]).filter(function(x){ return String(x.id) === el.getAttribute('data-doc'); })[0];
        if (!doc) return;
        if (doc.url) window.open(doc.url, '_blank', 'noopener'); else abreFichero('documentacion', doc.path);
      });

    c.querySelectorAll('[data-kyc]').forEach(function(el){ el.addEventListener('click', function(){ abreFichero('kyc', el.getAttribute('data-kyc')); }); });
  }
  function abreFichero(bucket, path){
    if (!path) return;
    sb.storage.from(bucket).createSignedUrl(path, 600).then(function(r){
      if (r.data && r.data.signedUrl) window.open(r.data.signedUrl, '_blank', 'noopener'); else toast(t('err_fichero'));
    });
  }

  /* ── Soporte ──────────────────────────────────────────────────────── */
  function pintaSoporte(c){

      '<p style="font-size:11.5px;color:#8a8570;margin:0 0 14px;max-width:52ch">' + esc(t('aviso_no_vinculante')) + '</p>' +
      '<div style="display:flex;justify-content:flex-end;margin-bottom:16px">' +

  function pintaFormNuevoTicket(){
    var box = document.getElementById('formNuevoTicket'); if (!box) return;
    if (!ESTADO.newTicketOpen){ box.innerHTML = ''; return; }
    box.innerHTML = '<form id="fNuevoTicket" class="tarjeta" style="margin-bottom:18px">' +
      '<div class="campo"><label>' + esc(t('asunto')) + '</label><input id="ntAsunto" required></div>' +
      '<div class="campo"><label>' + esc(t('categoria')) + '</label><select id="ntCategoria">' +
        '<option value="Pagos">Pagos</option><option value="Documentación">Documentación</option>' +
        '<option value="Obra">Obra</option><option value="Otro">Otro</option></select></div>' +
      '<div class="campo"><label>' + esc(t('mensaje')) + '</label><textarea id="ntMensaje" rows="3" required></textarea></div>' +
      '<div style="display:flex;gap:10px">' +
        '<button type="submit" class="btn-oscuro">' + esc(t('enviar')) + '</button>' +
        '<button type="button" class="btn-borde" id="ntCancelar">' + esc(t('cancelar')) + '</button></div></form>';
    document.getElementById('ntCancelar').addEventListener('click', function(){ ESTADO.newTicketOpen = false; pintaFormNuevoTicket(); });
    document.getElementById('fNuevoTicket').addEventListener('submit', function(e){
      e.preventDefault();
      var asunto = document.getElementById('ntAsunto').value.trim();
      var categoria = document.getElementById('ntCategoria').value;
      var mensaje = document.getElementById('ntMensaje').value.trim();
      if (!asunto || !mensaje) return;
      var btn = e.target.querySelector('button[type="submit"]'); btn.disabled = true;
      sb.rpc('portal_crear_ticket', { p_client_id: DATOS.client_id, p_asunto: asunto, p_categoria: categoria, p_mensaje: mensaje })
        .then(function(r){
          btn.disabled = false;
          if (r.error){ toast(r.error.message); return; }
          ESTADO.newTicketOpen = false;
          recargaSituacion(function(){ render(); });
        });
    });
  }

  function abreDrawerTicket(id){
    var tk = ((DATOS && DATOS.tickets) || []).filter(function(x){ return String(x.id) === String(id); })[0];
    if (!tk) return;
    var col = tk.estado === 'abierto' ? ['rgba(143,155,122,.25)','var(--tg)'] : ['rgba(63,82,48,.12)','var(--ok)'];
    abreDrawer('<div class="hoja" style="display:flex;flex-direction:column;height:calc(100vh - 100px)">' +
      '<h3 style="margin:0 0 4px;font-size:15px;font-weight:600">' + esc(tk.asunto) + '</h3>' +
      '<div style="font-size:11.5px;color:#8a8570;margin-bottom:16px">' + esc(tk.categoria) + ' · ' +
        '<span class="tag chico" style="background:' + col[0] + ';color:' + col[1] + '">' + esc(tk.estado==='abierto'?t('abierto'):t('resuelto')) + '</span></div>' +
      '<div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px" id="ticketHilo"></div>' +
      '<form id="fTicketReply" style="display:flex;gap:8px;margin-top:14px">' +
        '<input id="ticketReplyIn" placeholder="' + esc(t('responder')) + '" style="flex:1;font:inherit;font-size:13.5px;padding:9px 12px;border:1px solid rgba(138,132,116,.5);border-radius:999px;background:#fdfcf9">' +
        '<button type="submit" class="btn-oscuro">' + esc(t('enviar')) + '</button></form></div>', 'ancho');
    document.getElementById('ticketHilo').innerHTML = (tk.mensajes||[]).map(function(m){
      var mia = m.de === 'cliente';
      return '<div class="fila-msg' + (mia?' der':'') + '"><div>' +
        '<div style="font-size:10.5px;color:#a8a394;margin-bottom:3px;text-align:' + (mia?'right':'left') + '">' + esc(mia?t('tu'):t('equipo')) + '</div>' +
        '<div class="burbuja ' + (mia?'mia':'suya') + '">' + esc(m.texto) + '</div></div></div>';
    }).join('');
    document.getElementById('fTicketReply').addEventListener('submit', function(e){
      e.preventDefault();
      var val = document.getElementById('ticketReplyIn').value.trim(); if (!val) return;
      sb.rpc('portal_enviar_ticket_mensaje', { p_ticket_id: tk.id, p_texto: val }).then(function(r){
        if (r.error){ toast(r.error.message); return; }
        recargaSituacion(function(){ abreDrawerTicket(id); });
      });
    });
  }

  /* ── Mensajes (chat con la gestora) ──────────────────────────────── */
  function pintaMensajes(c){
    var d = DATOS, mensajes = d.mensajes || [];
    c.innerHTML = '<p style="font-size:11.5px;color:#8a8570;margin:0 0 14px;max-width:52ch">' + esc(t('aviso_no_vinculante')) + '</p>' +
      '<div class="chat"><div class="cab"><b>Lawang</b><div class="rol">' +
      (LANG==='es' ? 'Tu equipo de atención' : 'Your account team') + '</div></div>' +
      '<div class="hilo" id="chatHilo"></div>' +
      '<form id="fChat"><input id="chatIn" placeholder="' + esc(t('responder')) + '"><button type="submit" class="btn-oscuro">' + esc(t('enviar')) + '</button></form></div>';
    var hilo = document.getElementById('chatHilo');
    hilo.innerHTML = mensajes.length ? mensajes.map(function(m){
      var mia = m.de === 'cliente';
      return '<div class="fila-msg' + (mia?' der':'') + '"><div>' +
        '<div class="burbuja ' + (mia?'mia':'suya') + '">' + esc(m.texto) + '</div>' +
        '<div class="fecha-msg" style="text-align:' + (mia?'right':'left') + '">' + esc(fechaHora(m.creado_en)) + '</div></div></div>';
    }).join('') : '<p style="font-size:13px;color:#8a8570;text-align:center;margin-top:20px">' + esc(t('sin_mensajes')) + '</p>';
    hilo.scrollTop = hilo.scrollHeight;
    document.getElementById('fChat').addEventListener('submit', function(e){
      e.preventDefault();
      var val = document.getElementById('chatIn').value.trim(); if (!val) return;
      sb.rpc('portal_enviar_mensaje', { p_client_id: DATOS.client_id, p_texto: val }).then(function(r){
        if (r.error){ toast(r.error.message); return; }
        recargaSituacion(function(){ render(); });
      });
    });
  }

  /* ── Perfil ───────────────────────────────────────────────────────── */
  function pintaPerfil(c){
    var d = DATOS, prefs = d.prefs || { pref_email:true, pref_sms:false };
    c.innerHTML = '<div style="display:grid;gap:16px;max-width:520px">' +
      '<div class="tarjeta"><h3 style="margin:0 0 14px;font-size:15px;font-weight:600">' + esc(t('datos_personales')) + '</h3>' +
        '<div style="display:grid;gap:10px">' +
          '<div><div class="lbl" style="font-size:11px;color:#8a8570;text-transform:uppercase">' + esc(t('nombre')) + '</div><div style="font-size:14px;margin-top:2px">' + esc(d.nombre||'—') + '</div></div>' +
          '<div><div class="lbl" style="font-size:11px;color:#8a8570;text-transform:uppercase">' + esc(t('correo')) + '</div><div style="font-size:14px;margin-top:2px">' + esc(d.email||'—') + '</div></div>' +
          '<div><div class="lbl" style="font-size:11px;color:#8a8570;text-transform:uppercase">' + esc(t('telefono')) + '</div><div style="font-size:14px;margin-top:2px">' + esc(d.telefono||'—') + '</div></div>' +
          '<div><div class="lbl" style="font-size:11px;color:#8a8570;text-transform:uppercase">' + esc(t('pais')) + '</div><div style="font-size:14px;margin-top:2px">' + esc(d.pais||'—') + '</div></div>' +
        '</div></div>' +
      '<div class="tarjeta"><h3 style="margin:0 0 14px;font-size:15px;font-weight:600">' + esc(t('seguridad')) + '</h3>' +
        '<button type="button" class="btn-borde" id="btnCambiarPass">' + esc(t('cambiar_pass_btn')) + '</button></div>' +
      '<div class="tarjeta"><h3 style="margin:0 0 14px;font-size:15px;font-weight:600">' + esc(t('prefs')) + '</h3>' +
        '<div class="pref-fila"><span style="font-size:13.5px">' + esc(t('pref_email')) + '</span>' +
          '<button type="button" class="toggle' + (prefs.pref_email?' on':'') + '" id="tglEmail"><i></i></button></div>' +
        '<div class="pref-fila"><span style="font-size:13.5px">' + esc(t('pref_sms')) + '</span>' +
          '<button type="button" class="toggle' + (prefs.pref_sms?' on':'') + '" id="tglSms"><i></i></button></div>' +
      '</div></div>';
    document.getElementById('btnCambiarPass').addEventListener('click', abrirCambiarPass);
    document.getElementById('tglEmail').addEventListener('click', function(){ togglePref('pref_email'); });
    document.getElementById('tglSms').addEventListener('click', function(){ togglePref('pref_sms'); });
  }
  function togglePref(cual){
    var prefs = DATOS.prefs = DATOS.prefs || { pref_email:true, pref_sms:false };
    prefs[cual] = !prefs[cual];
    pintaPerfil(document.getElementById('content'));
    sb.rpc('portal_set_prefs', { p_pref_email: prefs.pref_email, p_pref_sms: prefs.pref_sms }).then(function(r){
      if (r.error) toast(r.error.message);
    });
  }

  /* ── recarga ligera de portal_situacion (tras escribir algo) ────────── */
  function recargaSituacion(cb){
    sb.rpc('portal_situacion').then(function(r){
      if (!r.error) DATOS = r.data || DATOS;
      if (cb) cb();
    });
  }

  /* ══ DRAWER genérico ═════════════════════════════════════════════════ */
  function abreDrawer(html, clase){
    document.getElementById('drawerVelo').hidden = false;
    var dr = document.getElementById('drawer');
    dr.className = 'drawer' + (clase ? ' ' + clase : '');
    dr.hidden = false;
    dr.innerHTML = '<div class="drawer-cerrar"><button type="button" id="btnCerrarDrawer">✕</button></div>' + html;
    document.getElementById('btnCerrarDrawer').addEventListener('click', cierraDrawer);
    document.getElementById('drawerVelo').onclick = cierraDrawer;
  }
  function cierraDrawer(){
    document.getElementById('drawerVelo').hidden = true;
    document.getElementById('drawer').hidden = true;
    var r = leeHash();
    if (r.doc) vasA(r.sec, null);
  }

  /* ── el documento REAL de una factura, en el drawer ──────────────────
     Se arma con documentoHTML(), la misma función que usa la herramienta
     de Facturas y la Edge que emite la del primer hito — el comprador ve
     el documento tal y como se emitió. */
  function abreFactura(f){
    if (!f) return;
    var campos = Object.assign({}, f.fields || {});
    if (!Array.isArray(campos.lineas)) campos.lineas = Array.isArray(f.lineas) ? f.lineas : [];
    var soc = (typeof SOCIEDADES !== 'undefined' && SOCIEDADES[campos.sociedad]) || {};
    var v = documentoVars(soc);
    var estilo = function(k){ return Object.keys(v[k]).filter(function(p){ return v[k][p]; }).map(function(p){ return p+':'+v[k][p]; }).join(';'); };
    abreDrawer(
      '<div class="hoja-scroll"><div class="sheet" style="' + estilo('hoja') + '"><div class="doc" style="' + estilo('doc') + '">' +
        documentoHTML(campos, { numero: f.numero }) + '</div></div></div>' +
      '<div style="display:flex;gap:10px;margin-top:14px">' +
        '<button type="button" class="btn-oscuro" id="btnImprimirDoc">' + esc(t('imprimir')) + '</button>' +
        '<button type="button" class="btn-borde" id="btnCerrarDoc">' + esc(t('cerrar')) + '</button></div>'
    );
    document.getElementById('btnCerrarDoc').addEventListener('click', cierraDrawer);
    document.getElementById('btnImprimirDoc').addEventListener('click', function(){
      document.body.classList.add('imprimiendo'); window.print(); document.body.classList.remove('imprimiendo');
    });
  }

  /* ── el PDF real de un contrato firmado, en el drawer ───────────────── */
  function abreContrato(c){
    if (!c || !c.pdf) return;
    sb.storage.from('contratos-firmados').createSignedUrl(c.pdf, 600).then(function(r){
      if (!r.data || !r.data.signedUrl){ toast(t('err_carga')); vasA('contratos', null, true); return; }
      abreDrawer(
        '<h3 style="margin:0 0 4px;font-size:15px;font-weight:600">' + esc(c.numero) + '</h3>' +
        '<div style="font-size:11.5px;color:#8a8570;margin-bottom:14px">' + esc((c.proyecto||'') + (c.parcela?' · '+t('unidad')+' '+c.parcela:'')) + '</div>' +
        '<iframe src="' + esc(r.data.signedUrl) + '" style="width:100%;height:70vh;border:0;background:#fff;border-radius:8px" title="' + esc(c.numero) + '"></iframe>' +
        '<div style="display:flex;gap:10px;margin-top:14px">' +
          '<a class="btn-oscuro" style="text-decoration:none;display:inline-block" href="' + esc(r.data.signedUrl) + '" target="_blank" rel="noopener">' + esc(t('descargar')) + '</a>' +
          '<button type="button" class="btn-borde" id="btnCerrarDoc">' + esc(t('cerrar')) + '</button></div>',
        'ancho'
      );
      document.getElementById('btnCerrarDoc').addEventListener('click', cierraDrawer);
    });
  }

  /* ── cambiar contraseña, en el drawer ────────────────────────────────
     `updateUser` sobre la sesión activa — no hace falta la Edge (esa es
     solo para que un ADMIN se la ponga a otra persona). */
  function abrirCambiarPass(){
    abreDrawer(
      '<div class="hoja"><h3 style="margin:0 0 16px;font-size:15px;font-weight:600">' + esc(t('cambiar_pass_btn')) + '</h3>' +
      '<div class="campo"><label>' + esc(t('cambiar_pass_nueva')) + '</label><input type="password" id="cpNueva" autocomplete="new-password"></div>' +
      '<div class="campo"><label>' + esc(t('cambiar_pass_repite')) + '</label><input type="password" id="cpRepite" autocomplete="new-password"></div>' +
      '<p style="font-size:12px;color:#8a8570;margin:0 0 10px">' + esc(t('cambiar_pass_nota')) + '</p>' +
      '<div id="cpAviso" class="aviso" style="margin-bottom:10px"></div>' +
      '<button type="button" class="btn-oscuro" id="btnCpGuardar">' + esc(t('guardar')) + '</button></div>'
    );
    document.getElementById('btnCpGuardar').addEventListener('click', function(){
      var p1 = document.getElementById('cpNueva').value, p2 = document.getElementById('cpRepite').value;
      var aviso = document.getElementById('cpAviso');
      if (p1.length < 10){ aviso.className = 'aviso mal'; aviso.textContent = t('cambiar_pass_corta'); return; }
      if (p1 !== p2){ aviso.className = 'aviso mal'; aviso.textContent = t('cambiar_pass_no_coincide'); return; }
      var btn = document.getElementById('btnCpGuardar'); btn.disabled = true;
      sb.auth.updateUser({ password: p1 }).then(function(r){
        btn.disabled = false;
        if (r.error){ aviso.className = 'aviso mal'; aviso.textContent = t('cambiar_pass_error') + ': ' + r.error.message; return; }
        aviso.className = 'aviso bien'; aviso.textContent = t('cambiar_pass_ok');
        setTimeout(cierraDrawer, 1200);
      });
    });
  }
})();
</script>
