<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Constructor de dossiers — Lawang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ============ tokens de marca (mismos que contracts/assets/brand.css) ============ */
:root{
  --tg:#485B37; --dl:#104C4F; --be:#42210B; --sc:#8F9B7A;
  --va:#2E3437; --ss:#BEB3A5; --rl:#F5F0E6;
  --ink:#2E3437; --mut:#6b6c66; --line:#e3ddce; --card:#fffdf8;
  --serif:'Cormorant Garamond',serif; --sans:'Jost',sans-serif;
  --zoom:.55;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:#eae5d8;color:var(--ink)}

/* ============ chrome de la app ============ */
#topbar{position:fixed;top:0;left:0;right:0;height:54px;background:var(--va);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;z-index:50}
#topbar .logo{height:26px;opacity:.9}
#topbar input#ptitle{font:600 15px var(--sans);background:transparent;border:none;border-bottom:1px dashed #ffffff44;color:#fff;padding:4px 2px;min-width:200px;flex:1;max-width:380px}
#topbar input#ptitle:focus{outline:none;border-bottom-color:#fff}
.tbtn{font:600 13px var(--sans);border:1px solid #ffffff33;background:#ffffff14;color:#fff;border-radius:999px;padding:7px 15px;cursor:pointer;transition:.15s;white-space:nowrap}
.tbtn:hover{background:#ffffff2b}
.tbtn.primary{background:var(--tg);border-color:var(--tg)}
.tbtn.primary:hover{background:#57703f}
#zoomctl{display:flex;align-items:center;gap:6px;font-size:12px;color:#ffffffaa}
#sidebar{position:fixed;top:54px;left:0;bottom:0;width:250px;background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:12px;z-index:40}
#sidebar h3{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#a49c8c;margin:4px 4px 10px}
.pitem{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:pointer;background:#fff;transition:.15s;position:relative}
.pitem:hover{border-color:#c9c1ad}
.pitem.cur{border-color:var(--tg);box-shadow:0 6px 16px -12px rgba(72,91,55,.8)}
.pitem .pt{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tg);font-weight:600}
.pitem .pn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pitem .acts{display:flex;gap:2px;margin-top:6px}
.pitem .acts button{font-size:11px;border:1px solid var(--line);background:#fff;border-radius:6px;width:26px;height:22px;cursor:pointer;color:#6f6a60;line-height:1}
.pitem .acts button:hover{border-color:var(--tg);color:var(--tg)}
#addpage{width:100%;font:600 14px var(--sans);border:1.5px dashed #c9c1ad;background:transparent;border-radius:10px;padding:12px;cursor:pointer;color:#8a8474;transition:.15s}
#addpage:hover{border-color:var(--tg);color:var(--tg)}
#stage{margin:54px 0 0 250px;padding:26px 30px 80px;min-height:100vh}
#pages{zoom:var(--zoom)}
.sheetwrap{margin:0 auto 46px;width:297mm}
.sheetwrap .plabel{font-size:22px;color:#a49c8c;margin:0 0 8px 4px;letter-spacing:1px}
.page{width:297mm;height:210mm;position:relative;overflow:hidden;background:var(--rl);box-shadow:0 20px 60px -20px rgba(46,52,55,.45);color:var(--ink)}

/* ============ modal añadir página ============ */
#modal{position:fixed;inset:0;background:rgba(32,36,31,.55);display:none;place-items:center;z-index:60}
#modal.on{display:grid}
#modal .box{background:var(--card);border-radius:18px;padding:26px 28px;width:min(860px,92vw);max-height:84vh;overflow:auto}
#modal h2{margin:0 0 4px;font-size:22px}
#modal p{margin:0 0 18px;color:var(--mut);font-size:14px}
#typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tcard{text-align:left;border:1.5px solid var(--line);border-radius:13px;background:#fff;padding:14px 15px;cursor:pointer;font:inherit;transition:.15s}
.tcard:hover{border-color:var(--tg);transform:translateY(-2px);box-shadow:0 12px 26px -18px rgba(72,91,55,.8)}
.tcard .tt{font-weight:700;font-size:16px}
.tcard .td{font-size:12.5px;color:var(--mut);line-height:1.45;margin-top:3px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:99}
#toast.show{opacity:1}

/* ============ edición ============ */
[contenteditable]{outline:none;cursor:text}
[contenteditable]:hover{box-shadow:inset 0 0 0 1px rgba(72,91,55,.35)}
[contenteditable]:focus{box-shadow:inset 0 0 0 1.5px var(--tg)}
.slot{position:relative;cursor:pointer;background-size:cover;background-position:center;background-color:#e7e1d2}
.slot.empty::before{content:"+ Imagen";position:absolute;inset:0;display:grid;place-items:center;font:600 15px var(--sans);color:#a49c8c;border:2px dashed #cfc7b4;letter-spacing:1px}
.slot .rm{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(32,36,31,.72);color:#fff;font-size:13px;cursor:pointer;display:none;z-index:5}
.slot:hover .rm{display:block}
.slot.empty .rm{display:none}

/* ============ maquetas de página (marca Lawang) ============ */
.page .kick{font:600 12px/1.4 var(--sans);letter-spacing:4px;text-transform:uppercase}
.page .pageno{position:absolute;bottom:9mm;right:11mm;font:500 10px var(--sans);letter-spacing:2px;color:inherit;opacity:.65;z-index:6}
.page .brandtag{position:absolute;bottom:9mm;left:11mm;font:600 9px var(--sans);letter-spacing:3px;text-transform:uppercase;opacity:.7;z-index:6}

/* portada */
.pg-cover .slot.bg{position:absolute;inset:0}
.pg-cover .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,25,20,.28),rgba(16,25,20,.14) 45%,rgba(16,25,20,.62));pointer-events:none}
.pg-cover .logo{position:absolute;top:12mm;left:0;right:0;margin:auto;height:17mm;z-index:4;filter:drop-shadow(0 2px 10px rgba(0,0,0,.3))}
.pg-cover .mid{position:absolute;left:0;right:0;top:47%;transform:translateY(-50%);text-align:center;color:#fff;z-index:4;padding:0 20mm}
.pg-cover .kick{opacity:.92}
.pg-cover .title{font:500 76px/1.02 var(--serif);letter-spacing:10px;text-transform:uppercase;margin:6mm 0 5mm}
.pg-cover .claim{font:italic 400 19px/1.5 var(--serif);letter-spacing:.5px;opacity:.95;max-width:150mm;margin:0 auto}
.pg-cover .foot{position:absolute;bottom:10mm;left:0;right:0;text-align:center;color:#fff;font:600 10px var(--sans);letter-spacing:4px;text-transform:uppercase;opacity:.85;z-index:4}

/* statement */
.pg-statement{background:var(--dl);color:var(--rl)}
.pg-statement .slot.bg{position:absolute;inset:0;opacity:.34}
.pg-statement .slot.bg.empty::before{opacity:0}
.pg-statement .mid{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 30mm;z-index:3}
.pg-statement .big{font:500 58px/1.14 var(--serif);letter-spacing:2px}
.pg-statement .note{font:300 14px/1.6 var(--sans);letter-spacing:1px;margin-top:9mm;max-width:120mm;opacity:.85}

/* stats */
.pg-stats{display:flex}
.pg-stats .slot.side{width:46%;height:100%}
.pg-stats .right{width:54%;padding:16mm 16mm 14mm;display:flex;flex-direction:column}
.pg-stats .kick{color:var(--tg)}
.pg-stats .title{font:500 40px/1.1 var(--serif);margin:4mm 0 3mm}
.pg-stats .intro{font:300 13.5px/1.6 var(--sans);color:var(--mut);max-width:110mm}
.pg-stats .grid{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:7mm 10mm}
.pg-stats .stat{border-top:2px solid var(--tg);padding-top:3.5mm}
.pg-stats .stat .n{font:500 33px/1 var(--serif);color:var(--dl)}
.pg-stats .stat .l{font:600 10.5px/1.45 var(--sans);letter-spacing:1.8px;text-transform:uppercase;color:var(--mut);margin-top:2mm}

/* feature (imagen full + texto) */
.pg-feature .slot.bg{position:absolute;inset:0}
.pg-feature .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(16,25,20,.72) 0%,rgba(16,25,20,.28) 52%,rgba(16,25,20,.05));pointer-events:none}
.pg-feature .txt{position:absolute;left:16mm;top:0;bottom:0;width:110mm;display:flex;flex-direction:column;justify-content:center;color:#fff;z-index:4}
.pg-feature .title{font:500 46px/1.08 var(--serif);margin:4mm 0}
.pg-feature .body{font:300 14px/1.65 var(--sans);opacity:.94}
.pg-feature .chips{display:flex;gap:4mm;margin-top:8mm;flex-wrap:wrap}
.pg-feature .chip{border:1px solid #ffffff66;border-radius:999px;padding:2.4mm 5mm;font:600 10px var(--sans);letter-spacing:2px;text-transform:uppercase}

/* galería */
.pg-gallery{padding:15mm 14mm 18mm;display:flex;flex-direction:column}
.pg-gallery .kick{color:var(--tg)}
.pg-gallery .title{font:500 36px/1.1 var(--serif);margin:3mm 0 8mm}
.pg-gallery .row{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7mm;min-height:0}
.pg-gallery .cell{display:flex;flex-direction:column;min-height:0}
.pg-gallery .slot{flex:1;min-height:0}
.pg-gallery .cap{font:600 11px var(--sans);letter-spacing:2.5px;text-transform:uppercase;color:var(--dl);margin-top:4mm;text-align:center}

/* masterplan / plano */
.pg-plan{display:flex;flex-direction:column}
.pg-plan .band{background:var(--tg);color:var(--rl);padding:9mm 14mm;display:flex;align-items:baseline;gap:10mm}
.pg-plan .title{font:500 30px/1 var(--serif);letter-spacing:1px}
.pg-plan .sub{font:300 12.5px var(--sans);letter-spacing:1px;opacity:.9}
.pg-plan .slot.bg{flex:1;background-size:contain;background-repeat:no-repeat;background-color:var(--rl)}

/* villa */
.pg-villa{display:flex}
.pg-villa .left{width:44%;padding:15mm 12mm 16mm 15mm;display:flex;flex-direction:column}
.pg-villa .kick{color:var(--tg)}
.pg-villa .name{font:500 58px/1 var(--serif);letter-spacing:6px;text-transform:uppercase;color:var(--dl);margin:5mm 0 2mm}
.pg-villa .invfrom{font:600 11px var(--sans);letter-spacing:3px;text-transform:uppercase;color:var(--mut);margin-top:5mm}
.pg-villa .price{font:500 42px/1.05 var(--serif);color:var(--be)}
.pg-villa .areas{margin-top:6mm;font:400 13px/1.9 var(--sans);letter-spacing:1px;color:var(--ink)}
.pg-villa .specs{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);border-top:1.5px solid var(--ss);border-bottom:1.5px solid var(--ss)}
.pg-villa .spec{padding:4.5mm 1mm;text-align:center}
.pg-villa .spec+.spec{border-left:1px solid var(--line)}
.pg-villa .spec .n{font:500 27px/1 var(--serif);color:var(--dl)}
.pg-villa .spec .l{font:600 9px var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-top:1.6mm}
.pg-villa .rightcol{width:56%;display:flex;flex-direction:column;gap:5mm;padding:10mm 10mm 10mm 0}
.pg-villa .slot.main{flex:1.6;min-height:0}
.pg-villa .slot.sec{flex:1;min-height:0}

/* texto */
.pg-text{padding:17mm 24mm}
.pg-text .kick{color:var(--tg)}
.pg-text .title{font:500 34px/1.15 var(--serif);margin:3mm 0 7mm;max-width:200mm}
.pg-text .body{font:300 13.5px/1.75 var(--sans);column-count:2;column-gap:12mm;max-height:132mm;overflow:hidden}

/* contraportada */
.pg-back{background:var(--va);color:var(--rl)}
.pg-back .slot.bg{position:absolute;inset:0;opacity:.22}
.pg-back .slot.bg.empty::before{opacity:0}
.pg-back .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3}
.pg-back .logo{height:24mm;margin-bottom:9mm}
.pg-back .contact{font:300 14px/2 var(--sans);letter-spacing:2px}
.pg-back .legal{position:absolute;bottom:10mm;left:0;right:0;text-align:center;font:500 9px var(--sans);letter-spacing:3px;text-transform:uppercase;opacity:.6;z-index:3}

/* ============ impresión ============ */
@page{size:297mm 210mm;margin:0}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  #topbar,#sidebar,#modal,#toast,.plabel,.slot .rm{display:none!important}
  #stage{margin:0;padding:0}
  #pages{zoom:1}
  .sheetwrap{margin:0;width:auto}
  .page{box-shadow:none;page-break-after:always;break-after:page}
  .slot.empty::before{content:none}
  [contenteditable]:hover,[contenteditable]:focus{box-shadow:none}
}
</style>
</head>
<body>

<div id="topbar">
  <img class="logo" src="../contracts/assets/brand/lawang-logo-v3.png" alt="" onerror="this.remove()">
  <input id="ptitle" value="Dossier" spellcheck="false" title="Nombre del dossier (también nombra el PDF)">
  <span id="zoomctl">Zoom
    <button class="tbtn" onclick="setZoom(-0.1)">−</button>
    <button class="tbtn" onclick="setZoom(0.1)">+</button>
  </span>
  <button class="tbtn" onclick="loadJSON()">Cargar</button>
  <button class="tbtn" onclick="saveJSON()">Guardar</button>
  <button class="tbtn primary" onclick="exportPDF()">Exportar PDF</button>
</div>

<div id="sidebar">
  <h3>Páginas</h3>
  <div id="plist"></div>
  <button id="addpage" onclick="openModal()">+ Añadir página</button>
</div>

<div id="stage"><div id="pages"></div></div>

<div id="modal" onclick="if(event.target===this)closeModal()">
  <div class="box">
    <h2>Añadir página</h2>
    <p>Elige un tipo de página del dossier. Todos los textos se editan haciendo clic encima; las imágenes, pulsando en su hueco.</p>
    <div id="typegrid"></div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="imgfile" accept="image/*" hidden>
<input type="file" id="jsonfile" accept=".json,application/json" hidden>

<script>
/* =================================================================
   Constructor de dossiers Lawang — un solo archivo, sin backend.
   Estado = {title, pages:[{id,type,d:{campo:html}, img:{slot:dataURL}}]}
   Los textos son contenteditable (se guarda innerHTML); las imágenes
   se re-encodean a JPEG máx 2200px al importarlas (peso del JSON).
   PDF = impresión del navegador (mismo patrón que contracts/app.html).
   ================================================================= */

const LOGO_LIGHT='../contracts/assets/brand/lawang-logo-v3.png';

/* ---------- tipos de página: nombre, descripción, campos por defecto, plantilla ---------- */
const TYPES={
  cover:{
    name:'Portada', desc:'Imagen a sangre completa, logo, título grande y claim.',
    d:{kick:'WELCOME TO', title:'PALM FIELD', claim:'Presence, without excess. Intention, without explanation. Experience, without effort.', foot:'2026 · TROPICAL PROPERTIES · SIGNATURE DEVELOPMENTS'},
    imgs:['bg'],
    tpl:p=>`<div class="slot bg" data-i="bg"></div><div class="shade"></div>
      <img class="logo" src="${LOGO_LIGHT}" alt="" onerror="this.remove()">
      <div class="mid"><div class="kick" data-e="kick"></div><div class="title" data-e="title"></div><div class="claim" data-e="claim"></div></div>
      <div class="foot" data-e="foot"></div>`
  },
  statement:{
    name:'Statement', desc:'Página oscura con una frase de manifiesto en grande.',
    d:{big:'WHAT IF ETERNITY COULD BE OWNED', note:'A limited collection of freehold villas in the jungles of Bali.'},
    imgs:['bg'],
    tpl:p=>`<div class="slot bg" data-i="bg"></div>
      <div class="mid"><div class="big" data-e="big"></div><div class="note" data-e="note"></div></div>`
  },
  stats:{
    name:'Datos + imagen', desc:'Media página de imagen y cuatro cifras clave con etiqueta.',
    d:{kick:'INDONESIA', title:"The world's largest archipelago", intro:'Early positioning. Limited by nature, not by marketing.',
       n1:'17,000+',l1:'Islands in the archipelago', n2:'14M',l2:'International tourists per year',
       n3:'Top 3',l3:'Safest country in Southeast Asia', n4:'7th',l4:'Largest economy in the world'},
    imgs:['side'],
    tpl:p=>`<div class="slot side" data-i="side"></div>
      <div class="right"><div class="kick" data-e="kick"></div><div class="title" data-e="title"></div><div class="intro" data-e="intro"></div>
      <div class="grid">${[1,2,3,4].map(i=>`<div class="stat"><div class="n" data-e="n${i}"></div><div class="l" data-e="l${i}"></div></div>`).join('')}</div></div>`
  },
  feature:{
    name:'Imagen + texto', desc:'Foto a sangre con degradado, título, párrafo y chips destacados.',
    d:{kick:'BALIAN · BALI', title:'A different phase of Bali', body:'The growth of the area is not driven by speculation, rather by publicly announced planning: the North Bali International Airport, new road connections and world-class leisure developments.', c1:'NEW AIRPORT', c2:'NEW HIGHWAY', c3:'THEME PARK'},
    imgs:['bg'],
    tpl:p=>`<div class="slot bg" data-i="bg"></div><div class="shade"></div>
      <div class="txt"><div class="kick" data-e="kick"></div><div class="title" data-e="title"></div><div class="body" data-e="body"></div>
      <div class="chips"><span class="chip" data-e="c1"></span><span class="chip" data-e="c2"></span><span class="chip" data-e="c3"></span></div></div>`
  },
  gallery:{
    name:'Galería (3)', desc:'Tres imágenes con rótulo bajo cada una.',
    d:{kick:'THE PROJECT', title:'The view, the plot, the villas', cap1:'THE VIEW', cap2:'THE PLOT', cap3:'THE VILLAS'},
    imgs:['g1','g2','g3'],
    tpl:p=>`<div class="kick" data-e="kick"></div><div class="title" data-e="title"></div>
      <div class="row">${[1,2,3].map(i=>`<div class="cell"><div class="slot" data-i="g${i}"></div><div class="cap" data-e="cap${i}"></div></div>`).join('')}</div>`
  },
  plan:{
    name:'Masterplan / plano', desc:'Banda de título y plano o mapa a página completa.',
    d:{title:'Masterplan', sub:'Plots available · from 250 m²'},
    imgs:['bg'],
    tpl:p=>`<div class="band"><div class="title" data-e="title"></div><div class="sub" data-e="sub"></div></div>
      <div class="slot bg" data-i="bg"></div>`
  },
  villa:{
    name:'Ficha de villa', desc:'Nombre, precio, superficies, specs (rooms/baths…) y dos fotos.',
    d:{kick:'PRIVATE VILLAS', name:'DUNE', invfrom:'Investment from', price:'€ 95.000',
       areas:'BUILDING AREA · 47 m²<br>POOL TERRACE · 29 m²',
       s1:'1',t1:'Rooms', s2:'1',t2:'Baths', s3:'1',t3:'Kitchen', s4:'1',t4:'Living'},
    imgs:['main','sec'],
    tpl:p=>`<div class="left"><div class="kick" data-e="kick"></div><div class="name" data-e="name"></div>
      <div class="invfrom" data-e="invfrom"></div><div class="price" data-e="price"></div>
      <div class="areas" data-e="areas"></div>
      <div class="specs">${[1,2,3,4].map(i=>`<div class="spec"><div class="n" data-e="s${i}"></div><div class="l" data-e="t${i}"></div></div>`).join('')}</div></div>
      <div class="rightcol"><div class="slot main" data-i="main"></div><div class="slot sec" data-i="sec"></div></div>`
  },
  text:{
    name:'Texto', desc:'Página de texto a dos columnas con título. Para intro, filosofía o legal.',
    d:{kick:'THE CONCEPT', title:'Tropical minimal, comfort first', body:'The essentials should feel right from the very first use. Fewer pieces, better materials, and a cleaner visual reading. Everything should be easy to clean, restock and maintain — small details greatly elevate the overall experience.'},
    imgs:[],
    tpl:p=>`<div class="kick" data-e="kick"></div><div class="title" data-e="title"></div><div class="body" data-e="body"></div>`
  },
  back:{
    name:'Contraportada', desc:'Cierre oscuro con logo, contacto y línea legal.',
    d:{contact:'lawangproperties.com<br>hello@lawangproperties.com', legal:'© 2026 LAWANG TROPICAL PROPERTIES · ALL RIGHTS RESERVED'},
    imgs:['bg'],
    tpl:p=>`<div class="slot bg" data-i="bg"></div>
      <div class="mid"><img class="logo" src="${LOGO_LIGHT}" alt="" onerror="this.remove()"><div class="contact" data-e="contact"></div></div>
      <div class="legal" data-e="legal"></div>`
  }
};

/* ---------- estado ---------- */
let state=null, uid=1;
const LS_KEY='lawang_dossier_builder';

function newPage(type){
  return {id:'p'+(uid++), type, d:JSON.parse(JSON.stringify(TYPES[type].d)), img:{}};
}
function defaultProject(){
  return {title:'Dossier', pages:['cover','statement','stats','feature','gallery','plan','villa','text','back'].map(newPage)};
}

/* ---------- render ---------- */
const $pages=document.getElementById('pages'), $plist=document.getElementById('plist');

function render(){
  $pages.innerHTML='';
  state.pages.forEach((p,idx)=>{
    const wrap=document.createElement('div');wrap.className='sheetwrap';wrap.id='wrap_'+p.id;
    const label=document.createElement('div');label.className='plabel';
    label.textContent=(idx+1)+' · '+TYPES[p.type].name;
    const page=document.createElement('div');page.className='page pg-'+p.type;page.dataset.id=p.id;
    page.innerHTML=TYPES[p.type].tpl(p);
    // volcar textos guardados
    page.querySelectorAll('[data-e]').forEach(el=>{
      el.contentEditable=true; el.spellcheck=false;
      el.innerHTML=p.d[el.dataset.e]??'';
    });
    // volcar imágenes + botón quitar
    page.querySelectorAll('[data-i]').forEach(el=>{
      const src=p.img[el.dataset.i];
      el.classList.toggle('empty',!src);
      el.style.backgroundImage=src?`url(${src})`:'';
      const rm=document.createElement('button');rm.className='rm';rm.textContent='✕';rm.title='Quitar imagen';
      rm.onclick=e=>{e.stopPropagation();delete p.img[el.dataset.i];render();persist();};
      el.appendChild(rm);
      el.onclick=e=>{if(e.target===rm)return;pickImage(p,el.dataset.i);};
    });
    // nº de página (no en portada/contraportada)
    if(p.type!=='cover'&&p.type!=='back'){
      const dark=(p.type==='statement');
      const no=document.createElement('div');no.className='pageno';no.textContent=String(idx+1).padStart(2,'0');
      const tag=document.createElement('div');tag.className='brandtag';tag.textContent='LAWANG · TROPICAL PROPERTIES';
      if(dark){no.style.color='#F5F0E6';tag.style.color='#F5F0E6';}
      page.append(tag,no);
    }
    wrap.append(label,page);$pages.appendChild(wrap);
  });
  renderList();
}

function renderList(){
  $plist.innerHTML='';
  state.pages.forEach((p,idx)=>{
    const t=TYPES[p.type];
    const div=document.createElement('div');div.className='pitem';
    const firstText=Object.values(p.d)[Object.keys(p.d).findIndex(k=>['title','name','big','contact'].includes(k))]??Object.values(p.d)[0]??'';
    div.innerHTML=`<div class="pt">${idx+1} · ${t.name}</div><div class="pn">${String(firstText).replace(/<[^>]*>/g,' ')}</div>`;
    const acts=document.createElement('div');acts.className='acts';
    [['↑','Subir',()=>move(idx,-1)],['↓','Bajar',()=>move(idx,1)],['⧉','Duplicar',()=>dup(idx)],['✕','Eliminar',()=>del(idx)]]
      .forEach(([txt,tip,fn])=>{const b=document.createElement('button');b.textContent=txt;b.title=tip;b.onclick=e=>{e.stopPropagation();fn();};acts.appendChild(b);});
    div.appendChild(acts);
    div.onclick=()=>document.getElementById('wrap_'+p.id).scrollIntoView({behavior:'smooth',block:'start'});
    $plist.appendChild(div);
  });
}

function move(i,dir){const j=i+dir;if(j<0||j>=state.pages.length)return;[state.pages[i],state.pages[j]]=[state.pages[j],state.pages[i]];render();persist();}
function dup(i){const c=JSON.parse(JSON.stringify(state.pages[i]));c.id='p'+(uid++);state.pages.splice(i+1,0,c);render();persist();}
function del(i){if(!confirm('¿Eliminar la página '+(i+1)+'?'))return;state.pages.splice(i,1);render();persist();}

/* ---------- edición de texto (delegado, sin re-render) ---------- */
$pages.addEventListener('input',e=>{
  const el=e.target.closest('[data-e]');if(!el)return;
  const page=el.closest('.page');const p=state.pages.find(x=>x.id===page.dataset.id);
  if(p){p.d[el.dataset.e]=el.innerHTML;persist();renderList();}
});

/* ---------- imágenes: file → downscale → dataURL ---------- */
let imgTarget=null;
const $imgfile=document.getElementById('imgfile');
function pickImage(p,slot){imgTarget={p,slot};$imgfile.value='';$imgfile.click();}
$imgfile.onchange=()=>{
  const f=$imgfile.files[0];if(!f||!imgTarget)return;
  const img=new Image();
  img.onload=()=>{
    const MAX=2200, r=Math.min(1,MAX/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');
    cv.width=Math.round(img.width*r);cv.height=Math.round(img.height*r);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    // ponytail: siempre JPEG q.85 — si algún día hace falta transparencia, ramificar por f.type
    imgTarget.p.img[imgTarget.slot]=cv.toDataURL('image/jpeg',.85);
    URL.revokeObjectURL(img.src);render();persist();
  };
  img.src=URL.createObjectURL(f);
};

/* ---------- guardar / cargar / autosave ---------- */
function snapshot(){state.title=document.getElementById('ptitle').value.trim()||'Dossier';return state;}
function persist(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(snapshot()));}
  catch(_){/* cuota llena (muchas imágenes): el autosave deja de cubrir — usar Guardar */}
}
function saveJSON(){
  const s=snapshot();
  const blob=new Blob([JSON.stringify(s)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=s.title.replace(/[^\w\-áéíóúñÁÉÍÓÚÑ ]+/g,'').replace(/\s+/g,'_')+'.dossier.json';
  a.click();URL.revokeObjectURL(a.href);toast('Dossier guardado ✓');
}
const $jsonfile=document.getElementById('jsonfile');
function loadJSON(){$jsonfile.value='';$jsonfile.click();}
$jsonfile.onchange=()=>{
  const f=$jsonfile.files[0];if(!f)return;
  f.text().then(txt=>{
    const s=JSON.parse(txt);
    if(!s||!Array.isArray(s.pages))throw 0;
    state=s;uid=Math.max(1,...state.pages.map(p=>+String(p.id).slice(1)||0))+1;
    document.getElementById('ptitle').value=state.title||'Dossier';
    render();persist();toast('Dossier cargado ✓');
  }).catch(()=>toast('Ese archivo no es un dossier válido'));
};
document.getElementById('ptitle').addEventListener('input',persist);

/* ---------- exportar PDF ---------- */
function exportPDF(){
  const prev=document.title;
  document.title=snapshot().title;           // nombre sugerido del PDF
  window.print();
  document.title=prev;
}

/* ---------- modal + zoom + toast ---------- */
function openModal(){document.getElementById('modal').classList.add('on');}
function closeModal(){document.getElementById('modal').classList.remove('on');}
const $tg=document.getElementById('typegrid');
Object.entries(TYPES).forEach(([key,t])=>{
  const b=document.createElement('button');b.className='tcard';
  b.innerHTML=`<div class="tt">${t.name}</div><div class="td">${t.desc}</div>`;
  b.onclick=()=>{state.pages.push(newPage(key));closeModal();render();persist();
    document.getElementById('wrap_'+state.pages.at(-1).id).scrollIntoView({behavior:'smooth'});};
  $tg.appendChild(b);
});
function setZoom(dz){
  const z=Math.min(1.2,Math.max(.25,parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--zoom'))+dz));
  document.documentElement.style.setProperty('--zoom',z.toFixed(2));
}
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),1600);
}

/* ---------- init ---------- */
try{state=JSON.parse(localStorage.getItem(LS_KEY));}catch(_){}
if(!state||!Array.isArray(state.pages))state=defaultProject();
else uid=Math.max(1,...state.pages.map(p=>+String(p.id).slice(1)||0))+1;
document.getElementById('ptitle').value=state.title||'Dossier';
render();
</script>
