  *{ box-sizing:border-box; } html,body{ margin:0; height:100%; }

  /* ── carpetas como TARJETA, no como chip (6-ago-2026) ──────────────────
     Era un `.sui-chip` de 12px con el número de subíndice: con veinte carpetas
     eso es una sopa de pastillas donde no se distingue la jerarquía ni se ve de
     un vistazo dónde está el volumen de documentos. La tarjeta da sitio al
     número —que es el dato que se busca— y al icono.
     Ancho mínimo y no fijo: una carpeta se llama «Precios» o
     «Especificaciones técnicas», y recortar el nombre para que la rejilla case
     sería cambiar legibilidad por simetría. */
  .carp{ display:flex; align-items:center; gap:10px; min-width:190px; text-align:left;
         font:inherit; font-size:13.5px; color:var(--texto); cursor:pointer;
         background:var(--sup-1); border:1px solid var(--linea); border-radius:var(--r-m);
         padding:11px 14px; min-height:24px;
         transition:border-color var(--t-rapido), box-shadow var(--t-rapido),
                    transform .15s ease, background var(--t-rapido); }
  .carp:hover{ border-color:var(--dl,#104C4F); transform:translateY(-1px); box-shadow:var(--sombra-1); }
  .carp .ic{ font-size:17px; line-height:1; flex:none; }
  .carp .t{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* El número, con cifras de ancho fijo y a la derecha: es lo que se compara
     entre carpetas, y con `tabular-nums` 8 y 112 casan por columna. */
  .carp .n{ flex:none; font-variant-numeric:tabular-nums; font-weight:600;
            font-size:12.5px; color:var(--texto-2); background:var(--sup-2);
            border-radius:var(--r-p); padding:2px 9px; }
  /* Seleccionada: el MISMO lenguaje que la fila seleccionada de la tabla —
     relleno suave + filete de acento a la izquierda + dato en tinta de marca.
     Tres señales, no una de color (ver `--sup-sel` en suite.css). */
  .carp.on{ background:var(--sup-sel); border-color:var(--dl,#104C4F);
            box-shadow:inset 3px 0 0 var(--dl,#104C4F); }
  .carp.on .t{ font-weight:600; color:var(--dl,#104C4F); }
  .carp.on .n{ background:var(--sup-1); color:var(--dl,#104C4F); }
  @media (max-width:760px){ .carp{ min-width:0; flex:1 1 100%; } }

  /* medidor de almacenamiento */
  .uso{ border:1px solid var(--linea); border-radius:var(--r-m); background:var(--sup-1);
        padding:var(--e3) var(--e4); margin:0 0 var(--e3); }
  .uso h3{ margin:0 0 8px; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
           color:var(--texto-2); font-weight:600; }
  .barra{ height:7px; border-radius:var(--r-p); background:#E7E1D2; overflow:hidden; margin:4px 0 3px; }
  .barra i{ display:block; height:100%; background:#3F5230; }
  .barra.aviso i{ background:#8C5E10; } .barra.mal i{ background:#9E2F26; }
  .uso .n{ font-size:12.5px; color:var(--texto-2); display:flex; justify-content:space-between; gap:10px; }
  .uso .n b{ color:var(--texto); font-variant-numeric:tabular-nums; }

  /* Vista previa de Drive: alto fijo y sin borde. 420px es lo que deja ver una
     portada A4 entera sin comerse el cajon; por debajo hay que desplazar dentro
     del marco, que es lo peor de los visores incrustados. */
  .dprev{ width:100%; height:420px; border:0; display:block; background:#EDE7D9; }
  @media (max-width:760px){ .dprev{ height:300px; } }

<!-- esc() y toast(), que estaban copiados en cada herramienta. Va ANTES del
     script de la pagina: son `const` de primer nivel y dos declaraciones del
     mismo nombre revientan la pagina entera. -->
<script src="/contracts/assets/suite-comun.js?v=76746232"></script>
<script>
/* ============================================================================
   Documentación de proyectos — índice por CARPETAS, con enlaces externos
   ----------------------------------------------------------------------------
   31-jul-2026, sobre la capa compartida `suite.css` + `suite.js`.

   YA NO SE SUBEN ARCHIVOS. Van todos a Google Drive o a un enlace externo, por
   petición del owner y por una razón concreta: un dossier pasa de 50 MB, el
   almacén de Supabase es de 1 GB PARA TODO —contratos firmados incluidos— y al
   ritmo actual quedan unos 60 días de margen. En Drive el espacio ya está
   pagado. Aquí queda la ficha, que es lo que hace que el documento se encuentre.
   Lo que se subió antes de este cambio SE SIGUE ABRIENDO con enlace firmado:
   quitarle la salida a un archivo que ya está dentro no libera nada y pierde el
   documento.

   Las CARPETAS se derivan de las rutas guardadas y no hay tabla de carpetas.
   Ventaja: no existen carpetas vacías que nadie limpia, ni dos verdades sobre
   dónde está un documento. Contrapartida, dicha en voz alta: una carpeta existe
   mientras tenga algo dentro, y se crea escribiendo su ruta al añadir.
   ========================================================================== */
const SB_URL = 'https://vtulllundrfennhjddhc.supabase.co';
const SB_KEY = 'sb_publishable_B_ot_6lNVRLiWiEMtApYOQ_3Ho3xNUg';   // publicable: el candado es la RLS
const BUCKET = 'documentacion';

const CATEGORIAS = [
  ['precios','Precios'], ['planos','Planos'], ['legal','Legal'],
  ['comercial','Comercial'], ['tecnico','Técnico'], ['fotos','Fotos'], ['otros','Otros'],
];

const $ = s => document.querySelector(s);
const mb = b => !b ? '—' : b < 1048576 ? Math.round(b/1024) + ' KB' : (b/1048576).toFixed(1) + ' MB';
const fecha = f => f ? new Date(f).toLocaleDateString('es-ES', {day:'2-digit', month:'short', year:'numeric'}) : '';
const esSuperAdmin = rol => rol === 'super_admin';

let SB=null, DOCS=[], SEL=null, PROYECTOS=[], CAT='', PROY='', CARPETA='', Q='', ROL=null;
let CARGANDO=true, FALLO=null;
const ORDEN = { campo:'titulo', dir:'asc' };
/* URL firmadas cacheadas por ruta: caducan a los 15 min — tiempo de sobra para
   leer un PDF y poco para que un enlace reenviado por error siga sirviendo. */
const FIRMADAS = new Map();

/* ---------- carga ---------- */
async function cargar(){
  CARGANDO = true; FALLO = null; pintar();
  const { data, error } = await SB.from('documentos_proyecto')
    .select('id, proyecto, carpeta, categoria, titulo, descripcion, path, url, mime, bytes, confidencial, visible_portal, creado_en, creado_por')
    .order('proyecto').order('carpeta').order('titulo');
  CARGANDO = false;
  if(error){ FALLO = error.message; pintar(); return; }
  DOCS = data || [];
  // La lista de proyectos sale del diccionario de contratos (fuente única) más
  // los que ya tengan documentos, por si alguno se guardó con otro nombre.
  let delTokens = [];
  try{
    const t = await fetch('/contracts/tokens.json?v=' + Date.now()).then(r => r.json());
    (t.sections || []).forEach(sec => (sec.fields || []).forEach(f => {
      if(f[0] === 'proyecto_nombre' && Array.isArray(f[3])) delTokens = f[3].slice();
    }));
  }catch(_){}
  /* Los dos primeros no son promociones: son la EMPRESA. Un documento como los
     anexos de las casas (Dali, Dream, Dune, Tropical) no es de Palm Field ni de
     Bonian Village — vale para todas, y archivarlo dentro de una obligaba a
     elegir una al azar y luego no encontrarlo desde las demás. Van delante y
     fuera del orden alfabético a propósito: si se ordenan con el resto, «Lawang
     (general)» cae entre dos promociones y parece una más.
     La columna `proyecto` es texto libre y sin CHECK, así que esto es solo la
     lista que se OFRECE: no hace falta tocar la base. */
  const GENERALES = ['Lawang (general)', 'Sumba (general)'];
  const resto = [...new Set([...delTokens, ...DOCS.map(d => d.proyecto)])]
    .filter(p => p && !GENERALES.includes(p)).sort((a, b) => a.localeCompare(b));
  PROYECTOS = [...GENERALES, ...resto];
  pintar();
}

/* ---------- árbol de carpetas ---------- */
function ramas(){
  const set = new Set();
  DOCS.filter(d => !PROY || d.proyecto === PROY).forEach(d => {
    const partes = String(d.carpeta || '').split('/').filter(Boolean);
    for(let i = 1; i <= partes.length; i++) set.add(partes.slice(0, i).join('/'));
  });
  return [...set].sort((a, b) => a.localeCompare(b, 'es'));
}
const dentroDe = (d, ruta) => ruta === ''
  || d.carpeta === ruta || String(d.carpeta || '').startsWith(ruta + '/');

/* Las carpetas pasan de chip pequeño a TARJETA (6-ago-2026, handoff de diseño).
   Es puramente visual: `ramas()` y `dentroDe()` siguen siendo los mismos, el
   atributo `data-carp` es el mismo y quien escucha el clic no cambia — lo único
   distinto es la forma del botón y que el número se lee de un vistazo en vez de
   ir de subíndice.
   La sangría por profundidad se conserva: era la única señal de que
   «Precios/2026» está dentro de «Precios», y una rejilla plana la habría
   perdido. Se hace con `margin-left` sobre la tarjeta, como antes. */
function pintarArbol(){
  const base = DOCS.filter(d => !PROY || d.proyecto === PROY);
  const n = ruta => base.filter(d => dentroDe(d, ruta)).length;
  const tarjeta = (ruta, etiqueta, hondo) =>
    `<button class="carp ${CARPETA===ruta?'on':''}" data-carp="${esc(ruta)}"` +
    (ruta ? ` title="${esc(ruta)}"` : '') +
    (hondo ? ` style="margin-left:${hondo * 18}px"` : '') + '>' +
      /* Emoji y no un icono de fuente: esta página no carga Phosphor, y traer un
         CSS de CDN entero (con su `integrity` y su versión fijada, que es la
         norma del estudio) para tres carpetas no se paga. El original ya usaba
         📁; aquí solo es más grande. */
      `<span class="ic" aria-hidden="true">${hondo ? '📂' : '📁'}</span>` +
      `<span class="t">${esc(etiqueta)}</span>` +
      `<span class="n">${n(ruta)}</span>` +
    '</button>';
  $('#arbol').innerHTML =
    tarjeta('', 'Todas', 0) +
    ramas().map(ruta => tarjeta(ruta, ruta.split('/').pop(), ruta.split('/').length - 1)).join('');
}

function visibles(){
  const q = Q.trim().toLowerCase();
  const f = DOCS.filter(d =>
    (!PROY || d.proyecto === PROY) && dentroDe(d, CARPETA) &&
    (!CAT || d.categoria === CAT) &&
    (!q || [d.titulo, d.proyecto, d.carpeta, d.descripcion, d.creado_por]
            .some(v => String(v||'').toLowerCase().includes(q))));
  return suiOrdenar(f, ORDEN, (d, c) => d[c]);
}

function pintar(){ pintarProyectos(); pintarArbol(); pintarFiltros(); pintarTabla(); }

function pintarProyectos(){
  $('#fProyecto').innerHTML = '<option value="">Todos los proyectos</option>' +
    PROYECTOS.map(p => `<option value="${esc(p)}" ${p===PROY?'selected':''}>${esc(p)}</option>`).join('');
}
function pintarFiltros(){
  const base = DOCS.filter(d => (!PROY || d.proyecto === PROY) && dentroDe(d, CARPETA));
  const n = c => base.filter(d => !c || d.categoria === c).length;
  $('#filtros').innerHTML =
    `<button class="sui-chip ${CAT===''?'on':''}" data-c="">Todas<span class="n">${n('')}</span></button>` +
    CATEGORIAS.map(([v,l]) => `<button class="sui-chip ${CAT===v?'on':''} ${n(v)?'':'vacio'}" data-c="${v}">${l}<span class="n">${n(v)}</span></button>`).join('');
}

function pintarTabla(){
  const cuerpo = $('#filas');
  if(CARGANDO){
    // Esqueleto y no un "Cargando…": mantiene el alto y evita el salto cuando
    // llegan las filas.
    cuerpo.innerHTML = Array.from({length:5}, () => '<tr class="sui-esqueleto">' + '<td><i></i></td>'.repeat(5) + '</tr>').join('');
    return;
  }
  if(FALLO){ cuerpo.innerHTML = `<tr><td colspan="5" class="sui-error">No se pudo leer la documentación: ${esc(FALLO)}</td></tr>`; return; }
  const vis = visibles();
  if(!vis.length){
    const filtrando = PROY || CARPETA || CAT || Q.trim();
    cuerpo.innerHTML = `<tr><td colspan="5"><div class="sui-nada">
      <b>${filtrando ? 'Nada aquí' : 'Todavía no hay documentación'}</b>
      ${filtrando ? 'Prueba a quitar un filtro o a subir un nivel de carpeta.' : 'Añade el primer enlace con «+ Añadir enlace».'}
    </div></td></tr>`;
    return;
  }
  cuerpo.innerHTML = vis.map(d => {
    const cat = (CATEGORIAS.find(c => c[0] === d.categoria) || ['otros','Otros'])[1];
    return `<tr data-id="${d.id}" class="${SEL===d.id?'sel':''}">
      <td class="clave">${esc(d.titulo)}</td>
      <td>${d.carpeta ? esc(d.carpeta) : '<span class="flojo">raíz</span>'}</td>
      <td><span class="sui-tag c-${esc(d.categoria)}">${esc(cat)}</span></td>
      <td>${d.url ? 'Drive / externo' : '<span class="flojo">archivo · ' + mb(d.bytes) + '</span>'}</td>
      <td>${esc(fecha(d.creado_en))}${d.confidencial ? ' <span class="conf">conf.</span>' : ''}${
        d.visible_portal ? ' <span class="sui-tag ok">portal</span>' : ''}</td>
    </tr>`;
  }).join('');
}

/* ---------- cajón: ficha del documento ---------- */
function abrirDoc(id){
  const d = DOCS.find(x => x.id === id); if(!d) return;
  SEL = id; pintarTabla();
  const cat = (CATEGORIAS.find(c => c[0] === d.categoria) || ['otros','Otros'])[1];
  const enlace = !!d.url;
  suiAbrirCajon({
    titulo: esc(d.titulo),
    sub: esc(d.proyecto) + (d.carpeta ? ' · ' + esc(d.carpeta) : '') + ' · ' + esc(cat),
    cuerpo: `
      <dl class="sui-dl">
        <dt>Dónde</dt><dd>${enlace ? 'Google Drive o enlace externo' : 'Archivo en el almacén del estudio'}</dd>
        ${enlace ? '' : `<dt>Tamaño</dt><dd>${mb(d.bytes)}</dd>`}
        <dt>Añadido</dt><dd>${esc(fecha(d.creado_en))}${d.creado_por ? ' por ' + esc(d.creado_por) : ''}</dd>
        <dt>Acceso</dt><dd>${d.confidencial ? '<span class="conf">Confidencial — no compartir fuera del estudio</span>' : 'Compartible con el cliente'}</dd>
        <dt>Portal</dt><dd>${d.visible_portal
          ? '<span class="sui-tag ok">Lo ven los compradores de ' + esc(d.proyecto) + '</span>'
          : 'No sale en el portal del comprador'}</dd>
      </dl>
      ${d.descripcion ? `<p class="sui-nota">${esc(d.descripcion)}</p>` : ''}
      <p class="sui-nota">${enlace
        ? 'El documento vive fuera de aquí, así que <b>quién puede abrirlo lo decide Drive</b>, no esta herramienta. Compruébalo allí.'
        : 'Archivo subido antes de que la herramienta pasara a enlaces. Se abre con un enlace temporal de 15 minutos.'}</p>
      ${esSuperAdmin(ROL) ? '' : '<p class="sui-nota">Quitar documentación está reservado al super admin.</p>'}
      ${previsualizacion(d)}`,
    pie: `<button class="sui-btn primario" id="btnAbrir">Abrir${enlace ? ' en Drive' : ''}</button>
          <button class="sui-btn" id="btnEditar">Editar</button>
          ${esSuperAdmin(ROL) ? '<button class="sui-btn peligro" id="btnBorrar">Quitar</button>' : ''}`,
    onCerrar: () => { SEL = null; pintarTabla(); },
  });
  $('#btnAbrir').onclick = () => enlace ? window.open(d.url, '_blank', 'noopener') : abrirArchivo(d);
  $('#btnEditar').onclick = () => formDoc(d);
  const bb = $('#btnBorrar'); if(bb) bb.onclick = () => borrar(d);
}

/* ---------- vista previa de un documento de Drive ----------
   Drive sirve una vista incrustable cambiando `/view` por `/preview` en la URL
   del archivo. Solo funciona con enlaces de archivo (`/file/d/<id>/`): una
   carpeta o un Doc/Sheet tienen otra forma y ahí no se fuerza nada — se enseña
   el botón de abrir y ya.
   ⚠️ Lo que se ve DEPENDE DE DRIVE: si el archivo no está compartido con quien
   mira, el marco sale pidiendo permiso. Es correcto que sea así —el permiso lo
   pone Drive, no esta herramienta— pero conviene saberlo antes de pensar que la
   vista previa está rota. */
function idDeDrive(url){
  const m = String(url || '').match(/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]+)/);
  return m ? m[1] : null;
}
function previsualizacion(d){
  const id = d.url ? idDeDrive(d.url) : null;
  if(!id) return '';
  return `<div class="sui-bloque" style="padding:0;overflow:hidden">
      <iframe class="dprev" src="https://drive.google.com/file/d/${esc(id)}/preview"
        loading="lazy" referrerpolicy="no-referrer" title="Vista previa"></iframe>
    </div>
    <p class="sui-nota">Vista previa servida por Drive. Si aparece pidiendo permiso,
      es que el archivo no está compartido con tu cuenta: se arregla en Drive.</p>`;
}

/* ---------- crear o editar ----------
   El mismo formulario para las dos cosas: un alta es una edición de algo que
   todavía no existe. Con dos formularios distintos, un campo nuevo se añade en
   uno y se olvida en el otro. */
function formDoc(d){
  const editando = !!d;
  if(!editando){ SEL = null; pintarTabla(); }
  const conocidas = [...new Set(DOCS.map(x => x.carpeta).filter(Boolean))].sort();
  const v = d || {};
  suiAbrirCajon({
    titulo: editando ? 'Editar documento' : 'Añadir enlace',
    sub: editando ? esc(v.titulo) : 'Un documento de Google Drive o cualquier enlace externo.',
    cuerpo: `
      <div class="campo"><label>Proyecto</label>
        <select id="sProyecto">${PROYECTOS.map(p => `<option ${p===(v.proyecto||PROY)?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
      <div class="campo"><label>Carpeta</label>
        <input id="sCarpeta" list="conocidas" value="${esc(v.carpeta != null ? v.carpeta : CARPETA)}" placeholder="Comercial/Dossiers">
        <datalist id="conocidas">${conocidas.map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
      <p class="sui-nota" style="margin-top:-6px">Los niveles se separan con barras. En blanco = raíz del proyecto.
        Mover un documento de carpeta es cambiar esta ruta.</p>
      <div class="campo"><label>Título</label><input id="sTitulo" value="${esc(v.titulo||'')}" placeholder="Ej. Dossier Palm Field"></div>
      <div class="campo"><label>Categoría</label>
        <select id="sCategoria">${CATEGORIAS.map(([x,l]) => `<option value="${x}" ${v.categoria===x?'selected':''}>${l}</option>`).join('')}</select></div>
      ${v.path
        ? `<p class="sui-nota">Este documento es un <b>archivo subido</b>, no un enlace: el fichero no se
             cambia desde aquí. Se puede editar todo lo demás.</p>`
        : `<div class="campo"><label>Enlace</label><input id="sUrl" value="${esc(v.url||'')}" placeholder="https://drive.google.com/…" inputmode="url"></div>`}
      <div class="campo"><label>Descripción (opcional)</label><textarea id="sDesc">${esc(v.descripcion||'')}</textarea></div>
      <label class="ck"><input type="checkbox" id="sConf" ${v.confidencial === false ? '' : 'checked'}> Confidencial — no compartir fuera del estudio</label>
      <label class="ck"><input type="checkbox" id="sPortal" ${v.visible_portal ? 'checked' : ''}> Visible en el portal del comprador</label>
      <p class="sui-nota">Lo verán los compradores <b>con contrato en esa promoción</b>, no todos. Es una
        decisión aparte de «confidencial»: que se pueda enseñar dentro del estudio no significa que deba
        salir en el portal de un cliente. Un archivo subido se sirve con enlace temporal; un enlace de
        Drive lo abre Drive, así que <b>compruébalo allí antes de marcarlo</b>.</p>
      <p class="sui-nota"><b>Comprueba en Drive con quién está compartido.</b> Aquí se guarda el enlace;
        el permiso para abrirlo lo pone Drive.</p>`,
    pie: `<button class="sui-btn primario" id="btnGuardar">${editando ? 'Guardar cambios' : 'Guardar enlace'}</button>
          <button class="sui-btn" id="btnCancelar">Cancelar</button>`,
    onCerrar: () => { if(!editando){ SEL = null; pintarTabla(); } },
  });
  $('#btnGuardar').onclick = () => guardarDoc(d);
  $('#btnCancelar').onclick = () => editando ? abrirDoc(d.id) : suiCerrarCajon();
}

async function guardarDoc(d){
  const editando = !!d;
  const titulo = $('#sTitulo').value.trim();
  const campoUrl = $('#sUrl');
  const url = campoUrl ? campoUrl.value.trim() : null;
  if(!titulo){ toast('Ponle un título'); $('#sTitulo').focus(); return; }
  // Solo http(s): un `javascript:` guardado aquí sería un clic ejecutable para
  // el siguiente que abra la ficha.
  if(campoUrl && !/^https?:\/\//i.test(url)){
    toast('El enlace tiene que empezar por http:// o https://'); campoUrl.focus(); return;
  }
  const b = $('#btnGuardar'); b.disabled = true;
  try{
    const fila = {
      proyecto: $('#sProyecto').value, carpeta: $('#sCarpeta').value.trim(),
      categoria: $('#sCategoria').value, titulo,
      descripcion: $('#sDesc').value.trim() || null, confidencial: $('#sConf').checked,
      visible_portal: $('#sPortal').checked,
    };
    if(campoUrl) fila.url = url;   // un archivo subido conserva su `path` intacto
    const q = editando
      ? SB.from('documentos_proyecto').update(fila).eq('id', d.id).select('id')
      : SB.from('documentos_proyecto').insert(fila).select('id');
    const { data, error } = await q;
    if(error) throw error;
    // La RLS no da error al denegar: devuelve CERO filas.
    if(!data || !data.length) throw new Error('no tienes permiso para ' + (editando ? 'editar' : 'añadir') + ' documentación');
    PROY = fila.proyecto;
    await cargar();
    if(editando){ SEL = d.id; abrirDoc(d.id); } else { suiCerrarCajon(); }
    toast(editando ? 'Guardado' : 'Enlace guardado');
  }catch(e){ toast('No se pudo guardar: ' + (e.message || e)); }
  b.disabled = false;
}

/* Los archivos que ya estaban subidos se siguen abriendo. */
async function abrirArchivo(d){
  try{
    let u = FIRMADAS.get(d.path);
    if(!u || u.expira < Date.now()){
      const { data, error } = await SB.storage.from(BUCKET).createSignedUrl(d.path, 900);
      if(error) throw error;
      u = { href: data.signedUrl, expira: Date.now() + 840000 };   // se renueva un minuto antes
      FIRMADAS.set(d.path, u);
    }
    window.open(u.href, '_blank', 'noopener');
  }catch(e){ toast('No se pudo abrir: ' + (e.message || e)); }
}

async function borrar(d){
  const aviso = d.url
    ? '¿Quitar «' + d.titulo + '» del índice?\n\nEl archivo SIGUE en Drive: aquí solo se borra el enlace.'
    : '¿Borrar «' + d.titulo + '»?\n\nSe borra el archivo y su ficha. No hay papelera.';
  if(!confirm(aviso)) return;
  try{
    // Primero el archivo y después la fila: al revés, un fallo al borrar el
    // objeto dejaría un fichero huérfano ocupando sitio y sin nadie que lo liste.
    if(d.path){
      const { error } = await SB.storage.from(BUCKET).remove([d.path]);
      if(error) throw error;
    }
    const { data, error } = await SB.from('documentos_proyecto').delete().eq('id', d.id).select('id');
    if(error) throw error;
    // La RLS no da error al denegar: devuelve CERO filas. Sin este control la
    // herramienta diría "quitado" y el documento seguiría ahí.
    if(!data || !data.length) throw new Error('no tienes permiso para quitar documentación');
    if(d.path) FIRMADAS.delete(d.path);
    suiCerrarCajon();
    await cargar();
    toast('Quitado');
  }catch(e){ toast('No se pudo quitar: ' + (e.message || e)); }
}

/* ---------- medidor de almacenamiento ----------
   Se queda aunque ya no se suba nada: los contratos firmados siguen llenándolo,
   y esta es la pantalla donde tiene sentido ver POR QUÉ los documentos van a
   Drive y no aquí. */
async function medidor(){
  const { data } = await SB.rpc('uso_almacenamiento');
  if(!data) return;
  const f = data.ficheros, b = data.base, margen = data.dias_de_margen;
  const clase = p => p >= 90 ? 'mal' : p >= 70 ? 'aviso' : '';
  $('#uso').hidden = false;
  $('#uso').innerHTML = `
    <h3>Almacenamiento del sistema</h3>
    <div class="n"><span>Archivos</span><span><b>${mb(f.bytes)}</b> de ${mb(f.limite)} · ${f.pct}%</span></div>
    <div class="barra ${clase(f.pct)}"><i style="width:${Math.min(100, f.pct)}%"></i></div>
    <div class="n" style="margin-top:8px"><span>Base de datos</span><span><b>${mb(b.bytes)}</b> de ${mb(b.limite)} · ${b.pct}%</span></div>
    <div class="barra ${clase(b.pct)}"><i style="width:${Math.min(100, b.pct)}%"></i></div>
    <p class="sui-nota">${margen == null ? 'Sin ritmo medible todavía.'
      : 'Al ritmo actual (' + data.ritmo_mb_dia + ' MB/día) quedan <b>' + margen + ' días</b>.'}
      Por eso la documentación va por enlace a Drive: este espacio lo necesitan los contratos firmados.</p>`;
}

/* ---------- eventos ---------- */
$('#q').addEventListener('input', e => { Q = e.target.value; pintarTabla(); });
$('#fProyecto').addEventListener('change', e => { PROY = e.target.value; CARPETA = ''; pintar(); });
$('#arbol').addEventListener('click', e => {
  const b = e.target.closest('[data-carp]'); if(!b) return;
  CARPETA = b.dataset.carp; pintar();
});
$('#filtros').addEventListener('click', e => {
  const b = e.target.closest('[data-c]'); if(!b) return;
  CAT = b.dataset.c; pintarFiltros(); pintarTabla();
});
$('#filas').addEventListener('click', e => {
  const tr = e.target.closest('[data-id]'); if(!tr) return;
  abrirDoc(tr.dataset.id);
});
$('#btnNuevo').addEventListener('click', () => formDoc(null));

suiMontarCajon();
suiOrdenable($('#tabla'), ORDEN, (d, c) => d[c], pintarTabla);

/* guard.js ya comprobó la sesión y leyó la ficha: se reusa su cliente y su rol
   en vez de abrir un segundo y volver a preguntar. */
window.LW_AUTH.then(async ({ sb, session, ficha }) => {
  SB = sb || window.supabase.createClient(SB_URL, SB_KEY);
  ROL = ficha ? ficha.rol : null;
  const who = $('#who'); if(who && session) who.textContent = session.user.email;
  $('#btnLogout').onclick = async () => { await SB.auth.signOut(); location.replace('/contracts/login.html'); };
  await cargar();
  medidor();
});
</script>
