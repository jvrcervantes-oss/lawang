<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.png">
<title>Lawang · Facturas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<!-- tokens de marca: los mismos que los contratos, fuente única -->
<link rel="stylesheet" href="/contracts/assets/brand.css">
<link rel="stylesheet" href="/contracts/assets/topbar.css">
<script src="/contracts/assets/topbar.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9/dist/umd/supabase.min.js" integrity="sha384-XtYxyIfxexJVTROWK0+c5T8tJ2ItsVLcdgR5nJIoo6WzQqaBZoTPGgbS7XvkRNBZ" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<!-- sociedades emisoras y cuentas de cobro: compartido con /contracts.
     El `?v=` salta por encima de la copia que el CDN cacheo ANTES de que el
     .htaccess pusiera no-cache en todo el js/css (el edge no revalida hasta que
     expire su TTL de 7 dias). Sin esto la factura de PT SAN DAL WOODS sigue
     saliendo con el logo de Lawang. Se puede quitar pasado el 3-ago-2026. -->
<script src="/contracts/assets/entities.js?v=20260730"></script>
<!-- aritmética de dinero (con test propio en totales.test.js) -->
<script src="totales.js"></script>
<script src="compradores.js"></script>
<style>
  /* --folio = color del papel del documento. Vive aquí y en un solo sitio a
     propósito: los logos de las sociedades vienen sin canal alfa (el de San
     Dal Woods es marrón sobre un rectángulo BLANCO opaco), así que si el folio
     deja de ser blanco el logo se ve pegado encima. Con `--folio` y el
     multiply del logo (ver `.doc .head img`) el papel se puede cambiar sin que
     aparezca ese recorte — 30-jul-2026. */
  :root{ --line:#e4ddcf; --card:#fffdf8; --field-bg:#fdfcf9; --tbh:56px; --folio:#fff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{ font-family:var(--font-body); background:var(--rl); color:var(--ink); }
  body[hidden]{ display:none; }

  /* ---------- chrome ---------- */
  /* Solo posicionamiento: el aspecto lo pone /contracts/assets/topbar.css,
     compartido con Contratos y Dossier. Fixed porque .stage compensa con
     padding-top:var(--tbh). */
  .topbar{ position:fixed; top:0; left:0; right:0; z-index:40; }

  .stage{ display:grid; grid-template-columns:minmax(360px,440px) 1fr; height:100%; padding-top:var(--tbh); }
  @media (max-width:900px){ .stage{ grid-template-columns:1fr; } .pane-preview{ display:none; } }

  /* ---------- formulario ---------- */
  .pane-form{ overflow:auto; border-right:1px solid var(--line); background:var(--rl); }
  .pane-form .inner{ padding:22px 20px 80px; }
  fieldset{ border:1px solid var(--line); border-radius:14px; background:var(--card); padding:16px 16px 18px; margin:0 0 16px; }
  legend{ font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); padding:0 8px; }
  label{ display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  label:first-of-type{ margin-top:2px; }
  input,select,textarea{ width:100%; font-family:inherit; font-size:14px; color:var(--ink); padding:9px 11px;
    border:1px solid var(--line); border-radius:9px; background:var(--field-bg); }
  input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--tg); box-shadow:0 0 0 3px rgba(72,91,55,.12); }
  textarea{ min-height:70px; resize:vertical; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .hint{ font-size:11.5px; color:var(--muted); margin:8px 0 0; line-height:1.45; }

  .linea{ display:grid; grid-template-columns:1fr 120px 30px; gap:8px; align-items:end; margin-bottom:8px; }
  .linea label{ margin:0 0 4px; }
  .xbtn{ font:inherit; font-size:16px; line-height:1; color:var(--muted); background:none; border:1px solid var(--line);
         border-radius:8px; height:37px; cursor:pointer; }
  .xbtn:hover{ color:#a3342b; border-color:#d9b8b3; }
  .addbtn{ font:inherit; font-size:12.5px; color:var(--tg); background:none; border:1px dashed var(--tg);
           border-radius:999px; padding:7px 14px; cursor:pointer; }

  /* lo que trae el contrato elegido */
  #delContrato:empty{ display:none; }
  #delContrato{ margin-top:10px; padding:11px 12px; border:1px solid var(--line); border-radius:11px; background:#f7f4ea; }
  #delContrato .t{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  #delContrato .arrastrado{ font-size:12px; color:var(--muted); margin:5px 0 0; line-height:1.5; }
  .hitos{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .hito{ font:inherit; font-size:12px; text-align:left; background:var(--card); border:1px solid var(--line);
         border-radius:9px; padding:6px 10px; cursor:pointer; }
  .hito:hover{ border-color:var(--tg); color:var(--dl); }
  .hito.usado{ opacity:.45; text-decoration:line-through; cursor:not-allowed; }
  .hito.usado:hover{ border-color:var(--line); color:inherit; }
  .hito b{ color:var(--dl); }

  /* ---------- vista previa ---------- */
  .pane-preview{ overflow:auto; background:#eae5d8; display:flex; flex-direction:column; }
  .pv-bar{ position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px; padding:10px 14px;
           background:#eae5d8ee; backdrop-filter:blur(6px); border-bottom:1px solid #dcd5c6; }
  .pv-bar b{ font-size:12.5px; font-weight:500; color:var(--muted); }
  .btn{ font:inherit; font-size:12.5px; border-radius:999px; padding:8px 15px; cursor:pointer; border:1px solid var(--line);
        background:var(--card); color:var(--ink); }
  .btn:hover{ border-color:var(--tg); }
  .btn.primary{ background:var(--dl); border-color:var(--dl); color:#fff; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .pv-scroll{ padding:22px 0 60px; display:flex; justify-content:center; }
  /* ponytail: zoom en pantalla para que el A4 quepa en el panel; la impresión
     usa el tamaño real (zoom no se aplica dentro de @media print). */
  .sheet{ width:210mm; min-height:297mm; background:var(--folio); padding:15mm 16mm; zoom:.78;
          box-shadow:0 10px 40px rgba(46,52,55,.16); }

  /* documento */
  .doc{ font-size:10.5pt; line-height:1.45; color:#2E3437; }
  .doc .head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10mm;
              border-bottom:2px solid var(--brand-primary); padding-bottom:4.5mm; }
  .doc .titulo{ flex:none; }
  .doc .titulo h2{ white-space:nowrap; }
  /* multiply: el blanco del logo se vuelve transparente sobre cualquier folio
     (blanco × color = color) y la tinta se mantiene. Es lo que evita el
     rectángulo pegado del logo sin alfa; el de Lawang ya trae alfa y le da
     igual. Va en el <img>, no en el .head: el .head no tiene fondo propio, así
     que mezcla contra el papel.
     El alto sale de la sociedad (`--logo-alto`, ver entities.js): SAN DAL WOODS
     lo pidió un 25% mayor. */
  .doc .head img{ height:var(--logo-alto,15mm); mix-blend-mode:multiply; display:block; }
  /* segundo logo (lockup de palabra) bajo el isotipo: se alinea a la izquierda
     con él y manda el ANCHO, no el alto, porque es una tira apaisada. */
  .doc .head .logo2{ height:auto; width:var(--logo2-ancho,34mm); margin-top:2.5mm; }
  /* El emisor va AL LADO del logo, no debajo (30-jul): apilados, con el logo a
     28mm, la cabecera se comía 63mm de folio y la factura se iba a la segunda
     página con dos conceptos. Al lado son ~40mm y el logo no pierde tamaño. */
  .doc .emisor-bloque{ display:flex; align-items:flex-start; gap:7mm; min-width:0; }
  /* Modo apilado (`emisorDebajo` en entities.js): el logo manda en la fila y el
     emisor va justo debajo, a todo el ancho que le deje el título. Es lo que
     necesita un lockup apaisado para ser grande sin estrangular el texto. */
  .doc .emisor-bloque.apilado{ flex-direction:column; gap:2mm; }
  .doc .emisor-bloque.apilado .emisor{ max-width:none; padding-top:0; }
  /* El logo se alinea con la TINTA del titulo del documento (Recibí/Factura),
     no con su caja: la caja de linea del h2 empieza 2,6mm por encima de donde
     empieza la letra, asi que sin este empujon el logo se ve mas alto que el
     titulo. Medido en navegador con las metricas reales de la fuente; la imagen
     va recortada a su tinta para que aqui no haya que adivinar nada. */
  .doc .marcas{ flex:none; margin-top:2.6mm; }
  /* 62mm y no 74: el lockup de San Dal Woods es apaisado (26mm de alto son 50mm
     de ancho) y con el emisor más ancho la dirección del domicilio se partía en
     cuatro líneas, que es justo el alto que se acababa de recuperar. */
  .doc .emisor{ font-size:9pt; line-height:1.45; color:#4a4f4a; max-width:62mm; padding-top:1mm; }
  .doc .emisor b{ display:block; font-size:11pt; color:var(--brand-deep); letter-spacing:.02em; }
  .doc .marca{ font-size:8pt; letter-spacing:.22em; text-transform:uppercase; color:var(--brand-primary); }
  .doc .titulo{ text-align:right; }
  .doc .titulo h2{ font-family:var(--font-display); font-size:20pt; font-weight:600; margin:0 0 2mm;
                   letter-spacing:.04em; color:var(--brand-deep); }
  .doc .titulo-en{ font-size:8.5pt; letter-spacing:.2em; text-transform:uppercase;
                   color:var(--brand-primary); margin:-1mm 0 2.5mm; }
  .doc .titulo .num{ font-size:12pt; font-weight:600; letter-spacing:.06em; }
  .doc .titulo .meta{ font-size:9pt; color:#4a4f4a; margin-top:2mm; }
  .doc h3{ font-size:8.5pt; letter-spacing:.2em; text-transform:uppercase; color:var(--brand-primary);
           margin:4.5mm 0 2mm; font-weight:500; }
  .doc .cliente{ font-size:10pt; line-height:1.5; }
  .doc table{ width:100%; border-collapse:collapse; margin-top:2mm; }
  .doc th{ text-align:left; font-size:8.5pt; letter-spacing:.14em; text-transform:uppercase; font-weight:500;
           color:#fff; background:var(--brand-primary); padding:2.4mm 3mm; }
  .doc td{ padding:1.9mm 3mm; border-bottom:1px solid #e8e2d5; vertical-align:top; }
  .doc td.imp, .doc th.imp{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .doc .totales{ width:80mm; margin-left:auto; margin-top:4mm; }
  .doc .totales td{ border:none; padding:1.2mm 3mm; }
  .doc .totales tr.total td{ border-top:1.5px solid var(--brand-primary); font-size:12pt; font-weight:600;
                             color:var(--brand-deep); padding-top:2.5mm; }
  /* dos columnas: ver bancoHTML(). `.ancho` = el dato que ocupa la fila entera */
  .doc .banco{ display:grid; grid-template-columns:1fr 1fr; gap:1.5mm 9mm; margin-top:1mm; font-size:9.5pt; }
  .doc .banco > div{ border-bottom:1px solid #f0ebe0; padding-bottom:1.1mm; }
  .doc .banco .ancho{ grid-column:1 / -1; }
  /* etiqueta y dato en la MISMA línea: apilados, las dos columnas salían más
     altas que la tabla de una columna que venían a sustituir (6 datos × 2
     líneas). En línea son 4 líneas en total en vez de 12. */
  .doc .banco span{ color:#6b6c66; margin-right:2.5mm; }
  .doc .notas{ font-size:9.5pt; white-space:pre-wrap; }
  .doc .pie{ margin-top:5mm; border-top:1px solid #e8e2d5; padding-top:2.5mm; font-size:8pt; color:#7b7c74; }
  .vacio{ color:#b9b2a4; }

  /* ---------- panel de facturas guardadas ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(46,52,55,.45); display:none; z-index:60; }
  .overlay.open{ display:grid; place-items:center; }
  .modal{ background:var(--rl); border-radius:16px; width:min(720px,92vw); max-height:82vh; display:flex; flex-direction:column; }
  .modal header{ display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line); }
  .modal header h2{ font-size:14px; margin:0; letter-spacing:.1em; text-transform:uppercase; font-weight:500; }
  .modal .list{ overflow:auto; padding:10px 12px 18px; }
  .frow{ display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid var(--line);
         border-radius:11px; background:var(--card); margin-bottom:8px; cursor:pointer; }
  .frow:hover{ border-color:var(--tg); }
  .frow .n{ font-weight:600; font-size:13px; color:var(--dl); font-variant-numeric:tabular-nums; }
  .frow .c{ flex:1; font-size:13px; }
  .frow .t{ font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .frow.anulada{ opacity:.55; text-decoration:line-through; }

  .toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--va); color:#fff;
          font-size:13px; padding:11px 18px; border-radius:999px; z-index:80; opacity:0; pointer-events:none;
          transition:opacity .2s; }
  .toast.on{ opacity:1; }

  @media print{
    @page{ size:A4; margin:0; }
    .topbar,.pane-form,.pv-bar,.overlay,.toast{ display:none!important; }
    .stage{ display:block; padding:0; height:auto; }
    .pane-preview{ overflow:visible; background:#fff; }
    .pv-scroll{ padding:0; display:block; }
    .sheet{ zoom:1; box-shadow:none; width:210mm; min-height:297mm; }
    /* El folio y la cabecera de la tabla SON fondos: sin esto, el navegador los
       tira a la basura cuando "Gráficos de fondo" está desmarcado y el documento
       sale en blanco con los rótulos ilegibles. */
    .sheet, .doc, .doc th{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    /* Una factura normal cabe en una página. Si lleva MUCHOS conceptos y hay que
       pasar a la segunda, que rompa donde tiene sentido: la cabecera de la tabla
       se repite arriba, y ni los totales ni los datos bancarios ni las notas se
       parten por la mitad. */
    .doc thead{ display:table-header-group; }
    .doc tr, .doc .totales, .doc .banco, .doc .banco > div, .doc .notas, .doc .pie{ break-inside:avoid; }
    .doc h3{ break-after:avoid; }
  }

  /* modo vista (?vista=1) — SOLO el documento: lo carga el visor pop-up de
     Operaciones/Compradores. Se ocultan formulario, topbar y guardado; queda
     la vista previa a todo el ancho con "Descargar PDF" (consultar incluye
     llevarse el papel). La media query de móvil oculta .pane-preview en
     <900px — aquí se fuerza visible, porque en modo vista el documento ES la
     página. */
  body.modo-vista .topbar, body.modo-vista .pane-form,
  body.modo-vista #btnSave, body.modo-vista #btnNueva{ display:none !important; }
  body.modo-vista .stage{ grid-template-columns:1fr; padding-top:0; }
  body.modo-vista .pane-preview{ display:flex !important; }
</style>
</head>
<body hidden>

<script>
const $  = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); };

/* ---------- sesión (mismos agentes que Contratos) ---------- */
const sb = window.supabase.createClient(
  'https://vtulllundrfennhjddhc.supabase.co',
  'sb_publishable_B_ot_6lNVRLiWiEMtApYOQ_3Ho3xNUg'
);
sb.auth.getSession().then(async ({data:{session}}) => {
  if(!session){ location.replace('/contracts/login.html?next=/facturas/'); return; }
  const modoVista = new URLSearchParams(location.search).has('vista');
  const { data: ficha } = await sb.from('usuarios')
    .select('rol, herramientas, activo').eq('user_id', session.user.id).maybeSingle();
  if(ficha && !ficha.activo){ await sb.auth.signOut(); location.replace('/contracts/login.html?desactivado=1'); return; }
  // El permiso 'facturas' gobierna EMITIR. En modo vista (el visor de
  // Operaciones lo embebe para consultar un documento ya emitido) no se exige:
  // consultar lo emitido está abierto a todo el equipo, igual que en la RLS,
  // donde el filtro por herramienta está en la escritura y no en la lectura.
  if(!modoVista && ficha && !['super_admin','admin'].includes(ficha.rol)
     && !(ficha.herramientas||[]).includes('facturas')){
    location.replace('/intranet/?sin_permiso=facturas'); return;
  }
  $('#who').textContent = session.user.email;
  document.body.hidden = false;
  cargarContratos();
  // deep-link ?id=<factura>: abre ese documento guardado directamente — lo usa
  // el visor embebido de Operaciones (y vale como enlace compartible interno).
  // Va aquí y no al final del script: antes de restaurarse la sesión la
  // consulta saldría como anon y la RLS devolvería vacío.
  // ?vista=1 (junto a ?id=): modo SOLO DOCUMENTO — sin formulario, sin topbar,
  // sin guardar. Es lo que carga el visor pop-up de Operaciones/Compradores:
  // desde ahí se consulta, no se edita. "Descargar PDF" se conserva (consultar
  // incluye llevarse el papel).
  if(new URLSearchParams(location.search).has('vista')) document.body.classList.add('modo-vista');
  const pedido = new URLSearchParams(location.search).get('id');
  if(pedido){
    sb.from('facturas')
      .select('id,numero,tipo,contrato_id,cliente_nombre,proyecto_nombre,total,moneda,fecha_emision,anulada,datos')
      .eq('id', pedido).maybeSingle()
      .then(({ data, error }) => {
        if(error || !data){ toast('No se encontró ese documento'); return; }
        abrir(data);
      });
  }
});
$('#btnLogout').onclick = async () => { await sb.auth.signOut(); location.replace('/contracts/login.html'); };

/* ---------- estado ---------- */
let LINEAS = [{ descripcion:'', importe:'' }];
let SAVED  = null;   // {id, numero} una vez guardada — null = borrador
let CONTRATO_ID = null;   // contrato del que sale la factura (FK real, no solo el nº impreso)

/* Los tres tipos comparten formulario y plantilla; solo cambia el rótulo del
   documento. La serie del número la decide el trigger en base de datos, no aquí. */
/* ES e EN separados, no "A · B" en una línea: a 20pt "Factura proforma ·
   Proforma invoice" con white-space:nowrap se salía del papel. Van apilados,
   igual que el bloque del emisor (razón social grande, marca pequeña encima). */
const TIPOS = {
  factura:  { es:'Factura',          en:'Invoice' },
  proforma: { es:'Factura proforma', en:'Proforma invoice' },
  recibi:   { es:'Recibí',           en:'Receipt' },
};

/* ---------- selects que salen de entities.js ---------- */
$('#selSociedad').innerHTML = Object.entries(SOCIEDADES)
  .map(([k,s]) => `<option value="${k}">${esc(s.label)}</option>`).join('');
// Van TODAS, incluidas las de notario (escrow): si el contrato pactó cobrar en
// una cuenta concreta, la factura tiene que decir esa misma. La etiqueta ya
// avisa de cuál es cuál.
$('#selCuenta').innerHTML = '<option value="">— sin datos bancarios —</option>' +
  Object.entries(CUENTAS_BANCARIAS).map(([k,c]) => [k, c.label])
    .sort((a,b) => a[1].localeCompare(b[1],'es'))
    .map(([k,label]) => `<option value="${k}">${esc(label)}</option>`).join('');

$('[name="fecha_emision"]').value = new Date().toISOString().slice(0,10);

/* ---------- conceptos ---------- */
function pintarLineas(){
  $('#lineas').innerHTML = LINEAS.map((l,i) => `
    <div class="linea">
      <div><label>Descripción</label><input data-l="${i}" data-k="descripcion" value="${esc(l.descripcion)}"></div>
      <div><label>Importe</label><input data-l="${i}" data-k="importe" inputmode="decimal" data-money value="${esc(l.importe)}"></div>
      <button type="button" class="xbtn" data-del="${i}" title="Quitar">×</button>
    </div>`).join('');
  marcarHitosUsados();
}

/* Un hito ya cobrado no se vuelve a cobrar: el botón queda tachado y sin efecto.
   El estado se DERIVA de los conceptos que hay ahora mismo, no de una lista
   aparte de "ya pulsados" — así, si se borra la línea, el hito vuelve a estar
   disponible sin tener que sincronizar nada. */
const descHito = h => [h.texto, h.pct ? '(' + h.pct + '% del precio acordado)' : ''].filter(Boolean).join(' ')
                    + (h.timing ? ' — ' + h.timing : '');
function marcarHitosUsados(){
  document.querySelectorAll('#delContrato [data-h]').forEach(b => {
    const usado = LINEAS.some(l => (l.descripcion || '').trim() === b.dataset.desc);
    b.disabled = usado;
    b.classList.toggle('usado', usado);
    b.title = usado ? 'Ya está en este documento' : '';
  });
}
$('#lineas').addEventListener('input', e => {
  const el = e.target; if(el.dataset.l == null) return;
  LINEAS[+el.dataset.l][el.dataset.k] = el.value; render();
});
$('#lineas').addEventListener('click', e => {
  const b = e.target.closest('[data-del]'); if(!b) return;
  LINEAS.splice(+b.dataset.del, 1);
  if(!LINEAS.length) LINEAS = [{ descripcion:'', importe:'' }];
  pintarLineas(); render();
});
$('#btnAddLinea').onclick = () => { LINEAS.push({ descripcion:'', importe:'' }); pintarLineas(); render(); };

/* ---------- datos del formulario ---------- */
function collect(){
  const d = {};
  $('#form').querySelectorAll('[name]').forEach(el => d[el.name] = el.value.trim());
  d.tipo = $('#selTipo').value;   // vive en la barra superior, fuera del <form>
  d.lineas = LINEAS;
  return d;
}
$('#selTipo').addEventListener('change', render);

/* Al salir de un campo de importe se reescribe en formato canónico ("44.000",
   "44.000,50"): lo que se ve pasa a ser exactamente lo que se guarda, en vez de
   quedar a merced de cómo escribió cada uno los separadores. */
document.addEventListener('blur', e => {
  const el = e.target;
  if(!el || !el.matches || !el.matches('[data-money]')) return;
  const n = parseImporte(el.value);
  const txt = n ? n.toLocaleString('es-ES', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }) : '';
  if(txt === el.value) return;
  el.value = txt;
  const i = el.dataset.l;
  if(i != null){ LINEAS[+i].importe = txt; render(); }
}, true);   // captura: blur no burbujea

/* ?tipo=recibi|proforma abre la app ya puesta en ese documento. La intranet usa
   esto para la tarjeta "Recibos": es la MISMA herramienta, no una segunda que
   emitiría con sus propias reglas y su propia numeración. */
(function(){
  const t = new URLSearchParams(location.search).get('tipo');

})();

$('#form').addEventListener('change', render);

const linea = v => v ? esc(v) : '<span class="vacio">—</span>';

/* Datos bancarios en DOS columnas (30-jul): en una sola, seis filas de
   etiqueta/valor comían 44mm de folio y empujaban la factura a la segunda
   página con solo dos conceptos. Los cuatro datos cortos van a dos columnas y
   los dos largos (dirección del banco y nota) a ancho completo, que en media
   columna se partían en tres líneas y no ahorraban nada. */
function bancoHTML(key, moneda){
  const c = CUENTAS_BANCARIAS[key];
  if(!c) return '';
  const txt = v => (v && typeof v === 'object') ? (v.es || '') : (v || '');
  const dato = (l, v, ancho) => txt(v)
    ? `<div class="${ancho ? 'ancho' : ''}"><span>${l}</span>${esc(txt(v))}</div>` : '';
  return `<h3>Datos bancarios · Bank details</h3>
    <div class="banco">
      ${dato('Titular · Holder', c.titular)}
      ${dato('Banco · Bank', c.banco)}
      ${dato('Cuenta · Account', c.cuenta)}
      ${dato('Swift / Routing', c.codigo)}
      ${dato('Dirección · Address', c.direccion, true)}
      ${dato('Nota · Note', c.extra, true)}
    </div>`;
}

/* Sin `logo` en la sociedad NO se pinta ninguno, y a proposito: el fallback al
   de Lawang que habia aqui convirtio un entities.js cacheado en una factura de
   PT SAN DAL WOODS con la marca de otra empresa, sin que se notara. Un documento
   sin logo salta a la vista; uno con el logo equivocado, no. */
function render(){
  const d = collect();
  const soc = SOCIEDADES[d.sociedad] || SOCIEDADES.tepi_sungai;
  const t = calcTotales(d.lineas, d.moneda, { pct:d.imp_pct });
  const fecha = f => f ? new Date(f + 'T00:00:00').toLocaleDateString('es-ES', {day:'2-digit', month:'long', year:'numeric'}) : '';
  // Sin guardar no hay número: la línea no se pinta (antes decía «BORRADOR»,
  // fuera por decisión del owner el 30-jul). El número lo asigna el trigger al
  // guardar, así que un documento sin número es uno que aún no se ha emitido.
  const numero = (SAVED && SAVED.numero) || '';

  const filas = d.lineas.map(l => (l.descripcion || l.importe)
    ? `<tr><td>${esc(l.descripcion)}</td><td class="imp">${fmtMoneda(parseImporte(l.importe), d.moneda)}</td></tr>` : ''
  ).join('') || `<tr><td class="vacio">Sin conceptos</td><td class="imp vacio">—</td></tr>`;

  /* Tinta de la sociedad: todo lo coloreado del documento (filete de cabecera,
     titulares, rótulos, cabecera de tabla y línea del total) sale de estas dos
     variables, así que cambiarlas aquí repinta el documento entero. Cadena
     vacía = se borra el override y vuelve el verde/lagoon de brand.css. */
  const doc = $('#doc');
  doc.style.setProperty('--brand-primary', (soc.tinta && soc.tinta.primary) || '');
  doc.style.setProperty('--brand-deep',    (soc.tinta && soc.tinta.deep)    || '');
  doc.style.setProperty('--logo-alto',   soc.logoAlto   || '');
  doc.style.setProperty('--logo2-ancho', soc.logo2Ancho || '');
  /* El folio va en `.sheet`, que es el papel y está FUERA de #doc: ponerlo en
     #doc pintaría el color solo bajo el contenido y dejaría los márgenes
     blancos. Cadena vacía = vuelve el #fff de la variable global. */
  const hoja = document.querySelector('.sheet');
  if(hoja) hoja.style.setProperty('--folio', soc.folio || '');

  doc.innerHTML = `
    <div class="head">
      <div class="emisor-bloque${soc.emisorDebajo ? ' apilado' : ''}">
        <div class="marcas">
          ${soc.logo ? `<img src="${esc(soc.logo)}" alt="">` : ''}
          ${soc.logo2 ? `<img class="logo2" src="${esc(soc.logo2)}" alt="">` : ''}
        </div>
        <div class="emisor">
          <b>${esc(soc.razon)}</b>
          ${soc.marca ? `<span class="marca">${esc(soc.marca)}</span>` : ''}
          <div>${esc(soc.domicilio)}</div>
          <div>NPWP ${esc(soc.npwp)}</div>
        </div>
      </div>
      <div class="titulo">
        <h2>${esc((TIPOS[d.tipo] || TIPOS.factura).es)}</h2>
        <div class="titulo-en">${esc((TIPOS[d.tipo] || TIPOS.factura).en)}</div>
        ${numero ? `<div class="num">${esc(numero)}</div>` : ''}
        <div class="meta">
          ${d.fecha_emision ? `Fecha · Date: ${esc(fecha(d.fecha_emision))}<br>` : ''}
          ${d.fecha_vencimiento ? `Vencimiento · Due: ${esc(fecha(d.fecha_vencimiento))}<br>` : ''}
          ${d.contrato_numero ? `Contrato · Contract: ${esc(d.contrato_numero)}` : ''}
        </div>
      </div>
    </div>

    <h3>Facturar a · Bill to</h3>
    <div class="cliente">
      <b>${linea(d.cliente_nombre)}</b><br>
      ${d.cliente_documento ? esc(d.cliente_documento) + '<br>' : ''}
      ${d.cliente_domicilio ? esc(d.cliente_domicilio).replace(/\n/g,'<br>') + '<br>' : ''}
      ${d.cliente_email ? esc(d.cliente_email) : ''}
      ${d.proyecto_nombre ? `<div style="margin-top:2mm">Proyecto · Project: <b>${esc(d.proyecto_nombre)}</b></div>` : ''}
    </div>

    <h3>Conceptos · Items</h3>
    <table><thead><tr><th>Descripción · Description</th><th class="imp">Importe · Amount</th></tr></thead>
      <tbody>${filas}</tbody></table>

    <table class="totales"><tbody>
      <tr><td>Subtotal</td><td class="imp">${fmtMoneda(t.subtotal, d.moneda)}</td></tr>
      ${t.pct ? `<tr><td>${esc(d.imp_etiqueta || 'Impuesto · Tax')} (${esc(String(t.pct))}%)</td><td class="imp">${fmtMoneda(t.impuesto, d.moneda)}</td></tr>` : ''}
      <tr class="total"><td>Total</td><td class="imp">${fmtMoneda(t.total, d.moneda)}</td></tr>
    </tbody></table>

    ${bancoHTML(d.cuenta, d.moneda)}
    ${d.notas ? `<h3>Notas · Notes</h3><div class="notas">${esc(d.notas)}</div>` : ''}

    <div class="pie">${esc(soc.razon)}${soc.marca ? ' · ' + esc(soc.marca) : ''} · NPWP ${esc(soc.npwp)} · ${esc(soc.domicilio)}</div>`;

  $('#btnSave').textContent = SAVED ? 'Actualizar (' + SAVED.numero + ')' : 'Guardar en base de datos';
  // el número ya emitido lleva el prefijo del tipo: cambiarlo después dejaría un
  // PRO000xx rotulado "Factura". Se emite otro documento, no se reetiqueta este.
  const st = $('#selTipo');
  st.disabled = !!SAVED;
  st.title = SAVED ? 'El tipo no se cambia una vez emitido el número'
                   : 'Cada tipo lleva su propia serie: INV, PRO, REC';
}

/* ---------- PDF: lo genera el navegador, igual que en Contratos ---------- */
const limpiaNombre = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'_');
$('#btnPrint').onclick = () => {
  const d = collect();
  const antes = document.title;
  // El nombre del PDF: número si ya está emitido, y si no el tipo de documento.
  const rotulo = (SAVED && SAVED.numero) || limpiaNombre((TIPOS[d.tipo] || TIPOS.factura).es);
  document.title = `${rotulo}_${limpiaNombre(d.cliente_nombre) || 'SIN_NOMBRE'}`.toUpperCase();

/* ---------- enviar por email ----------
   Mismo endpoint que los contratos: `/contracts/api/send_email.php` recoge el
   HTML, lo renderiza a PDF con Chromium de verdad (servicio Puppeteer en
   Railway) y lo adjunta. El remitente lo fija el servidor, nunca el cliente.
   No se genera el PDF en el navegador a propósito: en Contratos ya se probó con
   html2pdf.js y html-to-image y ninguna aguanta este CSS (color-mix, fuentes de
   Google con CORS). El botón lo pulsa una persona: mandar correo a un tercero
   real no se automatiza. */
function documentoHTML(){
  const hoja = document.querySelector('.sheet');
  const css = [...document.querySelectorAll('style')].map(s => s.textContent).join('\n');
  /* `<base>` para que las rutas absolutas del documento (logos en
     /contracts/assets/brand/…) las resuelva el navegador del servidor, y
     `hoja.outerHTML` para llevarse las variables de la sociedad —folio, tinta,
     tamaño de logo— que render() escribió en el propio elemento. */
  return `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<base href="${location.origin}/">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/contracts/assets/brand.css">
<style>${css}</style>
<style>html,body{height:auto;margin:0;background:#fff}
  .sheet{zoom:1;box-shadow:none;margin:0}</style>
</head><body>${hoja.outerHTML}</body></html>`;
}

function abrirMail(){
  const d = collect();
  const tipo = (TIPOS[d.tipo] || TIPOS.factura).es;
  const numero = SAVED && SAVED.numero;
  /* Sin número no se manda. El número lo pone el trigger al guardar, así que un
     documento sin él es uno que no se ha emitido: sale del estudio con pinta de
     definitivo y sin rastro en la base de datos. Guardar es un clic. */
  $('#mailSend').disabled = !numero;
  $('#mailAviso').textContent = numero
    ? `Se adjunta ${numero} en PDF, tal y como se ve en la vista previa.`
    : 'Guarda el documento primero: sin número no se envía, porque no queda registrado como emitido.';
  $('#mailTo').value = d.cliente_email || '';
  $('#mailSubject').value = `${tipo}${numero ? ' ' + numero : ''} — ${SOCIEDADES[d.sociedad] ? SOCIEDADES[d.sociedad].razon : 'Lawang'}`;
  $('#mailMsg').value = `Buenos días${d.cliente_nombre ? ' ' + d.cliente_nombre : ''},\n\n`
    + `Adjunto ${tipo.toLowerCase()}${numero ? ' ' + numero : ''} para su revisión.\n\nUn saludo,\n`
    + `${SOCIEDADES[d.sociedad] ? SOCIEDADES[d.sociedad].razon : 'Lawang Tropical Properties'}`;
  $('#ovMail').classList.add('open');
}
$('#btnMail').onclick = abrirMail;
const cerrarMail = () => $('#ovMail').classList.remove('open');
$('#btnCloseMail').onclick = cerrarMail;
$('#mailCancel').onclick = cerrarMail;
$('#ovMail').onclick = e => { if(e.target === $('#ovMail')) cerrarMail(); };

$('#mailSend').onclick = async () => {
  const to = $('#mailTo').value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)){ toast('Email de destinatario no válido'); return; }
  if(!(SAVED && SAVED.numero)){ toast('Guarda el documento antes de enviarlo'); return; }
  const btn = $('#mailSend');
  btn.disabled = true; btn.textContent = 'Enviando…';
  try{
    const d = collect();
    const r = await fetch('/contracts/api/send_email.php', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ to, subject:$('#mailSubject').value, message:$('#mailMsg').value,
        filename: `${SAVED.numero}_${limpiaNombre(d.cliente_nombre) || 'CLIENTE'}.pdf`.toUpperCase(),
        html: documentoHTML() }) });
    const res = await r.json().catch(() => ({ ok:false, error:'Respuesta inválida del servidor' }));
    if(res.ok){ toast('Enviado a ' + to); cerrarMail(); }
    else toast(res.error || 'No se pudo enviar');
  }catch(err){ toast('Error: ' + (err.message || err)); }
  btn.disabled = false; btn.textContent = 'Enviar';
};

/* ---------- prefill desde un contrato guardado ----------
   La lista va con columnas ligeras a propósito: el `datos` de un contrato llega
   a 2,6 MB (los anexos van dentro en base64), así que traerlo de los 60 sería
   descargar decenas de megas para llenar un desplegable. Al elegir uno se pide
   solo ESE, y de su jsonb únicamente `fields` y `hitos`. */
async function cargarContratos(){
  const { data, error } = await sb.from('contratos')
    .select('id,numero,comprador_nombre,proyecto_nombre')
    .order('created_at', { ascending:false }).limit(60);
  if(error || !data) return;
  const sel = $('#selContrato');
  sel.innerHTML = '<option value="">— sin contrato —</option>' + data.filter(c => c.numero).map(c =>
    `<option value="${esc(c.id)}">${esc(c.numero)} — ${esc(c.comprador_nombre || 'sin nombre')}${c.proyecto_nombre ? ' · ' + esc(c.proyecto_nombre) : ''}</option>`).join('');
  sel.onchange = () => {
    CONTRATO_ID = sel.value || null;
    if(sel.value) traerContrato(sel.value);
    else $('#delContrato').innerHTML = '';
  };
}

async function traerContrato(id){
  CONTRATO_ID = id;
  const caja = $('#delContrato');
  caja.innerHTML = '<div class="t">Cargando contrato…</div>';
  // `campos:datos->fields` pide solo esa rama del jsonb. Si la sintaxis de
  // PostgREST fallara, se cae al jsonb entero antes que dejar al agente sin datos.
  let { data, error } = await sb.from('contratos')
    .select('numero,moneda,precio_total,campos:datos->fields,hitos:datos->hitos,extras:datos->compradores').eq('id', id).single();
  if(error){
    ({ data, error } = await sb.from('contratos').select('numero,moneda,precio_total,datos').eq('id', id).single());
    if(data && data.datos){ data.campos = data.datos.fields; data.hitos = data.datos.hitos; data.extras = data.datos.compradores; }
  }
  if(error || !data){ caja.innerHTML = `<div class="t">No se pudo cargar el contrato: ${esc((error&&error.message)||'')}</div>`; return; }

  const f = data.campos || {};
  const puesto = [];
  const poner = (name, valor, etiqueta) => {
    if(!valor) return;
    const el = document.querySelector(`[name="${name}"]`); if(!el) return;
    el.value = valor; puesto.push(etiqueta);
  };

  // Compradores: la factura va a nombre de todos los que firman, no solo del
  // primero. El II y siguientes viven en `datos.compradores[]`, no en adq2_*
  // (ver compradores.js) — leyendo solo adq* se perdían en 5 contratos.
  const compradores = compradoresDeContrato(f, data.extras);
  const nombres = nombresFactura(compradores);
  const docs = documentosFactura(compradores);
  // Unidad concreta si el contrato la fija (parcela, villa o tipología).
  const unidad = [f.proyecto_nombre, f.parcela_codigo || f.villa_nombre || f.tipologia_villa].filter(Boolean).join(' — ');

  poner('contrato_numero', data.numero, 'contrato');
  poner('cliente_nombre', nombres, 'nombre');
  poner('cliente_documento', docs, 'documento');
  poner('cliente_domicilio', primerDato(compradores, 'domicilio'), 'domicilio');
  poner('cliente_email', primerDato(compradores, 'email'), 'email');
  poner('proyecto_nombre', unidad, 'proyecto');
  poner('moneda', data.moneda || f.moneda, 'moneda');
  if(f.sociedad_firmante && SOCIEDADES[f.sociedad_firmante]) poner('sociedad', f.sociedad_firmante, 'sociedad');
  if(f.cuenta_bancaria && CUENTAS_BANCARIAS[f.cuenta_bancaria]) poner('cuenta', f.cuenta_bancaria, 'cuenta de cobro');

  // Hitos de pago del contrato: cada uno puede convertirse en un concepto de la
  // factura. NO se añaden solos — una factura cobra el hito que toca, no los cuatro.
  const moneda = ($('[name="moneda"]')||{}).value;
  const precio = parseImporte(data.precio_total || f.precio_total);
  const hitos = (data.hitos || []).map(h => {
    const pct = parseImporte(h.pct);
    const monto = parseImporte(h.monto) || (pct && precio ? redondear(precio * pct / 100, moneda) : 0);
    return { texto: h.es || h.en || '', pct, monto, timing: h.timing || '' };
  }).filter(h => h.texto || h.monto);

  caja.innerHTML = `<div class="t">Del contrato ${esc(data.numero || '')}</div>
    <p class="arrastrado">${puesto.length ? 'Traído: ' + esc(puesto.join(', ')) + '.' : 'El contrato no tenía datos de cliente que traer.'}
      ${compradores.length > 1 ? ' Contrato a <b>' + compradores.length + ' nombres</b>.' : ''}
      ${precio ? ' Precio del contrato: <b>' + esc(fmtMoneda(precio, moneda)) + '</b>.' : ''}</p>
    ${hitos.length ? `<div class="hitos">${hitos.map((h,i) =>
        `<button type="button" class="hito" data-h="${i}">${h.pct ? '<b>' + esc(String(h.pct)) + '%</b> · ' : ''}${esc(h.texto || 'Hito ' + (i+1))}${h.monto ? ' · ' + esc(fmtMoneda(h.monto, moneda)) : ''}</button>`
      ).join('')}</div>
      <p class="arrastrado">Pulsa el hito que cobras en este documento.</p>` : ''}`;

  caja.querySelectorAll('[data-h]').forEach(b => {
    const h = hitos[+b.dataset.h];
    b.dataset.desc = descHito(h);
    b.onclick = () => {
      if(LINEAS.length === 1 && !LINEAS[0].descripcion && !LINEAS[0].importe) LINEAS = [];
      LINEAS.push({ descripcion: b.dataset.desc, importe: h.monto ? String(h.monto).replace('.', ',') : '' });
      pintarLineas(); render();
      toast(h.monto ? 'Concepto añadido' : 'Concepto añadido — el contrato no fijaba importe, ponlo a mano');
    };
  });
  marcarHitosUsados();

  render();
}

/* ---------- guardar ---------- */
function payload(){
  const d = collect();
  const t = calcTotales(d.lineas, d.moneda, { pct:d.imp_pct });
  return {
    tipo: d.tipo || 'factura',
    sociedad: d.sociedad || null,
    cliente_nombre: d.cliente_nombre || null,
    proyecto_nombre: d.proyecto_nombre || null,
    contrato_numero: d.contrato_numero || null,
    // el nº de contrato es texto que se imprime; `contrato_id` es el enlace real
    // con el que el contrato sabe qué facturas cuelgan de él
    contrato_id: CONTRATO_ID,
    total: t.total,
    moneda: d.moneda || null,
    fecha_emision: d.fecha_emision || null,
    datos: { fields:d, lineas:LINEAS, totales:t },
  };
}
$('#btnSave').onclick = async () => {
  const d = collect();
  if(!d.cliente_nombre){ toast('Falta el nombre del cliente'); return; }
  if(!calcTotales(d.lineas, d.moneda, null).subtotal){ toast('La factura no tiene importe'); return; }
  const btn = $('#btnSave'); btn.disabled = true; btn.textContent = 'Guardando…';
  try{
    const q = (SAVED && SAVED.id)
      ? sb.from('facturas').update(payload()).eq('id', SAVED.id).select('id,numero').single()
      : sb.from('facturas').insert(payload()).select('id,numero').single();
    const { data, error } = await q;
    if(error) throw error;
    SAVED = { id:data.id, numero:data.numero };
    $('[name="numero_visible"]').value = data.numero;
    toast('Guardada como ' + data.numero);
  }catch(err){ toast('No se pudo guardar: ' + (err.message || err)); }
  btn.disabled = false; render();
};

$('#btnNueva').onclick = () => {
  if(SAVED && !confirm('Empezar una factura nueva. ¿Seguro?')) return;
  // el selector de tipo vive fuera del <form>, así que reset() no lo toca
  SAVED = null; CONTRATO_ID = null; $('#form').reset(); $('#selTipo').value = 'factura';
  LINEAS = [{ descripcion:'', importe:'' }];
  $('[name="fecha_emision"]').value = new Date().toISOString().slice(0,10);
  $('[name="numero_visible"]').value = '';
  $('#selContrato').value = ''; $('#delContrato').innerHTML = '';
  pintarLineas(); render();
};

/* ---------- facturas guardadas ---------- */
$('#btnList').onclick = async () => {
  $('#ovList').classList.add('open');
  const box = $('#listBody'); box.innerHTML = 'Cargando…';
  const { data, error } = await sb.from('facturas')
    .select('id,numero,tipo,contrato_id,cliente_nombre,proyecto_nombre,total,moneda,fecha_emision,anulada,datos')
    .order('created_at', { ascending:false }).limit(200);
  if(error){ box.textContent = 'No se pudo cargar: ' + error.message; return; }
  if(!data.length){ box.textContent = 'Todavía no hay facturas guardadas.'; return; }
  box.innerHTML = data.map(f => `
    <div class="frow ${f.anulada ? 'anulada' : ''}" data-id="${f.id}">
      <span class="n">${esc(f.numero || '—')}</span>
      <span class="c">${esc(f.cliente_nombre || 'sin nombre')}${f.proyecto_nombre ? ' · ' + esc(f.proyecto_nombre) : ''}</span>
      <span class="t">${esc(fmtMoneda(f.total, f.moneda))}</span>
      ${f.anulada ? '' : `<button class="btn" data-anular="${f.id}">Anular</button>`}
    </div>`).join('');
  box.onclick = async e => {
    const an = e.target.closest('[data-anular]');
    if(an){
      e.stopPropagation();
      if(!confirm('Anular esta factura. El número no se reutiliza y ya no se podrá editar. ¿Seguro?')) return;
      const { error } = await sb.from('facturas').update({ anulada:true }).eq('id', an.dataset.anular);
      toast(error ? 'No se pudo anular: ' + error.message : 'Factura anulada');
      $('#btnList').onclick(); return;
    }
    const row = e.target.closest('[data-id]'); if(!row) return;
    const f = data.find(x => x.id === row.dataset.id); if(!f) return;
    abrir(f);
  };
};
$('#btnCloseList').onclick = () => $('#ovList').classList.remove('open');
$('#ovList').onclick = e => { if(e.target === $('#ovList')) $('#ovList').classList.remove('open'); };

function abrir(f){
  const d = (f.datos && f.datos.fields) || {};
  $('#form').querySelectorAll('[name]').forEach(el => { if(d[el.name] != null) el.value = d[el.name]; });
  $('#selTipo').value = f.tipo || d.tipo || 'factura';
  LINEAS = (f.datos && f.datos.lineas && f.datos.lineas.length) ? f.datos.lineas : [{ descripcion:'', importe:'' }];
  SAVED = f.anulada ? null : { id:f.id, numero:f.numero };   // una anulada se abre como copia, no se reescribe
  CONTRATO_ID = f.contrato_id || null;
  $('#selContrato').value = CONTRATO_ID || '';
  $('[name="numero_visible"]').value = f.anulada ? '' : (f.numero || '');
  $('#ovList').classList.remove('open');
  pintarLineas(); render();
  if(f.anulada) toast('Factura anulada: se abre como borrador nuevo');
}

pintarLineas();
render();
</script>
