<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.png">
<title>Lawang · Compradores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/contracts/assets/brand.css">
<link rel="stylesheet" href="/contracts/assets/topbar.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="/contracts/assets/topbar.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9/dist/umd/supabase.min.js" integrity="sha384-XtYxyIfxexJVTROWK0+c5T8tJ2ItsVLcdgR5nJIoo6WzQqaBZoTPGgbS7XvkRNBZ" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="/contracts/assets/guard.js"></script>
<style>
  :root{ --line:#E2DACA; --card:#FFFFFF; --rl2:#F1EBDD; --texto-2:#4A5052; --tbh:56px; }
  *{ box-sizing:border-box; } html,body{ margin:0; height:100%; }
  body{ font-family:var(--font-body,'Jost',sans-serif); background:var(--rl2); color:#22282A; }
  .topbar{ position:fixed; top:0; left:0; right:0; z-index:40; }
  .stage{ display:grid; grid-template-columns:minmax(300px,370px) 1fr; height:100%; padding-top:var(--tbh); }
  @media (max-width:900px){ .stage{ grid-template-columns:1fr; } .ficha{ display:none; } .stage.abierta .lista{ display:none; } .stage.abierta .ficha{ display:block; } }

  .lista{ overflow:auto; border-right:1px solid var(--line); }
  .cab{ position:sticky; top:0; background:var(--rl2); padding:14px 18px 12px; border-bottom:1px solid var(--line); z-index:2; }
  .buscar{ width:100%; font:inherit; font-size:13.5px; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--card); }
  .buscar:focus{ outline:none; border-color:var(--tg); box-shadow:0 0 0 3px rgba(72,91,55,.12); }
  .c{ display:block; width:100%; text-align:left; font:inherit; background:none; border:none;
      border-bottom:1px solid var(--line); padding:12px 18px; cursor:pointer; }
  .c:hover{ background:#EDE7D9; }
  .c.sel{ background:#E7E1D2; box-shadow:inset 3px 0 0 var(--tg); }
  .c .n{ font-size:14.5px; font-weight:600; }
  .c .m{ font-size:12.5px; color:var(--texto-2); margin-top:2px; }
  .c .r{ margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }

  .ficha{ overflow:auto; padding:26px 30px 90px; }
  .vacio{ display:grid; place-items:center; height:100%; color:#BEB3A5; font-size:13px; letter-spacing:.14em; text-transform:uppercase; }
  h2.t{ font-family:var(--font-display,'Cormorant Garamond',serif); font-size:30px; font-weight:600; margin:0 0 4px; }
  .sub{ color:var(--texto-2); font-size:13.5px; margin:0 0 20px; }
  fieldset{ border:1px solid var(--line); border-radius:14px; background:var(--card); padding:16px 18px 18px; margin:0 0 16px; }
  legend{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--texto-2); padding:0 8px; }
  label{ display:block; font-size:12px; color:var(--texto-2); margin:12px 0 4px; }
  label:first-of-type{ margin-top:2px; }
  input,select,textarea{ width:100%; font:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:#FDFCF9; color:inherit; }
  input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--tg); box-shadow:0 0 0 3px rgba(72,91,55,.12); }
  textarea{ min-height:60px; resize:vertical; }
  .row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .acciones{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .btn{ font:inherit; font-size:13px; font-weight:500; border-radius:999px; padding:9px 17px; cursor:pointer;
        border:1px solid var(--line); background:var(--card); color:inherit; }
  .btn:hover{ border-color:var(--tg); }
  .btn.primary{ background:var(--dl); border-color:var(--dl); color:#fff; }
  .btn:disabled{ opacity:.5; cursor:default; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--texto-2); font-weight:500; padding:0 8px 7px 0; }
  td{ padding:8px 8px 8px 0; border-top:1px solid var(--line); vertical-align:middle; }

  .tag{ display:inline-block; font-size:10.5px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; border-radius:999px; padding:3px 10px; }
  .ok{     background:rgba(72,91,55,.13);  color:#3B4B2D; }
  .espera{ background:rgba(190,179,165,.34);color:#6A5A3C; }
  .mal{    background:rgba(163,52,43,.12);  color:#A3342B; }
  .neutro{ background:rgba(46,52,55,.08);   color:#5A6062; }

  .subir{ border:1px dashed var(--line); border-radius:11px; padding:13px; margin-top:12px; background:#FDFCF9; }
  .nota{ font-size:12px; color:var(--texto-2); margin:9px 0 0; line-height:1.5; }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#2E3437; color:#fff;
          padding:11px 20px; border-radius:30px; font-size:13px; z-index:200; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
  <div class="topbar lw-topbar">
    <a class="lw-home" href="/intranet/">← Intranet</a>
    <img class="lw-brand" src="/contracts/assets/brand/lawang-logo-v3-dark.png" alt="Lawang">
    <h1 class="lw-title">Compradores</h1>
    <div class="lw-spacer"></div>
    <span class="lw-who" id="who"></span>
    <button type="button" class="lw-btn" id="btnNuevo">+ Nuevo comprador</button>
    <button type="button" class="lw-btn" id="btnLogout">Salir</button>
  </div>

  <div class="stage" id="stage">
    <div class="lista">
      <div class="cab"><input class="buscar" id="q" placeholder="Buscar nombre, email o pasaporte…"></div>
      <div id="listaC">Cargando…</div>
    </div>
    <div class="ficha" id="ficha"><div class="vacio">Elige un comprador</div></div>
  </div>
  <div class="toast" id="toast"></div>

<script>
/* ============================================================
   COMPRADORES — ficha y documentación KYC.

   Los ficheros van al bucket PRIVADO `kyc`. Nunca se enlaza una URL fija:
   se pide una URL firmada de 5 minutos en el momento de abrirla. Un enlace
   permanente a un pasaporte es una fuga esperando a que alguien lo reenvíe.

   La caducidad es el punto del módulo: un pasaporte vencido invalida el KYC
   y hasta ahora no había dónde anotarlo, así que nadie se enteraba.
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); };

const HOY = new Date(); HOY.setHours(0,0,0,0);
const fFecha = f => f ? new Date(String(f).slice(0,10)+'T00:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const dias = f => f ? Math.round((new Date(String(f).slice(0,10)+'T00:00:00') - HOY)/86400000) : null;

/* ⚠️ Las CLAVES son las que acepta el CHECK de la tabla (en inglés, de cuando
   se creó el 14-jul). Solo las etiquetas van en español. Traducir la clave
   rompe el guardado entero, y el error solo aparece al escribir. */
const KYC = [['pending','Pendiente'],['submitted','En revisión'],['verified','Aprobado'],['rejected','Rechazado']];
const DOCS = [['passport','Pasaporte'],['npwp','NPWP'],['visa','Visado'],
              ['proof_of_funds','Justificante de fondos'],['proof_of_address','Justificante de domicilio'],
              ['signed_contract','Contrato firmado'],['other','Otro']];
const etiqueta = (lista,v) => (lista.find(x=>x[0]===v)||[v,v||'—'])[1];

let SB=null, CLIENTES=[], DOCUMENTOS=[], VINCULOS=[], SEL=null;

async function cargar(){
  const [c, d, v] = await Promise.all([
    SB.from('clients').select('*').order('full_name'),
    SB.from('documents').select('*').order('uploaded_at',{ascending:false}),
    // qué contratos ha firmado cada persona. Si la migración aún no está,
    // falla sola y la ficha simplemente no muestra el bloque.
    SB.from('contrato_compradores').select('client_id,rol,contratos(id,numero,tipo,proyecto_nombre,fecha_firma,bloqueado)'),
  ]);
  if(c.error) throw c.error;
  CLIENTES = c.data || [];
  DOCUMENTOS = d.error ? [] : (d.data || []);
  VINCULOS = v.error ? [] : (v.data || []);
  if(d.error) toast('No se pudieron leer los documentos: ' + d.error.message);
}

/* estado de caducidad de un comprador, mirando TODOS sus documentos */
function alerta(clientId){
  const docs = DOCUMENTOS.filter(x => x.client_id === clientId && x.caduca_el);
  if(!docs.length) return null;
  const peor = Math.min(...docs.map(x => dias(x.caduca_el)));
  if(peor < 0)  return ['mal','Documento caducado'];
  if(peor <= 60) return ['espera','Caduca en ' + peor + ' d'];
  return null;
}

function pintarLista(){
  const q = $('#q').value.trim().toLowerCase();
  const vis = CLIENTES.filter(c => !q ||
    [c.full_name,c.email,c.passport_number].some(v => String(v||'').toLowerCase().includes(q)));
  $('#listaC').innerHTML = vis.length ? vis.map(c => {
    const a = alerta(c.id);
    const n = DOCUMENTOS.filter(x => x.client_id === c.id).length;
    return `<button class="c ${SEL===c.id?'sel':''}" data-id="${esc(c.id)}">
      <div class="n">${esc(c.full_name || 'Sin nombre')}</div>
      <div class="m">${esc(c.email || c.nationality || '—')}</div>
      <div class="r">
        <span class="tag ${c.kyc_status==='verified'?'ok':(c.kyc_status==='rejected'?'mal':'espera')}">${esc(etiqueta(KYC,c.kyc_status||'pending'))}</span>
        <span class="tag neutro">${n} doc.</span>
        ${a ? `<span class="tag ${a[0]}">${esc(a[1])}</span>` : ''}
      </div></button>`;
  }).join('')
  : `<p class="nota" style="padding:18px">${CLIENTES.length ? 'Nadie coincide.' : 'Todavía no hay compradores. Créalo con “+ Nuevo comprador”.'}</p>`;
}

function pintarFicha(){
  const nuevo = SEL === 'nuevo';
  const c = nuevo ? { kyc_status:'pending' } : CLIENTES.find(x => x.id === SEL);
  if(!c){ $('#ficha').innerHTML = '<div class="vacio">Elige un comprador</div>'; return; }
  const docs = nuevo ? [] : DOCUMENTOS.filter(d => d.client_id === c.id);

  const filas = docs.length ? docs.map(d => {
    const dd = dias(d.caduca_el);
    let cad = '<span class="tag neutro">sin caducidad</span>';
    if(d.caduca_el) cad = dd < 0 ? `<span class="tag mal">caducado hace ${-dd} d</span>`
                       : dd <= 60 ? `<span class="tag espera">${fFecha(d.caduca_el)}</span>`
                       : `<span class="tag ok">${fFecha(d.caduca_el)}</span>`;
    return `<tr>
      <td>${esc(etiqueta(DOCS,d.doc_type))}</td>
      <td>${fFecha(d.uploaded_at)}</td>
      <td>${cad}</td>
      <td><button class="btn" data-ver="${esc(d.storage_path||'')}" ${d.storage_path?'':'disabled'}>Abrir</button></td>
    </tr>`;
  }).join('') : '<tr><td colspan="4" class="nota">Sin documentos todavía.</td></tr>';

  $('#ficha').innerHTML = `
    <h2 class="t">${nuevo ? 'Nuevo comprador' : esc(c.full_name || 'Sin nombre')}</h2>
    <p class="sub">${nuevo ? 'Los datos que aquí se guardan son los que exige el KYC.' :
      esc([c.nationality, c.passport_number].filter(Boolean).join(' · ') || 'sin identificación')}</p>

    <fieldset>
      <legend>Identidad</legend>
      <label>Nombre completo</label><input id="f-nombre" value="${esc(c.full_name||'')}">
      <div class="row">
        <div><label>Email</label><input id="f-email" type="email" value="${esc(c.email||'')}"></div>
        <div><label>Teléfono</label><input id="f-tel" value="${esc(c.phone||'')}"></div>
      </div>
      <div class="row">
        <div><label>Nacionalidad</label><input id="f-nac" value="${esc(c.nationality||'')}"></div>
        <div><label>Pasaporte / NPWP</label><input id="f-pas" value="${esc(c.passport_number||'')}"></div>
      </div>
      <div class="row">
        <div><label>Fecha de nacimiento</label><input id="f-nac-fecha" type="date" value="${esc(c.date_of_birth||'')}"></div>
        <div><label>Estado KYC</label><select id="f-kyc">${KYC.map(([v,l])=>`<option value="${v}" ${(c.kyc_status||'pending')===v?'selected':''}>${l}</option>`).join('')}</select></div>
      </div>
      <label>Domicilio</label><textarea id="f-dom">${esc(c.address||'')}</textarea>
      <label>Notas</label><textarea id="f-notas">${esc(c.notes||'')}</textarea>
      <div class="acciones" style="margin-top:14px">
        <button class="btn primary" id="btnGuardar">${nuevo ? 'Crear comprador' : 'Guardar cambios'}</button>
      </div>
    </fieldset>

    ${nuevo ? '<p class="nota">Los documentos se suben después de crear la ficha.</p>' : `
    <fieldset>
      <legend>Contratos firmados</legend>
      ${(() => {
        const suyos = VINCULOS.filter(v => v.client_id === c.id && v.contratos);
        if(!suyos.length) return '<p class="nota">Ninguno enlazado todavía. El enlace se crea solo al guardar un contrato con su pasaporte o su email.</p>';
        return `<table><thead><tr><th>Contrato</th><th>Proyecto</th><th>Rol</th><th>Estado</th></tr></thead><tbody>
          ${suyos.map(v => `<tr>
            <td><a href="/operaciones/?contrato=${encodeURIComponent(v.contratos.id)}" style="color:var(--dl)">${esc(v.contratos.numero || 'sin nº')}</a>
                <div class="nota">${esc(v.contratos.tipo || '')}</div></td>
            <td>${esc(v.contratos.proyecto_nombre || '—')}</td>
            <td>${esc(String(v.rol).replace('adquiriente_','Adquiriente '))}</td>
            <td>${v.contratos.bloqueado ? '<span class="tag ok">Firmado</span>' : '<span class="tag espera">Sin firmar</span>'}</td>
          </tr>`).join('')}
        </tbody></table>
        <p class="nota">Pulsa un número de contrato para ver su operación completa.</p>`;
      })()}
    </fieldset>`}
    ${nuevo ? '' : `
    <fieldset>
      <legend>Documentación</legend>
      <table>
        <thead><tr><th>Documento</th><th>Subido</th><th>Caduca</th><th></th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
      <div class="subir">
        <div class="row">
          <div><label>Tipo</label><select id="d-tipo">${DOCS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div>
          <div><label>Caduca el (opcional)</label><input id="d-caduca" type="date"></div>
        </div>
        <label>Fichero</label><input id="d-file" type="file" accept="application/pdf,image/*">
        <div class="acciones" style="margin-top:10px">
          <button class="btn primary" id="btnSubir">Subir documento</button>
        </div>
        <p class="nota">Van a un bucket privado. Al abrirlos se genera un enlace temporal de 5 minutos, no una URL fija.</p>
      </div>
    </fieldset>`}`;

  $('#btnGuardar').addEventListener('click', () => guardar(nuevo ? null : c.id));
  const bs = $('#btnSubir'); if(bs) bs.addEventListener('click', () => subir(c.id));
  $('#ficha').querySelectorAll('[data-ver]').forEach(b => b.addEventListener('click', () => abrir(b.dataset.ver)));
}

async function guardar(id){
  const nombre = $('#f-nombre').value.trim();
  if(nombre.length < 2){ toast('Falta el nombre'); return; }
  const fila = {
    full_name:nombre,
    email:$('#f-email').value.trim() || null,
    phone:$('#f-tel').value.trim() || null,
    nationality:$('#f-nac').value.trim() || null,
    passport_number:$('#f-pas').value.trim() || null,
    date_of_birth:$('#f-nac-fecha').value || null,
    kyc_status:$('#f-kyc').value,
    address:$('#f-dom').value.trim() || null,
    notes:$('#f-notas').value.trim() || null,
  };
  const btn=$('#btnGuardar'); btn.disabled=true; btn.textContent='Guardando…';
  try{
    const q = id ? SB.from('clients').update(fila).eq('id',id).select().single()
                 : SB.from('clients').insert(fila).select().single();
    const { data, error } = await q;
    if(error) throw error;
    await cargar(); SEL = data.id;
    pintarLista(); pintarFicha();
    toast(id ? 'Ficha actualizada' : 'Comprador creado');
  }catch(err){
    toast('No se pudo guardar: ' + (err.message||err));
    btn.disabled=false; btn.textContent = id ? 'Guardar cambios' : 'Crear comprador';
  }
}

async function subir(clientId){
  const f = $('#d-file').files[0];
  if(!f){ toast('Elige un fichero'); return; }
  if(f.size > 20*1024*1024){ toast('El fichero supera los 20 MB'); return; }
  const btn=$('#btnSubir'); btn.disabled=true; btn.textContent='Subiendo…';
  // ruta por comprador: agrupa y evita que dos ficheros con el mismo nombre choquen
  const limpio = f.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.-]/g,'_');
  const path = `${clientId}/${Date.now()}_${limpio}`;
  try{
    const up = await SB.storage.from('kyc').upload(path, f, { upsert:false, contentType:f.type || 'application/octet-stream' });
    if(up.error) throw up.error;
    const ins = await SB.from('documents').insert({
      client_id: clientId,
      doc_type: $('#d-tipo').value,
      storage_path: path,
      status: 'pending',
      caduca_el: $('#d-caduca').value || null,
    });
    if(ins.error) throw ins.error;   // el fichero ya subió; reintentar no duplica la fila
    await cargar(); pintarLista(); pintarFicha();
    toast('Documento subido');
  }catch(err){
    toast('No se pudo subir: ' + (err.message||err));
    btn.disabled=false; btn.textContent='Subir documento';
  }
}

async function abrir(path){
  if(!path) return;
  const { data, error } = await SB.storage.from('kyc').createSignedUrl(path, 300);
  if(error || !data){ toast('No se pudo generar el enlace'); return; }
  window.open(data.signedUrl, '_blank', 'noopener');
}

$('#listaC').addEventListener('click', e => {
  const b = e.target.closest('[data-id]'); if(!b) return;
  SEL = b.dataset.id; pintarLista(); pintarFicha(); $('#stage').classList.add('abierta');
});
$('#q').addEventListener('input', pintarLista);
$('#btnNuevo').addEventListener('click', () => { SEL='nuevo'; pintarLista(); pintarFicha(); $('#stage').classList.add('abierta'); });

window.LW_AUTH.then(async ({ sb, session }) => {
  SB = sb;
  $('#who').textContent = session.user.email;
  $('#btnLogout').onclick = async () => { await sb.auth.signOut(); location.replace('/contracts/login.html'); };
  try{
    await cargar();
    /* ?id=<client_id> abre esa ficha directamente. Lo usa Operaciones: llegar
       desde la ficha de una venta a un listado y tener que buscar a la persona
       que ya estabas mirando es un viaje de ida sin vuelta. */
    const pedido = new URLSearchParams(location.search).get('id');
    if(pedido && CLIENTES.some(c => c.id === pedido)){
      SEL = pedido;
      pintarLista(); pintarFicha();
      $('#stage').classList.add('abierta');
      $('#ficha').scrollTop = 0;
    }else{
      if(pedido) toast('Ese comprador ya no existe');
      pintarLista();
    }
  }
  catch(err){ $('#listaC').innerHTML = '<p class="nota" style="padding:18px">No se pudo cargar: ' + esc(err.message||err) + '</p>'; }
});
</script>
</body>
</html>
