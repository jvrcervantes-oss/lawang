<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.png">
<title>Lawang · Usuarios y permisos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/contracts/assets/brand.css">
<link rel="stylesheet" href="/contracts/assets/topbar.css?v=20260731">
<script src="/contracts/assets/topbar.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9/dist/umd/supabase.min.js" integrity="sha384-XtYxyIfxexJVTROWK0+c5T8tJ2ItsVLcdgR5nJIoo6WzQqaBZoTPGgbS7XvkRNBZ" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="/contracts/assets/guard.js?v=20260730103319" data-herramienta="usuarios"></script>
<style>
  :root{ --line:#E2DACA; --card:#FFFFFF; --rl2:#F1EBDD; --texto-2:#4A5052; --tbh:56px; }
  *{ box-sizing:border-box; } html,body{ margin:0; height:100%; }
  body{ font-family:var(--font-body,'Jost',sans-serif); background:var(--rl2); color:#22282A; }
  .topbar{ position:fixed; top:0; left:0; right:0; z-index:40; }
  .stage{ display:grid; grid-template-columns:minmax(300px,360px) 1fr; height:100%; padding-top:var(--tbh); }
  @media (max-width:900px){ .stage{ grid-template-columns:1fr; } .ficha{ display:none; } .stage.abierta .lista{ display:none; } .stage.abierta .ficha{ display:block; } }

  .lista{ overflow:auto; border-right:1px solid var(--line); }
  .cab{ position:sticky; top:0; background:var(--rl2); padding:14px 18px 12px; border-bottom:1px solid var(--line); z-index:2; }
  .u{ display:block; width:100%; text-align:left; font:inherit; background:none; border:none;
      border-bottom:1px solid var(--line); padding:12px 18px; cursor:pointer; }
  .u:hover{ background:#EDE7D9; }
  .u.sel{ background:#E7E1D2; box-shadow:inset 3px 0 0 var(--tg); }
  .u .n{ font-size:14px; font-weight:600; }
  .u .m{ font-size:12.5px; color:var(--texto-2); margin-top:2px; }
  .u .r{ margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }

  .ficha{ overflow:auto; padding:26px 30px 90px; }
  .vacio{ display:grid; place-items:center; height:100%; color:#BEB3A5; font-size:13px; letter-spacing:.14em; text-transform:uppercase; }
  h2.t{ font-family:var(--font-display,'Cormorant Garamond',serif); font-size:30px; font-weight:600; margin:0 0 4px; }
  .sub{ color:var(--texto-2); font-size:13.5px; margin:0 0 20px; }
  fieldset{ border:1px solid var(--line); border-radius:14px; background:var(--card); padding:0 18px 18px; margin:0 0 16px; }
  legend{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#fff; background:var(--dl,#104C4F);
          padding:6px 12px; border-radius:999px; }
  label{ display:block; font-size:12px; color:var(--texto-2); margin:12px 0 4px; }
  input,select{ width:100%; font:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:#FDFCF9; color:inherit; }
  input:focus,select:focus{ outline:none; border-color:var(--tg); box-shadow:0 0 0 3px rgba(72,91,55,.12); }
  .row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .acciones{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .btn{ font:inherit; font-size:13px; font-weight:500; border-radius:999px; padding:9px 17px; cursor:pointer;
        border:1px solid var(--line); background:var(--card); color:inherit; }
  .btn:hover{ border-color:var(--tg); }
  .btn.primary{ background:var(--dl); border-color:var(--dl); color:#fff; }
  .btn:disabled{ opacity:.5; cursor:default; }

  .tag{ display:inline-block; font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
        border-radius:999px; padding:4px 10px; color:#fff; background:#5A6062; }
  .t-super{ background:#104C4F; } .t-admin{ background:#3F5230; } .t-off{ background:#9E2F26; }

  .herr{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; margin-top:6px; }
  .herr label{ display:flex; align-items:center; gap:8px; margin:0; font-size:13.5px; color:inherit;
               border:1px solid var(--line); border-radius:9px; padding:9px 11px; background:#FDFCF9; cursor:pointer; }
  .herr input{ width:auto; }
  .nota{ font-size:12px; color:var(--texto-2); margin:10px 0 0; line-height:1.55; }
  .aviso{ background:#FBF4E4; border:1px solid #E8D9AE; border-radius:11px; padding:12px 14px; font-size:12.5px; line-height:1.55; margin-bottom:16px; }
  .toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#2E3437; color:#fff;
          font-size:13px; padding:11px 18px; border-radius:999px; z-index:200; opacity:0; pointer-events:none; transition:opacity .2s; }
  .toast.on{ opacity:1; }
</style>
</head>
<body>
  <div class="topbar lw-topbar">
    <a class="lw-home" href="/intranet/">← Intranet</a>
    <img class="lw-brand" src="/contracts/assets/brand/lawang-logo-v3-dark.png" alt="Lawang">
    <h1 class="lw-title">Usuarios</h1>
    <span class="lw-sep"></span>
    <button type="button" class="lw-btn" id="btnNuevo">+ Nuevo usuario</button>
    <div class="lw-spacer"></div>
    <span class="lw-who" id="who"></span>
    <button type="button" class="lw-btn" id="btnLogout">Salir</button>
  </div>

  <div class="stage" id="stage">
    <div class="lista">
      <div class="cab"><b style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--texto-2)">Equipo</b></div>
      <div id="listaU">Cargando…</div>
    </div>
    <div class="ficha" id="ficha"><div class="vacio">Elige un usuario</div></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* ============================================================
   USUARIOS Y PERMISOS — panel de administración de la suite.

   Qué pasa por dónde, y por qué:
   · Rol, herramientas y activo/inactivo se escriben DIRECTAMENTE en
     `public.usuarios`. La RLS ya exige es_admin() para escribir, así que no
     hace falta backend: meter una Edge Function en medio solo añadiría una
     segunda puerta que proteger.
   · Crear un usuario y cambiar una contraseña SÍ pasan por la Edge Function
     `admin-usuarios`: la Admin API de Supabase necesita la clave de servicio,
     que no puede estar en el navegador bajo ningún concepto.
   · Nadie se borra: se DESACTIVA. Un usuario borrado se lleva por delante la
     autoría de sus documentos (`creado_por`), y quién firmó qué es justo lo
     que no se puede perder.
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),3000); };

const HERRAMIENTAS = [
  ['contratos','Contratos'], ['facturas','Facturas y recibís'], ['operaciones','Operaciones'],
  ['unidades','Unidades'], ['compradores','Compradores'], ['dossier','Dossier'],
  ['documentacion','Documentación'], ['usuarios','Usuarios (admin)'],
];
const ROLES = [['agente','Agente'], ['admin','Administrador'], ['super_admin','Super admin']];

let SB = null, YO = null, USUARIOS = [], SEL = null;

async function cargar(){
  const { data, error } = await SB.from('usuarios').select('*').order('rol').order('email');
  if(error){ $('#listaU').innerHTML = '<p class="nota" style="padding:18px">No se pudo cargar: ' + esc(error.message) + '</p>'; return; }
  USUARIOS = data || [];
  pintarLista();
}

function pintarLista(){
  $('#listaU').innerHTML = USUARIOS.map(u => {
    const tags = [];
    if(u.rol === 'super_admin') tags.push('<span class="tag t-super">Super admin</span>');
    else if(u.rol === 'admin')  tags.push('<span class="tag t-admin">Administrador</span>');
    if(!u.activo) tags.push('<span class="tag t-off">Desactivado</span>');
    return `<button class="u ${SEL===u.user_id?'sel':''}" data-id="${esc(u.user_id)}">
      <div class="n">${esc(u.nombre || u.email)}</div>
      <div class="m">${esc(u.email)}${u.nombre ? '' : ''}</div>
      <div class="r">${tags.join('')}<span class="tag">${u.herramientas.length} herramienta${u.herramientas.length===1?'':'s'}</span></div>
    </button>`;
  }).join('');
}

function pintarFicha(){
  const u = USUARIOS.find(x => x.user_id === SEL);
  if(!u){ $('#ficha').innerHTML = '<div class="vacio">Elige un usuario</div>'; return; }
  const yoMismo = YO && u.user_id === YO.user_id;
  const soySuper = YO && YO.rol === 'super_admin';
  // un admin no toca a un super_admin, y nadie se quita a sí mismo el acceso
  // por accidente desde esta pantalla
  const bloqueado = (u.rol === 'super_admin' && !soySuper);

  $('#ficha').innerHTML = `
    <h2 class="t">${esc(u.nombre || u.email)}</h2>
    <p class="sub">${esc(u.email)} · alta ${u.creado_en ? new Date(u.creado_en).toLocaleDateString('es-ES') : '—'}
      ${u.creado_por ? ' · por ' + esc(u.creado_por) : ''}</p>

    ${yoMismo ? '<div class="aviso">Esta es tu propia cuenta. Para no dejarte fuera por accidente, no puedes desactivarte ni cambiarte el rol desde aquí.</div>' : ''}
    ${bloqueado ? '<div class="aviso">Solo un super admin puede modificar la cuenta de otro super admin.</div>' : ''}

    <fieldset><legend>Identidad y rol</legend>
      <div class="row">
        <div><label>Nombre</label><input id="fNombre" value="${esc(u.nombre || '')}" ${bloqueado?'disabled':''}></div>
        <div><label>Rol</label>
          <select id="fRol" ${bloqueado || yoMismo || !soySuper ? 'disabled' : ''}>
            ${ROLES.map(([v,l]) => `<option value="${v}" ${u.rol===v?'selected':''}>${l}</option>`).join('')}
          </select></div>
      </div>
      <p class="nota">Un <b>administrador</b> ve todas las herramientas y puede editar documentos de cualquiera.
        Solo un <b>super admin</b> reparte roles.</p>
    </fieldset>

    <fieldset><legend>Herramientas que ve</legend>
      <div class="herr">
        ${HERRAMIENTAS.map(([v,l]) => `<label><input type="checkbox" value="${v}"
          ${u.herramientas.includes(v)?'checked':''} ${bloqueado?'disabled':''}> ${l}</label>`).join('')}
      </div>
      <p class="nota">Controla lo que aparece en la intranet y lo que puede <b>guardar</b>.
        La consulta de datos ya emitidos sigue abierta a todo el equipo: Operaciones cruza contratos,
        facturas y firmas, y filtrarlas por herramienta la dejaría en blanco.</p>
    </fieldset>

    <fieldset><legend>Acceso</legend>
      <label>Estado</label>
      <select id="fActivo" ${bloqueado || yoMismo ? 'disabled' : ''}>
        <option value="1" ${u.activo?'selected':''}>Activo</option>
        <option value="0" ${!u.activo?'selected':''}>Desactivado — no entra a la suite</option>
      </select>
      <p class="nota">Desactivar es lo contrario de borrar: la persona deja de entrar pero se conserva
        qué documentos creó. Nunca se borra un usuario.</p>
      <div class="acciones">
        <button class="btn primary" id="btnGuardar" ${bloqueado?'disabled':''}>Guardar cambios</button>
        <button class="btn" id="btnPass" ${bloqueado?'disabled':''}>Cambiar contraseña</button>
      </div>
    </fieldset>`;

  $('#btnGuardar').addEventListener('click', guardar);
  $('#btnPass').addEventListener('click', cambiarPassword);
}

async function guardar(){
  const u = USUARIOS.find(x => x.user_id === SEL); if(!u) return;
  const btn = $('#btnGuardar'); btn.disabled = true; btn.textContent = 'Guardando…';
  const cambios = {
    nombre: $('#fNombre').value.trim() || null,
    herramientas: [...document.querySelectorAll('.herr input:checked')].map(i => i.value),
  };
  // rol y activo solo viajan si el select estaba habilitado: enviarlos
  // deshabilitados reescribiría con el valor pintado y anularía el guarda
  if(!$('#fRol').disabled) cambios.rol = $('#fRol').value;
  if(!$('#fActivo').disabled) cambios.activo = $('#fActivo').value === '1';
  const { error } = await SB.from('usuarios').update(cambios).eq('user_id', SEL);
  btn.disabled = false; btn.textContent = 'Guardar cambios';
  if(error){ toast('No se pudo guardar: ' + error.message); return; }
  toast('Permisos actualizados');
  await cargar(); pintarFicha();
}

async function llamarAdmin(payload){
  const { data:{ session } } = await SB.auth.getSession();
  const r = await fetch('https://vtulllundrfennhjddhc.supabase.co/functions/v1/admin-usuarios', {
    method:'POST',
    headers:{ 'Content-Type':'application/json',
      // el token de sesión ES la credencial: la función decide con él, no con el body
      'Authorization':'Bearer ' + session.access_token,
      'apikey':'sb_publishable_B_ot_6lNVRLiWiEMtApYOQ_3Ho3xNUg' },
    body: JSON.stringify(payload),
  });
  return r.json().catch(() => ({ error:'respuesta ilegible del servidor' }));
}

async function cambiarPassword(){
  const u = USUARIOS.find(x => x.user_id === SEL); if(!u) return;
  const p = prompt('Nueva contraseña para ' + u.email + ' (mínimo 10 caracteres).\nApúntala: no se puede volver a consultar.');
  if(p === null) return;
  if(p.length < 10){ toast('Mínimo 10 caracteres'); return; }
  const d = await llamarAdmin({ accion:'password', user_id:SEL, password:p });
  toast(d.ok ? 'Contraseña cambiada' : 'No se pudo: ' + (d.error || ''));
}

/* ---------- alta ---------- */
function nuevoUsuario(){
  SEL = null; pintarLista();
  $('#stage').classList.add('abierta');
  $('#ficha').innerHTML = `
    <h2 class="t">Nuevo usuario</h2>
    <p class="sub">Se crea la cuenta y se le da acceso de inmediato.</p>
    <fieldset><legend>Datos de acceso</legend>
      <div class="row">
        <div><label>Email</label><input id="nEmail" type="email" placeholder="nombre@lawangproperties.com"></div>
        <div><label>Nombre</label><input id="nNombre" placeholder="Nombre y apellidos"></div>
      </div>
      <label>Contraseña provisional (mínimo 10 caracteres)</label>
      <input id="nPass" type="text" placeholder="La verá al entrar; que la cambie después">
      <label>Rol</label>
      <select id="nRol">${ROLES.map(([v,l]) => `<option value="${v}">${l}</option>`).join('')}</select>
      <p class="nota">La contraseña se muestra en claro a propósito: hay que poder copiarla para
        dársela a la persona. No queda guardada en ningún sitio consultable.</p>
    </fieldset>
    <fieldset><legend>Herramientas que verá</legend>
      <div class="herr">
        ${HERRAMIENTAS.map(([v,l]) => `<label><input type="checkbox" value="${v}"
          ${['contratos','facturas','operaciones'].includes(v)?'checked':''}> ${l}</label>`).join('')}
      </div>
    </fieldset>
    <div class="acciones">
      <button class="btn primary" id="btnCrear">Crear usuario</button>
      <button class="btn" id="btnCancelar">Cancelar</button>
    </div>`;
  $('#btnCancelar').addEventListener('click', () => { pintarFicha(); });
  $('#btnCrear').addEventListener('click', crear);
}

async function crear(){
  const email = $('#nEmail').value.trim().toLowerCase();
  const password = $('#nPass').value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('Email no válido'); return; }
  if(password.length < 10){ toast('La contraseña necesita 10 caracteres o más'); return; }
  const btn = $('#btnCrear'); btn.disabled = true; btn.textContent = 'Creando…';
  const d = await llamarAdmin({
    accion:'crear', email, password,
    nombre: $('#nNombre').value.trim(),
    rol: $('#nRol').value,
    herramientas: [...document.querySelectorAll('.herr input:checked')].map(i => i.value),
  });
  btn.disabled = false; btn.textContent = 'Crear usuario';
  if(!d.ok){ toast('No se pudo crear: ' + (d.error || '')); return; }
  toast('Usuario creado: ' + email);
  await cargar();
  SEL = d.user_id; pintarLista(); pintarFicha();
}

/* ---------- eventos ---------- */
$('#listaU').addEventListener('click', e => {
  const b = e.target.closest('[data-id]'); if(!b) return;
  SEL = b.dataset.id; pintarLista(); pintarFicha(); $('#stage').classList.add('abierta');
});
$('#btnNuevo').addEventListener('click', nuevoUsuario);

LW_AUTH.then(async ({ sb, session, ficha }) => {
  SB = sb;
  $('#who').textContent = session.user.email;
  $('#btnLogout').onclick = async () => { await sb.auth.signOut(); location.replace('/contracts/login.html'); };

  /* La ficha se consulta AQUÍ si el guard no la trae. No es redundancia: el
     29-jul un guard.js cacheado por el servidor (max-age 7 días) seguía siendo
     la versión que no devolvía `ficha`, y este panel le decía al super_admin
     que no era administrador. Depender de que un asset compartido esté fresco
     para decidir un permiso es frágil; preguntarlo cuesta una consulta. */
  YO = ficha || (await sb.from('usuarios').select('rol, herramientas, activo, nombre')
                   .eq('user_id', session.user.id).maybeSingle()).data;

  // Un agente con 'usuarios' en su lista pero sin rol de admin llegaría hasta
  // aquí y solo vería su propia fila (la RLS). Mejor decirlo que enseñar una
  // pantalla vacía.
  if(!YO || !['super_admin','admin'].includes(YO.rol)){
    $('#stage').innerHTML = '<div class="vacio" style="grid-column:1/-1">Solo un administrador gestiona usuarios'
      + (YO ? ' · tu rol es «' + esc(YO.rol) + '»' : '') + '</div>';
    return;
  }
  await cargar();
});
</script>
</body>
</html>
