<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Portada de contrato — Lawang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/brand.css">
<style>
  /* ============================================================
     PORTADA full-bleed A4 · fase 1 (variables de marca + texturas)
     Todo procedural (CSS/SVG) → funciona sin assets. Sustituir:
       · líneas curvas  → imagen de referencia del cliente
       · moanito        → --brand-mark en brand.css
       · título         → Neue Kabel (--font-display) al licenciar
     Texto entre {{ }} = marcador rellenable por el motor.
     ============================================================ */
  @page{ size:A4; margin:0; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:#e9e5db; font-family:var(--font-body); }
  @media print{ body{ background:#fff; } .page{ margin:0 !important; box-shadow:none !important; } }

  .page{ position:relative; width:210mm; height:297mm; margin:14px auto; overflow:hidden;
    background:var(--brand-deep); color:#fff; box-shadow:0 8px 40px rgba(0,0,0,.18); }

  /* — capa 1: degradado de marca (derivado de brand.css → paleta cambiable) — */
  .bg-grad{ position:absolute; inset:0;
    background:
      radial-gradient(130% 80% at 50% 8%, color-mix(in srgb, var(--brand-primary) 55%, transparent), transparent 60%),
      linear-gradient(180deg,
        color-mix(in srgb, var(--brand-deep) 88%, white) 0%,
        var(--brand-deep) 46%,
        color-mix(in srgb, var(--brand-deep) 72%, black) 100%); }

  /* — capa 2: líneas curvas (placeholder de la referencia) en multiply — */
  .curves{ position:absolute; inset:0; mix-blend-mode:multiply; opacity:var(--curves-opacity); }
  .curves path{ stroke:color-mix(in srgb, var(--brand-deep) 55%, black); }

  /* — capa 3: moanito de fondo, baja opacidad — */
  .mark{ position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
    width:150mm; opacity:var(--mark-opacity); pointer-events:none; }

  /* — capa 4: grano — */
  .grain{ position:absolute; inset:0; opacity:var(--grain-opacity);
    filter:contrast(calc(1 + var(--grain-contrast))); mix-blend-mode:overlay; }

  /* — capa 5: contenido — */
  .c-in{ position:relative; height:100%; padding:26mm 22mm; display:flex; flex-direction:column;
    align-items:center; text-align:center; }
  .c-top{ display:flex; align-items:center; gap:12px; }
  .c-top .glyph{ width:40px; height:40px; border:1.5px solid rgba(255,255,255,.85); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-serif); font-size:22px; }
  .c-top .wm{ font-family:var(--font-serif); font-size:20px; letter-spacing:.22em; text-transform:uppercase; }
  .c-top .wm small{ display:block; font-family:var(--font-body); font-size:7.5pt; letter-spacing:.34em; opacity:.82; }

  .c-mid{ margin-top:auto; margin-bottom:auto; }
  .eyebrow{ font-size:9pt; letter-spacing:.42em; text-transform:uppercase; opacity:.85; margin-bottom:18px; }
  h1.title{ font-family:var(--font-display); font-weight:500; font-size:40pt; line-height:1.05;
    letter-spacing:.01em; margin:0; text-wrap:balance; }
  .sub{ font-family:var(--font-serif); font-style:italic; font-size:15pt; opacity:.9; margin-top:14px; }

  .c-foot{ width:100%; font-size:8.5pt; letter-spacing:.16em; text-transform:uppercase; opacity:.8;
    border-top:1px solid rgba(255,255,255,.28); padding-top:12px; display:flex; justify-content:space-between; }
</style>
</head>
<body>
  <div class="page">
    <div class="bg-grad"></div>

    <!-- líneas curvas (placeholder — cambiar por la referencia del cliente) -->
    <svg class="curves" viewBox="0 0 210 297" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="#0a2224" stroke-width="1.1">
        <path d="M-10,40 Q60,10 110,45 T230,50"/>
        <path d="M-10,70 Q60,40 110,75 T230,80"/>
        <path d="M-10,100 Q60,70 110,105 T230,110"/>
        <path d="M-10,130 Q60,100 110,135 T230,140"/>
        <path d="M-10,160 Q60,130 110,165 T230,170"/>
        <path d="M-10,190 Q60,160 110,195 T230,200"/>
        <path d="M-10,220 Q60,190 110,225 T230,230"/>
        <path d="M-10,250 Q60,220 110,255 T230,260"/>
      </g>
    </svg>

    <!-- moanito de fondo (placeholder monograma — swap por --brand-mark) -->
    <svg class="mark" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8F9B7A"/><stop offset="1" stop-color="#485B37"/>
      </linearGradient></defs>
      <circle cx="50" cy="50" r="34" fill="none" stroke="url(#mg)" stroke-width="2.5"/>
      <text x="50" y="66" text-anchor="middle" font-family="Cormorant Garamond, serif"
        font-size="46" fill="url(#mg)">L</text>
      <text x="50" y="104" text-anchor="middle" font-family="Jost, sans-serif"
        font-size="7" letter-spacing="3" fill="url(#mg)">MOANITO</text>
    </svg>

    <!-- grano -->
    <svg class="grain" xmlns="http://www.w3.org/2000/svg">
      <filter id="grf"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/></filter>
      <rect width="100%" height="100%" filter="url(#grf)"/>
    </svg>

    <div class="c-in">
      <div class="c-top">
        <span class="glyph">L</span>
        <span class="wm">Lawang<small>Tropical Properties</small></span>
      </div>

      <div class="c-mid">
        <div class="eyebrow">{{contrato_tipo}} · {{contrato_num}}</div>
        <h1 class="title">{{contrato_titulo}}</h1>
        <div class="sub">{{proyecto_nombre}} · {{parcela_codigo}}</div>
      </div>

      <div class="c-foot">
        <span>{{vendedor_entidad}}</span>
        <span>Confidencial · {{fecha_firma}}</span>
      </div>
    </div>
  </div>
</body>
</html>
