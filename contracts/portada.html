<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- ninguna herramienta interna sin sesion: ver assets/guard.js -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9/dist/umd/supabase.min.js" integrity="sha384-XtYxyIfxexJVTROWK0+c5T8tJ2ItsVLcdgR5nJIoo6WzQqaBZoTPGgbS7XvkRNBZ" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="assets/guard.js?v=abd4a27b"></script>
<title>Portada de contrato — Lawang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/brand.css?v=1a308f29">
<style>
  /* Preview standalone de la portada (para calibrar). La portada real vive en
     templates/_portada.html — esto solo la carga con datos de muestra. */
  @page{ size:A4; margin:0; }
  html,body{ margin:0; padding:0; }
  body{ background:#e9e5db; }
  #host .lwcov{ box-shadow:0 8px 40px rgba(0,0,0,.18); margin:14px auto; }
  /* color de portada de muestra = Burnt Earth (tipo Construcción, como el PDF) */
  :root{ --brand-deep:#42210B; }
  @media print{ body{ background:#fff; } #host .lwcov{ margin:0; box-shadow:none; } }
</style>
</head>
<body>
  <div id="host">Cargando…</div>
<script>
  fetch('templates/_portada.html').then(r=>r.text()).then(h=>{
    const sample={ cov_l1:'Contrato', cov_l2:'de Construcción · DALI',
      contrato_num:'LW-2026-0042', proyecto_nombre:'Sumba Hills' };
    document.getElementById('host').innerHTML = h.replace(/\{\{(\w+)\}\}/g,(m,k)=> sample[k]!=null ? sample[k] : '');
  });
</script>
</body>
</html>
