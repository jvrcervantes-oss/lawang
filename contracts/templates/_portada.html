<!-- PORTADA (partial) — el motor la inyecta al inicio de cualquier contrato.
     Diseño según la referencia real del cliente (ContratoSumba.pdf):
     fondo del color del tipo de contrato, moanito (tiki) tono-sobre-tono
     anclado abajo, emblema botánico en la esquina, título abajo-izquierda
     (fino + bold) + regla + proyecto en serif espaciada.
     Color de fondo = var(--brand-deep) (app.html lo fija por tipo).
     Assets en assets/brand/. Clases .lwcov* namespaced. Marcadores {{...}}. -->
<style>
  .lwcov{ position:relative; width:210mm; height:297mm; margin:0 auto; overflow:hidden;
    color:var(--brand-paper,#F5F0E6); background:var(--brand-deep,#42210B);
    page-break-after:always; font-family:var(--font-body,'Jost',sans-serif); }
  .lwcov .g{ position:absolute; inset:0; }
  /* imagen de fondo de portada (oculta por defecto; el panel Diseño la activa).
     Va la primera → queda por debajo del degradado/moanito/contenido, sobre el color base. */
  .lwcov .cover-bg{ display:none; background:no-repeat center/cover; }
  .lwcov .grad{ background:
    radial-gradient(120% 85% at 50% 10%, color-mix(in srgb, var(--brand-primary,#8F9B7A) 20%, transparent), transparent 55%),
    linear-gradient(180deg, transparent 55%, color-mix(in srgb, var(--brand-deep,#42210B) 60%, black) 100%); }
  /* moanito de fondo: div con background para poder intercambiar/recolocar
     desde el panel Diseño (app.html inyecta overrides sobre estas reglas). */
  .lwcov .moai{ position:absolute; left:0; right:0; bottom:-3%; height:74%;
    background:url(assets/brand/tiki-totem.png) no-repeat center bottom/contain;
    opacity:.075; filter:brightness(0) invert(1); }
  /* slot de logo (oculto por defecto; el panel Diseño lo activa) */
  .lwcov .cov-logo{ display:none; position:absolute; background:no-repeat center/contain; }
  /* emblema de la esquina — oculto por defecto; SOLO aparece si el usuario
     sube una imagen desde el panel Diseño (que inyecta su CSS). */
  .lwcov .emblem{ display:none; position:absolute; background:no-repeat center/contain; }

     resolución de imprenta. MEDIDO sobre esta misma portada: 17,1 MB el PDF, y
     con la textura de abajo 0,20 MB. Setenta veces menos.
     Probadas antes las salidas obvias, y ninguna servía: quitar solo la mezcla
     deja 29,6 MB y quitar solo el `contrast`, 28,6 MB. El peso lo genera el
     `feTurbulence`, no lo que lleva encima — por eso van los tres fuera.

     claras y cuatro oscuras, cada una con su alfa) en vez de 8 bits por canal,
     que no comprime. Va incrustado y no como fichero para que el renderizador no
     tenga que ir a buscarlo: si un asset no responde, el grano desaparece del
     contrato y nadie se entera.

     `opacity:${coverGrain}` (.12 por defecto) y la baja a su sitio, así el

  .lwcov .num{ position:absolute; top:17mm; left:22mm; font-size:8pt; letter-spacing:.24em; text-transform:uppercase; opacity:.7; }
  .lwcov .in{ position:absolute; left:0; right:0; bottom:26mm; padding:0 22mm; }
  /* Título: el IDIOMA BASE (el del toggle, ES o EN) va solo, grande, justo
     SOBRE la regla. La traducción a Bahasa sube a la esquina superior
     izquierda, bajo el nº de contrato — así el pie de portada queda con una
     sola voz y el requisito legal de Bahasa sigue cubierto. */
  .lwcov .tline{ font-family:var(--font-display,'Jost',sans-serif); line-height:1.18; text-transform:uppercase; }
  .lwcov .tline-base{ font-weight:700; font-size:22pt; letter-spacing:.01em; }
  .lwcov .tline-id{ position:absolute; top:24mm; left:22mm; right:22mm;
    font-weight:300; font-size:11pt; letter-spacing:.02em; opacity:.72; }
  .lwcov .rule{ height:1px; width:100%; margin:12px 0; background:color-mix(in srgb, var(--brand-paper,#F5F0E6) 50%, transparent); }
  /* Nombre de proyecto: The Seasons (fuente de marca) — versión demo/DRM
     conocida por corromper los caracteres & + 4 ' (ver assets/fonts/), pero
     ninguno de los nombres de proyecto actuales los usa. Si se licencia la
     versión completa, reemplazar el archivo .otf sin tocar esta regla. */
  @font-face{ font-family:'The Seasons'; src:url('assets/fonts/TheSeasons-Regular.otf') format('opentype'); font-weight:400; font-display:swap; }
  .lwcov .sub{ font-family:'The Seasons', var(--font-serif,'Jost',sans-serif); font-size:15pt; letter-spacing:.25em;
    text-transform:uppercase; opacity:.9; }
  @media print{ .lwcov{ margin:0; } }
</style>
<div class="lwcov">
  <div class="g cover-bg" aria-hidden="true"></div>
  <div class="g grad"></div>
  <div class="moai" aria-hidden="true"></div>
  <div class="cov-logo" aria-hidden="true"></div>
  <div class="emblem" aria-hidden="true"></div>
  <div class="g grain" aria-hidden="true"></div>
  <div class="num">{{contrato_num}}</div>
  <div class="tline tline-id">{{cov_t_id}}</div>
  <div class="in">
    <div class="tline tline-base">{{cov_t}}</div>
    <div class="rule"></div>
    <!-- El nombre del proyecto NO va en la portada (petición del cliente, 22-jul).
         Sigue imprimiéndose dentro del contrato en las plantillas que lo llevan y
         se guarda en la ficha de Supabase; la regla .sub se conserva por si vuelve. -->
  </div>
</div>
