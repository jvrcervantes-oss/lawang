<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lawang · Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Cormorant Garamond entra el 6-ago-2026: el logotipo de la tarjeta pasa de una
     «L» dentro de un círculo a la palabra «Lawang» en serif, que es como la marca
     aparece en la barra del resto de la suite. Sin esta línea el wordmark caería a
     Georgia y la primera pantalla que ve el equipo cada mañana sería la única con
     otra tipografía. -->
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9/dist/umd/supabase.min.js" integrity="sha384-XtYxyIfxexJVTROWK0+c5T8tJ2ItsVLcdgR5nJIoo6WzQqaBZoTPGgbS7XvkRNBZ" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  /* Filete unificado a #E4DCCB, el mismo valor que `--linea` de suite.css: esta
     pantalla tenía #e4ddcf, unos puntos de hex por detrás, y es la única de la
     suite que no carga la hoja compartida (a propósito: es la puerta, y no debe
     depender de nada que pueda fallar). Se copia el valor, no se importa. */
  :root{ --tg:#485B37; --dl:#104C4F; --va:#2E3437; --ss:#BEB3A5; --rl:#F1EBDD;
         --muted:#4A5052; --line:#E4DCCB; --sc:#8F9B7A; }
  *{ box-sizing:border-box; } html,body{ margin:0; height:100%; }
  body{ font-family:'Jost',sans-serif; background:var(--rl); color:var(--va);
    display:grid; place-items:center; min-height:100vh; padding:20px; }
  /* La tarjeta entra con un movimiento corto al cargar. `both` deja el estado
     final puesto: sin él, un fallo de la animación la dejaría invisible. */
  @keyframes lwFadeUp{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }
  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; width:100%; max-width:380px;
    padding:40px 34px; box-shadow:0 18px 48px -22px rgba(34,40,42,.35);
    animation:lwFadeUp .6s cubic-bezier(.22,.61,.36,1) both; }
  .brand{ display:flex; flex-direction:column; align-items:center; }
  /* El logotipo pasa de una «L» en un círculo a la palabra en serif: es como la
     marca se escribe en la barra del resto de la suite, así que la puerta deja de
     ser la única pantalla con otro tratamiento. La serif se queda en UNA palabra,
     que es la regla del manual. */
  .brand .wordmark{ font-family:'Cormorant Garamond',Georgia,serif; font-size:30px; font-weight:600;
    line-height:1; letter-spacing:.06em; color:var(--dl); }
  .brand h1{ font-family:'Jost',sans-serif; font-size:10.5px; letter-spacing:.22em;
    text-transform:uppercase; margin:7px 0 28px; font-weight:500; color:var(--sc); }
  label{ display:block; font-size:11.5px; color:var(--muted); margin:0 0 5px; }
  /* 16px en el campo y no 13,5 como el mockup: por debajo de 16px, Safari en iOS
     hace ZOOM al enfocar un input y descuadra la pantalla. Es la única cifra del
     handoff que no se copia, y por eso queda escrito. */
  input{ width:100%; font-family:inherit; font-size:16px; padding:11px 13px; border:1px solid var(--line);
    border-radius:9px; background:#fdfcf9;
    transition:border-color .15s ease, box-shadow .15s ease; }
  input:not(:last-of-type){ margin-bottom:14px; }
  input:focus{ outline:none; border-color:var(--tg); box-shadow:0 0 0 3px rgba(72,91,55,.15); }
  /* Pastilla y con sombra propia, como el botón primario del resto de la suite.
     El `transform` solo en hover; en `:active` vuelve, para que el clic se note. */
  button{ width:100%; margin-top:20px; font-family:inherit; font-size:13.5px; font-weight:600; color:#fff;
    background:var(--dl); border:1px solid var(--dl); border-radius:999px; padding:12px; cursor:pointer;
    box-shadow:0 8px 20px -10px rgba(16,76,79,.5);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease; }
  button:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 12px 26px -10px rgba(16,76,79,.55); }
  button:active:not(:disabled){ transform:none; box-shadow:0 8px 20px -10px rgba(16,76,79,.5); }
  button:disabled{ background:var(--ss); border-color:var(--ss); box-shadow:none; }
  .err{ color:#a3342b; font-size:13px; margin-top:14px; min-height:18px; text-align:center; }
  /* Pie hacia el portal. Existe porque un comprador que recibe un enlace y
     aterriza aquí no tiene contraseña de equipo y se queda sin salida: la única
     pista era volver atrás. Ahora se le dice dónde entrar. */
  .pie{ margin:22px 0 0; font-size:11.5px; line-height:1.5; color:#8A8570; text-align:center; }
  .pie a{ color:var(--dl); }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
    button:hover:not(:disabled){ transform:none; }
  }
</style>
</head>
<body>
  <form class="card" id="f">
    <div class="brand">
      <!-- `aria-hidden` en el wordmark y el nombre real en el <h1>: para quien
           navega con lector de pantalla, «Lawang» decorativo dos veces es ruido;
           lo que necesita oír es de qué pantalla se trata. -->
      <div class="wordmark" aria-hidden="true">Lawang</div>
      <h1>Panel interno</h1>
    </div>
    <label for="email">Correo</label>
    <input type="email" id="email" autocomplete="username" placeholder="nombre@lawangproperties.com" required>
    <label for="password">Contraseña</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
    <button type="submit" id="btn">Entrar</button>
    <div class="err" id="err" role="alert" aria-live="polite"></div>
    <p class="pie">Acceso restringido al equipo. Si eres cliente,
      entra desde <a href="/portal/">tu área de clientes</a>.</p>
  </form>
<script>
const $=s=>document.querySelector(s);
// misma key publicable que app.html — no es secreta, el control real vive en
// las políticas RLS de Supabase (exigen role authenticated desde jul-2026).
const sb = window.supabase.createClient(
  'https://vtulllundrfennhjddhc.supabase.co',
  'sb_publishable_B_ot_6lNVRLiWiEMtApYOQ_3Ho3xNUg'
);
// destino tras entrar: ?next=/ruta/ (solo rutas internas, nunca URL externa)
// Sin `next`, se entra por la INTRANET y no por Contratos: la suite ya son
// siete herramientas y aterrizar en una concreta obligaba a salir de ella para
// ir a cualquier otra. Con `next` (lo pone el guard al rebotar) se respeta el
// destino que se pedía, que es lo que espera quien pincha un enlace directo.
const _n = new URLSearchParams(location.search).get('next') || '';
const DEST = /^\/[^/\\]/.test(_n) ? _n : '/intranet/';

// si ya hay sesión válida, ir directo a la app
sb.auth.getSession().then(({data:{session}})=>{ if(session) location.href=DEST; });

$('#f').addEventListener('submit', async e=>{
  e.preventDefault(); $('#btn').disabled=true; $('#err').textContent='';
  const { error } = await sb.auth.signInWithPassword({
    email: $('#email').value, password: $('#password').value
  });
  if(!error){ location.href=DEST; }
  else{ $('#err').textContent = error.message==='Invalid login credentials' ? 'Credenciales incorrectas' : error.message; $('#btn').disabled=false; }
});
</script>
</body>
</html>
