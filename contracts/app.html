<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lawang · Generador de Contratos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/brand.css">
<!-- pdf.js: convierte PDFs de anexos a imágenes de página (para incrustarlos en el contrato) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- Supabase (guardado + numeración automática de contratos, tabla `contratos` en el
     proyecto Lawang clientes/pagos). Publishable key: pensada para ir en el navegador,
     no es un secreto — el control de acceso real vive en las políticas RLS. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{ --line:#e4ddcf; --tbh:56px; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{ font-family:var(--font-body,'Jost',sans-serif); color:var(--va); background:var(--rl); font-size:16px; line-height:1.5; }

  /* ---------- topbar ---------- */
  .topbar{ position:sticky; top:0; z-index:40; background:#fff; border-bottom:1px solid var(--line); height:var(--tbh);
    display:flex; align-items:center; gap:12px; padding:0 16px; padding-top:env(safe-area-inset-top); }
  .topbar .brandlogo{ height:24px; width:auto; }
  .topbar .tbtitle{ font-size:16px; letter-spacing:.12em; text-transform:uppercase; margin:0; color:var(--muted); font-weight:500; }
  .topbar .spacer{ flex:1; }
  .lang-toggle{ display:flex; gap:2px; background:var(--rl); border:1px solid var(--line); border-radius:8px; padding:2px; }
  .lang-toggle button{ border:none; background:none; font:inherit; font-size:12px; padding:5px 9px; border-radius:6px; color:var(--muted); cursor:pointer; }
  .lang-toggle button.on{ background:var(--tg); color:#fff; }
  .lang-hint{ font-size:11px; letter-spacing:.04em; color:var(--sc); text-transform:uppercase; font-weight:600; }
  .tb-link{ background:none; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:12.5px; color:var(--va); padding:6px 11px; cursor:pointer; }
  .tb-link:hover{ border-color:var(--tg); }

  /* ---------- escenario en dos columnas ---------- */
  .stage{ display:flex; height:calc(100dvh - var(--tbh)); }
  .pane-form{ flex:1 1 50%; min-width:0; overflow:auto; padding:18px 16px 40px; }
  .pane-form .inner{ max-width:640px; margin:0 auto; }
  .pane-preview{ flex:1 1 50%; min-width:0; display:flex; flex-direction:column; background:#ece4d6; border-left:1px solid var(--line); }
  .pv-bar{ display:flex; align-items:center; gap:10px; padding:10px 14px; background:#fff; border-bottom:1px solid var(--line); }
  .pv-bar b{ font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); flex:1; }
  .pv-scroll{ flex:1; overflow:auto; padding:16px; display:flex; justify-content:center; }
  #pvFrame{ width:100%; max-width:820px; height:100%; min-height:400px; border:none; background:#fff; box-shadow:0 6px 30px rgba(46,52,55,.18); border-radius:6px; }
  .pv-close{ display:none; }

  /* ---------- selector de plantilla ---------- */
  .tpl-card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:14px;
    display:flex; align-items:center; gap:12px; }
  .tpl-card .ico{ width:40px; height:40px; border-radius:10px; background:var(--dl); display:grid; place-items:center; color:#fff; font-size:18px; flex:none; }
  .tpl-card .meta{ flex:1; min-width:0; }
  .tpl-card .meta b{ display:block; font-size:14px; }
  .tpl-card .meta span{ font-size:12px; color:var(--muted); }
  .tpl-card select{ font:inherit; font-size:13px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--va); flex:none; max-width:44%; }

  /* ---------- secciones (acordeón) ---------- */
  .tier-label{ font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--sc);
    margin:16px 4px 8px; padding-top:10px; border-top:1px dashed var(--line); }
  .tier-label.first{ border-top:none; padding-top:0; }
  .section{ background:#fff; border:1px solid var(--line); border-radius:14px; margin-bottom:12px; overflow:hidden; }
  .section > header{ display:flex; align-items:center; gap:10px; padding:13px 15px; cursor:pointer; user-select:none; }
  .section > header .num{ font-style:italic; color:var(--tg); font-size:17px; width:20px; }
  .section > header h2{ font-size:13px; letter-spacing:.06em; text-transform:uppercase; margin:0; color:var(--dl); font-weight:600; flex:1; }
  .section > header .chev{ color:var(--muted); transition:transform .2s; font-size:13px; }
  .section.collapsed > header .chev{ transform:rotate(-90deg); }
  .section .body{ padding:2px 15px 14px; }
  .section.collapsed .body{ display:none; }

  .opt-toggle{ display:flex; align-items:center; gap:8px; margin-left:auto; font-size:12px; color:var(--muted); }
  .switch{ position:relative; width:42px; height:24px; flex:none; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; inset:0; background:var(--ss); border-radius:24px; transition:.2s; }
  .slider:before{ content:""; position:absolute; height:18px; width:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + .slider{ background:var(--tg); }
  .switch input:checked + .slider:before{ transform:translateX(18px); }
  .section.optional.off .body{ display:none; }
  .section.optional.off{ opacity:.85; }
  /* Contrato bloqueado (PDF firmado ya subido): una sola clase corta toda
     edición del panel de campos (inputs, firmas, anexos, cláusulas,
     adquirientes…) sin tener que deshabilitar elemento a elemento — incluye
     los canvas de firma, que pointer-events también bloquea. */
  #form.locked{ pointer-events:none; opacity:.6; }

  .field{ margin:11px 0; }
  .field label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; }
  .field input, .field textarea, .field select{ width:100%; font-family:inherit; font-size:16px; color:var(--va);
    padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:#fdfcf9; }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:none; border-color:var(--tg); box-shadow:0 0 0 3px rgba(72,91,55,.12); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px){ .grid2{ grid-template-columns:1fr; } }

  .note-blocked{ font-size:11.5px; color:var(--muted); background:#fbf9f3; border:1px dashed var(--ss); border-radius:10px; padding:11px 13px; margin:8px 0 0; }
  .note-blocked b{ color:var(--be); }
  .note-blocked ul{ margin:6px 0 0; padding-left:16px; } .note-blocked li{ margin-bottom:2px; }

  /* firma */
  .sigpad-wrap{ border:1px dashed var(--ss); border-radius:10px; background:#fff; position:relative; touch-action:none; }
  .sigpad-wrap canvas{ width:100%; height:140px; display:block; border-radius:10px; }
  .sigpad-wrap .ph{ position:absolute; inset:0; display:grid; place-items:center; color:var(--ss); font-size:13px; pointer-events:none; }
  .sigpad-wrap.signed .ph{ display:none; }
  .sig-actions{ display:flex; justify-content:flex-end; margin-top:6px; }
  .link-btn{ background:none; border:none; color:var(--tg); font-size:12.5px; cursor:pointer; text-decoration:underline; padding:4px; }

  .btn{ font-family:inherit; font-size:14px; font-weight:500; border-radius:10px; padding:10px 16px; border:none; cursor:pointer; }
  .btn.primary{ background:var(--dl); color:#fff; }
  .btn.primary:disabled{ background:var(--ss); cursor:not-allowed; }
  .btn.ghost{ background:none; border:1px solid var(--line); color:var(--va); }
  .btn.ghost.editing{ background:var(--tg); border-color:var(--tg); color:#fff; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--va); color:#fff; padding:10px 18px; border-radius:30px; font-size:13px; z-index:80; opacity:0; transition:.3s; pointer-events:none; }
  .toast.show{ opacity:1; }

  /* ---------- panel Diseño ---------- */
  .section.design > header h2{ color:var(--be); }
  .section.design .num{ font-style:normal; }
  .dz{ border-top:1px dashed var(--line); padding:12px 0 4px; }
  .dz:first-child{ border-top:none; }
  .dz-row{ display:flex; align-items:center; gap:10px; margin:7px 0; font-size:12.5px; color:var(--muted); }
  .dz-row > span{ width:78px; flex:none; }
  .dz-row select, .dz-row input[type=range], .dz-row input[type=color]{ flex:1; }
  .dz-row input[type=range]{ accent-color:var(--tg); }
  .dz-row input[type=color]{ height:34px; padding:2px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .up{ display:inline-flex; align-items:center; gap:6px; background:var(--rl); border:1px solid var(--line); border-radius:8px; padding:7px 12px; font-size:12.5px; color:var(--va); cursor:pointer; }
  .up input{ display:none; }

  /* ---------- panel Diseño (rework moderno) ---------- */
  .dsec{ display:flex; align-items:center; gap:10px; margin:18px 2px 10px;
    font-size:10.5px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--sc); }
  .dsec::after{ content:""; flex:1; height:1px; background:var(--line); }
  .dsec:first-of-type{ margin-top:6px; }
  /* fila escalar: color / degradado / textura */
  .drow{ display:flex; align-items:center; gap:12px; margin:11px 2px; }
  .drow .dlab{ width:96px; flex:none; font-size:12.5px; color:var(--muted); }
  .drow input[type=range]{ flex:1; accent-color:var(--tg); height:4px; }
  .drow .dval{ width:40px; flex:none; text-align:right; font-size:12px; font-weight:600; color:var(--dl); font-variant-numeric:tabular-nums; }
  .dswatch{ width:44px; height:30px; flex:none; padding:2px; border:1px solid var(--line); border-radius:9px; background:#fff; cursor:pointer; }
  /* tarjeta de asset */
  .dcard{ border:1px solid var(--line); border-radius:16px; padding:13px 14px; margin:11px 0;
    background:linear-gradient(180deg,#fff,#fdfcf8); box-shadow:0 1px 2px rgba(46,52,55,.04); }
  .dcard.empty{ opacity:.9; }
  .dcard.empty .dcard-ctl{ opacity:.4; pointer-events:none; }
  .dcard-head{ display:flex; align-items:center; gap:12px; }
  .dthumb{ width:48px; height:48px; flex:none; border-radius:11px; border:1px solid var(--line);
    background:#fff no-repeat center/contain; display:grid; place-items:center; color:var(--ss); font-size:20px; }
  .dcard-title{ flex:1; min-width:0; }
  .dcard-title b{ display:block; font-size:13px; font-weight:600; color:var(--dl); }
  .dcard-title span{ font-size:11px; color:var(--muted); }
  .dbtn{ font:inherit; font-size:12px; border:1px solid var(--line); background:#fff; color:var(--va);
    border-radius:9px; padding:8px 12px; cursor:pointer; white-space:nowrap; transition:border-color .15s,color .15s; }
  .dbtn:hover{ border-color:var(--tg); color:var(--tg); }
  .dbtn.ghost{ color:var(--muted); border-style:dashed; }
  .dbtn.upload{ position:relative; overflow:hidden; }
  .dbtn.upload input[type=file]{ position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }
  .dcard-ctl{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-top:13px; }
  .dctl{ display:flex; flex-direction:column; gap:6px; }
  .dctl.full{ grid-column:1/-1; }
  .dctl > label{ display:flex; justify-content:space-between; align-items:baseline;
    font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .dctl > label .v{ font-size:12px; font-weight:600; letter-spacing:0; text-transform:none; color:var(--dl); font-variant-numeric:tabular-nums; }
  .dctl select{ font:inherit; font-size:12.5px; padding:9px 10px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--va); }
  .dctl input[type=range]{ accent-color:var(--tg); height:4px; margin:5px 0 2px; }

  /* ---------- responsive: móvil = una columna + preview a pantalla ---------- */
  .fab{ display:none; position:fixed; z-index:45; right:16px; bottom:calc(16px + env(safe-area-inset-bottom));
    background:var(--dl); color:#fff; border:none; border-radius:30px; padding:14px 20px; font:inherit; font-size:15px; box-shadow:0 8px 24px rgba(16,76,79,.35); cursor:pointer; }
  @media (max-width:900px){
    .stage{ flex-direction:column; height:auto; }
    .pane-form{ overflow:visible; height:auto; padding-bottom:96px; }
    .pane-preview{ position:fixed; inset:0; z-index:60; transform:translateY(100%); transition:transform .3s ease;
      border-left:none; height:100dvh; }
    .pane-preview.open{ transform:none; }
    .pv-close{ display:inline-flex; }
    .fab{ display:inline-flex; }
    /* topbar: con "Salir" sumado a los 3 botones + selector de idioma ya no
       cabe todo en una fila a partir de aquí — quita lo prescindible
       (el rótulo "BAHASA +" es solo informativo, el toggle ES/EN se entiende
       solo) y encoge botones/título antes de dejar que algo se parta en dos
       líneas. */
    .topbar{ gap:6px; padding:0 10px; }
    .topbar .tbtitle{ font-size:13px; }
    .lang-hint{ display:none; }
    .tb-link{ padding:6px 8px; font-size:12px; }
  }

  /* ---------- panel "Contratos guardados" ---------- */
  .cp-overlay{ display:none; position:fixed; inset:0; z-index:80; background:rgba(46,52,55,.45);
    align-items:center; justify-content:center; padding:24px; }
  .cp-overlay.open{ display:flex; }
  .cp-modal{ background:#fff; border-radius:12px; width:min(760px,100%); max-height:min(600px,86vh);
    display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  .cp-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line); }
  .cp-head b{ font-size:15px; letter-spacing:.02em; }
  #cpSearch{ margin:12px 18px 0; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:13.5px; }
  .cp-cols{ display:grid; grid-template-columns:1fr .8fr 1.4fr 1.2fr 1fr .9fr; gap:8px; padding:12px 18px 6px;
    font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .cp-list{ overflow-y:auto; padding:0 18px 16px; flex:1; }
  .cp-row{ display:grid; grid-template-columns:1fr .8fr 1.4fr 1.2fr 1fr .9fr; gap:8px; padding:9px 0;
    border-top:1px solid var(--line); font-size:13px; cursor:pointer; }
  .cp-row:hover{ background:var(--rl); }
  .cp-row .cp-num{ font-weight:600; color:var(--tg); }
  .cp-empty{ padding:24px 0; text-align:center; color:var(--muted); font-size:13px; }

  /* ---------- modal "Enviar por email" ---------- */
  .em-body{ padding:14px 18px 18px; display:flex; flex-direction:column; gap:12px; }
  .em-body label{ display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted); }
  .em-body input, .em-body textarea{ font:inherit; font-size:13.5px; padding:9px 11px; border:1px solid var(--line);
    border-radius:8px; color:var(--va); resize:vertical; }
  .em-note{ font-size:11.5px; color:var(--muted); margin:0; }
  @media (max-width:640px){
    .cp-cols{ display:none; }
    .cp-row{ grid-template-columns:1fr; gap:2px; }
    .cp-row span::before{ content:attr(data-l) ": "; color:var(--muted); }
  }
</style>
</head>
<body>
  <div class="topbar">
    <img class="brandlogo" src="assets/brand/lawang-logo-v3-dark.png" alt="Lawang">
    <h1 class="tbtitle">· Contratos</h1>
    <div class="spacer"></div>
    <button type="button" class="tb-link" id="btnContracts">Contratos guardados</button>
    <button type="button" class="tb-link" id="btnReset">Limpiar</button>
    <button type="button" class="tb-link" id="btnLogout" title="Cerrar sesión">Salir</button>
    <span class="lang-hint" title="El contrato siempre incluye Bahasa Indonesia">Bahasa + </span>
    <div class="lang-toggle" id="langToggle"></div>
  </div>

  <div class="stage">
    <!-- IZQUIERDA · campos -->
    <div class="pane-form">
      <div class="inner">
        <div class="tpl-card">
          <div class="ico">📄</div>
          <div class="meta">
            <b id="tplName">Contrato de Reserva de Proyecto</b>
            <span id="tplDesc">—</span>
          </div>
          <select id="tplPick" aria-label="Tipo de contrato"></select>
        </div>
        <form id="form"><!-- generado por JS --></form>
      </div>
    </div>

    <!-- DERECHA · preview viva -->
    <div class="pane-preview" id="pane">
      <div class="pv-bar">
        <b id="pvTitle">Vista previa</b>
        <button class="btn ghost" id="btnEdit" title="Editar el texto fijo del contrato">✎ Editar texto</button>
        <button class="btn ghost" id="btnEditReset" title="Restaurar texto original de la plantilla" style="display:none">↺ Original</button>
        <button class="btn ghost" id="btnSave" style="display:none">Guardar en base de datos</button>
        <button class="btn ghost" id="btnLockUpload" style="display:none" title="Sube el PDF que ha devuelto el cliente firmado y bloquea el contrato para que no se pueda seguir editando">🔒 Subir firmado</button>
        <input type="file" id="lockFileInput" accept="application/pdf" style="display:none">
        <span id="lockBadge" style="display:none;font-size:12px;color:var(--be,#a3342b);align-items:center;gap:6px;font-weight:600">🔒 Bloqueado</span>
        <button class="btn ghost" id="btnDownloadSigned" style="display:none">Descargar PDF firmado</button>
        <button class="btn ghost" id="btnEmail">Enviar por email</button>
        <button class="btn primary" id="btnPdf">Descargar PDF</button>
        <button class="btn ghost pv-close" id="btnClose">Cerrar</button>
      </div>
      <div class="pv-scroll"><iframe id="pvFrame" title="Vista previa del contrato"></iframe></div>
    </div>
  </div>

  <button type="button" class="fab" id="fab">Vista previa ⤢</button>
  <div class="toast" id="toast"></div>

  <!-- Panel "Contratos guardados" — lista lo que hay en Supabase (solo Parcela/Construcción,
       que son los 2 tipos con numeración). Click en una fila reabre ese contrato en el form. -->
  <div class="cp-overlay" id="cpOverlay">
    <div class="cp-modal">
      <div class="cp-head">
        <b>Contratos guardados</b>
        <button type="button" class="tb-link" id="cpClose">Cerrar</button>
      </div>
      <input type="search" id="cpSearch" placeholder="Buscar por número, comprador o proyecto…">
      <div class="cp-cols">
        <span>Nº</span><span>Tipo</span><span>Comprador</span><span>Proyecto</span><span>Precio</span><span>Fecha</span>
      </div>
      <div class="cp-list" id="cpList"></div>
    </div>
  </div>

  <!-- Modal "Enviar por email" — manda el HTML de la vista previa a
       api/send_email.php, que lo renderiza a PDF con el servicio Puppeteer
       (Chromium real en Railway). Si ese servicio no está configurado o
       falla, cae automáticamente al PDF adjuntado a mano (opcional, plegado). -->
  <div class="cp-overlay" id="emOverlay">
    <div class="cp-modal" style="width:min(480px,100%)">
      <div class="cp-head">
        <b>Enviar por email</b>
        <button type="button" class="tb-link" id="emClose">Cerrar</button>
      </div>
      <div class="em-body">
        <p class="em-note">Se envía tal cual está la vista previa — no hace falta descargar ni adjuntar nada.</p>
        <label>Destinatario<input type="email" id="emTo" placeholder="cliente@email.com" required></label>
        <label>Asunto<input type="text" id="emSubject"></label>
        <label>Mensaje<textarea id="emMessage" rows="5"></textarea></label>
        <details class="em-manual">
          <summary class="tb-link">O adjúntalo tú mismo (opcional)</summary>
          <label>PDF del contrato<input type="file" id="emFile" accept="application/pdf"></label>
        </details>
        <button type="button" class="btn primary" id="emSend" style="width:100%">Enviar</button>
      </div>
    </div>
  </div>

<script>
/* ============================================================
   GENERADOR DE CONTRATOS — Lawang
   · Layout dos columnas: campos ↔ preview viva (re-render en vivo).
   · Panel Diseño: color de portada + logo/isotipo/marca de agua
     con posiciones predefinidas, tamaño y opacidad. Persiste en
     localStorage (marca del cliente, sobrevive recarga).
   · Diccionario de marcadores en 3 niveles (tokens.json) · idioma.
   · Merge y PDF: siempre en cliente (ver printPreview()); el guardado del
     registro va a Supabase (guardarContrato()), no a un backend propio.
   ============================================================ */
const TEMPLATES = [
  { slug:'ppjb_parcela',     file:'templates/ppjb_parcela.html', cover:'#485B37',
    name:{es:'Reserva de Parcela',en:'Plot Reservation',id:'Reservasi Kavling'},
    l2:{es:'de Reserva de Parcela',en:'Plot Reservation',id:'Reservasi Kavling'}, ready:true },
  { slug:'ppjb_reserva',     file:'templates/ppjb_reserva.html', cover:'#104C4F',
    name:{es:'Contrato General',en:'General Agreement',id:'Perjanjian Umum'},
    l2:{es:'General',en:'General',id:'Umum'}, ready:true },
  { slug:'ppjb_construccion', file:'templates/ppjb_construccion.html', cover:'#42210B',
    name:{es:'Construcción',en:'Construction',id:'Konstruksi'},
    l2:{es:'de Construcción',en:'Construction',id:'Konstruksi'}, ready:true },
  { slug:'commercial_offer', file:'templates/commercial_offer.html', cover:'#8F9B7A',
    name:{es:'Oferta Comercial (Apéndice D)',en:'Commercial Offer (Appendix D)',id:'Penawaran Komersial (Lampiran D)'},

/* CSS de idioma: Bahasa (id) SIEMPRE visible + el idioma seleccionado (es|en),
   en 2 COLUMNAS (idioma izq. / Bahasa der.). Los rótulos (h2, título, roles,
   celdas de tabla) siguen apilados para no romperse.
   Nota: las reglas de columna apuntan SOLO a LANG e id — un selector genérico
   [data-lang] re-mostraría el idioma oculto por especificidad.
   float, NO inline-block: Chromium no parte un inline-block entre páginas al
   imprimir/PDF — si un bloque bilingüe (sobre todo <ul>/<ol> con varios
   ítems) no cabía en lo que quedaba de hoja, saltaba ENTERO a la siguiente,
   dejando la mitad de la página en blanco (bug real, visto en PDF generado).
   Un float SÍ es una caja de bloque normal que Chromium puede cortar por
   líneas entre páginas. Contrapartida asumida: las columnas ya no quedan
   perfectamente alineadas fila a fila si una traducción es más larga que la
   otra — normal en bilingües reales, y muchísimo más leve que la página en
   blanco. Ver contract.css (clear:both en h2/.party/table.pays/.pending)
   para que lo que NO es columna de idioma corte el float y recupere el
   ancho completo. */
function langCSS(){
  const L2=`.doc p[data-lang="${LANG}"],.doc ul[data-lang="${LANG}"],.doc ol[data-lang="${LANG}"]`;
  const IDs=`.doc p[data-lang="id"],.doc ul[data-lang="id"],.doc ol[data-lang="id"]`;
  return `[data-lang]{display:none!important}[data-lang="${LANG}"]{display:revert!important}`
    + `[data-lang="id"]{display:block!important}.doc [data-lang="id"]{color:#6b6c66}`
    // clear:left/right (no solo float) — sin esto los floats se empaquetan
    // horizontalmente en cualquier hueco libre (comportamiento normal de
    // CSS float) y un bloque LANG podía colarse al lado del ID anterior en
    // vez de apilarse bajo el bloque LANG anterior. clear fuerza dos
    // columnas realmente independientes, cada una apilada contra sí misma.
    + `${L2},${IDs}{float:left;width:48.5%;box-sizing:border-box}`
    + `${IDs}{float:right;clear:right}`
    + `${L2}{padding-right:4.5%;clear:left}`;
}

/* CSS que reskin-ea portada+interior según DESIGN (se inyecta en el <head> del doc) */
function designStyle(){
  const d=DESIGN;
  const color = d.coverColor || CURRENT.cover || '#104C4F';
  let css = `:root{--brand-deep:${color};}`;

  // portada · isotipo de fondo (moanito). Custom → sin filtro de blanqueo.
  const markSrc = d.coverMark.src || 'assets/brand/tiki-totem.png';
  css += `.lwcov .moai{${COVER_POS[d.coverMark.pos]||COVER_POS['bottom-center']}`
       + `height:${d.coverMark.pos==='fullbleed'?'auto':d.coverMark.size+'%'};`
       + `background-image:url("${markSrc}");background-position:${d.coverMark.pos==='fullbleed'?'center':'center bottom'};`
       + `background-size:${d.coverMark.pos==='fullbleed'?'cover':'contain'};`
       + `opacity:${d.coverMark.op};${d.coverMark.src?'filter:none;':''}}`;

  // portada · logo
  if(d.coverLogo.src){
    css += `.lwcov .cov-logo{display:block;${COVER_POS[d.coverLogo.pos]||COVER_POS['top-center']}`
         + `width:${d.coverLogo.size}mm;height:${d.coverLogo.size}mm;`
         + `background-image:url("${d.coverLogo.src}");opacity:${d.coverLogo.op};}`;
  }
  // portada · profundidad (degradado) y textura (grano), editables
  css += `.lwcov .grad{opacity:${d.coverGrad};}.lwcov .grain{opacity:${d.coverGrain};}`;
  // portada · emblema de la esquina — SOLO si el usuario sube una imagen (sin default)
  if(d.coverEmblem.src){
    css += `.lwcov .emblem{display:block;${COVER_POS[d.coverEmblem.pos]||COVER_POS['top-right']}`
         + `width:${d.coverEmblem.size}mm;height:${d.coverEmblem.size}mm;`
         + `background:url("${d.coverEmblem.src}") no-repeat center/contain;opacity:${d.coverEmblem.op};}`;
  }
  // interior · marca de agua (funciona en plantillas con .doc)
  if(d.docMark.src){
    css += `.doc-watermark{display:none;}`;
    // position:fixed → marca de agua en CADA página (impresión) y persistente en el visor
    css += `.doc::before{content:"";position:fixed;${DOC_POS[d.docMark.pos]||DOC_POS.center}`
         + `height:${d.docMark.size}mm;width:100%;background:url("${d.docMark.src}") no-repeat center/contain;`
         + `opacity:${d.docMark.op};z-index:0;pointer-events:none;}`;
  }
  // interior · logo de cabecera EN CADA PÁGINA. position:fixed → Chromium lo
  // repite en todas las páginas al imprimir (igual que la marca de agua). Va en
  // la banda del margen superior; se agranda @page margin-top para que el cuerpo
  // no lo pise. z-index:1 = sobre la marca de agua (0) pero DEBAJO de la portada
  // y los anexos (2, opacos) → no aparece en portada ni en las páginas de anexo.
  if(d.docLogo.src){
    // tabla envolvente con thead repetible (ver applyEditsAndTag). La celda del
    // thead lleva el logo + un aire inferior; la del cuerpo, el contenido normal.
    css += `.doc-runhead{width:100%;border-collapse:collapse;}`
         + `.doc-runhead>tbody>tr>td,.doc-runhead>thead>tr>td{padding:0;}`
         + `.doc-runhead>thead>tr>td{padding-bottom:6mm;}`
         + `.doc-runhead>thead{display:table-header-group;}`     // repite en cada página impresa
         + `.doc-brand-logo{display:block;height:${d.docLogo.size}mm;`
         + `background:url("${d.docLogo.src}") no-repeat ${d.docLogo.pos}/contain;opacity:${d.docLogo.op};}`;
  }
  return css;
}

/* eventos del panel (delegados). rebuild solo al subir/quitar imagen (cambia
   la estructura de la tarjeta); pos/tamaño/opacidad/escalares = solo re-render. */
function wireDesignPanel(){
  const panel=$('#designPanel'); if(!panel) return;
  const readout=(el,txt)=>{ const box=el.closest('.dctl,.drow'); const v=box&&box.querySelector('.v,.dval'); if(v) v.textContent=txt; };
  $('#coverColor').addEventListener('input',e=>{ DESIGN.coverColor=e.target.value; saveDesign(); render(); });
  $('#coverColorReset').addEventListener('click',()=>{ DESIGN.coverColor=''; saveDesign(); $('#coverColor').value=CURRENT.cover; render(); });
  $('#btnSaveDesign').addEventListener('click', saveSharedDesign);
  panel.addEventListener('change',e=>{
    const f=e.target.closest('[data-df]'); if(f && f.files[0]){ readImg(f.files[0], src=>{ DESIGN[f.dataset.df].src=src; saveDesign(); rebuildDesign(); render(); }); return; }
    const p=e.target.closest('[data-dp]'); if(p){ DESIGN[p.dataset.dp].pos=p.value; saveDesign(); render(); }
  });
  panel.addEventListener('input',e=>{
    const sz=e.target.closest('[data-dsize]'); if(sz){ DESIGN[sz.dataset.dsize].size=+sz.value; readout(sz, sz.value+(sz.dataset.unit||'')); saveDesign(); render(); return; }
    const op=e.target.closest('[data-dop]'); if(op){ DESIGN[op.dataset.dop].op=+op.value/100; readout(op, op.value+'%'); saveDesign(); render(); return; }
    const sc=e.target.closest('[data-dscalar]'); if(sc){ DESIGN[sc.dataset.dscalar]=+sc.value/100; readout(sc, sc.value+'%'); saveDesign(); render(); }
  });
  panel.addEventListener('click',e=>{
    const c=e.target.closest('[data-dclear]'); if(c){ DESIGN[c.dataset.dclear].src=''; saveDesign(); rebuildDesign(); render(); }
  });
}

  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const base = page.getViewport({scale:1});
    const vp = page.getViewport({scale: Math.min(1400/base.width, 2)});
    const cv = document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
    await page.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise;
    out.push(cv.toDataURL('image/jpeg', .82));
  }
  return out;
}
function compressImage(file){
  return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(url); const s=Math.min(1400/img.naturalWidth,1);
      const cv=document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*s); cv.height=Math.round(img.naturalHeight*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); res([cv.toDataURL('image/jpeg',.82)]); };
    img.onerror=rej; img.src=url; });
}
async function fileToAnnexPages(file){
  if(file.type==='application/pdf' || /\.pdf$/i.test(file.name)){
    if(!window.pdfjsLib) throw new Error('pdf.js no cargó'); return await pdfToImages(file);
  }
  return await compressImage(file);
}

/* ============================================================
   EDICIÓN DEL TEXTO FIJO — el usuario reescribe cualquier PÁRRAFO de
   boilerplate (los que NO llevan {{marcador}}) directamente en la vista
   previa. Se guardan como "overrides" por plantilla + posición (data-eid)
   y se reaplican en cada render. Los párrafos con datos ({{...}}) se editan
   por campos, no aquí. ponytail: eid = ordinal del bloque; si algún día se
   reordena el .html de la plantilla, "Restaurar original" realinea.
   ============================================================ */
let OVERRIDES = loadOverrides();
let EDITING = false;
function loadOverrides(){ try{ return JSON.parse(localStorage.getItem('lawang_contract_overrides'))||{}; }catch(_){ return {}; } }
function saveOverrides(){ try{ localStorage.setItem('lawang_contract_overrides', JSON.stringify(OVERRIDES)); }catch(_){} }

/* etiqueta cada bloque de texto con data-eid, marca editables los que no
   tienen marcador y aplica los overrides guardados de la plantilla activa */
function applyEditsAndTag(html){
  const ov = OVERRIDES[CURRENT.slug] || {};
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('.doc p, .doc li').forEach((el,i)=>{
    el.setAttribute('data-eid', i);
    if(!/\{\{/.test(el.innerHTML)){
      el.setAttribute('data-editable','1');
      if(ov[i]!=null) el.innerHTML = ov[i];
    }
  });
  // Logo de cabecera EN CADA PÁGINA: se envuelve el cuerpo del .doc en una tabla
  // con <thead> repetible. Chromium (y todos los navegadores) repiten el thead de
  // una tabla en cada página impresa Y le reservan su espacio → cabecera en todas
  // las páginas sin pisar el texto. Queda dentro de .doc → NO sale en portada ni
  // anexos (van fuera). En pantalla se pinta una vez arriba (comportamiento normal).
  const docEl = DESIGN.docLogo.src ? doc.querySelector('.doc') : null;
  if(docEl && !docEl.querySelector('.doc-runhead')){
    const tbl = doc.createElement('table'); tbl.className='doc-runhead';
    tbl.innerHTML = '<thead><tr><td><div class="doc-brand-logo" aria-hidden="true"></div></td></tr></thead><tbody><tr><td class="doc-runbody"></td></tr></tbody>';
    const body = tbl.querySelector('.doc-runbody');
    while(docEl.firstChild) body.appendChild(docEl.firstChild);
    docEl.appendChild(tbl);
  }
  return doc.documentElement.outerHTML;
}

function editBtnIdle(){ const b=$('#btnEdit'); if(b){ b.textContent='✎ Editar texto'; b.classList.remove('editing'); } const r=$('#btnEditReset'); if(r) r.style.display='none'; }
function enterEdit(){
  const d=$('#pvFrame').contentDocument; if(!d) return;
  EDITING=true;
  d.querySelectorAll('[data-editable]').forEach(el=>{ el.contentEditable='true';
    el.style.outline='1px dashed rgba(72,91,55,.55)'; el.style.outlineOffset='2px'; });
  d.addEventListener('input', captureEdit, true);
  const b=$('#btnEdit'); b.textContent='✓ Hecho'; b.classList.add('editing');
  $('#btnEditReset').style.display='inline-flex';
  toast('Edición ON · reescribe los párrafos remarcados; los datos ({{…}}) se editan por campos');
}
function captureEdit(e){
  const el=e.target.closest('[data-eid][data-editable]'); if(!el) return;
  (OVERRIDES[CURRENT.slug] || (OVERRIDES[CURRENT.slug]={}))[el.getAttribute('data-eid')] = el.innerHTML;
  saveOverrides();
}
function exitEdit(){ EDITING=false; editBtnIdle(); render(); }
function toggleEdit(){ EDITING ? exitEdit() : enterEdit(); }
function resetOverrides(){
  if(!confirm('¿Restaurar el texto original de esta plantilla? Se pierden tus ediciones de texto (los campos y cláusulas no se tocan).')) return;
  delete OVERRIDES[CURRENT.slug]; saveOverrides(); EDITING=false; editBtnIdle(); render(); toast('Texto original restaurado');
}

/* ============================================================
   FORMULARIO
   ============================================================ */
function fieldHTML(f){
  const [key,labelObj,type,extra] = f;
  const label = L(labelObj);
  const def = pdef(key);
  if(type==='signature'){
    return `<div class="field" data-key="${key}">
      <label>${label}</label>
      <div class="sigpad-wrap" id="pad-${key}"><canvas></canvas><div class="ph">✍︎</div></div>
      <div class="sig-actions"><button type="button" class="link-btn" data-clear="${key}">Borrar</button></div>
    </div>`;
  }
  if(type==='select'){
    const opts=(extra||[]).map(o=>`<option ${o===def?'selected':''}>${o}</option>`).join('');
    return `<div class="field"><label>${label}</label><select name="${key}"><option value=""></option>${opts}</select></div>`;
  }
  if(type==='textarea'){
    return `<div class="field" style="grid-column:1/-1"><label>${label}</label><textarea name="${key}" rows="3">${def}</textarea></div>`;
  }
  if(type==='readonly'){
    // lo asigna el trigger de Supabase (guardarContrato() escribe .value) — nunca lo teclea el agente.
    return `<div class="field"><label>${label}</label>
      <input name="${key}" type="text" value="${def}" readonly style="background:var(--rl);color:var(--muted);cursor:not-allowed"></div>`;
  }
  const t = (type==='money'||type==='number') ? 'number' : (type==='date'?'date':'text');
  const step = type==='money' ? 'step="0.01"' : '';
  return `<div class="field"><label>${label}</label>
    <input name="${key}" type="${t}" ${step} value="${def}" autocomplete="off"></div>`;
}

function buildForm(){

    + (templateHTML.includes('<!--compradores-extra-->') ? buildCompradorPanel() : '');   // solo si la plantilla lo imprime
  let lastTier=null, idx=0;
  SECTIONS.forEach(s=>{
    idx++;

    if(s.special==='hitos'){

    const optional = s.optional ? `<div class="opt-toggle">${L({es:'añadir',en:'add',id:'tambah'})}<label class="switch"><input type="checkbox" data-opt="${s.id}"><span class="slider"></span></label></div>` : '';
    const cls = s.optional ? 'optional off' : '';
    const grid = ['comprador','sociedad','dinero','gestion','otros'].includes(s.id);

    const note = (s.id==='firmas' && TOKENS && TOKENS.bloqueado && TOKENS.bloqueado.length)
      ? `<div class="note-blocked"><b>Boilerplate bloqueado</b> — texto legal fijo en la plantilla, no editable aquí:
          <ul>${TOKENS.bloqueado.slice(0,6).map(x=>`<li>${x}</li>`).join('')}<li>…</li></ul></div>` : '';
    html += `<section class="section ${cls}" data-sec="${s.id}" data-tier="${s.tier}">

      <div class="body"><div class="${grid?'grid2':''}">${body}</div>${note}</div></section>`;
  });
  form.innerHTML = html;

  // hitos: delegación (una sola vez; el form persiste entre rebuilds)
  if(!form._hitosWired){ form._hitosWired = true;
    form.addEventListener('input', e=>{ const el=e.target.closest('[data-hkey]'); if(!el) return;
      const h=HITOS[+el.dataset.hi]; if(h){ h[el.dataset.hkey]=el.value; renderDebounced(); } });
    form.addEventListener('click', e=>{
      const del=e.target.closest('[data-hdel]');
      if(del){ HITOS.splice(+del.dataset.hdel,1); refreshHitos(); render(); return; }
      if(e.target.closest('#hitoAdd')){ HITOS.push({pct:'',monto:'',timing:'',es:'',en:'',id:''}); refreshHitos(); render(); }
    });
  }

  wireDesignPanel();
  wireAnnexPanel();
  wireClausePanel();
  wireCompradorPanel();
  wireAccordions();
  form.querySelectorAll('[data-opt]').forEach(chk=>{
    chk.addEventListener('change', ()=>{ const sec=form.querySelector(`[data-sec="${chk.dataset.opt}"]`);
      sec.classList.toggle('off', !chk.checked); if(chk.checked) ensurePads(sec); render(); });
  });
  form.querySelectorAll('[data-clear]').forEach(b=>b.addEventListener('click',()=>{ clearPad(b.dataset.clear); render(); }));
  form.querySelectorAll('input[name],textarea[name],select[name]').forEach(el=> el.addEventListener('input', renderDebounced));
  form.querySelectorAll('select[name]').forEach(el=> el.addEventListener('change', render));
  ensurePads(form);   // secciones visibles al arrancar
  updateSaveButton(); // muestra/oculta "Guardar en base de datos" según la plantilla
  render();
}

/* ---------- pad de firma ---------- */
function initPad(wrap){
  const key = wrap.id.replace('pad-','');
  const cv = wrap.querySelector('canvas');
  const ratio = window.devicePixelRatio||1;
  function resize(){ const r=cv.getBoundingClientRect(); cv.width=r.width*ratio; cv.height=r.height*ratio;
    const ctx=cv.getContext('2d'); ctx.scale(ratio,ratio); ctx.lineWidth=2; ctx.lineCap='round';
    ctx.strokeStyle='#104C4F'; pads[key]={cv,ctx,empty:true}; }
  resize();
  let drawing=false, last=null;
  const pos=e=>{ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; };
  const start=e=>{ drawing=true; last=pos(e); e.preventDefault(); };
  const move=e=>{ if(!drawing)return; const p=pos(e); const c=pads[key].ctx;
    c.beginPath(); c.moveTo(last.x,last.y); c.lineTo(p.x,p.y); c.stroke(); last=p;
    pads[key].empty=false; wrap.classList.add('signed'); e.preventDefault(); };
  const end=()=>{ if(drawing){ drawing=false; renderDebounced(); } };
  cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',end);
}
function clearPad(key){ const p=pads[key]; if(!p)return; p.ctx.clearRect(0,0,p.cv.width,p.cv.height);
  p.empty=true; document.getElementById('pad-'+key).classList.remove('signed'); }

/* ---------- recolección ---------- */
function activeKeys(){
  const keys=[];
  SECTIONS.forEach(s=>{ const sec=$(`[data-sec="${s.id}"]`);
    if(s.optional && sec && sec.classList.contains('off')) return;
    s.fields.forEach(f=>keys.push(f[0])); });
  return keys;
}
function collect(){
  const data={};
  activeKeys().forEach(k=>{ const pad=pads[k];
    if(pad){ data[k]= pad.empty ? '' : pad.cv.toDataURL('image/png'); return; }
    const el=$(`[name="${k}"]`); data[k]= el ? el.value.trim() : ''; });
  return data;
}

/* ---------- merge cliente ---------- */
function esc(v,k){ if(k && k.startsWith('firma')) return v; return v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function injectBrandAndCover(html, data){
  // Título de portada: un renglón por idioma (ES/EN/ID), usa el nombre completo
  // de la plantilla en cada idioma — no el toggle activo (la portada ya no
  // cambia de idioma con el toggle, muestra los 3 siempre).
  const covData = { ...data, cov_t_es:CURRENT.name.es, cov_t_en:CURRENT.name.en||CURRENT.name.es, cov_t_id:CURRENT.name.id||CURRENT.name.es };
  const cov = COVER_HTML.replace(/\{\{([a-z0-9_]+)\}\}/g,(m,k)=> (k in covData && covData[k]!=='') ? esc(covData[k],k) : '');
  // <base> = directorio de app.html → los recursos relativos (css/imgs/fuentes)
  // resuelven en cualquier contexto de impresión (iframe srcdoc, ventana o blob).
  const base = location.href.replace(/[^/]*(?:\?.*)?$/,'');
  const v='?v='+Date.now();   // cache-buster: los CSS cambian con el deploy → nunca servir cacheados
  const head = `<base href="${base}">`
    + `<link rel="stylesheet" href="assets/brand.css${v}">`
    + `<link rel="stylesheet" href="assets/contract.css${v}">`
    + `<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">`
    + `<style>${langCSS()}</style>`
    // Impresión/PDF: A4 con márgenes en TODAS las páginas (@page, no el padding del .doc,
    // que no se repite por página) + portada a sangre (página nombrada 'cover') +
    // forzar colores/fondos/imágenes de fondo (print-color-adjust:exact; el navegador
    // no imprime backgrounds por defecto → sin esto se pierden color de portada, cabecera
    // de tabla, marca de agua e isotipos). Sobreescribe el @page{margin:0} de la plantilla.
    + `<style>`
    + `*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}`
    + `@page{size:A4;margin:18mm}`
    + `@page cover{margin:0}`
    // z-index:2 → la portada (opaca, página completa) tapa la marca de agua fija
    // del interior (z-index:0), que si no se pintaría también sobre la portada.
    + `.lwcov{page:cover;position:relative;z-index:2}`
    + `@media print{.doc{padding:0!important;overflow:visible!important}}`
    // Anexos: cada página a sangre (A4 completo), no editables. z-index sobre la marca de agua fija.
    + `.annex-cover,.annex-page{page:cover;page-break-before:always;width:210mm;height:297mm;position:relative;z-index:2;box-sizing:border-box;overflow:hidden}`
    + `.annex-cover{background:var(--brand-deep,#104C4F);color:var(--brand-paper,#F5F0E6);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}`
    + `.annex-cover .annex-label{font-size:13pt;letter-spacing:.3em;text-transform:uppercase;opacity:.85}`
    + `.annex-cover .annex-name{font-size:24pt;font-weight:700;margin-top:10px;padding:0 24mm;font-family:var(--font-display,'Jost',sans-serif)}`
    + `.annex-page{background:#fff;display:flex;align-items:center;justify-content:center}`
    + `.annex-page img{max-width:100%;max-height:100%;display:block}`
    + `</style>`;
  if(html.includes('</head>')) html = html.replace('</head>', head+'</head>');
  else html = '<head>'+head+'</head>'+html;
  // (el logo de cabecera interior se inyecta en applyEditsAndTag envolviendo el
  //  cuerpo en una tabla con <thead> repetible → sale en cada página impresa)
  // El CSS de diseño va DESPUÉS de la portada: _portada.html lleva su <style> inline
  // en el body; para ganar el desempate de especificidad debe ir más abajo en el documento
  // (también gana a contract.css del <head> para las reglas del interior).
  const design = `${cov}<style>${designStyle()}</style>`;
  if(/<body[^>]*>/.test(html)) html = html.replace(/<body([^>]*)>/, `<body$1>${design}`);
  else html = design + html;
  return html;
}
function buildDoc(){
  const data=collect();
  let html=injectBrandAndCover(applyEditsAndTag(templateHTML), data);
  html=html.replace('<!--hitos-->', hitosRowsHTML());   // tabla de pagos dinámica
  html=html.replace('<!--compradores-extra-->', compradoresExtraHTML());   // Adquiriente II, III, IV… sin tope
  html=html.replace('<!--extra-clauses-->', clausesHTML());   // cláusulas adicionales propias
  // dimensionar cada hueco según su tipo de dato (añade .f-xs/sm/md/lg)
  html=html.replace(/<span class="f">(\{\{([a-z0-9_]+)\}\})<\/span>/g,(m,mk,k)=>`<span class="f ${sizeClass(k)}">${mk}</span>`);
  html=html.replace(/<!--opt:([a-z0-9_]+)-->[\s\S]*?<!--\/opt:\1-->/g,(m,k)=> (k in data && data[k]!=='') ? m : '');
  html=html.replace(/\{\{([a-z0-9_]+)\}\}/g,(m,k)=>{ const filled=(k in data && data[k]!=='');
    if(k.startsWith('firma')) return filled ? data[k] : '';
    return filled ? esc(data[k],k) : '';   // vacío = en blanco (writable a mano), sin "—"
  });
  // anexos incluidos → páginas al final del contrato
  const ax=annexHTML();
  if(ax) html = html.includes('</body>') ? html.replace('</body>', ax+'</body>') : html+ax;
  return html;
}
/* re-render de la preview viva (siempre visible). En modo edición NO se
   re-renderiza: reconstruir el srcdoc borraría lo que el usuario escribe. */
function render(){ if(EDITING) return; $('#pvFrame').srcdoc = buildDoc(); }
let _rt=null; function renderDebounced(){ if(EDITING) return; clearTimeout(_rt); _rt=setTimeout(render, 260); }

/* ---------- secciones del formulario = SOLO campos con impacto ----------
   Un campo se muestra únicamente si su marcador {{...}} aparece en la plantilla
   activa o en la portada. Lo que no imprime nada, no se pregunta. Los marcadores
   sin campo en tokens.json caen en el grupo automático "otros". */
function deriveSections(){
  const src = (TOKENS && TOKENS.sections && TOKENS.sections.length) ? TOKENS.sections : FALLBACK_SECTIONS;
  const inDoc = new Set([...(templateHTML+COVER_HTML).matchAll(/\{\{([a-z0-9_]+)\}\}/g)].map(m=>m[1]));
  inDoc.delete('cov_t_es'); inDoc.delete('cov_t_en'); inDoc.delete('cov_t_id');   // los calcula el motor, no son campos
  inDoc.delete('firma_adquiriente');   // línea en blanco a propósito para firma física — nunca un campo del form
  SECTIONS = src.map(s=>({ ...s, fields: s.fields.filter(f=>inDoc.has(f[0])) }))
                .filter(s=>s.fields.length);
  const known = new Set(SECTIONS.flatMap(s=>s.fields.map(f=>f[0])));
  const missing = [...inDoc].filter(k=>!known.has(k));
  if(missing.length){
    let ins = SECTIONS.map(s=>s.tier).lastIndexOf('siempre');
    ins = ins<0 ? SECTIONS.length : ins+1;
    SECTIONS.splice(ins, 0,
      { id:'otros', tier:'siempre', title:{es:'Otros campos (de esta plantilla)',en:'Other fields',id:'Lainnya'},
        fields:missing.map(k=>[k,{es:humanize(k)},'text']) });
  }
  // tabla de pagos dinámica: si la plantilla trae <!--hitos-->, sección especial
  // con lista añadir/quitar (el nº de hitos varía por contrato: 3, 4, 7…)
  if(templateHTML.includes('<!--hitos-->')){
    // justo DESPUÉS de "Gestión del contrato" (va primera a propósito), no antes
    let ins = SECTIONS.findIndex(s=>s.tier==='gestion');
    ins = ins<0 ? SECTIONS.length : ins+1;
    SECTIONS.splice(ins, 0, { id:'pagos', tier:'por_proyecto', special:'hitos',
      title:{es:'Calendario de pagos (hitos)',en:'Payment schedule (milestones)',id:'Jadwal pembayaran (tahapan)'}, fields:[] });
    HITOS = ((TOKENS && TOKENS.hitosDefaults && TOKENS.hitosDefaults[CURRENT.slug]) ||
      [{pct:'25',monto:'',timing:'',es:'',en:'',id:''},{pct:'25',monto:'',timing:'',es:'',en:'',id:''},
       {pct:'25',monto:'',timing:'',es:'',en:'',id:''},{pct:'25',monto:'',timing:'',es:'',en:'',id:''}])
      .map(h=>({...h}));
  }
}

/* Imprime el VISOR: lo reconstruye fresco y espera a que TERMINE de cargar
   (carga + fuentes + imágenes) antes de abrir el diálogo → evita el PDF dañado
   por imprimir a mitad de recarga. Nonce para forzar el evento load aunque el
   contenido sea idéntico. */
let _printNonce=0;
function printPreview(){
  const fr=$('#pvFrame');
  fr.addEventListener('load', function h(){
    fr.removeEventListener('load', h);
    const w=fr.contentWindow, d=fr.contentDocument;
    const imgs=[...d.images].filter(i=>!i.complete).map(i=>new Promise(r=>{ i.onload=i.onerror=r; }));
    const fonts=(d.fonts && d.fonts.ready) ? d.fonts.ready : Promise.resolve();
    Promise.all([fonts, ...imgs]).then(()=> setTimeout(()=>{ try{ w.focus(); w.print(); }catch(_){} }, 200));
  }, {once:true});
  fr.srcdoc = buildDoc() + '<!--p'+(++_printNonce)+'-->';
}
/* El guardado en registro va por Supabase (guardarContrato(), botón aparte);
   este botón solo abre el diálogo de impresión del navegador — "Descargar PDF"
   es el nombre de la acción para el agente, no una descarga automática real. */
async function downloadPdf(){ printPreview(); }

/* ============================================================
   SUPABASE — guardado + numeración automática, y bloqueo tras firma
   ============================================================ */
let LOCKED = false, LOCKED_PDF_PATH = null;   // true una vez subido el PDF firmado (columna `bloqueado`)
let CAN_EDIT_TEXT = false;                    // rol admin (ver init()) — independiente del bloqueo

function updateSaveButton(){
  const btn=$('#btnSave'); if(!btn) return;
  const tipo = CONTRACT_TIPO[CURRENT.slug];
  const form=$('#form'); if(form) form.classList.toggle('locked', LOCKED);
  const badge=$('#lockBadge'); if(badge) badge.style.display = LOCKED ? 'inline-flex' : 'none';
  const dlBtn=$('#btnDownloadSigned'); if(dlBtn) dlBtn.style.display = (LOCKED && LOCKED_PDF_PATH) ? '' : 'none';
  const editBtn=$('#btnEdit'); if(editBtn) editBtn.style.display = (CAN_EDIT_TEXT && !LOCKED) ? '' : 'none';
  if(LOCKED){ const r=$('#btnEditReset'); if(r) r.style.display='none'; }

  const lockBtn=$('#btnLockUpload');
  if(!tipo){ btn.style.display='none'; if(lockBtn) lockBtn.style.display='none'; return; }
  btn.style.display = LOCKED ? 'none' : '';
  if(lockBtn) lockBtn.style.display = (SAVED_CONTRACT && !LOCKED) ? '' : 'none';
  btn.textContent = SAVED_CONTRACT ? ('Actualizar (' + SAVED_CONTRACT.numero + ')') : 'Guardar en base de datos';
}

async function subirPdfFirmado(file){
  if(!sb || !SAVED_CONTRACT){ toast('Guarda el contrato antes de subir el firmado'); return; }
  if(file.type!=='application/pdf'){ toast('El archivo debe ser un PDF'); return; }
  const btn=$('#btnLockUpload'); btn.disabled=true; btn.textContent='Subiendo…';
  try{
    const path = SAVED_CONTRACT.numero + '.pdf';
    const { error: upErr } = await sb.storage.from('contratos-firmados').upload(path, file, { upsert:true, contentType:'application/pdf' });
    if(upErr) throw upErr;
    const { error: updErr } = await sb.from('contratos').update({ bloqueado:true, pdf_firmado_path:path }).eq('id', SAVED_CONTRACT.id);
    if(updErr) throw updErr;   // si esto falla, el PDF ya subió pero el contrato sigue editable — se puede reintentar sin duplicar (upsert)
    LOCKED = true; LOCKED_PDF_PATH = path;
    toast('Contrato bloqueado · PDF firmado guardado');
    updateSaveButton();
  }catch(err){ toast('No se pudo bloquear: ' + (err.message || err)); }
  btn.disabled=false; btn.textContent='🔒 Subir firmado';
}
$('#btnLockUpload').addEventListener('click', ()=> $('#lockFileInput').click());
$('#lockFileInput').addEventListener('change', e=>{
  const f=e.target.files[0]; e.target.value='';
  if(f) subirPdfFirmado(f);
});
$('#btnDownloadSigned').addEventListener('click', async ()=>{
  if(!sb || !LOCKED_PDF_PATH) return;
  const { data, error } = await sb.storage.from('contratos-firmados').createSignedUrl(LOCKED_PDF_PATH, 300);
  if(error || !data){ toast('No se pudo generar el enlace de descarga'); return; }
  window.open(data.signedUrl, '_blank');
});

function contractPayload(){
  const data = collect();
  return {
    tipo: CONTRACT_TIPO[CURRENT.slug],
    comprador_nombre: data.adq1_nombre || data.partner_nombre || data.colaborador_nombre || null,
    proyecto_nombre: data.proyecto_nombre || null,
    precio_total: data.precio_total ? Number(String(data.precio_total).replace(/[^\d.-]/g,'')) || null : null,
    moneda: data.moneda || null,
    fecha_firma: data.fecha_firma || null,
    // "toda la información": campos del form + hitos + diseño/anexos/cláusulas +
    // ediciones de texto fijo de ESTA plantilla. Recargable 1:1 desde el panel.
    datos: { fields: data, hitos: HITOS, design: DESIGN, annexes: ANNEXES, clauses: CLAUSES,
              compradores: COMPRADORES, overrides: (OVERRIDES && OVERRIDES[CURRENT.slug]) || {} }
  };
}

async function guardarContrato(){
  if(!sb){ toast('Supabase no disponible'); return; }
  if(LOCKED){ toast('Contrato bloqueado, no se puede guardar'); return; }   // el botón ya se oculta; la RLS también lo bloquearía
  const tipo = CONTRACT_TIPO[CURRENT.slug];
  if(!tipo) return;
  const btn=$('#btnSave'); btn.disabled=true; btn.textContent='Guardando…';
  try{
    const payload = contractPayload();
    const q = (SAVED_CONTRACT && SAVED_CONTRACT.id)
      ? sb.from('contratos').update(payload).eq('id', SAVED_CONTRACT.id).select('id,numero').single()
      : sb.from('contratos').insert(payload).select('id,numero').single();
    const { data, error } = await q;
    if(error) throw error;
    SAVED_CONTRACT = { id:data.id, numero:data.numero };
    const numEl = document.querySelector('[name="contrato_num"]');
    if(numEl){ numEl.value = data.numero; }
    toast((SAVED_CONTRACT ? 'Guardado como ' : '') + data.numero);
    render();
  }catch(err){ toast('No se pudo guardar: ' + (err.message || err)); }
  btn.disabled=false; updateSaveButton();
}
$('#btnSave').addEventListener('click', guardarContrato);

/* ---------- panel "Contratos guardados" ---------- */
async function openContractsPanel(){
  $('#cpOverlay').classList.add('open');
  $('#cpSearch').value = '';
  const list=$('#cpList'); list.innerHTML = 'Cargando…';
  if(!sb){ list.innerHTML='Supabase no disponible.'; return; }
  const { data, error } = await sb.from('contratos')
    .select('id,tipo,numero,comprador_nombre,proyecto_nombre,precio_total,moneda,fecha_firma,created_at,bloqueado')
    .in('tipo', Object.values(CONTRACT_TIPO)).order('created_at', { ascending:false }).limit(300);
  if(error){ list.innerHTML='No se pudo cargar la lista.'; return; }
  CP_ROWS = data || [];
  renderCpList(CP_ROWS);
}
function cpTipoLabel(t){ return TIPO_LABEL[t] || t; }
function renderCpList(rows){
  const list=$('#cpList');
  if(!rows.length){ list.innerHTML='<p class="cp-empty">Sin contratos guardados.</p>'; return; }
  list.innerHTML = rows.map(r=>`
    <div class="cp-row" data-id="${r.id}">
      <span class="cp-num" data-l="Nº" title="${r.bloqueado?'Bloqueado — PDF firmado ya subido':''}">${r.bloqueado?'🔒 Bloqueado · ':''}${r.numero||'—'}</span>
      <span data-l="Tipo">${cpTipoLabel(r.tipo)}</span>
      <span data-l="Comprador">${escAttr(r.comprador_nombre||'—')}</span>
      <span data-l="Proyecto">${escAttr(r.proyecto_nombre||'—')}</span>
      <span data-l="Precio">${r.precio_total ? Number(r.precio_total).toLocaleString('es') : '—'} ${r.moneda||''}</span>
      <span data-l="Fecha">${r.fecha_firma||''}</span>
    </div>`).join('');
}
$('#cpSearch').addEventListener('input', e=>{
  const q=e.target.value.toLowerCase();
  renderCpList(!q ? CP_ROWS : CP_ROWS.filter(r=>
    [r.numero,r.comprador_nombre,r.proyecto_nombre].some(v=>(v||'').toLowerCase().includes(q))));
});
$('#cpList').addEventListener('click', async e=>{
  const row=e.target.closest('.cp-row'); if(!row) return;
  $('#cpOverlay').classList.remove('open');
  await openSavedContract(row.dataset.id);
});
$('#btnContracts').addEventListener('click', openContractsPanel);
$('#cpClose').addEventListener('click', ()=> $('#cpOverlay').classList.remove('open'));

/* rellena el form ya construido con los valores guardados (inverso de collect()) */
function populateForm(fields){
  Object.entries(fields || {}).forEach(([k,v])=>{
    if(v===null || v===undefined || v==='') return;
    const el=document.querySelector(`[name="${k}"]`);
    if(el){ el.value=v; return; }
    if(k.startsWith('firma') && pads[k]){
      const p=pads[k], img=new Image();
      img.onload=()=>{ p.ctx.clearRect(0,0,p.cv.width,p.cv.height); p.ctx.drawImage(img,0,0,p.cv.width,p.cv.height);
        p.empty=false; const wrap=document.getElementById('pad-'+k); if(wrap) wrap.classList.add('signed'); };
      img.src=v;
    }
  });
  // reactiva secciones opcionales (ej. sociedad) si traían datos
  document.querySelectorAll('[data-opt]').forEach(chk=>{
    const sec=document.querySelector(`[data-sec="${chk.dataset.opt}"]`); if(!sec) return;
    const hasData=[...sec.querySelectorAll('[name]')].some(i=>fields[i.name]);
    if(hasData){ chk.checked=true; sec.classList.remove('off'); ensurePads(sec); }
  });
}

async function openSavedContract(id){
  if(!sb) return;
  const { data, error } = await sb.from('contratos').select('*').eq('id', id).single();
  if(error || !data){ toast('No se pudo abrir el contrato'); return; }
  const slug = TIPO_SLUG[data.tipo]; if(!slug){ toast('Tipo de contrato desconocido'); return; }
  await loadTemplate(slug);
  $('#tplPick').value = slug;
  buildForm();
  const d = data.datos || {};
  if(d.design){ DESIGN = d.design; saveDesign(); }
  if(d.annexes){ ANNEXES = d.annexes; saveAnnexes(); }
  if(d.clauses){ CLAUSES = d.clauses; saveClauses(); }
  if(d.compradores){ COMPRADORES = d.compradores.map(c=>({...c})); saveCompradores(); rebuildComprador(); }
  populateForm(d.fields || {});
  HITOS = Array.isArray(d.hitos) ? d.hitos.map(h=>({...h})) : HITOS;
  SAVED_CONTRACT = { id:data.id, numero:data.numero };
  LOCKED = !!data.bloqueado; LOCKED_PDF_PATH = data.pdf_firmado_path || null;
  refreshHitos(); updateSaveButton(); render();
  toast('Contrato ' + data.numero + ' cargado' + (LOCKED ? ' · bloqueado (firmado)' : ''));
}

/* ============================================================
   EMAIL — manda por api/send_email.php (PHP standalone, sin MySQL,
   remitente fijo) el HTML de la vista previa (buildDoc()); el servidor
   lo renderiza a PDF con contracts-pdf-service (Puppeteer/Chromium real
   en Railway). El adjunto manual sigue disponible como respaldo (plegado
   en el modal) por si el servicio no está desplegado/configurado todavía.
   ponytail: se probó generar el PDF en el propio navegador con html2pdf.js/
   html2canvas y con html-to-image — ambas fallan con este documento
   (color-mix() de brand.css una, CORS de Google Fonts la otra). Limitación
   real de esas librerías con CSS moderno, no arreglable parcheando; de ahí
   el salto a un navegador real en servidor. */
function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onloadend=()=> resolve(String(reader.result).split(',')[1]);
    reader.onerror=reject;
    reader.readAsDataURL(blob);
  });
}
function openEmailModal(){
  const numero = SAVED_CONTRACT ? SAVED_CONTRACT.numero : null;
  $('#emFile').value = '';
  $('#emSubject').value = (numero ? `Contrato ${numero}` : `Contrato — ${L(CURRENT.name)}`) + ' — Lawang Tropical Properties';
  $('#emMessage').value = `Buenos días,\n\nAdjunto el documento${numero ? ' ('+numero+')' : ''} para su revisión.\n\nUn saludo,\nLawang Tropical Properties`;
  $('#emOverlay').classList.add('open');
}
$('#btnEmail').addEventListener('click', openEmailModal);
$('#emClose').addEventListener('click', ()=> $('#emOverlay').classList.remove('open'));

async function enviarEmail(){
  const to=$('#emTo').value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)){ toast('Email de destinatario no válido'); return; }
  const file=$('#emFile').files[0];
  if(file && file.type!=='application/pdf'){ toast('El archivo debe ser un PDF'); return; }
  // 100MB por petición explícita — ojo: la mayoría de servidores de correo (Gmail
  // incluido) rechazan adjuntos por encima de ~25MB pase lo que pase aquí; este
  // límite solo evita que el navegador intente subir algo absurdo.
  if(file && file.size > 100*1024*1024){ toast('El PDF supera los 100MB'); return; }
  const btn=$('#emSend'); btn.disabled=true; btn.textContent='Enviando…';
  try{
    // se manda siempre el HTML de la vista previa (el servidor lo renderiza con
    // el servicio Puppeteer); si además se adjuntó un PDF a mano, va también
    // como pdf_base64 — el servidor lo usa de respaldo si el render falla.
    const payload = { to, subject:$('#emSubject').value, message:$('#emMessage').value, filename:'contrato.pdf', html: buildDoc() };
    if(file){ payload.filename = file.name; payload.pdf_base64 = await blobToBase64(file); }
    const r = await fetch('api/send_email.php', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload) });
    const d = await r.json().catch(()=>({ ok:false, error:'Respuesta inválida del servidor' }));
    if(d.ok){ toast('Email enviado a ' + to); $('#emOverlay').classList.remove('open'); }
    else{ toast(d.error || 'No se pudo enviar'); }
  }catch(err){ toast('Error: ' + (err.message || err)); }
  btn.disabled=false; btn.textContent='Enviar';
}
$('#emSend').addEventListener('click', enviarEmail);

/* ---------- sesión (Supabase Auth) ----------
   La página en sí sigue siendo estática — lo que de verdad protege los datos
   es la política RLS de `contratos` (exige role authenticated, ver migración
   contratos_rls_requiere_authenticated). Este chequeo es solo para no dejar
   al agente mirando un formulario que no podrá guardar: sin sesión, redirige
   a login.html antes de montar nada. */
$('#btnLogout').addEventListener('click', async ()=>{
  if(!sb) return;
  await sb.auth.signOut();
  location.href='login.html';
});

/* ---------- init ---------- */
async function init(){
  if(!sb){ toast('Supabase no disponible'); return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.href='login.html'; return; }

  // "Editar texto" restaurado para todos los agentes (pedido explícito del
  // usuario, 20-jul — antes estaba limitado a role:"admin"). Se deja el
  // flag CAN_EDIT_TEXT en vez de borrar el mecanismo entero: si se quiere
  // volver a restringir más adelante basta con cambiar esta línea de nuevo
  // a `(session.user.user_metadata||{}).role === 'admin'`.
  CAN_EDIT_TEXT = true;

  const bust='?v='+Date.now();  // plantillas/tokens/portada son ficheros pequeños que cambian con el deploy → nunca servir cacheados
  try{ COVER_HTML = await fetch('templates/_portada.html'+bust).then(r=>r.text()); }catch(_){ COVER_HTML=''; }
  try{ TOKENS = await fetch('tokens.json'+bust).then(r=>r.json()); }catch(_){}  // deriveSections() filtra por plantilla
  // mapa marcador → tipo (para dimensionar el hueco de cada campo)
  ((TOKENS && TOKENS.sections) || []).forEach(s=> s.fields.forEach(f=> FIELDTYPE[f[0]] = f[2] || 'text'));
  await loadTemplate(CURRENT.slug);
  buildPicker(); buildLangToggle(); buildForm();
}
init();
</script>
