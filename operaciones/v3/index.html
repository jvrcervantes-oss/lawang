<style>
/* ═══════════════════════════════════════════════════════════════════════════
   OPERACIONES v3 — 26-ago-2026
   ═══════════════════════════════════════════════════════════════════════════
   QUÉ SE REDISEÑA, Y POR QUÉ. La herramienta viva enseña ochenta y ocho
   operaciones en una tabla de ocho columnas, todas con el mismo peso. Para
   contestar «¿qué está parado?» hay que LEER las ochenta y ocho. Y las tres
   columnas de dinero —precio, cobrado, pendiente— obligan a hacer la resta con
   la vista, fila por fila.

   Esta versión responde por orden de pregunta (§16.6: primero lo común, lo
   avanzado un nivel más abajo):

     1. ¿Cómo vamos?      una banda de dinero con su barra. Cuatro millones y
                          medio contratados y el 10 % cobrado se ve de un
                          vistazo, no se calcula.
     2. ¿Qué necesita algo HOY?  lo que está parado, ordenado por lo que cuesta
                          no hacerlo, y cada línea dice el VERBO. Esto no
                          existía: había que deducirlo.
     3. Todo lo demás     por etapa, en secciones plegables. «Cobro completo»
                          nace plegado: 31 operaciones que no piden nada no
                          pueden ocupar el mismo sitio que las que sí.

   Y la fila cuenta su estado en vez de listarlo: el comprador manda, y las tres
   columnas de dinero se sustituyen por UNA barra de pago con el pendiente al
   lado. La resta ya está hecha.

   El detalle abre en el cajón compartido, que se arrastra para cerrar.
   ═══════════════════════════════════════════════════════════════════════════ */

      font-family:var(--sans,'Jost',system-ui,sans-serif); }
main{ max-width:1180px; margin:0 auto; padding:24px 24px 80px; }

/* ── banda de dinero ─────────────────────────────────────────────────────── */
.dinero{
  background:var(--sup-1,#fff); border:1px solid var(--linea,#E4DCCB);
  border-radius:var(--r-l,18px); box-shadow:var(--sombra-1); padding:20px 22px; margin:0 0 22px;
}
.dinero .cifras{ display:flex; gap:34px; flex-wrap:wrap; align-items:flex-end; }
.dinero .c .rot{ display:block; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
                 font-weight:600; color:var(--texto-2,#4A5052); margin-bottom:4px; }
.dinero .c .n{ font-family:'Instrument Sans',system-ui,sans-serif; font-weight:700;
               font-size:1.62rem; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums;
               color:var(--dl,#104C4F); }
.dinero .c.pend .n{ color:#8C5E10; }
.dinero .c small{ display:block; margin-top:5px; font-size:.74rem; color:var(--texto-2,#4A5052); }
/* La barra es la frase «va por aquí» dicha en un objeto en vez de en un
   porcentaje: §16.7, el mapeo tiene que ser evidente sin leer una etiqueta. */
.barraTot{ margin-top:16px; height:9px; border-radius:999px; background:#EAE4D3; overflow:hidden; }
.barraTot i{ display:block; height:100%; border-radius:999px; background:var(--tg,#485B37); width:0; }

/* ── lo que necesita algo ────────────────────────────────────────────────── */
.urge{ background:var(--sup-1,#fff); border:1px solid #DDA85A; border-radius:var(--r-l,18px);
       box-shadow:var(--sombra-1); padding:6px 4px; margin:0 0 22px; }
.urge h2{ margin:0; padding:14px 18px 8px; font-size:.9rem; font-weight:600; letter-spacing:-.01em; }
.urge h2 span{ font-weight:400; color:var(--texto-2,#4A5052); }
.urgeFila{
  display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:14px;

}

/* ── controles ───────────────────────────────────────────────────────────── */

/* ── secciones por etapa ─────────────────────────────────────────────────── */

.etapa > summary{
  list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px;
  padding:10px 4px; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; font-weight:600;

}

        border-radius:var(--r-l,18px); box-shadow:var(--sombra-1); overflow:hidden; }

/* LA FILA. Tres zonas y una jerarquía clara: quién (manda), cómo va (la barra),
   cuánto falta (la cifra). El número de contrato y el tipo bajan a segundo

.op{
  display:grid; grid-template-columns:minmax(0,1fr) 210px 130px 20px;

}
.op:first-child{ border-top:none; }

.op .quien{ font-size:.92rem; font-weight:600; letter-spacing:-.008em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.op .donde{ display:block; margin-top:3px; font-size:.76rem; color:var(--texto-2,#4A5052);
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.op .pago{ min-width:0; }
.op .pago .b{ height:7px; border-radius:999px; background:#EAE4D3; overflow:hidden; }
.op .pago .b i{ display:block; height:100%; border-radius:999px; background:var(--tg,#485B37); }
.op .pago .t{ display:block; margin-top:5px; font-size:.72rem; color:var(--texto-2,#4A5052); font-variant-numeric:tabular-nums; }
.op .falta{ text-align:right; font-variant-numeric:tabular-nums; font-size:.86rem; font-weight:600; }

.op .aviso{ display:inline-block; margin-left:8px; font-size:.66rem; font-weight:600; letter-spacing:.06em;
            text-transform:uppercase; color:#9E2F26; background:#FBF0EF; border:1px solid #E2B3AE;
            border-radius:999px; padding:2px 7px; vertical-align:1px; }

.vacio{ padding:26px 18px; color:var(--texto-2,#4A5052); font-size:.86rem; }

/* ── cajón de detalle ────────────────────────────────────────────────────── */
#cajon .cuerpo{ overflow:auto; padding:0 20px 24px; }
#cajon h3{ margin:0; font-size:1.02rem; letter-spacing:-.012em; }
#cajon .sub{ font-size:.78rem; color:var(--texto-2,#4A5052); margin-top:3px; }

.dato{ display:flex; justify-content:space-between; gap:12px; padding:9px 0;
       border-top:1px solid var(--linea,#E4DCCB); font-size:.85rem; }
.dato:first-of-type{ border-top:none; }
.dato .v{ font-weight:600; font-variant-numeric:tabular-nums; }
.mini{ font-size:.78rem; color:var(--texto-2,#4A5052); line-height:1.5; }

@media (max-width:820px){
  main{ padding:20px 14px 60px; }
  .op{ grid-template-columns:minmax(0,1fr) 110px; gap:12px; }
  .op .pago{ grid-column:1; }
  .op .falta{ text-align:left; }
  .op .ir{ display:none; }
}

<script>
/* TODO EL GUION VA DENTRO DE SU PROPIO ÁMBITO. La cáscara compartida
   —suite.js, suite-comun.js, visor.js, topbar.js— declara bastantes nombres en
   el global, y un `let FILTRO` aquí arriba chocaba con uno de los suyos: la
   página entera moría en «Identifier 'FILTRO' has already been declared» y se
   quedaba en blanco sin decir nada en pantalla. Encerrarlo es más barato que ir
   comprobando nombre por nombre cada vez que se añade una variable. */
(function(){
'use strict';

/* ═══════════════════════════════════════════════════════════════════════════
   OPERACIONES v3 · lógica de PANTALLA
   ═══════════════════════════════════════════════════════════════════════════
   Aquí no se calcula dinero ni se consulta la base: eso vive en
   `operaciones-cuentas.js` y lo comparte con la herramienta viva. Lo de este
   fichero es qué se enseña, en qué orden y con qué jerarquía — que es lo único
   que un rediseño debería cambiar.
   ═══════════════════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
let SB = null, OPS = [], EQUIPO = {}, FILTRO = '', PROY = '';

const dinero = (n, m) => lwFormatoImporte(n || 0, m || 'EUR');
const dias = f => Math.round((new Date(f) - Date.now()) / 86400000);
const hace = f => { const d = -dias(f); return d <= 0 ? 'hoy' : d === 1 ? 'ayer' : 'hace ' + d + ' días'; };

/* ── 1 · LA BANDA DE DINERO ────────────────────────────────────────────────
   Los mismos tres números que ya daba el resumen, pero con la proporción
   dicha en una barra. `cuentaGrupo` y no `cuenta`: dos contratos vinculados
   —parcela y construcción del mismo comprador— son UNA venta, y sumarlos por
   separado duplicaba el precio (el caso de los 328.000 € por una villa de
   164.000 que está anotado en el asset compartido). Se cuenta cada grupo una
   sola vez, por su contrato raíz. */
function pintarDinero(){
  /* SOLO LO FIRMADO — decisión del owner, 26-ago-2026: «no sumes valores hasta
     que no estén firmados».
     Un contrato sin firmar es un precio pactado de palabra: puede cambiar, puede
     caerse, y meterlo en «contratado» infla una cifra que se usa para decidir.
     Esto también resuelve la pregunta que quedaba abierta —qué es «contratado»—
     y de paso hace que el número deje de depender de si se cuenta el grupo o
     solo la raíz: lo que no está firmado no entra, venga de donde venga.
     Las que faltan NO desaparecen de la pantalla: siguen en su etapa, con su
     precio en la fila. Lo que no hacen es sumar arriba. */
  const raices = OPS.filter(o => !o.padre);
  const firmadas = raices.filter(o => {
    /* Un grupo cuenta si su contrato principal está firmado. Los hijos de un
       padre firmado (la construcción que cuelga de su parcela) entran con él:
       es una sola venta y `cuentaGrupo` ya la cuenta una vez. */
    return o.bloqueado;
  });
  /* POR MONEDA. Sumar euros con dólares en una cifra y etiquetarla con la
     moneda de la última operación leída es un total que no existe — es el
     fallo que la auditoría del 19-ago-2026 encontró en Facturas, y que aquí
     volví a escribir. El ayudante vive en dinero.js. */
  const cuentas = firmadas.map(o => cuentaGrupo(o));
  const precioM  = lwSumaPorMoneda(cuentas, c => c.precio || 0, c => c.moneda);
  const cobradoM = lwSumaPorMoneda(cuentas, c => c.facturado || 0, c => c.moneda);
  const pendM = {};
  Object.keys(precioM).forEach(m => { pendM[m] = Math.max(0, precioM[m] - (cobradoM[m] || 0)); });
  const sinFirmar = raices.filter(o => !o.bloqueado).map(o => cuentaGrupo(o));
  const cobradoSinFirmarM = lwSumaPorMoneda(sinFirmar, c => c.facturado || 0, c => c.moneda);
  const hayAlgo = Object.values(cobradoSinFirmarM).some(v => v > 0.005);
  const cobradoSinFirmar = hayAlgo ? lwSumaTexto(cobradoSinFirmarM) : '';
  const mp = lwMonedaPrincipal(precioM);
  const pct = precioM[mp] ? Math.min(100, (cobradoM[mp] || 0) / precioM[mp] * 100) : 0;
  const varias = Object.keys(precioM).length > 1;
  $('#dinero').innerHTML =
    '<div class="cifras">'
    + '<div class="c"><span class="rot">Contratado</span><span class="n">' + esc(lwSumaTexto(precioM)) + '</span>'
      + '<small>' + firmadas.length + ' operaciones firmadas'
      + (raices.length > firmadas.length ? ' · ' + (raices.length - firmadas.length) + ' sin firmar, fuera' : '')
      + '</small></div>'
    + '<div class="c"><span class="rot">Cobrado</span><span class="n">' + esc(lwSumaTexto(cobradoM)) + '</span>'
      + '<small>' + pct.toFixed(1).replace('.', ',') + ' % del contratado' + (varias ? ' en ' + mp : '') + '</small></div>'
    + '<div class="c pend"><span class="rot">Pendiente</span><span class="n">' + esc(lwSumaTexto(pendM)) + '</span>'
      + '<small>por entrar</small></div>'
    + '</div><div class="barraTot"><i style="width:' + pct.toFixed(2) + '%"></i></div>'
    /* La nota explica la regla en la propia pantalla. Un total que excluye cosas
       sin decirlo es peor que uno inflado: el inflado se discute, el silencioso
       se cree. */
    + '<p class="mini" style="margin:12px 0 0">Solo cuenta lo <b>firmado</b>. Un contrato'
    + ' sin firmar es un precio de palabra, así que no suma aquí — sigue abajo, en su etapa,'
    + ' con su importe.'
    /* PERO EL DINERO QUE YA ENTRÓ SE DICE IGUAL. Las tres cifras de arriba
       describen la cartera firmada, que es lo pedido y es una base coherente.
       El problema es que dejar fuera lo no firmado también deja fuera las
       señales y reservas YA COBRADAS de esos contratos: dinero real, en la
       cuenta. Excluirlo sin decirlo sería el mismo pecado que inflar el total,
       solo que hacia el otro lado. Se dice en una línea. */
    + (cobradoSinFirmar
        ? ' Aparte, ya han entrado <b>' + esc(cobradoSinFirmar) + '</b> de operaciones'
          + ' todavía sin firmar (señales y reservas), que no se cuentan arriba.'
        : '')
    + '</p>';
  $('#dinero').hidden = false;
}

/* ── 2 · LO QUE NECESITA ALGO ──────────────────────────────────────────────
   El corazón del rediseño. La herramienta viva tiene todos estos datos y no
   los cruza: hay que ir operación por operación a descubrirlo.

   El ORDEN es el del coste de no hacerlo, no el de la fecha:
     1. cadena de firma parada — deja un contrato firmado a medias y EDITABLE,
        o sea que el texto ya firmado se puede cambiar. Es lo único aquí que
        puede costar el contrato entero.
     2. enlace de firma caducado — el comprador quiso firmar y no pudo.
     3. dinero vencido sin cobrar.
     4. firmado sin precio fijado — no se sabe cuánto se debe.
     5. falta la ficha del comprador — bloquea el KYC y la escritura.
   Cada línea dice el VERBO, no el diagnóstico: «genera el enlace que falta»,
   no «cadena_parada». */
function loQueUrge(){
  const hoy = new Date().toISOString().slice(0, 10);
  const out = [];
  OPS.forEach(o => {
    const c = cuentaGrupo(o);
    const pend = (o.firmas || []).filter(f => f.estado === 'pendiente');

    if(o.bloqueado && pend.length){
      out.push({ o, peso:1, grave:true, que:'Cadena de firma parada',
        por:'Firmado, pero le falta firmar ' + pend.length + (pend.length === 1 ? ' persona' : ' personas')
            + '. Mientras tanto el contrato sigue editable.',
        verbo:'Generar el enlace', href:'/contracts/app.html?contrato=' + o.id });
    }else if(pend.some(f => f.expira_en && f.expira_en < hoy)){
      const f = pend.find(x => x.expira_en && x.expira_en < hoy);
      out.push({ o, peso:2, grave:true, que:'Enlace de firma caducado',
        por:(f.firmante_nombre || 'El firmante') + ' quiso firmar y no pudo · caducó ' + hace(f.expira_en),
        verbo:'Reenviar', href:'/contracts/app.html?contrato=' + o.id });
    }

    /* Dinero vencido. Se mira el vencimiento de las facturas del grupo contra
       lo que la operación TODAVÍA debe: una factura vieja de un contrato ya
       cobrado no es deuda, es historia — el mismo error que el panel tuvo que
       corregir cuando se subieron facturas antiguas y todas salían «vencidas
       hace 300 días». */
    if(c.pendiente != null && c.pendiente > 0.005){
      const vencidas = (o.facturas || []).filter(f => !f.anulada && f.tipo !== 'recibi' && f.venc && f.venc < hoy);
      if(vencidas.length){
        const v = vencidas.sort((a, b) => a.venc.localeCompare(b.venc))[0];
        out.push({ o, peso:3, grave:true, que:'Pago vencido',
          por:v.numero + ' venció ' + hace(v.venc) + ' y la operación aún debe ' + dinero(c.pendiente, c.moneda),
          verbo:'Ver en Facturas', href:'/facturas/?id=' + v.id });
      }
    }

    if(o.bloqueado && !c.precio){
      out.push({ o, peso:4, grave:false, que:'Firmado sin precio fijado',
        por:'No se puede saber cuánto falta por cobrar.',
        verbo:'Fijar el precio', href:'/contracts/app.html?contrato=' + o.id });
    }
    const faltan = fichasQueFaltan(o);
    if(faltan){
      out.push({ o, peso:5, grave:false, que:'Falta ficha de comprador',
        por:faltan + (faltan === 1 ? ' comprador nombrado en el contrato no tiene ficha' : ' compradores nombrados no tienen ficha') + '.',
        verbo:'Abrir Compradores', href:'/compradores/' });
    }
  });
  return out.sort((a, b) => a.peso - b.peso);
}

function pintarUrge(){
  const lista = loQueUrge();
  const caja = $('#urge');
  if(!lista.length){ caja.hidden = true; return; }
  caja.innerHTML = '<h2>Necesita algo <span>· ' + lista.length + (lista.length === 1 ? ' cosa' : ' cosas') + '</span></h2>'
    + lista.map((u, i) =>
      '<div class="urgeFila' + (u.grave ? ' grave' : '') + '" data-i="' + i + '">'
      + '<span><b>' + esc(u.o.comprador_nombre || 'Sin comprador') + '</b> · ' + esc(u.que)
      + '<span class="por">' + esc(u.o.numero || '') + ' · ' + esc(u.por) + '</span></span>'
      + '<span class="verbo">' + esc(u.verbo) + '</span>'
      + '<i class="ph ph-arrow-right" style="color:var(--sc)"></i></div>').join('');
  caja.hidden = false;
  caja.querySelectorAll('.urgeFila').forEach(el => {
    el.addEventListener('click', () => { LW3.sensacion('hecho'); location.href = lista[+el.dataset.i].href; });
  });
}

/* ── 3 · LAS OPERACIONES, POR ETAPA ───────────────────────────────────────
   Secciones plegables y no un tablero lateral: un embudo obliga a desplazarse
   en horizontal para leer una columna, y aquí lo que se busca es una fila.
   «Cobro completo» nace PLEGADA — no pide nada, así que no puede ocupar el
   mismo sitio que las que sí. */
const ABIERTA = { sin_firmar:true, firma_viva:true, cobro_pend:true, cobro_ok:false };

function casa(o){
  const t = FILTRO.trim().toLowerCase();
  if(PROY && (o.proyecto_nombre || '') !== PROY) return false;
  if(!t) return true;
  return [o.numero, o.comprador_nombre, o.proyecto_nombre, EQUIPO[o.creado_por] || o.creado_por]
    .join(' ').toLowerCase().includes(t);
}

function fila(o){
  const c = cuentaGrupo(o);
  const pct = c.precio ? Math.min(100, ((c.facturado || 0) / c.precio) * 100) : 0;
  const debe = c.pendiente != null && c.pendiente > 0.005;
  const tipo = lwTipoContrato(o.tipo);
  const faltan = fichasQueFaltan(o);
  return '<div class="op" data-id="' + esc(o.id) + '">'
    + '<span><span class="quien">' + esc(o.comprador_nombre || 'Sin comprador')
      + (faltan ? '<span class="aviso">falta ficha</span>' : '')
      + '</span><span class="donde">' + esc(o.numero || '—') + ' · ' + esc(tipo)
      + (o.proyecto_nombre ? ' · ' + esc(o.proyecto_nombre) : '') + '</span></span>'
    + '<span class="pago">'
      + (c.precio
          ? '<span class="b"><i style="width:' + pct.toFixed(1) + '%"></i></span>'
            + '<span class="t">' + esc(dinero(c.facturado, c.moneda)) + ' de ' + esc(dinero(c.precio, c.moneda)) + '</span>'
          : '<span class="t">sin precio fijado</span>')
      + '</span>'
    + '<span class="falta ' + (debe ? 'debe' : c.precio ? 'ok' : '') + '">'
      + (debe ? esc(dinero(c.pendiente, c.moneda)) + '<small>pendiente</small>'
              : c.precio ? 'Cobrado' : '—')
      + '</span>'
    + '<i class="ph ph-arrow-right ir"></i></div>';
}

function pintar(){
  /* Solo las raíces: un contrato hijo (la construcción que cuelga de su
     parcela) no es otra venta, y enseñarlo suelto contaría el mismo comprador
     dos veces. Se ve dentro, en el detalle del grupo. */
  const lista = OPS.filter(o => !o.padre).filter(casa);
  const cont = $('#etapas');
  if(!lista.length){
    cont.innerHTML = '<div class="filas"><p class="vacio">Ninguna operación coincide con lo que has escrito.</p></div>';
    return;
  }
  cont.innerHTML = ETAPAS.map(([id, rot]) => {
    const ops = lista.filter(o => etapa(o) === id);
    if(!ops.length) return '';
    return '<details class="etapa"' + (ABIERTA[id] ? ' open' : '') + ' data-etapa="' + id + '">'
      + '<summary><span class="punto" style="background:' + ETAPA_COLOR[id] + '"></span>'
      + esc(rot) + ' <span class="cuantas">· ' + ops.length + '</span>'
      + '<i class="ph ph-caret-right chev"></i></summary>'
      + '<div class="filas">' + ops.map(fila).join('') + '</div></details>';
  }).join('');
  cont.querySelectorAll('.op').forEach(el => {
    el.addEventListener('click', () => abrirDetalle(el.dataset.id, el));
  });
  cont.querySelectorAll('.etapa').forEach(d => {
    d.addEventListener('toggle', () => { ABIERTA[d.dataset.etapa] = d.open; });
  });
}

/* ── 4 · EL DETALLE, EN EL CAJÓN COMPARTIDO ───────────────────────────────
   El mismo `.sui-cajon` que el portal y el panel: se arrastra para cerrarlo y
   se puede agarrar a media caída. No hay una pantalla nueva a la que ir y de
   la que volver. */
const Cajon = (() => {
  const el = $('#cajon'), velo = $('#velo');
  LW3.cajon(el, { velo, aspa:'#cX' });
  const cerrar = () => { el.classList.remove('on'); velo.classList.remove('on'); };
  $('#cX').addEventListener('click', cerrar);
  velo.addEventListener('click', cerrar);
  addEventListener('keydown', e => { if(e.key === 'Escape') cerrar(); });
  return {
    abre(tit, sub, html){
      $('#cTit').textContent = tit; $('#cSub').textContent = sub || '';
      $('#cCuerpo').innerHTML = html;
      el.classList.add('on'); velo.classList.add('on');
      $('#cX').focus({ preventScroll:true });
    }
  };
})();

function abrirDetalle(id){
  const o = OPS.find(x => x.id === id);
  if(!o) return;
  const c = cuentaGrupo(o);
  const grupo = o.padre ? [o.padre, ...o.padre.hijos] : [o, ...o.hijos];
  const pend = (o.firmas || []).filter(f => f.estado === 'pendiente');
  const facts = grupo.flatMap(g => g.facturas || []).filter(f => !f.anulada);

  const cuentaHtml =
      '<div class="dato"><span>Precio del grupo</span><span class="v">' + (c.precio ? esc(dinero(c.precio, c.moneda)) : 'sin fijar') + '</span></div>'
    + '<div class="dato"><span>Cobrado</span><span class="v">' + esc(dinero(c.facturado, c.moneda)) + '</span></div>'
    + '<div class="dato"><span>Pendiente</span><span class="v">' + (c.pendiente != null ? esc(dinero(c.pendiente, c.moneda)) : '—') + '</span></div>';

  const grupoHtml = grupo.map(g =>
      '<div class="dato"><span>' + esc(g.numero || '—') + ' · '
      + esc(lwTipoContrato(g.tipo)) + '</span>'
      + '<span class="v">' + (g.bloqueado ? 'Firmado' : 'Editable') + '</span></div>').join('');

  const firmasHtml = pend.length
    ? pend.map(f => '<div class="dato"><span>' + esc(f.firmante_nombre || 'Sin nombre') + '</span>'
        + '<span class="v" style="color:#8C5E10">'
        + (f.expira_en && f.expira_en < new Date().toISOString().slice(0,10) ? 'enlace caducado' : 'pendiente')
        + '</span></div>').join('')
    : '<p class="mini">Nadie tiene una firma pendiente.</p>';

  const factHtml = facts.length
    ? facts.slice(0, 8).map(f => '<div class="dato"><span>' + esc(f.numero || '—') + ' · '
        + esc(f.tipo === 'recibi' ? 'Recibí' : f.tipo === 'proforma' ? 'Proforma' : 'Factura') + '</span>'
        + '<span class="v">' + esc(dinero(f.total, f.moneda)) + '</span></div>').join('')
    : '<p class="mini">Todavía no se ha emitido ningún documento.</p>';

  Cajon.abre(o.comprador_nombre || 'Sin comprador',
    (o.numero || '') + (o.proyecto_nombre ? ' · ' + o.proyecto_nombre : ''),
      '<div class="bloque"><h4>Estado de cuenta</h4>' + cuentaHtml + '</div>'
    + (grupo.length > 1 ? '<div class="bloque"><h4>Contratos de la operación</h4>' + grupoHtml
        + '<p class="mini">Van juntos porque uno cuelga del otro: el precio se cuenta una sola vez.</p></div>' : '')
    + '<div class="bloque"><h4>Firmas</h4>' + firmasHtml + '</div>'
    + '<div class="bloque"><h4>Documentos</h4>' + factHtml + '</div>'
    + '<div class="bloque" style="display:flex;gap:10px;flex-wrap:wrap">'
      + '<a class="sui-btn primario" href="/contracts/app.html?contrato=' + esc(o.id) + '">Abrir el contrato</a>'
      + '<a class="sui-btn" href="/facturas/?contrato=' + esc(o.id) + '">Documentos</a></div>');
}

/* ── arranque ─────────────────────────────────────────────────────────────
   `guard.js` ya comprobó sesión, cuenta activa y permiso, y destapó la página.
   Aquí solo se reusa su cliente: dos clientes de supabase-js sobre el mismo
   almacenamiento se pisan el token. */
window.LW_AUTH.then(async ({ sb }) => {
  SB = sb;
  const r = await lwOperacionesCargar(SB, msg => LW3.tosta(msg, { icono:'ph-warning' }));
  OPS = r.ops; EQUIPO = r.equipo;

  if(r.recortes.length){
    $('#avisos').innerHTML = '<p class="sui-aviso">Esta vista no lo está sumando todo: hay más de '
      + esc(r.recortes.map(n => r.topes[n] + ' ' + n).join(' y más de '))
      + ', y solo se han leído los más recientes. Los totales son parciales.</p>';
  }

  const proyectos = [...new Set(OPS.map(o => o.proyecto_nombre).filter(Boolean))].sort();
  $('#fProyecto').innerHTML = '<option value="">Todos los proyectos</option>'
    + proyectos.map(p => '<option>' + esc(p) + '</option>').join('');

  pintarDinero(); pintarUrge(); pintar();

  let t = null;
  $('#q').addEventListener('input', e => {
    FILTRO = e.target.value;
    clearTimeout(t); t = setTimeout(pintar, 90);
  });
  $('#fProyecto').addEventListener('change', e => { PROY = e.target.value; pintar(); });
});

})();
</script>
