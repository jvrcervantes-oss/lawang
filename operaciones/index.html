<style>
  :root{ --line:#e4ddcf; --card:#fffdf8; --tbh:56px; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{ font-family:var(--font-body,'Jost',sans-serif); background:var(--rl,#F5F0E6); color:var(--ink,#2E3437); }
  .topbar{ position:fixed; top:0; left:0; right:0; z-index:40; }

  /* La vista de entrada es una TABLA CENTRADA, no una columna estrecha a la
     izquierda (31-jul, petición del owner). Con dos o tres operaciones la
     columna se leía; con cincuenta, cada una era un bloque de cuatro líneas y
     había que ir bajando para comparar dos importes. Una tabla enseña de un
     vistazo lo que se compara: número, comprador, precio, cobrado y pendiente.
     Al elegir una fila, la tabla se va y entra la ficha en el mismo ancho —de
     ahí `.stage.abierta`, que ya existía y solo servía en móvil. */
  .stage{ display:block; height:100%; overflow:auto; padding-top:var(--tbh); }
  .centro{ max-width:1180px; margin:0 auto; padding:22px 26px 90px; }
  .stage.abierta .lista{ display:none; }
  .stage:not(.abierta) .detalle{ display:none; }

  /* ---------- lista ---------- */
  .lista .cab{ padding:0 0 14px; }
  .cab .fila{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .cab .fila .buscar{ flex:1 1 260px; }
  .cab .fila .f-sel{ flex:0 1 240px; margin-top:0; width:auto; }

  /* La tabla desplaza en horizontal dentro de su caja en vez de recortarse o
     ensanchar la página: en un móvil son seis columnas que no caben. */
  .tabla-caja{ overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--card); }
  table.ops{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:760px; }
  table.ops thead th{ position:sticky; top:0; background:var(--card); z-index:1;
    text-align:left; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); font-weight:600; padding:12px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.ops td{ padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.ops tbody tr{ cursor:pointer; }
  table.ops tbody tr:hover{ background:#efeade; }
  table.ops tbody tr:last-child td{ border-bottom:none; }
  table.ops .num, table.ops th.num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  table.ops .n{ font-size:12.5px; letter-spacing:.08em; color:var(--tg); font-weight:600; white-space:nowrap; }
  table.ops .c{ font-weight:600; }
  table.ops .p{ font-size:12.5px; color:var(--muted); }
  /* SIN el `table.ops` de delante: la tabla es `.sui-tabla` desde el rediseño
     del 31-jul, asi que esta regla no aplicaba a nada y las pastillas salian
     PEGADAS (se unen con join('') , sin ni siquiera un espacio en blanco).
     10px en horizontal: dos pastillas de color solido pegadas se leen como una
     sola etiqueta partida. El hueco vertical se queda menor para que dos lineas
     de etiquetas no engorden la fila. */
  .badges{ display:flex; gap:6px 10px; flex-wrap:wrap; }
  .volver{ font:inherit; font-size:12.5px; background:none; border:none; color:var(--dl); cursor:pointer;
           padding:0; margin:0 0 14px; display:inline-flex; align-items:center; gap:6px; }
  .volver:hover{ text-decoration:underline; }
  .resumen{ display:flex; gap:22px; flex-wrap:wrap; margin:0 0 14px; font-size:12.5px; color:var(--muted); }
  .resumen b{ color:var(--ink,#2E3437); font-variant-numeric:tabular-nums; }
  .buscar{ width:100%; font:inherit; font-size:13.5px; padding:9px 11px; border:1px solid var(--line);
           border-radius:9px; background:var(--card); color:inherit; }
  .buscar:focus{ outline:none; border-color:var(--tg); box-shadow:0 0 0 3px rgba(72,91,55,.12); }
  /* mismos chips que Unidades: el contador va DENTRO del filtro para saber
     cuánto hay antes de pulsarlo */
  .filtros{ display:flex; gap:5px; flex-wrap:wrap; margin-top:9px; }
  .f{ font:inherit; font-size:11.5px; letter-spacing:.04em; background:none; border:1px solid var(--line);
      border-radius:999px; padding:5px 11px; cursor:pointer; color:var(--muted); }
  .f:hover{ border-color:var(--tg); }
  .f.on{ background:var(--va,#2E3437); border-color:var(--va,#2E3437); color:#fff; }
  .f.vacio{ opacity:.45; }
  .f-sel{ font:inherit; font-size:12px; padding:6px 9px; border:1px solid var(--line); border-radius:9px;
          background:var(--card); color:inherit; margin-top:7px; width:100%; }
  .op{ display:block; width:100%; text-align:left; font:inherit; background:none; border:none;
       border-bottom:1px solid var(--line); padding:13px 18px; cursor:pointer; }
  .op:hover{ background:#efeade; }
  .op.sel{ background:#e7e1d2; box-shadow:inset 3px 0 0 var(--tg); }
  .op .n{ font-size:12px; letter-spacing:.1em; color:var(--tg); font-weight:600; }
  .op .c{ font-size:14px; margin:2px 0 0; }
  .op .p{ font-size:12px; color:var(--muted); }

  /* ---------- detalle ---------- */
  .detalle{ overflow:auto; padding:26px 30px 80px; }
  .vacio-panel{ display:grid; place-items:center; height:100%; color:var(--ss,#BEB3A5); font-size:13px;
                letter-spacing:.16em; text-transform:uppercase; }
  section{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:16px; overflow:hidden; }
  /* título de sección = banda de marca a lo ancho de la tarjeta (los márgenes
     negativos la llevan hasta el borde; el overflow:hidden del section recorta
     las esquinas contra el radio de la tarjeta) */
  section > h3{ font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--rl,#F5F0E6);
                background:var(--dl,#104C4F); margin:-16px -18px 14px; padding:10px 18px; font-weight:600; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
      font-weight:500; padding:0 8px 7px 0; }
  td{ padding:7px 8px 7px 0; border-top:1px solid var(--line); vertical-align:top; }
  td.num, th.num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .cifras{ display:flex; gap:26px; flex-wrap:wrap; }
  .cifra .k{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .cifra .v{ font-size:19px; font-weight:600; color:var(--dl); font-variant-numeric:tabular-nums; }
  .cifra .v.gris{ color:var(--ss,#BEB3A5); font-weight:400; font-size:15px; }

  /* Estados en color SÓLIDO con texto claro: el lavado pálido de antes se leía
     como decoración y había que buscar el estado. Los 5 pasan contraste AA
     (>4.5:1) sobre blanco. Mismos colores en Unidades y Compradores. */
  .tag{ display:inline-block; font-size:10px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
        border-radius:999px; padding:4px 10px; white-space:nowrap; color:#fff; background:#5A6062; }
  .tag.ok{    background:#3F5230; }
  .tag.espera{background:#8C5E10; }
  .tag.alerta{background:#9E2F26; }
  .tag.info{  background:#104C4F; }

  a.enl{ color:var(--dl); text-decoration:none; border-bottom:1px solid rgba(16,76,79,.3); }
  a.enl:hover{ border-bottom-color:var(--dl); }
  /* la acción principal de cada documento: el PDF firmado se buscaba y estaba
     en un párrafo de texto al final de la ficha */
  a.enl.fuerte{ display:inline-block; border:1px solid var(--dl); border-radius:999px;
                padding:5px 13px; font-size:12.5px; font-weight:600; white-space:nowrap; }
  a.enl.fuerte:hover{ background:var(--dl); color:#fff; }
  .nota{ font-size:12px; color:var(--muted); margin:10px 0 0; line-height:1.5; }
  .falta{ color:#a3342b; }

  /* pestañas */
  .tabs{ display:flex; gap:6px; }
  /* Las pestañas viven DENTRO de la barra superior, que en móvil ya desplaza en
     horizontal (assets/topbar.css). Aquí solo hace falta que no se aplasten al
     repartir el ancho: medido a 390px la fila se salía 221px y las pestañas
     quedaban ilegibles antes de quedar fuera. */
  .tab{ flex:none; }
  .tab{ font:inherit; font-size:12.5px; font-weight:500; background:none; border:1px solid transparent;
        border-radius:999px; padding:6px 14px; cursor:pointer; color:var(--muted); }
  .tab.on{ background:var(--card); border-color:var(--line); color:var(--dl); }
  .panel{ display:none; }
  .panel.on{ display:block; }
  .venc{ padding:26px 30px 80px; overflow:auto; grid-column:1 / -1; }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--va,#2E3437);
    color:#fff; padding:11px 20px; border-radius:30px; font-size:13px; z-index:200; opacity:0;
    transition:opacity .3s; pointer-events:none; }
  .toast.show{ opacity:1; }
  /* el visor de documentos es la pieza compartida /contracts/assets/visor.js */

<!-- esc() y toast(), que estaban copiados en cada herramienta. Va ANTES del
     script de la pagina: son `const` de primer nivel y dos declaraciones del
     mismo nombre revientan la pagina entera. -->
<script src="/contracts/assets/suite-comun.js?v=a3274f34"></script>
<script>
/* ============================================================
   OPERACIONES — la vista que cruza lo que ya existe.

   No crea tablas: lee `contratos`, `facturas` y `contrato_firmas` y las junta
   por operación. Antes cada herramienta era una isla y para saber cómo iba una
   venta había que abrir tres sitios (o la base de datos).

   Cubre de una vez lo que iban a ser cuatro herramientas sueltas:
   estado de cuenta, ficha de la operación, vencimientos y registro de firmas.
   Son la misma consulta mirada desde ángulos distintos; cuatro apps habrían
   repetido cuatro veces el mismo cruce y habrían divergido.

   SOLO LECTURA a propósito: aquí no se emite ni se corrige nada. Emitir se hace
   en su herramienta, y desde aquí se enlaza. Una vista que además escribe acaba
   siendo una segunda forma de crear documentos, con sus propias reglas.
   ============================================================ */
const $  = s => document.querySelector(s);

const HOY = new Date(); HOY.setHours(0,0,0,0);
const fFecha = f => f ? new Date(f + (String(f).length===10 ? 'T00:00:00' : '')).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const dias = f => f ? Math.round((new Date(f) - HOY) / 86400000) : null;

let SB = null, OPS = [], SEL = null, POR_CLIENTE = {}, EQUIPO = {};
/* Los 13 contratos anteriores a la columna `creado_por` (28-jul) no tienen
   autor y nunca lo van a tener: no hay de dónde sacarlo. Salen con raya. */
const operador = o => EQUIPO[o.creado_por] || o.creado_por || '—';

/* Las claves de kyc_status son las del CHECK de `clients` (inglés, de cuando se
   creó la tabla). Aquí solo se traducen para mostrar. */
const KYC_ES = { pending:'Pendiente', submitted:'En revisión', verified:'Aprobado', rejected:'Rechazado' };
const TIPO_ES = { reserva_parcela:'Bloqueo de Parcela', construccion:'Construcción', contrato_general:'Contrato General',
  commercial_offer:'Oferta Comercial', carta_reserva:'Carta de Reserva',
  carta_reserva_ampliada:'Carta de Reserva ampliada', acuerdo_comercial:'Acuerdo Comercial',
  protocolo_operativo:'Protocolo Operativo' };

/* ---------- carga ----------
   Columnas explícitas y `hitos:datos->hitos`: un contrato entero pesa MB por
   los anexos en base64 dentro del jsonb. Un select(*) aquí colgaría la lista. */
async function cargar(){
  const [c, f, s, cc, dc, eq] = await Promise.all([
    // `adq1` y `compradores` se piden para poder avisar de las fichas de
    // comprador que faltan. Son campos pequeños del jsonb; sigue sin pedirse
    // `datos` entero, que pesa MB por los anexos en base64.
    SB.from('contratos').select('id,numero,tipo,comprador_nombre,proyecto_nombre,precio_total,moneda,fecha_firma,bloqueado,pdf_firmado_path,contrato_padre_id,created_at,creado_por,hitos:datos->hitos,adq1:datos->fields->>adq1_nombre,extras:datos->compradores').order('created_at',{ascending:false}).limit(300),
    SB.from('facturas').select('id,numero,tipo,contrato_id,contrato_numero,cliente_nombre,total,moneda,fecha_emision,anulada,venc:datos->fields->>fecha_vencimiento').order('created_at',{ascending:false}).limit(500),
    // `snapshot_path` se pide solo para poder limpiar el almacenamiento al
    // borrar una operación: ver borrarOperacion().
    SB.from('contrato_firmas').select('id,contrato_id,firmante_nombre,firmante_email,firmante_rol,estado,creado_en,expira_en,firmado_en,snapshot_path').order('creado_en',{ascending:false}).limit(300),
    // fichas reales de comprador. Si la tabla todavía no existe (migración sin
    // correr), esto falla solo y la ficha cae al nombre suelto del contrato.
    SB.from('contrato_compradores').select('contrato_id,rol,clients(id,full_name,email,phone,passport_number,kyc_status)'),
    // documentación del comprador (KYC). Se ata por `client_id`, no por
    // contrato: el pasaporte es de la persona, no de una venta, y sirve para
    // todas las que tenga.
    SB.from('documents').select('id,client_id,contrato_id,doc_type,storage_path,status,uploaded_at,caduca_el'),
    // email → nombre del equipo, solo para ENSEÑAR quién creó la operación.
    // `contratos.creado_por` guarda el email y así se queda: es la identidad con
    // la que la RLS decide quién edita lo suyo. Ojo: la RLS de `usuarios` deja
    // ver todas las fichas al admin y solo la propia al resto — a un agente le
    // saldrá el email en vez del nombre, que sigue identificando igual.
    SB.from('usuarios').select('email,nombre'),
  ]);
  if(c.error) throw c.error;
  const facturas = f.error ? [] : (f.data || []);
  const firmas   = s.error ? [] : (s.data || []);
  const vinculos = cc.error ? [] : (cc.data || []);
  const docsKyc  = dc.error ? [] : (dc.data || []);
  EQUIPO = {};
  (eq.error ? [] : (eq.data || [])).forEach(u => { if(u.nombre) EQUIPO[u.email] = u.nombre; });

  /* Qué contratos tiene cada persona. Un comprador encadena reserva, PPJB y
     obra: estando en uno hace falta saltar a los otros sin volver al listado.
     Se calcula una vez aquí, no por ficha. */
  POR_CLIENTE = {};
  vinculos.forEach(v => {
    if(!v.clients) return;
    (POR_CLIENTE[v.clients.id] = POR_CLIENTE[v.clients.id] || []).push(v.contrato_id);
  });
  if(f.error) toast('No se pudieron leer las facturas: ' + f.error.message);
  if(s.error) toast('No se pudieron leer las firmas: ' + s.error.message);

  OPS = (c.data || []).map(ct => ({
    ...ct,
    // las facturas viejas no tienen contrato_id (la columna es del 28-jul):
    // se enlazan también por el nº impreso para no perderlas de vista
    facturas: facturas.filter(x => x.contrato_id ? x.contrato_id === ct.id
                                                 : (x.contrato_numero && ct.numero && x.contrato_numero === ct.numero)),
    firmas: firmas.filter(x => x.contrato_id === ct.id),
    compradores: vinculos.filter(v => v.contrato_id === ct.id && v.clients)
                         .sort((a,b) => String(a.rol).localeCompare(String(b.rol))),
    // documentos de SUS compradores + los atados expresamente a este contrato
    docs: (() => {
      const suyos = vinculos.filter(v => v.contrato_id === ct.id && v.clients).map(v => v.clients.id);
      return docsKyc.filter(d => d.contrato_id === ct.id || suyos.includes(d.client_id));
    })(),
  }));

  /* Contratos vinculados (contratos.contrato_padre_id, puesto en Contratos al
     elegir la reserva/PPJB desde la Construcción): la misma venta deja de salir
     como dos filas. El hijo desaparece de la lista y vive dentro de la ficha
     del padre; si el padre no está entre los cargados, el hijo se queda como
     fila normal antes que desaparecer de la vista. */
  const porId = {};
  OPS.forEach(o => { porId[o.id] = o; o.hijos = []; o.padre = null; });
  OPS.forEach(o => {
    const p = o.contrato_padre_id && porId[o.contrato_padre_id];
    if(p && p !== o){ o.padre = p; p.hijos.push(o); }
  });
}

/* ---------- dinero ----------
   parseImporte / fmtMoneda / redondear salen de /facturas/totales.js: la misma
   aritmética que emite las facturas, para que un total no cuadre distinto según
   dónde se mire. */
function importeHito(h, precio, moneda){
  const m = parseImporte(h.monto);
  if(m) return { n:m, exacto:true };
  const p = parseImporte(h.pct);
  if(p && precio) return { n:redondear(precio * p / 100, moneda), exacto:false };
  return { n:null, exacto:false };
}
const textoHito = h => h.es || h.en || h.id || 'Hito sin nombre';

/* Compradores nombrados en el contrato vs fichas realmente creadas. El alta es
   automática al guardar, pero se cae sin ruido si la persona no tiene pasaporte
   ni email, si el contrato se guardó antes de que existiera la sincronización,
   o (hasta el 29-jul) si era el cuarto adquiriente en adelante. */
function compradoresNombrados(o){
  return (String(o.adq1 || '').trim() ? 1 : 0)
    + (Array.isArray(o.extras) ? o.extras.filter(x => String((x||{}).nombre || '').trim()).length : 0);
}
const fichasQueFaltan = o => Math.max(0, compradoresNombrados(o) - (o.compradores || []).length);

function cuenta(op){
  const moneda = op.moneda || 'EUR';
  const precio = parseImporte(op.precio_total);
  const hitos  = Array.isArray(op.hitos) ? op.hitos : [];
  const vivas  = op.facturas.filter(x => !x.anulada && x.tipo !== 'proforma');
  const facturado = redondear(vivas.reduce((a,x) => a + parseImporte(x.total), 0), moneda);
  return { moneda, precio, hitos, facturado, pendiente: precio ? redondear(precio - facturado, moneda) : null };
}

/* ---------- filtros ----------
   Lo que de verdad se busca aquí no es "una operación" sino "las que me
   reclaman algo": las que están sin firmar, las que deben dinero, las que
   tienen un enlace de firma esperando o les falta la ficha del comprador.
   Por eso los filtros son por SITUACIÓN y no por tipo de contrato. Cada uno
   lleva su contador: así se sabe si hay algo ahí antes de pulsarlo, y un
   filtro vacío se atenúa en vez de esconderse (que no esté no es lo mismo que
   no exista). Se combinan con el buscador y con el proyecto. */
const FILTROS = [
  ['',            'Todas',            () => true],
  ['sin_firmar',  'Sin firmar',       o => !o.bloqueado],
  ['firmado',     'Firmadas',         o => !!o.bloqueado],
  ['debe',        'Con pendiente',    o => { const c = cuenta(o); return c.pendiente != null && c.pendiente > 0; }],
  ['firma_viva',  'Firma enviada',    o => o.firmas.some(f => f.estado === 'pendiente')],
  ['sin_factura', 'Sin facturar',     o => !o.facturas.some(f => !f.anulada && f.tipo !== 'proforma')],
  ['falta_ficha', 'Falta ficha',      o => fichasQueFaltan(o) > 0],
];
let FILTRO = '', PROYECTO = '';
const pasaFiltro = o => (FILTROS.find(f => f[0] === FILTRO) || FILTROS[0])[2](o);

function pintarFiltros(){
  const raiz = OPS.filter(o => !o.padre);
  $('#filtros').innerHTML = FILTROS.map(([k, etiqueta, prueba]) => {
    const n = raiz.filter(prueba).length;
    return `<button class="f ${FILTRO===k?'on':''} ${n?'':'vacio'}" data-f="${k}">${etiqueta} ${n}</button>`;
  }).join('');
  // el desplegable de proyecto se construye de los datos, no de una lista fija:
  // si mañana entra un proyecto nuevo aparece solo
  const sel = $('#fProyecto');
  const proyectos = [...new Set(raiz.map(o => o.proyecto_nombre).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const previo = sel.value;
  sel.innerHTML = '<option value="">Todos los proyectos</option>'
    + proyectos.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
  sel.value = proyectos.includes(previo) ? previo : '';
  PROYECTO = sel.value;
}

/* ---------- lista ---------- */
function pintarLista(){
  const q = $('#q').value.trim().toLowerCase();
  // el hijo no es fila: buscar por su número o comprador debe traer la
  // operación entera, o sea la fila del padre
  const vis = OPS.filter(o => !o.padre)
    .filter(pasaFiltro)
    .filter(o => !PROYECTO || o.proyecto_nombre === PROYECTO)
    .filter(o => !q ||
    [o, ...o.hijos].some(x => [x.numero,x.comprador_nombre,x.proyecto_nombre,x.creado_por,operador(x)].some(v => String(v||'').toLowerCase().includes(q))));
  $('#listaOps').innerHTML = vis.length ? vis.map(o => {
    const c = cuenta(o);
    const eur = n => n == null ? '<span class="nota">—</span>' : esc(fmtMoneda(n, c.moneda));
    const b = [];
    if(o.bloqueado) b.push('<span class="tag ok">Firmado</span>');
    else b.push('<span class="tag espera">Sin firmar</span>');
    if(o.firmas.some(x => x.estado === 'pendiente')) b.push('<span class="tag info">Firma enviada</span>');
    if(o.hijos.length) b.push('<span class="tag info">+' + o.hijos.length + '</span>');
    // el alta de comprador es automática pero se cae en silencio en 3 casos:
    // se avisa en la LISTA para no tener que entrar operación por operación
    if(fichasQueFaltan(o)) b.push('<span class="tag alerta">Falta ficha</span>');
    return `<tr data-id="${esc(o.id)}" class="${SEL===o.id?'sel':''}">
      <td class="n">${esc(o.numero || 'sin nº')}</td>
      <td class="c">${esc(o.comprador_nombre || 'Sin comprador')}</td>
      <td class="p">${esc(o.proyecto_nombre || '—')}</td>
      <td class="p" title="${esc(o.creado_por || 'sin autor registrado')}">${esc(operador(o))}</td>
      <td class="num">${c.precio ? eur(c.precio) : '<span class="nota">sin fijar</span>'}</td>
      <td class="num">${c.facturado ? eur(c.facturado) : '<span class="nota">—</span>'}</td>
      <td class="num">${c.pendiente != null && c.pendiente > 0 ? '<b>' + eur(c.pendiente) + '</b>' : eur(c.pendiente)}</td>
      <td><div class="badges">${b.join('')}</div></td>
    </tr>`;
  }).join('')
    // decir POR QUÉ no hay nada: con filtros puestos, "ninguna coincide" deja
    // al operador pensando que no existe el dato cuando solo está filtrado
    : `<tr><td colspan="8"><p class="nota">Ninguna operación coincide.
        ${(FILTRO || PROYECTO || q) ? '<a class="enl" href="#" id="limpiaFiltros">Quitar los filtros</a>' : ''}</p></td></tr>`;

  // Totales de lo que se está viendo, no de todo: con un filtro puesto, la suma
  // de la cartera entera no dice nada de lo que tienes delante.
  const tot = vis.reduce((a, o) => { const c = cuenta(o);
    a.precio += c.precio || 0; a.cobrado += c.facturado || 0;
    a.pendiente += (c.pendiente != null && c.pendiente > 0) ? c.pendiente : 0; return a; },
    { precio:0, cobrado:0, pendiente:0 });
  const m = (vis[0] && cuenta(vis[0]).moneda) || 'EUR';
  $('#resumen').innerHTML = !vis.length ? '' :
    `<span>${vis.length} ${vis.length===1?'operación':'operaciones'}</span>
     <span>Precio <b>${esc(fmtMoneda(tot.precio, m))}</b></span>
     <span>Cobrado <b>${esc(fmtMoneda(tot.cobrado, m))}</b></span>
     <span>Pendiente <b>${esc(fmtMoneda(tot.pendiente, m))}</b></span>`;
}

/* ---------- ficha ---------- */
function pintarDetalle(){
  const op = OPS.find(o => o.id === SEL);
  if(!op){ suiCerrarCajon(); return; }
  const c = cuenta(op);
  const fmt = n => n == null ? '—' : fmtMoneda(n, c.moneda);

  const filasHitos = c.hitos.length ? c.hitos.map(h => {
    const imp = importeHito(h, c.precio, c.moneda);
    return `<tr>
      <td>${esc(textoHito(h))}${h.timing ? ' <span class="nota">· ' + esc(h.timing) + '</span>' : ''}</td>
      <td class="num">${h.pct ? esc(h.pct) + '%' : '—'}</td>
      <td class="num">${imp.n == null ? '<span class="falta">sin importe</span>'
                       : fmt(imp.n) + (imp.exacto ? '' : ' <span class="nota">(calculado)</span>')}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="3" class="nota">El contrato no fijó hitos de pago.</td></tr>';

  /* TODOS los documentos de la operación en UNA tabla: contratos (con su PDF
     firmado, si lo hay) y lo emitido en Facturas. Antes vivían en dos secciones
     separadas y el PDF firmado —el documento que más se busca— estaba escondido
     en un párrafo de texto al final de la ficha. */
  const TIPO_DOC = { factura:'Factura', proforma:'Proforma', recibi:'Recibí' };
  const docsOperacion = [];
  (op.padre ? [op.padre, ...op.padre.hijos] : [op, ...op.hijos]).forEach(ct => {
    docsOperacion.push({
      clase:'contrato', numero: ct.numero || 'sin nº', tipo: TIPO_ES[ct.tipo] || ct.tipo || 'Contrato',
      fecha: ct.fecha_firma, importe: parseImporte(ct.precio_total), moneda: ct.moneda || c.moneda,
      firmado: !!ct.bloqueado, pdf: ct.pdf_firmado_path || null, opId: ct.id,
    });
    (ct.facturas || []).forEach(f => docsOperacion.push({
      clase:'factura', numero: f.numero || 'borrador', tipo: TIPO_DOC[f.tipo] || f.tipo || 'Documento',
      fecha: f.fecha_emision, importe: parseImporte(f.total), moneda: f.moneda || c.moneda,
      anulada: f.anulada, proforma: f.tipo === 'proforma', id: f.id,
    }));
  });

  const filasDocumentos = docsOperacion.map(d => {
    // la acción de cada fila: el contrato firmado abre su PDF; la factura, el
    // documento; un contrato sin firmar no tiene nada que enseñar todavía
    const accion = d.clase === 'contrato'
      ? (d.pdf ? `<a class="enl fuerte" href="#" data-pdf="${esc(d.pdf)}">Ver PDF firmado</a>`
               : `<a class="enl" href="/contracts/app.html?contrato=${encodeURIComponent(d.opId)}">Abrir en Contratos</a>`)
      : `<a class="enl fuerte" href="/facturas/?id=${encodeURIComponent(d.id)}" data-doc="1">Ver documento</a>`;
    const estado = d.clase === 'contrato'
      ? (d.firmado ? '<span class="tag ok">Firmado</span>' : '<span class="tag espera">Sin firmar</span>')
      : (d.anulada ? '<span class="tag alerta">Anulada</span>'
                   : (d.proforma ? '<span class="tag espera">No suma</span>' : '<span class="tag ok">Emitida</span>'));
    return `<tr>
      <td><b>${esc(d.numero)}</b><div class="nota">${esc(d.tipo)}</div></td>
      <td>${d.clase === 'contrato' ? '<span class="tag info">Contrato</span>' : '<span class="tag">Facturación</span>'}</td>
      <td>${fFecha(d.fecha)}</td>
      <td class="num">${d.importe ? esc(fmtMoneda(d.importe, d.moneda)) : '—'}</td>
      <td>${estado}</td>
      <td>${accion}</td>
    </tr>`;
  }).join('');

  /* Fichas de comprador que faltan. El alta es automática al guardar el
     contrato, pero se cae en tres casos y hasta ahora ninguno se veía desde
     aquí: comprador sin pasaporte ni email, contrato guardado antes de que la
     sincronización existiera, y (hasta el 29-jul) más de tres adquirientes. */
  const enElContrato = compradoresNombrados(op);
  const faltanFichas = fichasQueFaltan(op);

  const filasFirmas = op.firmas.length ? op.firmas.map(s => {
    const d = dias(s.expira_en);
    let est = '<span class="tag espera">Pendiente</span>';
    if(s.estado === 'firmado') est = '<span class="tag ok">Firmado ' + fFecha(s.firmado_en) + '</span>';
    // 🔴 `anulado` NO es `pendiente`, y aquí caía en el «Pendiente» de por
    // defecto: los 15 enlaces anulados de producción se pintaban como enlaces
    // VIVOS. En CR00007 —firmado y bloqueado— eso enseñaba una firma pendiente
    // encima de la completa, o sea justo lo contrario de la regla del 28-jul
    // (un solo enlace vivo por firmante: al generar uno nuevo se anula el
    // anterior, y el índice `contrato_firmas_un_pendiente_por_rol` lo impone).
    // No se ocultan: son el rastro que demuestra que solo hubo uno vivo.
    else if(s.estado === 'anulado') est = '<span class="tag">Anulado</span>';
    else if(d != null && d < 0) est = '<span class="tag alerta">Caducado</span>';
    else if(d != null && d <= 5) est = '<span class="tag alerta">Caduca en ' + d + ' d</span>';
    return `<tr><td>${esc(s.firmante_nombre || '—')}<div class="nota">${esc(s.firmante_email || '')}</div></td>
      <td>${esc(s.firmante_rol || '—')}</td><td>${fFecha(s.creado_en)}</td><td>${est}</td></tr>`;
  }).join('') : '<tr><td colspan="4" class="nota">No se ha enviado a firma remota.</td></tr>';

  /* El nombre viene de la ficha real si existe; si no, del texto del contrato.
     Con la ficha se puede además decir cómo va su KYC, que es lo que el nombre
     suelto nunca supo. */
  const fichas = op.compradores || [];
  /* Documentación KYC. El nombre del comprador va en cada fila porque en un
     contrato a dos nombres hay que saber de quién falta el pasaporte. */
  const DOC_ES = { passport:'Pasaporte', npwp:'NPWP', visa:'Visado',
    proof_of_funds:'Justificante de fondos', proof_of_address:'Justificante de domicilio',
    signed_contract:'Contrato firmado', other:'Otro' };
  const nombreDe = id => (fichas.find(v => v.clients.id === id) || {clients:{}}).clients.full_name || '—';
  const filasDocs = (op.docs || []).length ? op.docs.map(d => {
    const dd = dias(d.caduca_el);
    let cad = '<span class="tag espera">sin fecha</span>';
    if(d.caduca_el) cad = dd < 0 ? `<span class="tag alerta">caducado hace ${-dd} d</span>`
                       : dd <= 60 ? `<span class="tag espera">${fFecha(d.caduca_el)}</span>`
                       : `<span class="tag ok">${fFecha(d.caduca_el)}</span>`;
    return `<tr>
      <td>${esc(DOC_ES[d.doc_type] || d.doc_type || '—')}</td>
      <td>${esc(nombreDe(d.client_id))}</td>
      <td>${fFecha(d.uploaded_at)}</td>
      <td>${cad}</td></tr>`;
  }).join('')
    : `<tr><td colspan="4" class="nota">${fichas.length
        ? 'Ningún documento subido todavía para ' + (fichas.length > 1 ? 'estos compradores' : 'este comprador') + '.'
        : 'Sin ficha de comprador enlazada no hay documentación que mostrar.'}</td></tr>`;


  const titulo = fichas.length ? fichas.map(v => v.clients.full_name).filter(Boolean).join(' · ')
                              : (op.comprador_nombre || 'Sin comprador');

  /* La misma venta en varios documentos (reserva/PPJB + obra): se enseñan
     juntos y se salta entre ellos sin volver al listado. Cada contrato conserva
     su propio estado de cuenta — sumar los precios inventaría un total que
     ningún documento dice. El facturado de la operación sí es un hecho. */
  const cadena = op.padre ? [op.padre, ...op.padre.hijos] : (op.hijos.length ? [op, ...op.hijos] : null);
  const bloqueCadena = cadena ? `
    <section>
      <h3>Contratos de la operación</h3>
      <table><thead><tr><th>Nº</th><th>Tipo</th><th class="num">Precio</th><th class="num">Emitido</th><th>Estado</th></tr></thead><tbody>
      ${cadena.map(x => {
        const cx = cuenta(x);
        return `<tr>
          <td>${x.id === op.id
            ? '<b>' + esc(x.numero || 'sin nº') + '</b> <span class="nota">(abierta)</span>'
            : `<a class="enl" href="?contrato=${encodeURIComponent(x.id)}" data-op="${esc(x.id)}">${esc(x.numero || 'sin nº')}</a>`}</td>
          <td>${esc(TIPO_ES[x.tipo] || x.tipo || '—')}</td>
          <td class="num">${cx.precio ? esc(fmtMoneda(cx.precio, cx.moneda)) : '—'}</td>
          <td class="num">${esc(fmtMoneda(cx.facturado, cx.moneda))}</td>
          <td>${x.bloqueado ? '<span class="tag ok">Firmado</span>' : '<span class="tag espera">Sin firmar</span>'}</td>
        </tr>`;
      }).join('')}
      </tbody></table>
      <p class="nota">Vinculados desde Contratos («Nº del Contrato de Reserva/PPJB vinculado» en la Construcción).
        Cada contrato mantiene su estado de cuenta; no se suman los precios entre documentos.</p>
    </section>` : '';
  const bloqueFichas = fichas.length ? `
    <section>
      <h3>Comprador${fichas.length > 1 ? 'es' : ''}</h3>
      <table><thead><tr><th>Nombre</th><th>Rol</th><th>Contacto</th><th>KYC</th><th>Sus otros contratos</th></tr></thead><tbody>
      ${fichas.map(v => {
        const c = v.clients;
        const ok = c.kyc_status === 'verified';
        // el nombre ES el enlace, y lleva a SU ficha, no a la lista: pulsar
        // "Abrir en Compradores" y aterrizar en un listado obliga a buscar a
        // la persona que ya estabas mirando
        // sus OTROS contratos: la venta encadena reserva, PPJB y obra, y desde
        // uno hay que poder saltar a los demás sin volver al listado
        const otros = (POR_CLIENTE[c.id] || [])
          .filter(cid => cid !== op.id)
          .map(cid => OPS.find(o => o.id === cid))
          .filter(Boolean);
        return `<tr>
          <td><a class="enl" href="/compradores/?id=${encodeURIComponent(c.id)}">${esc(c.full_name || 'Sin nombre')}</a>
              <div class="nota">${esc(c.passport_number || 'sin pasaporte')}</div></td>
          <td>${esc(String(v.rol).replace('adquiriente_','Adquiriente '))}</td>
          <td>${esc(c.email || c.phone || '—')}</td>
          <td><span class="tag ${ok ? 'ok' : (c.kyc_status === 'rejected' ? 'alerta' : 'espera')}">${esc(KYC_ES[c.kyc_status] || c.kyc_status || 'pendiente')}</span></td>
          <td>${otros.length
            ? otros.map(o => `<a class="enl" href="/operaciones/?contrato=${encodeURIComponent(o.id)}" title="${esc(o.proyecto_nombre || '')}">${esc(o.numero || 'sin nº')}</a>`).join(' · ')
            : '<span class="nota">—</span>'}</td>
        </tr>`;
      }).join('')}
      </tbody></table>
      <p class="nota">Pulsa un nombre para abrir su ficha y su documentación.</p>
      ${faltanFichas ? `<p class="nota falta"><b>Faltan ${faltanFichas} ficha${faltanFichas>1?'s':''} de comprador.</b>
        El contrato nombra a ${enElContrato} y solo ${(op.compradores||[]).length} tiene${(op.compradores||[]).length===1?'':'n'} ficha.
        Suele ser porque a esa persona le falta pasaporte y email (sin uno de los dos no se crea ficha, para no duplicarla).
        Se corrige rellenando ese dato en Contratos y volviendo a guardar.</p>` : ''}
    </section>` : `
    <section>
      <h3>Comprador</h3>
      <p class="nota${enElContrato ? ' falta' : ''}">Este contrato todavía no tiene ficha de comprador enlazada: el nombre
        vive solo como texto dentro del contrato. Se crea sola al volver a guardarlo en Contratos
        ${enElContrato ? ' — siempre que el comprador tenga pasaporte o email.' : '.'}</p>
    </section>`;

  /* El detalle va en el CAJÓN lateral — norma de la suite desde el 31-jul: se lee
     sin perder de vista la lista de la que sale. El cuerpo es el mismo HTML de
     siempre; lo único que cambia es dónde se cuelga.
     El título y el subtítulo NO van aquí: los pinta la cabecera del cajón. Esta
     ficha venía de ser una página entera y se trajo con su propio encabezado
     dentro, así que salía dos veces (31-jul-2026). La fecha de firma, que solo
     estaba en el de dentro, se pasa al de la cabecera para no perderla. */
  const cuerpoFicha = `
    ${bloqueCadena}

    ${bloqueFichas}

    <section>
      <h3>Estado de cuenta</h3>
      <div class="cifras">
        <div class="cifra"><div class="k">Precio pactado</div>
          <div class="v ${c.precio ? '' : 'gris'}">${c.precio ? fmt(c.precio) : 'sin fijar'}</div></div>
        <div class="cifra"><div class="k">Emitido</div><div class="v">${fmt(c.facturado)}</div></div>
        <div class="cifra"><div class="k">Pendiente</div>
          <div class="v ${c.pendiente == null ? 'gris' : ''}">${c.pendiente == null ? 'no calculable' : fmt(c.pendiente)}</div></div>
      </div>
      ${c.precio ? '' : '<p class="nota falta">Sin precio total en el contrato no se puede calcular el pendiente ni convertir los hitos en %. Se rellena en Contratos.</p>'}
      <table style="margin-top:14px">
        <thead><tr><th>Hito de pago</th><th class="num">%</th><th class="num">Importe</th></tr></thead>
        <tbody>${filasHitos}</tbody>
      </table>
      <p class="nota">Las proformas no suman al emitido: no son documento fiscal.</p>
    </section>

    <section>
      <h3>Documentos de la operación</h3>
      <table><thead><tr><th>Nº</th><th>Clase</th><th>Fecha</th><th class="num">Importe</th><th>Estado</th><th>Ver</th></tr></thead>
        <tbody>${filasDocumentos}</tbody></table>
      <p class="nota">Contratos y facturación de esta venta, juntos.
        <a class="enl" href="/facturas/">Emitir uno nuevo →</a></p>
    </section>

    <section>
      <h3>Firmas</h3>
      <table><thead><tr><th>Firmante</th><th>Rol</th><th>Enviado</th><th>Estado</th></tr></thead>
        <tbody>${filasFirmas}</tbody></table>
    </section>

    <section>
      <h3>Documentación del comprador</h3>
      <table><thead><tr><th>Documento</th><th>De</th><th>Subido</th><th>Caduca</th></tr></thead>
        <tbody>${filasDocs}</tbody></table>
      <p class="nota">El pasaporte y el KYC son de la <b>persona</b>, no de una venta: salen en todas
        sus operaciones. Se suben desde <a class="enl" href="/compradores/">Compradores</a>.</p>
    </section>`;
  suiAbrirCajon({
    titulo: esc(titulo),
    sub: esc(op.proyecto_nombre || 'Sin proyecto') + ' · ' + esc(op.numero || 'sin nº')
         + (op.bloqueado ? ' · firmado y bloqueado' : ' · sin firmar')
         + (op.fecha_firma ? ' · ' + fFecha(op.fecha_firma) : ''),
    cuerpo: cuerpoFicha,
    pie: `<button class="sui-btn peligro" id="btnBorrarOp">Borrar operación</button>`,
    onCerrar: () => { SEL = null; pintarLista(); },
  });
  $('#btnBorrarOp').onclick = () => borrarOperacion(op);
}

/* ---------- borrar la operación entera ----------
   Una operación no es un contrato: es el padre, los que cuelgan de él, sus
   enlaces de firma y sus facturas. Lo hace la función `borrar_operacion` de la
   base porque son cuatro pasos que tienen que pasar TODOS o NINGUNO — a mitad
   de camino queda una operación con las facturas anuladas y los contratos
   todavía vivos, que es peor que no haber empezado.
   Las facturas se ANULAN, no se borran: un hueco en la serie fiscal no se puede
   explicar. Los enlaces de firma se anulan porque un token vivo de un contrato
   borrado es un documento que alguien puede firmar sin que nadie lo vea venir. */
async function borrarOperacion(op){
  const n = 1 + (op.hijos ? op.hijos.length : 0);
  const facturasVivas = op.facturas.filter(f => !f.anulada).length;
  const firmasVivas   = op.firmas.filter(f => f.estado === 'pendiente').length;
  const detalle = [
    n > 1 ? n + ' contratos (' + [op.numero, ...op.hijos.map(h => h.numero)].join(', ') + ')'
          : 'el contrato ' + (op.numero || 'sin nº'),
    firmasVivas ? firmasVivas + ' enlace(s) de firma quedarán ANULADOS' : null,
    facturasVivas ? facturasVivas + ' factura(s) quedarán ANULADAS (no se borran: la serie no puede tener huecos)' : null,
    'La parcela vinculada vuelve a estar disponible.',
  ].filter(Boolean);
  if(!confirm('¿Borrar la operación de ' + (op.comprador_nombre || 'sin comprador') + '?\n\n'
    + '· Se borra ' + detalle[0] + '\n'
    + detalle.slice(1).map(x => '· ' + x).join('\n')
    + '\n\nNo hay papelera.')) return;

  /* Los borradores de firma del ALMACENAMIENTO no los borra `borrar_operacion`:
     una función de la base no alcanza al bucket. Sin esto se quedaban ahí para
     siempre — medido el 4-ago-2026: 7 huérfanos de operaciones ya borradas.
     Las rutas se recogen AHORA, antes de la RPC: después, las filas que dicen
     dónde vive cada snapshot ya no existen.
     Solo `pendientes/`: el PDF firmado es el documento, y no se toca ni aunque
     la operación se borre. */
  const rutas = [...new Set(
    [op, ...(op.hijos || [])].flatMap(x =>
      ['pendientes/' + x.id + '.html', ...((x.firmas || []).map(f => f.snapshot_path))]
    ).filter(r => r && r.startsWith('pendientes/'))
  )];

  const b = $('#btnBorrarOp'); if(b) b.disabled = true;
  try{
    const { data, error } = await SB.rpc('borrar_operacion', { p_contrato_id: op.id });
    if(error) throw error;
    // DESPUÉS de que la RPC haya ido bien, nunca antes: si el borrado se para
    // (contrato firmado y no eres super admin), la operación sigue viva y su
    // enlace de firma tiene que seguir encontrando su documento. Es la misma
    // lección del 30-jul con RP00021, cuando anular antes de subir dejó un
    // contrato sin ningún enlace vivo.
    if(rutas.length){
      const { error: eSt } = await SB.storage.from('contratos-firmados').remove(rutas);
      // no se reintenta ni se para: la operación YA está borrada y un fichero
      // suelto en el bucket es basura, no un fallo que el operador deba resolver
      if(eSt) console.warn('Operación borrada; sus borradores de firma siguen en el almacenamiento:', eSt.message);
    }
    suiCerrarCajon();
    SEL = null;
    await cargar();
    toast('Operación borrada · ' + (data.contratos_borrados||0) + ' contrato(s), '
      + (data.facturas_anuladas||0) + ' factura(s) anulada(s)');
  }catch(e){
    // El mensaje de la función ya viene escrito para leerse (dice qué contrato
    // bloquea y por qué); se enseña tal cual en vez de envolverlo en jerga.
    toast(String(e.message || e));
    if(b) b.disabled = false;
  }
}

/* ---------- vencimientos ----------
   Dos relojes distintos en una sola pantalla: dinero que debería haber entrado
   y enlaces de firma que se van a apagar. Los dos se pierden de vista solos. */
function pintarVencimientos(){
  const fact = [];
  OPS.forEach(o => o.facturas.forEach(f => {
    if(f.anulada || f.tipo === 'proforma' || !f.venc) return;
    fact.push({ ...f, op:o, d: dias(f.venc) });
  }));
  fact.sort((a,b) => (a.d ?? 9e9) - (b.d ?? 9e9));

  const firmas = [];
  OPS.forEach(o => o.firmas.forEach(s => {
    if(s.estado !== 'pendiente') return;
    firmas.push({ ...s, op:o, d: dias(s.expira_en) });
  }));
  firmas.sort((a,b) => (a.d ?? 9e9) - (b.d ?? 9e9));

  const tagDias = d => d == null ? '—'
    : d < 0  ? '<span class="tag alerta">vencido hace ' + (-d) + ' d</span>'
    : d === 0 ? '<span class="tag alerta">vence hoy</span>'
    : d <= 15 ? '<span class="tag espera">en ' + d + ' d</span>'
    : '<span class="tag info">en ' + d + ' d</span>';

  $('#panelVenc').innerHTML = `
    <section>
      <h3>Cobros — documentos con vencimiento</h3>
      <table><thead><tr><th>Nº</th><th>Comprador</th><th>Vence</th><th class="num">Importe</th><th>Aviso</th></tr></thead>
      <tbody>${fact.length ? fact.map(f => `<tr>
        <td>${esc(f.numero || '—')}</td>
        <td>${esc(f.op.comprador_nombre || f.cliente_nombre || '—')}<div class="nota">${esc(f.op.numero || '')}</div></td>
        <td>${fFecha(f.venc)}</td>
        <td class="num">${esc(fmtMoneda(parseImporte(f.total), f.moneda || 'EUR'))}</td>
        <td>${tagDias(f.d)}</td></tr>`).join('')
        : '<tr><td colspan="5" class="nota">Ninguna factura tiene fecha de vencimiento puesta.</td></tr>'}</tbody></table>
      <p class="nota">Solo salen las que llevan vencimiento; es un campo opcional en Facturas.
        Una factura sin fecha no aparece aquí y no la reclama nadie.</p>
    </section>

    <section>
      <h3>Firmas — enlaces pendientes</h3>
      <table><thead><tr><th>Firmante</th><th>Contrato</th><th>Caduca</th><th>Aviso</th></tr></thead>
      <tbody>${firmas.length ? firmas.map(s => `<tr>
        <td>${esc(s.firmante_nombre || '—')}<div class="nota">${esc(s.firmante_email || '')}</div></td>
        <td>${esc(s.op.numero || '—')}<div class="nota">${esc(s.op.comprador_nombre || '')}</div></td>
        <td>${fFecha(s.expira_en)}</td>
        <td>${tagDias(s.d)}</td></tr>`).join('')
        : '<tr><td colspan="4" class="nota">No hay enlaces de firma pendientes.</td></tr>'}</tbody></table>
      <p class="nota">Un enlace caducado no se recupera: se genera otro desde Contratos.</p>
    </section>`;
}

suiMontarCajon();   // antes de atarle oyentes: si no, no existe todavía

/* ---------- eventos ---------- */
$('#listaOps').addEventListener('click', e => {
  const b = e.target.closest('[data-id]'); if(!b) return;
  SEL = b.dataset.id; pintarLista(); pintarDetalle();
});
// saltar entre los contratos de una operación sin recargar la página — el href
// con ?contrato= queda de respaldo (abrir en pestaña nueva sigue funcionando)
document.getElementById('suiCajon').addEventListener('click', async e => {
  const a = e.target.closest('[data-op]');
  if(a){ e.preventDefault(); SEL = a.dataset.op; pintarLista(); pintarDetalle(); return; }
  // documento emitido → visor compartido en modo SOLO DOCUMENTO (&vista=1):
  // desde aquí se consulta, no se edita; «Abrir completo» lleva a la herramienta
  const doc = e.target.closest('[data-doc]');
  if(doc){
    e.preventDefault();
    const href = doc.getAttribute('href');
    LW_VISOR.abrir(href + '&vista=1', doc.textContent.trim(), href);
    return;
  }
  // PDF firmado del contrato → URL firmada de corta vida en el mismo visor
  const pdf = e.target.closest('[data-pdf]');
  if(pdf){
    e.preventDefault();
    const { data, error } = await SB.storage.from('contratos-firmados').createSignedUrl(pdf.dataset.pdf, 3600);
    if(error || !data){ toast('No se pudo abrir el PDF: ' + (error && error.message || 'sin URL')); return; }
    LW_VISOR.abrir(data.signedUrl, 'PDF firmado');
  }
});
$('#q').addEventListener('input', pintarLista);
$('#filtros').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if(!b) return;
  FILTRO = b.dataset.f; pintarFiltros(); pintarLista();
});
$('#fProyecto').addEventListener('change', e => { PROYECTO = e.target.value; pintarLista(); });
$('#listaOps').addEventListener('click', e => {
  if(e.target.id !== 'limpiaFiltros') return;
  e.preventDefault();
  // hay que vaciar el <select> además de la variable: pintarFiltros() reconstruye
  // las opciones y REPONE la selección que siga en el DOM, así que sin esto el
  // proyecto elegido volvía y "quitar los filtros" solo quitaba la mitad
  FILTRO = ''; PROYECTO = ''; $('#q').value = ''; $('#fProyecto').value = '';
  pintarFiltros(); pintarLista();
});
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  const ops = t.dataset.tab === 'ops';
  $('#panelOps').classList.toggle('on', ops);
  $('#panelVenc').classList.toggle('on', !ops);
  // el detalle vive en el cajón: cambiar de pestaña lo cierra, o quedaría
  // abierto encima de los vencimientos
  if(!ops) suiCerrarCajon();
  if(!ops) pintarVencimientos();
}));
$('#btnRecargar').addEventListener('click', () => arrancar(true));

async function arrancar(recarga){
  try{
    await cargar();
    /* ?contrato=<id> abre esa operación directamente. Lo usa Compradores desde
       la lista de contratos de una persona. Solo la primera carga: en una
       recarga manual se respeta lo que el usuario tenga elegido. */
    if(!recarga){
      const pedido = new URLSearchParams(location.search).get('contrato');
      if(pedido && OPS.some(o => o.id === pedido)){ SEL = pedido; }
      else if(pedido) toast('Ese contrato ya no existe');
    }
    pintarFiltros(); pintarLista(); pintarDetalle();
    if($('#panelVenc').classList.contains('on')) pintarVencimientos();
    if(recarga) toast('Datos actualizados');
  }catch(err){
    $('#listaOps').innerHTML = '<p class="nota falta" style="padding:18px">No se pudieron cargar: ' + esc(err.message || err) + '</p>';
  }
}

/* guard.js ya comprobó la sesión y destapó la página; aquí solo se reusa su
   cliente para no abrir un segundo. */


window.LW_AUTH.then(({ sb, session }) => {
  SB = sb;
  $('#who').textContent = session.user.email;
  $('#btnLogout').onclick = async () => { await sb.auth.signOut(); location.replace('/contracts/login.html'); };
  arrancar(false);
});
</script>
