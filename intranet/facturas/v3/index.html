/* ═══════════════════════════════════════════════════════════════════════════
   FACTURAS v3 · el listado — 26-ago-2026
   ═══════════════════════════════════════════════════════════════════════════
   QUÉ SE REDISEÑA. Hoy el listado son 146 documentos en una fila plana,
   ordenados por fecha, con la misma tinta para el que se cobró hace un año y
   para el que venció hace tres semanas. Para saber qué se debe hay que abrir
   la calculadora. Y no hay ningún asidero: 146 filas iguales sin agrupar.

   Esta versión contesta por orden de urgencia:
     1. Cuatro cifras, y una es la que cuesta dinero: VENCIDO. Va en rojo y
        separada, porque «pendiente» y «pendiente y ya pasado el plazo» no son
        el mismo problema.
     2. Vencidas y sin cobrar, arriba y sin plegar. Es lo único de esta pantalla
        que se puede perder por no mirarlo.
     3. El resto agrupado POR MES con su subtotal. Una lista de 146 iguales no
        se recuerda; «agosto: 14 documentos, 320.000 €» sí.

   LO QUE NO SE TOCA: el editor de documentos. Es la máquina que compone el PDF,
   lo firma y lo manda por correo; rediseñarlo es otro encargo y con otro riesgo.
   «Nueva factura» lleva al de siempre.
   ═══════════════════════════════════════════════════════════════════════════ */

.kpi{ background:var(--sup-1,#fff); border:1px solid var(--linea,#E4DCCB);

.kpi .rot{ display:block; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;

/* ── §16.5 · PANTALLA ESTRECHA ───────────────────────────────────────────────
   El margen baja de 24 a 16 px y ahí se para: pegar el texto al canto se lee
   peor, y en un móvil con esquinas redondeadas la primera letra queda bajo la

    padding-left:max(16px, env(safe-area-inset-left));
    padding-right:max(16px, env(safe-area-inset-right));

  .doc{ grid-template-columns:minmax(0,1fr) 122px; gap:10px 12px; padding:13px 16px; }

  .doc .ir{ display:none; }

  .mes > .cab{ flex-wrap:wrap; gap:4px 12px; }
}
@media screen and (max-width:440px){

  .doc{ grid-template-columns:minmax(0,1fr) 108px; }
  .doc .quien{ white-space:normal; }
  .doc .ref{ white-space:normal; }
}
/* Misma red de seguridad que en Operaciones: un hijo de grid mide `auto` y
   empuja la página entera a lo ancho con un nombre largo. */
main, .dinero, .kpi, .alarma, .doc, .filas, .mes{ min-width:0; }
.kpi .n{ overflow-wrap:anywhere; }

  </div>

<script>
/* Todo dentro de su ámbito: la cáscara compartida declara bastantes nombres en
   el global y una colisión deja la página en blanco sin decirlo. */
(function(){
'use strict';
const $ = s => document.querySelector(s);
let SB = null, DOCS = [], PEND = {}, TIPO = '', ANUL = false, FILTRO = '';
/* 25 por página: con los meses de cabecera son unas 30 líneas, que es lo que
   cabe de un vistazo sin desplazarse tres pantallas. */
const POR_PAGINA = 25;
let PAGINA = 1;

const dinero = (n, m) => lwFormatoImporte(n || 0, m || 'EUR');
const HOY = new Date().toISOString().slice(0, 10);
const dias = f => Math.round((new Date(f) - Date.now()) / 86400000);
/* Dónde estás ahora, no una preferencia: `sessionStorage`, igual que en la
   herramienta viva y que en Proyectos. */
let VISTA = (() => { try{ return sessionStorage.getItem('lw_fact3_vista') || 'mes'; }catch(_){ return 'mes'; } })();

function pintarPorContrato(cont, lista){
  const grupos = lwAgrupaPorContrato(lista);
  const paginas = Math.max(1, Math.ceil(grupos.length / POR_PAGINA));
  if(PAGINA > paginas) PAGINA = paginas;
  const trozo = grupos.slice((PAGINA - 1) * POR_PAGINA, PAGINA * POR_PAGINA);
  cont.innerHTML = trozo.map(c => {
    /* «Sin contrato» no es un contrato: ni nombre de cliente ni cifra agregada.
       Doce documentos de gente distinta sumados dan un total que no existe. */
    if(c.sinContrato) return '<div class="mes"><div class="cab">'
      + '<span class="rot"><span class="sui-tag alerta">Sin contrato</span></span>'
      + '<span class="sub">' + c.docs.length + (c.docs.length === 1 ? ' documento' : ' documentos')
      + (c.variosClientes ? ' de varios clientes' : '') + ' · no son un contrato: no se suman entre sí</span></div>'
      + '<div class="filas">' + c.docs.map(f => filaDoc(f)).join('') + '</div></div>';
    const marca = c.cobradoSinFactura ? '<span class="sui-tag alerta">Cobrado sin factura</span>'
                : c.soloProforma      ? '<span class="sui-tag gris" title="Proforma del total emitida; ningún hito facturado todavía">Sin hitos facturados</span>'
                : c.sinRecibi         ? '<span class="sui-tag alerta">Sin recibí</span>' : '';
    const cifra = c.totalFacturado ? lwSumaTexto(c.facturado)
                : c.cobradoSinFactura ? lwSumaTexto(c.cobrado)
                : (Object.keys(c.proforma).length ? lwSumaTexto(c.proforma) : '—');
    const pie = c.totalFacturado
      ? lwSumaTexto(c.cobrado) + ' cobrado' + (c.unaMoneda ? ' · ' + c.pct.toFixed(0) + ' %' : '')
      : c.cobradoSinFactura ? 'cobrado, sin factura emitida'
      : (Object.keys(c.proforma).length ? 'en proforma, sin facturar' : '');
    return '<div class="mes"><div class="cab">'
      + '<span class="rot">' + esc(c.numero || '—') + ' ' + marca + '</span>'
      + '<span class="sub">' + esc(c.cliente || 'sin cliente') + ' · <b>' + esc(cifra) + '</b>'
      + (pie ? ' · ' + esc(pie) : '') + '</span></div>'
      + '<div class="filas">' + c.docs.map(f => filaDoc(f)).join('') + '</div></div>';
  }).join('')
  + LW3.paginador({ total:grupos.length, pagina:PAGINA, porPagina:POR_PAGINA });
  cablear(cont);
  LW3.cablearPaginador(cont, n => { PAGINA = n; pintar(); });
}

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const rotuloMes = k => { const [a, m] = k.split('-'); return MESES[+m - 1] + ' de ' + a; };
const nombreTipo = t => t === 'recibi' ? 'Recibí' : t === 'proforma' ? 'Proforma' : 'Factura';

/* Lo que queda por cobrar de un documento. Sale de `facturas_pendiente_equipo`,
   la MISMA función que usa el editor y el panel: aquí no se resta nada a mano.
   Un recibí no debe nada por definición — es la prueba de que el dinero entró. */
const pendienteDe = f => f.tipo === 'recibi' || f.anulada ? 0
  : (PEND[f.id] != null ? PEND[f.id] : (Number(f.total) || 0));

/* ── las cuatro cifras ────────────────────────────────────────────────────
   «Vencido» va aparte de «pendiente» a propósito: pendiente es el negocio
   funcionando; vencido es dinero que debería estar en la cuenta y no está. */
function pintarDinero(){
  /* QUÉ ENTRA EN ESTAS CIFRAS: SOLO FACTURAS.
     · Sin recibís — un recibí es el justificante de una factura que YA está
       contada aquí. Sumarlo sería contar el mismo dinero dos veces.
     · Sin proformas (27-ago-2026) — una proforma anuncia el TOTAL del proyecto
       y es informativa, sin validez fiscal. El cliente lo ha decidido con estas
       palabras: «que no cuenta en la contabilidad».

     Este bloque llevaba escrito desde que se montó la v3 que sacar las
     proformas «es una decisión de negocio» y que no se tomaba por cuenta
     propia. Ya está tomada, así que se aplica — y el porqué se queda escrito,
     que es lo que permite deshacerlo si el criterio cambia otra vez.

     No es solo cosmético: `PEND` viene de `facturas_pendiente_equipo()`, que
     solo devuelve filas de `tipo='factura'`. Para una proforma no había fila,
     así que `pendienteDe` caía a su importe ÍNTEGRO y las 116 proformas vivas
     engordaban «Pendiente» y podían aparecer en «Vencido» — reclamando un
     dinero que ningún documento fiscal ha pedido todavía. */
  const vivas     = DOCS.filter(f => !f.anulada && f.tipo === 'factura');
  const proformas = DOCS.filter(f => !f.anulada && f.tipo === 'proforma');
  /* POR MONEDA, y no en una sola cifra. La auditoría del 19-ago-2026 ya
     encontró exactamente este fallo en el listado de esta misma herramienta:
     sumaba EUR con USD y lo etiquetaba con la moneda de la primera fila, o sea
     un total que no existe en ninguna divisa. Al escribir esta v3 lo repetí,
     porque aquel arreglo vivía dentro de una función de una pantalla; ahora el
     ayudante está en dinero.js y lo usan las dos. */
  const emitido   = lwSumaPorMoneda(vivas, f => f.total, f => f.moneda);
  const pendiente = lwSumaPorMoneda(vivas, pendienteDe, f => f.moneda);
  const vencidas  = vivas.filter(f => f.venc && f.venc < HOY && pendienteDe(f) > 0.005);
  const vencido   = lwSumaPorMoneda(vencidas, pendienteDe, f => f.moneda);
  const sumaProf  = lwSumaPorMoneda(proformas, f => f.total, f => f.moneda);
  const cobrado = {};
  Object.keys(emitido).forEach(m => { cobrado[m] = emitido[m] - (pendiente[m] || 0); });

  const mp = lwMonedaPrincipal(emitido);
  const pctTxt = emitido[mp]
    ? (cobrado[mp] / emitido[mp] * 100).toFixed(1).replace('.', ',') + ' % de lo facturado'
      + (Object.keys(emitido).length > 1 ? ' en ' + mp : '')
    : '—';

  $('#dinero').innerHTML =
      /* Las proformas ya NO están dentro (ver arriba), pero se siguen diciendo:
         son el compromiso anunciado al cliente y no verlas por ningún lado haría
         pensar que se han perdido. Van como pie de la tarjeta —contexto— y no
         como cifra, que es exactamente su papel. */
      tarjeta('Facturado', lwSumaTexto(emitido),
        vivas.length + (vivas.length === 1 ? ' factura' : ' facturas')
        + (proformas.length
          ? ' · ' + proformas.length + ' proformas por ' + lwSumaTexto(sumaProf) + ', informativas'
          : ''), '')
    + tarjeta('Cobrado', lwSumaTexto(cobrado), pctTxt, 'cobrado')
    + tarjeta('Pendiente', lwSumaTexto(pendiente), 'aún dentro de plazo o sin fecha', '')
    + tarjeta('Vencido', lwSumaTexto(vencido),
        vencidas.length ? vencidas.length + (vencidas.length === 1 ? ' documento pasado de plazo' : ' documentos pasados de plazo') : 'nada fuera de plazo',
        Object.keys(vencido).length ? 'vencido' : '');
}
const tarjeta = (rot, n, pie, cls) =>
  '<div class="kpi ' + cls + '"><span class="rot">' + esc(rot) + '</span>'
  + '<span class="n">' + esc(n) + '</span><small>' + esc(pie) + '</small></div>';

/* ── vencidas y sin cobrar ────────────────────────────────────────────────
   Tres reglas, y ninguna esconde una deuda: un recibí no vence, una anulada no
   existe, y una cobrada es historia. Lo que queda sí se enseña, por vieja que
   sea — es justo lo que hay que ver. */
function pintarAlarma(){
  const malas = DOCS.filter(f => !f.anulada && f.tipo !== 'recibi' && f.venc && f.venc < HOY
                                 && pendienteDe(f) > 0.005)
                    .sort((a, b) => a.venc.localeCompare(b.venc));
  const caja = $('#alarma');
  if(!malas.length){ caja.hidden = true; return; }
  caja.innerHTML = '<h2>Vencidas y sin cobrar · ' + malas.length + '</h2>'
    + malas.map(f => filaDoc(f, true)).join('');
  caja.hidden = false;
  cablear(caja);
}

/* ── el resto, por mes ────────────────────────────────────────────────────── */
function casa(f){
  if(TIPO && f.tipo !== TIPO) return false;
  if(!ANUL && f.anulada) return false;
  const t = FILTRO.trim().toLowerCase();
  if(!t) return true;
  return [f.numero, f.cliente_nombre, f.contrato_numero, f.proyecto_nombre].join(' ').toLowerCase().includes(t);
}

function filaDoc(f, enAlarma){
  const p = pendienteDe(f);
  const tarde = f.venc && f.venc < HOY && p > 0.005;
  const d = f.venc ? dias(f.venc) : null;
  return '<div class="doc' + (f.anulada ? ' anul' : '') + '" data-id="' + esc(f.id) + '">'
    + '<span><span class="quien">' + esc(f.cliente_nombre || 'Sin cliente') + '</span>'
      + '<span class="ref">' + esc(f.numero || '—') + ' · ' + esc(nombreTipo(f.tipo))
      + (f.contrato_numero ? ' · ' + esc(f.contrato_numero) : '') + '</span></span>'
    + '<span class="imp ' + (tarde ? 'tarde' : p > 0.005 ? 'debe' : '') + '">' + esc(dinero(f.total, f.moneda))
      + (f.tipo === 'recibi' ? '<small>cobrado</small>'
         : p > 0.005 ? '<small>' + (tarde ? 'venció hace ' + (-d) + ' días'
                                          : d != null ? 'vence en ' + d + ' días' : 'sin fecha') + '</small>'
         : '<small>saldada</small>') + '</span>'
    + '<span class="est"><span class="sui-tag ' + (f.anulada ? 'alerta' : tarde ? 'alerta' : p > 0.005 ? 'espera' : 'ok') + '">'
      + (f.anulada ? 'Anulada' : tarde ? 'Vencida' : p > 0.005 ? 'Pendiente' : 'Cobrada') + '</span></span>'
    + (enAlarma ? '<i class="ph ph-arrow-right ir"></i>' : '<i class="ph ph-arrow-right ir"></i>')
    + '</div>';
}

function pintar(){
  const lista = DOCS.filter(casa);
  const cont = $('#meses');
  if(!lista.length){
    cont.innerHTML = '<div class="filas"><p class="vacio">Ningún documento coincide.</p></div>';
    return;
  }
  /* PAGINACIÓN sobre la lista filtrada, y los meses se pintan DENTRO de la
     página. Así el mes sigue sirviendo de asidero pero la pantalla no crece con
     los datos: 165 documentos hoy, y en enero los que sean.
     Al filtrar, la página vuelve a existir: si estabas en la 5 y el filtro deja
     dos, se cae a la última que hay en vez de enseñar el vacío. */
  const paginas = Math.max(1, Math.ceil(lista.length / POR_PAGINA));
  if(PAGINA > paginas) PAGINA = paginas;
  const trozo = lista.slice((PAGINA - 1) * POR_PAGINA, PAGINA * POR_PAGINA);

  /* ── POR CONTRATO ─────────────────────────────────────────────────────────
     La misma vista que la herramienta viva, y con LA MISMA PIEZA: las reglas
     —qué es «solo proforma», qué es «cobrado sin factura», cuándo hay
     porcentaje— viven en `assets/facturas_contratos.js`. Copiarlas aquí sería
     garantizar que se separen, y dos de ellas ya nacieron mal y se corrigieron
     con dinero delante.
     El agrupado por MES se queda como estaba: son dos preguntas distintas
     —«qué se emitió cuándo» y «cómo va cada contrato»— y las dos valen. */
  if(VISTA === 'contrato'){ pintarPorContrato(cont, lista); return; }

  const grupos = {};
  trozo.forEach(f => {
    const k = (f.fecha_emision || f.created_at || '').slice(0, 7) || 'sin-fecha';
    (grupos[k] = grupos[k] || []).push(f);
  });
  const claves = Object.keys(grupos).sort().reverse();
  cont.innerHTML = claves.map(k => {
    const g = grupos[k];
    const suma = lwSumaPorMoneda(g.filter(f => !f.anulada && f.tipo !== 'recibi'), f => f.total, f => f.moneda);
    const haySuma = Object.keys(suma).length;
    /* Sin `<details>`: dentro de una página de 25 no hay nada que plegar, y un
       plegado que a veces esconde una fila y a veces no es peor que ninguno. */
    return '<div class="mes"><div class="cab">'
      + '<span class="rot">' + esc(k === 'sin-fecha' ? 'Sin fecha' : rotuloMes(k)) + '</span>'
      + '<span class="sub">' + g.length + (g.length === 1 ? ' documento' : ' documentos')
      + (haySuma ? ' · <b>' + esc(lwSumaTexto(suma)) + '</b>' : '') + '</span></div>'
      + '<div class="filas">' + g.map(f => filaDoc(f)).join('') + '</div></div>';
  }).join('')
  + LW3.paginador({ total:lista.length, pagina:PAGINA, porPagina:POR_PAGINA });
  cablear(cont);
  LW3.cablearPaginador(cont, n => {
    PAGINA = n; pintar();
    cont.scrollIntoView({ block:'start', behavior: LW3.MENOS_MOV.matches ? 'auto' : 'smooth' });
  });
}
function cablear(raiz){
  raiz.querySelectorAll('.doc').forEach(el => {
    el.addEventListener('click', () => abrir(el.dataset.id));
  });
}

/* ── detalle ──────────────────────────────────────────────────────────────── */
const Cajon = (() => {
  const el = $('#cajon'), velo = $('#velo');
  LW3.cajon(el, { velo, aspa:'#cX' });
  const cerrar = () => { el.classList.remove('on'); velo.classList.remove('on'); };
  $('#cX').addEventListener('click', cerrar);
  velo.addEventListener('click', cerrar);
  addEventListener('keydown', e => { if(e.key === 'Escape') cerrar(); });
  return { abre(t, s, h){ $('#cTit').textContent = t; $('#cSub').textContent = s || '';
    $('#cCuerpo').innerHTML = h; el.classList.add('on'); velo.classList.add('on');
    $('#cX').focus({ preventScroll:true }); } };
})();

function abrir(id){
  const f = DOCS.find(x => x.id === id);
  if(!f) return;
  const p = pendienteDe(f);
  const tarde = f.venc && f.venc < HOY && p > 0.005;
  Cajon.abre(f.numero || 'Sin número', esc(nombreTipo(f.tipo)) + ' · ' + (f.cliente_nombre || 'sin cliente'),
      '<div class="bloque"><h4>Importe</h4>'
    + '<div class="dato"><span>Total</span><span class="v">' + esc(dinero(f.total, f.moneda)) + '</span></div>'
    + (f.tipo !== 'recibi'
        ? '<div class="dato"><span>Pendiente</span><span class="v" style="color:' + (tarde ? '#9E2F26' : p > 0.005 ? '#8C5E10' : 'inherit') + '">'
          + esc(dinero(p, f.moneda)) + '</span></div>' : '')
    + (f.venc ? '<div class="dato"><span>Vencimiento</span><span class="v">' + esc(f.venc)
        + (tarde ? ' · vencida' : '') + '</span></div>' : '')
    + '</div>'
    + '<div class="bloque"><h4>Referencias</h4>'
    + '<div class="dato"><span>Cliente</span><span class="v">' + esc(f.cliente_nombre || '—') + '</span></div>'
    + '<div class="dato"><span>Contrato</span><span class="v">' + esc(f.contrato_numero || '—') + '</span></div>'
    + '<div class="dato"><span>Emitida</span><span class="v">' + esc(f.fecha_emision || '—') + '</span></div>'
    + '<div class="dato"><span>Estado</span><span class="v">' + (f.anulada ? 'Anulada' : tarde ? 'Vencida' : p > 0.005 ? 'Pendiente' : 'Cobrada') + '</span></div>'
    + '</div>'
    + '<div class="bloque" style="display:flex;gap:10px;flex-wrap:wrap">'
      + '<a class="sui-btn primario" href="/intranet/facturas/?id=' + esc(f.id) + '">Abrir el documento</a>'
      + (f.contrato_id ? '<a class="sui-btn" href="/intranet/operaciones/">Ver la operación</a>' : '')
    + '</div>'
    + '<p class="mini" style="margin-top:16px">El documento se abre en el editor de siempre:'
    + ' es el que compone el PDF y lo manda. Esta pantalla solo cambia cómo se encuentran.</p>');
}

/* ── chips de tipo ───────────────────────────────────────────────────────── */
const TIPOS = [['', 'Todos'], ['factura', 'Facturas'], ['proforma', 'Proformas'], ['recibi', 'Recibís']];
function pintarChips(){
  $('#chips').innerHTML = TIPOS.map(([k, r]) => {
    const n = DOCS.filter(f => (!k || f.tipo === k) && (ANUL || !f.anulada)).length;
    return '<button type="button" class="sui-chip' + (TIPO === k ? ' on' : '') + '" data-t="' + k + '">'
      + esc(r) + ' <span class="n">' + n + '</span></button>';
  }).join('')
  + '<button type="button" class="sui-chip' + (ANUL ? ' on' : '') + '" data-anul="1" style="margin-left:8px">Con anuladas</button>';
  document.querySelectorAll('#vista [data-v]').forEach(b => {
    b.classList.toggle('on', b.dataset.v === VISTA);
    if(b._w) return; b._w = 1;
    b.addEventListener('click', () => {
      if(b.dataset.v === VISTA) return;
      VISTA = b.dataset.v;
      try{ sessionStorage.setItem('lw_fact3_vista', VISTA); }catch(_){}
      /* El paginador cuenta documentos en una vista y contratos en la otra: sin
         reiniciar se aterriza en la página 5 de algo que tiene dos. */
      PAGINA = 1;
      pintarChips(); pintar();
    });
  });
  $('#chips').querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => {
    TIPO = b.dataset.t; PAGINA = 1; pintarChips(); pintar();
  }));
  $('#chips').querySelector('[data-anul]').addEventListener('click', () => {
    ANUL = !ANUL; PAGINA = 1; pintarChips(); pintar();
  });
}

/* ── arranque ─────────────────────────────────────────────────────────────── */
window.LW_AUTH.then(async ({ sb }) => {
  SB = sb;
  const TOPE_DOCS = 5000;
  const [f, p, cuenta] = await Promise.all([
    /* `fecha_vencimiento` no es una columna: vive en `datos->fields`, igual que
       la lee la campana de la barra y el panel. Pedirla suelta da un 400 mudo. */
    /* 🔴 EL RECORTE SE ANUNCIA SIEMPRE. La herramienta viva llevaba `.limit(200)`
       sobre 279 documentos y escondía 70 vigentes y 1.676.977 € de la suma que
       presentaba como total (arreglado hoy). Aquí el tope era 1000 —hoy no
       muerde— pero es el mismo silencio esperando a crecer, y esta pantalla sale
       a producción sin ese arreglo si no se trae. Se pide la CUENTA EXACTA y se
       compara con lo que ha llegado: es la única medida que no depende de
       adivinar dónde está el techo (un `limit(N+1)` falla si PostgREST recorta
       antes por su `max-rows`). */
    SB.rpc('facturas_equipo').select('id,numero,tipo,contrato_id,contrato_numero,cliente_nombre,proyecto_nombre,total,moneda,anulada,fecha_emision,created_at,venc:datos->fields->>fecha_vencimiento')
      .order('fecha_emision', { ascending:false }).limit(TOPE_DOCS),
    SB.rpc('facturas_pendiente_equipo'),
    /* La cuenta va por el MISMO camino que la lista (el RPC del equipo), no
       contra la tabla: si contara la tabla y la RLS enseñara menos, el aviso
       saltaría siempre y se aprendería a ignorarlo — que es como muere un
       aviso. */
    SB.rpc('facturas_equipo', {}, { count:'exact', head:true }),
  ]);
  if(f.error){
    $('#avisos').innerHTML = '<p class="sui-aviso">No se han podido leer los documentos: ' + esc(f.error.message) + '</p>';
    return;
  }
  /* `null` si la cuenta no contestó: no saber y estar completo son cosas
     distintas, y solo una de las dos permite callarse. */
  const hay = (cuenta && typeof cuenta.count === 'number') ? cuenta.count : null;
  if(hay !== null && hay > (f.data || []).length){
    $('#avisos').innerHTML = '<p class="sui-aviso">⚠️ Faltan ' + (hay - (f.data || []).length)
      + ' documentos: esta pantalla enseña los ' + (f.data || []).length
      + ' más recientes y las sumas son solo de esos.</p>';
  }
  /* Si falla lo pendiente NO se enseña un cero: sin ese dato no se sabe qué se
     debe, y decir «cobrado» sin saberlo es el único error aquí que cuesta
     dinero. Se avisa y cada documento cae a «debe su total». */
  if(p.error){
    $('#avisos').innerHTML = '<p class="sui-aviso">No se ha podido calcular lo cobrado de cada documento.'
      + ' Los importes pendientes de abajo son el total de cada uno, no lo que queda: no te fíes de ellos hasta recargar.</p>';
  }
  DOCS = f.data || [];
  (p.data || []).forEach(x => { PEND[x.factura_id] = Number(x.pendiente) || 0; });

  pintarDinero(); pintarAlarma(); pintarChips(); pintar();

  let t = null;
  $('#q').addEventListener('input', e => { FILTRO = e.target.value; PAGINA = 1; clearTimeout(t); t = setTimeout(pintar, 90); });
});
})();
</script>
