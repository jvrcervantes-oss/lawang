<style>
/* ═══════════════════════════════════════════════════════════════════════════
   PROYECTOS v3 · el inventario — 26-ago-2026
   ═══════════════════════════════════════════════════════════════════════════
   EL TRABAJO, en palabras del owner: «es un inventario del proyecto». Hoy son
   375 filas de once columnas —código, fase, zona, modelo, m², suelo,
   construcción, total, contrato, estado— ordenadas por código y sin agrupar. Un
   inventario contesta tres preguntas y ninguna se ve: cuánto hay, cuánto queda
   libre, y de quién es lo vendido.

   Aquí la unidad de la lista es el PROYECTO. Cada uno con su recuento y su
   dinero, y dentro sus unidades con el comprador y cuánto va cobrado. Las once
   columnas de atributos se quedan en el detalle, que es donde se consultan: al
   abrir una unidad concreta, no al recorrer el listado.

   El % cobrado se pinta como barra y no como número: en un inventario lo que se
   compara de un vistazo es «cuál va más adelantada», y para eso una barra se
   lee sin leer.
   ═══════════════════════════════════════════════════════════════════════════ */
body{ margin:0; background:var(--sup-0,#F1EBDD); color:var(--texto,#22282A);
      font-family:var(--sans,'Jost',system-ui,sans-serif); }
main{ max-width:1160px; margin:0 auto; padding:24px 24px 80px; }

.controles{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 8px; }
.controles .sui-buscar{ flex:1 1 240px; }
.chips{ display:flex; gap:8px; flex-wrap:wrap; margin:0 0 18px; }

.proy{ background:var(--sup-1,#fff); border:1px solid var(--linea,#E4DCCB); border-radius:var(--r-l,18px);
       box-shadow:var(--sombra-1); margin:0 0 14px; overflow:hidden; }
.proy > summary{ list-style:none; cursor:pointer; display:grid;
                 grid-template-columns:minmax(0,1fr) auto; gap:14px; align-items:center; padding:15px 18px; }
.proy > summary::-webkit-details-marker{ display:none; }
/* Carpeta sin unidades: un hueco por rellenar, no un proyecto más. Pesa menos
   —fondo del lienzo, sin sombra, una línea de alto— porque 18 de las 29 lo
   están y con el peso de las llenas enterrarían el inventario real. §12: el
   material dice la jerarquía antes de que se lea una palabra. */
.proy.vacia{ background:transparent; box-shadow:none; border-style:dashed; margin-bottom:8px; }
.proy.vacia > summary{ padding:11px 18px; }
.proy.vacia .nom{ font-weight:500; color:var(--texto-2,#4A5052); }
.proy.vacia .cuenta{ margin-top:2px; font-size:.75rem; opacity:.75; }
.proy.vacia .vacio{ padding:0 18px 13px; font-size:.8rem; color:var(--texto-2,#4A5052);
                    background:none; border:0; border-radius:0; }
.proy .nom{ font-size:1rem; font-weight:600; letter-spacing:-.01em; }
.proy .cuenta{ display:block; margin-top:4px; font-size:.78rem; color:var(--texto-2,#4A5052); }
.proy .cuenta b{ color:var(--bien,#3F5230); }
.proy .plata{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.proy .plata .n{ font-family:'Instrument Sans',system-ui,sans-serif; font-weight:700; font-size:1.06rem;
                 letter-spacing:-.02em; color:var(--dl,#104C4F); }
.proy .plata small{ display:block; margin-top:3px; font-size:.72rem; color:var(--texto-2,#4A5052); }
.proy .barraP{ grid-column:1 / -1; height:6px; border-radius:999px; background:#EAE4D3; overflow:hidden; margin-top:4px; }
.proy .barraP i{ display:block; height:100%; border-radius:999px; background:var(--tg,#485B37); }

.uni{ display:grid; grid-template-columns:76px minmax(0,1fr) 150px 120px 20px; gap:14px; align-items:center;
      padding:11px 18px; border-top:1px solid var(--linea,#E4DCCB); cursor:pointer; }
.uni:hover{ background:var(--sup-2,#F7F3E9); }
.uni .cod{ font-weight:600; font-size:.86rem; font-variant-numeric:tabular-nums; }
.uni .quien{ font-size:.86rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.uni .quien small{ display:block; margin-top:2px; font-size:.73rem; color:var(--texto-2,#4A5052); }
.uni .cobro .b{ height:6px; border-radius:999px; background:#EAE4D3; overflow:hidden; }
.uni .cobro .b i{ display:block; height:100%; border-radius:999px; background:var(--tg,#485B37); }
.uni .cobro .t{ display:block; margin-top:4px; font-size:.72rem; color:var(--texto-2,#4A5052); font-variant-numeric:tabular-nums; }
.uni .precio{ text-align:right; font-variant-numeric:tabular-nums; font-size:.84rem; font-weight:600; white-space:nowrap; }
.uni > i{ color:var(--sc,#8F9B7A); justify-self:end; }
.uni.libre .quien{ color:var(--texto-3,#676B63); }

.vacio{ padding:26px 18px; color:var(--texto-2,#4A5052); font-size:.86rem;
        background:var(--sup-1,#fff); border:1px solid var(--linea,#E4DCCB); border-radius:var(--r-l,18px); }
.mini{ font-size:.78rem; color:var(--texto-2,#4A5052); line-height:1.5; }
#cajon .cuerpo{ overflow:auto; padding:0 20px 24px; }
#cajon h3{ margin:0; font-size:1.02rem; letter-spacing:-.012em; }
#cajon .sub{ font-size:.78rem; color:var(--texto-2,#4A5052); margin-top:3px; }
.bloque{ margin-top:20px; }
.bloque > h4{ margin:0 0 8px; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
              font-weight:600; color:var(--texto-2,#4A5052); }
.dato{ display:flex; justify-content:space-between; gap:12px; padding:9px 0;
       border-top:1px solid var(--linea,#E4DCCB); font-size:.85rem; }
.dato:first-of-type{ border-top:0; }
.dato .v{ font-weight:600; font-variant-numeric:tabular-nums; }

@media screen and (max-width:820px){
  main{ padding-left:max(16px, env(safe-area-inset-left));
        padding-right:max(16px, env(safe-area-inset-right)); padding-top:18px; padding-bottom:56px; }
  .uni{ grid-template-columns:66px minmax(0,1fr) 104px; gap:10px 12px; padding:11px 14px; }
  .uni .cobro{ grid-column:2; }
  .uni .precio{ grid-column:3; grid-row:1; }
  .uni > i{ display:none; }
  .proy > summary{ grid-template-columns:1fr; }
  .proy .plata{ text-align:left; }
}
@media screen and (max-width:440px){ .uni{ grid-template-columns:60px minmax(0,1fr); } .uni .precio{ grid-column:2; grid-row:auto; } }
main, .proy, .uni, .uni .quien{ min-width:0; }
</style>

<body>

<!-- ACCIONES. La principal va la ÚLTIMA de la barra y es «Nueva unidad»: es
     la frecuente. Crear un proyecto se hace una vez por proyecto y el CSV es
     un lote — los dos secundarios. Norma en `assets/topbar.css` junto a
     `.lw-btn.primary`, y el porqué de que la barra lleve UNA sola. -->
<header class="lw-topbar" data-titulo="Proyectos">
  <div class="lw-spacer"></div>
  <button type="button" class="lw-btn" id="btnCsv"><i class="ph ph-upload-simple"></i>Importar CSV</button>
  <input type="file" id="fileCsv" accept=".csv,text/csv" hidden>
  <button type="button" class="lw-btn" id="btnNuevoProyecto"><i class="ph ph-folder-plus"></i>Nuevo proyecto</button>
  <button type="button" class="lw-btn primary" id="btnNuevaUnidad"><i class="ph ph-plus"></i>Nueva unidad</button>
</header>

<main>
  <div id="avisos"></div>
  <div class="controles">
    <input class="sui-buscar" id="q" placeholder="Buscar código, comprador o modelo…">
  </div>
  <div class="chips" id="chips"></div>
  <div id="lista"></div>
</main>

<div class="sui-velo" id="velo"></div>
<aside class="sui-cajon" id="cajon" role="dialog" aria-modal="true" aria-labelledby="cTit">
  <div class="sui-cajon-cab">
    <div style="min-width:0"><h3 id="cTit">—</h3><div class="sub" id="cSub"></div></div>
    <button type="button" class="sui-cajon-x" id="cX" aria-label="Cerrar">✕</button>
  </div>
  <div class="cuerpo" id="cCuerpo"></div>
</aside>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
let UNI = [], FILTRO = '', ESTADO = '';
const dinero = (n, m) => lwFormatoImporte(n || 0, m || 'EUR');
const num = v => Number(v) || 0;

const ESTADOS = [
  ['', 'Todas', () => true],
  ['disponible', 'Libres', u => u.estado === 'disponible'],
  ['vendida', 'Vendidas', u => u.estado && u.estado !== 'disponible'],
  ['obra', 'En obra', u => u.obra_fase && u.obra_fase !== 'entregada'],
];

function casa(u){
  const fn = (ESTADOS.find(e => e[0] === ESTADO) || ESTADOS[0])[2];
  if(!fn(u)) return false;
  const t = FILTRO.trim().toLowerCase();
  if(!t) return true;
  return [u.codigo, u.comprador_nombre, u.modelo, u.contrato_numero, u.proyecto]
    .join(' ').toLowerCase().includes(t);
}

function pintarChips(){
  $('#chips').innerHTML = ESTADOS.map(([k, r, fn]) => {
    const n = UNI.filter(fn).length;
    return '<button type="button" class="sui-chip' + (ESTADO === k ? ' on' : '') + (n ? '' : ' vacio')
      + '" data-k="' + k + '">' + esc(r) + ' <span class="n">' + n + '</span></button>';
  }).join('');
  $('#chips').querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
    ESTADO = b.dataset.k; pintarChips(); pintar();
  }));
}

function filaUnidad(u){
  const precio = num(u.precio);
  /* 🔴 EL PORCENTAJE NO SE RECORTA A 100 (26-ago-2026, arreglado antes hoy en
     Facturas y traído aquí). Cobrar MÁS de lo contratado es una NOTICIA —falta
     una factura, hay un cobro duplicado o el precio cambió y nadie lo actualizó—
     y un `Math.min(100, …)` la convierte en una operación perfectamente cerrada.
     Se enseña el número real; lo que se limita es el ANCHO de la barra, que es
     dibujo. En las herramientas vivas el clamp ya estaba solo en el `width:`,
     que es lo correcto; en v3 se coló también en el texto. */
  const pct = Math.max(0, num(u.pct_cobrado));
  const libre = u.estado === 'disponible';
  return '<div class="uni' + (libre ? ' libre' : '') + '" data-id="' + esc(u.id) + '">'
    + '<span class="cod">' + esc(u.codigo || '—') + '</span>'
    + '<span class="quien">' + esc(u.comprador_nombre || (libre ? 'Disponible' : 'Sin comprador'))
      + '<small>' + esc(u.modelo || u.tipo || '') + (u.contrato_numero ? ' · ' + esc(u.contrato_numero) : '') + '</small></span>'
    + '<span class="cobro">'
      + (libre ? '<span class="t">sin vender</span>'
               : '<span class="b"><i style="width:' + Math.min(100, pct).toFixed(0) + '%"></i></span>'
                 + '<span class="t">' + pct.toFixed(0) + ' % cobrado</span>')
      + '</span>'
    + '<span class="precio">' + (precio ? esc(dinero(precio, u.moneda)) : '—') + '</span>'
    + '<i class="ph ph-arrow-right"></i></div>';
}

/* Carpetas abiertas en ESTA pestaña. Ver la nota de `<details>` más abajo. */
const ABIERTAS = new Set((() => {
  try{ return JSON.parse(sessionStorage.getItem('lw_proy_abiertas') || '[]'); }
  catch(_){ return []; }
})());

function pintar(){
  const lista = UNI.filter(casa);
  const cont = $('#lista');
  const grupos = {};
  /* 🔴 UNA CARPETA SALE DEL CATÁLOGO, NO DE SUS UNIDADES (26-ago-2026, owner:
     «en la v2 hay muchísimos más proyectos que en v3 aunque vacíos, por qué no
     salen sus carpetas?»). Agrupando solo lo que devuelve `unidades` un proyecto
     recién dado de alta NO EXISTE hasta que alguien le mete la primera parcela:
     29 proyectos activos, 11 con unidades, y v3 enseñaba once. Justo al revés de
     lo que hace falta, porque la carpeta vacía es la que te recuerda que queda
     inventario por cargar. La herramienta viva ya lo hacía así (`nombres` =
     catálogo ∪ unidades); esto la iguala, que es lo que pide la Regla 0 bis.
     CON FILTRO NO: si buscas «riverfront» o pinchas «Vendidas», 18 carpetas a
     cero son ruido — ninguna puede casar. Sin filtro, la vista ES el catálogo. */
  if(!ESTADO && !FILTRO.trim()) PROYECTOS.forEach(n => { grupos[n] = []; });
  lista.forEach(u => { const k = u.proyecto || 'Sin proyecto'; (grupos[k] = grupos[k] || []).push(u); });
  if(!Object.keys(grupos).length){ cont.innerHTML = '<div class="vacio">Ninguna unidad coincide.</div>'; return; }
  /* 🔴 LAS PARCELAS SE ORDENAN COMO NÚMEROS, NO COMO TEXTO (26-ago-2026).
     Salían SH-1, SH-10, SH-100, SH-101… porque venían en el orden de la consulta:
     `.order('codigo')` de Postgres compara cadenas, y para el texto «10» va antes
     que «2». En un inventario de 228 unidades eso significa bajar cien filas para
     encontrar la SH-2, y que dos parcelas contiguas en el plano no lo estén en la
     lista. `suiOrdenarPorCodigo` es la pieza compartida — la misma que usan Obra
     y el selector de parcela. */
  Object.keys(grupos).forEach(k => { grupos[k] = suiOrdenarPorCodigo(grupos[k]); });
  /* Por número de unidades: un inventario se ordena por tamaño, no por
     alfabeto — lo primero que se quiere ver es dónde está el grueso. */
  const claves = Object.keys(grupos).sort((a, b) => grupos[b].length - grupos[a].length || a.localeCompare(b, 'es'));

  cont.innerHTML = claves.map((k, i) => {
    const g = grupos[k];
    const libres = g.filter(u => u.estado === 'disponible').length;
    const cartera = g.reduce((a, u) => a + num(u.precio), 0);
    const cobrado = g.reduce((a, u) => a + num(u.facturado), 0);
    const pct = cartera ? cobrado / cartera * 100 : 0;
    /* Por moneda: una carpeta puede mezclar divisas —Riverfront esta en IDR— y
       tomar la de la primera unidad da una cifra que no existe en ninguna.
       Misma pieza que la version viva (`lwSumaPorMoneda`/`lwSumaTexto`). */
    const carteraTxt = lwSumaTexto(lwSumaPorMoneda(g, u => num(u.precio), u => u.moneda));
    const cobradoTxt = lwSumaTexto(lwSumaPorMoneda(g, u => num(u.facturado), u => u.moneda));
    /* CARPETAS PRIMERO — vuelve a ser el estado de entrada (26-ago-2026, owner:
       «incorpora la vista por carpetas como por defecto, como estaba»).
       Antes se abrían los dos primeros, y con eso lo que se veía al entrar era
       una lista de 375 unidades con títulos por medio: la vista de carpetas
       existía pero no se llegaba a ver.
       §16.6 (simplicidad, no minimalismo): el camino común primero —¿qué
       proyectos hay y cómo van— y el detalle un nivel más adentro. La carpeta ya
       dice lo que hace falta para decidir si entras: unidades, libres, vendidas,
       cartera y % cobrado.
       §5 (flexibilidad) + §2 (agencia): lo que abras se recuerda MIENTRAS DURE
       la pestaña. `sessionStorage` y no `localStorage` a propósito, igual que la
       vista de la herramienta viva: abrir una carpeta es dónde estás ahora, no
       una preferencia que deba sobrevivir a mañana. */
    /* UNA CARPETA VACÍA NO ES UNA CARPETA MÁS: es un hueco por rellenar, y se
       pinta como tal —una línea, sin barra, sin cifras de cero—. Con 18 de 29
       vacías, darles el mismo peso que a Sumba Hills enterraría el inventario
       real bajo una pantalla de placeholders. §16.6: jerarquía, no minimalismo.
       Y «0 libres» en verde negrita es peor que no decir nada: pinta de buena
       noticia lo que solo es ausencia de dato. */
    return '<details class="proy' + (g.length ? '' : ' vacia') + '" data-proy="' + esc(k) + '"' + (ABIERTAS.has(k) ? ' open' : '') + '>'
      + '<summary><span><span class="nom">' + esc(k) + '</span>'
        + '<span class="cuenta">' + (g.length
            ? g.length + (g.length === 1 ? ' unidad' : ' unidades')
              + ' · <b>' + libres + ' libre' + (libres === 1 ? '' : 's') + '</b>'
              + ' · ' + (g.length - libres) + ' vendida' + ((g.length - libres) === 1 ? '' : 's')
            : 'Sin unidades todavía') + '</span></span>'
      /* Una carpeta sin unidades NO vale «0,00 EUR»: eso afirma una cartera de
         cero euros, cuando lo cierto es que todavía no hay dato — y de paso se
         inventa una moneda que nadie ha elegido. Un guion no miente. */
      + (g.length
          ? '<span class="plata"><span class="n">' + esc(carteraTxt) + '</span>'
              + '<small>' + esc(cobradoTxt) + ' cobrado · ' + pct.toFixed(0) + ' %</small></span>'
            + '<span class="barraP"><i style="width:' + Math.min(100, pct).toFixed(1) + '%"></i></span>'
          : '<span class="plata"></span>')
      + '</summary>'
      + (g.length ? g.map(filaUnidad).join('')
                  : '<div class="vacio">Cárgalas con «Importar CSV» o con «+ Unidad», arriba.</div>')
      + '</details>';
  }).join('');

  cont.querySelectorAll('.uni').forEach(el => el.addEventListener('click', () => abrir(el.dataset.id)));
  /* Se apunta lo que el operador abre y se restituye al repintar: sin esto, un
     filtro o una búsqueda cerraban de golpe la carpeta que estaba mirando. */
  cont.querySelectorAll('details.proy').forEach(d => d.addEventListener('toggle', () => {
    d.open ? ABIERTAS.add(d.dataset.proy) : ABIERTAS.delete(d.dataset.proy);
    try{ sessionStorage.setItem('lw_proy_abiertas', JSON.stringify([...ABIERTAS])); }catch(_){}
  }));
}

const Cajon = (() => {
  const el = $('#cajon'), velo = $('#velo');
  LW3.cajon(el, { velo, aspa:'#cX' });
  const cerrar = () => { el.classList.remove('on'); velo.classList.remove('on'); };
  $('#cX').addEventListener('click', cerrar);
  velo.addEventListener('click', cerrar);
  addEventListener('keydown', e => { if(e.key === 'Escape') cerrar(); });
  return { cierra: cerrar,
    abre(t, s, h){ $('#cTit').textContent = t; $('#cSub').textContent = s || '';
    $('#cCuerpo').innerHTML = h; el.classList.add('on'); velo.classList.add('on');
    $('#cX').focus({ preventScroll:true }); } };
})();

function abrir(id){
  const u = UNI.find(x => x.id === id);
  if(!u) return;
  const d = (k, v) => v == null || v === '' ? '' :
    '<div class="dato"><span>' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>';
  const precio = num(u.precio), cob = num(u.facturado);
  Cajon.abre(u.codigo || 'Unidad', u.proyecto || '',
      '<div class="bloque"><h4>Estado</h4>'
    + d('Situación', u.estado === 'disponible' ? 'Disponible' : (u.estado || '—'))
    + d('Comprador', u.comprador_nombre)
    + d('Contrato', u.contrato_numero ? u.contrato_numero + (u.contrato_firmado ? ' · firmado' : ' · sin firmar') : null)
    + d('Fase de obra', u.obra_fase)
    + d('Entrega estimada', u.obra_fecha_entrega)
    + '</div>'
    + '<div class="bloque"><h4>Dinero</h4>'
    + d('Precio', precio ? dinero(precio, u.moneda) : 'sin fijar')
    + d('Cobrado', dinero(cob, u.moneda))
    + d('Pendiente', precio ? dinero(Math.max(0, precio - cob), u.moneda) : '—')
    + '</div>'
    /* Los once atributos del listado viejo viven AQUÍ: se consultan al abrir una
       unidad concreta, no al recorrer trescientas. */
    + '<div class="bloque"><h4>La unidad</h4>'
    + d('Tipo', u.tipo) + d('Modelo', u.modelo)
    + d('Superficie', u.superficie_m2 ? u.superficie_m2 + ' m²' : null)
    + d('Suelo', u.precio_suelo ? dinero(num(u.precio_suelo), u.moneda) : null)
    + d('Construcción', u.precio_construccion ? dinero(num(u.precio_construccion), u.moneda) : null)
    + d('Fase masterplan', u.fase_masterplan) + d('Zona', u.zona_masterplan)
    + (u.notas ? '<p class="mini" style="margin-top:10px">' + esc(u.notas) + '</p>' : '')
    + '</div>'
    + '<div class="bloque" style="display:flex;gap:10px;flex-wrap:wrap">'
      + '<a class="sui-btn" href="/intranet/proyectos/">Editarla en Proyectos</a>'
      + (u.contrato_id ? '<a class="sui-btn" href="/contracts/app.html?contrato=' + esc(u.contrato_id) + '">Abrir el contrato</a>' : '')
    + '</div>');
}

/* ═══════════════════════════════════════════════════════════════════════════
   LAS TRES ALTAS — 26-ago-2026
   ═══════════════════════════════════════════════════════════════════════════
   Nuevo proyecto, importar CSV y nueva unidad. Lo que NO se hace aquí es
   reimplementar sus reglas: el análisis del CSV y el allowlist de escritura
   viven en `contracts/assets/proyectos_csv.js`, la misma pieza que usa la
   herramienta viva. Copiarlas habría sido la copia número dos de una lista de
   alias que ya ha crecido tres veces por sorpresa.
   Lo que sí es de esta pantalla: cómo lo pinta. La previsualización y el
   formulario van en el CAJÓN que la v3 ya tiene —con su muelle, su velo y su
   arrastre— en vez de un `prompt()`, que es lo que usa hoy la viva y que la
   propia norma de la suite prohíbe: un diálogo nativo congela el hilo y deja
   muda la extensión de Chrome desde la que se opera. */
let SB = null, PROYECTOS = [], TIPOS = [];

async function recargar(){
  const { data } = await SB.from('unidades_estado').select('*').order('proyecto').order('codigo');
  UNI = data || [];
  pintarChips(); pintar();
}

/* ── nueva unidad y nuevo proyecto: SE ENGANCHA EL DE SIEMPRE ─────────────
   26-ago-2026, corrección del owner: «es algo que teníamos funcionando, no debes
   rehacerlo, debes enganchar lo que teníamos antes».
   Aquí hubo un formulario nuevo con seis campos. El de la herramienta viva tiene
   diecinueve, con el precio por m² que se autocalcula, el modelo por proyecto,
   las notas, la fase y la zona del masterplan, y las reglas de estado y contrato.
   O sea que «rehacerlo» no fue rehacerlo: fue perder dos tercios de la pantalla
   sin que se notara hasta usarla.
   La regla, dicha por él y que va al prompt del departamento: rehacer una
   versión de DISEÑO es mantener todas las funcionalidades y botones y cambiar
   cómo se ven. No es volver a escribir lo que ya funciona.
   `/intranet/proyectos/` expone desde hoy `?nueva=1` y `?nuevoproyecto=1` para esto. */
const abreEnLaViva = destino => { location.href = destino; };

/* ── importar CSV ─────────────────────────────────────────────────────────── */
async function importarCsvUI(file){
  if(file.size > LW_CSV_MAX_BYTES){
    toast('El fichero pesa ' + (file.size/1024/1024).toFixed(1) + ' MB — el máximo son 5 MB');
    return;
  }
  const r = lwCsvAnaliza(await file.text(), {
    tipos: TIPOS.map(t => t[0]), proyectos: PROYECTOS,
    existentes: new Set(UNI.map(u => u.proyecto + ' ' + u.codigo)),
    parseImporte: lwParseImporte,
  });
  if(r.error){ toast(r.error); return; }

  /* El resumen ANTES de la tabla, y con los errores contados: lo que se decide
     aquí es «¿confirmo esto?», y eso se decide con cuatro números, no leyendo
     500 filas. La tabla queda debajo para el que quiera comprobar. */
  /* La previsualización tiene que enseñar lo que se va a ESCRIBIR, no una sola
     columna. Un CSV de Notion trae `Land` y `Villa` (suelo y construcción) y
     ninguna columna de total: mirando solo `precio` la fila salía con un «—»
     como si no trajera importes, cuando trae dos. Se enseña el total si viene, y
     si no sus partes. */
  const fmt = n => n == null ? '—' : esc(lwFormatoImporte(n, 'EUR'));
  const importeDe = f => {
    if(f.precio != null) return fmt(f.precio);
    const partes = [];
    if(f.precio_suelo != null) partes.push('suelo ' + fmt(f.precio_suelo));
    if(f.precio_construccion != null) partes.push('obra ' + fmt(f.precio_construccion));
    return partes.length ? partes.join(' + ') : '—';
  };
  Cajon.abre('Importar CSV', file.name,
    '<div class="bloque"><div class="sui-resumen">'
      + '<span><b>' + r.analizadas.length + '</b> filas leídas</span>'
      + '<span><b>' + r.altas + '</b> altas nuevas</span>'
      + '<span><b>' + r.actualiza + '</b> actualizan una existente</span>'
      + (r.conError ? '<span style="color:#9E2F26"><b>' + r.conError + '</b> con error, no se importan</span>' : '')
    + '</div>'
    + (r.ignoradas.length ? '<p class="mini" style="margin-top:8px">Columnas ignoradas (no se guardan hoy): '
        + r.ignoradas.map(esc).join(', ') + '</p>' : '')
    + '</div>'
    + '<div class="bloque" style="display:flex;gap:10px">'
      + '<button type="button" class="sui-btn primario" id="csv-ok"' + (r.validas.length ? '' : ' disabled') + '>'
      + (r.validas.length ? 'Confirmar (' + r.validas.length + ')' : 'Nada que importar') + '</button>'
    + '</div>'
    + '<div class="bloque" style="max-height:46vh;overflow:auto"><table class="sui-tabla"><thead><tr>'
      + '<th>Fila</th><th>Código</th><th>Proyecto</th><th class="num">Precio</th><th>Estado</th>'
    + '</tr></thead><tbody>'
    + r.analizadas.map(f => '<tr>'
        + '<td>' + f.fila + '</td><td class="clave">' + esc(f.codigo || '—') + '</td>'
        + '<td>' + esc(f.proyecto || '—') + '</td><td class="num">' + importeDe(f) + '</td>'
        + '<td>' + (f.errores.length
            ? '<span style="color:#9E2F26">' + esc(f.errores.join('; ')) + '</span>'
            : (f.esAlta ? 'Alta nueva' : 'Actualiza')) + '</td></tr>').join('')
    + '</tbody></table></div>');

  const ok = $('#csv-ok');
  if(!ok || ok.disabled) return;
  ok.addEventListener('click', async () => {
    ok.disabled = true; ok.textContent = 'Importando…';
    /* El allowlist es el de la pieza compartida: exactamente estas claves, y
       solo las que el CSV traía. Ver su nota — mandar `precio_suelo:null`
       porque el fichero no traía la columna BORRA un precio real. */
    const filas = lwCsvFilasParaGuardar(r.validas, r.camposPresentes);
    const { error } = await SB.from('unidades').upsert(filas, { onConflict: 'proyecto,codigo' });
    if(error){ toast('No se pudo importar: ' + error.message); ok.disabled = false; ok.textContent = 'Reintentar'; return; }
    toast('Importadas ' + filas.length + ' unidades');
    Cajon.cierra();
    await recargar();
  });
}

window.LW_AUTH.then(async ({ sb }) => {
  SB = sb;
  /* `unidades_estado` es la vista que la propia herramienta ya usa: trae el
     comprador, el estado, lo facturado y el % cobrado ya calculados. No se
     recalcula nada aquí — el dato tiene un dueño y no es esta pantalla.
     Los dos catálogos van en la MISMA tanda: hacen falta para validar el CSV y
     para el formulario, y pedirlos después dejaría los botones vivos un segundo
     antes de poder contestar. */
  const [u, p, t] = await Promise.all([
    sb.from('unidades_estado').select('*').order('proyecto').order('codigo'),
    sb.from('proyectos').select('nombre').eq('activo', true).order('nombre'),
    sb.from('tipos_vivienda').select('clave, etiqueta').eq('activo', true).order('etiqueta'),
  ]);
  if(u.error){
    $('#avisos').innerHTML = '<p class="sui-aviso">No se ha podido leer el inventario: ' + esc(u.error.message) + '</p>';
    return;
  }
  UNI = u.data || [];
  /* Si un catálogo no contesta, la pantalla SIGUE: se lee el inventario igual y
     lo que se apaga es lo que no se puede hacer bien sin él. Un botón que
     promete y falla es peor que un botón que dice por qué no está. */
  PROYECTOS = (p.data || []).map(x => x.nombre);
  TIPOS = (t.data || []).map(x => [x.clave, x.etiqueta]);
  if(p.error || t.error){
    $('#btnNuevaUnidad').disabled = $('#btnCsv').disabled = true;
    $('#avisos').innerHTML = '<p class="sui-aviso">El catálogo de proyectos o de tipos no ha contestado, '
      + 'así que dar de alta queda desactivado hasta recargar. El inventario que ves es correcto.</p>';
  }
  pintarChips(); pintar();
  let tmr = null;
  $('#q').addEventListener('input', e => { FILTRO = e.target.value; clearTimeout(tmr); tmr = setTimeout(pintar, 90); });

  $('#btnNuevoProyecto').addEventListener('click', () => abreEnLaViva('/intranet/proyectos/?nuevoproyecto=1'));
  $('#btnNuevaUnidad').addEventListener('click', () => abreEnLaViva('/intranet/proyectos/?nueva=1'));
  $('#btnCsv').addEventListener('click', () => $('#fileCsv').click());
  $('#fileCsv').addEventListener('change', () => {
    const f = $('#fileCsv').files[0];
    $('#fileCsv').value = '';   // el mismo fichero dos veces seguidas tiene que volver a disparar
    if(f) importarCsvUI(f);
  });
});
})();
</script>
