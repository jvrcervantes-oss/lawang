<script>
/* ============================================================================
   Soporte — bandeja de mensajes_comprador, un hilo por comprador
   ----------------------------------------------------------------------------
   Lee mensajes_comprador + hilo_soporte (RLS ya deja al equipo ver y escribir
   las dos, es_agente()). Responder y cambiar estado pasan por el mismo camino
   que ya usa /portal/: portal_enviar_mensaje() (RPC) para el mensaje, UPDATE
   directo por RLS para el estado — nada de esto es nuevo, solo la pantalla
   que faltaba para verlo sin entrar comprador por comprador.
   ========================================================================== */
const $ = s => document.querySelector(s);

let SB=null, MENSAJES=[], HILOS={}, CLIENTES={}, SEL=null, FILTRO='abierto';
const ORDEN = { campo:'actualizado_en', dir:'desc' };

const fmtFecha = f => f ? new Date(f).toLocaleDateString('es-ES', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '';

/* ---------- carga ---------- */
async function cargar(){
  const [m, h, c] = await Promise.all([
    SB.from('mensajes_comprador').select('id,client_id,de,autor,texto,categoria,creado_en').order('creado_en', { ascending:true }),
    SB.from('hilo_soporte').select('client_id,estado,actualizado_en'),
    SB.from('clients').select('id,full_name,email'),
  ]);
  if(m.error){ toast('No se pudieron leer los mensajes: ' + m.error.message); return; }
  MENSAJES = m.data || [];
  HILOS = {};
  (h.error ? [] : (h.data || [])).forEach(x => { HILOS[x.client_id] = x; });
  CLIENTES = {};
  (c.error ? [] : (c.data || [])).forEach(x => { CLIENTES[x.id] = x; });
  pintar();
}

/* Un hilo por client_id que tenga AL MENOS un mensaje — un comprador que
   nunca escribió no aparece (nada que triar). El estado sale de hilo_soporte
   si existe (siempre debería, el trigger lo crea con el primer mensaje); si
   por lo que sea no existe todavía, se trata como abierto sin fecha. */
function hilos(){
  const porCliente = {};
  MENSAJES.forEach(m => { (porCliente[m.client_id] = porCliente[m.client_id] || []).push(m); });
  return Object.keys(porCliente).map(cid => {
    const msgs = porCliente[cid];
    const ultimo = msgs[msgs.length - 1];
    const h = HILOS[cid];
    const cliente = CLIENTES[cid];
    return {
      client_id: cid,
      nombre: (cliente && cliente.full_name) || 'Sin nombre',
      email: cliente && cliente.email,
      mensajes: msgs,
      ultimo,
      categoria: [...msgs].reverse().find(x => x.categoria) ? [...msgs].reverse().find(x => x.categoria).categoria : null,
      estado: (h && h.estado) || 'abierto',
      actualizado_en: (h && h.actualizado_en) || ultimo.creado_en,
    };
  });
}

/* ---------- filtros y tabla ---------- */
const FILTROS = [
  ['abierto','Abiertos'], ['resuelto','Resueltos'], ['todos','Todos'],
];
function visibles(){
  const q = ($('#q').value || '').toLowerCase();
  return hilos().filter(x => {
    if(FILTRO === 'abierto' && x.estado !== 'abierto') return false;
    if(FILTRO === 'resuelto' && x.estado !== 'resuelto') return false;
    if(q && !((x.nombre||'') + ' ' + (x.email||'')).toLowerCase().includes(q)) return false;
    return true;
  });
}
function pintar(){
  const todos = hilos();
  $('#filtros').innerHTML = FILTROS.map(([v,l]) => {
    const n = v === 'todos' ? todos.length : todos.filter(x => x.estado === v).length;
    return `<button class="sui-chip ${FILTRO===v?'on':''}" data-f="${v}">${l}<span class="n">${n}</span></button>`;
  }).join('');
  pintarTabla();
}
function pintarTabla(){
  const filas = $('#filas');
  const vs = suiOrdenar(visibles(), ORDEN, (x, campo) => x[campo]);
  if(!vs.length){ filas.innerHTML = '<tr><td colspan="5" class="sui-vacio">Nada que enseñar con este filtro.</td></tr>'; return; }
  filas.innerHTML = vs.map(x => `<tr data-id="${esc(x.client_id)}" class="${SEL===x.client_id?'on':''}">
    <td><b>${esc(x.nombre)}</b></td>
    <td class="ultimo">${esc(x.ultimo.de === 'equipo' ? 'Tú: ' : '')}${esc(x.ultimo.texto)}</td>
    <td class="cat-chip">${x.categoria ? esc(x.categoria) : '—'}</td>
    <td><span class="sui-tag ${x.estado === 'abierto' ? 'espera' : 'ok'}">${x.estado === 'abierto' ? 'Abierto' : 'Resuelto'}</span></td>
    <td>${esc(fmtFecha(x.actualizado_en))}</td>
  </tr>`).join('');
}

/* ---------- cajón ---------- */
function abrir(cid){
  const h = hilos().find(x => x.client_id === cid); if(!h) return;
  SEL = cid; pintarTabla();
  suiAbrirCajon({
    titulo: esc(h.nombre),
    sub: (h.email ? esc(h.email) + ' — ' : '') + 'Escribe a través de la intranet, igual que él ve tu respuesta en su área de clientes.',
    cuerpo: `
      <div class="hilo" id="hiloMsgs">${h.mensajes.map(m => `
        <div class="msg ${m.de === 'equipo' ? 'equipo' : ''}">
          <div class="meta">${m.de === 'equipo' ? esc(m.autor || 'Equipo') : esc(h.nombre)} · ${esc(fmtFecha(m.creado_en))}${m.categoria ? ' · ' + esc(m.categoria) : ''}</div>
          ${esc(m.texto)}
        </div>`).join('')}</div>
      <div class="responder">
        <select id="respCategoria" title="Categoría (opcional, solo la usa el comprador — el equipo no suele necesitarla)">
          <option value="">Sin categoría</option>
          <option value="Pagos">Pagos</option><option value="Documentación">Documentación</option>
          <option value="Obra">Obra</option><option value="Otro">Otro</option>
        </select>
        <textarea id="respTexto" placeholder="Responder…"></textarea>
        <button class="btn primary" id="btnResponder">Enviar</button>
      </div>`,
    pie: `<button class="sui-btn primario" id="btnToggleEstado">${h.estado === 'abierto' ? 'Marcar resuelto' : 'Reabrir'}</button>
          <button class="sui-btn" id="btnCerrar">Cerrar</button>`,
    onCerrar: () => { SEL = null; pintarTabla(); },
  });
  const hiloEl = $('#hiloMsgs'); if(hiloEl) hiloEl.scrollTop = hiloEl.scrollHeight;
  $('#btnCerrar').addEventListener('click', suiCerrarCajon);
  $('#btnResponder').addEventListener('click', () => responder(cid));
  $('#btnToggleEstado').addEventListener('click', () => toggleEstado(cid, h.estado));
}

async function responder(cid){
  const ta = $('#respTexto'); const texto = ta.value.trim(); if(!texto) return;
  const cat = $('#respCategoria').value || null;
  const btn = $('#btnResponder'); btn.disabled = true;
  const { error } = await SB.rpc('portal_enviar_mensaje', { p_client_id: cid, p_texto: texto, p_categoria: cat });
  if(error){ toast('No se pudo enviar: ' + error.message); btn.disabled = false; return; }
  await cargar();
  toast('Enviado');
  abrir(cid);
}

async function toggleEstado(cid, actual){
  const nuevo = actual === 'abierto' ? 'resuelto' : 'abierto';
  const { error } = await SB.from('hilo_soporte').update({ estado: nuevo, actualizado_en: new Date().toISOString() }).eq('client_id', cid);
  if(error){ toast('No se pudo cambiar el estado: ' + error.message); return; }
  await cargar();
  toast(nuevo === 'resuelto' ? 'Marcado como resuelto' : 'Reabierto');
  abrir(cid);
}

/* ---------- eventos ---------- */
$('#q').addEventListener('input', pintarTabla);
$('#filtros').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if(!b) return;
  FILTRO = b.dataset.f; pintar();
});
$('#filas').addEventListener('click', e => {
  const tr = e.target.closest('[data-id]'); if(!tr) return;
  abrir(tr.dataset.id);
});

suiMontarCajon();
suiOrdenable($('#tabla'), ORDEN, (x, campo) => x[campo], pintarTabla);

window.LW_AUTH.then(async ({ sb }) => {
  SB = sb;
  await cargar();
  /* ?id=<client_id> abre ese hilo directo — mismo patrón que /intranet/compradores/,
     lo usa el enlace del aviso por email al equipo. */
  const pedido = new URLSearchParams(location.search).get('id');
  if(pedido && hilos().some(h => h.client_id === pedido)) abrir(pedido);
});
</script>
