<script>
/* ============================================================================
   Soporte — bandeja de TICKETS (1-sep-2026: cada fila de hilo_soporte es un
   ticket propio, con su categoría y su estado; un comprador puede tener
   varios a la vez — antes era un hilo único por comprador, el owner pidió
   volver a tickets esa misma tarde).
   ----------------------------------------------------------------------------
   Lee mensajes_comprador + hilo_soporte (RLS ya deja al equipo ver y escribir
   las dos, es_agente()). Responder pasa por portal_enviar_mensaje(hilo_id,
   texto); cambiar estado es UPDATE directo por RLS — nada de esto es nuevo,
   solo la pantalla que faltaba para verlo sin entrar comprador por comprador.
   ========================================================================== */
const $ = s => document.querySelector(s);

let SB=null, MENSAJES=[], HILOS=[], CLIENTES={}, SEL=null, FILTRO='abierto';
const ORDEN = { campo:'actualizado_en', dir:'desc' };

const fmtFecha = f => f ? new Date(f).toLocaleDateString('es-ES', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '';

/* ---------- carga ---------- */
async function cargar(){
  const [m, h, c] = await Promise.all([
    SB.from('mensajes_comprador').select('id,client_id,hilo_id,de,autor,texto,creado_en').order('creado_en', { ascending:true }),
    SB.from('hilo_soporte').select('id,client_id,categoria,estado,actualizado_en'),
    SB.from('clients').select('id,full_name,email'),
  ]);
  if(h.error){ toast('No se pudieron leer los tickets: ' + h.error.message); return; }
  MENSAJES = m.error ? [] : (m.data || []);
  HILOS = h.data || [];
  CLIENTES = {};
  (c.error ? [] : (c.data || [])).forEach(x => { CLIENTES[x.id] = x; });
  pintar();
}

/* Un ticket es una fila de hilo_soporte — ya no se derivan de los mensajes:
   un ticket recién abierto trae siempre su primer mensaje, pero la FUENTE de
   qué tickets existen es la tabla de tickets, no la de mensajes. */
function tickets(){
  return HILOS.map(h => {
    const msgs = MENSAJES.filter(m => m.hilo_id === h.id);
    const cliente = CLIENTES[h.client_id];
    return {
      id: h.id,
      client_id: h.client_id,
      nombre: (cliente && cliente.full_name) || 'Sin nombre',
      email: cliente && cliente.email,
      categoria: h.categoria,
      mensajes: msgs,
      ultimo: msgs[msgs.length - 1],
      estado: h.estado,
      actualizado_en: h.actualizado_en,
    };
  });
}

/* ---------- filtros y tabla ---------- */
const FILTROS = [
  ['abierto','Abiertos'], ['resuelto','Resueltos'], ['todos','Todos'],
];
function visibles(){
  const q = ($('#q').value || '').toLowerCase();
  return tickets().filter(x => {
    if(FILTRO === 'abierto' && x.estado !== 'abierto') return false;
    if(FILTRO === 'resuelto' && x.estado !== 'resuelto') return false;
    if(q && !((x.nombre||'') + ' ' + (x.email||'') + ' ' + (x.categoria||'')).toLowerCase().includes(q)) return false;
    return true;
  });
}
function pintar(){
  const todos = tickets();
  $('#filtros').innerHTML = FILTROS.map(([v,l]) => {
    const n = v === 'todos' ? todos.length : todos.filter(x => x.estado === v).length;
    return `<button class="sui-chip ${FILTRO===v?'on':''}" data-f="${v}">${l}<span class="n">${n}</span></button>`;
  }).join('');
  pintarTabla();
}
function pintarTabla(){
  const filas = $('#filas');
  const vs = suiOrdenar(visibles(), ORDEN, (x, campo) => x[campo]);
  if(!vs.length){ filas.innerHTML = '<tr><td colspan="5" class="sui-vacio">Nada que enseñar con este filtro.</td></tr>'; return; }
  filas.innerHTML = vs.map(x => `<tr data-id="${esc(x.id)}" class="${SEL===x.id?'on':''}">
    <td><b>${esc(x.nombre)}</b></td>
    <td class="cat-chip">${esc(x.categoria)}</td>
    <td class="ultimo">${x.ultimo ? esc(x.ultimo.de === 'equipo' ? 'Tú: ' : '') + esc(x.ultimo.texto) : '—'}</td>
    <td><span class="sui-tag ${x.estado === 'abierto' ? 'espera' : 'ok'}">${x.estado === 'abierto' ? 'Abierto' : 'Resuelto'}</span></td>
    <td>${esc(fmtFecha(x.actualizado_en))}</td>
  </tr>`).join('');
}

/* ---------- cajón ---------- */
function abrir(hid){
  const h = tickets().find(x => x.id === hid); if(!h) return;
  SEL = hid; pintarTabla();
  suiAbrirCajon({
    titulo: esc(h.nombre) + ' · ' + esc(h.categoria),
    sub: (h.email ? esc(h.email) + ' — ' : '') + 'Escribe a través de la intranet, igual que él ve tu respuesta en su área de clientes.',
    cuerpo: `
      <div class="hilo" id="hiloMsgs">${h.mensajes.map(m => `
        <div class="msg ${m.de === 'equipo' ? 'equipo' : ''}">
          <div class="meta">${m.de === 'equipo' ? esc(m.autor || 'Equipo') : esc(h.nombre)} · ${esc(fmtFecha(m.creado_en))}</div>
          ${esc(m.texto)}
        </div>`).join('')}</div>
      <div class="responder">
        <textarea id="respTexto" placeholder="Responder…"></textarea>
        <button class="btn primary" id="btnResponder">Enviar</button>
      </div>`,
    pie: `<button class="sui-btn primario" id="btnToggleEstado">${h.estado === 'abierto' ? 'Marcar resuelto' : 'Reabrir'}</button>
          <button class="sui-btn" id="btnCerrar">Cerrar</button>`,
    onCerrar: () => { SEL = null; pintarTabla(); },
  });
  const hiloEl = $('#hiloMsgs'); if(hiloEl) hiloEl.scrollTop = hiloEl.scrollHeight;
  $('#btnCerrar').addEventListener('click', suiCerrarCajon);
  $('#btnResponder').addEventListener('click', () => responder(hid));
  $('#btnToggleEstado').addEventListener('click', () => toggleEstado(hid, h.estado));
}

async function responder(hid){
  const ta = $('#respTexto'); const texto = ta.value.trim(); if(!texto) return;
  const btn = $('#btnResponder'); btn.disabled = true;
  const { error } = await SB.rpc('portal_enviar_mensaje', { p_hilo_id: hid, p_texto: texto });
  if(error){ toast('No se pudo enviar: ' + error.message); btn.disabled = false; return; }
  await cargar();
  toast('Enviado');
  abrir(hid);
}

async function toggleEstado(hid, actual){
  const nuevo = actual === 'abierto' ? 'resuelto' : 'abierto';
  const { error } = await SB.from('hilo_soporte').update({ estado: nuevo, actualizado_en: new Date().toISOString() }).eq('id', hid);
  if(error){ toast('No se pudo cambiar el estado: ' + error.message); return; }
  await cargar();
  toast(nuevo === 'resuelto' ? 'Marcado como resuelto' : 'Reabierto');
  abrir(hid);
}

/* ---------- eventos ---------- */
$('#q').addEventListener('input', pintarTabla);
$('#filtros').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if(!b) return;
  FILTRO = b.dataset.f; pintar();
});
$('#filas').addEventListener('click', e => {
  const tr = e.target.closest('[data-id]'); if(!tr) return;
  abrir(tr.dataset.id);
});

suiMontarCajon();
suiOrdenable($('#tabla'), ORDEN, (x, campo) => x[campo], pintarTabla);

window.LW_AUTH.then(async ({ sb }) => {
  SB = sb;
  await cargar();
  /* ?id=<client_id> lo manda el aviso por email al equipo — un comprador
     puede tener varios tickets, así que se abre el suyo más reciente (con
     casi toda seguridad el que disparó el aviso) y de paso se filtra la
     tabla por su nombre para que se vean también los demás. */
  const pedido = new URLSearchParams(location.search).get('id');
  if(pedido){
    const suyos = tickets().filter(x => x.client_id === pedido).sort((a,b) => new Date(b.actualizado_en) - new Date(a.actualizado_en));
    if(suyos.length){ $('#q').value = suyos[0].nombre; pintarTabla(); abrir(suyos[0].id); }
  }
});
</script>
