<style>
  :root{ --line:#E4DCCB; --card:#FFFFFF; --rl2:#F1EBDD; --texto-2:#4A5052; --tbh:64px; }
  *{ box-sizing:border-box; } html,body{ margin:0; height:100%; }
  body{ font-family:var(--font-body,'Jost',sans-serif); background:var(--rl2); color:#22282A; }
  /* 🔴 REGLA MUERTA, RETIRADA 27-ago-2026. Decía `.topbar{ position:fixed }`,
     pero el header que inyecta `topbar.js` lleva la clase **`lw-topbar`**: el
     selector no casa con nada y ese `fixed` no se aplicó nunca. Medido en las
     trece pantallas: ocho la arrastraban, y tres de ellas además compensaban
     con `var(--tbh)` — o sea, empujaban el contenido 64 px para dejar sitio a
     una barra que ya ocupa su hueco en el flujo. Solo Operaciones y el portal
     usan `class="topbar"` de verdad; ahí se queda.
     Una regla que no casa con nada no es inofensiva: la de al lado sí casa. */
  /* 340px fijos, el valor del mockup 4d — no un rango. */
  .stage{ display:grid; grid-template-columns:340px 1fr; height:calc(100% - var(--tbh)); }
  @media screen and (max-width:900px){ .stage{ grid-template-columns:1fr; } .ficha{ display:none; } .stage.abierta .lista{ display:none; } .stage.abierta .ficha{ display:block; } }

  /* El buscador es `.sui-buscar` (suite.css). Aquí iba a 13,5px y con radio 9
     mientras el resto de la suite lo tenía a 12,5 y en pastilla. */

  .lista{ overflow:auto; border-right:1px solid var(--line); }
  .cab{ position:sticky; top:0; background:var(--rl2); padding:14px 18px 10px; border-bottom:1px solid var(--line); z-index:2;
        font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--texto-2); font-weight:600; }
  .u{ display:block; width:100%; text-align:left; font:inherit; background:none; border:none;
      border-top:1px solid var(--line); padding:13px 18px; cursor:pointer; }
  .u:first-of-type{ border-top:none; }
  .u:hover{ background:#EDE7D9; }
  /* El relleno y el filete de la suite (`--sup-sel` + Deep Lagoon), no dos valores
     propios: es la misma senal de seleccion que en las tablas. */
  .u.sel{ background:var(--sup-sel,#EAE4D3); box-shadow:inset 3px 0 0 var(--dl,#104C4F); }
  .u .n{ font-size:14px; font-weight:600; }
  .u .m{ font-size:12px; color:var(--texto-2); margin-top:2px; }
  .u .r{ margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }

  .ficha{ overflow:auto; padding:26px 30px 90px; }
  .vacio{ display:grid; place-items:center; height:100%; color:#BEB3A5; font-size:13px; letter-spacing:.14em; text-transform:uppercase; }
  h2.t{ font-family:var(--font-display,'Cormorant Garamond',serif); font-size:30px; font-weight:600; margin:0 0 4px; }
  .sub{ color:var(--texto-2); font-size:13.5px; margin:0 0 20px; }
  fieldset{ border:1px solid var(--line); border-radius:14px; background:var(--card); padding:0 18px 18px; margin:0 0 16px; }
  legend{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#fff; background:var(--dl,#104C4F);
          padding:6px 12px; border-radius:999px; }
  label{ display:block; font-size:12px; color:var(--texto-2); margin:12px 0 4px; }
  input,select{ width:100%; font:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:#FDFCF9; color:inherit; }
  input:focus,select:focus{ outline:none; border-color:var(--dl); box-shadow:0 0 0 3px rgba(72,91,55,.12); }
  /* La rejilla de dos campos por fila es `.sui-row`, en suite.css: estaba
     duplicada aqui y en la otra herramienta, y en ninguna se deshacia en movil. */
  .acciones{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  /* El botón se define UNA vez, en `contracts/assets/topbar.css` — que esta
     página ya carga. Aquí vivían 4 reglas propias: era la copia número N de
     seis, todas divergidas, y sin estado de foco visible. Ver la nota larga de allí. */

  /* 9,5px / .05em / 3px 8px: los valores del mockup 4d para la etiqueta de rol.
     Es mas pequena que la `.sui-tag` general (10px / .06em / 3px 9px) porque aqui
     van dos o tres seguidas en una linea de lista, no una sola en una celda. */
  /* La etiqueta se define UNA vez, en `contracts/assets/suite.css`. Aquí había
     una copia con 9,5px donde la compartida es 10 y con otro tracking:
     la misma etiqueta cambiaba de tamaño según la pantalla. */
  .t-super{ background:#104C4F; } .t-admin{ background:#3F5230; } .t-off{ background:#9E2F26; }

  .herr{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; margin-top:6px; }
  .herr label{ display:flex; align-items:center; gap:8px; margin:0; font-size:13.5px; color:inherit;
               border:1px solid var(--line); border-radius:9px; padding:9px 11px; background:#FDFCF9; cursor:pointer; }
  .herr input{ width:auto; }
  /* 29 proyectos no caben en pantalla como caben 8 herramientas: misma
     rejilla, con su propio alto y scroll para que el botón Guardar no se
     vaya al fondo de una lista larguísima. */

  .proy-acc{ display:flex; gap:8px; margin-top:10px; }

<script>
/* ============================================================
   USUARIOS Y PERMISOS — panel de administración de la suite.

   Qué pasa por dónde, y por qué:
   · Rol, herramientas y activo/inactivo se escriben DIRECTAMENTE en
     `public.usuarios`. La RLS ya exige es_admin() para escribir, así que no
     hace falta backend: meter una Edge Function en medio solo añadiría una
     segunda puerta que proteger.
   · Crear un usuario y cambiar una contraseña SÍ pasan por la Edge Function
     `admin-usuarios`: la Admin API de Supabase necesita la clave de servicio,
     que no puede estar en el navegador bajo ningún concepto.
   · Nadie se borra: se DESACTIVA. Un usuario borrado se lleva por delante la
     autoría de sus documentos (`creado_por`), y quién firmó qué es justo lo
     que no se puede perder.
   ============================================================ */
const $ = s => document.querySelector(s);

/* La lista sale de assets/herramientas.js (17-ago-2026, auditoría). Aquí había
   una copia con sus etiquetas a mano, y la del inventario decía «Unidades»
   mientras el hub y el menú lateral dicen «Proyectos»: la pantalla que reparte el
   acceso llamaba a una herramienta por un nombre que no usa nadie más. Añadir una
   herramienta ya no se toca aquí. */
const HERRAMIENTAS = LW_PERMISOS;
const ROLES = [['agente','Agente'], ['admin','Administrador'], ['super_admin','Super admin']];

let SB = null, YO = null, USUARIOS = [], SEL = null, PROYECTOS = [];

async function cargar(){
  // los dos a la vez: la ficha necesita el catálogo de proyectos para pintar
  // el reparto, y esperar a dos consultas seguidas se nota al abrir el panel
  const [us, pr] = await Promise.all([
    SB.from('usuarios').select('*').order('rol').order('email'),
    SB.from('proyectos').select('id,nombre').eq('activo', true).order('nombre'),
  ]);
  if(us.error){ $('#listaU').innerHTML = '<p class="nota" style="padding:18px">No se pudo cargar: ' + esc(us.error.message) + '</p>'; return; }
  USUARIOS = us.data || [];
  // si el catálogo no llega, la ficha lo dice en vez de pintar cero casillas y
  // dar a entender que el usuario no tiene ningún proyecto asignado
  PROYECTOS = pr.error ? null : (pr.data || []);
  pintarLista();
}

function pintarLista(){
  // Busca tambien por ROL escrito en cristiano ("admin", "agente"), no solo por la
  // clave interna: quien busca "agente" espera los agentes, no cero resultados.
  const q = (($('#qU') || {}).value || '').trim().toLowerCase();
  const ROL_ES = { super_admin:'super admin', admin:'administrador admin', agente:'agente' };
  const lista = !q ? USUARIOS : USUARIOS.filter(u =>
    [u.nombre, u.email, ROL_ES[u.rol] || u.rol].some(v => String(v || '').toLowerCase().includes(q)));
  if(!lista.length){
    $('#listaU').innerHTML = '<p class="nota" style="padding:18px 20px">Nadie con «' + esc(q) + '».</p>';
    return;
  }
  $('#listaU').innerHTML = lista.map(u => {
    const tags = [];
    if(u.rol === 'super_admin') tags.push('<span class="tag t-super">Super admin</span>');
    else if(u.rol === 'admin')  tags.push('<span class="tag t-admin">Administrador</span>');
    if(!u.activo) tags.push('<span class="tag t-off">Desactivado</span>');
    return `<button class="u ${SEL===u.user_id?'sel':''}" data-id="${esc(u.user_id)}">
      <div class="n">${esc(u.nombre || u.email)}</div>
      <div class="m">${esc(u.email)}${u.nombre ? '' : ''}</div>
      <div class="r">${tags.join('')}<span class="tag">${u.herramientas.length} herramienta${u.herramientas.length===1?'':'s'}</span></div>
    </button>`;
  }).join('');
}

function pintarFicha(){
  const u = USUARIOS.find(x => x.user_id === SEL);
  if(!u){ $('#ficha').innerHTML = '<div class="vacio">Elige un usuario</div>'; return; }
  const yoMismo = YO && u.user_id === YO.user_id;
  const soySuper = YO && YO.rol === 'super_admin';
  // un admin no toca a un super_admin, y nadie se quita a sí mismo el acceso
  // por accidente desde esta pantalla
  const bloqueado = (u.rol === 'super_admin' && !soySuper);

  $('#ficha').innerHTML = `
    <h2 class="t">${esc(u.nombre || u.email)}</h2>
    <p class="sub">${esc(u.email)} · alta ${u.creado_en ? new Date(u.creado_en).toLocaleDateString('es-ES') : '—'}
      ${u.creado_por ? ' · por ' + esc(u.creado_por) : ''}</p>

    ${yoMismo ? '<div class="aviso">Esta es tu propia cuenta. Para no dejarte fuera por accidente, no puedes desactivarte ni cambiarte el rol desde aquí.</div>' : ''}
    ${bloqueado ? '<div class="aviso">Solo un super admin puede modificar la cuenta de otro super admin.</div>' : ''}

    <fieldset><legend>Identidad y rol</legend>
      <div class="sui-row">
        <div><label for="fNombre">Nombre</label><input id="fNombre" value="${esc(u.nombre || '')}" ${bloqueado?'disabled':''}></div>
        <div><label for="fRol">Rol</label>
          <select class="sui-sel" id="fRol" ${bloqueado || yoMismo || !soySuper ? 'disabled' : ''}>
            ${ROLES.map(([v,l]) => `<option value="${v}" ${u.rol===v?'selected':''}>${l}</option>`).join('')}
          </select></div>
      </div>
      <p class="nota">Un <b>administrador</b> ve todas las herramientas y puede editar documentos de cualquiera.
        Solo un <b>super admin</b> reparte roles.</p>
    </fieldset>

    <fieldset><legend>Herramientas que ve</legend>
      <div class="herr">
        ${HERRAMIENTAS.map(([v,l]) => `<label><input type="checkbox" value="${v}"
          ${u.herramientas.includes(v)?'checked':''} ${bloqueado?'disabled':''}> ${l}</label>`).join('')}
      </div>
      <p class="nota">Controla lo que aparece en la intranet y lo que puede <b>guardar</b>.
        La consulta de datos ya emitidos sigue abierta a todo el equipo: Operaciones cruza contratos,
        facturas y firmas, y filtrarlas por herramienta la dejaría en blanco.</p>
    </fieldset>

    <fieldset><legend>Proyectos en los que trabaja</legend>
      ${PROYECTOS === null
        ? '<p class="nota">No se pudo cargar el catálogo de proyectos. Vuelve a abrir el panel: sin él, guardar dejaría a esta persona sin ningún proyecto.</p>'
        : `<div class="herr proy">
             ${PROYECTOS.map(p => `<label><input type="checkbox" value="${esc(p.id)}"
               ${(u.proyectos || []).includes(p.id) ? 'checked' : ''} ${bloqueado?'disabled':''}> ${esc(p.nombre)}</label>`).join('')}
           </div>
           <div class="proy-acc">
             <button type="button" class="btn" id="btnProyTodos" ${bloqueado?'disabled':''}>Marcar todos</button>
             <button type="button" class="btn" id="btnProyNinguno" ${bloqueado?'disabled':''}>Ninguno</button>
           </div>`}
      <p class="nota">Limita <b>en qué proyectos puede crear y editar contratos</b>. Sin ninguno marcado no
        puede crear contratos en ningún proyecto${u.rol === 'agente' ? '' : ', pero <b>a este usuario no le afecta</b>: los administradores trabajan en todos los proyectos por definición'}.
        No cambia lo que ve en Operaciones ni en Vencimientos, que siguen mostrando la actividad del equipo.</p>
    </fieldset>

    <!-- QUÉ CONTRATOS PUEDE EMITIR — 27-ago-2026, encargo del owner. La lista
         sale de LW_TIPO_CONTRATO (vocabulario.js), que es la fuente única de
         los tipos y ya la vigila listas.test.js: escribirla a mano aquí sería
         la séptima copia, y la séptima es la que se separa.
         (Sin acentos graves en este comentario A PROPÓSITO: vive DENTRO de un
         template literal, y un backtick aquí cierra la cadena. Es el fallo que
         dejó Proyectos en blanco el 26-ago; ahora lo caza sintaxis_js.py.)
         ⚠️ VACÍO = TODOS, al revés que «Proyectos» aquí arriba. No es un
         descuido: esta restricción se añade sobre un sistema que ya funciona, y
         si vacío significara «ninguno» el despliegue habría dejado a los diez
         agentes sin poder emitir un solo contrato sin que nadie lo pidiera. Se
         dice donde se marca, que es donde importa. -->
    <fieldset><legend>Contratos que puede hacer</legend>
      <div class="herr tipos">
        ${Object.entries(LW_TIPO_CONTRATO).map(([v,l]) => `<label><input type="checkbox" value="${esc(v)}"
          ${(u.tipos_contrato || []).includes(v) ? 'checked' : ''} ${bloqueado?'disabled':''}> ${esc(l)}</label>`).join('')}
      </div>
      <div class="proy-acc">
        <button type="button" class="btn" id="btnTipoTodos" ${bloqueado?'disabled':''}>Marcar todos</button>
        <button type="button" class="btn" id="btnTipoNinguno" ${bloqueado?'disabled':''}>Ninguno</button>
      </div>
      <p class="nota"><b>Sin ninguno marcado no puede emitir ningún contrato</b>, igual que en «Proyectos», arriba.
        ${u.rol === 'agente'
          ? 'Lo comprueba la <b>base de datos</b> al guardar, no solo el desplegable: esconder una opción no es impedirla.'
          : 'A este usuario <b>no le afecta</b>: un administrador emite cualquier tipo por definición.'}</p>
    </fieldset>

    <fieldset><legend>Acceso</legend>
      <label for="fActivo">Estado</label>
      <select class="sui-sel" id="fActivo" ${bloqueado || yoMismo ? 'disabled' : ''}>
        <option value="1" ${u.activo?'selected':''}>Activo</option>
        <option value="0" ${!u.activo?'selected':''}>Desactivado — no entra a la suite</option>
      </select>
      <p class="nota">Desactivar es lo contrario de borrar: la persona deja de entrar pero se conserva
        qué documentos creó. Nunca se borra un usuario.</p>
      <div class="acciones">
        <button class="btn primary" id="btnGuardar" ${bloqueado?'disabled':''}>Guardar cambios</button>
        <button class="btn" id="btnPass" ${bloqueado?'disabled':''}>Cambiar contraseña</button>
      </div>
    </fieldset>`;

  $('#btnGuardar').addEventListener('click', guardar);
  $('#btnPass').addEventListener('click', cambiarPassword);
  const marcar = v => document.querySelectorAll('.proy input').forEach(i => { i.checked = v; });
  if($('#btnProyTodos'))   $('#btnProyTodos').addEventListener('click', () => marcar(true));
  if($('#btnProyNinguno')) $('#btnProyNinguno').addEventListener('click', () => marcar(false));
  const marcarTipos = on => document.querySelectorAll('.tipos input').forEach(i => { i.checked = on; });
  if($('#btnTipoTodos'))   $('#btnTipoTodos').addEventListener('click', () => marcarTipos(true));
  if($('#btnTipoNinguno')) $('#btnTipoNinguno').addEventListener('click', () => marcarTipos(false));
}

async function guardar(){
  const u = USUARIOS.find(x => x.user_id === SEL); if(!u) return;
  const btn = $('#btnGuardar'); btn.disabled = true; btn.textContent = 'Guardando…';
  const cambios = {
    // `.herr` la comparten TRES rejillas —herramientas, proyectos y tipos de
    // contrato— y sin excluir a las otras dos sus valores se colarían en la
    // lista de herramientas. Con `.proy` ya pasó; ahora son dos exclusiones.
    nombre: $('#fNombre').value.trim() || null,
    herramientas: [...document.querySelectorAll('.herr:not(.proy):not(.tipos) input:checked')].map(i => i.value),
    tipos_contrato: [...document.querySelectorAll('.tipos input:checked')].map(i => i.value),
  };
  // solo si el catálogo llegó a pintarse: con la consulta caída, mandar el array
  // vacío le quitaría a esta persona todos sus proyectos sin que nadie lo pidiera
  if(PROYECTOS !== null)
    cambios.proyectos = [...document.querySelectorAll('.proy input:checked')].map(i => i.value);
  // rol y activo solo viajan si el select estaba habilitado: enviarlos
  // deshabilitados reescribiría con el valor pintado y anularía el guarda
  if(!$('#fRol').disabled) cambios.rol = $('#fRol').value;
  if(!$('#fActivo').disabled) cambios.activo = $('#fActivo').value === '1';
  const { error } = await SB.from('usuarios').update(cambios).eq('user_id', SEL);
  btn.disabled = false; btn.textContent = 'Guardar cambios';
  if(error){ toast('No se pudo guardar: ' + error.message); return; }
  toast('Permisos actualizados');
  await cargar(); pintarFicha();
}

async function llamarAdmin(payload){
  const { data:{ session } } = await SB.auth.getSession();
  const r = await fetch('https://vtulllundrfennhjddhc.supabase.co/functions/v1/admin-usuarios', {
    method:'POST',
    headers:{ 'Content-Type':'application/json',
      // el token de sesión ES la credencial: la función decide con él, no con el body
      'Authorization':'Bearer ' + session.access_token,
      'apikey':'sb_publishable_B_ot_6lNVRLiWiEMtApYOQ_3Ho3xNUg' },
    body: JSON.stringify(payload),
  });
  return r.json().catch(() => ({ error:'respuesta ilegible del servidor' }));
}

async function cambiarPassword(){
  const u = USUARIOS.find(x => x.user_id === SEL); if(!u) return;
  const p = prompt('Nueva contraseña para ' + u.email + ' (mínimo 10 caracteres).\nApúntala: no se puede volver a consultar.');
  if(p === null) return;
  if(p.length < 10){ toast('Mínimo 10 caracteres'); return; }
  const d = await llamarAdmin({ accion:'password', user_id:SEL, password:p });
  toast(d.ok ? 'Contraseña cambiada' : 'No se pudo: ' + (d.error || ''));
}

async function crear(){
  const email = $('#nEmail').value.trim().toLowerCase();
  const password = $('#nPass').value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('Email no válido'); return; }
  if(password.length < 10){ toast('La contraseña necesita 10 caracteres o más'); return; }
  const btn = $('#btnCrear'); btn.disabled = true; btn.textContent = 'Creando…';
  const d = await llamarAdmin({
    accion:'crear', email, password,
    nombre: $('#nNombre').value.trim(),
    rol: $('#nRol').value,
    herramientas: [...document.querySelectorAll('.herr:not(.proy):not(.tipos) input:checked')].map(i => i.value),
  });
  btn.disabled = false; btn.textContent = 'Crear usuario';
  if(!d.ok){ toast('No se pudo crear: ' + (d.error || '')); return; }
  toast('Usuario creado: ' + email);
  await cargar();
  SEL = d.user_id; pintarLista(); pintarFicha();
}

LW_AUTH.then(async ({ sb, session, ficha }) => {
  SB = sb;

  /* La ficha se consulta AQUÍ si el guard no la trae. No es redundancia: el
     29-jul un guard.js cacheado por el servidor (max-age 7 días) seguía siendo
     la versión que no devolvía `ficha`, y este panel le decía al super_admin
     que no era administrador. Depender de que un asset compartido esté fresco
     para decidir un permiso es frágil; preguntarlo cuesta una consulta. */
  YO = ficha || (await sb.from('usuarios').select('rol, herramientas, activo, nombre')
                   .eq('user_id', session.user.id).maybeSingle()).data;

  // Un agente con 'usuarios' en su lista pero sin rol de admin llegaría hasta
  // aquí y solo vería su propia fila (la RLS). Mejor decirlo que enseñar una
  // pantalla vacía.
  /* Hacen falta LAS DOS COSAS (18-ago-2026): rol de admin y la herramienta
     «Usuarios» marcada. Es el permiso más delicado que hay —quien reparte
     permisos puede concederse cualquier otro—, así que el owner pidió que se
     limitara también en la base y no solo aquí: las policies de `usuarios`
     exigen `es_admin() AND puede('usuarios')`. Esto es el aviso amable; si
     alguien llega por la API igualmente, ahí rebota. */
  const gestionaUsuarios = YO && (YO.rol === 'super_admin'
    || (YO.rol === 'admin' && (YO.herramientas || []).includes('usuarios')));
  if(!gestionaUsuarios){
    $('#stage').innerHTML = '<div class="vacio" style="grid-column:1/-1">'
      + (YO && YO.rol === 'admin'
          ? 'No tienes activada la herramienta «Usuarios». Pídesela a un super admin.'
          : 'Solo un administrador gestiona usuarios'
            + (YO ? ' · tu rol es «' + esc(YO.rol) + '»' : ''))
      + '</div>';
    return;
  }
  await cargar();
  if(YO.rol === 'super_admin') pintarPrivilegios();
});

/* Frenos saltados — LAW-71. Dos fuentes en una caja: `privilegios_ejercidos`
   (quién se saltó qué y por qué) y cuántas filas guarda la caja negra
   `borrados`, que es lo que queda de un contrato o una factura eliminados.

   El estado vacío se dice con cuidado, que es la lección del 21-ago: «nadie se
   ha saltado ningún freno» y «no he podido mirar» se parecen mucho en pantalla y
   solo uno de los dos es tranquilizador. Si la consulta falla, lo dice. */
async function pintarPrivilegios(){
  const caja = $('#privilegios');
  const [priv, borr] = await Promise.all([
    SB.from('privilegios_ejercidos').select('cuando, quien, evento, contrato, detalle')
      .order('cuando', { ascending:false }).limit(50),
    SB.from('borrados').select('id', { count:'exact', head:true }),
  ]);

  const fallo = priv.error ? (priv.error.message || 'no se ha podido leer') : null;
  const filas = priv.data || [];
  const NOMBRE = {
    desbloqueado:            'desbloqueó un contrato firmado',
    editado_estando_firmado: 'editó un contrato firmado',
    facturado_sin_bloquear:  'facturó un contrato sin firmar',
    cobro_a_otro_comprador:  'aplicó un cobro al comprador de otro contrato',
    cobro_a_factura_huerfana:'aplicó un cobro a una factura sin contrato',
    guardado_sin_ficha:      'guardó un contrato sin ficha de comprador',
  };
  const dia = s => new Date(s).toLocaleString('es-ES', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });

  caja.hidden = false;
  caja.innerHTML =
    `<div class="cab" style="margin-top:18px">
       <b style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--texto-2)">Frenos saltados</b>
       <span style="font-size:11.5px;color:var(--texto-2)">${
         borr.error ? 'caja negra: no se ha podido leer'
                    : (borr.count || 0) + ' documento(s) borrados guardados en la caja negra'}</span>
     </div>` +
    (fallo
      ? `<p style="font-size:12.5px;color:#C8791F;margin:8px 0 0">
           <b>No se ha podido leer el registro de privilegios.</b> Esto NO quiere decir que nadie
           se haya saltado nada: quiere decir que no se ha mirado. Recarga la página.</p>`
      : !filas.length
      ? `<p style="font-size:12.5px;color:var(--texto-2);margin:8px 0 0">
           Mirado ahora mismo: <b>nadie se ha saltado ningún freno</b> todavía.</p>`
      /* La tabla se desplaza DENTRO de su caja, no empuja la página. Con
         `width:100%` a secas, la anchura mínima de cuatro celdas —la primera
         con `nowrap` para no partir la fecha— se comía el 100% y sacaba la
         página 6 px a la derecha en un móvil de 390. Medido: `scrollWidth`
         396 contra 390 de ventana. Un desbordamiento lateral del documento no
         se nota como «una tabla ancha»: se nota como que TODA la pantalla se
         mueve de lado, y por eso hay que atajarlo aquí y no en el body. */
      : `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
         <table style="width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px">
           <tbody>${filas.map(r => `<tr style="border-top:1px solid var(--linea,#E6E2DA)">
             <td style="padding:6px 8px;white-space:nowrap;color:var(--texto-2)">${esc(dia(r.cuando))}</td>
             <td style="padding:6px 8px">${esc(r.quien || '—')}</td>
             <td style="padding:6px 8px"><b>${esc(NOMBRE[r.evento] || r.evento)}</b>${
               r.contrato ? ' · ' + esc(r.contrato) : ''}</td>
             <td style="padding:6px 8px;color:var(--texto-2)">${
               esc((r.detalle && (r.detalle.motivo || r.detalle.razon)) || '')}</td>
           </tr>`).join('')}</tbody>
         </table></div>`);
}
