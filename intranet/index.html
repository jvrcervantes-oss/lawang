<style>
/* ═══════════════════════════════════════════════════════════════
   INTRANET LAWANG · rediseño 30-jul-2026 (v3)

   AUTOPSIA DE LA v2 (28-jul, en Backups/) — qué falla, no qué me gusta menos:

   1. ERA UNA REJILLA DE TARJETAS IDÉNTICAS. Siete cajas con icono +
      título + párrafo, todas del mismo tamaño. Es el patrón que el
      manual del estudio prohíbe explícitamente, y con razón: siete
      objetos iguales no tienen jerarquía, así que la vista no sabe por
      dónde empezar y hay que LEER las siete para elegir una.

   2. FILO LATERAL DE COLOR (`a.tool::before`, 3px verdes). Prohibido en
      el manual y por el mismo motivo: no significa nada. Marcaba "está
      viva" en una lista donde todas lo están.

   3. TARJETA FANTASMA: borde de 1px + sombra difusa de 28px en hover.
      O borde o sombra definida, no las dos como decoración.

   4. NO DECÍA NADA. Siete enlaces y ni un dato. Un hub que abres veinte
      veces al día y que no te dice qué ha cambiado lo hace mejor la
      barra de marcadores. Este es el cambio de fondo: cada herramienta
      trae su estado real (contratos editables, firmas esperando,
      documentos emitidos), consultado con los permisos de quien mira.

   5. SIN TECLADO. Diez personas entran aquí a diario y solo se podía
      apuntar y hacer clic. Ahora se escribe para filtrar, ↑↓ para
      moverse, Enter para abrir; la primera fila ya viene enfocada.

   6. EL ELEMENTO MÁS GRANDE ERA EL QUE MENOS DECÍA: "Herramientas del
      equipo" en serif a 40px. La serif se queda en una sola palabra —
      la marca — y el resto es Jost. En una herramienta, la tipografía
      display en rótulos es ruido (manual: registro producto).

   HONESTIDAD DE LOS DATOS: si una consulta falla, la fila NO muestra
   "0". Un cero falso en un panel de control es peor que un hueco: el
   hueco se pregunta, el cero se cree. Misma lección que el logo que
   caía al de otra empresa cuando el JS venía cacheado.

   Modo claro fijo: la identidad de Lawang es Raw Linen al 60% del
   layout, y un modo oscuro automático rompe esa proporción.
   ═══════════════════════════════════════════════════════════════ */

:root{
  /* marca — hex exactos del brand guide */
  --tg:#485B37;   /* Territorial Green: acento, y solo acento */
  --dl:#104C4F;   /* Deep Lagoon */
  --va:#2E3437;   /* Volcanic Ash */
  --sc:#8F9B7A;   /* Soft Canopy */
  --ss:#BEB3A5;   /* Stone Sand */
  --rl:#F1EBDD;   /* Raw Linen */
  --sup:#FFFFFF;         /* superficie de trabajo */
  --sup-2:#FAF7F0;       /* segunda capa: cabecera de grupo, fila enfocada */
  --line:#E4DCCB;
  --line-fuerte:#D3C8B2;
  --ink:#21272A;         /* 14.8:1 sobre blanco */
  --ink-2:#4A5052;       /* 8.0:1 sobre blanco */
  --ink-3:#6B7072;       /* 5.1:1 — mínimo para texto pequeño, no bajar más */
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',system-ui,-apple-system,sans-serif;
  --r:12px;   /* 6-ago-2026: la escala de suite.css (--r-m:12px), no una propia */
  --sal:cubic-bezier(.22,1,.36,1);   /* ease-out; sin rebote */
  --z-barra:20;   /* única capa que se superpone: la barra pegajosa */
}

*{ box-sizing:border-box; }
html,body{ margin:0; }
body{
  font-family:var(--sans); font-size:15px; background:var(--rl); color:var(--ink);
  min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
}
body[hidden]{ display:none; }

/* ── barra ────────────────────────────────────────────────────── */
/* La barra ya NO se define aquí: es `.lw-topbar` de topbar.css, la misma que las
   ocho herramientas, con `.lw-topbar-oscura` encima para la paleta. Lo único que
   se queda es lo que esta pantalla tiene y las otras no: quién soy con su rol.

   Antes vivía aquí entera, con `.bar{ max-width:1060px; margin:0 auto }`, y por
   eso el logotipo no caía donde cae en el resto. Deep Lagoon se conserva:
   decisión del owner el 16-ago, y ya lo era desde el 6-ago — el hub era la única
   pantalla con la cabecera casi negra y eso se leía como otro producto. */
header.lw-topbar{ position:sticky; top:0; z-index:var(--z-barra); }
.yo{ display:flex; align-items:center; gap:9px; min-width:0; }
.yo .quien{ font-size:12.5px; color:var(--rl); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:210px; }
.rol{
  flex:none; font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  border:1px solid rgba(241,235,221,.35); border-radius:999px; padding:3px 9px; color:var(--ss);
}
.rol.manda{ border-color:var(--sc); color:#CBD6B6; }
/* `#out` ya es un `.lw-btn` como el de las herramientas. Normalmente ni se ve:
   el panel de cuenta lo esconde y ofrece «Cerrar sesión» desde el menú. Se queda
   como respaldo por si ese panel no llega a montarse. */
#out:focus-visible{ outline:2px solid var(--sc); outline-offset:2px; }

/* ── encabezado de página ─────────────────────────────────────── */
/* 1308 y `26px 26px 34px`: el lienzo del mockup 1a (1360 - 2x26). */
main{ flex:1; width:100%; max-width:1520px; margin:0 auto; padding:26px 26px 34px; }
/* rejilla del mockup: lo reciente a la izquierda, el carril de 300px a la
   derecha. En pantalla estrecha el carril baja, no desaparece. */
.dosCol{ display:grid; grid-template-columns:1fr 300px; gap:18px; align-items:start; margin:0 0 24px; }
@media (max-width:900px){ .dosCol{ grid-template-columns:1fr; } }
/* `min-width:0` NO es cosmetico: un hijo de grid vale por defecto `min-width:auto`,
   asi que la tabla de «Operaciones recientes» empujaba su columna y con ella toda
   la pagina — en un movil de 614px el body medía 738 y se desplazaba de lado.
   La tabla se desplaza DENTRO de su caja, que es lo que hay que hacer con una
   tabla ancha: nunca dejar que mueva la pagina entera. */
.dosCol > *{ min-width:0; }
.dosCol .sui-tabla-caja{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
/* Las cajas del carril (firmas, vencimientos) llevan texto largo en dos columnas:
   sin esto, un nombre largo tampoco cabe y estira la caja. */
.railFila{ gap:10px; }
.railFila > span:first-child{ min-width:0; overflow-wrap:anywhere; }
.panelCab{ padding:15px 20px; font-size:13px; font-weight:600; color:var(--ink); }
.railCaja{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
.railCaja + .railCaja{ margin-top:14px; }
.railCaja .t{ font-size:12px; font-weight:600; color:var(--ink); margin-bottom:10px; }
/* Avisos plegados del cuadro de firmas: una linea que no empuja las
   herramientas hacia abajo, y que al abrirse enseña lo mismo de antes. */
.railMas{ margin-top:2px; }
.railMas > summary{ list-style:none; cursor:pointer; font-size:11.5px; padding:6px 0 2px;
  color:var(--texto-2,#4A5052); }
.railMas > summary::-webkit-details-marker{ display:none; }
.railMas > summary::before{ content:'▸ '; }
.railMas[open] > summary::before{ content:'▾ '; }
.railMas > summary:hover{ color:var(--dl,#104C4F); }

.railFila{ display:flex; justify-content:space-between; gap:8px; font-size:12.5px; padding:5px 0; }
.railFila .v{ font-weight:600; font-variant-numeric:tabular-nums; }
.railFila.tarde{ color:#9E2F26; }
.railFila .espera{ color:#8C5E10; }
.lede{ display:flex; align-items:flex-end; gap:24px; margin-bottom:20px; flex-wrap:wrap; }
.lede > div{ min-width:0; }
.lede h1{
  margin:0; font-size:23px; font-weight:500; letter-spacing:.005em; color:var(--ink);
  text-wrap:balance;
}
.lede p{ margin:0; font-size:14px; color:var(--ink-2); max-width:62ch; }

/* buscador: es el camino rápido, no un adorno. Se enfoca al cargar. */
.buscar{ position:relative; flex:1; min-width:240px; }
.buscar i{ position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:16px; color:var(--sc); }
#q{
  width:100%; font:inherit; font-size:14px; color:var(--ink);
  padding:12px 84px 12px 40px; background:var(--sup);
  border:1px solid var(--line); border-radius:999px;
  transition:border-color .16s var(--sal), box-shadow .16s var(--sal);
}
#q::placeholder{ color:var(--ink-3); }
#q:focus{ outline:none; border-color:var(--sc); box-shadow:0 0 0 3px rgba(143,155,122,.22); }
.buscar kbd{
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  font:inherit; font-size:11px; color:var(--sc); background:#F7F3E9;
  border:1px solid var(--line); border-radius:6px; padding:3px 8px; pointer-events:none;
}

/* ── grupos y filas ───────────────────────────────────────────── */
@keyframes lwFadeUp{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }
/* 0,04s por fila (handoff): con once herramientas el ultimo entra a 0,44s,
   que se nota como una cascada y no como una espera. `both` deja el estado
   final puesto por si la animacion no llega a correr. */
.fila.entra{ animation:lwFadeUp .45s cubic-bezier(.22,.61,.36,1) both;
             animation-delay:calc(var(--i,0) * .04s); }
.grupo{ margin-top:26px; }
.grupo:first-of-type{ margin-top:8px; }
.grupo > h2{
  margin:0 0 8px; font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--sc);
}
.filas{
  background:var(--sup); border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
}
.fila{
  display:grid; grid-template-columns:26px 1fr auto; align-items:center; gap:14px;
  padding:15px 18px; border-top:1px solid var(--line);
  text-decoration:none; color:inherit; position:relative;
  transition:background .14s var(--sal);
}
.fila:first-child{ border-top:none; }
.fila:hover{ background:var(--sup-2); }
.fila:focus-visible{ outline:none; background:var(--sup-2); box-shadow:inset 3px 0 0 var(--tg); }
.fila.marcada{ background:var(--sup-2); box-shadow:inset 3px 0 0 var(--tg); }   /* cursor del teclado */
.fila:active{ background:#F5F1E8; }
.fila > i{ font-size:20px; color:var(--ink-2); justify-self:center; }
.fila .nombre{ font-size:15px; font-weight:500; letter-spacing:.005em; }
.fila .para{ display:block; margin-top:2px; font-size:12.5px; color:var(--ink-2); line-height:1.45; }
.fila .estado{
  display:flex; align-items:center; gap:10px; justify-self:end;
  font-size:13px; color:var(--ink-2); text-align:right; white-space:nowrap;
}
.fila .cifra{ font-weight:500; color:var(--ink); font-variant-numeric:tabular-nums; }
/* la única marca de color de la página: algo que espera a alguien */
.fila .urge{ color:#7A4B14; background:#F7EEDC; border-radius:999px; padding:3px 9px; font-size:12.5px; }
.fila .flecha{ font-size:15px; color:var(--sc); }
.fila:hover .flecha, .fila.marcada .flecha{ color:var(--tg); }

/* esqueleto mientras llegan las cifras: no un spinner en medio del contenido */
.hueso{ display:inline-block; width:74px; height:11px; border-radius:6px; background:var(--line); opacity:.75;
        animation:latir 1.1s ease-in-out infinite; }
@keyframes latir{ 50%{ opacity:.35; } }

/* pendiente de construir: no es una tarjeta más, es una fila apagada que dice qué falta */
.fila.pendiente{ cursor:default; }
.fila.pendiente .nombre{ color:var(--ink-2); }
.fila.pendiente > i{ color:var(--ss); }
.fila.pendiente:hover{ background:transparent; }
.fila .falta{ font-size:12.5px; color:#6A5A3C; }

.sin-nada{ padding:22px 16px; font-size:14px; color:var(--ink-2); }
.aviso{
  margin:0 0 18px; padding:11px 14px; font-size:13.5px; line-height:1.5; color:#6A4A14;
  background:#F7EEDC; border:1px solid #E6D7B4; border-radius:var(--r);
}
footer{ width:100%; max-width:1060px; margin:0 auto; padding:0 26px 34px; font-size:12.5px; color:var(--ink-3); }
footer div{ border-top:1px solid var(--line); padding-top:14px; display:flex; gap:16px; flex-wrap:wrap; }

@media (max-width:640px){
  /* en el móvil queda la marca y el botón: quién soy y con qué rol es dato de
     escritorio, y aquí sólo servía para empujar la página fuera de la pantalla */
  .yo{ display:none; }
  main{ padding:24px 16px 44px; }
  footer{ padding:0 16px 28px; }
  .lede{ gap:14px; }
  .fila{ grid-template-columns:22px 1fr; padding:13px 14px; }
  .fila .estado{ grid-column:2; justify-self:start; margin-top:6px; }
  .fila .flecha{ display:none; }
  .buscar kbd{ display:none; }
  #q{ padding-right:16px; }
}
@media (prefers-reduced-motion:reduce){
  *{ transition:none !important; animation:none !important; }
}
</style>

<body hidden>

<!-- esc() y toast(), que estaban copiados en cada herramienta. Va ANTES del
     script de la pagina: son `const` de primer nivel y dos declaraciones del
     mismo nombre revientan la pagina entera. -->
<!-- Formato de importes: `lwFormatoImporte` (17-ago-2026). Esta pantalla
     imprimia el dinero con toLocaleString('es'), que no recibe la moneda y

<script src="/contracts/assets/dinero.js?v=f37d55ff"></script>
<script src="/contracts/assets/herramientas.js?v=e237fff5"></script>
<script src="/contracts/assets/dialogo.js?v=8197f360"></script>
<script src="/contracts/assets/suite-comun.js?v=7d904f26"></script>
<script>
/* ── catálogo de herramientas ──────────────────────────────────────────
   Añadir una = una entrada aquí. `herr` es la herramienta de
   `public.usuarios.herramientas`: quien no la tenga no ve la fila (sin ficha
   en esa tabla se ven todas, igual que antes del panel de permisos).
   `estado` recibe las cifras ya consultadas y devuelve [texto, urgente], o
   null si la consulta que necesita no contestó — mejor un hueco que un cero
   inventado. Sin `estado` (el Dossier trabaja contra ficheros locales, no
   contra la base) la fila no espera ninguna cifra y no pinta esqueleto. */
/* El catálogo se mudó a assets/herramientas.js (15-ago-2026) para que el hub y
   el menú lateral de la barra lean la MISMA lista. Antes vivía aquí, y por eso
   topbar.js no podía tener selector de herramientas sin duplicarla. */
const HERRAMIENTAS = LW_HERRAMIENTAS;

const $ = s => document.querySelector(s);

let FICHA = null, CIFRAS = null, VISIBLES = [], CURSOR = 0;

/* ── qué se le enseña a cada uno ───────────────────────────────────── */
const esAdmin = f => !!f && (f.rol === 'super_admin' || f.rol === 'admin');
// `t.herr` es normalmente una herramienta ("facturas"); Creatividades unifica
// Dossier + Creatividades bajo una tarjeta y necesita "cualquiera de las dos"
// (7-ago-2026) — de ahí el `[].concat`, que trata un string suelto como un
// array de uno sin tener que tocar las demás tarjetas.
const permitida = t => lwPermitida(t, FICHA);   // la regla vive en assets/herramientas.js

/* ── pintado ───────────────────────────────────────────────────────
   Se pinta ANTES de que lleguen las cifras, con hueso en su sitio: la lista
   de herramientas no depende de la base de datos y esperar por ella dejaría
   la página en blanco por un timeout de red. */
function pintar(filtro){
  const q = (filtro || '').trim().toLowerCase();
  const casa = t => !q || (t.nombre + ' ' + t.para + ' ' + t.claves).toLowerCase().includes(q);
  const lista = HERRAMIENTAS.filter(permitida).filter(casa);
  VISIBLES = lista;

  if(!lista.length){
    $('#grupos').innerHTML = '<div class="filas"><p class="sin-nada">Ninguna herramienta coincide con «' + esc(filtro) + '».</p></div>';
    return;
  }
  const grupos = [];
  lista.forEach(t => {
    const g = grupos.find(x => x.titulo === t.grupo) || (grupos.push({ titulo:t.grupo, tools:[] }), grupos[grupos.length-1]);
    g.tools.push(t);
  });
  $('#grupos').innerHTML = grupos.map(g => `
    <section class="grupo">
      <h2>${esc(g.titulo)}</h2>
      <div class="filas">${g.tools.map(fila).join('')}</div>
    </section>`).join('');
  marcar(0);
  PRIMERA = false;
}

let PRIMERA = true;   // ver `entra` en fila(): la animacion es solo del primer pintado
function fila(t){
  const i = VISIBLES.indexOf(t);
  const est = (CIFRAS && t.estado) ? t.estado(CIFRAS) : null;
  const derecha = !t.estado ? ''                                   // no cuenta nada: ni cifra ni esqueleto
    : !CIFRAS ? '<span class="hueso" aria-hidden="true"></span>'   // esperando la consulta
    : est ? `<span class="${est[1] ? 'urge' : 'cifra'}">${esc(est[0])}</span>` : '';
  /* `--i` reusa el indice que esta funcion YA calcula para el teclado: el
     escalonado sale gratis, sin reestructurar el bucle de pintado (que es lo
     que el handoff pedia evitar).
     `entra` solo en la PRIMERA pintada: `pintar()` corre en cada tecla del
     buscador, y una lista que se vuelve a montar con animacion en cada letra
     no es una entrada, es un parpadeo. */
  return `<a class="fila${PRIMERA ? ' entra' : ''}" href="${esc(t.href)}" data-i="${i}" style="--i:${i}">
    <i class="ph ${esc(t.icon)}" aria-hidden="true"></i>
    <span><span class="nombre">${esc(t.nombre)}</span><span class="para">${esc(t.para)}</span></span>
    <span class="estado">${derecha}<i class="ph ph-arrow-right flecha" aria-hidden="true"></i></span>
  </a>`;
}

/* ── teclado: escribir filtra, ↑↓ mueve, Enter abre ───────────────── */
function marcar(i){
  const filas = [...document.querySelectorAll('.fila')];
  if(!filas.length) return;
  CURSOR = Math.max(0, Math.min(i, filas.length - 1));
  filas.forEach((f, n) => f.classList.toggle('marcada', n === CURSOR));
}
/* El buscador se retiro el 15-ago-2026 y con el su cableado. Se CONSERVAN las
   flechas y Enter: recorrer la lista con el teclado sigue valiendo sin filtro, y
   quitarlo tambien habria sido cobrar de mas por el cambio pedido. */
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    const filas = document.querySelectorAll('.fila');
    if(!filas.length) return;
    e.preventDefault(); marcar(CURSOR + (e.key === 'ArrowDown' ? 1 : -1));
    filas[CURSOR].scrollIntoView({ block:'nearest' });
  }else if(e.key === 'Enter'){
    const f = document.querySelectorAll('.fila')[CURSOR];
    if(f && f.href) location.href = f.href;
  }
});
document.addEventListener('mousemove', e => {
  const f = e.target.closest && e.target.closest('.fila');
  if(f) marcar(+f.dataset.i);
}, { passive:true });

/* ── cifras: una ronda de `count` en paralelo ──────────────────────
   `head:true` no trae filas, solo el número: son ocho contadores, no ocho
   listados. Cada uno se resuelve por separado a propósito — si la RLS tapa
   una tabla para este usuario, esa fila se queda sin cifra y las demás
   siguen. Un `Promise.all` que revienta dejaría el panel entero sin datos. */
async function contar(sb){
  // `select('*')` con head:true no trae columnas: es el idioma de PostgREST para
  // contar, y sirve igual en `usuarios`, cuya clave no se llama `id`.
  // `cols` opcional (18-ago-2026): el conteo de vencimientos necesita un embed
  // `contratos!inner(id)` para filtrar por firmados, y eso va en las COLUMNAS
  // del select — no en el filtro. Un `.select()` dentro del filtro pisaría el
  // `count:'exact'` de este (la 2ª llamada no admite opciones) y devolvería
  // filas en vez de un número: por eso las columnas entran por parámetro.
  const n = async (tabla, filtro, cols) => {
    let q = sb.from(tabla).select(cols || '*', { count:'exact', head:true });
    if(filtro) q = filtro(q);
    const { count, error } = await q;
    return error ? null : (count || 0);
  };
  const [contratos, contratosEditables, facturas, facturasAnuladas,
         recibis, unidades, unidadesLibres, obraActivas, compradores, usuarios, usuariosInactivos,
         documentos, vencSinFecha] = await Promise.all([
    n('contratos'),
    n('contratos', q => q.eq('bloqueado', false)),
    n('facturas', q => q.eq('anulada', false)),
    n('facturas', q => q.eq('anulada', true)),
    n('facturas', q => q.eq('tipo', 'recibi').eq('anulada', false)),
    n('unidades'),
    n('unidades', q => q.eq('estado', 'disponible')),
    n('unidades', q => q.not('obra_fase', 'is', null).neq('obra_fase', 'entregada')),
    n('clients'),
    n('usuarios', q => q.eq('activo', true)),
    n('usuarios', q => q.eq('activo', false)),
    n('documentos_proyecto'),
    // Vencimientos sin fecha: la cifra de la tarjeta de /vencimientos/. Se
    // cuenta "sin fecha" y no "vencidos" a propósito — el porqué está junto a
    // la tarjeta, en assets/herramientas.js. RLS de equipo (es_agente), así
    // que el count vale para cualquiera que vea la tarjeta.
    // `contratos!inner` + eq sobre la tabla embebida: solo contratos FIRMADOS
    // (cliente, 18-ago — un borrador no marca dinero como esperado, y su
    // calendario a medio poner inflaría esta cifra con trabajo que no toca aún).
    n('contrato_vencimientos', q => q.is('fecha', null).eq('contratos.bloqueado', true),
      '*, contratos!inner(id)'),
  ]);
  // Cuántos PROYECTOS tienen documentación, no solo cuántas filas: "12
  // documentos" no dice si son de un proyecto o de seis. Va aparte porque es un
  // distinct y el contador de arriba solo sabe contar filas.
  let proyectosConDocs = null;
  if(documentos){
    const { data, error } = await sb.from('documentos_proyecto').select('proyecto');
    proyectosConDocs = error ? null : new Set((data || []).map(x => x.proyecto)).size;
  }
  // 11-ago: "Firmas esperando" NO puede salir de `sb.from('contrato_firmas')`
  // — esa tabla tiene RLS por agente ("lo mío") desde el 7-ago, así que ese
  // conteo solo veía las firmas de ESTE agente, no las del equipo, y encima
  // contaba FILAS (una por firmante) en vez de CONTRATOS — un contrato con
  // dos firmantes pendientes sumaba 2. La tarjeta enlaza a
  // `/operaciones/?filtro=firma_viva`, que cuenta contratos con al menos una
  // firma pendiente vía `contrato_firmas_equipo()` (team-wide, la misma RPC
  // que ya usa Operaciones) — el origen tiene que ser el mismo o los dos
  // números nunca van a coincidir.
  let firmasPendientes = null;
  {
    const { data, error } = await sb.rpc('contrato_firmas_equipo').select('contrato_id').eq('estado', 'pendiente');
    firmasPendientes = error ? null : new Set((data || []).map(x => x.contrato_id)).size;
  }
  return { contratos, contratosEditables, firmasPendientes, facturas, facturasAnuladas,
           recibis, unidades, unidadesLibres, obraActivas, compradores, usuarios, usuariosInactivos,
           documentos, proyectosConDocs, vencSinFecha };
}

/* ── tarjetas de cifra ─────────────────────────────────────────────────
   Ni una consulta nueva: son las MISMAS cifras que `contar()` ya trae y que hasta
   hoy se leían como texto pequeño dentro de cada fila de herramienta. Lo que
   cambia es que lo que necesita atención se ve al entrar, sin recorrer once
   filas.
   Cinco como máximo, y elegidas por eso: son las que responden «¿tengo algo
   parado?». El resto de cifras sigue en su fila, que es donde tiene contexto.
   `null` = la base no contestó (la RLS tapó la tabla, o falló): se dice con un
   guion y la tarjeta se marca `muda`. Nunca un cero. */
function pintarKpis(d, ficha){
  if(!d) return;
  const tarjetas = [
    /* `tono` colorea el pie por SIGNIFICADO, como el mockup: ámbar lo que espera,
       rojo lo que urge, verde lo que va bien, gris lo neutro. En la 1ª pasada todos
       los pies eran grises y la tarjeta no decía si el número era bueno o malo. */
    { rot:'Firmas esperando', v:d.firmasPendientes, href:'/operaciones/?filtro=firma_viva', herr:'operaciones',
      pie:n => n ? 'pendientes de que el comprador firme' : 'ninguna pendiente',
      tono:n => n ? 'mal' : 'bien', urge:n => n > 0 },
    { rot:'Contratos', v:d.contratos, href:'/contracts/app.html', herr:'contratos',
      pie:() => d.contratosEditables == null ? '' : d.contratosEditables + ' aún editables',
      tono:() => d.contratosEditables ? 'espera' : '' },
    { rot:'Facturas emitidas', v:d.facturas, href:'/facturas/', herr:'facturas',
      pie:() => d.facturasAnuladas ? d.facturasAnuladas + ' anuladas' : 'ninguna anulada',
      tono:() => d.facturasAnuladas ? 'espera' : 'bien' },
    { rot:'Unidades libres', v:d.unidadesLibres, href:'/proyectos/', herr:'unidades',
      pie:() => d.unidades == null ? '' : 'de ' + d.unidades + ' en inventario' },
    { rot:'En obra', v:d.obraActivas, href:'/obra/', herr:'obra',
      pie:n => n ? 'con fase abierta' : 'sin unidades en obra',
      tono:n => n ? 'bien' : '' },
  ];
  // Solo las herramientas que esta persona puede abrir: una tarjeta que lleva a
  // un sitio del que te van a echar es peor que no tenerla.
  // `esAdmin` ya no abre todas las puertas (18-ago-2026): solo el super admin.
  // Esta línea era una copia a mano de lwPermitida; se queda porque aquí se
  // filtra por clave de herramienta y no por tarjeta, pero sigue su regla.
  const puede = h => !h || !ficha || ficha.rol === 'super_admin' || (ficha.herramientas || []).includes(h);
  const vistas = tarjetas.filter(t => puede(t.herr));
  if(!vistas.length) return;
  $('#kpis').innerHTML = vistas.map((t, i) => {
    const mudo = t.v == null;
    const cls = ['lw-kpi', 'lw-fade', mudo ? 'muda' : '', (!mudo && t.urge && t.urge(t.v)) ? 'urge' : '']
      .filter(Boolean).join(' ');
    const tono = (!mudo && t.tono) ? (t.tono(t.v) || '') : '';
    return `<a class="${cls}" href="${t.href}" style="--i:${i}">
      <span class="rot">${esc(t.rot)}</span>
      <span class="lw-cifra">${mudo ? '—' : t.v}</span>
      <span class="pie ${tono}">${mudo ? 'la base no contestó' : esc(t.pie(t.v) || '')}</span>
    </a>`;
  }).join('');
  $('#kpis').hidden = false;

  /* La tarjeta «Equipo · admin» se retira el 15-ago-2026 (owner: «irrelevante»).
     Tenia razon: contaba cuanta gente hay, que no es una cifra que mueva a hacer
     nada — y ahora Usuarios esta a un clic en el menu lateral. Las tarjetas de
     aqui son para lo que urge, no para lo que se puede contar. */
}

/* ── últimas operaciones ───────────────────────────────────────────────
   La ÚNICA consulta nueva del panel. Dos lecturas de columnas concretas —jamás
   `datos`, que en `contratos` pesa MB por los anexos en base64— y cada una por
   su lado: si la RLS tapa una, la otra se enseña igual.
   Se mezclan y se ordenan por fecha porque la pregunta del que entra es «qué se
   ha movido», no «qué contratos hay». */
async function ultimasOperaciones(sb){
  // Por las funciones `_equipo()` (7-ago) y no `.from()` directo: "recientes"
  // es del equipo entero a propósito (mismo motivo que Operaciones), y desde
  // que la RLS de SELECT filtra por autor una lectura directa solo traería
  // lo del agente que mira la pantalla.
  const [c, f] = await Promise.all([
    sb.rpc('contratos_equipo').select('id, numero, tipo, comprador_nombre, created_at, bloqueado')
      .order('created_at', { ascending:false }).limit(6),
    sb.rpc('facturas_equipo').select('id, numero, tipo, cliente_nombre, total, moneda, created_at, anulada')
      .order('created_at', { ascending:false }).limit(6),
  ]);
  const filas = [
    ...(c.data || []).map(r => ({ fecha:r.created_at, num:r.numero, quien:r.comprador_nombre,
        que:'Contrato', href:'/contracts/app.html?contrato=' + r.id, estado:r.bloqueado ? ['Firmado','ok'] : ['Editable','gris'] })),
    ...(f.data || []).map(r => ({ fecha:r.created_at, num:r.numero, quien:r.cliente_nombre,
        que:r.tipo === 'recibi' ? 'Recibí' : r.tipo === 'proforma' ? 'Proforma' : 'Factura',
        href:'/facturas/?id=' + r.id, importe:r.total, moneda:r.moneda,
        estado:r.anulada ? ['Anulada','alerta'] : ['Emitida','info'] })),
  ].filter(r => r.fecha).sort((a,b) => b.fecha.localeCompare(a.fecha)).slice(0, 8);
  if(!filas.length) return;
  const dia = s => new Date(s).toLocaleDateString('es-ES', { day:'2-digit', month:'short' });
  $('#reciente').innerHTML =
    `<div class="sui-tabla-caja lw-fade"><div class="panelCab">Operaciones recientes</div>
      <table class="sui-tabla"><tbody>` +
      filas.map(r => `<tr data-ir="${esc(r.href)}">
        <td class="clave">${esc(r.num || '—')}</td>
        <td>${esc(r.que)}</td>
        <td>${esc(r.quien || 'sin nombre')}</td>
        <td class="num flojo">${r.importe != null ? esc(lwFormatoImporte(r.importe, r.moneda)) : ''}</td>
        <td><span class="sui-tag ${r.estado[1]}">${esc(r.estado[0])}</span></td>
        <td class="flojo">${esc(dia(r.fecha))}</td>
      </tr>`).join('') +
      '</tbody></table></div>';
  $('#dosCol').hidden = false;
  /* Delegacion y no `onclick` en el marcado: es como escucha el resto de la
     suite, y un atributo con una URL dentro de una plantilla es la clase de sitio
     donde se cuela una comilla. */
  $('#reciente').addEventListener('click', e => {
    const tr = e.target.closest('tr[data-ir]');
    if(tr) location.href = tr.dataset.ir;
  });
}

/* ── carril derecho (1a): vencimientos y, para admin, rendimiento ──────
   Datos REALES, nada de maqueta: los vencimientos salen de los enlaces de firma
   pendientes (expira_en) y de las facturas con fecha de vencimiento; el
   rendimiento, de la suma de facturas vigentes por emisor. Cada consulta va por
   su lado: si la RLS tapa una, la otra se enseña igual. */
async function pintarRail(sb, ficha){
  const cajas = [];
  const dias = f => Math.round((new Date(f) - Date.now()) / 86400000);

  /* ── Firmas que necesitan atención — 15-ago-2026 ─────────────────────────
     VA LA PRIMERA del carril a propósito, por encima de vencimientos y de
     rendimiento: es lo único de este panel que puede costar un contrato.
     Origen: `public.auditoria_firmas()` (contracts/sql/auditoria_firmas.sql).
     Nace de dos contratos que llevaban semanas firmados por UN comprador y sin
     cerrar —CC00007 desde el 1-ago y CR00020 desde el 14— porque la cadena se
     paró al no poder mandarle el enlace al segundo firmante. `firma-submit` ya
     lo avisaba, pero el aviso iba al navegador del COMPRADOR y a console.error:
     el equipo no lo veía en ningún sitio. Mientras la cadena está parada el
     contrato sigue EDITABLE, o sea que el texto ya firmado se puede cambiar.
     Se enseñan TODAS las críticas sin recortar: si algún día hay diez, se ven
     las diez. Un «+3 más» escondido en esto es exactamente el fallo que se
     viene a tapar. */
  try{
    const { data: anom, error: eAnom } = await sb.rpc('auditoria_firmas');
    if(eAnom) throw eAnom;
    const criticas = (anom || []).filter(a => a.severidad === 'critica');
    const avisos   = (anom || []).filter(a => a.severidad !== 'critica');
    if(criticas.length || avisos.length){
      const fila = a => `<div class="railFila ${a.severidad === 'critica' ? 'tarde' : ''}">
        <span><b>${esc(a.contrato || 'sin nº')}</b> · ${esc(a.comprador || 'sin comprador')}${
          a.desde ? ' · ' + (dias(a.desde) <= -1 ? 'hace ' + (-dias(a.desde)) + ' días' : 'hoy') : ''}</span>
        <span class="v ${a.severidad === 'critica' ? 'mal' : 'espera'}">${
          a.tipo === 'cadena_parada' ? 'Cadena parada'
          : a.tipo === 'firmante_sin_email' ? 'Sin email'
          : a.tipo === 'enlace_caducado' ? 'Enlace caducado'
          : a.tipo === 'cerrado_sin_documento' ? 'Sin documento' : esc(a.tipo)}</span></div>`;
      /* Las CRÍTICAS van siempre enteras y sin recortar: son las que dejan un
         contrato firmado a medias y editable. Los AVISOS se pliegan detrás de una
         línea (15-ago-2026, owner: el cuadro empujaba demasiado abajo las
         herramientas). No es lo mismo esconder una alarma que esconder un
         recordatorio, y por eso solo se pliega lo segundo. */
      cajas.push('<div class="railCaja lw-fade" style="--i:' + cajas.length + '">'
        + '<div class="t">Firmas que necesitan atención</div>'
        + criticas.map(fila).join('')
        + (avisos.length
            ? '<details class="railMas"><summary>' + avisos.length
              + (avisos.length === 1 ? ' aviso más' : ' avisos más') + '</summary>'
              + avisos.map(fila).join('') + '</details>'
            : '')
        + (criticas.length
            ? '<div class="railFila"><span style="font-size:11.5px;color:var(--texto-2,#4A5052)">'
              + 'Una cadena parada deja el contrato editable después de firmado. Ábrelo en Contratos y genera el enlace que falta.'
              + '</span></div>'
            : '')
        + '</div>');
    }
  }catch(e){ console.warn('auditoria de firmas:', e && e.message); }

  try{
    // Por `_equipo()` (7-ago), no `.from()` directo — mismo motivo que
    // ultimasOperaciones(). El embed `contratos(numero)` que hacía la lectura
    // directa no está garantizado a través de una función RPC, así que el
    // número se resuelve aparte con un mapa id→numero de contratos_equipo().
    const [fir, fac, ctr] = await Promise.all([
      sb.rpc('contrato_firmas_equipo').select('contrato_id, expira_en, firmante_nombre')
        .eq('estado','pendiente').order('expira_en').limit(4),
      // `fecha_vencimiento` no es una columna de `facturas`: vive en
      // `datos->fields`, igual que la lee la campana de topbar.js. La versión
      // anterior pedía la columna suelta y llevaba HORAS fallando con un 400
      // silencioso (atrapado por el catch de aquí abajo) — la sección solo
      // enseñaba vencimientos de firma, nunca de factura.
      sb.rpc('facturas_equipo').select('numero, total, moneda, anulada, venc:datos->fields->>fecha_vencimiento')
        .limit(200),
      sb.rpc('contratos_equipo').select('id, numero'),
    ]);
    const numeroDe = {}; (ctr.data || []).forEach(c => { numeroDe[c.id] = c.numero; });
    const filas = [
      ...(fir.data || []).map(r => ({ d:dias(r.expira_en),
        txt:'Firma ' + (r.firmante_nombre||'').split(' ')[0] + (numeroDe[r.contrato_id] ? ' · ' + numeroDe[r.contrato_id] : ''),
        val:'Pendiente', clase:'espera' })),
      ...(fac.data || []).filter(r => !r.anulada && r.venc).map(r => ({ d:dias(r.venc),
        txt:r.numero, val:lwFormatoImporte(r.total, r.moneda||'EUR') })),
    ].sort((a,b) => a.d - b.d).slice(0, 6);
    if(filas.length){
      cajas.push('<div class="railCaja lw-fade" style="--i:' + cajas.length + '"><div class="t">Próximos vencimientos</div>' +
        filas.map(r => `<div class="railFila ${r.d < 0 ? 'tarde' : ''}">
          <span>${esc(r.txt)} · ${r.d < 0 ? 'vencida hace ' + (-r.d) + ' días' : r.d === 0 ? 'hoy' : 'en ' + r.d + ' días'}</span>
          <span class="v ${r.clase||''}">${esc(r.val)}</span></div>`).join('') + '</div>');
    }
  }catch(e){ console.warn('vencimientos:', e && e.message); }
  /* «Rendimiento del equipo · admin» retirado el 15-ago-2026 (owner): se hara
     algo especifico de agentes. Comparar a la gente por importe facturado en el
     panel de entrada de todos no es lo mismo que un panel de rendimiento, y a
     medias hacia mas ruido que servicio. */
  $('#rail').innerHTML = cajas.join('') || '<div class="railCaja lw-fade"><div class="t">Próximos vencimientos</div><div class="railFila"><span>Nada a la vista</span></div></div>';
}

    r.hidden = false;
    r.textContent = ficha.rol.replace('_', ' ');
    r.classList.toggle('manda', esAdmin(ficha));
  }

  const sin = new URLSearchParams(location.search).get('sin_permiso');
  if(sin) $('#avisos').innerHTML = '<p class="aviso">No tienes acceso a «' + esc(sin) + '». Pídeselo a un administrador: en tu ficha se activa herramienta por herramienta.</p>';

  /* Este hub NO carga guard.js -- tiene su propio control de sesion-- asi que no
     existe `window.LW_AUTH`, que es de donde cuelga todo lo de topbar.js. Sin
     esto el menu lateral no arrancaba AQUI, justo donde mas se usa. Se anuncia la
     ficha por evento en vez de duplicar la comprobacion: quien la necesite se
     suscribe. Es la tercera vez que esta divergencia cuesta algo (ver
     contexto/suite_lawang.md). */
  window.LW_FICHA = ficha;
  document.dispatchEvent(new CustomEvent('lw-ficha', { detail: ficha }));

  pintar('');                 // la lista sale ya, sin esperar a la base
  document.body.hidden = false;

  CIFRAS = await contar(sb);
  pintar('');
  pintarKpis(CIFRAS, ficha);
  /* Va después y sin bloquear: si esta consulta falla, el panel ya está entero y
     usable. Un `await` sin catch aquí habría dejado el pie de página sin escribir
     y la sesión sin cerrar bien. */
  ultimasOperaciones(sb).catch(e => console.warn('últimas operaciones:', e && e.message));
  pintarRail(sb, ficha).catch(e => console.warn('carril:', e && e.message));
  const mudas = HERRAMIENTAS.filter(permitida).filter(t => t.estado && t.estado(CIFRAS) === null).length;
  $('#pie-datos').textContent = mudas
    ? mudas + ' herramienta(s) sin cifra: la base no contestó y no se inventa un cero.'
    : 'Cifras al día de ' + new Date().toLocaleString('es-ES', { hour:'2-digit', minute:'2-digit' }) + '.';
});

$('#out').onclick = async () => {
  await sb.auth.signOut();
  location.replace('/entrar/');
};
</script>
</body>
</html>
