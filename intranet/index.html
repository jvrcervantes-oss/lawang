<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Lawang · Intranet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Iconos: familia real (Phosphor), no emojis. El §11 del estudio los veta, y
     dibujarlos a mano tampoco vale. Una sola familia y un solo grosor. Si el CDN
     cae, la tarjeta se queda sin icono pero sigue siendo legible. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9/dist/umd/supabase.min.js" integrity="sha384-XtYxyIfxexJVTROWK0+c5T8tJ2ItsVLcdgR5nJIoo6WzQqaBZoTPGgbS7XvkRNBZ" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   INTRANET LAWANG · rediseño 28-jul-2026

   Qué se arregló, medido sobre la versión anterior (en Backups/
   20260728_1600_intranet_v1_antes_rediseno.html):

   1. FONDO Y TARJETA ERAN INDISTINGUIBLES. Raw Linen #F5F0E6 contra
      #fffdf8 da un ratio de 1,117: las tarjetas no se leían como objetos,
      solo las separaba un borde de 1px. Ahora la tarjeta es blanco puro y
      el fondo baja a un lino más presente.

   2. FALTABA EL CONTRASTE ESTRUCTURAL. La guía de marca reparte
      60% Raw Linen / 25% Territorial Green / 10% Deep Lagoon+Burnt Earth.
      La v1 era ~95% Raw Linen y nada más: por eso "los colores no están
      mal pero algo falla". La cabecera en Volcanic Ash aporta ese 10% y
      ancla la página.

   3. TIPOGRAFÍA ILEGIBLE POR TAMAÑO Y TRACKING, no por contraste.
      El subtítulo era 10px con letter-spacing .26em. Se lee letra a
      letra. Mínimo ahora: 11.5px y tracking .10em.

   4. SERIF EN EL SITIO EQUIVOCADO. Cormorant hacía de título de tarjeta
      a 23px, donde toca escanear rápido. La guía de marca dice que la
      display va "reservada para H1, uso controlado": ahí se queda.

   Modo claro fijo, sin dark mode: la identidad de Lawang es Raw Linen al
   60% del layout. Un modo oscuro automático rompería esa proporción, que
   es justo lo que veníamos a arreglar.
   ═══════════════════════════════════════════════════════════════ */

:root{
  /* tokens de marca — hex exactos del brand guide */
  --tg:#485B37;   /* Territorial Green */
  --dl:#104C4F;   /* Deep Lagoon */
  --va:#2E3437;   /* Volcanic Ash */
  --sc:#8F9B7A;   /* Soft Canopy */
  --ss:#BEB3A5;   /* Stone Sand */
  --rl:#F1EBDD;   /* Raw Linen, un punto más presente que #F5F0E6 para que la tarjeta blanca despegue */
  --card:#FFFFFF;
  --line:#E2DACA;
  --texto:#22282A;
  --texto-2:#4A5052;   /* cuerpo: 8.0:1 sobre blanco, frente a los 5.2:1 del gris anterior */
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',system-ui,-apple-system,sans-serif;
  --r:14px;            /* un solo radio para todo el sistema */
  --ease:cubic-bezier(.16,1,.3,1);
}

*{ box-sizing:border-box; }
html,body{ margin:0; }
body{
  font-family:var(--sans); background:var(--rl); color:var(--texto);
  min-height:100vh; display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
body[hidden]{ display:none; }

/* ── cabecera: el ancla oscura que faltaba ───────────────────── */
header{ background:var(--va); color:var(--rl); }
.bar{
  max-width:1120px; margin:0 auto; padding:18px 28px;
  display:flex; align-items:center; gap:16px;
}
.marca{ display:flex; align-items:center; gap:12px; min-width:0; }
.marca > div{ min-width:0; }   /* sin esto el texto no puede encoger y ensancha la página entera */
.glyph{
  width:38px; height:38px; flex:none; border-radius:50%;
  border:1.5px solid var(--sc); color:var(--sc);
  display:grid; place-items:center;
  font-family:var(--serif); font-size:20px; font-weight:600; line-height:1;
}
.marca h1{
  margin:0; font-size:14px; font-weight:500;
  letter-spacing:.10em; text-transform:uppercase;   /* .26em -> .10em */
}
.marca small{
  display:block; margin-top:3px; font-size:11.5px;  /* 10px -> 11.5px */
  letter-spacing:.10em; color:var(--ss);
}
.spacer{ flex:1; }
#who{ font-size:13px; color:var(--ss); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:230px; }
#out{
  font:inherit; font-size:13px; font-weight:500; color:var(--rl);
  background:transparent; border:1px solid rgba(241,235,221,.32);
  border-radius:999px; padding:8px 17px; cursor:pointer;
  transition:background .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease);
}
#out:hover{ background:rgba(241,235,221,.12); border-color:var(--ss); }
#out:active{ transform:scale(.97); }
#out:focus-visible{ outline:2px solid var(--sc); outline-offset:2px; }

/* ── cuerpo ──────────────────────────────────────────────────── */
main{ flex:1; max-width:1120px; width:100%; margin:0 auto; padding:52px 28px 72px; }
.intro{ max-width:60ch; margin-bottom:38px; }
.intro h2{
  font-family:var(--serif); font-size:40px; font-weight:500; line-height:1.12;
  margin:0 0 10px; color:var(--va); letter-spacing:.005em;
}
.intro p{ margin:0; font-size:16px; line-height:1.6; color:var(--texto-2); }

/* Secciones: el hub crece y siete tarjetas sueltas ya no se leen como grupos.
   El título de sección es una regla con etiqueta, no una tarjeta más: separa
   sin añadir otra caja al recuento visual. */
.seccion{ margin:0 0 34px; }
.seccion > h2{
  display:flex; align-items:baseline; gap:12px; margin:0 0 14px;
  font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  color:var(--tg);
}
.seccion > h2::after{
  content:""; flex:1; height:1px; background:var(--line);
}
.seccion > h2 .cuenta{ font-size:11.5px; font-weight:400; letter-spacing:.06em; color:var(--texto-2); text-transform:none; }

.grid{ display:grid; gap:16px; grid-template-columns:repeat(3,1fr); }
.tool.destacada{ grid-column:span 2; }
/* una sección con una sola herramienta ocupa el ancho entero: dejar celdas
   vacías al final de una rejilla es un hueco de maquetación, no aire */
.grid.una .tool{ grid-column:1 / -1; }
@media (max-width:900px){ .grid{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:620px){
  .grid{ grid-template-columns:1fr; }
  .tool.destacada{ grid-column:span 1; }
  .tool.destacada h3{ font-size:17.5px; }   /* en una columna ya no destaca por tamaño, y competía con el H1 */
  main{ padding:34px 18px 52px; }
  .intro h2{ font-size:30px; }
  .intro p{ font-size:15px; }
  /* La cabecera tenía un ancho mínimo mayor que 390px (marca + email + botón)
     y eso desbordaba la PÁGINA entera, no solo la barra: el texto de las
     tarjetas salía cortado por la derecha. El email sobra en móvil. */
  .bar{ padding:13px 18px; gap:12px; }
  #who{ display:none; }
  .marca small{ font-size:11px; letter-spacing:.08em; }
  footer{ padding:0 18px 32px; }
}

.tool{
  position:relative; display:flex; flex-direction:column; gap:9px;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:24px 22px 20px; min-height:158px;
  text-decoration:none; color:inherit;
  box-shadow:0 1px 2px rgba(46,52,55,.04);
  transition:transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease);
}
/* el verde de marca aparece POCO y a propósito: solo marca las que
   están vivas, y solo como filo lateral */
a.tool::before{
  content:""; position:absolute; left:0; top:18px; bottom:18px; width:3px;
  border-radius:0 3px 3px 0; background:var(--tg);
  opacity:.85; transition:top .2s var(--ease), bottom .2s var(--ease);
}
a.tool:hover{
  transform:translateY(-2px); border-color:var(--sc);
  box-shadow:0 10px 28px -12px rgba(46,52,55,.28), 0 2px 6px rgba(46,52,55,.06);
}
a.tool:hover::before{ top:10px; bottom:10px; }
a.tool:active{ transform:translateY(0) scale(.995); }
a.tool:focus-visible{ outline:2px solid var(--tg); outline-offset:3px; }

/* el icono acompaña al título en la misma línea: sirve para reconocer la
   herramienta de un vistazo, no para decorar la esquina de la tarjeta */
.tool h3{
  margin:0; display:flex; align-items:center; gap:10px;
  font-size:17.5px; font-weight:600; letter-spacing:.005em; color:var(--va);
}
.tool h3 i{ font-size:21px; line-height:1; color:var(--tg); flex:none; }
.tool.pendiente h3 i{ color:var(--ss); }
.tool.destacada h3{ font-size:20px; }
.tool.destacada h3 i{ font-size:24px; }
.tool p{ margin:0; font-size:14.5px; line-height:1.55; color:var(--texto-2); flex:1; }

.estado{
  align-self:flex-start; font-size:11.5px; font-weight:500;
  letter-spacing:.08em; text-transform:uppercase;
  border-radius:999px; padding:4px 11px;
}
.estado.viva{ background:rgba(72,91,55,.12); color:#3B4B2D; }
.estado.pendiente{ background:rgba(46,52,55,.07); color:#5A6062; }

/* estado vacío de verdad: dice QUÉ falta, no solo que no está */
.tool.pendiente{ background:transparent; border-style:dashed; box-shadow:none; }
.tool.pendiente h3{ color:var(--texto-2); }
.tool.pendiente .falta{
  margin:0; font-size:12.5px; line-height:1.5; color:#6A5A3C;
  background:rgba(190,179,165,.22); border-radius:9px; padding:8px 10px;
}

footer{
  max-width:1120px; width:100%; margin:0 auto; padding:0 28px 40px;
  font-size:12.5px; color:var(--texto-2);
}
footer .sep{ border-top:1px solid var(--line); padding-top:16px; }

@media (prefers-reduced-motion:reduce){
  *{ transition:none !important; }
}
</style>
</head>
<body hidden>
  <header>
    <div class="bar">
      <div class="marca">
        <div class="glyph" aria-hidden="true">L</div>
        <div>
          <h1>Intranet</h1>
          <small>LAWANG TROPICAL PROPERTIES</small>
        </div>
      </div>
      <div class="spacer"></div>
      <span id="who"></span>
      <button id="out">Salir</button>
    </div>
  </header>

  <main>
    <div class="intro">
      <h2>Herramientas del equipo</h2>
      <p>Todo lo que se emite, se firma y se cobra en Lawang, en un solo sitio.</p>
    </div>
    <div id="secciones"></div>
  </main>

  <footer><div class="sep">Acceso restringido. Cada herramienta exige la misma sesión.</div></footer>

<script>
/* Añadir una herramienta = una entrada en su sección.
   `href` vacío = todavía no existe, y `falta` explica qué le falta: un estado
   vacío que no dice qué hacer es una tarjeta muerta.
   `icon` = clase de Phosphor (familia única, un solo grosor). */
const SECCIONES = [
  { titulo:'Seguimiento', tools:[
    { name:'Operaciones', icon:'ph-chart-line-up', destacada:true, href:'/operaciones/',
      desc:'Cómo va cada venta: estado de cuenta, documentos emitidos, firmas y vencimientos.' },
  ]},
  { titulo:'Documentación', tools:[
    { name:'Contratos', icon:'ph-file-text', href:'/contracts/app.html',
      desc:'Reservas, PPJB, construcción y anexos.' },
    { name:'Dossier',   icon:'ph-book-open',  href:'/dossier/builder.html',
      desc:'Dossiers de producto en A4 apaisado.' },
  ]},
  { titulo:'Administración', tools:[
    { name:'Facturas', icon:'ph-receipt',    href:'/facturas/',
      desc:'Facturas, proformas y recibís, cada tipo con su serie.' },
    { name:'Recibos',  icon:'ph-hand-coins', href:'/facturas/?tipo=recibi',
      desc:'Justificantes de pago y señales.' },
  ]},
  { titulo:'Base de datos', tools:[
    { name:'Unidades',    icon:'ph-house-line', href:'',
      desc:'Inventario de parcelas y villas con su estado de venta.',
      falta:'Falta correr la migración de la tabla unidades.' },
    { name:'Compradores', icon:'ph-identification-card', href:'',
      desc:'Ficha del comprador y documentación KYC, con caducidades.',
      falta:'Falta abrir las tablas clients y documents.' },
  ]},
];

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const tarjeta = t => {
  const clases = 'tool' + (t.destacada ? ' destacada' : '') + (t.href ? '' : ' pendiente');
  const cuerpo =
    `<h3><i class="ph ${esc(t.icon)}" aria-hidden="true"></i>${esc(t.name)}</h3><p>${esc(t.desc)}</p>` +
    (t.href
      ? '<span class="estado viva">Abrir</span>'
      : `<p class="falta">${esc(t.falta || '')}</p><span class="estado pendiente">En construcción</span>`);
  return t.href
    ? `<a class="${clases}" href="${esc(t.href)}">${cuerpo}</a>`
    : `<div class="${clases}">${cuerpo}</div>`;
};

document.getElementById('secciones').innerHTML = SECCIONES.map(s => {
  const listas = s.tools.filter(t => t.href).length;
  const cuenta = listas === s.tools.length ? '' :
    `<span class="cuenta">${listas} de ${s.tools.length} lista${s.tools.length > 1 ? 's' : ''}</span>`;
  return `<section class="seccion">
    <h2>${esc(s.titulo)}${cuenta}</h2>
    <div class="grid${s.tools.length === 1 ? ' una' : ''}">${s.tools.map(tarjeta).join('')}</div>
  </section>`;
}).join('');

/* mismo proyecto y key publicable que contracts/login.html — el candado real es la RLS */
const sb = window.supabase.createClient(
  'https://vtulllundrfennhjddhc.supabase.co',
  'sb_publishable_B_ot_6lNVRLiWiEMtApYOQ_3Ho3xNUg'
);
sb.auth.getSession().then(({ data: { session } }) => {
  if (!session) { location.replace('/contracts/login.html?next=/intranet/'); return; }
  document.getElementById('who').textContent = session.user.email;
  document.body.hidden = false;
});
document.getElementById('out').onclick = async () => {
  await sb.auth.signOut();
  location.replace('/contracts/login.html');
};
</script>
</body>
</html>
