<style>
  :root{ --line:#E4DCCB; --card:#FFFFFF; --rl2:#F1EBDD; --texto-2:#4A5052; --tbh:64px; }
  /* --cajon-w: sin override propio desde el 11-ago — hereda el 70vw de
     suite.css (norma de la suite, no herramienta por herramienta). Antes
     tenía aquí un clamp propio para igualar a Operaciones; con el 70vw
     nuevo ya no hace falta un ancho a medida. */
  *{ box-sizing:border-box; } html,body{ margin:0; height:100%; }
  body{ font-family:var(--font-body,'Jost',sans-serif); background:var(--rl2); color:#22282A; }
  /* 🔴 REGLA MUERTA, RETIRADA 27-ago-2026. Decía `.topbar{ position:fixed }`,
     pero el header que inyecta `topbar.js` lleva la clase **`lw-topbar`**: el
     selector no casa con nada y ese `fixed` no se aplicó nunca. Medido en las
     trece pantallas: ocho la arrastraban, y tres de ellas además compensaban
     con `var(--tbh)` — o sea, empujaban el contenido 64 px para dejar sitio a
     una barra que ya ocupa su hueco en el flujo. Solo Operaciones y el portal
     usan `class="topbar"` de verdad; ahí se queda.
     Una regla que no casa con nada no es inofensiva: la de al lado sí casa. */
  .stage{ display:grid; grid-template-columns:minmax(300px,370px) 1fr; height:calc(100% - var(--tbh)); }
  @media screen and (max-width:900px){ .stage{ grid-template-columns:1fr; } .ficha{ display:none; } .stage.abierta .lista{ display:none; } .stage.abierta .ficha{ display:block; } }

  .lista{ overflow:auto; border-right:1px solid var(--line); }
  .cab{ position:sticky; top:0; background:var(--rl2); padding:14px 18px 12px; border-bottom:1px solid var(--line); z-index:2; }
  .c{ display:block; width:100%; text-align:left; font:inherit; background:none; border:none;
      border-bottom:1px solid var(--line); padding:12px 18px; cursor:pointer; }
  .c:hover{ background:#EDE7D9; }
  .c.sel{ background:#E7E1D2; box-shadow:inset 3px 0 0 var(--tg); }
  .c .n{ font-size:14.5px; font-weight:600; }
  .c .m{ font-size:12.5px; color:var(--texto-2); margin-top:2px; }
  .c .r{ margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }

  .ficha{ overflow:auto; padding:26px 30px 90px; }
  .vacio{ display:grid; place-items:center; height:100%; color:#BEB3A5; font-size:13px; letter-spacing:.14em; text-transform:uppercase; }
  h2.t{ font-family:var(--font-display,'Cormorant Garamond',serif); font-size:30px; font-weight:600; margin:0 0 4px; }
  .sub{ color:var(--texto-2); font-size:13.5px; margin:0 0 20px; }
  fieldset{ border:1px solid var(--line); border-radius:14px; background:var(--card); padding:16px 18px 18px; margin:0 0 16px; }
  legend{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--texto-2); padding:0 8px; }
  label{ display:block; font-size:12px; color:var(--texto-2); margin:12px 0 4px; }
  label:first-of-type{ margin-top:2px; }
  input,select,textarea{ width:100%; font:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:#FDFCF9; color:inherit; }
  input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--dl); box-shadow:0 0 0 3px rgba(72,91,55,.12); }
  input:disabled,select:disabled,textarea:disabled{ background:var(--rl2); color:var(--texto-2); cursor:default; opacity:1; }
  textarea{ min-height:60px; resize:vertical; }
  /* La rejilla de dos campos por fila es `.sui-row`, en suite.css: estaba
     duplicada aqui y en la otra herramienta, y en ninguna se deshacia en movil. */
  .acciones{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  /* El botón se define UNA vez, en `contracts/assets/topbar.css` — que esta
     página ya carga. Aquí vivían 4 reglas propias: era la copia número N de
     seis, todas divergidas, y sin estado de foco visible. Ver la nota larga de allí. */

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--texto-2); font-weight:500; padding:0 8px 7px 0; }
  td{ padding:8px 8px 8px 0; border-top:1px solid var(--line); vertical-align:middle; }

  /* estado en color sólido (mismo criterio que Operaciones y Unidades): AA >4.5:1 */
  /* La etiqueta se define UNA vez, en `contracts/assets/suite.css`. Aquí había
     una copia con 10,5px donde la compartida es 10 y con otro tracking:
     la misma etiqueta cambiaba de tamaño según la pantalla. */
  .ok{     background:#3F5230; }
  .espera{ background:#8C5E10; }
  .mal{    background:#9E2F26; }
  .neutro{ background:#5A6062; }

  .subir{ border:1px dashed var(--line); border-radius:11px; padding:13px; margin-top:12px; background:#FDFCF9; }
  .nota{ font-size:12px; color:var(--texto-2); margin:9px 0 0; line-height:1.5; }

  /* Las facturas anuladas, apartadas y contadas (27-ago-2026). El contador va
     en el rótulo a propósito: es lo que separa «apartado» de «escondido». */
  details.anuladas{ margin-top:10px; }
  details.anuladas > summary{ cursor:pointer; list-style:none; padding:6px 0;
    font-size:12px; color:var(--texto-2); user-select:none; }
  details.anuladas > summary::-webkit-details-marker{ display:none; }
  details.anuladas > summary::before{ content:'＋ '; font-size:10px; }
  details.anuladas[open] > summary::before{ content:'− '; }
  details.anuladas > summary:hover{ color:var(--texto); }
  /* Tachado y apagado: la fila se lee, pero ni un segundo se confunde con dinero
     vivo. Es el mismo tratamiento que ya usa el listado de Facturas. */
  tr.anulada td{ opacity:.55; text-decoration:line-through; }
  tr.anulada td a{ text-decoration:line-through; }

  /* Retirar un documento KYC es la acción más seria de esta ficha: va en rojo de
     línea, no de relleno — se encuentra cuando se busca y no se pulsa sin querer
     al ir a «Abrir», que está justo al lado. */
  .btn.borrar{ margin-left:6px; color:#9E2F26; border-color:#E0C6C2; }
  .btn.borrar:hover:not(:disabled){ background:#FBF3F2; border-color:#C98A82; }

  /* Avance de pago por proyecto (24-ago-2026). La PISTA y el movimiento salen
     de `.lw-bar` (suite.css), que ya usan Proyectos, Vencimientos y el portal:
     aquí solo se dice la tinta —el mismo verde de la cifra «Cobrado» de esta
     misma ficha, porque significan lo mismo— y cómo se apila la fila. */
  .pp-titulo{ font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--texto-2);
              font-weight:500; margin:16px 0 8px; }
  .pp-lista{ display:flex; flex-direction:column; gap:13px; }
  .pp-cab{ display:flex; justify-content:space-between; align-items:baseline; gap:12px;
           font-size:13px; margin-bottom:5px; }
  .pp-cab b{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pp-cab span{ flex:none; font-variant-numeric:tabular-nums; color:var(--texto-2); }
  .lw-bar.cobro > i{ background:#3F5230; }

<script>
/* ============================================================
   COMPRADORES — ficha y documentación KYC.

   Los ficheros van al bucket PRIVADO `kyc`. Nunca se enlaza una URL fija:
   se pide una URL firmada de 5 minutos en el momento de abrirla. Un enlace
   permanente a un pasaporte es una fuga esperando a que alguien lo reenvíe.

   La caducidad es el punto del módulo: un pasaporte vencido invalida el KYC
   y hasta ahora no había dónde anotarlo, así que nadie se enteraba.
   ============================================================ */
const $ = s => document.querySelector(s);
lwIdiomaAplicar();   // traduce la HTML de arriba; en espanol no toca el DOM

const HOY = new Date(); HOY.setHours(0,0,0,0);
const fFecha = f => f ? new Date(String(f).slice(0,10)+'T00:00:00').toLocaleDateString(lwLocale(),{day:'2-digit',month:'short',year:'numeric'}) : '—';
const dias = f => f ? Math.round((new Date(String(f).slice(0,10)+'T00:00:00') - HOY)/86400000) : null;

/* ⚠️ Las CLAVES son las que acepta el CHECK de la tabla (en inglés, de cuando
   se creó el 14-jul). Solo las etiquetas van en español. Traducir la clave
   rompe el guardado entero, y el error solo aparece al escribir. */
/* NACIONALIDADES, PREFIJOS y partirTelefono() salen de /contracts/assets/geo.js
   desde el 12-ago-2026 (petición del owner: "llévalo a todos lados") — se
   comparten con Contratos, que ahora usa la misma lista para no repetir 195
   países a mano en dos sitios (mismo motivo que ya sacó las cuentas bancarias
   a entities.js). */

/* Clave de la base a la izquierda (no se traduce NUNCA: es lo que se guarda y
   lo que compara la RLS), rotulo visible a la derecha. */
const KYC = [['pending',lwT('Pendiente')],['submitted',lwT('En revisión')],['verified',lwT('Aprobado')],['rejected',lwT('Rechazado')]];
const DOCS = [['passport',lwT('Pasaporte')],['npwp','NPWP'],['visa',lwT('Visado')],
              ['proof_of_funds',lwT('Justificante de fondos')],['proof_of_address',lwT('Justificante de domicilio')],
              ['signed_contract',lwT('Contrato firmado')],['other',lwT('Otro')]];
const etiqueta = (lista,v) => (lista.find(x=>x[0]===v)||[v,v||'—'])[1];

const ORDEN = { campo:'full_name', dir:'asc' };
let SB=null, CLIENTES=[], DOCUMENTOS=[], VINCULOS=[], ACCESOS=[], FACTURAS=[], COBRADO={}, YO=null, SEL=null;
/* Quién soy, en minúsculas: `clients.propietario` guarda `auth.email()` tal
   cual, y es lo único con lo que esta pantalla puede saber si una ficha es la
   que YO di de alta. `YO` (la ficha de `usuarios`) no trae el correo. */
let MI_EMAIL = '';
/* El equipo activo, para el desplegable del traspaso. Solo lo pide un admin:
   es el único que puede traspasar, y a los demás sería un viaje de red por una
   lista que nunca van a ver. */
let EQUIPO = [];
const nombreDe = email => {
  const u = EQUIPO.find(x => String(x.email).toLowerCase() === String(email || '').toLowerCase());
  return (u && u.nombre) || email || '';
};
/* Editar una ficha YA EXISTENTE es solo de admin/super_admin desde el
   7-ago-2026 (petición del owner); crear una nueva ("+ Nuevo comprador")
   sigue abierto a cualquier agente — es alta de datos, no lo que se pidió
   proteger. Mismo patrón que ya usan facturas/index.html y
   documentacion/index.html para gatear acciones solo-admin. La RLS de
   `clients` (operaciones/sql/clients_solo_admin_edita.sql) es quien de
   verdad lo impide; esto solo evita que un agente rellene un formulario
   que luego la base va a rechazar. */
let ES_ADMIN = false;

async function cargar(){
  const [c, d, v, a, f, cb, dir] = await Promise.all([
    SB.from('clients').select('*').order('full_name'),
    SB.from('documents').select('*').order('uploaded_at',{ascending:false}),
    // qué contratos ha firmado cada persona. Si la migración aún no está,
    // falla sola y la ficha simplemente no muestra el bloque.
    // precio_reserva (12-ago, hallazgo Legal ALTA): la cuota de una Carta de
    // Reserva NO es precio_total (ver nota junto a `lwEsPreliminar`, más abajo) —
    // sin este campo, un cliente con SOLO una Carta de Reserva salía con
    // "Precio pactado"/"Pendiente" en blanco aunque tuviera una cuota real,
    // exigible y con penalización por desistimiento (carta_reserva_hak_sewa,
    // cl. 4.1/7.2). Columna concreta, no `datos` entero (pesa MB por anexos).
    /* ⚠️ SIN `precio_reserva` — y no es un descuido, es lo contrario. Ese campo
       sale de `contratos.datos`, y basta nombrarlo para que Postgres descomprima
       el jsonb ENTERO de cada contrato del join: 70 MB repartidos en 112 filas,
       tocadas 144 veces por este join. Medido el 24-ago-2026 sobre la base real:
       **5.561 ms** con el campo, milisegundos sin él. Era la carga más lenta de
       la suite. Ahora se pide solo para los contratos de UNA ficha, y solo para
       los preliminares, que son los únicos que lo usan (ver `cuotaReserva`). */
    SB.from('contrato_compradores').select('client_id,rol,contratos(id,numero,tipo,proyecto_nombre,fecha_firma,bloqueado,precio_total,moneda)'),
    // accesos al portal del comprador (email → ficha)
    SB.from('portal_accesos').select('email, client_id, activo, ultimo_acceso, accesos'),
    // facturas de SUS contratos (11-ago, petición del owner: no se veían aquí,
    // solo en /intranet/operaciones/ y en el propio /portal/ del comprador). Por
    // facturas_equipo(), no .from() directo — mismo motivo que en Operaciones:
    // la RLS por agente dejaría fuera las de un contrato guardado por otro.
    /* `contrato_numero` y `proyecto_nombre` desde el 27-ago-2026. Owner: «con el
       número o con el importe hay poca info». Son columnas propias de `facturas`
       —las escribe el emisor al guardar— así que no cuestan ningún join, y están
       puestas en 289 y 293 de los 301 documentos: comprobado antes de pintar una
       columna que podría haber salido vacía. */
    SB.rpc('facturas_equipo').select('id,numero,tipo,contrato_id,contrato_numero,proyecto_nombre,total,moneda,fecha_emision,anulada'),
    // "cobrado" real por contrato (reforma del modelo de facturación, 11-ago):
    // mismo contrato_cobrado()/contratos_cobrado_equipo() que usa Operaciones,
    // una sola fuente para no reimplementar la fórmula (solo recibí cuenta).
    SB.rpc('contratos_cobrado_equipo'),
    /* EL DIRECTORIO — 14-sep-2026, decisión del owner ────────────────────────
       `clients` solo devuelve las fichas que TÚ diste de alta (RLS del 11-sep).
       Con 179 fichas y 15 dueños, un agente veía entre 1 y 14: buscaba a un
       comprador que ya existe, no lo encontraba, lo creaba otra vez y la base
       se lo rechazaba contra una fila invisible. En las 24h del 13 al 14-sep
       eso fueron 17 altas rechazadas en 18 minutos.
       `compradores_directorio()` devuelve la IDENTIDAD de todas (sin `notes`).
       Lo del negocio de cada uno —contratos, facturas, cobros— NO viaja aquí y
       sigue filtrado por autor: `clients` no tiene ni una columna de dinero. */
    SB.rpc('compradores_directorio'),
  ]);
  if(c.error) throw c.error;
  const mias = c.data || [];
  /* La ficha COMPLETA manda sobre la entrada del directorio: si es mía, uso la
     fila de `clients` (trae `notes`, y es la que la RLS deja editar). Las demás
     se marcan con `_directorio` — se ven, no se abren. */
  if(dir && !dir.error && Array.isArray(dir.data)){
    const mio = new Map(mias.map(x => [x.id, x]));
    CLIENTES = dir.data
      .map(x => mio.get(x.id) || Object.assign({}, x, { _directorio:true }))
      .sort((x, y) => String(x.full_name||'').localeCompare(String(y.full_name||'')));
  }else{
    // Sin directorio (migración aún no aplicada, o RPC caída) la pantalla no se
    // queda en blanco: vuelve a ser lo de antes, solo lo tuyo. Y se dice.
    CLIENTES = mias;
    if(dir && dir.error) toastMal(lwT('No se pudo leer el directorio de compradores: ') + dir.error.message);
  }
  DOCUMENTOS = d.error ? [] : (d.data || []);
  VINCULOS = v.error ? [] : (v.data || []);
  COBRADO = {}; (cb.error ? [] : (cb.data || [])).forEach(x => { COBRADO[x.contrato_id] = Number(x.cobrado) || 0; });
  ACCESOS = a.error ? [] : (a.data || []);
  FACTURAS = f.error ? [] : (f.data || []);
  if(!EQUIPO.length){
    /* Antes solo se pedía para admin (era solo para el desplegable del
       traspaso). La columna «Agente» del listado (14-sep) lo necesita para
       TODOS: la policy "el equipo se ve entre si" ya deja leer nombre/email
       de cualquier compañero a cualquier agente, así que esto no abre nada
       que la base no dejara — solo dejaba de pedirse. */
    const { data: eq } = await SB.from('usuarios')
      .select('email,nombre,rol,activo').eq('activo', true).order('nombre');
    // Si falla, el desplegable del traspaso sale vacío y la columna se queda
    // en el email crudo — que es lo que de verdad importa ver.
    EQUIPO = eq || [];
  }
  if(d.error) toastMal(lwT('No se pudieron leer los documentos: ') + d.error.message);
  if(f.error) toastMal(lwT('No se pudieron leer las facturas: ') + f.error.message);
  if(a.error) toastMal(lwT('No se pudieron leer los accesos al portal: ') + a.error.message);
  if(cb.error) toastMal(lwT('No se pudo calcular lo cobrado: ') + cb.error.message);
}

/* ── CUÁNTO LLEVA PAGADO, PROYECTO A PROYECTO ──────────────────────────────
   Encargo del owner, 24-ago-2026: «en la ficha de cliente haz más visible
   cuánto lleva pagado el cliente en cada proyecto; lo haces bien con barras en
   Proyectos y Vencimientos». Hasta hoy esta ficha daba UNA cifra sumada de
   todo, y con dos villas en dos proyectos no había forma de saber cuál va
   pagada y cuál no.

   POR PROYECTO Y NO POR CONTRATO, a propósito: una villa se vende en dos
   documentos —Bloqueo de Parcela (suelo) + Contrato de Construcción (obra)— y
   sumarlos es lo correcto, no un duplicado (`contexto/suite_lawang.md` → «El
   modelo de venta»). Una fila por contrato partiría cada villa en dos barras
   al 50% que no significan nada.

   Las reglas de qué suma son las MISMAS que la cifra de arriba, no una segunda
   interpretación:
   · el precio NO cuenta los preliminares (`lwEsPreliminar`) — la Carta de
     Reserva repite el precio del contrato real que la sustituye;
   · si el proyecto SOLO tiene preliminares, se enseña la cuota de reserva con
     su etiqueta, porque es un pago exigible de verdad y dejarlo en blanco se
     leería como «no debe nada»;
   · el cobrado cuenta TODO recibí, venga de la reserva o del contrato real.

   La moneda se resuelve por grupo: un cliente con un proyecto en EUR y otro en
   IDR no puede tener una cifra sumada (y arriba se dice), pero SÍ puede tener
   su barra en cada uno. */
function pagosPorProyecto(suyos){
  const grupos = new Map();
  suyos.forEach(x => {
    const k = (x.proyecto_nombre || '').trim() || '— sin proyecto —';
    if(!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push(x);
  });
  if(grupos.size === 0) return '';
  const filas = [...grupos.entries()].map(([nombre, cts]) => {
    const monedas = [...new Set(cts.map(x => x.moneda || 'EUR'))];
    const moneda = monedas[0];
    const sumables = cts.filter(x => !lwEsPreliminar(x.tipo));
    const soloReserva = !sumables.length;
    const base = soloReserva ? cts : sumables;
    const precio = base.reduce((a,x) => a + (Number(soloReserva ? cuotaReserva(x) : x.precio_total)||0), 0) || null;
    const cobrado = cts.reduce((a,x) => a + (COBRADO[x.id]||0), 0);
    // Sin precio no hay porcentaje, y ahí NO se pinta barra: una barra vacía
    // se lee como «no ha pagado nada», que es distinto de «no sabemos contra
    // qué compararlo». Se dice con palabras.
    const pct = precio ? Math.round(cobrado / precio * 100) : null;
    const mezcla = monedas.length > 1;
    return `<div class="pp-fila">
      <div class="pp-cab">
        <b>${esc(nombre)}</b>
        <span>${mezcla ? '—' : (esc(lwFormatoImporte(cobrado, moneda)) + (precio ? ' de ' + esc(lwFormatoImporte(precio, moneda)) : ''))}${
          pct != null && !mezcla ? ` · <b style="color:#3F5230">${pct}%</b>` : ''}</span>
      </div>
      ${pct != null && !mezcla
        ? `<div class="lw-bar cobro" role="img" aria-label="Pagado el ${pct}% de ${esc(nombre)}"><i style="width:${Math.min(100, pct)}%"></i></div>`
        : ''}
      <p class="nota" style="margin:3px 0 0">${
        mezcla ? 'Sus documentos de este proyecto están en monedas distintas (' + esc(monedas.join(', ')) + '): no se pueden sumar.'
        : soloReserva ? 'Solo Carta(s) de Reserva: el importe es la cuota de reserva, no el precio final de la villa.'
        : !precio ? 'Sus contratos de este proyecto no fijan precio todavía: solo se puede decir lo cobrado.'
        : esc(cts.map(x => x.numero || 'sin nº').join(' · '))}</p>
    </div>`;
  }).join('');
  return `<div class="pp-lista">${filas}</div>`;
}

/* ── LA CUOTA DE RESERVA, A DEMANDA ────────────────────────────────────────
   Solo hace falta cuando un cliente tiene ÚNICAMENTE Cartas de Reserva: ahí el
   importe exigible es la cuota, no el precio de la villa (hallazgo Legal ALTA,
   12-ago-2026). Son uno o dos contratos por ficha, así que se piden al abrirla
   en vez de arrastrarlos en la carga de todos. */
const CUOTA_RESERVA = {};   // contrato_id -> texto de la cuota (o null si no la fija)

async function cargarCuotasReserva(ids){
  const faltan = ids.filter(id => !(id in CUOTA_RESERVA));
  if(!faltan.length) return false;
  const { data, error } = await SB.rpc('contratos_equipo')
    .select('id,precio_reserva:datos->fields->>precio_reserva').in('id', faltan);
  if(error){
    // No poder leerla NO es «no tiene»: se dice, en vez de enseñar un importe
    // en blanco que se leería como «no debe nada».
    toastMal(lwT('No se pudo leer la cuota de reserva: ') + error.message);
    return false;
  }
  (data || []).forEach(c => { CUOTA_RESERVA[c.id] = c.precio_reserva || null; });
  faltan.forEach(id => { if(!(id in CUOTA_RESERVA)) CUOTA_RESERVA[id] = null; });
  return true;
}

/* ── EL REGISTRO DE ENVÍOS, A DEMANDA (31-ago-2026, encargo del owner) ──────
   Mismo criterio que la cuota de reserva arriba: `correos_enviados` crece sin
   tope (no es "uno o dos por ficha" como la cuota, pero tampoco se puede
   arrastrar entera en la carga de los 164 compradores — mismo riesgo que ya
   midió la nota de `precio_reserva`, 5.561ms por traer de más). Se pide por
   ficha, filtrando por los contrato_id/factura_id de ESTA persona, y solo la
   primera vez que se abre (clave = client_id). */
const CORREOS_COMPRADOR = {};   // client_id -> filas de correos_enviados
async function cargarCorreosComprador(clientId, contratoIds, facturaIds){
  if(clientId in CORREOS_COMPRADOR) return false;
  if(!contratoIds.length && !facturaIds.length){ CORREOS_COMPRADOR[clientId] = []; return false; }
  const partes = [];
  if(contratoIds.length) partes.push(`contrato_id.in.(${contratoIds.join(',')})`);
  if(facturaIds.length) partes.push(`factura_id.in.(${facturaIds.join(',')})`);
  const { data, error } = await SB.from('correos_enviados')
    .select('para,asunto,via,enviado_por,enviado_en,contrato_id,factura_id')
    .or(partes.join(','))
    .order('enviado_en', { ascending:false });
  if(error){
    toastMal(lwT('No se pudo leer el registro de envíos: ') + error.message);
    CORREOS_COMPRADOR[clientId] = [];   // ver la nota de cargarCuotasReserva: no es "sin correos", es "no se sabe"; pero sin esto el bloque se queda pidiendo para siempre
    return false;
  }
  CORREOS_COMPRADOR[clientId] = data || [];
  return true;
}

/* ── Soporte, lado equipo — resumen, no la herramienta entera (1-sep-2026) ──
   Hasta hoy esto era dos fieldsets completos (Soporte + Mensajes) con su
   propio hilo y su propio formulario de respuesta — el owner los vio
   duplicados entre sí Y perdidos dentro de la ficha ("ahí no se ve").
   Se unificaron en un solo hilo (mensajes_comprador + hilo_soporte) con su
   propia herramienta, `/intranet/soporte/` (bandeja de TODOS los
   compradores, con filtro y respuesta). Aquí solo queda un resumen — de qué
   va el último mensaje y si sigue abierto — con un botón que lleva a
   responder de verdad. Repetir aquí el hilo completo habría sido la MISMA
   duplicación que se acaba de cerrar, solo que en dos sitios en vez de tres. */
const HILO_COMPRADOR = {};   // client_id -> {abiertos, total, actualizado_en, ultimo_de, ultimo_texto} | null

/* Un comprador puede tener VARIOS tickets a la vez desde el 1-sep (ya no es
   un hilo único) — por eso hilo_soporte ya no se lee con maybeSingle(), y el
   resumen aquí es un CONTEO (cuántos abiertos de cuántos totales), no el
   estado de "el" hilo. */
async function cargarSoporte(clientId){
  if(clientId in HILO_COMPRADOR) return false;
  const [{ data: msgs, error }, { data: hilos, error: e2 }] = await Promise.all([
    SB.from('mensajes_comprador').select('de,texto,creado_en')
      .eq('client_id', clientId).order('creado_en', { ascending:false }).limit(1),
    SB.from('hilo_soporte').select('estado,actualizado_en').eq('client_id', clientId),
  ]);
  if(error || e2){
    toastMal(lwT('No se pudo leer Soporte: ') + (error || e2).message);
    return false;   // no se cachea el fallo: la próxima vez que se abra la ficha, reintenta
  }
  const ultimo = (msgs || [])[0];
  const filas = hilos || [];
  HILO_COMPRADOR[clientId] = ultimo
    ? { abiertos: filas.filter(h => h.estado === 'abierto').length, total: filas.length,
        actualizado_en: filas.length ? filas.map(h => h.actualizado_en).sort().slice(-1)[0] : ultimo.creado_en,
        ultimo_de: ultimo.de, ultimo_texto: ultimo.texto }
    : null;   // null = de verdad no hay nada, no "no se sabe" (esa es la razón de que undefined siga significando "cargando")
  return true;
}

/* Lo que vale un contrato preliminar: su cuota si la fijó, y si no el precio
   total como aproximación — el mismo criterio que había cuando el dato viajaba
   en la carga inicial. */
const cuotaReserva = x => CUOTA_RESERVA[x.id] ?? x.precio_total;

/* estado de caducidad de un comprador, mirando TODOS sus documentos */
function alerta(clientId){
  const docs = DOCUMENTOS.filter(x => x.client_id === clientId && x.caduca_el);
  if(!docs.length) return null;
  const peor = Math.min(...docs.map(x => dias(x.caduca_el)));
  if(peor < 0)  return ['mal','Documento caducado'];
  if(peor <= 60) return ['espera','Caduca en ' + peor + ' d'];
  return null;
}

/* PAGINACIÓN (26-ago-2026). Son 155 compradores y salían los 155. Pieza
   compartida (`assets/paginacion.js`), anclada a `#caja-tabla` y NO al
   `<tbody>`: un `<div>` hermano de un `<tbody>` el navegador lo saca de la tabla
   al parsear y el pie acaba flotando encima.
   Va FUERA de `pintarLista`: dentro, el `let` se reiniciaba en cada pintado, se
   creaba un paginador nuevo y se colgaba otro pie — uno por repintado.
   El contador de arriba sigue siendo del filtro entero, no de la página. */
let _PAG = null;
function PAGINADOR(){
  if(!_PAG){ _PAG = lwPaginador('#caja-tabla'); _PAG.alCambiar(pintarLista); }
  return _PAG;
}

function pintarLista(){

    ORDEN, (c, campo) => c[campo]);
  $('#listaC').innerHTML = vis.length ? PAGINADOR().pagina(vis).map(c => {
    const a = alerta(c.id);
    const n = DOCUMENTOS.filter(x => x.client_id === c.id).length;
    return `<tr data-id="${esc(c.id)}" class="${SEL===c.id?'sel':''}">
      <td class="clave">${esc(c.full_name || 'Sin nombre')}${
        c.tipo === 'empresa' ? ' <span class="sui-tag">' + lwT('Empresa') + '</span>' : ''}${
        /* La marca del directorio (14-sep): existe, pero no es tuya. Sin ella
           el agente abre la ficha esperando trabajar con ella y se encuentra
           una pantalla a medias sin saber por qué. */
        c._directorio ? ' <span class="sui-tag" title="' + esc(lwT('De otro compañero: solo consulta')) + '">' + lwT('de otro') + '</span>' : ''}</td>
      <td>${esc(c.email || '—')}${c.phone ? ' <span class="flojo">· ' + esc(c.phone) + '</span>' : ''}</td>
      <td>${esc(c.nationality || '—')}</td>
      <td>${esc(c.passport_number || '—')}</td>
      <td><span class="sui-tag ${c.kyc_status==='verified'?'ok':(c.kyc_status==='rejected'?'alerta':'espera')}">${esc(etiqueta(KYC,c.kyc_status||'pending'))}</span>${
        a ? ` <span class="sui-tag ${a[0]==='mal'?'alerta':a[0]}">${esc(a[1])}</span>` : ''}</td>
      <td class="num ${n?'':'flojo'}">${n}</td>
      <td>${esc(nombreDe(c.propietario) || '—')}</td>
    </tr>`;
  }).join('')
  : `<tr><td colspan="7"><div class="sui-nada"><b>${CLIENTES.length ? 'Nadie coincide' : 'Todavía no hay compradores'}</b>${
      CLIENTES.length ? 'Prueba con otra búsqueda.' : 'Créalo con «+ Nuevo comprador».'}</div></td></tr>`;
}

// partirTelefono() sale de geo.js — ver nota junto a NACIONALIDADES, arriba.

function pintarFicha(){
  /* Los contratos preliminares de esta ficha necesitan su cuota. Se piden y se
     repinta cuando llegan; `CUOTA_RESERVA` recuerda lo pedido, así que la
     segunda vuelta no vuelve a entrar y no hay bucle. */
  /* Una ficha del directorio no tiene nada de esto que pedir: sus contratos,
     sus correos y su soporte los tapa la RLS y volverían vacíos. Cuatro
     peticiones de red por cada vez que se abre, para nada. */
  const delDirectorio = SEL && SEL !== 'nuevo' &&
        !!(CLIENTES.find(x => x.id === SEL) || {})._directorio;
  if(SEL && SEL !== 'nuevo' && !delDirectorio){
    const suyos = VINCULOS.filter(v => v.client_id === SEL && v.contratos).map(v => v.contratos);
    const prelim = suyos.filter(x => lwEsPreliminar(x.tipo)).map(x => x.id);
    if(prelim.length) cargarCuotasReserva(prelim).then(hubo => { if(hubo && SEL) pintarFicha(); });
    // Registro de envíos: mismo patrón, ver la nota junto a CORREOS_COMPRADOR.
    const suyosIds = new Set(suyos.map(x => x.id));
    const facturaIds = FACTURAS.filter(x => suyosIds.has(x.contrato_id)).map(x => x.id);
    if(!(SEL in CORREOS_COMPRADOR))
      cargarCorreosComprador(SEL, suyos.map(x => x.id), facturaIds).then(hubo => { if(hubo && SEL) pintarFicha(); });
    if(!(SEL in HILO_COMPRADOR))
      cargarSoporte(SEL).then(hubo => { if(hubo && SEL) pintarFicha(); });
  }
  const nuevo = SEL === 'nuevo';
  const c = nuevo ? { kyc_status:'pending' } : CLIENTES.find(x => x.id === SEL);
  if(!c){ suiCerrarCajon(); return; }
  const docs = nuevo ? [] : DOCUMENTOS.filter(d => d.client_id === c.id);
  /* Del DIRECTORIO: existe, se ve quién es, no se abre. No es tuya ni la
     supervisas, así que ni documentos, ni portal, ni contratos — esas listas
     vienen vacías de todos modos porque su RLS no te las da. */
  const soloDirectorio = !nuevo && !!c._directorio;
  /* ¿La di de alta yo? Es lo que la policy de UPDATE del 14-sep pregunta
     (`es_suyo(propietario)`). Sin `propietario` (20 fichas del backfill viejo)
     NO es de nadie: `es_suyo(NULL)` es false salvo para admin, así que la
     pantalla tampoco la abre — sería prometer un guardado que la base rechaza. */
  const mia = !nuevo && !soloDirectorio && !!c.propietario &&
              String(c.propietario).toLowerCase() === MI_EMAIL;
  /* Un contrato ya FIRMADO congela la ficha: su pasaporte y su domicilio están
     impresos dentro del documento que el comprador firmó. Aquí solo se ven los
     contratos que la RLS deja ver, así que esto es una pista para la pantalla —
     quien lo impide de verdad es `cliente_con_contrato_firmado()` en la base. */
  const firmada = !nuevo && VINCULOS.some(v => v.client_id === c.id && v.contratos && v.contratos.bloqueado);
  /* Crear una ficha nueva sigue abierto a cualquier agente. Editar una que ya
     existe era solo admin/super_admin (7-ago-2026, ver nota junto a ES_ADMIN);
     desde el 14-sep el AUTOR también corrige la suya mientras no esté firmada
     — el agente que se equivocaba al teclear el correo al crearla no podía
     arreglarlo, y el aviso que recibía («tu sesión ha caducado») era falso. */
  const soloLectura = !nuevo && !ES_ADMIN && !(mia && !firmada);
  /* LA FICHA QUE YA EXISTE ABRE CERRADA — 16-ago-2026, a peticion del owner:
     «que haya que aprobar la edicion antes».

     El motivo no es la ceremonia. La ficha se abre para MIRAR mucho mas a
     menudo que para cambiar algo -a comprobar un pasaporte, a ver si el KYC
     esta al dia, a copiar un email- y con los campos vivos basta rozar el
     teclado sobre uno enfocado para dejar el dato mal sin enterarse. Y estos
     datos no se quedan aqui: son los que se copian a un contrato y los que
     salen impresos en un documento que firma un comprador real.

     Una ficha NUEVA no abre cerrada: no hay nada que proteger todavia y pedir
     permiso para rellenar un formulario vacio es puro estorbo. */
  const cerrada = !nuevo;
  const dis = (soloLectura || cerrada) ? 'disabled' : '';

  const tel = partirTelefono(c.phone);

  const filas = docs.length ? docs.map(d => {
    const dd = dias(d.caduca_el);
    let cad = '<span class="tag neutro">' + lwT('sin caducidad') + '</span>';
    if(d.caduca_el) cad = dd < 0 ? `<span class="tag mal">caducado hace ${-dd} d</span>`
                       : dd <= 60 ? `<span class="tag espera">${fFecha(d.caduca_el)}</span>`
                       : `<span class="tag ok">${fFecha(d.caduca_el)}</span>`;
    return `<tr>
      <td>${esc(etiqueta(DOCS,d.doc_type))}</td>
      <td>${fFecha(d.uploaded_at)}</td>
      <td>${cad}</td>
      <td><button class="btn" data-ver="${esc(d.storage_path||'')}" ${d.storage_path?'':'disabled'}>${lwT('Abrir')}</button>${
        ES_ADMIN ? `<button class="btn borrar" data-borrar-doc="${esc(d.id)}" title="Retirar este documento">${lwT('Borrar')}</button>` : ''}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="4" class="nota">${lwT('Sin documentos todavía.')}</td></tr>`;

  /* La ficha va en el CAJÓN lateral — norma de la suite desde el 31-jul: se lee
     y se edita sin perder de vista la lista de la que sale. */
  /* La estrella roja solo sale en una ficha NUEVA: al editar no se exige nada
     (hay 200+ fichas antiguas sin nacionalidad ni pasaporte y marcarlas como
     incompletas sería pedir un dato que quizá nadie tiene ya). */
  const ob = nuevo ? ' <span class="sui-oblig" title="' + lwT('Obligatorio para crear la ficha') + '">*</span>' : '';

  const cuerpoFicha = `

    <fieldset id="fsIdentidad">
      <legend>${lwT('Identidad')}</legend>
      ${!soloLectura ? '' :
        /* Un «no puedes» sin el porqué manda a probar otra vez. Los tres
           motivos son distintos y llevan a sitios distintos: pedir el traspaso,
           hablar con un admin, o nada (la firma no se toca). */
        soloDirectorio
          ? '<p class="nota">' + lwT('Esta ficha la dio de alta ') + '<b>' + esc(c.propietario || lwT('nadie (ficha antigua sin autor)')) + '</b>' +
            lwT(', así que aquí solo ves quién es. No crees una segunda: para trabajar con ella pide que te la traspasen, o ponla en tu contrato por su pasaporte — el generador la encuentra igual.') + '</p>'
        : firmada
          ? '<p class="nota">' + lwT('Esta ficha cuelga de un contrato ya FIRMADO: su pasaporte y su domicilio están impresos dentro de ese documento, así que no se cambian desde aquí. Si hay un error real en el documento, es cosa de un administrador.') + '</p>'
        : '<p class="nota">' + lwT('Solo un administrador puede editar estos datos. Puedes consultarlos y gestionar la documentación de más abajo.') + '</p>'}
      <label for="f-tipo">${lwT('Tipo de comprador')}</label>
      <select class="sui-sel" id="f-tipo" ${dis}>
        <option value="persona" ${(c.tipo||'persona')==='persona'?'selected':''}>${lwT('Persona física')}</option>
        <option value="empresa" ${c.tipo==='empresa'?'selected':''}>${lwT('Empresa')}</option>
      </select>
      <p class="nota" id="notaTipo"></p>
      <label for="f-nombre" id="lab-nombre">${lwT('Nombre completo')}${ob}</label><input id="f-nombre" ${dis} style="text-transform:uppercase" value="${esc(c.full_name||'')}">
      <div class="sui-row">
        <div><label for="f-email">${lwT('Email')}${ob}</label><input id="f-email" type="email" ${dis} value="${esc(c.email||'')}">
          <p class="nota">${lwT('Este correo es solo de contacto — cambiarlo NO cambia con qué email entra al portal. Eso se gestiona aparte, en «Portal del comprador» más abajo.')}</p></div>
        <div><label>${lwT('Teléfono')}${ob}</label>
          <div style="display:flex;gap:6px">
            <!-- Sin <datalist>: lo abre lwPicker (ver el final de pintarFicha).
                 Y 86px: el prefijo mas largo del mundo es «+998», o sea 4
                 caracteres. Con 108 el hueco util eran 57px para ~30px de texto
                 y le robaba sitio al numero, que es el dato largo. -->
            <input id="f-tel-pre" ${dis} style="flex:0 0 86px" value="${esc(tel.prefijo||'')}" placeholder="Prefijo">

  suiAbrirCajon({
    titulo: nuevo ? 'Nuevo comprador' : esc(c.full_name || 'Sin nombre'),
    sub: nuevo ? 'Los campos con * son obligatorios: sin ellos la ficha no se crea.'

    pie: soloLectura

          /* Borrar, SOLO super_admin y SOLO en la ficha cerrada (18-ago-2026,

          (YO && YO.rol === 'super_admin'

  /* PERSONA o EMPRESA — 19-ago-2026, encargo del owner ─────────────────────

     `full_name`, identificación fiscal en `passport_number`, país de
     constitución en `nationality`, domicilio social en `address`). No es
     pereza: `contrato_identificadores` compara identidad con pasaporte+email

  const ETIQUETAS = {
    persona: { nombre:lwT('Nombre completo'), nac:lwT('Nacionalidad'), pas:lwT('Pasaporte / identificación fiscal'),

  const bt = $('#btnTraspasar'); if(bt) bt.addEventListener('click', () => traspasar(c));

  const bg = $('#btnGuardar'); if(bg) bg.addEventListener('click', () => guardar(nuevo ? null : c.id));
  const bb = $('#btnBorrarComprador'); if(bb) bb.addEventListener('click', () => borrarComprador(c));
  /* «Crear contrato» (18-ago-2026, encargo del owner). Abre Contratos con un
     documento en blanco YA ENLAZADO a esta ficha (?cliente=<id>), con sus datos
     puestos. Es la dirección que faltaba: hasta hoy el comprador nacía del
     contrato, y a partir de ahora el contrato sale del comprador.
     En pestaña nueva a propósito: quien está repasando fichas casi nunca quiere
     perder la lista en la que estaba. */
  const bn = $('#btnNuevoContrato');
  if(bn) bn.addEventListener('click', () => {
    window.open('/contracts/?cliente=' + encodeURIComponent(c.id), '_blank', 'noopener');
  });
  $('#btnCerrar').addEventListener('click', suiCerrarCajon);
  const bs = $('#btnSubir'); if(bs) bs.addEventListener('click', () => subir(c.id));
  const bi = $('#btnPortalInv'); if(bi) bi.addEventListener('click', () => invitarPortal(c));
  const bp = $('#btnPortalPass'); if(bp) bp.addEventListener('click', () => passwordPortal(c));
  const br = $('#btnPortalRev'); if(br) br.addEventListener('click', () => revocarPortal(c));
  const bpv = $('#btnPreviewPortal'); if(bpv) bpv.addEventListener('click', () => abrirPreviewPortal(c));
  document.getElementById('suiCajon').querySelectorAll('[data-ver]')
    .forEach(b => b.addEventListener('click', () => abrir(b.dataset.ver)));
  document.getElementById('suiCajon').querySelectorAll('[data-borrar-doc]')
    .forEach(b => b.addEventListener('click', () => borrarDocumento(b.dataset.borrarDoc, b)));
  const bvs = $('#btnVerSoporte');
  if(bvs) bvs.addEventListener('click', () => window.open('/intranet/soporte/?id=' + encodeURIComponent(c.id), '_blank', 'noopener'));
}

/* ---------- retirar UN documento (admin) ----------
   Owner, 27-ago-2026: «poder borrar documentación como pasaportes o algo si hay
   algo mal». El caso real es un fichero equivocado o ilegible, no una purga.

   EL ORDEN IMPORTA, Y ES: FILA PRIMERO, FICHERO DESPUÉS.
   La fila de `documents` es lo que esta pantalla enseña; el fichero del bucket
   solo se ve si alguien pulsa «Abrir». Si el borrado se corta a la mitad:
     · fila fuera y fichero dentro → un huérfano en el bucket. Molesto, invisible
       para el operador, y se limpia después con la ruta, que se avisa.
     · fila dentro y fichero fuera → la pantalla sigue ofreciendo un documento
       que ya no existe, y el «Abrir» falla sin explicar por qué.
   La segunda es peor, así que se corre el riesgo de la primera. Es el mismo
   orden y el mismo motivo que `borrar_comprador()` de aquí abajo.

   🔴 Y HACÍA FALTA UNA POLÍTICA NUEVA. `documents` tenía INSERT, SELECT y
   UPDATE, y ninguna de DELETE: con RLS activa, un delete no falla, devuelve
   CERO FILAS AFECTADAS. Sin `20260827110851_documents_borrado_por_admin.sql`
   este botón habría borrado el fichero y dejado la fila, en silencio. Por eso
   se comprueba el `count` de vuelta y no solo el `error`. */
async function borrarDocumento(id, btn){
  const d = DOCUMENTOS.find(x => x.id === id);
  if(!d) return;
  const nombre = etiqueta(DOCS, d.doc_type) || 'documento';
  if(!await lwConfirmar({
    titulo: 'Retirar ' + nombre,
    cuerpo: '<p>' + lwT('Se retira') + ' <b>' + esc(nombre) + '</b>' + (d.uploaded_at ? ' (subido el ' + esc(fFecha(d.uploaded_at)) + ')' : '')
          + ' ' + lwT('de la ficha, y su fichero del archivo privado.') + '</p>'
          + '<p>' + lwT('No hay papelera: si el documento sigue haciendo falta habrá que volver a subirlo.') + '</p>',
    confirmar: lwT('Retirar el documento'), cancelar: lwT('Dejarlo') })) return;

  if(btn){ btn.disabled = true; btn.textContent = lwT('Retirando…'); }
  const { error, count } = await SB.from('documents').delete({ count:'exact' }).eq('id', id);
  if(error || !count){
    if(btn){ btn.disabled = false; btn.textContent = 'Borrar'; }
    /* Cero filas sin error es la RLS diciendo que no, no un documento que ya no
       estaba: si no estuviera, tampoco lo enseñaría esta tabla. Se distingue,
       porque «no se ha borrado» y «no tienes permiso» se arreglan distinto. */
    toastMal(error ? lwT('No se pudo retirar: ') + error.message
                : lwT('No se ha retirado: tu usuario no tiene permiso para borrar documentos.'));
    return;
  }
  if(d.storage_path){
    const { error: eSt } = await SB.storage.from('kyc').remove([d.storage_path]);
    if(eSt) toastMal(lwT('Documento retirado de la ficha, pero su fichero sigue en el archivo (') + d.storage_path + '): ' + eSt.message);
  }
  toast(nombre + ' retirado');
  /* Se recarga y se repinta la ficha ABIERTA, no se cierra el cajón: retirar un
     documento suele venir seguido de subir el correcto, y cerrar obligaría a
     buscar otra vez al comprador en la lista. */
  await cargar();
  pintarFicha();
  pintarLista();
}

/* ---------- borrar una ficha (solo super_admin): los duplicados ----------
   La logica de verdad vive en `borrar_comprador()` de la base (patron de
   borrar_operacion): es_super_admin() y tres bloqueos — contratos vinculados
   (nombrandolos), acceso al portal y filas del esquema viejo. Aqui solo se
   confirma, se llama y se limpia el bucket: los ficheros KYC del duplicado los
   quita ESTA sesion con las rutas que devuelve la RPC, porque una funcion de la
   base no alcanza al almacenamiento (la misma leccion que borrarOperacion). */
async function borrarComprador(c){
  const misDocs = DOCUMENTOS.filter(d => d.client_id === c.id);
  const ok = await lwConfirmar({
    titulo: lwT('Borrar la ficha de %c', { c: c.full_name || lwT('este comprador') }),
    cuerpo: '<p>Se borra la ficha' + (misDocs.length
        ? ' ' + lwT('y sus') + ' <b>' + lwT(misDocs.length === 1 ? '%n documento KYC' : '%n documentos KYC', { n: misDocs.length }) + '</b> ' + lwT('del archivo privado') : '') + '.</p>'
      + '<p>Si estuviera vinculada a un contrato o tuviera acceso al portal, el sistema lo impide '
      + lwT('y te dice cuál — esta acción es para') + ' <b>' + lwT('duplicados sueltos') + '</b>.</p>'
      + '<p>' + lwT('No hay papelera.') + '</p>',
    confirmar: lwT('Borrar la ficha'),
    tono: 'peligro',
  });
  if(!ok) return;

  const btn = $('#btnBorrarComprador'); if(btn){ btn.disabled = true; btn.textContent = lwT('Borrando…'); }
  const { data, error } = await SB.rpc('borrar_comprador', { p_client_id: c.id });
  if(error){
    toastMal(error.message);
    if(btn){ btn.disabled = false; btn.textContent = lwT('Borrar comprador'); }
    return;
  }
  // los ficheros del bucket, con la sesion del super_admin. Si fallara, la ficha
  // ya no existe (lo importante) y las rutas quedan en el aviso para limpiarlas.
  const rutas = (data && data.rutas_kyc) || [];
  if(rutas.length){
    const { error: eSt } = await SB.storage.from('kyc').remove(rutas);
    if(eSt) toastMal(lwT('Ficha borrada, pero ') + rutas.length + ' fichero(s) KYC no se pudieron quitar del bucket: ' + eSt.message);
  }
  toast(lwT('Ficha de ') + ((data && data.nombre) || 'comprador') + ' borrada'
    + (rutas.length ? ' · ' + rutas.length + ' documento(s) retirados' : ''));
  SEL = null;
  suiCerrarCajon();
  await cargar();
  pintarLista();
}

/* ── TRASPASAR LA FICHA ────────────────────────────────────────────────────
   14-sep-2026. Con el directorio abierto, el agente ya VE al comprador que
   otro dio de alta — pero no puede abrirlo ni corregirlo, así que el atasco se
   movía un escalón: «pídele el traspaso» no servía de nada porque no había
   ninguna pantalla para traspasar, solo SQL. Esto es esa pantalla. Sirve
   también para las fichas antiguas sin autor, que hasta hoy no eran de nadie.
   No mueve contratos ni facturas: esos cuelgan de quien los guardó. */
const sinNombre = '—';
async function traspasar(c){
  const sel = $('#f-dueno'); if(!sel || !sel.value) return;
  const nuevo = sel.value;
  if(String(c.propietario||'').toLowerCase() === nuevo.toLowerCase()){
    toastMal(lwT('Esa ficha ya es suya.')); return;
  }
  const ok = await lwConfirmar({
    // El literal de respaldo va FUERA del lwT(): el extractor de claves recoge
    // todos los literales de dentro de la llamada, y un «—» suelto se contaba
    // como una frase a traducir.
    titulo: lwT('Pasar la ficha de %n a %d', { n: c.full_name || sinNombre, d: nombreDe(nuevo) }),
    cuerpo: '<p>' + lwT('Podrá abrirla y corregirla. Sus contratos y sus facturas no se mueven.') + '</p>',
    confirmar: lwT('Traspasar'),
  });
  if(!ok) return;
  const b = $('#btnTraspasar'); if(b) b.disabled = true;
  const { error } = await SB.from('clients').update({ propietario: nuevo }).eq('id', c.id);
  if(b) b.disabled = false;
  if(error){ toastMal(lwT('No se pudo traspasar: ') + error.message); return; }
  toast(lwT('Ficha traspasada a ') + nombreDe(nuevo));
  await cargar(); pintarLista(); pintarFicha();
}

/* Pinta en rojo los campos que faltan y lleva el foco al primero. La relación
   etiqueta→input se lee del propio CAMPOS_ALTA_COMPRADOR compartido para que
   añadir un campo obligatorio mañana no exija tocar también esta función. */
const CAMPO_INPUT = { 'Nombre completo':'#f-nombre', 'Email':'#f-email',
  'Prefijo del telefono':'#f-tel-pre', 'Telefono':'#f-tel-num',
  'Nacionalidad':'#f-nac', 'Pasaporte / NPWP':'#f-pas' };
function marcarFaltantes(faltan){
  Object.values(CAMPO_INPUT).forEach(sel => {
    const el = $(sel); if(el){ el.classList.remove('sui-falta'); el.removeAttribute('aria-invalid'); }
  });
  let primero = null;
  faltan.forEach(f => {
    // «Email (no parece una direccion valida)» apunta al mismo input que «Email»
    const clave = f.replace(/ \(.*$/, '');
    const sel = CAMPO_INPUT[clave];
    const el = sel ? $(sel) : null;   // querySelector('') lanza: nunca se llama sin selector
    if(!el) return;
    el.classList.add('sui-falta');
    el.setAttribute('aria-invalid', 'true');
    if(!primero) primero = el;
    el.addEventListener('input', () => {
      el.classList.remove('sui-falta'); el.removeAttribute('aria-invalid');
    }, { once:true });
  });
  if(primero) primero.focus();
}

async function guardar(id){
  /* Siempre en mayúsculas (31-ago, petición del cliente): mismo criterio que
     ya usa la razón social del promotor (PT SAN DAL WOODS) y que es la norma
     en los documentos oficiales indonesios (KTP, pasaporte...). Se fuerza
     AQUÍ, en el único sitio que escribe `clients.full_name` — desde el 19-ago
     el contrato ya no copia el nombre, se ENLAZA a esta ficha, así que
     normalizar aquí basta para que todo lo que lo lea (contratos, facturas,
     el portal) lo vea ya en mayúsculas. */
  const nombre = $('#f-nombre').value.trim().toUpperCase();
  if(nombre.length < 2){ toastMal(lwT('Falta el nombre')); return; }
  const telNum = $('#f-tel-num').value.trim();
  const telPre = $('#f-tel-pre').value.trim();
  const esEmpresa = $('#f-tipo') && $('#f-tipo').value === 'empresa';

  /* ── SIN ESTOS SEIS DATOS NO NACE UNA FICHA — 14-sep-2026, owner ──────────
     «Exige los campos de nombre, email, prefijo + telefono, nacionalidad y
     pasaporte. Sin eso no se puede crear un cliente».

     Por qué son justo esos: son los que un contrato IMPRIME y los que el portal
     necesita para que el comprador pueda entrar. Una ficha sin pasaporte no se
     puede meter en un documento; una sin correo no puede recibirlo ni acceder a
     su portal; una sin teléfono con prefijo no se puede llamar desde Bali. Hasta
     hoy sólo se exigía el nombre, así que la ficha se creaba y el hueco aparecía
     dos semanas después, al redactar el contrato — cuando el comprador ya no
     está delante para preguntarle.

     `!id` = sólo al CREAR. Editar una ficha antigua incompleta sigue siendo
     posible: si no, corregir un teléfono en una de las 200+ fichas viejas sin
     nacionalidad obligaría a inventarse el dato, que es justo lo que la norma
     del estudio prohíbe.

     La lista NO está escrita aquí: viene de `faltanDatosComprador()` en
     assets/compradores.js, que es la misma que usa el editor de la v4. */
  if(!id){
    const faltan = faltanDatosComprador({
      full_name: nombre, email: $('#f-email').value, prefijo: telPre, telefono: telNum,
      nationality: $('#f-nac').value, passport_number: $('#f-pas').value
    });
    if(faltan.length){
      toastMal(lwT('No se puede crear la ficha, falta: ') + faltan.join(', ') +
               lwT('. Son los datos que el contrato imprime y con los que el comprador entra a su portal — si no los tienes todavía, pídeselos antes de darlo de alta.'));
      /* Y se marca EN EL CAMPO, no sólo en el aviso: el aviso se va en siete
         segundos y con seis campos en pantalla hay que poder volver a mirar
         cuál era. El foco va al primero que falta. */
      marcarFaltantes(faltan);
      return;
    }
  }
  const fila = {
    tipo: esEmpresa ? 'empresa' : 'persona',
    full_name:nombre,
    email:$('#f-email').value.trim() || null,
    phone: telNum ? (telPre ? telPre + ' ' + telNum : telNum) : null,
    nationality:$('#f-nac').value.trim() || null,
    passport_number:$('#f-pas').value.trim() || null,
    idioma_comunicacion: $('#f-idioma').value || 'es',
    // Los campos de empresa se VACÍAN al pasar a persona, no se dejan de lado:
    // si no, una ficha corregida seguiría arrastrando el CIF de cuando estaba
    // mal puesta como empresa, invisible en pantalla y visible en el contrato.
    forma_juridica: esEmpresa ? ($('#f-forma').value.trim() || null) : null,
    registro_num:   esEmpresa ? ($('#f-registro').value.trim() || null) : null,
    rep_nombre:     esEmpresa ? ($('#f-rep').value.trim() || null) : null,
    rep_cargo:      esEmpresa ? ($('#f-rep-cargo').value.trim() || null) : null,
    kyc_status:$('#f-kyc').value,
    notes:$('#f-notas').value.trim() || null,
  };
  const btn=$('#btnGuardar'); btn.disabled=true; btn.textContent=lwT('Guardando…');
  try{
    const q = id ? SB.from('clients').update(fila).eq('id',id).select().single()
                 : SB.from('clients').insert(fila).select().single();
    const { data, error } = await q;
    if(error) throw error;
    await cargar(); SEL = data.id;
    pintarLista(); pintarFicha();
    toast(lwT(id ? 'Ficha actualizada' : 'Comprador creado'));
  }catch(err){
    /* `clients.email` es UNIQUE y una familia comparte correo: el 409 de
       Postgres llegaba crudo («duplicate key value violates unique constraint»)
       y no decía ni qué campo era ni qué hacer. Es el mismo caso que ya obligó
       a que la ficha se pueda crear SIN correo (ver compradores_desde_contrato).
       PGRST116 (0 o varias filas tras el update) sale casi siempre porque la
       sesión murió a mitad de la petición (p.ej. otra pestaña de la suite hizo
       signOut de la misma sesión compartida) — la RLS deniega en silencio, sin
       lanzar un 401 claro, así que un «no se puede leer un único objeto JSON»
       crudo no dice nada útil de por qué. */
    /* ⚠️ 14-sep-2026: el `test` de arriba empezaba por `duplicate key`, así que
       CUALQUIER choque de unicidad se explicaba como si fuera el correo —
       incluido el del PASAPORTE, que es el que más salta. En las 24h previas
       hubo 14 choques de `clients_pasaporte_uniq` y 3 de correo, y los 17 se
       leyeron en pantalla como «ya hay otra ficha con ese correo»: el agente
       borraba el correo, volvía a chocar y no entendía por qué. El orden
       importa — lo específico ANTES del comodín. */
    const msg = String(err.message || '');
    const m = /clients_pasaporte_uniq/.test(msg)
      ? lwT('Ese pasaporte / NPWP ya está en otra ficha (el correo no tiene nada que ver con este aviso). Desde el 11-sep cada uno ve solo los compradores que dio de alta, así que esa ficha puede existir y NO aparecerte en la lista: no crees una segunda: pide a un administrador que te la traspase o que la enlace a tu contrato.')
      : /clients_email_tipo_key|clients_email_key/.test(msg)
      /* ⚠️ 14-sep-2026: este texto decía «si es una familia que comparte buzón,
         deja el correo en una sola e identifica a las demás por su pasaporte».
         Desde hoy el correo es OBLIGATORIO para crear, así que esa salida ya no
         existe y mandaba a un callejón sin salida. La salida real es un correo
         distinto por persona — que además es lo que el portal necesita: el
         acceso de cada comprador va por su email, y dos personas con el mismo
         entran a lo mismo. */
      ? lwT('Ya hay otra ficha DEL MISMO TIPO con ese correo. Una persona y su empresa sí pueden compartirlo, pero dos personas (o dos empresas) no. Ojo: esa otra ficha puede ser de un compañero y no aparecerte en la lista — si es la misma persona, pide que te la traspasen en vez de crearla otra vez. Si es una familia que comparte buzón, cada uno necesita el suyo: el acceso al portal va por el correo, así que con uno compartido los dos entrarían a lo mismo.')
      : /duplicate key/.test(msg)
      ? lwT('Ese dato ya está en otra ficha: ') + msg
      /* PGRST116 = «0 filas tras el update». Son dos cosas muy distintas y
         hasta el 14-sep las dos se contaban como la segunda:
         · EDITANDO una ficha existente: la policy de UPDATE no te deja (no es
           tuya, o cuelga de un contrato firmado) y la RLS no devuelve fila. Que
           esto dijera «tu sesión ha caducado» mandaba a recargar y reintentar
           un guardado que nunca iba a entrar.
         · CREANDO: ahí sí, casi siempre la sesión murió a mitad (otra pestaña
           de la suite hizo signOut de la sesión compartida). */
      : /PGRST116/.test(err.code || '') && id
      ? lwT('No se ha guardado: la base no te deja editar esta ficha. Suele ser porque no la diste de alta tú, o porque ya cuelga de un contrato firmado. Habla con un administrador — recargar no lo arregla.')
      : /PGRST116/.test(err.code || '')
      ? lwT('Tu sesión ha caducado a mitad de guardar. Recarga la página, entra de nuevo y repite el cambio — no se ha guardado.')
      : 'No se pudo guardar: ' + (err.message || err);
    toastMal(m);
    btn.disabled=false; btn.textContent = lwT(id ? 'Guardar cambios' : 'Crear comprador');
  }
}

async function subir(clientId){
  const f = $('#d-file').files[0];
  if(!f){ toastMal(lwT('Elige un fichero')); return; }
  if(f.size > 20*1024*1024){ toastMal(lwT('El fichero supera los 20 MB')); return; }
  const btn=$('#btnSubir'); btn.disabled=true; btn.textContent=lwT('Subiendo…');
  // ruta por comprador: agrupa y evita que dos ficheros con el mismo nombre choquen
  const limpio = f.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.-]/g,'_');
  const path = `${clientId}/${Date.now()}_${limpio}`;
  try{
    const up = await SB.storage.from('kyc').upload(path, f, { upsert:false, contentType:f.type || 'application/octet-stream' });
    if(up.error) throw up.error;
    const ins = await SB.from('documents').insert({
      client_id: clientId,
      doc_type: $('#d-tipo').value,
      storage_path: path,
      status: 'pending',
      caduca_el: $('#d-caduca').value || null,
    });
    if(ins.error) throw ins.error;   // el fichero ya subió; reintentar no duplica la fila
    await cargar(); pintarLista(); pintarFicha();
    toast(lwT('Documento subido'));
  }catch(err){
    toastMal(lwT('No se pudo subir: ') + (err.message||err));
    btn.disabled=false; btn.textContent=lwT('Subir documento');
  }
}

/* ── vista previa del portal (15-sep-2026) ────────────────────────────
   NO genera sesión: no hay Auth Admin API/service_role en este entorno
   para crear un magic-link real de un comprador sin su contraseña
   (verificado). Enseña la MISMA información que ve él en /portal/,
   leída con el permiso de equipo que esta ficha ya tiene cargado —
   contratos, cobrado, facturas, documentos — en un diálogo de solo
   lectura. Los datos ya están en memoria (VINCULOS/FACTURAS/COBRADO/
   DOCUMENTOS): no hace falta ninguna consulta nueva. */
function abrirPreviewPortal(c){
  const contratos = VINCULOS.filter(v => v.client_id === c.id && v.contratos).map(v => v.contratos);
  const idsContratos = new Set(contratos.map(x => x.id));
  const facturas = FACTURAS.filter(f => idsContratos.has(f.contrato_id))
    .sort((a,b) => String(b.fecha_emision||'').localeCompare(String(a.fecha_emision||'')));
  const docs = DOCUMENTOS.filter(d => d.client_id === c.id);
  const filaContrato = x => `<tr>
    <td>${esc(x.numero || lwT('borrador'))}</td>
    <td>${esc(lwTipoContrato(x.tipo))}</td>
    <td>${x.bloqueado ? lwT('Firmado') : lwT('Borrador')}</td>
    <td class="num">${!lwEsPreliminar(x.tipo) && x.precio_total != null ? esc(lwFormatoImporte(Number(x.precio_total), x.moneda)) : '—'}</td>
    <td class="num">${esc(lwFormatoImporte(COBRADO[x.id] || 0, x.moneda))}</td>
  </tr>`;
  const filaFactura = f => `<tr${f.anulada ? ' class="anulada"' : ''}>
    <td>${esc(f.numero || lwT('borrador'))}</td>
    <td>${fFecha(f.fecha_emision)}</td>
    <td class="num">${f.total != null ? esc(lwFormatoImporte(Number(f.total), f.moneda)) : '—'}</td>
    <td>${f.anulada ? lwT('Anulada') : '—'}</td>
  </tr>`;
  const filaDoc = d => `<tr><td>${esc(etiqueta(DOCS, d.doc_type))}</td><td>${fFecha(d.uploaded_at)}</td></tr>`;
  const tabla = (cols, filas, vacio) => filas.length
    ? `<table><thead><tr>${cols.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${filas.join('')}</tbody></table>`
    : `<p class="nota">${vacio}</p>`;
  const cuerpo = `
    <p class="nota">${lwT('Esto es lo que este comprador ve ahora mismo en /portal/. No se ha abierto ninguna sesión suya: se lee con tu permiso de equipo.')}</p>
    <h3 style="margin:16px 0 6px;font-size:15px">${lwT('Contratos')}</h3>
    ${tabla([lwT('Nº'), lwT('Tipo'), lwT('Estado'), lwT('Precio'), lwT('Cobrado')], contratos.map(filaContrato), lwT('Sin contratos.'))}
    <h3 style="margin:16px 0 6px;font-size:15px">${lwT('Facturas')}</h3>
    ${tabla([lwT('Nº'), lwT('Fecha'), lwT('Importe'), lwT('Estado')], facturas.map(filaFactura), lwT('Sin facturas.'))}
    <h3 style="margin:16px 0 6px;font-size:15px">${lwT('Documentos')}</h3>
    ${tabla([lwT('Documento'), lwT('Subido')], docs.map(filaDoc), lwT('Sin documentos.'))}
  `;
  lwConfirmar({
    titulo: lwT('Vista previa del portal') + ' — ' + (c.full_name || ''),
    cuerpo, confirmar: lwT('Cerrar'), cancelar: false,
  });
}

/* ── portal del comprador ─────────────────────────────────────────────
   La Edge Function `portal-invitar` es quien crea la cuenta y manda el
   correo: aquí solo se pide con la sesión del admin. El body nunca decide
   el permiso — lo decide el JWT en el servidor. */

/* Los códigos de la función son para el log, no para una persona. Sin esta
   traducción el operador leía «ese_email_es_del_equipo» y no sabía si era un
   fallo suyo, un bug o una decisión de diseño (pasó el 5-ago, con el propio
   correo del super_admin). */
const MOTIVOS_PORTAL = {
  ese_email_es_del_equipo:
    lwT('Ese correo ya es de un usuario del equipo. Una misma cuenta no puede ser del equipo y del portal a la vez. ') + ' ' +
    lwT('Para probar el portal, usa otro correo (con Gmail vale tucorreo+portal@gmail.com: llega al mismo buzón y cuenta como distinto).'),
  email_invalido:  lwT('Ese correo no tiene una forma válida.'),
  sin_fichas:      lwT('No se ha podido saber a qué ficha dar acceso. Recarga la página e inténtalo otra vez.'),
  no_autorizado:   lwT('Hace falta ser administrador para invitar o revocar accesos.'),
  sin_sesion:      'Tu sesión ha caducado. Vuelve a entrar.',
  sesion_invalida: 'Tu sesión ha caducado. Vuelve a entrar.',
  password_corta:  lwT('La contraseña necesita 10 caracteres o más.'),
  no_es_cuenta_de_portal: lwT('Ese email no tiene acceso al portal todavía — invítalo primero.'),
};
const motivoPortal = e => MOTIVOS_PORTAL[e] || e;

async function llamaPortal(body){
  const { data } = await SB.auth.getSession();
  const r = await fetch('https://vtulllundrfennhjddhc.supabase.co/functions/v1/portal-invitar', {
    method:'POST',
    headers:{ 'content-type':'application/json', authorization:'Bearer ' + data.session.access_token },
    body: JSON.stringify(body),
  });
  return r.json().catch(() => ({ error:'respuesta ilegible' }));
}

async function invitarPortal(c){
  const email = ($('#p-email').value || '').trim().toLowerCase();
  if(!email){ toastMal(lwT('Falta el email de acceso')); return; }
  const ok = await lwConfirmar({
    titulo: lwT('Invitar a %e al portal', { e: email }),
    cuerpo: '<p>' + lwT('Se le envía un') + ' <b>' + lwT('correo de acceso') + '</b> ' + lwT('y podrá ver en el portal todo lo de esta ficha: contratos, pagos, facturas y obra.') + '</p>',
    confirmar: lwT('Enviar la invitación'),
  });
  if(!ok) return;
  const b = $('#btnPortalInv'); b.disabled = true;
  const r = await llamaPortal({ accion:'invitar', email, client_ids:[c.id] });
  b.disabled = false;
  if(r.error){ toastMal(motivoPortal(r.error)); return; }
  toast(lwT(r.aviso ? 'Acceso creado, pero el correo no salió: reenvía en un rato' : 'Invitación enviada'));
  await cargar(); pintarLista(); pintarFicha();
}

async function passwordPortal(c){
  const suyos = ACCESOS.filter(x => x.client_id === c.id && x.activo);
  if(!suyos.length) return;
  const email = ($('#p-email').value || '').trim().toLowerCase() || suyos[0].email;
  const p = prompt(lwT('Nueva contraseña para %s (mínimo 10 caracteres).', { s: email })
                 + '\n' + lwT('Apúntala: no se puede volver a consultar, solo cambiar por otra.'));
  if(p === null) return;
  if(p.length < 10){ toastMal(lwT('Mínimo 10 caracteres')); return; }
  const b = $('#btnPortalPass'); b.disabled = true;
  const r = await llamaPortal({ accion:'password', email, password:p });
  b.disabled = false;
  if(r.error){ toastMal(motivoPortal(r.error)); return; }
  toast(lwT('Contraseña puesta. Pásasela tú: no queda guardada en ningún sitio consultable.'));
}

async function revocarPortal(c){
  const suyos = ACCESOS.filter(x => x.client_id === c.id && x.activo);
  if(!suyos.length) return;
  const email = suyos[0].email;
  const ok = await lwConfirmar({
    titulo: lwT('Revocar el acceso de %e', { e: email }),
    cuerpo: '<p>' + lwT('Dejará de ver') + ' <b>todas</b> ' + lwT('las fichas vinculadas a ese email, no solo ésta.') + '</p>',
    confirmar: lwT('Revocar el acceso'),
    tono: 'peligro',
  });
  if(!ok) return;
  const b = $('#btnPortalRev'); b.disabled = true;
  const r = await llamaPortal({ accion:'revocar', email });
  b.disabled = false;
  if(r.error){ toastMal(motivoPortal(r.error)); return; }
  toast(lwT('Acceso revocado'));
  await cargar(); pintarLista(); pintarFicha();
}

async function abrir(path){
  if(!path) return;
  const { data, error } = await SB.storage.from('kyc').createSignedUrl(path, 300);
  if(error || !data){ toastMal(lwT('No se pudo generar el enlace')); return; }
  // visor compartido de la suite: el documento se consulta en un pop-up sin
  // salir de la ficha (regla 29-jul: nunca pestaña nueva para consultar)
  LW_VISOR.abrir(data.signedUrl, lwT('Documento del comprador'));
}

$('#listaC').addEventListener('click', e => {
  const b = e.target.closest('[data-id]'); if(!b) return;
  SEL = b.dataset.id; pintarLista(); pintarFicha();
});
$('#q').addEventListener('input', pintarLista);
/* Ni `#stage` ni `#ficha` existen desde que la ficha vive en el CAJÓN lateral
   (31-jul): eran de la maqueta de dos columnas anterior. Cada clic en una fila
   lanzaba un TypeError — no se veía porque saltaba DESPUÉS de abrir el cajón,
   así que la pantalla funcionaba y solo ensuciaba la consola. Retirados. */
$('#btnNuevo').addEventListener('click', () => { SEL='nuevo'; pintarLista(); pintarFicha(); });

suiMontarCajon();
suiOrdenable(document.getElementById('tabla'), ORDEN, (c, campo) => c[campo], pintarLista);

window.LW_AUTH.then(async ({ sb, session, ficha }) => {
  SB = sb;
  YO = ficha;   // el rol decide si la ficha enseña los botones de invitar al portal
  // El correo de la SESIÓN, que es el que `clients.propietario` guarda: la ficha
  // de `usuarios` no lo trae, y sin él no se puede saber qué fichas son mías.
  MI_EMAIL = String((session && session.user && session.user.email) || '').toLowerCase();
  ES_ADMIN = !!(ficha && ['super_admin','admin'].includes(ficha.rol));
  try{
    await cargar();
    /* ?id=<client_id> abre esa ficha directamente. Lo usa Operaciones: llegar
       desde la ficha de una venta a un listado y tener que buscar a la persona
       que ya estabas mirando es un viaje de ida sin vuelta. */
    const par = new URLSearchParams(location.search);
    const pedido = par.get('id');
    if(pedido && CLIENTES.some(c => c.id === pedido)){
      SEL = pedido;
      pintarLista(); pintarFicha();
    }else if(par.get('nuevo')){
      /* ?nuevo=1 abre directamente el alta (19-ago-2026). Lo usa Contratos:
         desde que el contrato ya no da de alta a nadie, su enlace «Abrir
         Compradores» tiene que caer en el formulario de alta y no en una lista
         donde hay que volver a buscar el botón. */
      SEL = 'nuevo';
      pintarLista(); pintarFicha();
    }else{
      if(pedido) toastMal(lwT('Ese comprador ya no existe'));
      pintarLista();
    }
  }
  catch(err){ $('#listaC').innerHTML = '<p class="nota" style="padding:18px">No se pudo cargar: ' + esc(err.message||err) + '</p>'; }
});
</script>
