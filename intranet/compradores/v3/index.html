<style>
/* ═══════════════════════════════════════════════════════════════════════════
   COMPRADORES v3 · la persona — 26-ago-2026
   ═══════════════════════════════════════════════════════════════════════════
   EL TRABAJO, en palabras del owner: «dar de alta a los compradores y un sitio
   donde tengamos todo con respecto a ese comprador en un solo sitio: su
   documentación, lo que debe, los contratos que tiene».

   Hoy la herramienta cumple la primera mitad —el alta— y no la segunda: la
   ficha abre por el FORMULARIO DE IDENTIDAD, catorce campos que ya se
   rellenaron el día del alta y no se vuelven a mirar. Lo que sí se mira todos
   los días —qué debe, qué tiene firmado, qué documento le falta— está debajo,
   o no está.

   Aquí se invierte: la ficha abre por el dinero y por lo que le falta, y el
   formulario de identidad queda plegado. No se ha quitado nada; se ha ordenado
   por frecuencia de uso, que es el único orden que un «todo en un solo sitio»
   admite (§ jerarquía: lo primero que se ve es lo que más se necesita).

   Y en el listado va el saldo. El cliente pidió por su nombre «nombres y
   balances pendientes de pago»: aquí es la columna, no un dato del detalle.
   ═══════════════════════════════════════════════════════════════════════════ */
body{ margin:0; background:var(--sup-0,#F1EBDD); color:var(--texto,#22282A);
      font-family:var(--sans,'Jost',system-ui,sans-serif); }
main{ max-width:1080px; margin:0 auto; padding:24px 24px 80px; }

.resumen{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin:0 0 20px; }
.kpi{ background:var(--sup-1,#fff); border:1px solid var(--linea,#E4DCCB); border-radius:var(--r-l,18px);
      box-shadow:var(--sombra-1); padding:16px 18px; }
.kpi .rot{ display:block; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
           font-weight:600; color:var(--texto-2,#4A5052); margin-bottom:6px; }
.kpi .n{ font-family:'Instrument Sans',system-ui,sans-serif; font-weight:700; font-size:1.45rem;
         line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; color:var(--dl,#104C4F); }
.kpi small{ display:block; margin-top:6px; font-size:.74rem; color:var(--texto-2,#4A5052); }

.controles{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 8px; }
.controles .sui-buscar{ flex:1 1 240px; }
.chips{ display:flex; gap:8px; flex-wrap:wrap; margin:0 0 18px; }

.caja{ background:var(--sup-1,#fff); border:1px solid var(--linea,#E4DCCB); border-radius:var(--r-l,18px);
       box-shadow:var(--sombra-1); overflow:hidden; }
.per{ display:grid; grid-template-columns:38px minmax(0,1fr) 108px 132px 20px; gap:14px; align-items:center;
      padding:13px 18px; border-top:1px solid var(--linea,#E4DCCB); cursor:pointer; }
.per:first-child{ border-top:0; }
.per:hover{ background:var(--sup-2,#F7F3E9); }
/* La inicial en un disco: a un listado de personas le da un ancla visual que
   ningún dato de texto le da, y no inventa información. */
.per .ini{ width:38px; height:38px; border-radius:50%; display:grid; place-items:center;
           background:var(--sup-2,#F7F3E9); border:1px solid var(--linea,#E4DCCB);
           font-weight:600; font-size:.85rem; color:var(--dl,#104C4F); }
.per .nom{ font-size:.92rem; font-weight:600; letter-spacing:-.008em;
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.per .sub{ display:block; margin-top:3px; font-size:.75rem; color:var(--texto-2,#4A5052);
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.per .ops{ font-size:.78rem; color:var(--texto-2,#4A5052); white-space:nowrap; }
.per .saldo{ text-align:right; font-variant-numeric:tabular-nums; font-size:.86rem;
             font-weight:600; white-space:nowrap; }
.per .saldo.debe{ color:var(--dl,#104C4F); }
.per .saldo.ok{ color:var(--texto-3,#676B63); font-weight:400; }
.per > i{ color:var(--sc,#8F9B7A); justify-self:end; }
.falta{ display:inline-block; margin-left:6px; width:7px; height:7px; border-radius:50%;
        background:#C08A2A; vertical-align:middle; }

.vacio{ padding:26px 18px; color:var(--texto-2,#4A5052); font-size:.86rem; }
.mini{ font-size:.78rem; color:var(--texto-2,#4A5052); line-height:1.5; }

#cajon .cuerpo{ overflow:auto; padding:0 20px 24px; }
#cajon h3{ margin:0; font-size:1.02rem; letter-spacing:-.012em; }
#cajon .subt{ font-size:.78rem; color:var(--texto-2,#4A5052); margin-top:3px; }
.bloque{ margin-top:20px; }
.bloque > h4{ margin:0 0 8px; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
              font-weight:600; color:var(--texto-2,#4A5052); }
.dato{ display:flex; justify-content:space-between; gap:12px; padding:9px 0;
       border-top:1px solid var(--linea,#E4DCCB); font-size:.85rem; }
.dato:first-of-type{ border-top:0; }
.dato .v{ font-weight:600; font-variant-numeric:tabular-nums; text-align:right; }
/* El dinero arriba y en grande: es lo que se viene a mirar. */
.plata{ background:var(--sup-2,#F7F3E9); border:1px solid var(--linea,#E4DCCB);
        border-radius:14px; padding:14px 16px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.plata div span{ display:block; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase;
                 font-weight:600; color:var(--texto-2,#4A5052); margin-bottom:4px; }
.plata div b{ font-family:'Instrument Sans',system-ui,sans-serif; font-size:1.1rem; font-weight:700;
              letter-spacing:-.02em; font-variant-numeric:tabular-nums; color:var(--dl,#104C4F); }
.pend{ margin-top:12px; padding:11px 14px; border-radius:12px; background:#FBF3E2;
       border:1px solid #E9D8B0; font-size:.82rem; color:#6B4E12; }
.pend ul{ margin:6px 0 0; padding-left:18px; } .pend li{ margin:2px 0; }
/* La identidad, plegada: son los catorce campos del alta. */
details.ident > summary{ list-style:none; cursor:pointer; font-size:.8rem; font-weight:600;
                         color:var(--texto-2,#4A5052); padding:9px 0; }
details.ident > summary::-webkit-details-marker{ display:none; }
details.ident > summary::before{ content:'▸ '; }
details.ident[open] > summary::before{ content:'▾ '; }

@media (max-width:780px){
  main{ padding-left:max(16px, env(safe-area-inset-left));
        padding-right:max(16px, env(safe-area-inset-right)); padding-top:18px; padding-bottom:56px; }
  .resumen{ grid-template-columns:1fr 1fr; gap:12px; }
  .per{ grid-template-columns:34px minmax(0,1fr) auto; gap:10px 12px; padding:12px 14px; }
  .per .ini{ width:34px; height:34px; }
  .per .ops{ grid-column:2; font-size:.74rem; }
  .per .saldo{ grid-column:3; grid-row:1; }
  .per > i{ display:none; }
}
@media (max-width:440px){ .resumen{ grid-template-columns:1fr; } .plata{ grid-template-columns:1fr; } }
main, .caja, .per, .per .nom, .per .sub{ min-width:0; }
</style>
</head>
<body>

<header class="lw-topbar" data-titulo="Compradores"></header>

<main>
  <div id="avisos"></div>
  <section class="resumen" id="resumen"></section>

  <div class="controles">
    <input class="sui-buscar" id="q" placeholder="Buscar nombre, email o pasaporte…">
    <a class="sui-btn primario" href="/intranet/compradores/?nuevo=1"><i class="ph ph-plus"></i>Dar de alta</a>
  </div>
  <div class="chips" id="chips"></div>

  <div class="caja"><div id="lista"></div></div>
</main>

<div class="sui-velo" id="velo"></div>
<aside class="sui-cajon" id="cajon" role="dialog" aria-modal="true" aria-labelledby="cTit">
  <div class="sui-cajon-cab">
    <div style="min-width:0"><h3 id="cTit">—</h3><div class="subt" id="cSub"></div></div>
    <button type="button" class="sui-cajon-x" id="cX" aria-label="Cerrar">✕</button>
  </div>
  <div class="cuerpo" id="cCuerpo"></div>
</aside>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
let GENTE = [], FILTRO = '', SOLO = '', PAGINA = 1;
const POR_PAGINA = 25;
const dinero = (n, m) => lwFormatoImporte(n || 0, m || 'EUR');

/* Los documentos que se le piden a todo comprador. Si falta alguno, la persona
   lleva el punto ámbar: es «necesita algo» dicho en el listado, no en el
   detalle, que es donde nadie lo iba a ver. */
const DOCS_MINIMOS = ['passport', 'pasaporte'];
const leFalta = p => !p.docs.some(d => DOCS_MINIMOS.includes(String(d.doc_type || '').toLowerCase()))
                  || !p.email || !p.passport_number;

const CHIPS = [
  ['', 'Todos', () => true],
  ['debe', 'Con saldo pendiente', p => p.pendiente > 0.005],
  ['falta', 'Les falta algo', p => leFalta(p)],
  ['sin_ops', 'Sin contratos', p => !p.ops.length],
];

function pintarResumen(){
  const conDeuda = GENTE.filter(p => p.pendiente > 0.005);
  const totales = {};
  conDeuda.forEach(p => { totales[p.moneda] = (totales[p.moneda] || 0) + p.pendiente; });
  /* Nunca un solo número: si hay EUR y USD se enseñan separados. Sumarlos fue
     exactamente el fallo que la auditoría del 19-ago tuvo que deshacer. */
  const texto = Object.keys(totales).length
    ? Object.entries(totales).map(([m, v]) => dinero(v, m)).join(' + ') : '—';
  const tarj = (rot, n, pie) => '<div class="kpi"><span class="rot">' + esc(rot) + '</span>'
    + '<span class="n">' + n + '</span><small>' + esc(pie) + '</small></div>';
  $('#resumen').innerHTML =
      tarj('Compradores', GENTE.length, GENTE.filter(p => p.ops.length).length + ' con contrato')
    + tarj('Deben', esc(texto), conDeuda.length + (conDeuda.length === 1 ? ' persona' : ' personas'))
    + tarj('Les falta algo', GENTE.filter(leFalta).length, 'pasaporte, email o documento');
}

function pintarChips(){
  $('#chips').innerHTML = CHIPS.map(([k, r, fn]) => {
    const n = GENTE.filter(fn).length;
    return '<button type="button" class="sui-chip' + (SOLO === k ? ' on' : '') + (n ? '' : ' vacio')
      + '" data-k="' + k + '">' + esc(r) + ' <span class="n">' + n + '</span></button>';
  }).join('');
  $('#chips').querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
    SOLO = b.dataset.k; PAGINA = 1; pintarChips(); pintar();
  }));
}

function casa(p){
  const fn = (CHIPS.find(c => c[0] === SOLO) || CHIPS[0])[2];
  if(!fn(p)) return false;
  const t = FILTRO.trim().toLowerCase();
  if(!t) return true;
  return [p.full_name, p.email, p.passport_number, p.phone].join(' ').toLowerCase().includes(t);
}

function pintar(){
  const lista = GENTE.filter(casa);
  const cont = $('#lista');
  if(!lista.length){ cont.innerHTML = '<div class="vacio">Nadie coincide.</div>'; return; }
  const paginas = Math.max(1, Math.ceil(lista.length / POR_PAGINA));
  if(PAGINA > paginas) PAGINA = paginas;
  const trozo = lista.slice((PAGINA - 1) * POR_PAGINA, PAGINA * POR_PAGINA);

  cont.innerHTML = trozo.map(p => {
    const debe = p.pendiente > 0.005;
    const ini = (p.full_name || '?').trim().charAt(0).toUpperCase();
    return '<div class="per" data-id="' + esc(p.id) + '">'
      + '<span class="ini">' + esc(ini) + '</span>'
      + '<span><span class="nom">' + esc(p.full_name || 'Sin nombre')
        + (leFalta(p) ? '<span class="falta" title="le falta documentación"></span>' : '') + '</span>'
        + '<span class="sub">' + esc(p.email || p.passport_number || '—') + '</span></span>'
      + '<span class="ops">' + (p.ops.length
          ? p.ops.length + (p.ops.length === 1 ? ' operación' : ' operaciones') : 'sin contratos') + '</span>'
      + '<span class="saldo ' + (debe ? 'debe' : 'ok') + '">'
        + (debe ? esc(dinero(p.pendiente, p.moneda))
                : p.ops.length ? 'al día' : '—') + '</span>'
      + '<i class="ph ph-arrow-right"></i></div>';
  }).join('')
  + LW3.paginador({ total:lista.length, pagina:PAGINA, porPagina:POR_PAGINA });

  cont.querySelectorAll('.per').forEach(el => el.addEventListener('click', () => abrir(el.dataset.id)));
  LW3.cablearPaginador(cont, n => { PAGINA = n; pintar();
    cont.scrollIntoView({ block:'start', behavior: LW3.MENOS_MOV.matches ? 'auto' : 'smooth' }); });
}

const Cajon = (() => {
  const el = $('#cajon'), velo = $('#velo');
  LW3.cajon(el, { velo, aspa:'#cX' });
  const cerrar = () => { el.classList.remove('on'); velo.classList.remove('on'); };
  $('#cX').addEventListener('click', cerrar);
  velo.addEventListener('click', cerrar);
  addEventListener('keydown', e => { if(e.key === 'Escape') cerrar(); });
  return { abre(t, s, h){ $('#cTit').textContent = t; $('#cSub').textContent = s || '';
    $('#cCuerpo').innerHTML = h; el.classList.add('on'); velo.classList.add('on');
    $('#cX').focus({ preventScroll:true }); } };
})();

function abrir(id){
  const p = GENTE.find(x => x.id === id);
  if(!p) return;
  const d = (k, v) => v == null || v === '' ? '' :
    '<div class="dato"><span>' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>';

  const pega = [];
  if(!p.passport_number) pega.push('no tiene número de pasaporte');
  if(!p.email) pega.push('no tiene email — no puede recibir facturas ni acceder al portal');
  if(!p.docs.some(x => DOCS_MINIMOS.includes(String(x.doc_type || '').toLowerCase())))
    pega.push('no hay copia del pasaporte subida');
  p.ops.filter(o => !o.bloqueado).forEach(o =>
    pega.push('el contrato ' + (o.numero || 's/n') + ' sigue sin firmar'));

  Cajon.abre(p.full_name || 'Sin nombre', p.email || p.passport_number || '',
    /* 1 · EL DINERO. Es a lo que se entra. */
      '<div class="bloque"><h4>Dinero</h4><div class="plata">'
    + '<div><span>Comprado</span><b>' + esc(dinero(p.precio, p.moneda)) + '</b></div>'
    + '<div><span>Pendiente</span><b>' + (p.ops.length ? esc(dinero(p.pendiente, p.moneda)) : '—') + '</b></div>'
    + '</div>'
    + (pega.length ? '<div class="pend"><b>Necesita algo</b><ul>'
        + pega.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' : '')
    + '</div>'
    /* 2 · SUS CONTRATOS, agrupados por operación como en el resto de la suite. */
    + '<div class="bloque"><h4>Sus operaciones</h4>'
    + (p.ops.length ? p.ops.map(o => {
        const c = cuentaGrupo(o);
        return '<div class="dato"><span>' + esc(o.numero || 's/n') + ' · '
          + esc(o.proyecto_nombre || lwTipoContrato(o.tipo)) + '</span><span class="v">'
          + (c.precio ? esc(dinero(c.precio, c.moneda)) : '—')
          + (o.bloqueado ? '' : ' <small style="font-weight:400;color:#8C5E10">sin firmar</small>')
          + '</span></div>';
      }).join('') : '<p class="mini">Todavía no tiene ningún contrato.</p>')
    + '</div>'
    /* 3 · SU DOCUMENTACIÓN. */
    + '<div class="bloque"><h4>Documentación</h4>'
    + (p.docs.length ? p.docs.map(x =>
        '<div class="dato"><span>' + esc(x.doc_type || 'documento') + '</span><span class="v">'
        + esc(x.status || 'subido') + (x.caduca_el ? ' · caduca ' + esc(x.caduca_el) : '') + '</span></div>'
      ).join('') : '<p class="mini">No hay ningún documento subido.</p>')
    + '</div>'
    /* 4 · LA IDENTIDAD, plegada: son los campos del alta, no los del día a día. */
    + '<div class="bloque"><details class="ident"><summary>Datos de identidad</summary>'
    + d('Tipo', p.tipo === 'empresa' ? 'Empresa' : 'Particular')
    + d('Nacionalidad', p.nationality) + d('Pasaporte', p.passport_number)
    + d('Nacimiento', p.date_of_birth) + d('Teléfono', p.phone)
    + d('Dirección', p.address) + d('Forma jurídica', p.forma_juridica)
    + d('Registro', p.registro_num) + d('Representante', p.rep_nombre)
    + d('Cargo', p.rep_cargo) + d('KYC', p.kyc_status)
    + (p.notes ? '<p class="mini" style="margin-top:8px">' + esc(p.notes) + '</p>' : '')
    + '</details></div>'
    + '<div class="bloque" style="display:flex;gap:10px;flex-wrap:wrap">'
      + '<a class="sui-btn primario" href="/intranet/compradores/?id=' + esc(p.id) + '">Editar la ficha</a>'
      + (p.ops.length ? '<a class="sui-btn" href="/intranet/operaciones/">Ver sus operaciones</a>' : '')
    + '</div>');
}

window.LW_AUTH.then(async ({ sb }) => {
  const [r, cli, enl, docs] = await Promise.all([
    lwOperacionesCargar(sb, m => LW3.tosta(m, { icono:'ph-warning' })),
    sb.from('clients').select('*').order('full_name'),
    sb.from('contrato_compradores').select('contrato_id, client_id, rol'),
    sb.from('documents').select('client_id, doc_type, status, caduca_el'),
  ]);
  if(cli.error){
    $('#avisos').innerHTML = '<p class="sui-aviso">No se ha podido leer la lista: ' + esc(cli.error.message) + '</p>';
    return;
  }
  /* El enlace persona↔contrato se lee de `contrato_compradores`, que es la
     tabla que lo dice. Cruzar por email o pasaporte —que es lo que hacía el
     índice genérico— falla justo en los casos que importan: dos hermanos con el
     mismo correo, o una errata al teclearlo. */
  const porContrato = {};
  r.ops.forEach(o => { porContrato[o.id] = o; });
  const opsDe = {};
  (enl.data || []).forEach(e => {
    const o = porContrato[e.contrato_id];
    if(!o || o.padre) return;             // solo la raíz: el grupo ya cuenta a los hijos
    (opsDe[e.client_id] = opsDe[e.client_id] || []).push(o);
  });
  const docsDe = {};
  (docs.data || []).forEach(x => { (docsDe[x.client_id] = docsDe[x.client_id] || []).push(x); });

  GENTE = (cli.data || []).map(c => {
    const ops = opsDe[c.id] || [];
    let precio = 0, pendiente = 0, moneda = 'EUR';
    ops.forEach(o => {
      const g = cuentaGrupo(o);
      precio += g.precio || 0;
      if(g.pendiente != null) pendiente += g.pendiente;
      if(g.moneda) moneda = g.moneda;
    });
    return Object.assign({}, c, { ops, docs:docsDe[c.id] || [], precio, pendiente, moneda });
  })
  /* Quien más debe, primero: el listado se ordena por lo que se viene a mirar. */
  .sort((a, b) => (b.pendiente - a.pendiente) || (a.full_name || '').localeCompare(b.full_name || ''));

  pintarResumen(); pintarChips(); pintar();
  let t = null;
  $('#q').addEventListener('input', e => { FILTRO = e.target.value; PAGINA = 1;
    clearTimeout(t); t = setTimeout(pintar, 90); });
});
})();
</script>
</body>
