     intranet/soporte/ y el patrón de alta de intranet/modelos/ — Regla 0 de
     contexto/suite_lawang.md, no un HTML en blanco.

     QUÉ ES (corregido por el owner ese mismo día, textual: «las ponen los
     agentes para pedirle a Lawang que les pague ciertos importes como pueden
     ser comisiones o pagos acordados, no para cargarlas sobre los
     compradores»): el agente pide un pago a Lawang — comisión, pago acordado —
     con su concepto, importe y, si viene de una venta, el contrato de
     referencia. El admin aprueba, rechaza con motivo, y al hacer el pago real
     (fuera de la suite: transferencia, Wise…) la marca PAGADA con su
     referencia. La herramienta registra; el dinero se mueve fuera.

     LA MÁQUINA DE ESTADOS VIVE EN LA BASE (migración 20260909073555): esta
     pantalla no ofrece lo que va a fallar al guardar, pero quien manda es el
     trigger. pendiente → aprobada | rechazada(motivo) | anulada(solo el
     creador) · aprobada → pagada(solo admin, sella quién/cuándo). Resuelta o
     pagada = congelada.

     PERMISO: entra quien tenga 'operaciones' — A PROPÓSITO, no una clave
     nueva: un permiso nuevo exige darlo de alta en la edge admin-usuarios y
     REDESPLEGARLA, pendiente por LAW-70 — una clave nueva hoy dejaría a los
     usuarios nuevos sin la herramienta en silencio. Mismo precedente que
     Vencimientos (18-ago) y Modelos (7-sep).

     QUIÉN VE QUÉ (RLS, no esta pantalla): cada agente ve las SUYAS; un admin
     las ve todas. El contador de la tarjeta del hub hereda esa misma vista. -->

<script src="/contracts/assets/vocabulario.js?v=f84d8753"></script>
<script>
/* ============================================================================
   Solicitudes de pago — bandeja + alta
   ----------------------------------------------------------------------------
   El pago va DEL ESTUDIO AL AGENTE (comisiones, pagos acordados). El contrato
   es referencia opcional —la venta de la que sale la comisión— y se guarda su
   ID (papel Referencia del patrón «el dato tiene un dueño»): número y proyecto
   se leen en vivo al pintar, nunca se copian. El pago real ocurre fuera de la
   suite; aquí queda quién lo pidió, quién lo aprobó y cuándo se pagó.
   ========================================================================== */
const $ = s => document.querySelector(s);

let SB=null, YO=null, ADMIN=false;
let SOLICITUDES=[], CONTRATOS={}, USUARIOS={};
let SEL=null, FILTRO='pendiente', AGENTE='';
const ORDEN = { campo:'creado_en', dir:'desc' };

const fmtFecha = f => f ? new Date(f).toLocaleDateString('es-ES', { day:'numeric', month:'short', year:'numeric' }) : '';
const diasDesde = f => Math.floor((Date.now() - new Date(f).getTime()) / 86400000);
/* Los importes se leen y se escriben SIEMPRE con dinero.js (norma de la suite:
   nada de toLocaleString). */
const fmtImporte = x => lwFormatoImporte(Number(x.importe)) + ' ' + (x.moneda || '');

const ETIQUETA = { pendiente:'Pendiente', aprobada:'Aprobada', rechazada:'Rechazada', anulada:'Anulada', pagada:'Pagada' };
const TAG      = { pendiente:'espera',    aprobada:'info',     rechazada:'mal',      anulada:'gris',   pagada:'ok' };

/* ---------- carga ---------- */
async function cargar(){
  const [s, k, u] = await Promise.all([
    SB.from('solicitudes_pago').select('*').order('creado_en', { ascending:false }),
    SB.from('contratos').select('id,numero,tipo,proyecto_nombre'),
    // Para «Quién pide» y los sellos. Si la RLS de usuarios solo deja leer la
    // propia ficha, el mapa se queda corto y el fallback pinta «—»: no es un fallo.
    SB.from('usuarios').select('user_id,nombre,email'),
  ]);
  if(s.error){ toast('No se pudieron leer las solicitudes: ' + s.error.message); return; }
  SOLICITUDES = s.data || [];
  CONTRATOS = {}; (k.error ? [] : (k.data || [])).forEach(x => { CONTRATOS[x.id] = x; });
  USUARIOS = {}; (u.error ? [] : (u.data || [])).forEach(x => { USUARIOS[x.user_id] = x; });
  pintar();
}

const nombreDe = uid => {
  const u = USUARIOS[uid];
  return u ? (u.nombre || u.email) : (YO && uid === YO.id ? 'Tú' : '—');
};

function vistas(){
  return SOLICITUDES.map(x => {
    const ct = CONTRATOS[x.contrato_id];
    return Object.assign({}, x, {
      venta: ct ? (ct.numero || 'contrato') : '',
      ventaSub: ct ? [lwTipoContrato(ct.tipo), ct.proyecto_nombre].filter(Boolean).join(' · ') : '',
      contrato: ct,
      quien: nombreDe(x.creado_por),
    });
  });
}

/* ---------- filtros y tabla ---------- */
const FILTROS = [
  ['pendiente','Pendientes'], ['aprobada','Por pagar'],
  ['resueltas','Resueltas'], ['todos','Todas'],
];
const RESUELTAS = ['pagada','rechazada','anulada'];
function visibles(){
  const q = ($('#q').value || '').toLowerCase();
  return vistas().filter(x => {
    if(AGENTE && x.creado_por !== AGENTE) return false;
    if(FILTRO === 'pendiente' && x.estado !== 'pendiente') return false;
    if(FILTRO === 'aprobada' && x.estado !== 'aprobada') return false;
    if(FILTRO === 'resueltas' && RESUELTAS.indexOf(x.estado) < 0) return false;
    if(!lwBuscaEn(['SP-' + x.numero, x.venta, x.ventaSub, x.concepto, x.quien], q)) return false;
    return true;
  });
}
/* El mini panel del ADMIN: los chips ya cuentan filas — esto dice qué espera
   su acción y cuánto dinero hay comprometido. Suma por moneda y NUNCA entre
   monedas: 500 EUR + 500 USD no son «1.000 nada» (regla del modelo de venta). */
function pintarResumen(todos){
  const caja = $('#resumen');
  if(!ADMIN){ caja.hidden = true; return; }
  const pend = todos.filter(x => x.estado === 'pendiente').length;
  const aprob = todos.filter(x => x.estado === 'aprobada');
  const porMoneda = {};
  aprob.forEach(x => { porMoneda[x.moneda] = (porMoneda[x.moneda] || 0) + Number(x.importe); });
  const sumas = Object.keys(porMoneda).sort()
    .map(m => lwFormatoImporte(porMoneda[m]) + ' ' + m).join(' · ');
  caja.hidden = false;
  caja.textContent = pend + (pend === 1 ? ' pendiente de resolver' : ' pendientes de resolver')
    + ' — ' + aprob.length + (aprob.length === 1 ? ' aprobada por pagar' : ' aprobadas por pagar')
    + (aprob.length ? ' (' + sumas + ')' : '');
}
/* El filtro por agente solo existe para el admin (para un agente todas las
   filas son suyas). Las opciones salen de las filas que la RLS ya le dejó
   ver — no de la lista de usuarios: un compañero sin solicitudes no es una
   opción que filtre nada. */
function pintarFiltroAgente(todos){
  const sel = $('#fAgente');
  if(!ADMIN){ sel.hidden = true; return; }
  const vistos = [];
  todos.forEach(x => { if(vistos.indexOf(x.creado_por) < 0) vistos.push(x.creado_por); });
  if(vistos.length < 2){ sel.hidden = true; AGENTE = ''; return; }
  sel.hidden = false;
  const antes = AGENTE;
  sel.innerHTML = '<option value="">Todos los agentes</option>' + vistos
    .map(uid => ({ uid, nombre: nombreDe(uid) }))
    .sort((a,b) => a.nombre.localeCompare(b.nombre, 'es'))
    .map(o => `<option value="${esc(o.uid)}">${esc(o.nombre)}</option>`).join('');
  sel.value = antes;
  if(sel.value !== antes) AGENTE = '';
}
function pintar(){
  const todos = vistas();
  pintarResumen(todos);
  pintarFiltroAgente(todos);
  const base = AGENTE ? todos.filter(x => x.creado_por === AGENTE) : todos;
  $('#filtros').innerHTML = FILTROS.map(([v,l]) => {
    const n = v === 'todos' ? base.length
      : v === 'resueltas' ? base.filter(x => RESUELTAS.indexOf(x.estado) >= 0).length
      : base.filter(x => x.estado === v).length;
    return `<button class="sui-chip ${FILTRO===v?'on':''}" data-f="${v}">${l}<span class="n">${n}</span></button>`;
  }).join('');
  pintarTabla();
}
function pintarTabla(){
  const filas = $('#filas');
  const vs = suiOrdenar(visibles(), ORDEN, (x, campo) => campo === 'importe' ? Number(x.importe) : x[campo]);
  if(!vs.length){ filas.innerHTML = '<tr><td colspan="7" class="sui-vacio">Nada que enseñar con este filtro.</td></tr>'; return; }
  filas.innerHTML = vs.map(x => {
    const d = diasDesde(x.creado_en);
    const tarde = (x.estado === 'pendiente' || x.estado === 'aprobada') && d >= 14;
    return `<tr data-id="${esc(x.id)}" class="${SEL===x.id?'on':''}">
    <td><b>SP-${esc(String(x.numero))}</b></td>
    <td>${esc(x.quien)}</td>
    <td class="concepto">${esc(x.concepto)}</td>
    <td>${esc(fmtImporte(x))}</td>
    <td class="venta">${x.venta ? esc(x.venta) : '—'}${x.ventaSub ? '<span class="mini">' + esc(x.ventaSub) + '</span>' : ''}</td>
    <td><span class="sui-tag ${TAG[x.estado] || 'gris'}">${esc(ETIQUETA[x.estado] || x.estado)}</span></td>
    <td>${esc(fmtFecha(x.creado_en))} <span class="edad ${tarde?'tarde':''}">hace ${d} d</span></td>
  </tr>`;
  }).join('');
}

/* ---------- cajón: ficha de una solicitud ---------- */
function abrir(id){
  const x = vistas().find(v => v.id === id); if(!x) return;
  SEL = id; pintarTabla();
  const mia = YO && x.creado_por === YO.id;
  const filaDato = (k, v) => v ? `<div class="dato"><span>${k}</span><b>${v}</b></div>` : '';

  let cuerpo = `<div class="bloque">
    ${filaDato('Quién pide', esc(x.quien))}
    ${filaDato('Concepto', esc(x.concepto))}
    ${filaDato('Importe', esc(fmtImporte(x)))}
    ${filaDato('De la venta', x.contrato ? esc(x.contrato.numero || '') + ' · ' + esc(lwTipoContrato(x.contrato.tipo)) + (x.contrato.proyecto_nombre ? ' · ' + esc(x.contrato.proyecto_nombre) : '') : '')}
    ${filaDato('Fecha límite', x.vence_el ? esc(fmtFecha(x.vence_el)) : '')}
    ${filaDato('Nota', x.nota ? esc(x.nota) : '')}
    ${filaDato('Pedida', esc(fmtFecha(x.creado_en)))}
  </div>`;

  if(x.estado !== 'pendiente'){
    cuerpo += `<div class="bloque"><h3>Resolución</h3>
      ${filaDato('Estado', esc(ETIQUETA[x.estado]))}
      ${filaDato('Motivo', x.motivo_rechazo ? esc(x.motivo_rechazo) : '')}
      ${filaDato('Resuelta por', x.resuelto_por ? esc(nombreDe(x.resuelto_por)) + ' · ' + esc(fmtFecha(x.resuelto_en)) : '')}
      ${filaDato('Pagada por', x.pagado_por ? esc(nombreDe(x.pagado_por)) + ' · ' + esc(fmtFecha(x.pagado_en)) : '')}
      ${filaDato('Referencia del pago', x.pago_referencia ? esc(x.pago_referencia) : '')}
    </div>`;
  }
  // el hueco donde aparecen el motivo del rechazo o la referencia del pago
  cuerpo += '<div id="cajonExtra"></div>';

  const botones = [];
  if(x.estado === 'pendiente' && ADMIN){
    botones.push('<button class="sui-btn primario" id="btnAprobar">Aprobar</button>');
    botones.push('<button class="sui-btn" id="btnRechazar">Rechazar…</button>');
  }
  if(x.estado === 'pendiente' && mia){
    botones.push('<button class="sui-btn" id="btnEditar">Editar</button>');
    botones.push('<button class="sui-btn" id="btnAnular">Anular</button>');
  }
  if(x.estado === 'aprobada' && ADMIN){
    botones.push('<button class="sui-btn primario" id="btnPagada">Marcar pagada…</button>');
  }
  botones.push('<button class="sui-btn" id="btnCerrarCajon">Cerrar</button>');

  suiAbrirCajon({
    titulo: 'SP-' + esc(String(x.numero)) + ' · ' + esc(ETIQUETA[x.estado] || x.estado),
    sub: esc(x.quien) + ' — el pago se hace fuera (transferencia); aquí queda pedido, aprobado y pagado.',
    cuerpo, pie: botones.join(''),
    onCerrar: () => { SEL = null; pintarTabla(); },
  });

  $('#btnCerrarCajon').addEventListener('click', suiCerrarCajon);
  if($('#btnAprobar'))  $('#btnAprobar').addEventListener('click', () => resolver(x, 'aprobada'));
  if($('#btnRechazar')) $('#btnRechazar').addEventListener('click', () => pedirMotivo(x));
  if($('#btnAnular'))   $('#btnAnular').addEventListener('click', () => anular(x));
  if($('#btnEditar'))   $('#btnEditar').addEventListener('click', () => formulario(x));
  if($('#btnPagada'))   $('#btnPagada').addEventListener('click', () => pedirReferenciaPago(x));
}

async function resolver(x, estado, extra){
  const cambio = Object.assign({ estado }, extra || {});
  const { error } = await SB.from('solicitudes_pago').update(cambio).eq('id', x.id);
  if(error){ toast('No se pudo: ' + error.message); return; }
  await cargar();
  toast(estado === 'aprobada' ? 'Solicitud aprobada — queda por pagar'
      : estado === 'pagada' ? 'Marcada como pagada'
      : 'Solicitud ' + ETIQUETA[estado].toLowerCase());
  abrir(x.id);
}

function pedirMotivo(x){
  const hueco = $('#cajonExtra'); if(!hueco || hueco.childElementCount) return;
  hueco.innerHTML = `<div class="bloque extra-caja"><h3>Motivo del rechazo</h3>
    <div class="form-campo">
      <label for="fMotivo">Se le enseña al compañero tal cual — di qué falta o por qué no procede</label>
      <textarea id="fMotivo"></textarea>
    </div>
    <button class="sui-btn primario" id="btnRechazarOk">Rechazar la solicitud</button>
    <p class="aviso-falta" id="avisoMotivo" hidden>El motivo es obligatorio: sin él la base no acepta el rechazo.</p>
  </div>`;
  $('#fMotivo').focus();
  $('#btnRechazarOk').addEventListener('click', () => {
    const m = $('#fMotivo').value.trim();
    if(!m){ $('#avisoMotivo').hidden = false; return; }
    resolver(x, 'rechazada', { motivo_rechazo: m });
  });
}

function pedirReferenciaPago(x){
  const hueco = $('#cajonExtra'); if(!hueco || hueco.childElementCount) return;
  hueco.innerHTML = `<div class="bloque extra-caja"><h3>Referencia del pago</h3>
    <div class="form-campo">
      <label for="fRef">Cómo se ha pagado — transferencia, Wise, fecha… (opcional, pero al compañero le llega en el aviso)</label>
      <input id="fRef" autocomplete="off">
    </div>
    <button class="sui-btn primario" id="btnPagadaOk">Confirmar: pagada</button>
  </div>`;
  $('#fRef').focus();
  $('#btnPagadaOk').addEventListener('click', () => {
    const r = $('#fRef').value.trim();
    resolver(x, 'pagada', { pago_referencia: r || null });
  });
}

async function anular(x){
  const ok = await lwConfirmar({
    titulo: 'Anular la solicitud',
    texto: 'SP-' + x.numero + ' quedará anulada. No se borra: el registro se queda, sin efecto.',
    confirmar: 'Anular',
  });
  if(!ok) return;
  resolver(x, 'anulada');
}

/* ---------- alta / edición ---------- */
function formulario(existente){
  SEL = existente ? existente.id : null;
  const x = existente || {};
  suiAbrirCajon({
    titulo: existente ? 'Editar SP-' + esc(String(x.numero)) : 'Nueva solicitud de pago',
    sub: 'Pide un pago a Lawang — una comisión, un pago acordado. Administración lo aprueba y lo paga.',
    cuerpo: `
      <div class="form-campo">
        <label for="fConcepto">Concepto — qué pago estás pidiendo</label>
        <input id="fConcepto" placeholder="Comisión venta W3.1-D1 · pago acordado septiembre…" value="${esc(x.concepto || '')}">
      </div>
      <div class="sui-row">
        <div class="form-campo">
          <label for="fImporte">Importe</label>
          <input id="fImporte" inputmode="decimal" value="${x.importe != null ? esc(lwFormatoImporte(Number(x.importe))) : ''}">
        </div>
        <div class="form-campo">
          <label for="fMoneda">Moneda</label>
          <select id="fMoneda">
            <option value="EUR">EUR</option><option value="USD">USD</option><option value="IDR">IDR</option>
          </select>
        </div>
      </div>
      <div class="form-campo">
        <label for="fContrato">De qué venta viene, si viene de una (opcional)</label>
        <input id="fContrato" placeholder="Elegir contrato…" autocomplete="off">
      </div>
      <div class="form-campo">
        <label for="fVence">Fecha límite (opcional)</label>
        <input id="fVence" type="date" value="${esc(x.vence_el || '')}">
      </div>
      <div class="form-campo">
        <label for="fNota">Nota para Administración (opcional)</label>
        <textarea id="fNota">${esc(x.nota || '')}</textarea>
      </div>`,
    pie: `<button class="sui-btn primario" id="btnGuardar">${existente ? 'Guardar cambios' : 'Crear solicitud'}</button>
          <button class="sui-btn" id="btnCancelar">Cancelar</button>`,
    onCerrar: () => { SEL = null; pintarTabla(); },
  });

  // picker de contrato: se guarda el ID en dataset y se enseña el número.
  // lwPicker escribiría el uuid en el campo, por eso aquí va lwElegir directo.
  const elK = $('#fContrato');
  const opsContratos = () => [{ valor:'', texto:'— Sin venta asociada —' }].concat(
    Object.values(CONTRATOS).map(k => ({ valor:k.id, texto:k.numero || 'sin nº',
      nota:[lwTipoContrato(k.tipo), k.proyecto_nombre].filter(Boolean).join(' · ') }))
      .sort((a,b) => a.texto.localeCompare(b.texto, 'es')));
  const ponContrato = id => {
    elK.dataset.id = id || '';
    elK.value = id && CONTRATOS[id] ? (CONTRATOS[id].numero || 'contrato') : '';
  };
  elK.readOnly = true; elK.classList.add('lw-elegible');
  const abrirLista = async () => {
    const v = await lwElegir({ titulo:'La venta de la que viene el pago', opciones: opsContratos(), valor: elK.dataset.id || '' });
    if(v !== null) ponContrato(v);
  };
  elK.addEventListener('mousedown', e => { e.preventDefault(); abrirLista(); });
  elK.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown'){ e.preventDefault(); abrirLista(); } });
  ponContrato(x.contrato_id || '');
  if(x.moneda) $('#fMoneda').value = x.moneda;

  $('#btnCancelar').addEventListener('click', suiCerrarCajon);
  $('#btnGuardar').addEventListener('click', async () => {
    const concepto = $('#fConcepto').value.trim();
    const importe = lwParseImporte($('#fImporte').value);
    if(!concepto){ toast('El concepto no puede quedar vacío'); return; }
    if(!(importe > 0)){ toast('El importe no se entiende — escribe un número mayor que cero'); return; }
    const fila = {
      contrato_id: elK.dataset.id || null,
      concepto, importe,
      moneda: $('#fMoneda').value,
      vence_el: $('#fVence').value || null,
      nota: $('#fNota').value.trim() || null,
    };
    const btn = $('#btnGuardar'); btn.disabled = true;
    const { error } = existente
      ? await SB.from('solicitudes_pago').update(fila).eq('id', existente.id)
      : await SB.from('solicitudes_pago').insert(fila);
    if(error){ toast('No se pudo guardar: ' + error.message); btn.disabled = false; return; }
    await cargar();
    toast(existente ? 'Solicitud actualizada' : 'Solicitud creada — Administración ya tiene el aviso');
    suiCerrarCajon();
  });
}

/* ---------- eventos ---------- */
$('#q').addEventListener('input', pintarTabla);
$('#fAgente').addEventListener('change', () => { AGENTE = $('#fAgente').value; pintar(); });
$('#filtros').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if(!b) return;
  FILTRO = b.dataset.f; pintar();
});
$('#filas').addEventListener('click', e => {
  const tr = e.target.closest('[data-id]'); if(!tr) return;
  abrir(tr.dataset.id);
});
$('#btnNueva').addEventListener('click', () => formulario(null));

suiMontarCajon();
suiOrdenable($('#tabla'), ORDEN, (x, campo) => campo === 'importe' ? Number(x.importe) : x[campo], pintarTabla);

window.LW_AUTH.then(async ({ sb, session, ficha }) => {
  SB = sb; YO = session && session.user;
  ADMIN = !!(ficha && (ficha.rol === 'admin' || ficha.rol === 'super_admin'));
  await cargar();
  /* ?id=<solicitud> llega desde la campana: se abre esa y, si el filtro por
     defecto (Pendientes) la esconde, se cambia a Todas para que se vea. */
  const pedido = new URLSearchParams(location.search).get('id');
  if(pedido){
    const x = SOLICITUDES.find(v => v.id === pedido);
    if(x){
      if(x.estado !== 'pendiente'){ FILTRO = 'todos'; pintar(); }
      abrir(pedido);
    }
  }
});
</script>
</body>
</html>
