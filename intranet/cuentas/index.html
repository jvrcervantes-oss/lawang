<style>
  :root{ --line:#E4DCCB; --card:#FFFFFF; --rl2:#F1EBDD; --texto-2:#4A5052; --tbh:64px; }
  *{ box-sizing:border-box; } html,body{ margin:0; height:100%; }
  body{ font-family:var(--font-body,'Jost',sans-serif); background:var(--rl2); color:#22282A; }

  /* Mismo reparto 340 / resto que Usuarios: la lista a la izquierda y la ficha
     a la derecha. 340px fijos, el valor del mockup 4d — no un rango. */
  .stage{ display:grid; grid-template-columns:340px 1fr; height:calc(100% - var(--tbh)); }
  @media screen and (max-width:900px){
    .stage{ grid-template-columns:1fr; }
    .ficha{ display:none; }
    .stage.abierta .lista{ display:none; }
    .stage.abierta .ficha{ display:block; }
  }
  .lista{ overflow:auto; border-right:1px solid var(--line); }
  .cab{ position:sticky; top:0; background:var(--rl2); padding:14px 18px 10px; border-bottom:1px solid var(--line); z-index:2;
        font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--texto-2); font-weight:600; }
  #qC{ width:100%; margin-top:10px; }
  .modos{ display:flex; gap:0; margin-top:9px; border:1px solid var(--line); border-radius:99px; overflow:hidden; background:#FFF; }
  .modo{ flex:1; font:inherit; font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:600;
         padding:7px 4px; border:0; background:none; color:var(--texto-2); cursor:pointer; }
  .modo.on{ background:var(--brand-primary,#2E6B4F); color:#FBF7EE; }
  .ficha{ overflow:auto; padding:26px 30px 60px; }
  .vacio{ display:grid; place-items:center; height:100%; color:var(--texto-2); font-size:14px; }

  .c{ display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line);
      padding:13px 18px; cursor:pointer; font:inherit; color:inherit; }
  .c:hover{ background:#FBF7EE; }
  .c.sel{ background:var(--card); box-shadow:inset 3px 0 0 var(--brand-primary,#2E6B4F); }
  .c .n{ font-size:14px; font-weight:500; }
  .c .m{ font-size:12px; color:var(--texto-2); margin-top:2px; }
  .c .r{ margin-top:6px; display:flex; gap:5px; flex-wrap:wrap; }

  .tag{ font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:99px;
        background:#EDE6D7; color:var(--texto-2); }
  .tag.t-escrow{ background:#E4EEF5; color:#24536F; }
  .tag.t-off{ background:#EFE0DE; color:#7A3A32; }
  .tag.t-def{ background:#E2EFE3; color:#245C37; }

  h2.t{ font-family:var(--font-display,'Cormorant Garamond',serif); font-size:27px; font-weight:500; margin:0 0 2px; }
  .sub{ font-size:12.5px; color:var(--texto-2); margin:0 0 22px; }
  .caja{ background:var(--card); border:1px solid var(--line); border-radius:3px; padding:20px 22px; margin-bottom:18px; }
  .caja > h3{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--texto-2);
              font-weight:600; margin:0 0 14px; }
  .par{ display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
  @media screen and (max-width:700px){ .par{ grid-template-columns:1fr; } }
  label.f{ display:block; font-size:12px; color:var(--texto-2); margin-bottom:4px; }
  .f-full{ grid-column:1/-1; }
  input[type=text], textarea, select{ width:100%; font:inherit; font-size:13.5px; padding:8px 10px;
    border:1px solid var(--line); border-radius:3px; background:#FFF; color:inherit; }
  textarea{ min-height:58px; resize:vertical; }
  .nota{ font-size:12px; color:var(--texto-2); line-height:1.55; margin:10px 0 0; }
  .acciones{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:16px; }

  /* El reparto por plantilla. Una fila por plantilla; en cada una, la casilla
     de "se ofrece" y el radio de "viene precargada". El radio va DESHABILITADO
     mientras la casilla esté desmarcada: precargar una cuenta que no se ofrece
     no significa nada, y dejar pulsarlo invita a creer que sí. */
  .plantilla{ border-top:1px solid var(--line); padding:14px 0 4px; }
  .plantilla:first-of-type{ border-top:0; padding-top:0; }
  .plantilla > .pn{ font-size:13.5px; font-weight:500; margin-bottom:3px; }
  .plantilla > .pm{ font-size:11.5px; color:var(--texto-2); margin-bottom:9px; }
  .opciones{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:5px 18px; }
  .op{ display:flex; align-items:center; gap:9px; font-size:13px; padding:3px 0; }
  .op .et{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .op input[type=checkbox], .op input[type=radio]{ accent-color:var(--brand-primary,#2E6B4F); flex:none; }
  .op .rad{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--texto-2); flex:none; }
  .op input:disabled + span{ opacity:.4; }
  .op.apagada .et{ color:var(--texto-2); }

  .aviso{ background:#FBF3E4; border:1px solid #E6D3A9; border-radius:3px; padding:11px 14px;
          font-size:12.5px; line-height:1.55; margin:0 0 16px; }
  .aviso.mal{ background:#F7E9E6; border-color:#E2BDB5; }
  .toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(14px); opacity:0;
          background:#22282A; color:#FBF7EE; padding:11px 18px; border-radius:3px; font-size:13px;
          pointer-events:none; transition:opacity .18s, transform .18s; max-width:min(560px,90vw); z-index:60; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

<!-- esc() y toast() compartidos. ANTES del script de la pagina: son `const` de
     primer nivel y dos declaraciones del mismo nombre revientan la pagina. -->

<!-- `lwBuscaEn` (buscar sin tildes ni mayúsculas) vive en vocabulario.js, no en
     suite-comun.js. Aquí NO se carga `entities.js`: este panel consulta las
     cuentas por su cuenta porque necesita ver también las DESACTIVADAS, y
     `cargarCuentasBancarias` filtra `activa = true` — cargarlo solo añadiría un
     objeto global que esta pantalla no usa. -->
<script src="/contracts/assets/vocabulario.js?v=d569c692"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   CUENTAS BANCARIAS — el panel del super admin. 14-sep-2026.
   ═══════════════════════════════════════════════════════════════════════════
   POR QUÉ EXISTE. Encargo del owner, textual: «tenemos muchas cuentas
   bancarias y no son editables ni marcables lo que quiero que aparezca en cada
   una, por ejemplo ahora en Carta de Reserva sólo aparece 1 (porque te lo dije
   yo) y ahora necesito cambiarla».

   Las quince cuentas ya vivían en `public.cuentas_bancarias` desde el 6-ago-2026
   (salieron de `entities.js`, que se sirve sin login y además está en un repo
   público de GitHub: unas coordenadas bancarias abiertas son la materia prima de
   un fraude de transferencia, y un número de cuenta no se rota). Pero se
   editaban por SQL, y QUÉ cuenta se ofrecía en cada contrato estaba escrito en
   cuatro listas a mano de JavaScript. Cambiar de opinión costaba un despliegue.

   QUÉ MANDA AHORA:
     · `cuentas_bancarias`    — las cuentas. Alta, corrección y activar/desactivar.
     · `plantillas_pago`      — qué documentos cobran (los que traen
                                <!--datos-bancarios--> y pintan un selector).
     · `plantilla_cuentas`    — el reparto: qué cuentas se ofrecen en cada uno y
                                cuál viene precargada.

   QUIÉN PUEDE. Leer, cualquiera del equipo con la herramienta: el generador de
   contratos necesita el reparto para pintar su desplegable, y a un admin le sirve
   para entender por qué un contrato ofrece lo que ofrece. ESCRIBIR, solo el super
   admin, y no por cortesía de esta pantalla: las policies de las tres tablas
   exigen `es_super_admin()`. Aquí se esconden los botones para no ofrecer lo que
   va a rebotar; quien llegue por la API rebota igual. Es el dato que decide
   adónde va el dinero de un comprador — ahí no hay delegación.

   LO QUE ESTA PANTALLA NO TOCA, A PROPÓSITO:
     · La `clave` de una cuenta, ni al crearla después de creada. Va guardada
       dentro de cada contrato ya emitido (`datos.fields.cuenta_bancaria`):
       renombrarla dejaría documentos firmados apuntando a una cuenta que no
       existe. Es la misma razón por la que `tepi_sungai` no se renombra en
       entities.js.
     · Borrar una cuenta. Se DESACTIVA. No hay policy de DELETE en la base, y
       además la clave ajena del reparto es ON DELETE RESTRICT.
     · Los dos documentos del C2 de Bonian, que llevan DOS cuentas fijas en la
       propia plantilla (`<!--cuenta:CLAVE-->`): el escrow del notario para el
       hito 1 y la de empresa para los hitos 2 a 8. Eso lo pacta el texto del
       contrato, no un desplegable, y por eso no aparecen aquí.
     · Las facturas, que siguen ofreciendo TODAS las cuentas activas. Es
       deliberado: si el contrato pactó cobrar en una cuenta concreta, su factura
       tiene que poder decir esa misma.
   ═══════════════════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
lwIdiomaAplicar();   // traduce la HTML de arriba; en espanol no toca el DOM

let SB = null, YO = null, PUEDO_ESCRIBIR = false;
let CUENTAS = [], PLANTILLAS = [], REPARTO = [], SEL = null;
/* Cuántos contratos usan cada cuenta, y cuántos de ellos están FIRMADOS.
   Viene de la RPC `cuentas_uso()` y existe por un hallazgo de la consulta de
   deploy del 14-sep (Legal + Administración): la casilla ESCROW decide si el
   documento imprime la cláusula «depósito en garantía», y al hacerla editable
   quedó a un clic — con 45 contratos firmados apuntando a cuentas afectadas.
   No se bloquea el cambio (hay que poder corregir una errata sin crear una
   cuenta duplicada), pero la pantalla lo dice CON LA CIFRA delante. Un aviso con
   un número se lee; uno genérico se ignora a la segunda vez.
   `{}` si la RPC falla: entonces el aviso se degrada al texto sin número, nunca
   a un «0 firmados» tranquilizador que sería falso. */
let USO = {};
/* Arranca en «Por contrato» a propósito: es la pregunta con la que se viene a
   esta pantalla («¿en qué cuenta cobra este documento?»), y la que motivó el
   encargo. «Por cuenta» es la vista de mantenimiento — corregir un IBAN, dar de
   alta una cuenta nueva — y se busca cuando ya se sabe que se quiere. */
let MODO = 'contrato';   // 'contrato' | 'proyecto' | 'cuenta'
/* La excepción por proyecto (14-sep, segunda parte del encargo del owner: «si
   seleccionas Palm Field puede ser esta otra»). `EXCEPCION` son las filas de
   `proyecto_cuentas`; su `slug` es un tipo de contrato, o `'*'` para «cualquier
   tipo de este proyecto». Un proyecto que no aparezca hereda el reparto general:
   la tabla guarda EXCEPCIONES, no una matriz de 8 tipos × 29 proyectos que
   nadie mantendría al día. */
let PROYECTOS = [], EXCEPCION = [];
const TODOS = '*';   // el slug que significa «cualquier tipo de contrato»

/* `orden` decide el sitio de la cuenta en el desplegable del contrato... o eso
   parecía: `bankOptions()` las ordena alfabéticamente por etiqueta, así que hoy
   `orden` solo gobierna el orden de esta lista. Se deja editable igual —es un
   dato de la tabla y ocultarlo sería mentir sobre lo que hay— pero la ficha dice
   para qué sirve de verdad, que es peor descubrirlo moviéndolo y no ver nada. */

async function cargar(){
  // Las tres a la vez: la ficha necesita las tres para pintarse entera, y tres
  // consultas encadenadas se notan al abrir.
  // Ojo: aquí se piden TODAS las cuentas, activas y no. `cargarCuentasBancarias`
  // de entities.js filtra `activa = true` porque es para imprimir un contrato;
  // este panel es justo donde hay que ver —y poder reactivar— una desactivada.
  const [cu, pl, re, us, pr, pcu] = await Promise.all([
    SB.from('cuentas_bancarias')
      .select('clave,label,titular,banco,cuenta,codigo,direccion,extra,orden,activa,es_escrow,actualizado_en')
      .order('orden'),
    SB.from('plantillas_pago').select('slug,nombre,orden').order('orden'),
    SB.from('plantilla_cuentas').select('slug,clave,es_default'),
    // Recuentos, sin ningún dato de comprador. La RPC está gateada a super admin
    // en la base, así que a un admin normal le devuelve vacío y el aviso se
    // queda sin cifra — que es correcto: tampoco puede cambiar nada.
    SB.rpc('cuentas_uso'),
    // La excepción por proyecto (14-sep): el catálogo de proyectos activos y las
    // filas que ya declaran cuenta propia.
    SB.from('proyectos').select('id,nombre').eq('activo', true).order('nombre'),
    SB.from('proyecto_cuentas').select('proyecto_id,slug,clave,es_default'),
  ]);
  if(cu.error){
    $('#listaC').innerHTML = '<p class="nota" style="padding:18px">' + lwT('No se pudo cargar: ') + esc(cu.error.message) + '</p>';
    return;
  }
  CUENTAS = cu.data || [];
  // Si el catálogo o el reparto no llegan, la ficha lo DICE en vez de pintar
  // cero casillas: «esta cuenta no se ofrece en ningún contrato» y «no he
  // podido mirarlo» se parecen mucho en pantalla y solo una es cierta.
  PLANTILLAS = pl.error ? null : (pl.data || []);
  REPARTO    = re.error ? null : (re.data || []);
  USO = {};
  if(!us.error) (us.data || []).forEach(r => { USO[r.clave] = { contratos: r.contratos, firmados: r.firmados }; });
  PROYECTOS = pr.error  ? null : (pr.data  || []);
  EXCEPCION = pcu.error ? null : (pcu.data || []);
  pintarLista();
  if(SEL) pintarFicha();
}

function pintarLista(){
  const q = (($('#qC') || {}).value || '').trim().toLowerCase();
  if(MODO === 'cuenta')   return pintarListaCuentas(q);
  if(MODO === 'proyecto') return pintarListaProyectos(q);
  return pintarListaContratos(q);
}

function pintarListaProyectos(q){
  if(PROYECTOS === null){
    $('#listaC').innerHTML = '<p class="nota" style="padding:18px 20px">' + lwT('No se ha podido leer el catálogo de proyectos. Recarga la página.') + '</p>';
    return;
  }
  const lista = !q ? PROYECTOS : PROYECTOS.filter(p => lwBuscaEn([p.nombre], q));
  if(!lista.length){
    $('#listaC').innerHTML = '<p class="nota" style="padding:18px 20px">' + lwT('Ningún proyecto con «%q».', { q: esc(q) }) + '</p>';
    return;
  }
  $('#listaC').innerHTML = lista.map(p => {
    const filas = (EXCEPCION || []).filter(r => r.proyecto_id === p.id);
    // «hereda» no es un estado a medias: es lo normal y lo correcto para la
    // mayoría. Se dice con esa palabra para que nadie crea que falta configurar
    // 29 proyectos — las excepciones son la excepción.
    const tags = filas.length
      ? ['<span class="tag t-def">' + lwT('%n reglas propias', { n: filas.length }) + '</span>']
      : ['<span class="tag">' + lwT('hereda') + '</span>'];
    const tipos = [...new Set(filas.map(r => r.slug))];
    return '<button class="c ' + (SEL === p.id ? 'sel' : '') + '" data-proy-sel="' + esc(p.id) + '">'
      + '<div class="n">' + esc(p.nombre) + '</div>'
      + '<div class="m">' + (filas.length
          ? tipos.map(t => t === TODOS ? lwT('cualquier contrato') : nombreDe(t)).join(' · ')
          : lwT('usa las cuentas de cada tipo de contrato')) + '</div>'
      + '<div class="r">' + tags.join('') + '</div>'
      + '</button>';
  }).join('');
}

function pintarListaCuentas(q){
  const lista = !q ? CUENTAS : CUENTAS.filter(c =>
    lwBuscaEn([c.label, c.titular, c.banco, c.cuenta, c.codigo, c.clave], q));
  if(!lista.length){
    $('#listaC').innerHTML = '<p class="nota" style="padding:18px 20px">' + lwT('Ninguna cuenta con «%q».', { q: esc(q) }) + '</p>';
    return;
  }
  $('#listaC').innerHTML = lista.map(c => {
    const usos = REPARTO ? REPARTO.filter(r => r.clave === c.clave).length : null;
    const tags = [];
    if(c.es_escrow) tags.push('<span class="tag t-escrow">' + lwT('Escrow') + '</span>');
    if(!c.activa)   tags.push('<span class="tag t-off">' + lwT('Desactivada') + '</span>');
    tags.push('<span class="tag">' + (usos === null ? lwT('reparto no disponible')
      : lwT('%n contratos', { n: usos })) + '</span>');
    return '<button class="c ' + (SEL === c.clave ? 'sel' : '') + '" data-clave="' + esc(c.clave) + '">'
      + '<div class="n">' + esc(c.label) + '</div>'
      + '<div class="m">' + esc(c.banco || '—') + ' · ' + esc(c.cuenta || '—') + '</div>'
      + '<div class="r">' + tags.join('') + '</div>'
      + '</button>';
  }).join('');
}

function pintarListaContratos(q){
  if(PLANTILLAS === null){
    $('#listaC').innerHTML = '<p class="nota" style="padding:18px 20px">' + lwT('No se ha podido leer el catálogo de contratos. Recarga la página.') + '</p>';
    return;
  }
  const lista = !q ? PLANTILLAS : PLANTILLAS.filter(p => lwBuscaEn([p.nombre, p.slug], q));
  if(!lista.length){
    $('#listaC').innerHTML = '<p class="nota" style="padding:18px 20px">' + lwT('Ningún contrato con «%q».', { q: esc(q) }) + '</p>';
    return;
  }
  $('#listaC').innerHTML = lista.map(p => {
    const filas = (REPARTO || []).filter(r => r.slug === p.slug);
    const def = filas.find(r => r.es_default);
    const tags = [];
    // «no ofrece ninguna» se marca en rojo: es el único estado de esta pantalla
    // que rompe un contrato de verdad — el agente abre el documento y se
    // encuentra un desplegable vacío donde va el destino del dinero.
    if(!filas.length) tags.push('<span class="tag t-off">' + lwT('sin cuentas') + '</span>');
    else tags.push('<span class="tag">' + lwT('%n cuentas', { n: filas.length }) + '</span>');
    if(def) tags.push('<span class="tag t-def">' + lwT('precargada') + '</span>');
    return '<button class="c ' + (SEL === p.slug ? 'sel' : '') + '" data-slug-sel="' + esc(p.slug) + '">'
      + '<div class="n">' + esc(p.nombre) + '</div>'
      + '<div class="m">' + (def ? lwT('cobra en %c', { c: etiquetaDe(def.clave) })
                                 : lwT('el agente elige la cuenta')) + '</div>'
      + '<div class="r">' + tags.join('') + '</div>'
      + '</button>';
  }).join('');
}

/* El campo `extra` de una cuenta es JSONB y puede ser dos cosas: un texto suelto
   o {es,en,id}. No es capricho — la fila «Nota» se imprime en los tres idiomas
   del contrato, y donde se guardó un texto plano salía en español aunque el
   documento estuviera en inglés. Aquí se editan los tres huecos por separado en
   vez de enseñar JSON crudo: quien administra cuentas no tiene por qué saber
   escribir un objeto, y un JSON mal cerrado se guardaría como texto. */
function notaDe(extra){
  if(extra && typeof extra === 'object') return { es: extra.es || '', en: extra.en || '', id: extra.id || '' };
  const t = (extra == null ? '' : String(extra));
  return { es: t, en: '', id: '' };
}
function notaAJson(n){
  if(!n.es && !n.en && !n.id) return '';          // sin nota: cadena vacía, la fila no se imprime
  if(!n.en && !n.id) return n.es;                  // un solo idioma: texto plano, como estaba
  return { es: n.es, en: n.en || n.es, id: n.id || n.es };
}

function pintarFicha(){
  if(MODO === 'contrato') return pintarFichaContrato();
  if(MODO === 'proyecto') return pintarFichaProyecto();
  return pintarFichaCuenta();
}

/* LA EXCEPCIÓN DE UN PROYECTO. Una sección por tipo de contrato que cobra, más
   una primera sección «cualquier contrato» para la cuenta de empresa del
   proyecto.

   La regla que la pantalla tiene que dejar clarísima: **marcar algo aquí
   RESTRINGE**. En cuanto un proyecto marca una sola cuenta en un tipo, ese tipo
   deja de ofrecer las demás para ese proyecto. Sin nada marcado, hereda — que es
   lo correcto para la mayoría y por eso es el estado de salida. */
function pintarFichaProyecto(){
  const p = (PROYECTOS || []).find(x => x.id === SEL);
  if(!p){ $('#ficha').innerHTML = '<div class="vacio">' + lwT('Elige un proyecto') + '</div>'; return; }
  if(EXCEPCION === null || PLANTILLAS === null){
    $('#ficha').innerHTML = '<p class="aviso mal">' + lwT('No se ha podido leer el reparto. Recarga la página.') + '</p>';
    return;
  }
  const ro = PUEDO_ESCRIBIR ? '' : ' disabled';
  const mias = EXCEPCION.filter(r => r.proyecto_id === p.id);
  const aviso = PUEDO_ESCRIBIR ? '' :
    '<p class="aviso">' + lwT('Estás viendo el reparto, no puedes cambiarlo: solo un super admin edita cuentas de cobro. Es el dato que decide adónde transfiere el comprador.') + '</p>';

  // «cualquier contrato» primero, y luego un bloque por tipo que cobra
  const bloques = [{ slug: TODOS, nombre: lwT('Cualquier contrato de este proyecto') }]
    .concat(PLANTILLAS.map(t => ({ slug: t.slug, nombre: t.nombre })));

  const activas = CUENTAS.filter(c => c.activa);

  $('#ficha').innerHTML = aviso
    + '<h2 class="t">' + esc(p.nombre) + '</h2>'
    + '<p class="sub">' + (mias.length
        ? lwT('%n reglas propias · lo que no se marque aquí, se hereda', { n: mias.length })
        : lwT('sin reglas propias — usa las cuentas de cada tipo de contrato')) + '</p>'
    + '<p class="aviso">' + lwT('Marcar una cuenta aquí RESTRINGE: ese tipo de contrato, en este proyecto, dejará de ofrecer las demás. Sin nada marcado hereda el reparto general, que es lo normal.') + '</p>'
    + bloques.map(b => {
        const filas = mias.filter(r => r.slug === b.slug);
        const def   = filas.find(r => r.es_default);
        return '<div class="caja"><h3>' + esc(b.nombre) + '</h3>'
          + '<p class="nota" style="margin:0 0 12px">' + (filas.length
              ? lwT('%n cuentas propias', { n: filas.length }) + (def ? ' · ' + lwT('precargada: %c', { c: etiquetaDe(def.clave) }) : ' · ' + lwT('sin precargada'))
              : lwT('hereda')) + '</p>'
          + '<div class="opciones">'
          + activas.map(c => {
              const marcada = filas.some(r => r.clave === c.clave);
              const esDef   = !!(def && def.clave === c.clave);
              // Aviso donde de verdad muerde: una cuenta de escrow en el bloque
              // «cualquier contrato» haría que la Carta de Reserva de este
              // proyecto ofreciera solo un depósito en garantía que no pacta.
              const peligro = (b.slug === TODOS && c.es_escrow);
              return '<div class="op' + (marcada ? '' : ' apagada') + '">'
                + '<input type="checkbox" data-pslug="' + esc(b.slug) + '" data-pclave="' + esc(c.clave) + '" data-que="ofrece"'
                  + (marcada ? ' checked' : '') + ro + '>'
                + '<span class="et"' + (peligro ? ' title="' + esc(lwT('Es una cuenta de escrow: aquí valdría para TODOS los contratos del proyecto, incluidos los que no pactan depósito en garantía.')) + '"' : '') + '>'
                  + esc(c.label)
                  + (c.es_escrow ? ' <span class="tag t-escrow">' + lwT('Escrow') + '</span>' : '')
                  + (peligro ? ' ⚠️' : '') + '</span>'
                + '<label class="rad"><input type="radio" name="pdef_' + esc(b.slug) + '" data-pslug="' + esc(b.slug) + '" data-pclave="' + esc(c.clave) + '" data-que="default"'
                  + (esDef ? ' checked' : '') + (marcada && PUEDO_ESCRIBIR ? '' : ' disabled') + '>'
                  + '<span>' + lwT('precargada') + '</span></label>'
                + '</div>';
            }).join('')
          + '</div></div>';
      }).join('');

  if(PUEDO_ESCRIBIR){
    $('#ficha').querySelectorAll('[data-pslug]').forEach(el => {
      el.addEventListener('change', () => cambiarExcepcion(el, p.id));
    });
  }
}

async function cambiarExcepcion(el, proyectoId){
  const slug  = el.dataset.pslug;
  const clave = el.dataset.pclave;
  if(el.dataset.que === 'ofrece'){
    if(el.checked){
      /* El aviso que la revisión previa marcó como CRÍTICO, aquí en el momento de
         hacerlo: una cuenta de escrow en «cualquier contrato» dejaría la Carta de
         Reserva de este proyecto ofreciendo SOLO un depósito en garantía que la
         Carta no pacta. Verificado que el riesgo es real: en Soka Village W2 los
         contratos de obra cobran en la cuenta de empresa, no en su notario. */
      const c = CUENTAS.find(x => x.clave === clave);
      if(slug === TODOS && c && c.es_escrow){
        // `lwConfirmar` (dialogo.js) y no el `confirm()` del navegador: es el
        // diálogo de la suite, arranca el foco en Cancelar y admite tono
        // «peligro». La suite no usa el nativo en ninguna herramienta.
        const sigo = await lwConfirmar({
          titulo: lwT('¿Una cuenta de escrow para TODOS los contratos?'),
          cuerpo: esc(lwT('«%c» es una cuenta de ESCROW y la estás marcando para CUALQUIER contrato de este proyecto. Sus contratos de obra y sus cartas de reserva pasarían a ofrecer solo esa cuenta, con una cláusula de depósito en garantía que no pactan.', { c: c.label })),
          confirmar: lwT('Marcarla igualmente'), tono: 'peligro',
        });
        if(!sigo){ el.checked = false; return; }
      }
      const { error } = await SB.from('proyecto_cuentas').insert({ proyecto_id: proyectoId, slug: slug, clave: clave });
      if(error){ toast(lwT('No se pudo añadir: ') + error.message); await cargar(); return; }
      toast(lwT('%c ya se puede elegir aquí', { c: etiquetaDe(clave) }));
    } else {
      const { error } = await SB.from('proyecto_cuentas').delete()
        .eq('proyecto_id', proyectoId).eq('slug', slug).eq('clave', clave);
      if(error){ toast(lwT('No se pudo quitar: ') + error.message); await cargar(); return; }
      const quedan = (EXCEPCION || []).filter(r => r.proyecto_id === proyectoId && r.slug === slug && r.clave !== clave).length;
      // quedarse sin ninguna NO deja el contrato vacío: vuelve a heredar. Se dice,
      // porque es lo contrario de lo que pasa en la vista por contrato.
      toast(quedan ? lwT('%c ya no se ofrece aquí', { c: etiquetaDe(clave) })
                   : lwT('Sin reglas propias: este proyecto vuelve a heredar el reparto general'));
    }
  } else {
    const { data, error } = await SB.from('proyecto_cuentas')
      .update({ es_default: true })
      .eq('proyecto_id', proyectoId).eq('slug', slug).eq('clave', clave).select('clave');
    if(error){ toast(lwT('No se pudo marcar como precargada: ') + error.message); await cargar(); return; }
    if(!data || !data.length){ toast(lwT('NO se ha cambiado: no tienes permiso para editar cuentas de cobro.')); await cargar(); return; }
    toast(lwT('Se precargará %c', { c: etiquetaDe(clave) }));
  }
  await cargar();
}

/* LA VISTA QUE PIDIÓ EL OWNER: se abre un contrato y se marcan sus cuentas.
   El radio de precargada lleva aquí una opción que en la otra vista no cabe —
   «ninguna» — porque un radio no se desmarca solo, y quitar la precarga sin
   quitar la cuenta es una cosa que hay que poder hacer. */
function pintarFichaContrato(){
  const p = (PLANTILLAS || []).find(x => x.slug === SEL);
  if(!p){ $('#ficha').innerHTML = '<div class="vacio">' + lwT('Elige un contrato') + '</div>'; return; }
  if(REPARTO === null){
    $('#ficha').innerHTML = '<p class="aviso mal">' + lwT('No se ha podido leer el reparto. Recarga la página.') + '</p>';
    return;
  }
  const filas  = REPARTO.filter(r => r.slug === p.slug);
  const def    = filas.find(r => r.es_default);
  const ro     = PUEDO_ESCRIBIR ? '' : ' disabled';

  const aviso = PUEDO_ESCRIBIR ? '' :
    '<p class="aviso">' + lwT('Estás viendo el reparto, no puedes cambiarlo: solo un super admin edita cuentas de cobro. Es el dato que decide adónde transfiere el comprador.') + '</p>';
  const sinNinguna = filas.length ? '' :
    '<p class="aviso mal">' + lwT('Este contrato no ofrece NINGUNA cuenta. Quien lo abra se encuentra el desplegable de destino de pago vacío — marca al menos una.') + '</p>';

  // Las desactivadas no se ofrecen para marcar: están fuera de todos los
  // desplegables por definición. Pero si alguna está marcada en este contrato
  // (se desactivó después), se enseña y se dice, porque si no desaparece de la
  // pantalla una fila que sí existe en la base.
  const candidatas = CUENTAS.filter(c => c.activa || filas.some(r => r.clave === c.clave));

  $('#ficha').innerHTML = aviso + sinNinguna
    + '<h2 class="t">' + esc(p.nombre) + '</h2>'
    + '<p class="sub">' + lwT('plantilla %k', { k: esc(p.slug) }) + ' · '
      + (filas.length ? lwT('%n cuentas ofrecidas', { n: filas.length }) : lwT('sin cuentas'))
      + (def ? ' · ' + lwT('precargada: %c', { c: etiquetaDe(def.clave) }) : ' · ' + lwT('sin precargada'))
      + '</p>'

    + '<div class="caja"><h3>' + lwT('Qué cuentas puede elegir el agente en este contrato') + '</h3>'
      + '<div class="opciones">'
      + candidatas.map(c => {
          const marcada = filas.some(r => r.clave === c.clave);
          const esDef   = !!(def && def.clave === c.clave);
          const etiqueta = esc(c.label)
            + (c.es_escrow ? ' <span class="tag t-escrow">' + lwT('Escrow') + '</span>' : '')
            + (c.activa ? '' : ' <span class="tag t-off">' + lwT('Desactivada') + '</span>');
          return '<div class="op' + (marcada ? '' : ' apagada') + '">'
            + '<input type="checkbox" data-clave-op="' + esc(c.clave) + '" data-que="ofrece"' + (marcada ? ' checked' : '') + ro + '>'
            + '<span class="et" title="' + esc(c.banco || '') + ' · ' + esc(c.cuenta || '') + '">' + etiqueta + '</span>'
            + '<label class="rad"><input type="radio" name="def_contrato" data-clave-op="' + esc(c.clave) + '" data-que="default"'
              + (esDef ? ' checked' : '') + (marcada && PUEDO_ESCRIBIR ? '' : ' disabled') + '>'
              + '<span>' + lwT('precargada') + '</span></label>'
            + '</div>';
        }).join('')
      + '</div>'
      + '<div class="acciones">'
        + '<label class="op"><input type="radio" name="def_contrato" data-que="sin_default"' + (def ? '' : ' checked') + ro + '>'
          + '<span class="et">' + lwT('Ninguna precargada — el agente la elige cada vez') + '</span></label>'
      + '</div>'
      + '<p class="nota">'
        + lwT('«Precargada» viene ya elegida al abrir un contrato nuevo. Sin precargada, el desplegable arranca vacío y el agente tiene que elegir — que es lo correcto salvo que este documento cobre siempre en el mismo sitio.') + '<br>'
        + lwT('Un contrato YA GUARDADO conserva la cuenta con la que se hizo, aunque aquí la desmarques. No se reescribe nada de lo emitido.')
      + '</p>'
    + '</div>';

  if(PUEDO_ESCRIBIR){
    $('#ficha').querySelectorAll('[data-que]').forEach(el => {
      el.addEventListener('change', () => cambiarRepartoContrato(el, p.slug));
    });
  }
}

/* El aviso que la consulta de deploy del 14-sep echó en falta: qué hay ya emitido
   con esta cuenta, con la cifra, justo debajo de los campos que se pueden
   cambiar. La distinción que importa es firmados / no firmados: un contrato sin
   firmar se corrige, uno firmado es un documento que alguien tiene en la mano. */
function avisoFirmados(clave){
  const u = USO[clave];
  if(!u || !u.contratos) return '';
  if(!u.firmados){
    return '<p class="aviso">' + lwT('Esta cuenta está en %n contratos, ninguno firmado todavía.', { n: u.contratos }) + '</p>';
  }
  return '<p class="aviso mal">'
    + lwT('Esta cuenta está en %n contratos, y %f ya FIRMADOS.', { n: u.contratos, f: u.firmados }) + ' '
    + lwT('Si cambias el titular, el número o la casilla ESCROW, cambia lo que imprimen esos documentos cuando alguien los reabra. Para una cuenta distinta, crea una nueva en vez de reescribir esta.')
    + '</p>';
}

function campo(id, etiqueta, valor, ro, ancho){
  return '<div' + (ancho ? ' class="f-full"' : '') + '>'
    + '<label class="f" for="f_' + id + '">' + etiqueta + '</label>'
    + '<input type="text" id="f_' + id + '" value="' + esc(valor == null ? '' : String(valor)) + '"' + ro + '>'
    + '</div>';
}

function repartoHTML(c){
  if(PLANTILLAS === null || REPARTO === null){
    return '<p class="aviso mal">' + lwT('No se ha podido leer el reparto por contrato. Recarga la página: lo que se ve arriba es correcto, esto no se sabe.') + '</p>';
  }
  if(!PLANTILLAS.length){
    return '<p class="nota">' + lwT('No hay ningún tipo de contrato que cobre. Nada que repartir.') + '</p>';
  }
  const ro = PUEDO_ESCRIBIR ? '' : ' disabled';
  return PLANTILLAS.map(p => {
    const filas    = REPARTO.filter(r => r.slug === p.slug);
    const marcada  = filas.some(r => r.clave === c.clave);
    const esDef    = filas.some(r => r.clave === c.clave && r.es_default);
    const otraDef  = filas.find(r => r.es_default && r.clave !== c.clave);
    const cuantas  = filas.length;
    // Cuántas cuentas ofrece HOY este contrato, dicho en la propia fila: es lo
    // que contesta «¿puedo quitar esta sin dejarlo sin ninguna?» sin tener que
    // abrir las otras catorce fichas.
    const pista = cuantas === 0
      ? lwT('ahora mismo no ofrece ninguna cuenta')
      : (otraDef
          ? lwT('%n cuentas · precargada: %c', { n: cuantas, c: etiquetaDe(otraDef.clave) })
          : lwT('%n cuentas · sin precargada', { n: cuantas }));
    return '<div class="plantilla">'
      + '<div class="pn">' + esc(p.nombre) + '</div>'
      + '<div class="pm">' + pista + '</div>'
      + '<div class="opciones"><div class="op' + (marcada ? '' : ' apagada') + '">'
        + '<input type="checkbox" data-slug="' + esc(p.slug) + '" data-que="ofrece"' + (marcada ? ' checked' : '') + ro + '>'
        + '<span class="et">' + lwT('se ofrece en este contrato') + '</span>'
        + '<label class="rad"><input type="radio" name="def_' + esc(p.slug) + '" data-slug="' + esc(p.slug) + '" data-que="default"'
          + (esDef ? ' checked' : '') + (marcada && PUEDO_ESCRIBIR ? '' : ' disabled') + '>'
          + '<span>' + lwT('precargada') + '</span></label>'
      + '</div></div>'
      + '</div>';
  }).join('');
}

function etiquetaDe(clave){
  const c = CUENTAS.find(x => x.clave === clave);
  return esc(c ? c.label : clave);
}

/* ---------- alta de una cuenta nueva ----------
   Se pinta en la ficha, igual que el «Nuevo usuario» de /intranet/usuarios/.

   LA `clave` SE PIDE AQUÍ Y NO SE PUEDE CAMBIAR DESPUÉS, y hay que decirlo en la
   propia pantalla: es el identificador que se guarda dentro de cada contrato y
   cada factura emitidos con esta cuenta (`datos.fields.cuenta_bancaria`).
   Renombrarla más tarde dejaría documentos firmados apuntando a algo que no
   existe — el mismo motivo por el que `tepi_sungai` no se renombra en
   entities.js. Se valida su forma aquí porque un espacio o una mayúscula dentro
   convierten la clave en algo que no se puede escribir en una URL ni comparar a
   ojo entre dos pantallas.

   Nace DESACTIVADA y sin ninguna plantilla marcada, a propósito: una cuenta
   recién creada no puede aparecer en el desplegable de un contrato antes de que
   alguien haya comprobado el número. Se activa y se reparte después, con los
   datos delante. */
function nuevaCuenta(){
  SEL = null; pintarLista();
  $('#stage').classList.add('abierta');
  $('#ficha').innerHTML =
      '<h2 class="t">' + lwT('Nueva cuenta de cobro') + '</h2>'
    + '<p class="sub">' + lwT('Nace desactivada y sin ningún contrato asignado. Se comprueba el número y luego se activa.') + '</p>'
    + '<div class="caja"><h3>' + lwT('Datos de la cuenta') + '</h3>'
      + '<div class="par">'
        + campo('nClave',    lwT('Clave interna (no se puede cambiar después)'), '', '', true)
        + campo('nLabel',    lwT('Etiqueta (la que se ve en el desplegable)'), '', '', true)
        + campo('nTitular',  lwT('Titular'), '', '')
        + campo('nBanco',    lwT('Banco'), '', '')
        + campo('nCuenta',   lwT('Número de cuenta'), '', '')
        + campo('nCodigo',   lwT('Código Swift / Routing'), '', '')
        + campo('nDireccion',lwT('Domicilio del banco'), '', '', true)
      + '</div>'
      + '<div class="acciones">'
        + '<label class="op"><input type="checkbox" id="nEscrow"><span class="et">'
          + lwT('Es una cuenta ESCROW (depósito en garantía)') + '</span></label>'
      + '</div>'
      + '<p class="nota">'
        + lwT('La clave va en minúsculas, sin espacios ni acentos (por ejemplo «notario_ayu_bali»). Queda dentro de cada contrato y cada factura que se emitan con esta cuenta, así que no se renombra nunca.') + '<br>'
        + lwT('Titular, banco y número son lo que el comprador va a leer en su contrato. Cópialos del justificante del banco, no de memoria.')
      + '</p>'
      + '<div class="acciones">'
        + '<button class="btn primary" id="btnCrear">' + lwT('Crear cuenta') + '</button>'
        + '<button class="btn" id="btnCancelarNueva">' + lwT('Cancelar') + '</button>'
      + '</div>'
    + '</div>';
  $('#btnCrear').addEventListener('click', crearCuenta);
  $('#btnCancelarNueva').addEventListener('click', () => {
    $('#ficha').innerHTML = '<div class="vacio">'
      + (MODO === 'contrato' ? lwT('Elige un contrato') : lwT('Elige una cuenta')) + '</div>';
  });
}

async function crearCuenta(){
  // `campo()` prefija los ids con `f_` (los comparte con la ficha de edición),
  // así que aquí se leen con el mismo prefijo y no por el nombre a secas.
  const val = id => (($('#f_' + id) || {}).value || '').trim();
  const clave = val('nClave').toLowerCase();
  const label = val('nLabel');
  // Los tres campos que la tabla exige NOT NULL y que además no tienen un valor
  // razonable por defecto. Se comprueban aquí para dar un mensaje que diga QUÉ
  // falta, en vez del error de Postgres.
  if(!/^[a-z0-9_]{3,}$/.test(clave)){
    toast(lwT('La clave va en minúsculas, números y guión bajo, mínimo 3 caracteres. Sin espacios ni acentos.')); return;
  }
  if(CUENTAS.some(c => c.clave === clave)){
    toast(lwT('Ya existe una cuenta con la clave «%k».', { k: clave })); return;
  }
  if(!label){ toast(lwT('La etiqueta no puede quedar vacía: es lo que se lee en el desplegable del contrato.')); return; }
  if(!val('nTitular') || !val('nCuenta')){
    toast(lwT('Hacen falta al menos el titular y el número de cuenta: son lo que el comprador usa para transferir.')); return;
  }
  const fila = {
    clave: clave, label: label,
    titular: val('nTitular'), banco: val('nBanco'), cuenta: val('nCuenta'),
    codigo: val('nCodigo'), direccion: val('nDireccion'),
    extra: '',
    es_escrow: !!($('#nEscrow') || {}).checked,
    // desactivada de salida: no entra en ningún desplegable hasta que alguien
    // haya mirado el número con el justificante delante
    activa: false,
    // al final de la lista; `orden` gobierna esta pantalla, no el desplegable del
    // contrato (que va alfabético por etiqueta)
    orden: Math.max(0, ...CUENTAS.map(c => c.orden || 0)) + 10,
  };
  /* `.select()` detrás del insert a propósito, y conviene saber por qué no
     muerde aquí: la policy de SELECT de `cuentas_bancarias` es para cualquier
     sesión, así que leer la fila recién creada está permitido. Donde SELECT es
     más estrecho que INSERT, esto haría fallar el alta con un error que culpa a
     la escritura. */
  const { error } = await SB.from('cuentas_bancarias').insert(fila).select('clave').single();
  if(error){ toast(lwT('No se pudo crear: ') + error.message); return; }
  toast(lwT('Cuenta creada, desactivada. Comprueba los datos y actívala.'));
  await cargar();
  // se abre su ficha en la vista por cuenta: es donde se activa y se revisa
  MODO = 'cuenta';
  $('#modoContrato').classList.remove('on'); $('#modoCuenta').classList.add('on');
  SEL = clave; pintarLista(); pintarFicha();
}

/* ---------- escribir ---------- */

async function guardarCuenta(clave){
  const val = id => ($('#f_' + id) || {}).value || '';
  const nota = { es: ($('#nota_es') || {}).value || '', en: ($('#nota_en') || {}).value || '', id: ($('#nota_id') || {}).value || '' };
  const label = val('label').trim();
  // La etiqueta es lo ÚNICO por lo que el agente distingue una cuenta de otra en
  // el desplegable del contrato. Vacía, el select enseña una opción en blanco y
  // se elige a ciegas el destino de una transferencia.
  if(!label){ toast(lwT('La etiqueta no puede quedar vacía: es lo que se lee en el desplegable del contrato.')); return; }
  const cambios = {
    label:     label,
    titular:   val('titular').trim(),
    banco:     val('banco').trim(),
    cuenta:    val('cuenta').trim(),
    codigo:    val('codigo').trim(),
    direccion: val('direccion').trim(),
    extra:     notaAJson({ es: nota.es.trim(), en: nota.en.trim(), id: nota.id.trim() }),
    es_escrow: !!($('#f_escrow') || {}).checked,
    activa:    !!($('#f_activa') || {}).checked,
  };
  /* `clave` NO va en el update: va guardada dentro de cada contrato emitido.

     `.select()` detrás NO es decoración: un UPDATE que la RLS deja en CERO filas
     **no devuelve error**, simplemente no cambia nada. Sin esto, a quien no sea
     super admin el panel le diría «Cuenta guardada» sin haber guardado — el peor
     desenlace posible, porque se iría creyendo que la cuenta de cobro es otra.
     Medido contra la base: como agente el update afecta 0 filas y no lanza; como
     super admin afecta 1. Los botones ya están ocultos para quien no puede, así
     que esto es el cinturón por si un día ese `hidden` se cae. */
  const { data, error } = await SB.from('cuentas_bancarias')
    .update(cambios).eq('clave', clave).select('clave');
  if(error){ toast(lwT('No se pudo guardar: ') + error.message); return; }
  if(!data || !data.length){
    toast(lwT('NO se ha guardado: no tienes permiso para editar cuentas de cobro. Recarga la página.'));
    return;
  }
  toast(lwT('Cuenta guardada'));
  await cargar();
}

/* El reparto se guarda al vuelo, casilla a casilla, y no con un botón «guardar»
   al final: son decisiones sueltas e independientes, y un botón obligaría a
   recordar qué se tocó para saber qué se está a punto de aplicar.
   Cada cambio recarga, que es barato y deja la pantalla diciendo exactamente lo
   que hay en la base — no lo que creemos haber escrito. */
async function cambiarReparto(el, clave){
  const slug = el.dataset.slug;
  const que  = el.dataset.que;

  if(que === 'ofrece'){
    if(el.checked){
      const { error } = await SB.from('plantilla_cuentas').insert({ slug: slug, clave: clave });
      if(error){ toast(lwT('No se pudo añadir: ') + error.message); await cargar(); return; }
      toast(lwT('Añadida a «%p»', { p: nombreDe(slug) }));
    } else {
      // Quitar la que estaba precargada deja al contrato sin precarga, y eso es
      // lo correcto: precargar una cuenta que ya no se ofrece imprimiría un
      // destino de pago que el propio desplegable no admite. Se avisa porque el
      // efecto no está en la casilla que se acaba de tocar.
      const era = (REPARTO || []).some(r => r.slug === slug && r.clave === clave && r.es_default);
      const { error } = await SB.from('plantilla_cuentas').delete().eq('slug', slug).eq('clave', clave);
      if(error){ toast(lwT('No se pudo quitar: ') + error.message); await cargar(); return; }
      toast(era ? lwT('Quitada de «%p» — ese contrato se queda SIN cuenta precargada', { p: nombreDe(slug) })
                : lwT('Quitada de «%p»', { p: nombreDe(slug) }));
    }
  } else {
    // Marcar la precargada: el trigger `un_solo_default_por_plantilla` desmarca
    // sola a la anterior. Por eso aquí no hay dos sentencias en orden — y por
    // eso la garantía es un trigger y no un índice único parcial, que no sirve
    // para `on conflict` (error 42P10).
    const { data, error } = await SB.from('plantilla_cuentas')
      .update({ es_default: true }).eq('slug', slug).eq('clave', clave).select('clave');
    if(error){ toast(lwT('No se pudo marcar como precargada: ') + error.message); await cargar(); return; }
    // 0 filas y sin error = la RLS lo paro en silencio (ver la nota de guardarCuenta)
    if(!data || !data.length){ toast(lwT('NO se ha cambiado: no tienes permiso para editar cuentas de cobro.')); await cargar(); return; }
    toast(lwT('Precargada en «%p»', { p: nombreDe(slug) }));
  }
  await cargar();
}

/* La misma operación desde la vista por contrato. No comparte función con
   `cambiarReparto` a propósito: aquí lo fijo es el contrato y lo que varía es la
   cuenta —al revés— y además existe «ninguna precargada», que en la otra vista
   no tiene dónde ponerse. Fundirlas pedía un parámetro de "sentido" que habría
   que leer dos veces cada vez que se toque esto. */
async function cambiarRepartoContrato(el, slug){
  const clave = el.dataset.claveOp;
  const que   = el.dataset.que;

  if(que === 'ofrece'){
    if(el.checked){
      const { error } = await SB.from('plantilla_cuentas').insert({ slug: slug, clave: clave });
      if(error){ toast(lwT('No se pudo añadir: ') + error.message); await cargar(); return; }
      toast(lwT('%c ya se puede elegir aquí', { c: etiquetaDe(clave) }));
    } else {
      const era = (REPARTO || []).some(r => r.slug === slug && r.clave === clave && r.es_default);
      const quedan = (REPARTO || []).filter(r => r.slug === slug && r.clave !== clave).length;
      const { error } = await SB.from('plantilla_cuentas').delete().eq('slug', slug).eq('clave', clave);
      if(error){ toast(lwT('No se pudo quitar: ') + error.message); await cargar(); return; }
      // Los dos efectos colaterales se dicen, porque ninguno se ve en la casilla
      // que se acaba de tocar: quedarse sin precarga, y quedarse sin ninguna.
      toast(!quedan ? lwT('Quitada — este contrato ya NO ofrece ninguna cuenta')
                    : era ? lwT('Quitada — este contrato se queda SIN cuenta precargada')
                          : lwT('%c ya no se ofrece aquí', { c: etiquetaDe(clave) }));
    }
  } else if(que === 'default'){
    // El trigger `un_solo_default_por_plantilla` desmarca sola a la anterior.
    const { data, error } = await SB.from('plantilla_cuentas')
      .update({ es_default: true }).eq('slug', slug).eq('clave', clave).select('clave');
    if(error){ toast(lwT('No se pudo marcar como precargada: ') + error.message); await cargar(); return; }
    // 0 filas y sin error = la RLS lo paro en silencio (ver la nota de guardarCuenta)
    if(!data || !data.length){ toast(lwT('NO se ha cambiado: no tienes permiso para editar cuentas de cobro.')); await cargar(); return; }
    toast(lwT('Se precargará %c', { c: etiquetaDe(clave) }));
  } else {
    // «ninguna precargada»: se desmarcan TODAS las de este contrato. No hay
    // trigger que lo haga —el trigger solo garantiza que no haya dos— así que
    // va explícito y acotado al contrato, nunca a la tabla entera.
    const { data, error } = await SB.from('plantilla_cuentas')
      .update({ es_default: false }).eq('slug', slug).eq('es_default', true).select('clave');
    if(error){ toast(lwT('No se pudo quitar la precarga: ') + error.message); await cargar(); return; }
    // aqui 0 filas es AMBIGUO —puede que ya no hubiera ninguna precargada— asi que
    // no se trata como fallo: el estado final se lee de la base en el `cargar()` de abajo
    if(!data){ toast(lwT('No se pudo quitar la precarga: ') + lwT('sin respuesta')); await cargar(); return; }
    toast(lwT('Sin cuenta precargada — el agente la elegirá cada vez'));
  }
  await cargar();
}

function nombreDe(slug){
  const p = (PLANTILLAS || []).find(x => x.slug === slug);
  return p ? p.nombre : slug;
}

/* ---------- eventos ---------- */
$('#qC').addEventListener('input', pintarLista);
$('#listaC').addEventListener('click', e => {
  // Dos atributos distintos y no uno solo: en «por contrato» el identificador es
  // un slug y en «por cuenta» una clave, y las dos son texto. Con un `data-id`
  // compartido, un fallo de modo elegiría el registro equivocado sin ruido.
  const b = e.target.closest('[data-clave], [data-slug-sel], [data-proy-sel]'); if(!b) return;
  SEL = b.dataset.claveOp || b.dataset.clave || b.dataset.slugSel || b.dataset.proySel;
  pintarLista(); pintarFicha(); $('#stage').classList.add('abierta');
});

function cambiarModo(nuevo){
  if(MODO === nuevo) return;
  MODO = nuevo;
  SEL = null;                       // el identificador no significa lo mismo en los dos modos
  $('#qC').value = '';
  $('#modoContrato').classList.toggle('on', nuevo === 'contrato');
  $('#modoProyecto').classList.toggle('on', nuevo === 'proyecto');
  $('#modoCuenta').classList.toggle('on', nuevo === 'cuenta');
  $('#qC').placeholder = nuevo === 'contrato' ? lwT('Buscar contrato…')
                       : nuevo === 'proyecto' ? lwT('Buscar proyecto…')
                       : lwT('Buscar cuenta, banco, titular…');
  $('#stage').classList.remove('abierta');
  pintarLista();
  $('#ficha').innerHTML = '<div class="vacio">'
    + (nuevo === 'contrato' ? lwT('Elige un contrato')
     : nuevo === 'proyecto' ? lwT('Elige un proyecto')
     : lwT('Elige una cuenta')) + '</div>';
}
$('#modoContrato').addEventListener('click', () => cambiarModo('contrato'));
$('#modoProyecto').addEventListener('click', () => cambiarModo('proyecto'));
$('#modoCuenta').addEventListener('click',   () => cambiarModo('cuenta'));
$('#btnNueva').addEventListener('click', nuevaCuenta);

LW_AUTH.then(async ({ sb, session, ficha }) => {
  SB = sb;
  /* La ficha se consulta AQUÍ si el guard no la trae. No es redundancia: el
     29-jul un guard.js cacheado por el servidor (max-age 7 días) seguía siendo
     la versión que no devolvía `ficha`, y el panel de usuarios le decía al
     super_admin que no era administrador. Depender de que un asset compartido
     esté fresco para decidir un permiso es frágil; preguntarlo cuesta una
     consulta. */
  YO = ficha || (await sb.from('usuarios').select('rol, herramientas, activo, nombre')
                   .eq('user_id', session.user.id).maybeSingle()).data;

  PUEDO_ESCRIBIR = !!YO && YO.rol === 'super_admin';
  // El botón de alta sale del HTML con `hidden`: se enseña solo a quien puede
  // usarlo. Un botón que existe y da error al guardar es peor que uno que no
  // está, porque el error llega después de teclear los ocho campos.
  $('#btnNueva').hidden = !PUEDO_ESCRIBIR;

  // Mirar sí puede cualquiera del equipo que tenga la herramienta: entender por
  // qué un contrato ofrece las cuentas que ofrece es parte de usar la suite. Lo
  // que no puede es cambiarlo, y eso lo impide la RLS, no esta pantalla.
  if(!YO){
    $('#stage').innerHTML = '<div class="vacio" style="grid-column:1/-1">'
      + lwT('No se ha podido leer tu ficha de usuario. Recarga la página.') + '</div>';
    return;
  }
  await cargar();
});
</script>
