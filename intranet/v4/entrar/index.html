<!-- 19-sep-2026 (revisión previa de Seguridad, auditoría de paridad): aquí había
     un formulario de email + contraseña que NO autenticaba — su onsubmit hacía
     location.href al login vivo. Una página que pide contraseña y no valida
     nada, servida en el dominio de la marca, tiene forma de phishing aunque
     sea nuestra, y era una tercera puerta que mantener en sincronía con las
     dos reales (/entrar/ y /intranet/ ya validan `next` contra URL externa y
     bloquean intentos). La puerta de la suite es UNA: /intranet/. Esta ruta se
     conserva como redirección porque el logout de la sidebar (nav.js) y el hub
     v4 la enlazan. La pantalla diseñada queda en el historial de git (hasta el
     commit anterior a este) por si algún día el login vivo adopta su piel:
     el movimiento sería ese, nunca traer una copia aquí. -->
<link rel="canonical" href="/intranet/">
<meta http-equiv="refresh" content="0; url=/intranet/?next=%2Fintranet%2Fv4%2Fhome%2F">
<script>location.replace('/intranet/?next=' + encodeURIComponent('/intranet/v4/home/'));</script>
