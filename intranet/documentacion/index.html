<style>
  *{ box-sizing:border-box; } html,body{ margin:0; height:100%; }
  body{ font-family:var(--font-body,'Jost',sans-serif); background:var(--sup-0); color:var(--texto); }
  .topbar{ position:fixed; top:0; left:0; right:0; z-index:40; }

  .c-precios{ background:#8C5E10; } .c-planos{ background:#104C4F; } .c-legal{ background:#3F5230; }
  .c-comercial{ background:#6A4B8A; } .c-tecnico{ background:#2E5F72; } .c-fotos{ background:#7A5C3A; }
  .c-otros{ background:#5A6062; } .c-faq{ background:#8A3A54; }
  .conf{ font-size:11px; color:#9E2F26; font-weight:600; }


  /* ── carpetas como TARJETA, no como chip (6-ago-2026) ──────────────────
     Era un `.sui-chip` de 12px con el número de subíndice: con veinte carpetas
     eso es una sopa de pastillas donde no se distingue la jerarquía ni se ve de
     un vistazo dónde está el volumen de documentos. La tarjeta da sitio al
     número —que es el dato que se busca— y al icono.
     Ancho mínimo y no fijo: una carpeta se llama «Precios» o
     «Especificaciones técnicas», y recortar el nombre para que la rejilla case
     sería cambiar legibilidad por simetría. */
  .carp{ display:flex; align-items:center; gap:10px; min-width:190px; text-align:left;
         font:inherit; font-size:13.5px; color:var(--texto); cursor:pointer;
         background:var(--sup-1); border:1px solid var(--linea); border-radius:var(--r-m);
         padding:11px 14px; min-height:24px;
         transition:border-color var(--t-rapido), box-shadow var(--t-rapido),
                    transform .15s ease, background var(--t-rapido); }
  .carp:hover{ border-color:var(--dl,#104C4F); transform:translateY(-1px); box-shadow:var(--sombra-1); }
  .carp .ic{ font-size:17px; line-height:1; flex:none; }
  .carp .t{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* El número, con cifras de ancho fijo y a la derecha: es lo que se compara
     entre carpetas, y con `tabular-nums` 8 y 112 casan por columna. */
  .carp .n{ flex:none; font-variant-numeric:tabular-nums; font-weight:600;
            font-size:12.5px; color:var(--texto-2); background:var(--sup-2);
            border-radius:var(--r-p); padding:2px 9px; }
  /* Seleccionada: el MISMO lenguaje que la fila seleccionada de la tabla —
     relleno suave + filete de acento a la izquierda + dato en tinta de marca.
     Tres señales, no una de color (ver `--sup-sel` en suite.css). */
  .carp.on{ background:var(--sup-sel); border-color:var(--dl,#104C4F);
            box-shadow:inset 3px 0 0 var(--dl,#104C4F); }
  .carp.on .t{ font-weight:600; color:var(--dl,#104C4F); }
  .carp.on .n{ background:var(--sup-1); color:var(--dl,#104C4F); }
  @media (max-width:760px){ .carp{ min-width:0; flex:1 1 100%; } }

  /* medidor de almacenamiento */
  .uso{ border:1px solid var(--linea); border-radius:var(--r-m); background:var(--sup-1);
        padding:var(--e3) var(--e4); margin:0 0 var(--e3); }
  .uso h3{ margin:0 0 8px; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
           color:var(--texto-2); font-weight:600; }
  .barra{ height:7px; border-radius:var(--r-p); background:#E7E1D2; overflow:hidden; margin:4px 0 3px; }
  .barra i{ display:block; height:100%; background:#3F5230; }
  .barra.aviso i{ background:#8C5E10; } .barra.mal i{ background:#9E2F26; }
  .uso .n{ font-size:12.5px; color:var(--texto-2); display:flex; justify-content:space-between; gap:10px; }
  .uso .n b{ color:var(--texto); font-variant-numeric:tabular-nums; }

  /* Vista previa de Drive: alto fijo y sin borde. 420px es lo que deja ver una
     portada A4 entera sin comerse el cajon; por debajo hay que desplazar dentro
     del marco, que es lo peor de los visores incrustados. */
  .dprev{ width:100%; height:420px; border:0; display:block; background:#EDE7D9; }
  @media (max-width:760px){ .dprev{ height:300px; } }

                 en:'That’s why documentation goes by link to Drive: this space is needed for signed contracts.' },
};
const t = k => (T[k] && T[k][IDIOMA]) || (T[k] && T[k].es) || k;
// Categorías: se guarda la CLAVE en la base (precios/planos/...), la
// etiqueta visible sale del diccionario — así CATEGORIAS[n][1] deja de ser
// un string fijo y pasa a resolverse en el idioma activo.
const CATEGORIAS = [
  ['precios', t('catPrecios')], ['planos', t('catPlanos')], ['legal', t('catLegal')],
  ['comercial', t('catComercial')], ['tecnico', t('catTecnico')], ['fotos', t('catFotos')],
  ['faq', t('catFaq')], ['otros', t('catOtros')],
];
// Carpeta fija para las FAQ (12-ago, petición del owner: "entrenar a los
// comerciales" con las preguntas que repiten los clientes) — reusa el árbol
// de carpetas que ya existe, así que "una sección de FAQ por proyecto" no
// necesita ninguna vista nueva: es la carpeta que ya agrupa por proyecto.
// Nombre FIJO en español a propósito, igual en los dos idiomas: es una
// carpeta real guardada en la base (dato, no interfaz) — traducirla según
// quien mire la dejaría partida en dos carpetas distintas.
const CARPETA_FAQ = 'Preguntas frecuentes';

const $ = s => document.querySelector(s);
const mb = b => !b ? '—' : b < 1048576 ? Math.round(b/1024) + ' KB' : (b/1048576).toFixed(1) + ' MB';
const fecha = f => f ? new Date(f).toLocaleDateString(IDIOMA === 'en' ? 'en-GB' : 'es-ES', {day:'2-digit', month:'short', year:'numeric'}) : '';
const esSuperAdmin = rol => rol === 'super_admin';

/* `?proyecto=` en la URL entra ya filtrado. Lo usa el enlace que sale de la
   carpeta de cada proyecto en /intranet/proyectos/ (17-ago-2026): «lo mismo pero en dos
   sitios», dijo el owner, asi que al menos se salta de uno a otro sin volver a
   elegir el proyecto a mano. Si el nombre no existe se ignora y se ven todos —
   un filtro que deja la pantalla vacia parece que la herramienta esta rota. */
let SB=null, DOCS=[], SEL=null, PROYECTOS=[], CAT='', PROY='', CARPETA='', Q='', ROL=null;
try{ PROY = new URLSearchParams(location.search).get('proyecto') || ''; }catch(_){}
let CARGANDO=true, FALLO=null;
const ORDEN = { campo:'titulo', dir:'asc' };
/* URL firmadas cacheadas por ruta: caducan a los 15 min — tiempo de sobra para
   leer un PDF y poco para que un enlace reenviado por error siga sirviendo. */
const FIRMADAS = new Map();

/* ---------- carga ---------- */
async function cargar(){
  CARGANDO = true; FALLO = null; pintar();
  const { data, error } = await SB.from('documentos_proyecto')
    .select('id, proyecto, carpeta, categoria, titulo, descripcion, path, url, mime, bytes, confidencial, visible_portal, creado_en, creado_por')
    .order('proyecto').order('carpeta').order('titulo');
  CARGANDO = false;
  if(error){ FALLO = error.message; pintar(); return; }
  DOCS = data || [];
  // La lista de proyectos sale del diccionario de contratos (fuente única) más
  // los que ya tengan documentos, por si alguno se guardó con otro nombre.
  let delTokens = [];
  try{
    const tk = await fetch('/contracts/tokens.json?v=' + Date.now()).then(r => r.json());
    (tk.sections || []).forEach(sec => (sec.fields || []).forEach(f => {
      if(f[0] === 'proyecto_nombre' && Array.isArray(f[3])) delTokens = f[3].slice();
    }));
  }catch(_){
    /* MUDO A PROPOSITO — 21-ago-2026, revisado. Si tokens.json no se
       puede leer, la lista de proyectos cae a «los que ya tienen documentos»:
       se pierde poder archivar en un proyecto todavia vacio, pero no se pierde
       ni se esconde ningun documento ya guardado. Degradacion segura y visible
       sola (el proyecto que falta se nota al buscarlo), asi que un aviso aqui
       seria ruido. Se anota para que la proxima revision no lo cuente como
       olvido. */
  }
  /* Los dos primeros no son promociones: son la EMPRESA. Un documento como los
     anexos de las casas (Dali, Dream, Dune, Tropical) no es de Palm Field ni de
     Bonian Village — vale para todas, y archivarlo dentro de una obligaba a
     elegir una al azar y luego no encontrarlo desde las demás. Van delante y
     fuera del orden alfabético a propósito: si se ordenan con el resto, «Lawang
     (general)» cae entre dos promociones y parece una más.
     La columna `proyecto` es texto libre y sin CHECK, así que esto es solo la
     lista que se OFRECE: no hace falta tocar la base. */
  const GENERALES = ['Lawang (general)', 'Sumba (general)'];
  const resto = [...new Set([...delTokens, ...DOCS.map(d => d.proyecto)])]
    .filter(p => p && !GENERALES.includes(p)).sort((a, b) => a.localeCompare(b));
  PROYECTOS = [...GENERALES, ...resto];
  pintar();
}

/* ---------- árbol de carpetas ---------- */
function ramas(){
  const set = new Set();
  DOCS.filter(d => !PROY || d.proyecto === PROY).forEach(d => {
    const partes = String(d.carpeta || '').split('/').filter(Boolean);
    for(let i = 1; i <= partes.length; i++) set.add(partes.slice(0, i).join('/'));
  });
  return [...set].sort((a, b) => a.localeCompare(b, 'es'));
}
const dentroDe = (d, ruta) => ruta === ''
  || d.carpeta === ruta || String(d.carpeta || '').startsWith(ruta + '/');

/* Las carpetas pasan de chip pequeño a TARJETA (6-ago-2026, handoff de diseño).
   Es puramente visual: `ramas()` y `dentroDe()` siguen siendo los mismos, el
   atributo `data-carp` es el mismo y quien escucha el clic no cambia — lo único
   distinto es la forma del botón y que el número se lee de un vistazo en vez de
   ir de subíndice.
   La sangría por profundidad se conserva: era la única señal de que
   «Precios/2026» está dentro de «Precios», y una rejilla plana la habría
   perdido. Se hace con `margin-left` sobre la tarjeta, como antes. */
function pintarArbol(){
  const base = DOCS.filter(d => !PROY || d.proyecto === PROY);
  const n = ruta => base.filter(d => dentroDe(d, ruta)).length;
  const tarjeta = (ruta, etiqueta, hondo) =>
    `<button class="carp ${CARPETA===ruta?'on':''}" data-carp="${esc(ruta)}"` +
    (ruta ? ` title="${esc(ruta)}"` : '') +
    (hondo ? ` style="margin-left:${hondo * 18}px"` : '') + '>' +
      /* Emoji y no un icono de fuente: esta página no carga Phosphor, y traer un
         CSS de CDN entero (con su `integrity` y su versión fijada, que es la
         norma del estudio) para tres carpetas no se paga. El original ya usaba
         📁; aquí solo es más grande. */
      `<span class="ic" aria-hidden="true">${hondo ? '📂' : '📁'}</span>` +
      `<span class="t">${esc(etiqueta)}</span>` +
      `<span class="n">${n(ruta)}</span>` +
    '</button>';
  $('#arbol').innerHTML =
    `<span class="sui-eje">${t('ejeCarpeta')}</span>` +
    tarjeta('', t('todas'), 0) +
    ramas().map(ruta => tarjeta(ruta, ruta.split('/').pop(), ruta.split('/').length - 1)).join('');
}

function visibles(){
  const q = Q.trim().toLowerCase();
  const f = DOCS.filter(d =>
    (!PROY || d.proyecto === PROY) && dentroDe(d, CARPETA) &&
    (!CAT || d.categoria === CAT) &&
    (!q || [d.titulo, d.proyecto, d.carpeta, d.descripcion, d.creado_por]
            .some(v => String(v||'').toLowerCase().includes(q))));
  return suiOrdenar(f, ORDEN, (d, c) => d[c]);
}

function pintar(){
  // El proyecto que llega por URL solo vale si de verdad existe: si no, se cae
  // a «todos» en vez de dejar la pantalla en blanco sin explicar por que.
  if(PROY && PROYECTOS.length && !PROYECTOS.includes(PROY)) PROY = '';
  pintarProyectos(); pintarArbol(); pintarFiltros(); pintarTabla();
  const inv = document.getElementById('verInventario');
  if(inv){
    inv.hidden = !PROY;
    if(PROY){ inv.href = '/intranet/proyectos/?proyecto=' + encodeURIComponent(PROY);
              inv.title = 'Unidades y precios de ' + PROY; }
  }
}

function pintarProyectos(){
  $('#fProyecto').innerHTML = `<option value="">${t('todosProyectos')}</option>` +
    PROYECTOS.map(p => `<option value="${esc(p)}" ${p===PROY?'selected':''}>${esc(p)}</option>`).join('');
}
function pintarFiltros(){
  const base = DOCS.filter(d => (!PROY || d.proyecto === PROY) && dentroDe(d, CARPETA));
  const n = c => base.filter(d => !c || d.categoria === c).length;
  $('#filtros').innerHTML =
    `<span class="sui-eje">${t('ejeTipo')}</span>` +
    `<button class="sui-chip ${CAT===''?'on':''}" data-c="">${t('todas')}<span class="n">${n('')}</span></button>` +
    CATEGORIAS.map(([v,l]) => `<button class="sui-chip ${CAT===v?'on':''} ${n(v)?'':'vacio'}" data-c="${v}">${l}<span class="n">${n(v)}</span></button>`).join('');
}

function pintarTabla(){
  const cuerpo = $('#filas');
  if(CARGANDO){
    // Esqueleto y no un "Cargando…": mantiene el alto y evita el salto cuando
    // llegan las filas.
    cuerpo.innerHTML = Array.from({length:5}, () => '<tr class="sui-esqueleto">' + '<td><i></i></td>'.repeat(5) + '</tr>').join('');
    return;
  }
  if(FALLO){ cuerpo.innerHTML = `<tr><td colspan="5" class="sui-error">${t('errorLeer')}${esc(FALLO)}</td></tr>`; return; }
  const vis = visibles();
  if(!vis.length){
    const filtrando = PROY || CARPETA || CAT || Q.trim();
    cuerpo.innerHTML = `<tr><td colspan="5"><div class="sui-nada">
      <b>${filtrando ? t('nadaAqui') : t('nadaTodavia')}</b>
      ${filtrando ? t('pruebaFiltro') : t('anadePrimero')}
    </div></td></tr>`;
    return;
  }
  cuerpo.innerHTML = vis.map(d => {
    const cat = (CATEGORIAS.find(c => c[0] === d.categoria) || ['otros', t('catOtros')])[1];
    return `<tr data-id="${d.id}" class="${SEL===d.id?'sel':''}">
      <td class="clave">${esc(d.titulo)}</td>
      <td>${d.carpeta ? esc(d.carpeta) : '<span class="flojo">' + t('raiz') + '</span>'}</td>
      <td><span class="sui-tag c-${esc(d.categoria)}">${esc(cat)}</span></td>
      <td>${d.categoria==='faq' ? (d.descripcion ? '<span class="flojo">' + t('respondida') + '</span>' : '<span class="conf">' + t('sinResponder') + '</span>')
        : (d.url ? t('driveExterno') : '<span class="flojo">' + t('archivo') + mb(d.bytes) + '</span>')}</td>
      <td>${esc(fecha(d.creado_en))}${d.confidencial ? ' <span class="conf">' + t('confAbrev') + '</span>' : ''}${
        d.visible_portal ? ' <span class="sui-tag ok">' + t('portal') + '</span>' : ''}</td>
    </tr>`;
  }).join('');
}

      <dl class="sui-dl"><dt>${t('anadida')}</dt><dd>${esc(fecha(d.creado_en))}${d.creado_por ? t('por') + esc(d.creado_por) : ''}</dd></dl>`,

/* ---------- cajón: ficha del documento ---------- */
function abrirDoc(id){
  const d = DOCS.find(x => x.id === id); if(!d) return;
  if(d.categoria === 'faq'){ abrirFaq(d); return; }
  SEL = id; pintarTabla();

  suiAbrirCajon({
    titulo: esc(d.titulo),

    cuerpo: `
      <dl class="sui-dl">
        <dt>${t('dtDonde')}</dt><dd>${enlace ? t('driveOEnlace') : t('archivoAlmacen')}</dd>
        ${enlace ? '' : `<dt>${t('dtTamano')}</dt><dd>${mb(d.bytes)}</dd>`}
        <dt>${t('dtAnadido')}</dt><dd>${esc(fecha(d.creado_en))}${d.creado_por ? t('por') + esc(d.creado_por) : ''}</dd>
        <dt>${t('dtAcceso')}</dt><dd>${d.confidencial ? '<span class="conf">' + t('confidencialTexto') + '</span>' : t('compartibleCliente')}</dd>
        <dt>${t('dtPortal')}</dt><dd>${d.visible_portal
          ? '<span class="sui-tag ok">' + t('loVenCompradores') + esc(d.proyecto) + '</span>'
          : t('noSalePortal')}</dd>
      </dl>
      ${d.descripcion ? `<p class="sui-nota">${esc(d.descripcion)}</p>` : ''}
      <p class="sui-nota">${enlace ? t('viveFuera') : t('archivoViejo')}</p>
      ${esSuperAdmin(ROL) ? '' : '<p class="sui-nota">' + t('soloSuperAdmin') + '</p>'}
      ${previsualizacion(d)}`,
    pie: `<button class="sui-btn primario" id="btnAbrir">${t('abrir')}${enlace ? t('enDrive') : ''}</button>
          <button class="sui-btn" id="btnEditar">${t('editar')}</button>
          ${esSuperAdmin(ROL) ? '<button class="sui-btn peligro" id="btnBorrar">' + t('quitar') + '</button>' : ''}`,
    onCerrar: () => { SEL = null; pintarTabla(); },
  });
  $('#btnAbrir').onclick = () => enlace ? window.open(d.url, '_blank', 'noopener') : abrirArchivo(d);
  $('#btnEditar').onclick = () => formDoc(d);
  const bb = $('#btnBorrar'); if(bb) bb.onclick = () => borrar(d);
}

/* ---------- vista previa de un documento de Drive ----------
   Drive sirve una vista incrustable cambiando `/view` por `/preview` en la URL
   del archivo. Solo funciona con enlaces de archivo (`/file/d/<id>/`): una
   carpeta o un Doc/Sheet tienen otra forma y ahí no se fuerza nada — se enseña
   el botón de abrir y ya.
   ⚠️ Lo que se ve DEPENDE DE DRIVE: si el archivo no está compartido con quien
   mira, el marco sale pidiendo permiso. Es correcto que sea así —el permiso lo
   pone Drive, no esta herramienta— pero conviene saberlo antes de pensar que la
   vista previa está rota. */
function idDeDrive(url){
  const m = String(url || '').match(/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]+)/);
  return m ? m[1] : null;
}
function previsualizacion(d){
  const id = d.url ? idDeDrive(d.url) : null;
  if(!id) return '';
  return `<div class="sui-bloque" style="padding:0;overflow:hidden">
      <iframe class="dprev" src="https://drive.google.com/file/d/${esc(id)}/preview"
        loading="lazy" referrerpolicy="no-referrer" title="${t('previewTitulo')}"></iframe>
    </div>
    <p class="sui-nota">${t('previewNota')}</p>`;
}

/* ---------- crear o editar ----------
   El mismo formulario para las dos cosas: un alta es una edición de algo que
   todavía no existe. Con dos formularios distintos, un campo nuevo se añade en
   uno y se olvida en el otro. */
function formDoc(d){
  const editando = !!d;
  if(!editando){ SEL = null; pintarTabla(); }
  const conocidas = [...new Set(DOCS.map(x => x.carpeta).filter(Boolean))].sort();
  const v = d || {};
  suiAbrirCajon({
    titulo: editando ? t('editarDocumento') : t('anadirEnlace'),
    sub: editando ? esc(v.titulo) : t('subDocumento'),
    cuerpo: `
      <div class="campo"><label for="sProyecto">${t('lblProyecto')}</label>
        <select class="sui-sel" id="sProyecto">${PROYECTOS.map(p => `<option ${p===(v.proyecto||PROY)?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
      <div class="campo"><label for="sCarpeta">${t('lblCarpeta')}</label>
        <input id="sCarpeta" list="conocidas" value="${esc(v.carpeta != null ? v.carpeta : CARPETA)}" placeholder="${t('phCarpeta')}">
        <datalist id="conocidas">${conocidas.map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
      <p class="sui-nota" style="margin-top:-6px">${t('notaCarpeta')}</p>
      <div class="campo"><label for="sTitulo">${t('lblTitulo')}</label><input id="sTitulo" value="${esc(v.titulo||'')}" placeholder="${t('phTitulo')}"></div>
      <div class="campo"><label for="sCategoria">${t('lblCategoria')}</label>
        <select class="sui-sel" id="sCategoria">${CATEGORIAS.map(([x,l]) => `<option value="${x}" ${v.categoria===x?'selected':''}>${l}</option>`).join('')}</select></div>
      ${v.path
        ? `<p class="sui-nota">${t('archivoSubido')}</p>`
        : `<div class="campo"><label for="sUrl">${t('lblEnlace')}</label><input id="sUrl" value="${esc(v.url||'')}" placeholder="https://drive.google.com/…" inputmode="url"></div>`}
      <div class="campo"><label for="sDesc">${t('lblDescripcion')}</label><textarea id="sDesc">${esc(v.descripcion||'')}</textarea></div>
      <label class="ck"><input type="checkbox" id="sConf" ${v.confidencial === false ? '' : 'checked'}> ${t('ckConfidencial')}</label>
      <label class="ck"><input type="checkbox" id="sPortal" ${v.visible_portal ? 'checked' : ''}> ${t('ckPortal')}</label>
      <p class="sui-nota">${t('notaPortal')}</p>
      <p class="sui-nota">${t('notaDrivePermiso')}</p>`,
    pie: `<button class="sui-btn primario" id="btnGuardar">${editando ? t('guardarCambios') : t('guardarEnlace')}</button>
          <button class="sui-btn" id="btnCancelar">${t('cancelar')}</button>`,
    onCerrar: () => { if(!editando){ SEL = null; pintarTabla(); } },
  });
  $('#btnGuardar').onclick = () => guardarDoc(d);
  $('#btnCancelar').onclick = () => editando ? abrirDoc(d.id) : suiCerrarCajon();
}

async function guardarDoc(d){
  const editando = !!d;
  const titulo = $('#sTitulo').value.trim();
  const campoUrl = $('#sUrl');
  const url = campoUrl ? campoUrl.value.trim() : null;
  if(!titulo){ toast(t('ponTitulo')); $('#sTitulo').focus(); return; }
  // Solo http(s): un `javascript:` guardado aquí sería un clic ejecutable para
  // el siguiente que abra la ficha.
  if(campoUrl && !/^https?:\/\//i.test(url)){
    toast(t('enlaceHttp')); campoUrl.focus(); return;
  }
  const b = $('#btnGuardar'); b.disabled = true;
  try{
    const fila = {
      proyecto: $('#sProyecto').value, carpeta: $('#sCarpeta').value.trim(),
      categoria: $('#sCategoria').value, titulo,
      descripcion: $('#sDesc').value.trim() || null, confidencial: $('#sConf').checked,
      visible_portal: $('#sPortal').checked,
    };
    if(campoUrl) fila.url = url;   // un archivo subido conserva su `path` intacto
    const q = editando
      ? SB.from('documentos_proyecto').update(fila).eq('id', d.id).select('id')
      : SB.from('documentos_proyecto').insert(fila).select('id');
    const { data, error } = await q;
    if(error) throw error;
    // La RLS no da error al denegar: devuelve CERO filas.
    if(!data || !data.length) throw new Error(t('sinPermisoAccion') + (editando ? t('editarV') : t('anadirV')) + t('documentacionN'));
    // 🔴 Bug (7-ago-2026): esto forzaba el filtro global de proyecto al del
    // documento recién guardado. Si se guardaba estando en «Todos los
    // proyectos», el árbol se reducía de golpe a esa única promoción y el
    // resto de carpetas desaparecían — no era un `hidden` residual, era este
    // filtro pisando la vista sin que el usuario lo pidiera. `cargar()` ya
    // refresca DOCS; el filtro que había antes de abrir el formulario se
    // respeta tal cual.
    await cargar();
    if(editando){ SEL = d.id; abrirDoc(d.id); } else { suiCerrarCajon(); }
    toast(editando ? t('guardado') : t('enlaceGuardado'));
  }catch(e){ toast(t('noSePudoGuardar') + (e.message || e)); }
  b.disabled = false;
}

/* ---------- crear o editar una pregunta frecuente ----------
   12-ago-2026, petición del owner: "entrenar a los comerciales" con las
   preguntas que repiten los clientes, para no responder lo mismo cada vez.
   Formulario aparte de formDoc() a propósito — una FAQ no tiene enlace ni
   archivo, y meterla en el formulario de documentos habría sido un enlace
   obligatorio sin sentido (guardarDoc() exige URL) más un puñado de
   condicionales sobre "Dónde"/"Portal" que no le pintan nada a una pregunta.
   Misma tabla (documentos_proyecto, categoria='faq') y misma carpeta fija
   (CARPETA_FAQ): así aparece sola como su propia sección en el árbol de cada
   proyecto, reusando lo que ya existe en vez de construir una vista nueva. */
function formFaq(d){
  const editando = !!d;
  if(!editando){ SEL = null; pintarTabla(); }
  const v = d || {};
  suiAbrirCajon({
    titulo: editando ? t('editarFaq') : t('nuevaFaq'),
    sub: editando ? esc(v.titulo) : t('subFaq'),
    cuerpo: `
      <div class="campo"><label for="fProyectoFaq">${t('lblProyecto')}</label>
        <select class="sui-sel" id="fProyectoFaq">${PROYECTOS.map(p => `<option ${p===(v.proyecto||PROY)?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
      <div class="campo"><label for="fPregunta">${t('lblPregunta')}</label>
        <textarea id="fPregunta" rows="2" placeholder="${t('phPregunta')}">${esc(v.titulo||'')}</textarea></div>
      <div class="campo"><label for="fRespuesta">${t('lblRespuesta')}</label>
        <textarea id="fRespuesta" rows="5" placeholder="${t('phRespuesta')}">${esc(v.descripcion||'')}</textarea></div>`,
    pie: `<button class="sui-btn primario" id="btnGuardarFaq">${editando ? t('guardarCambios') : t('guardarPregunta')}</button>
          <button class="sui-btn" id="btnCancelarFaq">${t('cancelar')}</button>`,
    onCerrar: () => { if(!editando){ SEL = null; pintarTabla(); } },
  });
  $('#btnGuardarFaq').onclick = () => guardarFaq(d);
  $('#btnCancelarFaq').onclick = () => editando ? abrirFaq(d) : suiCerrarCajon();
}

async function guardarFaq(d){
  const editando = !!d;
  const pregunta = $('#fPregunta').value.trim();
  if(!pregunta){ toast(t('escribePregunta')); $('#fPregunta').focus(); return; }
  const b = $('#btnGuardarFaq'); b.disabled = true;
  try{
    const fila = {
      proyecto: $('#fProyectoFaq').value, carpeta: CARPETA_FAQ, categoria: 'faq',
      titulo: pregunta, descripcion: $('#fRespuesta').value.trim() || null,
      // Material interno para entrenar al equipo, nunca cara al cliente.
      confidencial: true, visible_portal: false,
    };
    const q = editando
      ? SB.from('documentos_proyecto').update(fila).eq('id', d.id).select('id')
      : SB.from('documentos_proyecto').insert(fila).select('id');
    const { data, error } = await q;
    if(error) throw error;
    if(!data || !data.length) throw new Error(t('sinPermisoFaq') + (editando ? t('editarV') : t('anadirV')) + t('preguntasFrecuentesN'));
    await cargar();
    if(editando){ SEL = d.id; abrirFaq({ ...d, ...fila }); } else { suiCerrarCajon(); }
    toast(editando ? t('guardado') : t('preguntaGuardada'));
  }catch(e){ toast(t('noSePudoGuardar') + (e.message || e)); }
  b.disabled = false;
}

/* Los archivos que ya estaban subidos se siguen abriendo. */
async function abrirArchivo(d){
  try{
    let u = FIRMADAS.get(d.path);
    if(!u || u.expira < Date.now()){
      const { data, error } = await SB.storage.from(BUCKET).createSignedUrl(d.path, 900);
      if(error) throw error;
      u = { href: data.signedUrl, expira: Date.now() + 840000 };   // se renueva un minuto antes
      FIRMADAS.set(d.path, u);
    }
    window.open(u.href, '_blank', 'noopener');
  }catch(e){ toast(t('noSePudoAbrir') + (e.message || e)); }
}

async function borrar(d){
  const aviso = d.url
    ? t('quitarIndicePre') + d.titulo + t('quitarIndice')
    : t('borrarPre') + d.titulo + t('borrarPost');
  if(!confirm(aviso)) return;
  try{
    // Primero el archivo y después la fila: al revés, un fallo al borrar el
    // objeto dejaría un fichero huérfano ocupando sitio y sin nadie que lo liste.
    if(d.path){
      const { error } = await SB.storage.from(BUCKET).remove([d.path]);
      if(error) throw error;
    }
    const { data, error } = await SB.from('documentos_proyecto').delete().eq('id', d.id).select('id');
    if(error) throw error;
    // La RLS no da error al denegar: devuelve CERO filas. Sin este control la
    // herramienta diría "quitado" y el documento seguiría ahí.
    if(!data || !data.length) throw new Error(t('sinPermisoQuitar'));
    if(d.path) FIRMADAS.delete(d.path);
    suiCerrarCajon();
    await cargar();
    toast(t('quitado'));
  }catch(e){ toast(t('noSePudoQuitar') + (e.message || e)); }
}

/* ---------- medidor de almacenamiento ----------
   Se queda aunque ya no se suba nada: los contratos firmados siguen llenándolo,
   y esta es la pantalla donde tiene sentido ver POR QUÉ los documentos van a
   Drive y no aquí. */
async function medidor(){
  const { data } = await SB.rpc('uso_almacenamiento');
  if(!data) return;
  const f = data.ficheros, b = data.base, margen = data.dias_de_margen;
  const clase = p => p >= 90 ? 'mal' : p >= 70 ? 'aviso' : '';
  $('#uso').hidden = false;
  $('#uso').innerHTML = `
    <h3>${t('almacenamientoTitulo')}</h3>
    <div class="n"><span>${t('archivos')}</span><span><b>${mb(f.bytes)}</b> de ${mb(f.limite)} · ${f.pct}%</span></div>
    <div class="barra ${clase(f.pct)}"><i style="width:${Math.min(100, f.pct)}%"></i></div>
    <div class="n" style="margin-top:8px"><span>${t('baseDeDatos')}</span><span><b>${mb(b.bytes)}</b> de ${mb(b.limite)} · ${b.pct}%</span></div>
    <div class="barra ${clase(b.pct)}"><i style="width:${Math.min(100, b.pct)}%"></i></div>
    <p class="sui-nota">${margen == null ? t('sinRitmo')
      : t('alRitmoActual') + data.ritmo_mb_dia + t('mbDia') + '<b>' + margen + t('diasRestantes')}
      ${t('porEsoDrive')}</p>`;
}

/* ---------- idioma: aplica el diccionario a la HTML estática ----------
   La HTML de arriba (botones de la barra, cabeceras de tabla, buscador) ya
   está en el DOM cuando este script arranca — se marca con data-t/data-t-ph
   en vez de generarla por JS, y aquí se sobreescribe UNA vez, antes de la
   primera carga de datos. guard.js mantiene <html> oculto hasta que la
   sesión se confirma (varios cientos de ms de red), tiempo de sobra para que
   este pase — sin destello de español antes de saltar a inglés. */
function aplicarIdiomaEstatico(){
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-t-ph]').forEach(el => { el.placeholder = t(el.dataset.tPh); });
}
aplicarIdiomaEstatico();

/* ---------- eventos ---------- */
$('#q').addEventListener('input', e => { Q = e.target.value; pintarTabla(); });
$('#fProyecto').addEventListener('change', e => { PROY = e.target.value; CARPETA = ''; pintar(); });
$('#arbol').addEventListener('click', e => {
  const b = e.target.closest('[data-carp]'); if(!b) return;
  CARPETA = b.dataset.carp; pintar();
});
$('#filtros').addEventListener('click', e => {
  const b = e.target.closest('[data-c]'); if(!b) return;
  CAT = b.dataset.c; pintarFiltros(); pintarTabla();
});
$('#filas').addEventListener('click', e => {
  const tr = e.target.closest('[data-id]'); if(!tr) return;
  abrirDoc(tr.dataset.id);
});
$('#btnNuevo').addEventListener('click', () => formDoc(null));
$('#btnNuevaFaq').addEventListener('click', () => formFaq(null));

suiMontarCajon();
suiOrdenable($('#tabla'), ORDEN, (d, c) => d[c], pintarTabla);

/* guard.js ya comprobó la sesión y leyó la ficha: se reusa su cliente y su rol
   en vez de abrir un segundo y volver a preguntar. */
window.LW_AUTH.then(async ({ sb, session, ficha }) => {
  SB = sb || window.supabase.createClient(SB_URL, SB_KEY);
  ROL = ficha ? ficha.rol : null;
  await cargar();
  medidor();
});
</script>
